name: BR_OWNER_V1 Reference Segment Survey (ASR only)

# One ASR-only segmentation of the owner's long (>30 s) unique reference clips
# into 6-25 s segments at verified silences (owner decision 19/10 07:33 BRT).
# Runs ONLY when a pushed commit changes and contains the request file below.
# No synthesis, no Telegram send (getFile only), no audio in artifacts.
on:
  pull_request:
    paths:
      - .github/workflows/owner-voice-reference-segment-survey.yml
      - scripts/owner_voice_reference_segment_survey.py
      - app/services/owner_voice_reference_segment_service.py
      - tests/test_owner_voice_reference_segment_survey.py
  push:
    branches:
      - work/br-owner-voice-mission-state-failclosed-v1
    paths:
      - .run/br-owner-v1-reference-segment-survey.request.json
      - .github/workflows/owner-voice-reference-segment-survey.yml

concurrency:
  group: br-owner-v1-reference-segment-survey
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: Segment survey contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      requested: ${{ steps.request.outputs.requested }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Contract tests
        run: |
          python -m pip install --disable-pip-version-check -q pytest packaging "python-dotenv==1.2.3" "numpy==2.3.3"
          python -m pytest -q tests/test_owner_voice_reference_segment_survey.py
      - name: Detect explicit survey request
        id: request
        run: |
          set -euo pipefail
          REQUEST_PATH=".run/br-owner-v1-reference-segment-survey.request.json"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git rev-parse --verify 'HEAD^' >/dev/null \
             && git diff --name-only HEAD^ HEAD -- "$REQUEST_PATH" | grep -Fxq "$REQUEST_PATH" \
             && [ -f "$REQUEST_PATH" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path(".run/br-owner-v1-reference-segment-survey.request.json").read_text())
          assert d["schema_version"]=="OwnerVoiceReferenceSegmentSurveyRequest/v1"
          assert d["voice_identity_id"]=="BR_OWNER_V1"
          assert d["asr_only"] is True and d["synthesis"] is False and d["telegram_send"] is False
          assert d["telegram_methods"]==["getFile"] and d["one_run_only"] is True and d["segment_seconds"]==[6,25]
          PY
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

  survey:
    name: ASR-only segmentation of owner long clips
    needs: contract
    if: ${{ needs.contract.outputs.requested == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64: ${{ secrets.BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64 }}
      BR_OWNER_TELEGRAM_REFERENCE_INDEX: ${{ secrets.BR_OWNER_TELEGRAM_REFERENCE_INDEX }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BR_OWNER_STT_MODEL: large-v3-turbo
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Preflight secret names (values never printed)
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64:-}${BR_OWNER_TELEGRAM_REFERENCE_INDEX:-}"
          echo "SEGMENT_SURVEY_SECRET_PREFLIGHT=PASS"
      - name: Private workspace
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/br-owner-segment-survey/$GITHUB_RUN_ID"
          CACHE="$HOME/.cache/br-owner-voice/hf-public"
          mkdir -p "$WORK" "$CACHE" "$RUNNER_TEMP/segment-survey-report"
          chmod 700 "$WORK"
          {
            echo "BR_OWNER_SEGMENT_SURVEY_WORKSPACE=$WORK"
            echo "BR_OWNER_PUBLIC_MODEL_CACHE=$CACHE"
            echo "HF_HOME=$CACHE/huggingface"
            echo "BR_OWNER_SEGMENT_SURVEY_REPORT=$RUNNER_TEMP/segment-survey-report/owner-reference-segment-survey.json"
          } >> "$GITHUB_ENV"
      - name: Install CPU ASR + speaker-embedding runtime (open source)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m venv /tmp/br-asr-venv
          PY=/tmp/br-asr-venv/bin/python
          "$PY" -m pip install --disable-pip-version-check --progress-bar off \
            --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          "$PY" -m pip install --disable-pip-version-check --prefer-binary --progress-bar off \
            "faster-whisper==1.2.0" "av==18.0.0" "speechbrain==1.1.1" "soundfile==0.14.0" \
            requests huggingface_hub numpy python-dotenv
          "$PY" -m pip check
      - name: Run ASR-only segment survey
        env:
          PYTHONPATH: ${{ github.workspace }}
          PYTHONUNBUFFERED: "1"
        run: /tmp/br-asr-venv/bin/python scripts/owner_voice_reference_segment_survey.py
      - name: Upload public report (JSON only, no audio)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owner-reference-segment-survey-${{ github.run_id }}
          path: ${{ env.BR_OWNER_SEGMENT_SURVEY_REPORT }}
          if-no-files-found: error
          retention-days: 7
      - name: Destroy private workspace
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/br-owner-segment-survey"
