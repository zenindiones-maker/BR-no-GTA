name: BR V24 Complete Executor Binding Integrity

on:
  push:
    branches:
      - work/br-slm-agent-reconstruction-v24
    paths:
      - ".github/workflows/br-v24-complete-executor-binding-integrity.yml"
      - "scripts/br_v24_executor_binding_audit.py"
      - "tests/test_br_v24_executor_binding_audit_stdlib.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v24-binding-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  all-declared-br-executor-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact first-party tree with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Assert branch and test fail-closed behavior
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/br-slm-agent-reconstruction-v24"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest discover -s tests -p 'test_br_v24_executor_binding_audit_stdlib.py' -v
      - name: Inspect actual 147 BR executor bindings without importing
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check python-dotenv==1.2.3
          python scripts/br_v24_executor_binding_audit.py
      - name: Preserve machine-readable exact-SHA 147-binding findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-v24-executor-binding-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/br-v24-executor-integrity-*.json
          if-no-files-found: warn
          retention-days: 14
