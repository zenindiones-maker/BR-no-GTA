name: Telegram OpenCode CLI Recovery Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode-cli-candidate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'run OpenCode CLI recovery candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve and install candidate CLI version
        run: |
          set -euo pipefail
          mkdir -p runtime/opencode-cli-candidate
          VERSION="$(npm view @opencode/cli version)"
          test -n "$VERSION"
          printf '%s\n' "$VERSION" > runtime/opencode-cli-candidate/version.txt
          npm install -g "@opencode/cli@${VERSION}"
          opencode --version | tee runtime/opencode-cli-candidate/reported-version.txt

      - name: Observe available OpenCode models without treating discovery as authorization
        run: |
          set -euo pipefail
          opencode models > runtime/opencode-cli-candidate/models.txt || true
          wc -l runtime/opencode-cli-candidate/models.txt

      - name: Execute explicit in-OpenCode candidate
        run: |
          set -euo pipefail
          MODEL="opencode/big-pickle"
          START="$(python - <<'PY'
          import time
          print(time.time())
          PY
          )"
          set +e
          timeout 300 opencode run --standalone --model "$MODEL" --format json             "Return only: BR_NO_GTA_OPENCODE_CLI_OK"             > runtime/opencode-cli-candidate/stdout.ndjson             2> runtime/opencode-cli-candidate/stderr.txt
          RC=$?
          set -e
          END="$(python - <<'PY'
          import time
          print(time.time())
          PY
          )"
          python - "$MODEL" "$RC" "$START" "$END" <<'PY'
          import hashlib,json,pathlib,re,sys
          model,rc,start,end=sys.argv[1],int(sys.argv[2]),float(sys.argv[3]),float(sys.argv[4])
          stdout=pathlib.Path("runtime/opencode-cli-candidate/stdout.ndjson").read_text(errors="replace")
          stderr=pathlib.Path("runtime/opencode-cli-candidate/stderr.txt").read_text(errors="replace")
          usable="BR_NO_GTA_OPENCODE_CLI_OK" in stdout
          safe_lines=[]
          for line in stderr.splitlines():
              low=line.lower()
              if any(term in low for term in ("authorization:", "bearer ", "api_key", "apikey", "token=")):
                  continue
              if re.search(r"(sk-|ghp_|github_pat_)[A-Za-z0-9_-]{8,}",line):
                  continue
              safe_lines.append(line[:500])
          evidence={
              "observed":True,
              "candidate_type":"PROVIDER_EXECUTOR_CHANGE",
              "capability":"ai.reasoning.text",
              "task_class":"telegram-reasoning",
              "provider":"opencode",
              "model":model,
              "executor_binding_candidate":"opencode CLI standalone",
              "inside_opencode":True,
              "exit_code":rc,
              "usable_text":usable,
              "outcome":"COMPLETED" if rc==0 and usable else "FAILED",
              "latency_seconds":max(0.0,end-start),
              "fallback_occurred":False,
              "retry_count":0,
              "zero_cost_candidate":True,
              "stdout_sha256":hashlib.sha256(stdout.encode()).hexdigest(),
              "stderr_sha256":hashlib.sha256(stderr.encode()).hexdigest(),
              "safe_stderr":safe_lines[-20:],
              "promotion_performed":False,
          }
          pathlib.Path("runtime/opencode-cli-candidate/evidence.json").write_text(
              json.dumps(evidence,indent=2,sort_keys=True)
          )
          print(json.dumps(evidence,sort_keys=True))
          PY

      - name: Validate observed candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/opencode-cli-candidate/evidence.json").read_text())
          assert d["observed"] is True
          assert d["inside_opencode"] is True
          assert d["fallback_occurred"] is False
          assert d["promotion_performed"] is False
          print("OPENCODE_CLI_CANDIDATE_OBSERVED=PASS")
          print("CANDIDATE_OUTCOME="+d["outcome"])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-opencode-cli-recovery-candidate
          path: runtime/opencode-cli-candidate/
          if-no-files-found: warn
          retention-days: 14
