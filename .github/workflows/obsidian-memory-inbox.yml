name: Obsidian Memory Inbox
run-name: Obsidian Inbox ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Unique bounded Inbox dispatch identity
        required: true
        type: string
      note_b64:
        description: Bounded UTF-8 Markdown note encoded as base64
        required: true
        type: string
      source_ref:
        description: Vault-relative Inbox source reference
        required: true
        type: string
      goal_id:
        description: Canonical Harness goal
        required: true
        type: string
      task_id:
        description: Human-review task context
        required: false
        default: human-review
        type: string
      artifact_ref:
        description: Optional canonical artifact reference
        required: false
        type: string
      target_ref:
        description: Repository ref containing the real ingestion implementation
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: obsidian-inbox-${{ inputs.dispatch_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Resolve bounded target ref
        id: target
        env:
          INPUT_TARGET_REF: ${{ inputs.target_ref }}
          DISPATCH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="${INPUT_TARGET_REF:-$DISPATCH_REF}"
          python - "$ref" <<'PY'
          import re, sys
          ref=sys.argv[1].strip()
          if not ref or len(ref) > 180:
              raise SystemExit("OBSIDIAN_INBOX_DISPATCH=FAIL invalid target_ref")
          if ref.startswith("-") or ".." in ref or "@{" in ref or ref.endswith(".lock"):
              raise SystemExit("OBSIDIAN_INBOX_DISPATCH=FAIL unsafe target_ref")
          if not re.fullmatch(r"[A-Za-z0-9._/-]+", ref):
              raise SystemExit("OBSIDIAN_INBOX_DISPATCH=FAIL unsafe target_ref")
          print(ref)
          PY
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "TARGET_REF=$ref" >> "$GITHUB_ENV"

      - name: Checkout exact target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Prove target checkout identity
        id: checkout
        working-directory: target
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "TARGET_SHA=$sha" >> "$GITHUB_ENV"
          echo "TARGET_REF_PRESERVED=PASS"
          echo "TARGET_REF=$TARGET_REF"
          echo "TARGET_SHA=$sha"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: target/requirements.txt

      - name: Install target runtime
        working-directory: target
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Decode bounded note outside Git history
        working-directory: target
        env:
          NOTE_B64: ${{ inputs.note_b64 }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/obsidian-inbox/input artifacts/obsidian-inbox/result
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw=base64.b64decode(os.environ["NOTE_B64"], validate=True)
          if not raw or len(raw) > 64 * 1024:
              raise SystemExit("OBSIDIAN_INBOX_DISPATCH=FAIL note outside bounded size")
          text=raw.decode("utf-8")
          if not text.lstrip().startswith("---"):
              raise SystemExit("OBSIDIAN_INBOX_DISPATCH=FAIL frontmatter missing")
          Path("artifacts/obsidian-inbox/input/note.md").write_bytes(raw)
          print("OBSIDIAN_INBOX_BOUNDED_DECODE=PASS")
          print("TERMUX_HEAVY_PROCESSING=NO")
          PY

      - name: Execute target-ref Harness ingestion
        working-directory: target
        env:
          PYTHONPATH: .
          ZERO_COST_OPERATION: "TRUE"
          BR_TEST_DATABASE: ${{ github.workspace }}/target/artifacts/obsidian-inbox/control.db
          OBSIDIAN_TARGET_REF: ${{ steps.target.outputs.ref }}
          OBSIDIAN_TARGET_SHA: ${{ steps.checkout.outputs.sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          GOAL_ID: ${{ inputs.goal_id }}
          TASK_ID: ${{ inputs.task_id }}
          ARTIFACT_REF: ${{ inputs.artifact_ref }}
        run: |
          set -euo pipefail
          python scripts/obsidian_inbox_cloud_ingest.py             --note-file artifacts/obsidian-inbox/input/note.md             --source-ref "$SOURCE_REF"             --goal-id "$GOAL_ID"             --task-id "$TASK_ID"             --artifact-ref "$ARTIFACT_REF"             --output-dir artifacts/obsidian-inbox/result

      - name: Prove canonical envelope materialization in isolated runner DB
        working-directory: target
        env:
          PYTHONPATH: .
          ZERO_COST_OPERATION: "TRUE"
          BR_TEST_DATABASE: ${{ github.workspace }}/target/artifacts/obsidian-inbox/materialization-proof.db
        run: |
          set -euo pipefail
          python scripts/obsidian_apply_memory_envelope.py             artifacts/obsidian-inbox/result/canonical-memory-envelope.json             --receipt artifacts/obsidian-inbox/result/materialization-receipt.json

      - name: Validate transport gates
        working-directory: target
        env:
          EXPECTED_TARGET_REF: ${{ steps.target.outputs.ref }}
          EXPECTED_TARGET_SHA: ${{ steps.checkout.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads(Path("artifacts/obsidian-inbox/result/obsidian-inbox-result.json").read_text())
          envelope=json.loads(Path("artifacts/obsidian-inbox/result/canonical-memory-envelope.json").read_text())
          receipt=json.loads(Path("artifacts/obsidian-inbox/result/materialization-receipt.json").read_text())
          assert envelope["target_ref"] == os.environ["EXPECTED_TARGET_REF"], envelope.get("target_ref")
          assert envelope["target_sha"] == os.environ["EXPECTED_TARGET_SHA"], envelope.get("target_sha")
          assert result["OBSIDIAN_NOTE_INGESTED"] == "PASS"
          assert result["MEMORY_CANDIDATE_CREATED"] == "PASS"
          assert result["CANONICAL_AUTO_PROMOTION"] == "NO"
          assert result["HARNESS_EVALUATION_REQUIRED"] == "PASS"
          assert result["HARNESS_EVALUATION_DECISION"] == "HUMAN_REVIEW"
          assert envelope["memory_candidate"]["status"] == "CANDIDATE"
          assert envelope["memory_evaluation"]["decision"] == "HUMAN_REVIEW"
          assert envelope["authority"] == "DEEPSEEK_HARNESS"
          assert envelope["canonical_target"] == "BR SQLite Learning Plane"
          assert receipt["status"] == "APPLIED"
          assert receipt["authority"] == "DEEPSEEK_HARNESS"
          assert receipt["memory_status"] == "CANDIDATE"
          assert receipt["evaluation_decision"] == "HUMAN_REVIEW"
          assert receipt["CANONICAL_AUTO_PROMOTION"] == "NO"
          assert receipt["TERMUX_HEAVY_PROCESSING"] == "NO"
          assert receipt["OBSIDIAN_CANONICAL_MEMORY"] == "NO"
          assert envelope["NEW_VOICE_SYNTHESIS"] == "NO"
          assert envelope["FULL_RENDER"] == "NO"
          assert envelope["YOUTUBE_UPLOAD"] == "NO"
          assert envelope["YOUTUBE_PUBLICATION"] == "NO"
          print("OBSIDIAN_INBOX_DISPATCH=PASS")
          print("TARGET_REF_PRESERVED=PASS")
          print("OBSIDIAN_NOTE_INGESTED=PASS")
          print("MEMORY_CANDIDATE_CREATED=PASS")
          print("CANONICAL_AUTO_PROMOTION=NO")
          print("HARNESS_EVALUATION_REQUIRED=PASS")
          print("HARNESS_EVALUATION_DECISION=HUMAN_REVIEW")
          print("OBSIDIAN_MEMORY_ENVELOPE_APPLIED=PASS")
          print("SINGLE_CANONICAL_MEMORY_PLANE=PASS")
          print("HERMES_DIRECT_MEMORY_WRITE=NO")
          print("OBSIDIAN_CANONICAL_MEMORY=NO")
          print("TERMUX_HEAVY_PROCESSING=NO")
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER=NO")
          print("YOUTUBE_UPLOAD=NO")
          print("YOUTUBE_PUBLICATION=NO")
          PY

      - name: Upload bounded canonical envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-inbox-${{ inputs.dispatch_id }}
          path: target/artifacts/obsidian-inbox/result/
          if-no-files-found: error
          retention-days: 30
