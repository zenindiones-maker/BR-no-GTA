name: Obsidian Memory Inbox
run-name: Obsidian Inbox ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Unique lightweight Inbox dispatch identity
        required: true
        type: string
      note_b64:
        description: Bounded UTF-8 Markdown note encoded as base64
        required: true
        type: string
      source_ref:
        description: Vault-relative Inbox source reference
        required: true
        type: string
      goal_id:
        description: Canonical Harness goal
        required: true
        type: string
      task_id:
        description: Human-review task context
        required: false
        default: human-review
        type: string
      artifact_ref:
        description: Optional canonical artifact reference
        required: false
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: obsidian-inbox-${{ inputs.dispatch_id }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/obsidian-inbox/control.db
  NOTE_B64: ${{ inputs.note_b64 }}
  SOURCE_REF: ${{ inputs.source_ref }}
  GOAL_ID: ${{ inputs.goal_id }}
  TASK_ID: ${{ inputs.task_id }}
  ARTIFACT_REF: ${{ inputs.artifact_ref }}

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bounded project runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/obsidian-inbox/input
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Decode bounded Markdown envelope
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw=base64.b64decode(os.environ["NOTE_B64"], validate=True)
          if len(raw) > 64 * 1024:
              raise SystemExit("OBSIDIAN_INBOX=FAIL note exceeds 64 KiB")
          text=raw.decode("utf-8")
          if not text.lstrip().startswith("---"):
              raise SystemExit("OBSIDIAN_INBOX=FAIL frontmatter missing")
          Path("artifacts/obsidian-inbox/input/note.md").write_text(text, encoding="utf-8")
          print("OBSIDIAN_INBOX_BOUNDED_DECODE=PASS")
          print("TERMUX_HEAVY_PROCESSING=NO")
          PY

      - name: Harness ingest observe and evaluate
        run: |
          set -euo pipefail
          python scripts/obsidian_inbox_cloud_ingest.py             --note-file artifacts/obsidian-inbox/input/note.md             --source-ref "$SOURCE_REF"             --goal-id "$GOAL_ID"             --task-id "$TASK_ID"             --artifact-ref "$ARTIFACT_REF"             --output-dir artifacts/obsidian-inbox/result

      - name: Validate no automatic promotion
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("artifacts/obsidian-inbox/result/obsidian-inbox-result.json").read_text())
          envelope=json.loads(Path("artifacts/obsidian-inbox/result/canonical-memory-envelope.json").read_text())
          assert result["OBSIDIAN_NOTE_INGESTED"]=="PASS"
          assert result["MEMORY_CANDIDATE_CREATED"]=="PASS"
          assert result["CANONICAL_AUTO_PROMOTION"]=="NO"
          assert result["HARNESS_EVALUATION_REQUIRED"]=="PASS"
          assert result["HARNESS_EVALUATION_DECISION"]=="HUMAN_REVIEW"
          assert envelope["memory_candidate"]["status"]=="CANDIDATE"
          assert envelope["memory_evaluation"]["decision"]=="HUMAN_REVIEW"
          assert envelope["NEW_VOICE_SYNTHESIS"]=="NO"
          assert envelope["FULL_RENDER"]=="NO"
          assert envelope["YOUTUBE_UPLOAD"]=="NO"
          assert envelope["YOUTUBE_PUBLICATION"]=="NO"
          print("MEMORY_CANDIDATE_GATE=PASS")
          print("LEARNING_PLANE_AUTHORITY_PRESERVED=PASS")
          print("CANONICAL_AUTO_PROMOTION=NO")
          print("HERMES_DIRECT_MEMORY_WRITE=NO")
          print("OBSIDIAN_CANONICAL_MEMORY=NO")
          print("TERMUX_HEAVY_PROCESSING=NO")
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER=NO")
          print("YOUTUBE_UPLOAD=NO")
          print("YOUTUBE_PUBLICATION=NO")
          PY

      - name: Upload canonical memory envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-inbox-${{ inputs.dispatch_id }}
          path: artifacts/obsidian-inbox/result/
          if-no-files-found: error
          retention-days: 30

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "obsidian-memory-inbox",
              "description": "Obsidian note -> Harness MemoryCandidate gate",
              "target_url": (
                  "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d @/tmp/status.json
