name: Harness Intelligence Validation

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/services/semantic_mission_planner_service.py"
      - "app/services/harness_adaptive_planning_service.py"
      - "app/services/harness_collaboration_service.py"
      - "tests/test_harness_adaptive_intelligence.py"
      - "tests/test_harness_mission_planner.py"
      - "tests/test_harness_collaboration_service.py"
      - ".github/workflows/harness-intelligence-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      ZERO_COST_OPERATION: "TRUE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile adaptive planner
        run: |
          set -euo pipefail
          python -m py_compile             app/services/semantic_mission_planner_service.py             app/services/harness_adaptive_planning_service.py             app/services/harness_collaboration_service.py
          echo "INTELLIGENCE_PLANNER_COMPILE=PASS"
      - name: Focused intelligence tests
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_harness_adaptive_intelligence.py             tests/test_harness_mission_planner.py             tests/test_harness_collaboration_service.py
          echo "INTELLIGENCE_FOCUSED_TESTS=PASS"
      - name: Publish intelligence status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "harness-intelligence-focused",
              "description": "Adaptive semantic planner focused validation",
              "target_url": "https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d @/tmp/status.json
