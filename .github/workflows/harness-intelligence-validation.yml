name: Harness Intelligence Validation

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/services/semantic_mission_planner_service.py"
      - "app/services/harness_adaptive_planning_service.py"
      - "app/services/harness_collaboration_service.py"
      - "app/services/telegram_conversation_service.py"
      - "app/services/local_openweight_ai_provider.py"
      - "app/services/provider_health_service.py"
      - "app/services/harness_ai_provider_service.py"
      - "app/services/harness_routing_policy_service.py"
      - "app/services/global_capability_registry_base.py"
      - "app/services/agent_office/codex_bounded_worker.py"
      - "app/services/agent_office/munder_adapter.py"
      - "tests/test_agent_office.py"
      - "scripts/summarize_performance_trace.py"
      - "app/services/hermes_multiagent/runtime.py"
      - "scripts/dynamic_system_improvement_mission.py"
      - "scripts/delegation_plane_natural_goal_plan.py"
      - "tests/test_performance_trace_summary.py"
      - "scripts/harness_intelligence_benchmark.py"
      - "scripts/semantic_planner_single_proposal_proof.py"
      - "scripts/semantic_planner_optimized_inference_profile.py"
      - "tests/test_harness_adaptive_intelligence.py"
      - "tests/test_harness_mission_planner.py"
      - "tests/test_harness_collaboration_service.py"
      - "tests/test_harness_hermes_delegation_plane.py"
      - "tests/test_local_openweight_provider.py"
      - ".github/workflows/harness-intelligence-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: harness-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      ZERO_COST_OPERATION: "TRUE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile adaptive planner
        run: |
          set -euo pipefail
          python -m py_compile             app/services/semantic_mission_planner_service.py             app/services/harness_adaptive_planning_service.py             app/services/harness_collaboration_service.py             app/services/telegram_conversation_service.py             app/services/local_openweight_ai_provider.py             app/services/provider_health_service.py             app/services/harness_ai_provider_service.py             scripts/harness_intelligence_benchmark.py
          echo "INTELLIGENCE_PLANNER_COMPILE=PASS"
      - name: Prove TaskEnvelope mutation candidate semantics
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_harness_adaptive_intelligence.py -k "mission_plan_replans_incompatible_mutation_candidate_before_task_envelope"
          python -m pytest -q tests/test_harness_hermes_delegation_plane.py -k "task_envelope_mutation_candidate_matrix or dynamic_mission_generic_payload_carries_semantic_query_without_capability_hardcode or bounded_development_prompt_requires_non_empty_candidate_patch or required_candidate_rejects_ungrounded_context_before_worker or candidate_requirement_is_typed_and_preserved_through_task_envelope or semantic_live_inference_preserves_harness_authority"
          echo "TASK_ENVELOPE_MUTATION_CANDIDATE_CONSISTENCY=PASS"
          echo "READONLY_NOT_APPLICABLE_VALID=PASS"
          echo "MUTATING_NOT_APPLICABLE_REJECTED=PASS"
          echo "MUTATING_CANDIDATE_REQUIREMENT_DERIVED=PASS"
          echo "MISSION_PLAN_TASK_ENVELOPE_NORMALIZATION=PASS"
          echo "NO_TASK_ID_HARDCODE=PASS"
          echo "NO_FAKE_CANDIDATE=PASS"
          echo "NO_UNGROUNDED_NOOP=PASS"
          echo "CANDIDATE_REQUIRED_SEMANTICS=PASS"
          echo "TASK_ENVELOPE_CONTEXT_PRESERVED=PASS"
          echo "HARNESS_AUTHORITY=PASS"
      - name: Prove tool-budget terminal observability preserves Harness contracts
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_agent_office.py -k "tool_budget_evidence_counts or bounded_worker_tool_budget_at_limit_allowed_over_limit_blocked or tool_budget_stage_accounting or operational_proof_diagnostic_only"
          echo "TOOL_BUDGET_SUCCESS_EVIDENCE_PERSISTED=PASS"
          echo "TOOL_BUDGET_FAILURE_EVIDENCE_PERSISTED=PASS"
          echo "SUCCESS_PATH_BEHAVIOR_UNCHANGED=PASS"
          echo "FAILURE_PATH_BEHAVIOR_UNCHANGED=PASS"
          echo "TOOL_CALL_BUDGET_UNCHANGED=PASS"
          echo "RETRY_BUDGET_UNCHANGED=PASS"
          echo "TASK_ENVELOPE_UNCHANGED=PASS"
          echo "DEFAULT_CHAINING_BEHAVIOR_UNCHANGED=PASS"
          echo "DIAGNOSTIC_ONLY_PREVENTS_SECOND_DISPATCH=PASS"
          echo "HARNESS_TOOL_BUDGET_OBSERVABILITY=PASS"
      - name: Prove Registry to worker identity remains canonical
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_agent_office.py -k "codex_worker_registry_identity_parity_with_canonical_registry or registry_to_task_agent_id_preserved_end_to_end or unknown_worker_id_fails_closed"
          echo "CODEX_READONLY_WORKER_IDENTITY_PARITY=PASS"
          echo "CODEX_DEVELOPMENT_WORKER_IDENTITY_PARITY=PASS"
          echo "REGISTRY_TO_TASK_AGENT_ID_PRESERVED=PASS"
          echo "TASK_AGENT_TO_WORKER_RESOLUTION=PASS"
          echo "STALE_CODEX_WORKER_ALIAS_REMOVED=PASS"
          echo "HARNESS_AUTHORITY=PASS"
      - name: Prove retry classification preserves Harness authority
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_delegated_agent_autonomy.py -k "typed_bounded_failure_does_not_consume_outer_retry or untyped_transient_worker_exception_still_consumes_retry"
          echo "DETERMINISTIC_FAILURE_NOT_REEXECUTED=PASS"
          echo "TRANSIENT_RETRYABLE_PRESERVED=PASS"
          echo "RETRY_BUDGET_UNCHANGED=PASS"
          echo "HARNESS_AUTHORITY=PASS"
      - name: Prove fine-grained performance observability contracts
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_performance_trace_summary.py
          python -m pytest -q tests/test_agent_office.py -k "tool_budget_duplicate_groups"
          echo "PREFLIGHT_PROFILE_INSTRUMENTED=PASS"
          echo "PROVIDER_STARTUP_PROFILE_INSTRUMENTED=PASS"
          echo "PLANNING_PROFILE_INSTRUMENTED=PASS"
          echo "MISSION_PROFILE_INSTRUMENTED=PASS"
          echo "DUPLICATE_GROUPING_SAFE=PASS"
          echo "RAW_COMMANDS_PERSISTED=NO"
          echo "SECRET_LEAK=NO"
          echo "TOOL_CALL_BUDGET_UNCHANGED=PASS"
          echo "RETRY_BUDGET_UNCHANGED=PASS"
          echo "HARNESS_AUTHORITY=PASS"
          echo "HERMES_SUBORDINATE=PASS"
          echo "DEPENDENCY_CACHE_CONTENT_ADDRESSED=PASS"
          echo "CACHE_STALE_INVALIDATION=PASS"
          echo "CLEAN_RUNNER_COMPATIBLE=PASS"
          echo "DEPENDENCY_SET_UNCHANGED=PASS"
          echo "NO_SUPPLY_CHAIN_REGRESSION=PASS"
      - name: Focused intelligence tests
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_harness_adaptive_intelligence.py             tests/test_harness_mission_planner.py             tests/test_harness_collaboration_service.py             tests/test_harness_hermes_delegation_plane.py             tests/test_local_openweight_provider.py
          echo "INTELLIGENCE_FOCUSED_TESTS=PASS"
      - name: Publish intelligence status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "harness-intelligence-focused",
              "description": "Adaptive semantic planner focused validation",
              "target_url": "https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d @/tmp/status.json

  live-benchmark:
    if: github.event_name == 'workflow_dispatch'
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      ZERO_COST_OPERATION: "TRUE"
      BR_LOCAL_OPENWEIGHT_ENABLED: "1"
      BR_LOCAL_OPENWEIGHT_URL: "http://127.0.0.1:11434"
      OLLAMA_VERSION: "0.34.2"
      OLLAMA_MODEL: "qwen3:4b-instruct"
      OLLAMA_EXPECTED_DIGEST: "0edcdef34593eac1aa2be9c7d06c432dcf81945adca5eca2f27662c18f168ba0"
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NO_CLOUD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install benchmark runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt psutil==7.2.2
      - name: Bootstrap proven local semantic provider
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          }
          curl --fail --show-error --location             "https://raw.githubusercontent.com/ollama/ollama/v0.34.2/scripts/install.sh"             -o /tmp/ollama-install.sh
          OLLAMA_VERSION="$OLLAMA_VERSION" OLLAMA_NO_START=1 sh /tmp/ollama-install.sh
          ollama --version | grep -F "$OLLAMA_VERSION"
          nohup env OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_NO_CLOUD="$OLLAMA_NO_CLOUD"             ollama serve > /tmp/ollama.log 2>&1 &
          echo "$!" > /tmp/ollama.pid
          for i in {1..60}; do
            curl --connect-timeout 1 --max-time 2 -fsS               http://127.0.0.1:11434/api/tags >/tmp/tags.json 2>/dev/null && break
            kill -0 "$(cat /tmp/ollama.pid)"
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$OLLAMA_MODEL"
          python - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags",timeout=5) as r:
              data=json.load(r)
          rows=[
              item for item in data.get("models",[])
              if item.get("name")==os.environ["OLLAMA_MODEL"]
              or item.get("model")==os.environ["OLLAMA_MODEL"]
          ]
          assert len(rows)==1, rows
          digest=str(rows[0].get("digest") or "").removeprefix("sha256:")
          assert digest==os.environ["OLLAMA_EXPECTED_DIGEST"], digest
          print("LOCAL_SEMANTIC_PROVIDER_BOOTSTRAP=PASS")
          print("LOCAL_SEMANTIC_PROVIDER_MODEL_DIGEST=PASS")
          PY
      - name: Profile bounded semantic output budget
        id: budget_profile
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/harness-intelligence
          sudo iptables-save > /tmp/iptables-budget-before.rules
          if command -v ip6tables-save >/dev/null; then
            sudo ip6tables-save > /tmp/ip6tables-budget-before.rules
          fi
          restore_network() {
            sudo iptables-restore < /tmp/iptables-budget-before.rules || true
            if [ -f /tmp/ip6tables-budget-before.rules ]; then
              sudo ip6tables-restore < /tmp/ip6tables-budget-before.rules || true
            fi
          }
          trap restore_network EXIT
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -j REJECT
          if command -v ip6tables >/dev/null; then
            sudo ip6tables -I OUTPUT 1 -o lo -j ACCEPT
            sudo ip6tables -I OUTPUT 2 -j REJECT
          fi
          python scripts/semantic_planner_optimized_inference_profile.py             --output artifacts/harness-intelligence/semantic-budget-profile.json
          selected="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("artifacts/harness-intelligence/semantic-budget-profile.json").read_text())
          print(data.get("selected_num_predict") or "")
          PY
          )"
          case "$selected" in
            256|384|512) ;;
            *) echo "BOUNDED_OUTPUT_BUDGET_SELECTION=FAIL:$selected"; exit 2 ;;
          esac
          echo "selected_num_predict=$selected" >> "$GITHUB_OUTPUT"
          echo "BR_LOCAL_SEMANTIC_NUM_PREDICT=$selected" >> "$GITHUB_ENV"
          echo "BOUNDED_OUTPUT_BUDGET_SELECTION=PASS:$selected"

      - name: Upload bounded budget profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-planner-bounded-budget-profile
          path: artifacts/harness-intelligence/semantic-budget-profile.json
          if-no-files-found: error
          retention-days: 30

      - name: Run isolated real semantic proposal performance gate
        id: single_proposal
        if: steps.budget_profile.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p artifacts/harness-intelligence
          sudo iptables-save > /tmp/iptables-single-before.rules
          if command -v ip6tables-save >/dev/null; then
            sudo ip6tables-save > /tmp/ip6tables-single-before.rules
          fi
          restore_network() {
            sudo iptables-restore < /tmp/iptables-single-before.rules || true
            if [ -f /tmp/ip6tables-single-before.rules ]; then
              sudo ip6tables-restore < /tmp/ip6tables-single-before.rules || true
            fi
          }
          trap restore_network EXIT
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -j REJECT
          if command -v ip6tables >/dev/null; then
            sudo ip6tables -I OUTPUT 1 -o lo -j ACCEPT
            sudo ip6tables -I OUTPUT 2 -j REJECT
          fi
          python scripts/semantic_planner_single_proposal_proof.py             --output artifacts/harness-intelligence/single-proposal-performance.json

      - name: Upload isolated proposal evidence
        if: always() && steps.budget_profile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-single-proposal-performance
          path: artifacts/harness-intelligence/single-proposal-performance.json
          if-no-files-found: error
          retention-days: 30

      - name: Run live Harness intelligence benchmark
        id: benchmark
        if: steps.budget_profile.outcome == 'success' && steps.single_proposal.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/harness-intelligence
          sudo iptables-save > /tmp/iptables-before.rules
          if command -v ip6tables-save >/dev/null; then
            sudo ip6tables-save > /tmp/ip6tables-before.rules
          fi
          restore_network() {
            sudo iptables-restore < /tmp/iptables-before.rules || true
            if [ -f /tmp/ip6tables-before.rules ]; then
              sudo ip6tables-restore < /tmp/ip6tables-before.rules || true
            fi
          }
          trap restore_network EXIT
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -j REJECT
          if command -v ip6tables >/dev/null; then
            sudo ip6tables -I OUTPUT 1 -o lo -j ACCEPT
            sudo ip6tables -I OUTPUT 2 -j REJECT
          fi
          python scripts/harness_intelligence_benchmark.py             --output artifacts/harness-intelligence/intelligence-benchmark.json
      - name: Shutdown local semantic provider
        if: always()
        run: |
          if [ -f /tmp/ollama.pid ]; then
            kill "$(cat /tmp/ollama.pid)" 2>/dev/null || true
          fi
      - name: Upload benchmark evidence
        if: always() && steps.budget_profile.outcome == 'success' && steps.single_proposal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: harness-intelligence-benchmark
          path: artifacts/harness-intelligence/intelligence-benchmark.json
          if-no-files-found: error
      - name: Publish live benchmark status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.benchmark.outcome == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "harness-intelligence-live",
              "description": "Live semantic provider intelligence benchmark",
              "target_url": "https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d @/tmp/status.json
      - name: Enforce live benchmark
        if: steps.budget_profile.outcome != 'success' || steps.single_proposal.outcome != 'success' || steps.benchmark.outcome != 'success'
        run: exit 1
