name: VIDEO A Current Contract E2E

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run/video-a-current-product-e2e.request.json

permissions:
  contents: read
  actions: write

concurrency:
  group: video-a-current-product-e2e
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      GITHUB_ACTIONS_REPOSITORY: ${{ github.repository }}
      GITHUB_ACTIONS_RENDER_REF: work/gate6f-analytics-learning
      BR_RENDER_EXECUTOR: github_actions
      BR_TEST_DATABASE: ${{ github.workspace }}/runtime/checkpoint/mission.db
      BR_PERFORMANCE_TRACE_FILE: ${{ github.workspace }}/runtime/product-delivery/performance-trace.jsonl
      ZERO_COST_OPERATION: "TRUE"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install controller runtime
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt pytest
      - name: Resolve VIDEO A recovery mode
        id: recovery_mode
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open(".run/video-a-current-product-e2e.request.json"))
          resume=bool(d.get("resume_from_e2e_artifact_id"))
          print("resume=" + ("true" if resume else "false"))
          print("resume_artifact_id=" + str(d.get("resume_from_e2e_artifact_id") or ""))
          print("resume_run_id=" + str(d.get("resume_from_e2e_run_id") or ""))
          PY
      - name: Restore existing Job2 E2E checkpoint
        if: steps.recovery_mode.outputs.resume == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.recovery_mode.outputs.resume_artifact_id }}
          run-id: ${{ steps.recovery_mode.outputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: runtime
          merge-multiple: true
      - name: Restore canonical Product Package database checkpoint
        if: steps.recovery_mode.outputs.resume != 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: "10589535732"
          run-id: "35458162169"
          github-token: ${{ github.token }}
          path: runtime/checkpoint
          merge-multiple: true
      - name: Restore content-addressed MediaKnowledge
        if: steps.recovery_mode.outputs.resume != 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: "10590341059"
          run-id: "35460016361"
          github-token: ${{ github.token }}
          path: runtime/media-knowledge-source
          merge-multiple: true
      - name: Restore historical failed render identity
        if: steps.recovery_mode.outputs.resume != 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: "10590247951"
          run-id: "35463603082"
          github-token: ${{ github.token }}
          path: runtime/historical
          merge-multiple: true
      - name: Reuse Product Package and MediaKnowledge preflight
        if: steps.recovery_mode.outputs.resume != 'true'
        run: |
          set -euo pipefail
          python scripts/continue_product_to_human_review.py preflight             --product runtime/checkpoint/product-quality-e2e.json             --media-knowledge-dir runtime/media-knowledge-source/product-delivery/media-knowledge             --media-descriptor .run001/media-knowledge-checkpoints/gta6-extended-look-official-20260827.json             --out runtime/product-delivery
          echo "CHECKPOINT_REUSE=YES"
          echo "RESEARCH_RECOMPUTED=NO"
          echo "BRAIN_RECOMPUTED=NO"
          echo "EDITORIAL_RECOMPUTED=NO"
          echo "MEDIAKNOWLEDGE_REUSED=YES"
      - name: Reconcile stale Job1 and prepare current Job2 handoff
        if: steps.recovery_mode.outputs.resume != 'true'
        run: |
          set -euo pipefail
          python scripts/video_a_current_contract_recovery.py prepare-handoff --product runtime/checkpoint/product-quality-e2e.json --old-state runtime/historical/product-delivery/state.json --out runtime/product-delivery
      - name: Validate and prepare existing Job2 retry handoff
        if: steps.recovery_mode.outputs.resume == 'true'
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_current_audio_contract.py             tests/test_channel_spoken_branding.py             tests/test_run001_longform_editorial_controller.py             tests/test_video_a_current_contract_e2e.py
          python scripts/video_a_current_job2_resume.py prepare-retry --out runtime/product-delivery
      - name: Publish governed current Job2 handoff
        id: render_job_handoff
        uses: actions/upload-artifact@v4
        with:
          name: video-a-current-render-job-${{ github.run_id }}
          path: runtime/product-delivery/render-job-handoff/render-job.json
          if-no-files-found: error
          retention-days: 30
      - name: Dispatch current Job2 by artifact handoff
        env:
          HANDOFF_ARTIFACT_ID: ${{ steps.render_job_handoff.outputs.artifact-id }}
          HANDOFF_ARTIFACT_NAME: video-a-current-render-job-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "${{ steps.recovery_mode.outputs.resume }}" = "true" ]; then
            python scripts/video_a_current_job2_resume.py dispatch-retry --out runtime/product-delivery --artifact-id "$HANDOFF_ARTIFACT_ID" --artifact-name "$HANDOFF_ARTIFACT_NAME" --producer-run-id "$GITHUB_RUN_ID" --source-sha "$GITHUB_SHA"
          else
            python scripts/video_a_current_contract_recovery.py dispatch-handoff --out runtime/product-delivery --artifact-id "$HANDOFF_ARTIFACT_ID" --artifact-name "$HANDOFF_ARTIFACT_NAME" --producer-run-id "$GITHUB_RUN_ID" --source-sha "$GITHUB_SHA"
          fi
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open("runtime/product-delivery/state.json"))
          print(f"VIDEO_ID={d['VIDEO_ID']}")
          print(f"RENDER_JOB_ID={d['RENDER_JOB_ID']}")
          print(f"RENDER_RUN_ID={d['RENDER_RUN_ID']}")
          PY
      - name: Wait only for current professional render
        run: |
          set -euo pipefail
          python scripts/e2e_latency_stage.py start render_wait --category WAITING_EXTERNAL_TIME --work-class WAITING --output-artifact runtime/product-delivery/render-watch.json
          python scripts/watch_github_run.py --run-id "$RENDER_RUN_ID" --repo "$GITHUB_REPOSITORY" --interval-seconds 30 --output runtime/product-delivery/render-watch.json
          python scripts/e2e_latency_stage.py end render_wait --category WAITING_EXTERNAL_TIME --work-class WAITING --output-artifact runtime/product-delivery/render-watch.json
      - name: Reconcile QA-passed render into canonical database
        run: |
          set -euo pipefail
          python scripts/continue_product_to_human_review.py reconcile-render --out runtime/product-delivery
          python scripts/continue_product_to_human_review.py create-publication --out runtime/product-delivery
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open("runtime/product-delivery/publication.json"))
          print(f"PUBLICATION_ID={d['publication']['id']}")
          PY
      - name: Dispatch YouTube PRIVATE through Harness
        run: |
          set -euo pipefail
          python scripts/continue_product_to_human_review.py dispatch-upload --publication-id "$PUBLICATION_ID" --out runtime/product-delivery
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open("runtime/product-delivery/dispatch-upload.json"))
          r=d["result"]
          print(f"YOUTUBE_UPLOAD_RUN_ID={r['upload_run_id']}")
          PY
      - name: Wait only for private HD review readiness
        run: |
          set -euo pipefail
          python scripts/e2e_latency_stage.py start youtube_processing_wait --category WAITING_EXTERNAL_TIME --work-class WAITING --output-artifact runtime/product-delivery/youtube-watch.json
          python scripts/watch_github_run.py --run-id "$YOUTUBE_UPLOAD_RUN_ID" --repo "$GITHUB_REPOSITORY" --interval-seconds 30 --output runtime/product-delivery/youtube-watch.json
          python scripts/e2e_latency_stage.py end youtube_processing_wait --category WAITING_EXTERNAL_TIME --work-class WAITING --output-artifact runtime/product-delivery/youtube-watch.json
      - name: Reconcile private YouTube and Telegram receipt
        run: |
          set -euo pipefail
          python scripts/continue_product_to_human_review.py reconcile-upload --publication-id "$PUBLICATION_ID" --out runtime/product-delivery
          python scripts/continue_product_to_human_review.py final --publication-id "$PUBLICATION_ID" --out runtime/product-delivery
          python - <<'PY'
          import json
          from pathlib import Path
          final=json.load(open("runtime/product-delivery/final.json"))
          matches=list(Path("runtime/youtube-upload/results").rglob("youtube-upload-result.json"))
          assert len(matches)==1, matches
          upload=json.loads(matches[0].read_text())
          review=upload.get("telegram_review") or {}
          processing=upload.get("youtube_processing") or {}
          assert final["YOUTUBE_PRIVACY_STATUS"]=="private", final
          assert final["YOUTUBE_REVIEW_VIDEO_ID"] and final["YOUTUBE_REVIEW_URL"], final
          assert upload.get("review_ready") is True, upload
          assert processing.get("privacy_status")=="private", processing
          assert processing.get("upload_status")=="processed", processing
          assert processing.get("processing_status")=="succeeded", processing
          assert processing.get("definition")=="hd", processing
          assert review.get("status")=="DELIVERED", review
          assert isinstance(review.get("telegram_message_id"),int), review
          final["YOUTUBE_PROCESSING_STATUS"]="READY"
          final["TELEGRAM_DELIVERY_STATUS"]="PASS"
          final["TELEGRAM_MESSAGE_ID"]=review["telegram_message_id"]
          final["HUMAN_REVIEW_STATUS"]="PENDING"
          Path("runtime/product-delivery/final.json").write_text(json.dumps(final,ensure_ascii=False,indent=2))
          print("PRODUCT_E2E=PASS")
          print("PRODUCTION_READINESS=PASS")
          print(f"VIDEO_ID={final['VIDEO_ID']}")
          print(f"RENDER_JOB_ID={final['RENDER_JOB_ID']}")
          print("RENDER_QA=PASS")
          print(f"YOUTUBE_REVIEW_VIDEO_ID={final['YOUTUBE_REVIEW_VIDEO_ID']}")
          print(f"YOUTUBE_REVIEW_URL={final['YOUTUBE_REVIEW_URL']}")
          print("YOUTUBE_PRIVACY_STATUS=private")
          print("YOUTUBE_PROCESSING_STATUS=READY")
          print("TELEGRAM_DELIVERY_STATUS=PASS")
          print(f"TELEGRAM_MESSAGE_ID={final['TELEGRAM_MESSAGE_ID']}")
          print("HUMAN_REVIEW_STATUS=PENDING")
          PY
      - name: Build latency profile
        if: always()
        run: |
          set -euo pipefail
          python scripts/summarize_performance_trace.py             --trace runtime/product-delivery/performance-trace.jsonl             --output runtime/product-delivery/latency-profile.json             --run-id "$GITHUB_RUN_ID"
      - name: Upload complete VIDEO A delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-a-current-product-e2e-${{ github.run_id }}
          path: |
            runtime/product-delivery/
            runtime/checkpoint/product-quality-e2e.json
            runtime/checkpoint/mission.db
            runtime/youtube-upload/results/
          if-no-files-found: warn
          retention-days: 30
