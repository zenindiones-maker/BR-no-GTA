name: New Video 1 Current Render Resume

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run/new-video-current-render-resume.request.json

permissions:
  contents: read
  actions: write

concurrency:
  group: new-video-1-current-render-resume
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      GITHUB_ACTIONS_REPOSITORY: ${{ github.repository }}
      GITHUB_ACTIONS_RENDER_REF: work/gate6f-analytics-learning
      BR_RENDER_EXECUTOR: github_actions
      BR_TEST_DATABASE: ${{ github.workspace }}/runtime/new-video-benchmark/mission.db
      ZERO_COST_OPERATION: "TRUE"
    steps:
      - name: Checkout exact retry revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal controller runtime
        run: python -m pip install -q -r requirements-production-controller.txt

      - name: Resolve current recovery request
        id: recovery
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open(".run/new-video-current-render-resume.request.json"))
          print("checkpoint_artifact_id="+str(d["controller_checkpoint_artifact_id"]))
          print("checkpoint_run_id="+str(d["controller_checkpoint_run_id"]))
          print("post_branding="+("true" if d.get("recovery_mode")=="POST_BRANDING_ONLY" else "false"))
          PY

      - name: Restore existing Video/RenderJob control checkpoint
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.recovery.outputs.checkpoint_artifact_id }}
          run-id: ${{ steps.recovery.outputs.checkpoint_run_id }}
          github-token: ${{ github.token }}
          path: runtime
          merge-multiple: true

      - name: Validate existing state and prepare same-Job handoff
        if: steps.recovery.outputs.post_branding != 'true'
        run: |
          set -euo pipefail
          python scripts/new_video_current_render_resume.py prepare-retry \
            --request .run/new-video-current-render-resume.request.json \
            --out runtime/new-video-benchmark/delivery

      - name: Publish same-Job handoff
        if: steps.recovery.outputs.post_branding != 'true'
        id: handoff
        uses: actions/upload-artifact@v4
        with:
          name: new-video-current-render-job-${{ github.run_id }}
          path: runtime/new-video-benchmark/delivery/render-job-handoff/render-job.json
          if-no-files-found: error
          retention-days: 30

      - name: Dispatch one current-source retry with QA-passed checkpoints
        if: steps.recovery.outputs.post_branding != 'true'
        env:
          HANDOFF_ARTIFACT_ID: ${{ steps.handoff.outputs.artifact-id }}
          HANDOFF_ARTIFACT_NAME: new-video-current-render-job-${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/new_video_current_render_resume.py dispatch-retry \
            --request .run/new-video-current-render-resume.request.json \
            --out runtime/new-video-benchmark/delivery \
            --artifact-id "$HANDOFF_ARTIFACT_ID" \
            --artifact-name "$HANDOFF_ARTIFACT_NAME" \
            --producer-run-id "$GITHUB_RUN_ID" \
            --source-sha "$GITHUB_SHA"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open("runtime/new-video-benchmark/delivery/state.json"))
          print(f"RENDER_RUN_ID={d['RENDER_RUN_ID']}")
          PY

      - name: Dispatch post-render branding recovery without rerender
        if: steps.recovery.outputs.post_branding == 'true'
        run: |
          set -euo pipefail
          python scripts/new_video_current_render_resume.py dispatch-post-branding \
            --request .run/new-video-current-render-resume.request.json \
            --out runtime/new-video-benchmark/delivery
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open("runtime/new-video-benchmark/delivery/state.json"))
          print(f"RENDER_RUN_ID={d['RENDER_RUN_ID']}")
          PY

      - name: Wait only for the single current render
        run: python scripts/watch_github_run.py --run-id "$RENDER_RUN_ID" --repo "$GITHUB_REPOSITORY" --interval-seconds 30 --output runtime/new-video-benchmark/render-watch.json

      - name: Reconcile RenderJob and require final QA
        run: |
          set -euo pipefail
          python scripts/new_video_benchmark_delivery.py reconcile-render --out runtime/new-video-benchmark/delivery
          echo "RENDER_QA=PASS"

      - name: Create private YouTube publication
        run: |
          set -euo pipefail
          python scripts/new_video_benchmark_delivery.py create-publication \
            --product runtime/new-video-benchmark/product-quality-e2e.json \
            --out runtime/new-video-benchmark/delivery
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open("runtime/new-video-benchmark/delivery/state.json"))
          print(f"YOUTUBE_PUBLICATION_ID={d['YOUTUBE_PUBLICATION_ID']}")
          PY

      - name: Dispatch YouTube PRIVATE
        run: |
          set -euo pipefail
          python scripts/new_video_benchmark_delivery.py dispatch-upload --out runtime/new-video-benchmark/delivery
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open("runtime/new-video-benchmark/delivery/state.json"))
          print(f"YOUTUBE_UPLOAD_RUN_ID={d['YOUTUBE_UPLOAD_RUN_ID']}")
          PY

      - name: Wait only for private HD review readiness
        run: python scripts/watch_github_run.py --run-id "$YOUTUBE_UPLOAD_RUN_ID" --repo "$GITHUB_REPOSITORY" --interval-seconds 30 --output runtime/new-video-benchmark/youtube-watch.json

      - name: Reconcile YouTube and Telegram human review
        run: |
          set -euo pipefail
          python scripts/new_video_benchmark_delivery.py reconcile-upload --out runtime/new-video-benchmark/delivery
          python - <<'PY'
          import json
          d=json.load(open("runtime/new-video-benchmark/delivery/final.json"))
          assert d["YOUTUBE_PRIVACY_STATUS"]=="private", d
          assert d["YOUTUBE_PROCESSING_STATUS"]=="READY", d
          assert d["TELEGRAM_DELIVERY_STATUS"]=="PASS", d
          assert isinstance(d["TELEGRAM_MESSAGE_ID"],int), d
          assert d["HUMAN_REVIEW_STATUS"]=="PENDING", d
          print(f"YOUTUBE_REVIEW_URL={d['YOUTUBE_REVIEW_URL']}")
          print(f"TELEGRAM_MESSAGE_ID={d['TELEGRAM_MESSAGE_ID']}")
          print("HUMAN_REVIEW_STATUS=PENDING")
          PY

      - name: Upload resume evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-video-current-render-resume-${{ github.run_id }}
          path: |
            runtime/new-video-benchmark/delivery/
            runtime/new-video-benchmark/mission.db
            runtime/youtube-upload/results/
          if-no-files-found: warn
          retention-days: 30
