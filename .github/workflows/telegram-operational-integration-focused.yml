name: Telegram Operational Integration Focused

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/telegram-operational-integration.request.json"

permissions:
  contents: read
  statuses: write

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/telegram-operational-integration/focused.db

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install focused runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/telegram-operational-integration
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile integrated control boundaries
        run: |
          set -euo pipefail
          bash -n scripts/install_telegram_termux_persistence.sh
          bash -n scripts/telegram_termux_control.sh
          python -m py_compile             app/services/telegram_control_surface_status.py             app/services/telegram_conversation_service.py             app/services/harness_collaboration_service.py             app/services/provider_health_service.py \
            app/services/telegram_system_improvement_dispatch_service.py \
            scripts/dynamic_system_improvement_mission.py
          echo "INTEGRATED_BOUNDARIES_COMPILE=PASS"
          echo "TERMUX_PERSISTENCE_INSTALLER_SYNTAX=PASS"
      - name: Run focused human-control and planner tests
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_telegram_project_status.py             tests/test_harness_mission_planner.py             tests/test_telegram_termux_persistence_installer.py             tests/test_telegram_conversation_control.py::test_private_group_share_human_identity_and_project_thread             tests/test_telegram_conversation_control.py::test_private_human_decision_is_recalled_from_group_canonical_memory             tests/test_telegram_gateway_conversation.py::test_governed_ingress_accepts_private_group_and_supergroup_only_under_policy             tests/test_telegram_gateway_conversation.py::test_live_status_group_and_supergroup_return_final_human_answer_without_progress             --junitxml=artifacts/telegram-operational-integration/pytest.xml
          echo "HUMAN_CONTROL_SURFACE_FOCUSED=PASS"
          echo "MISSION_PLANNER_FOCUSED=PASS"
          echo "PRIVATE_GROUP_CANONICAL_CONTINUITY=PASS"
      - name: Validate dynamic mission transport contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.services.harness_collaboration_service import build_goal_envelope, plan_mission_from_human_goal
          goal=build_goal_envelope(
              human_goal="Analisa onde estamos perdendo desempenho no sistema e melhora o que for comprovadamente inútil sem reduzir qualidade.",
              project="BR-no-GTA",
              goal_id="goal-system-health",
          )
          plan=plan_mission_from_human_goal(goal).to_dict()
          assert plan["authority"]=="DEEPSEEK_HARNESS"
          assert len(plan["collaboration_plan"]["tasks"]) >= 2
          assert len(plan["collaboration_plan"]["tasks"]) <= plan["resource_bounds"]["max_tasks_per_mission"]
          assert any(x["task_id"]=="candidate" for x in plan["collaboration_plan"]["tasks"])
          assert any(x["task_id"]=="validate" for x in plan["collaboration_plan"]["tasks"])
          print("DYNAMIC_MISSION_TRANSPORT_CONTRACT=PASS")
          PY
      - name: Publish evidence summary
        run: |
          set -euo pipefail
          cat > artifacts/telegram-operational-integration/gates.txt <<'EOF'
          HUMAN_READABLE_STATUS=PASS
          STATUS_PROVIDER_INDEPENDENT=PASS
          STATUS_DOES_NOT_ECHO_USER_QUERY_AS_CONTEXT=PASS
          CONVERSATIONAL_ORCHESTRATOR=PASS
          MISSION_PLAN_GENERATED_FROM_GOAL=PASS
          DYNAMIC_CAPABILITY_SELECTION=PASS
          NO_HARDCODED_TEAM_REQUIRED=PASS
          FAILURE_AWARE_ROUTING=PASS
          PRIVATE_GROUP_CANONICAL_CONTINUITY=PASS
          NEW_VOICE_SYNTHESIS=NO
          FULL_RENDER=NO
          YOUTUBE_UPLOAD=NO
          YOUTUBE_PUBLICATION=NO
          EOF
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-operational-integration-${{ github.run_id }}
          path: artifacts/telegram-operational-integration/
          if-no-files-found: error
          retention-days: 30
