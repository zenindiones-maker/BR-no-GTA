name: Pronunciation Proof
run-name: Pronunciation proof · Voice B · ${{ github.run_attempt }}

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run001/pronunciation-proof.request.json
      - .github/workflows/pronunciation-proof.yml
      - config/pronunciation_lexicon.json
      - config/pronunciation_human_approvals.json
      - app/services/human_review_quality_gate.py
      - app/services/pronunciation_service.py
      - scripts/pronunciation_proof.py
      - tests/test_pronunciation_service.py
      - tests/test_channel_spoken_branding.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pronunciation-proof-voice-b
  cancel-in-progress: false

jobs:
  pronunciation-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate immutable proof request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path('.run001/pronunciation-proof.request.json').read_text(encoding='utf-8'))
          expected={
              'mission':'br-no-gta-professional-ptbr-pronunciation-v2',
              'voice':'pt-BR-ThalitaMultilingualNeural',
              'job18_frozen':True,
              'youtube_publication':False,
              'human_approval_required_for_vice_city':True,
              'human_approval_required_for_leonida':True,
              'foreign_language_chunks_forbidden':True,
          }
          for key,value in expected.items():
              if request.get(key)!=value:
                  raise SystemExit(f'PRONUNCIATION_PROOF_REQUEST_MISMATCH:{key}')
          base=request.get('base_head')
          if not base:
              raise SystemExit('PRONUNCIATION_PROOF_REQUEST_MISSING_BASE_HEAD')
          print('PRONUNCIATION_PROOF_REQUEST=PASS')
          print('BASE_HEAD='+base)
          print('JOB18_UNCHANGED=YES')
          print('NO_YOUTUBE_PUBLISH=YES')
          PY
          base="$(python -c "import json;print(json.load(open('.run001/pronunciation-proof.request.json'))['base_head'])")"
          git merge-base --is-ancestor "$base" HEAD

      - name: Install proof runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt pytest
          python -m pip install "edge-tts==7.2.8"
          ffmpeg -version | head -n1
          ffprobe -version | head -n1

      - name: Focused pronunciation and integration tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_pronunciation_service.py \
            tests/test_narration_pipeline.py \
            tests/test_channel_spoken_branding.py \
            tests/test_human_review_quality_gate.py

      - name: Generate real Voice B pronunciation proof
        run: |
          set -euo pipefail
          python scripts/pronunciation_proof.py --output-dir runtime/pronunciation-proof

      - name: Validate proof contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          proof=json.loads(Path('runtime/pronunciation-proof/pronunciation-proof.json').read_text(encoding='utf-8'))
          required=(
              'PRONUNCIATION_LAYER','CANONICAL_TEXT_PRESERVED','VOICE_B_PRESERVED',
              'LEONIDA_ALIAS_REGISTERED','LEONIDA_CANONICAL_TEXT_PRESERVED',
              'LEONIDA_CONTINUOUS_PTBR_PROSODY','LEONIDA_NO_AUDIBLE_CHUNK_BOUNDARY',
              'LEONIDA_REAL_AUDIO_GENERATED',
              'VICE_CITY_LANGUAGE_RESOLUTION','VICE_CITY_REAL_AUDIO_GENERATED',
              'VICE_CITY_JOIN_TIMING_NATURAL',
              'GTA6_CANONICAL_TEXT_PRESERVED','GTA6_REAL_AUDIO_GENERATED',
              'GTA6_AND_VICE_CITY_COEXIST',
              'NATURAL_PTBR_PROSODY_CONTINUITY','OPENING_THREE_TAKES_GENERATED',
              'OPENING_FLUIDITY_THREE_TAKES_GENERATED',
              'OPENING_CANONICAL_FLUID2_GENERATED',
              'SINGLE_PTBR_SYNTHESIS','ALL_SYNTHESIS_PTBR','PRONUNCIATION_LEXICON','CACHE_INVALIDATION',
              'EDGE_CAPABILITY_BOUNDARY','STRICT_PROVIDER_BOUNDARY',
              'FINAL_AUDIO_DECODE','NO_EDITORIAL_TEXT_MUTATION',
          )
          checks=proof.get('checks') or {}
          missing=[key for key in required if checks.get(key) is not True]
          if proof.get('status')!='PASS' or missing:
              raise SystemExit('PRONUNCIATION_PROOF=FAIL:'+','.join(missing))
          if proof.get('voice')!='pt-BR-ThalitaMultilingualNeural':
              raise SystemExit('VOICE_B_PRESERVED=FAIL')
          review=proof.get('human_review') or {}
          if review.get('status')!='PENDING':
              raise SystemExit('HUMAN_REVIEW_GATE_INVALID')
          terms=review.get('terms') or {}
          if (terms.get('vice-city') or {}).get('status') not in ('APPROVED','REFERENCE_SOUND_APPROVED_GLOBAL_DUBBING_REJECTED'):
              raise SystemExit('VICE_CITY_REFERENCE_STATUS_INVALID')
          if (terms.get('leonida') or {}).get('status') not in ('PENDING','REJECTED'):
              raise SystemExit('LEONIDA_HUMAN_REVIEW_INVALID')
          if (terms.get('gta-6') or {}).get('status')!='PENDING':
              raise SystemExit('GTA6_HUMAN_REVIEW_INVALID')
          if (terms.get('voice-b-naturality') or {}).get('status')!='PENDING':
              raise SystemExit('VOICE_B_NATURALITY_REVIEW_INVALID')
          for key in required:
              print(key+'=PASS')
          assert proof.get('LEONIDA_ALIAS_REGISTERED')=='PASS',proof
          assert proof.get('LEONIDA_SYNTHESIS_ALIAS')=='Leônida',proof
          assert proof.get('LEONIDA_PRONUNCIATION')=='FAIL',proof
          assert proof.get('CONTINUOUS_PTBR_PROSODY')=='PASS',proof
          assert proof.get('NO_AUDIBLE_CHUNK_BOUNDARY')=='PASS',proof
          assert proof.get('EDITORIAL_TEXT_MUTATED')=='NO',proof
          assert proof.get('TRANSCRIPT_MUTATED')=='NO',proof
          assert proof.get('PRODUCTION_READINESS')=='FAIL',proof
          assert proof.get('FULL_RENDER_AUTHORIZED')=='NO',proof
          print('LEONIDA_ALIAS_REGISTERED=PASS')
          print('LEONIDA_SYNTHESIS_ALIAS=Leônida')
          print('LEONIDA_PRONUNCIATION=FAIL')
          print('CONTINUOUS_PTBR_PROSODY=PASS')
          print('NO_AUDIBLE_CHUNK_BOUNDARY=PASS')
          print('EDITORIAL_TEXT_MUTATED=NO')
          print('TRANSCRIPT_MUTATED=NO')
          print('PRODUCTION_READINESS=FAIL')
          print('FULL_RENDER_AUTHORIZED=NO')
          print('VICE_CITY_TARGET_SOUND_REFERENCE=HUMAN_APPROVED')
          print('FOREIGN_LANGUAGE_CHUNKS=OFF')
          print('GTA6_PRONUNCIATION_HUMAN_APPROVED=PENDING')
          print('VOICE_B_NATURALITY_HUMAN_APPROVED=PENDING')
          print('JOB18_UNCHANGED=YES')
          print('PUBLICATION_AUTHORITY_UNCHANGED=YES')
          PY

      - name: Deliver Leonida Voice B context samples to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID || secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('runtime/pronunciation-proof')
          root.mkdir(parents=True,exist_ok=True)
          required=tuple(root/'samples'/name for name in (
              'L1-leonida-context.mp3',
              'L2-leonida-context.mp3',
              'L3-leonida-keys.mp3',
              'L4-leonida-power.mp3',
          ))
          state={
              'status':'NOT_SENT',
              'reason':None,
              'sample_count':0,
              'human_review_status':'PENDING',
              'message_ids':[],
              'PRODUCTION_READINESS':'FAIL',
              'FULL_RENDER_AUTHORIZED':'NO',
          }
          token=(os.environ.get('TELEGRAM_BOT_TOKEN') or '').strip()
          chat=(os.environ.get('TELEGRAM_REVIEW_CHAT_ID') or '').strip()
          if not all(path.is_file() for path in required):
              state['reason']='LEONIDA_REVIEW_SAMPLES_UNAVAILABLE'
          elif not token:
              state['reason']='EXTERNAL_SECRET_BLOCKER=TELEGRAM_BOT_TOKEN'
          elif not chat:
              state['reason']='EXTERNAL_SECRET_BLOCKER=TELEGRAM_REVIEW_CHAT_ID'
          else:
              state['status']='READY'
          (root/'telegram-leonida-review.json').write_text(
              json.dumps(state,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          print(state['status'])
          print(state['reason'] or 'TELEGRAM_LEONIDA_REVIEW_READY')
          PY
          status="$(python -c "import json;print(json.load(open('runtime/pronunciation-proof/telegram-leonida-review.json'))['status'])")"
          if [ "$status" != "READY" ]; then exit 0; fi
          : > runtime/pronunciation-proof/telegram-leonida-message-ids.txt
          for audio in \
            runtime/pronunciation-proof/samples/L1-leonida-context.mp3 \
            runtime/pronunciation-proof/samples/L2-leonida-context.mp3 \
            runtime/pronunciation-proof/samples/L3-leonida-keys.mp3 \
            runtime/pronunciation-proof/samples/L4-leonida-power.mp3; do
            response="$(curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendAudio" \
              -F "chat_id=$TELEGRAM_REVIEW_CHAT_ID" \
              -F "audio=@$audio" \
              -F "caption=BR no GTA 6 · LEONIDA · Voice B · revisão humana obrigatória · $(basename "$audio") · PRODUCTION_READINESS=FAIL")"
            RESPONSE="$response" AUDIO="$audio" python - <<'PY' >> runtime/pronunciation-proof/telegram-leonida-message-ids.txt
          import json,os
          payload=json.loads(os.environ['RESPONSE'])
          if payload.get('ok') is not True:
              raise SystemExit('TELEGRAM_LEONIDA_REVIEW=FAIL')
          print(os.path.basename(os.environ['AUDIO'])+','+str((payload.get('result') or {}).get('message_id')))
          PY
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('runtime/pronunciation-proof')
          ids=[]
          for line in (root/'telegram-leonida-message-ids.txt').read_text(encoding='utf-8').splitlines():
              if ',' in line:
                  name,value=line.rsplit(',',1)
                  ids.append({'file':name,'message_id':int(value)})
          state=json.loads((root/'telegram-leonida-review.json').read_text(encoding='utf-8'))
          state.update({
              'status':'SENT',
              'sample_count':len(ids),
              'message_ids':ids,
              'human_review_status':'PENDING',
              'LEONIDA_PRONUNCIATION':'FAIL',
              'PRODUCTION_READINESS':'FAIL',
              'FULL_RENDER_AUTHORIZED':'NO',
          })
          (root/'telegram-leonida-review.json').write_text(
              json.dumps(state,ensure_ascii=False,indent=2),encoding='utf-8'
          )
          print('LEONIDA_REVIEW_SAMPLES_SENT='+str(len(ids)))
          print('HUMAN_REVIEW_STATUS=PENDING')
          print('LEONIDA_PRONUNCIATION=FAIL')
          print('PRODUCTION_READINESS=FAIL')
          print('FULL_RENDER_AUTHORIZED=NO')
          PY

      - name: Upload pronunciation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pronunciation-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/pronunciation-proof/
          if-no-files-found: error
          retention-days: 30
