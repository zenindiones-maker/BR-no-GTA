name: BR V24 Agent Office Network Boundary Review

on:
  push:
    branches:
      - work/br-slm-agent-reconstruction-v24
    paths:
      - ".github/workflows/br-v24-agent-office-network-boundary-review.yml"
      - "scripts/br_v24_office_network_boundary_review.py"
      - "tests/test_br_v24_office_network_boundary_review.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v24-office-network-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-vendor-read-only-review-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Exact BR V24 read-only checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch ONLY pinned original Agent Office source (not a runtime)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: chaitanyagiri/munder-difflin
          ref: 6248293a7cd9dfdbf9633d12bbe857831ccfee88
          path: .br-v24-untrusted-office-network-review
          submodules: false
          persist-credentials: false
      - name: Use Python 3.12 only for first-party BR audit script
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact source and run adversarial source inventory tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/br-slm-agent-reconstruction-v24"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .br-v24-untrusted-office-network-review rev-parse HEAD)" = "6248293a7cd9dfdbf9633d12bbe857831ccfee88"
          python -m unittest discover -s tests -p 'test_br_v24_office_network_boundary_review.py' -v
          python scripts/br_v24_office_network_boundary_review.py \
            --vendor "$GITHUB_WORKSPACE/.br-v24-untrusted-office-network-review" \
            --output "$RUNNER_TEMP/br-v24-office-network-boundary.json"
          echo "BR_V24_NETWORK_BOUNDARY_SOURCE_GATE=PASS"
          echo "BR_V24_INDEPENDENT_REVIEW=PENDING"
          echo "BR_V24_AGENT_OFFICE_UPSTREAM_RUNTIME=BLOCKED"
      - name: Preserve hashed/line-number-only provenance packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-v24-office-network-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}/br-v24-office-network-boundary.json
          if-no-files-found: warn
          retention-days: 7
