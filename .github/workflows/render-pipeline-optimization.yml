name: Render Pipeline Optimization Benchmark
run-name: render pipeline optimization · ${{ github.run_attempt }}

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run001/render-pipeline-optimization.request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: render-pipeline-optimization
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: video-engine/backend:.
      BASELINE_RUN_ID: "35408056905"
      BASELINE_ARTIFACT_ID: "10572723602"
      MEDIA_RUN_ID: "35407875087"
      MEDIA_ARTIFACT_ID: "10572578507"
      NARRATION_RUN_ID: "35401841031"
      NARRATION_ARTIFACT_ID: "10570877480"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate optimization request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('.run001/render-pipeline-optimization.request.json').read_text())
          required={
              'source_canary_run_id':35408056905,
              'source_canary_artifact_id':10572723602,
              'candidate':'vedit.longform.render-profile@v4-timestamp-compact-text',
              'representative_repeats':3,
              'minimum_latency_reduction_percent':20.0,
              'minimum_ssim':0.98,
              'job18_frozen':True,
              'youtube_publication':False,
          }
          for key,value in required.items():
              if req.get(key)!=value:
                  raise SystemExit(f'OPTIMIZATION_REQUEST_MISMATCH:{key}')
          print('OPTIMIZATION_REQUEST=PASS')
          print('JOB18_UNCHANGED=YES')
          print('PUBLICATION_AUTHORITY_UNCHANGED=YES')
          PY

      - name: Install benchmark runtime
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -r requirements.txt pytest
          ffmpeg -version | head -n1
          nproc
          free -h
          df -h .

      - name: Focused performance regression tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_operational_efficiency_policy.py \
            tests/test_operational_efficiency_history.py \
            tests/test_professional_audiovisual_worker.py \
            tests/test_render_timeline_placement.py

      - name: Restore validated slow baseline canary
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.BASELINE_ARTIFACT_ID }}
          run-id: ${{ env.BASELINE_RUN_ID }}
          github-token: ${{ github.token }}
          path: runtime/optimization/baseline
          merge-multiple: true

      - name: Restore immutable media checkpoint
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.MEDIA_ARTIFACT_ID }}
          run-id: ${{ env.MEDIA_RUN_ID }}
          github-token: ${{ github.token }}
          path: runtime/optimization/media
          merge-multiple: true

      - name: Restore immutable narration checkpoint
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.NARRATION_ARTIFACT_ID }}
          run-id: ${{ env.NARRATION_RUN_ID }}
          github-token: ${{ github.token }}
          path: runtime/optimization/narration
          merge-multiple: true

      - name: Benchmark long-form timeline placement and redundant A1 pass
        run: |
          set -euo pipefail
          mkdir -p runtime/optimization/proof
          python scripts/benchmark_render_pipeline_optimization.py \
            --baseline-artifact-root runtime/optimization/baseline \
            --media-root runtime/optimization/media \
            --narration-root runtime/optimization/narration \
            --work-root runtime/optimization/work \
            --output runtime/optimization/proof/optimization-evidence.json \
            --repeats 3 \
            | tee runtime/optimization/proof/benchmark.log
          grep -Fx 'JOB18_UNCHANGED=YES' runtime/optimization/proof/benchmark.log
          grep -Fx 'PUBLICATION_AUTHORITY_UNCHANGED=YES' runtime/optimization/proof/benchmark.log

      - name: Validate mandatory encoder and quality gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('runtime/optimization/proof/optimization-evidence.json').read_text())
          assert d['status']=='PASS' and d['observed'] is True
          root=d['root_cause']
          bench=d['benchmark']
          assert root['stage']=='ffmpeg_decode_filtergraph_encode_audio_mix'
          assert root['complexity']['legacy_prepad_seconds'] > root['complexity']['timeline_duration_seconds']
          assert root['complexity']['text_clip_count'] > 0
          assert bench['promotion_eligible'] is True
          assert bench['latency_reduction_fraction'] >= 0.20
          assert bench['ssim'] >= 0.98
          candidate=bench['candidate']
          assert candidate['qa_status']=='PASS'
          assert candidate['checks']['resolution_1920x1080'] is True
          assert candidate['checks']['fps_30'] is True
          assert candidate['checks']['video_codec_h264'] is True
          assert candidate['checks']['audio_codec_aac'] is True
          assert candidate['checks']['duration_expected'] is True
          assert candidate['full_decode'] is True
          assert candidate['timeline_placement']=='timestamp'
          assert candidate['compact_text_overlays'] is True
          a1=d['a1_post_render_remux']
          assert a1['precondition_a1_voice_contract'] is True
          assert a1['video_stream_copy_hash_preserved'] is True
          assert a1['result_full_decode'] is True
          print('ROOT_CAUSE=LEGACY_TPAD_PLUS_FULL_FRAME_STATIC_TEXT_OVERLAYS')
          print('QUALITY_GATES=PASS')
          print('FULL_DECODE=PASS')
          print('V4_RENDER_PROFILE_PROMOTION=ELIGIBLE')
          print('A1_REDUNDANT_REMUX_MEASURED=PASS')
          PY

      - name: Upload render optimization evidence
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: render-pipeline-optimization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/optimization/proof/
            runtime/optimization/work/results/*.mp4
          if-no-files-found: error
          retention-days: 30
