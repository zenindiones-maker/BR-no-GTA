name: VIDEO A Narration Production Readiness Audition

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/services/video_a_production_readiness.py"
      - "app/services/narration_pipeline.py"
      - "scripts/video_a_narration_readiness.py"
      - "scripts/video_a_dubbing_learning_episode.py"
      - "config/video_a_production_readiness_human.json"
      - "config/video_a_production_readiness_state.json"
      - "config/pronunciation_evidence_registry.json"
      - "config/pronunciation_ptbr_candidate.json"
      - "config/pronunciation_lexicon.json"
      - "tests/test_video_a_production_readiness.py"
      - "tests/test_pronunciation_service.py"
      - ".github/workflows/video-a-narration-readiness-audition.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: video-a-narration-production-readiness
  cancel-in-progress: true

jobs:
  audition:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'run VIDEO A narration audition')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      BR_TEST_DATABASE: ${{ github.workspace }}/runtime/video-a-dubbing-learning.db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused audio and alignment runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt pytest
          python -m pip install "edge-tts==7.2.8" "faster-whisper==1.2.1"
          ffmpeg -version | head -n1

      - name: Focused production-readiness regression tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_video_a_production_readiness.py \
            tests/test_pronunciation_service.py \
            tests/test_narration_pipeline.py
          python -m py_compile \
            app/services/video_a_production_readiness.py \
            scripts/video_a_narration_readiness.py \
            scripts/video_a_dubbing_learning_episode.py
          echo "PRODUCTION_READINESS_FOCUSED_TESTS=PASS"

      - name: Record real global dubbing failure in Learning Plane
        run: |
          set -euo pipefail
          mkdir -p runtime/video-a-narration-readiness
          python scripts/video_a_dubbing_learning_episode.py \
            --output runtime/video-a-narration-readiness/learning-proof.json

      - name: Generate real Voice B audition pack and final-mix QA
        run: |
          set -euo pipefail
          python scripts/video_a_narration_readiness.py \
            --candidate .run/video-a-next-candidate/candidate.json \
            --learning-proof runtime/video-a-narration-readiness/learning-proof.json \
            --output-dir runtime/video-a-narration-readiness

      - name: Validate fail-closed audition contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("runtime/video-a-narration-readiness")
          report=json.loads((root/"production-readiness-report.json").read_text(encoding="utf-8"))
          assert report["LEARNING_APPLIED_TO_NEXT_EXECUTION"]=="YES",report
          assert report["FINAL_MIX_QA_IMPLEMENTED"]=="PASS",report
          assert report["GLOBAL_PRONUNCIATION_STATUS"]=="FAIL",report
          assert report["LEONIDA_PRONUNCIATION"]=="FAIL",report
          assert report["HUMAN_VOICE_REVIEW"]=="PENDING",report
          assert report["PRODUCTION_READINESS"]=="FAIL",report
          assert report["FULL_RENDER_AUTHORIZED"]=="NO",report
          assert report["UNPLANNED_TEXT_OVERLAY"]=="OFF",report
          assert report["CLAIM_EVIDENCE_COVERAGE"]==100.0,report
          assert report["PRONUNCIATION_COVERAGE_PERCENT"]<100.0,report
          assert report["FOREIGN_LANGUAGE_CHUNKS"]=="OFF",report
          assert report["NO_NAME_FRAGMENTATION"]=="PASS",report
          inv=json.loads((root/"pronunciation-inventory.json").read_text(encoding="utf-8"))
          assert inv["ALL_CONFIGURED_TERMS_PTBR"]=="PASS",inv
          assert inv["FOREIGN_LANGUAGE_CHUNKS_ALLOWED"]=="NO",inv
          assert inv["PTBR_CANDIDATE_CONFIGURATION_PERCENT"]==100.0,inv
          print("AUDITION_PACK_TECHNICAL_EXECUTION=PASS")
          print("TEXT_FIDELITY="+str(report["TEXT_FIDELITY"]))
          print("FOREIGN_LANGUAGE_CHUNKS=OFF")
          print("GLOBAL_PRONUNCIATION_STATUS=FAIL")
          print("HUMAN_VOICE_REVIEW=PENDING")
          print("PRODUCTION_READINESS=FAIL")
          print("FULL_RENDER_AUTHORIZED=NO")
          PY

      - name: Send narration audition pack to Telegram as documents
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID || secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_REVIEW_CHAT_ID"
          root="runtime/video-a-narration-readiness"
          : > "$root/telegram-audition-message-ids.txt"

          for file in \
            "$root/production-readiness-report.json" \
            "$root/pronunciation-inventory.json" \
            "$root/final-mix-narration-qa.json" \
            "$root/claim-evidence-manifest.json" \
            "$root/visual-readiness.json"; do
            response="$(curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
              -F "chat_id=$TELEGRAM_REVIEW_CHAT_ID" \
              -F "document=@$file" \
              -F "caption=VIDEO A · production readiness · $(basename "$file") · FULL_RENDER_AUTHORIZED=NO")"
            RESPONSE="$response" FILE="$file" python - <<'PY' >> "$root/telegram-audition-message-ids.txt"
          import json,os
          d=json.loads(os.environ["RESPONSE"])
          if d.get("ok") is not True: raise SystemExit("TELEGRAM_READINESS_DOCUMENT=FAIL")
          print(os.path.basename(os.environ["FILE"])+","+str((d.get("result") or {}).get("message_id")))
          PY
          done

          find "$root/audio" -type f -name "*.flac" | sort | while read -r audio; do
            block="$(basename "$audio" .flac | cut -d- -f1-2)"
            variant="$(basename "$audio" .flac | sed 's/^.*--//')"
            response="$(curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
              -F "chat_id=$TELEGRAM_REVIEW_CHAT_ID" \
              -F "document=@$audio" \
              -F "caption=VIDEO A · Voice B · PT-BR ONLY · $variant · $block · sem chunk estrangeiro · HUMAN_VOICE_REVIEW=PENDING")"
            RESPONSE="$response" FILE="$audio" python - <<'PY' >> "$root/telegram-audition-message-ids.txt"
          import json,os
          d=json.loads(os.environ["RESPONSE"])
          if d.get("ok") is not True: raise SystemExit("TELEGRAM_AUDITION_AUDIO=FAIL")
          print(os.path.basename(os.environ["FILE"])+","+str((d.get("result") or {}).get("message_id")))
          PY
          done

          count="$(wc -l < "$root/telegram-audition-message-ids.txt" | tr -d ' ')"
          echo "TELEGRAM_AUDITION_MESSAGES=$count"
          echo "HUMAN_VOICE_REVIEW=PENDING"
          echo "PRODUCTION_READINESS=FAIL"
          echo "FULL_RENDER_AUTHORIZED=NO"

      - name: Upload complete production-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-a-narration-readiness-${{ github.run_id }}
          path: |
            runtime/video-a-narration-readiness/
            runtime/video-a-dubbing-learning.db
          if-no-files-found: warn
          retention-days: 30
