name: Agent Execution Plane Canary
on:
  workflow_dispatch:
  push:
    branches: [work/gate6f-analytics-learning]
    paths:
      - 'app/services/harness_routing_evidence_snapshot_service.py'
      - 'tests/test_harness_worker_scoring.py'
      - 'app/services/harness_worker_adapters.py'
      - 'app/services/harness_worker_scheduler.py'
      - .github/workflows/agent-execution-plane-canary.yml
      - scripts/agent_execution_plane_canary.py
      - app/services/harness_worker_*.py
      - app/services/harness_trusted_task_envelope.py
      - app/contracts/harness_specialized_worker_contracts.py
permissions:
  contents: read
jobs:
  deterministic-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - run: PYTHONPATH=. python scripts/agent_execution_plane_canary.py
