name: Video Engine Cloud Worker

on:
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: "Executar testes lentos com FFmpeg"
        required: true
        default: false
        type: boolean

jobs:
  vedit:
    name: Vedit + Whisper Cloud Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout BR-no-GTA
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify cloud media environment
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Clone Vedit
        run: |
          git clone --depth 1 \
            https://github.com/metiu1/editorvideo-ai.git \
            video-engine

      - name: Install Vedit with development and transcription support
        working-directory: video-engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,transcribe]"

      - name: Verify Vedit and Whisper dependencies
        working-directory: video-engine
        run: |
          set -euo pipefail
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import PIL; print('Pillow:', PIL.__version__)"
          python -c "import faster_whisper; print('faster-whisper: OK')"
          vedit --help
          vedit doctor

      - name: Inspect Vedit Python 3.11 syntax issue
        working-directory: video-engine
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path("backend/vedit/story.py")
          lines = p.read_text().splitlines()

          matches = []

          for number, line in enumerate(lines, 1):
              if "serve altro materiale" in line or "si puo" in line:
                  matches.append((number, line))

          if not matches:
              raise SystemExit(
                  "Vedit diagnostic target not found: expected Italian timing text."
              )

          print("===== VEDIT TARGET LINES =====")

          for number, line in matches:
              print(f"{number}: {line}")

          print("===== END VEDIT TARGET LINES =====")
          PY

      - name: Run Vedit fast tests
        working-directory: video-engine
        run: |
          pytest -q -m "not slow"

      - name: Run Vedit slow tests
        if: ${{ inputs.run_slow_tests }}
        working-directory: video-engine
        run: |
          pytest -q -m slow

      - name: Cloud worker summary
        run: |
          echo "===== VIDEO ENGINE CLOUD WORKER ====="
          echo "Runner: ${RUNNER_NAME}"
          echo "Vedit: validated"
          echo "Whisper dependency: validated"
          echo "FFmpeg: validated"
          echo "Fast tests: passed"

          if [ "${{ inputs.run_slow_tests }}" = "true" ]; then
            echo "Slow tests: passed"
          else
            echo "Slow tests: skipped"
          fi
