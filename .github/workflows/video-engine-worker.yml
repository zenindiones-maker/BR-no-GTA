name: Video Engine Cloud Worker

on:
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: "Executar testes lentos com FFmpeg"
        required: true
        default: false
        type: boolean

jobs:
  vedit:
    name: Vedit + Whisper Cloud Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout BR-no-GTA
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify cloud media environment
        run: |
          set -euo pipefail
          python --version
          python -m pip --version
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Clone Vedit
        run: |
          git clone --depth 1 \
            https://github.com/metiu1/editorvideo-ai.git \
            video-engine

      - name: Install Vedit with development and transcription support
        working-directory: video-engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,transcribe]"

      - name: Verify Vedit and Whisper dependencies
        working-directory: video-engine
        run: |
          set -euo pipefail
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import PIL; print('Pillow:', PIL.__version__)"
          python -c "import faster_whisper; print('faster-whisper: OK')"
          vedit --help
          vedit doctor

      - name: Patch Vedit Python 3.11 syntax issue
        working-directory: video-engine
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path("backend/vedit/story.py")
          lines = p.read_text().splitlines(keepends=True)

          matches = [
              i
              for i, line in enumerate(lines)
              if 'out.append(f"durata {total:.1f}s contro {target:.1f}s richiesti: "' in line
          ]

          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one Vedit timing line, found {len(matches)}."
              )

          i = matches[0]

          if i + 1 >= len(lines):
              raise SystemExit("ERRO: continuação da expressão Vedit não encontrada.")

          if "si puo\\' stringere ancora" not in lines[i + 1]:
              raise SystemExit(
                  "ERRO: continuação da expressão Vedit não corresponde ao código esperado."
              )

          indent = lines[i].split("out.append", 1)[0]

          lines[i:i + 2] = [
              indent + "out.append(\n",
              indent + '    f"durata {total:.1f}s contro {target:.1f}s richiesti: "\n',
              indent + '    + ("serve altro materiale" if total < target else "si puo\' stringere ancora")\n',
              indent + ")\n",
          ]

          p.write_text("".join(lines))

          print("===== VEDIT PATCH =====")
          print("Python 3.11 syntax compatibility patch applied.")
          print("===== END VEDIT PATCH =====")
          PY

          python -m py_compile backend/vedit/story.py

      - name: Run Vedit fast tests
        working-directory: video-engine
        run: |
          pytest -q -m "not slow"

      - name: Run Vedit slow tests
        if: ${{ inputs.run_slow_tests }}
        working-directory: video-engine
        run: |
          pytest -q -m slow

      - name: Cloud worker summary
        run: |
          echo "===== VIDEO ENGINE CLOUD WORKER ====="
          echo "Runner: ${RUNNER_NAME}"
          echo "Vedit: validated"
          echo "Whisper dependency: validated"
          echo "FFmpeg: validated"
          echo "Fast tests: passed"

          if [ "${{ inputs.run_slow_tests }}" = "true" ]; then
            echo "Slow tests: passed"
          else
            echo "Slow tests: skipped"
          fi
