name: Addy 24 Live Semantic Smoke

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - '.github/workflows/addy-24-live-semantic-smoke.yml'
      - '.run001/addy-24-live-semantic.request.json'
      - 'app/services/addy_harness_service.py'
      - 'scripts/agent-tooling/live_semantic_smoke_addy_24.py'
      - 'scripts/agent-tooling/certify_addy_24.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: addy-24-live-semantic-smoke
  cancel-in-progress: false

jobs:
  live-semantic-smoke:
    name: Prove 24 real Addy semantic turns
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: .
      BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/addy-24-live/addy-24.db
      LIVE_PARALLELISM: '4'
      GH_TOKEN: ${{ github.token }}
      GITHUB_ACTIONS_REPOSITORY: ${{ github.repository }}
      BR_OPENCODE_NATIVE_REPOSITORY: ${{ github.repository }}
      BR_OPENCODE_NATIVE_REF: work/gate6f-analytics-learning
      BR_OPENCODE_NATIVE_POLL_INTERVAL: '2'
      BR_OPENCODE_NATIVE_RUN_TIMEOUT: '900'
      BR_OPENCODE_NATIVE_ARTIFACT_ROOT: artifacts/addy-24-live/opencode-artifacts

    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install BR and observed provider runtimes
        run: |
          set -euo pipefail
          mkdir -p artifacts/addy-24-live
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          npm install --global omniroute@3.8.50
          npm install --global @opencode/cli@2.0.8
          OMNI="$(omniroute --version | tr -d '\r' | sed -E 's/^[^0-9]*//')"
          OPEN="$(opencode --version | awk '{print $NF}' | tr -d '\r' | sed -E 's/^v//')"
          test "$OMNI" = "3.8.50"
          test "$OPEN" = "2.0.8"
          gh auth status

      - name: Restore pinned Addy skill source
        run: bash scripts/agent-tooling/bootstrap.sh codex

      - name: Validate pinned skill and Registry contract
        run: |
          set -euo pipefail
          python -m py_compile             app/services/addy_harness_service.py             scripts/agent-tooling/live_semantic_smoke_addy_24.py
          python scripts/agent-tooling/live_semantic_smoke_addy_24.py --validate-contract
          python scripts/agent-tooling/certify_addy_24.py             --output artifacts/addy-24-live/provisioning-registry.json
          python scripts/agent-tooling/check_discovery.py             codex artifacts/addy-24-live/native-discovery.json

      - name: Regression-test governed Addy boundaries
        run: |
          set -euo pipefail
          pytest -q             tests/test_addy_24_certification.py             tests/test_codex_addy_capability_executor.py

      - name: Observe and govern semantic provider promotion
        run: |
          set -euo pipefail
          python scripts/prepare_system_synergy_opencode_profile.py             --output artifacts/addy-24-live/provider-promotion.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/addy-24-live/provider-promotion.json").read_text())
          assert d["status"]=="PASS", d
          assert d["evaluation_decision"]=="PROMOTE", d
          assert d["active_profile"]["version"]=="v2", d
          assert d["quality_regression"]=="NO", d
          assert d["fallback_occurred"] is False, d
          print("ADDY_SEMANTIC_PROVIDER_PROMOTION=PASS")
          print("ADDY_SEMANTIC_PROVIDER_PROFILE=v2")
          PY

      - name: Run 24 real semantic turns through DeepSeek Harness
        run: |
          set -euo pipefail
          before="$(git status --porcelain --untracked-files=no)"
          python scripts/agent-tooling/live_semantic_smoke_addy_24.py             --output artifacts/addy-24-live             --parallelism "${LIVE_PARALLELISM}"             --max-turns 24             --max-wall-seconds 4800             --per-turn-timeout-seconds 900
          after="$(git status --porcelain --untracked-files=no)"
          test "$before" = "$after"
          echo 'ADDY_24_LIVE_REPOSITORY_MUTATION=NONE'

      - name: Independently verify receipts and mission summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/addy-24-live")
          summary=json.loads((root/"summary.json").read_text(encoding="utf-8"))
          receipts=[
              json.loads(path.read_text(encoding="utf-8"))
              for path in sorted((root/"receipts").glob("*.json"))
          ]
          assert summary["status"]=="PASS", summary["checks"]
          assert summary["observed_count"]==24
          assert len(receipts)==24
          assert len({item["skill"] for item in receipts})==24
          assert all(item["status"]=="PASS" for item in receipts)
          assert all(item["authority"]=="deepseek_harness" for item in receipts)
          assert all(item["semantic_provider"]=="opencode" for item in receipts)
          assert all(item["semantic_model"]=="oc/big-pickle" for item in receipts)
          assert all(item["provider_profile_version"]=="v2" for item in receipts)
          assert all(item["live_checks"]["real_semantic_turn"] for item in receipts)
          assert all(item["live_checks"]["live_receipt"] for item in receipts)
          assert all(item["live_checks"]["returned_to_harness"] for item in receipts)
          assert all(item["semantic_verification"]["status"]=="PASS" for item in receipts)
          assert summary["mission_root_hash"]
          assert summary["observed"]["token_usage_available"] is False
          assert summary["observed"]["usd_claimed"] is False
          print("ADDY_24_LIVE_RECEIPTS=24/24")
          print("ADDY_24_LIVE_SEMANTIC_VERIFICATION=24/24")
          print("ADDY_24_LIVE_PROVIDER_PROFILE=v2")
          print("ADDY_24_LIVE_HASH_CHAIN=PASS")
          print("ADDY_24_LIVE_FINAL=PASS")
          PY

      - name: Upload complete live semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: addy-24-live-semantic-${{ github.run_id }}
          path: artifacts/addy-24-live/
          if-no-files-found: warn
          retention-days: 30
