name: Continuous Intelligence Operation
run-name: Continuous Scheduler ${{ github.event_name }} ${{ github.run_id }}

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: scheduled or proof
        required: false
        default: scheduled
        type: choice
        options:
          - scheduled
          - proof
      request_id:
        description: Required stable identity for proof mode
        required: false
        default: ""
        type: string
  workflow_run:
    workflows:
      - Obsidian Memory Inbox
      - Telegram Conversational Control Validation
      - GTA6 Fresh Research
      - System Improvement Review
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: br-continuous-intelligence-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout scheduler definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve promoted deployment identity
        id: deployment
        env:
          MODE: ${{ inputs.mode || 'scheduled' }}
          REQUEST_ID: ${{ inputs.request_id || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from app.services.continuous_operation_deployment_service import (
              build_logical_cycle_id,
              load_continuous_operation_deployment,
          )

          deployment=load_continuous_operation_deployment(
              Path("config/continuous_operation_deployment.json")
          )
          mode=(os.environ.get("MODE") or "scheduled").strip()
          request_id=(os.environ.get("REQUEST_ID") or "").strip()
          cycle_id=build_logical_cycle_id(
              deployment,
              trigger_kind=os.environ["GITHUB_EVENT_NAME"],
              mode=mode,
              request_id=request_id or None,
              now=datetime.now(timezone.utc),
          )
          out=Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as handle:
              handle.write(f"execution_ref={deployment['execution_ref']}\n")
              handle.write(f"expected_sha={deployment['expected_sha']}\n")
              handle.write(f"policy_sha256={deployment['policy_sha256']}\n")
              handle.write(
                  f"workflow_contract_version={deployment['workflow_contract_version']}\n"
              )
              handle.write(f"cycle_id={cycle_id}\n")
              handle.write(f"mode={mode}\n")
          print("SCHEDULE_HOST_DEFAULT_BRANCH=PASS")
          print("SCHEDULER_BUSINESS_LOGIC=0")
          print("DEPLOYMENT_BINDING=PASS")
          print("CONCURRENCY_EVENT_SEMANTICS=COALESCIBLE_LATEST_STATE_RECONCILIATION")
          PY

      - name: Validate promoted target and policy digest
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.deployment.outputs.expected_sha }}
          EXPECTED_POLICY_SHA256: ${{ steps.deployment.outputs.policy_sha256 }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA" --jq .sha)"
          test "$resolved" = "$EXPECTED_SHA"
          gh api "repos/$GITHUB_REPOSITORY/contents/config/continuous_operation_policy.json?ref=$EXPECTED_SHA"             --jq .content | tr -d '\n' | base64 -d > /tmp/continuous-policy.json
          actual_policy_sha="$(sha256sum /tmp/continuous-policy.json | awk '{print $1}')"
          test "$actual_policy_sha" = "$EXPECTED_POLICY_SHA256"
          echo "TARGET_REF_RESOLVED=PASS"
          echo "TARGET_SHA_EXACT_MATCH=PASS"
          echo "DEPLOYMENT_POLICY_BINDING=PASS"

      - name: Reconcile duplicate logical dispatch
        id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_ID: ${{ steps.deployment.outputs.cycle_id }}
        run: |
          set -euo pipefail
          title="Continuous Execute $CYCLE_ID"
          count="$(gh run list             --repo "$GITHUB_REPOSITORY"             --workflow continuous-intelligence-executor.yml             --limit 100             --json displayTitle,status,conclusion             --jq "[.[] | select(.displayTitle == \"$title\")] | length" 2>/dev/null || echo 0)"
          if [[ "$count" =~ ^[0-9]+$ ]] && (( count > 0 )); then
            echo "duplicate=true" >> "$GITHUB_OUTPUT"
            echo "DUPLICATE_DISPATCH=SUPPRESSED"
          else
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
            echo "DUPLICATE_DISPATCH=0"
          fi

      - name: Dispatch exact promoted executor
        if: steps.duplicate.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_REF: ${{ steps.deployment.outputs.execution_ref }}
          EXPECTED_SHA: ${{ steps.deployment.outputs.expected_sha }}
          POLICY_SHA256: ${{ steps.deployment.outputs.policy_sha256 }}
          CYCLE_ID: ${{ steps.deployment.outputs.cycle_id }}
          MODE: ${{ steps.deployment.outputs.mode }}
          CONTRACT_VERSION: ${{ steps.deployment.outputs.workflow_contract_version }}
        run: |
          set -euo pipefail
          default_branch="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)"
          gh workflow run continuous-intelligence-executor.yml             --repo "$GITHUB_REPOSITORY"             --ref "$default_branch"             -f target_ref="$EXECUTION_REF"             -f expected_target_sha="$EXPECTED_SHA"             -f expected_policy_sha256="$POLICY_SHA256"             -f logical_cycle_id="$CYCLE_ID"             -f trigger_kind="$GITHUB_EVENT_NAME"             -f mode="$MODE"             -f scheduler_run_id="$GITHUB_RUN_ID"             -f workflow_contract_version="$CONTRACT_VERSION"
          echo "CONTINUOUS_EXECUTION_DISPATCH=PASS"
          echo "DISPATCH_IDENTITY=$CYCLE_ID"
