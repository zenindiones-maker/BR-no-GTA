name: BR Native REA Ghidra Reconstruction V9
on:
  push:
    branches:
      - work/br-native-reconstruction-proof-v9
    paths:
      - "app/services/reverse_engineering_native_v9_service.py"
      - "app/services/reverse_engineering_harness_service.py"
      - "app/services/global_capability_registry.py"
      - "tests/test_reverse_engineering_native_v9.py"
      - "tests/fixtures/native_rea_v9_reference.c"
      - "tests/fixtures/native_rea_v9_reconstruction.c"
      - "scripts/br_rea_native_v9.py"
      - "integrations/rea_ghidra_installer_v9.sh"
      - "docs/architecture/br-native-reconstruction-v9.md"
      - ".github/workflows/br-native-reconstruction-v9.yml"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-native-rea-v9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Execute adversarial native analyzer Harness tests
        env:
          BR_TEST_DATABASE: ${{ runner.temp }}/native-v9-unit-auth.db
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check pytest "python-dotenv==1.2.3"
          python - <<'PY'
          from app.database.schema import initialize_schema
          initialize_schema()
          PY
          python -m pytest -q tests/test_reverse_engineering_native_v9.py
          echo "BR_V9_NATIVE_AUTH_AND_PROVIDER_GATES=PASS"
  native-provider:
    needs: boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BR_REA_INSTALL_PREFIX: ${{ runner.temp }}/rea-v9
      BR_GHIDRA_PRIVATE_PREFIX: ${{ runner.temp }}/ghidra-v9
      GHIDRA_INSTALL_DIR: ${{ runner.temp }}/ghidra-v9/ghidra_12.1.4_PUBLIC
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      BR_TEST_DATABASE: ${{ runner.temp }}/native-v9-harness.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.11.0"
      - name: Install isolated Java 21 compiler and Ghidra support
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openjdk-21-jdk-headless gcc unzip
          "$JAVA_HOME/bin/javac" -version
          echo "BR_V9_JDK_21_AVAILABLE=PASS"
      - name: Verify official Ghidra 12.1.4 release SHA and unzip in private directory
        run: |
          set -euo pipefail
          bash integrations/rea_ghidra_installer_v9.sh
          test -f "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"
          echo "BR_V9_OFFICIAL_GHIDRA_PINNED=PASS"
      - name: Install pinned REA 6.0.0 and check native provider only
        run: |
          set -euo pipefail
          bash integrations/rea_install_and_doctor.sh --install
          "$BR_REA_INSTALL_PREFIX/node_modules/.bin/rea" --version
          "$BR_REA_INSTALL_PREFIX/node_modules/.bin/rea" doctor --provider ghidra --json > "$RUNNER_TEMP/rea-ghidra-doctor.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"rea-ghidra-doctor.json"
          data=json.loads(p.read_text())
          assert isinstance(data,dict)
          print("BR_V9_REAL_GHIDRA_PROVIDER_DOCTOR=PASS")
          PY
      - name: Compile original, independent candidate and mutated negative control
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/owned-native"
          gcc -O0 -g -fno-inline -fno-pie -no-pie -o "$RUNNER_TEMP/owned-native/reference" tests/fixtures/native_rea_v9_reference.c
          gcc -O0 -g -fno-inline -fno-pie -no-pie -o "$RUNNER_TEMP/owned-native/candidate" tests/fixtures/native_rea_v9_reconstruction.c
          gcc -O0 -g -fno-inline -fno-pie -no-pie -DINTRODUCE_DEFECT -o "$RUNNER_TEMP/owned-native/negative" tests/fixtures/native_rea_v9_reconstruction.c
          file "$RUNNER_TEMP/owned-native/reference"
          echo "BR_V9_OWNER_COMPILED_ELF=PASS"
      - name: Execute genuine REA/Ghidra function analysis through persisted Harness
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from app.database.schema import initialize_schema
          from app.services.harness_authorization_service import issue_harness_authorization
          from app.services.reverse_engineering_harness_service import NATIVE_CAPABILITY_ID
          initialize_schema()
          a=issue_harness_authorization(
              authorized_action="RESEARCH",
              subject=f"capability:{NATIVE_CAPABILITY_ID}",
              lineage={"allowed_media_roots":[str(Path(os.environ["RUNNER_TEMP"])/"owned-native")]},
          )
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as out:
              out.write(f"BR_NATIVE_AUTH_ID={a.authorization_id}\n")
          print("BR_V9_AUTH_PERSISTED_FOR_OWNED_ELF=PASS")
          PY
          export BR_NATIVE_AUTH_ID="$(grep '^BR_NATIVE_AUTH_ID=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2-)"
          python scripts/br_rea_native_v9.py \
            --authorization-id "$BR_NATIVE_AUTH_ID" \
            --owned-elf "$RUNNER_TEMP/owned-native/reference" \
            --function feature_score \
            --output "$RUNNER_TEMP/native-ghidra-proof.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"native-ghidra-proof.json").read_text())["result"]
          e=d["evidence"]
          assert d["capability_id"]=="reverse-engineering.software.rea-native-ghidra"
          assert e["status"]=="NATIVE_GHIDRA_FUNCTION_EVIDENCE_CAPTURED"
          assert e["ghidra_doctor_exit"]==0
          assert e["requested_function"]=="feature_score"
          assert e["native_function_executed"] is False
          assert e["pseudocode_forwarded_to_agents"] is False
          assert d["learning_write"]=="NOT_ATTEMPTED"
          assert d["publication"]=="FORBIDDEN"
          print("BR_V9_REA_NATIVE_FUNCTION_E2E=PASS")
          PY
      - name: Reconstruct independent owner logic with 3205 adversarial behavior checks
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os,subprocess
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"owned-native"
          cases=[(i-1602,((i*37)%1000)-500) for i in range(3205)]
          inp="".join(f"{a} {b}\n" for a,b in cases).encode()
          def evaluate(file):
              z=subprocess.run([str(root/file)],input=inp,capture_output=True,
                               check=True,timeout=30)
              assert not z.stderr
              lines=z.stdout.splitlines()
              assert len(lines)==len(cases)
              return z.stdout
          actual=evaluate("reference")
          reconstructed=evaluate("candidate")
          defective=evaluate("negative")
          assert actual==reconstructed,"RECONSTRUCTED_BEHAVIOR_MISMATCH"
          assert actual!=defective,"MUTATED_IMPLEMENTATION_WAS_NOT_REJECTED"
          disagreements=sum(a!=b for a,b in zip(actual.splitlines(),defective.splitlines()))
          assert disagreements>0
          print(f"BR_V9_BEHAVIORALLY_MATCHED_CASES={len(cases)}")
          print(f"BR_V9_MUTATION_DISAGREEMENT_COUNT={disagreements}")
          print(f"BR_V9_ORIGINAL_OUTPUT_SHA256={hashlib.sha256(actual).hexdigest()}")
          print(f"BR_V9_RECONSTRUCTION_OUTPUT_SHA256={hashlib.sha256(reconstructed).hexdigest()}")
          print("BR_V9_REAL_DIFFERENTIAL_RECONSTRUCTION=PASS")
          print("BR_V9_DEFECT_DETECTION=PASS")
          print("BR_V9_FORMAL_EQUIVALENCE_CLAIM=FORBIDDEN")
          PY
