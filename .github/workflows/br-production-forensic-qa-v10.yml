name: BR Production Forensic QA V10
on:
  push:
    branches:
      - work/br-production-forensics-readiness-v10
    paths:
      - "app/services/br_production_forensic_qa_v10.py"
      - "app/services/br_production_readiness_board_v10.py"
      - "tests/test_br_production_readiness_board_v10.py"
      - "app/services/reverse_engineering_harness_service.py"
      - "app/services/global_capability_registry.py"
      - "scripts/br_production_forensics_v10.py"
      - "tests/test_br_production_forensic_qa_v10.py"
      - ".github/workflows/br-production-forensic-qa-v10.yml"
      - "docs/architecture/br-production-readiness-v10.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-production-qa-v10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  media-forensics:
    name: Owned-video real encode, QA, negative controls and Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Initialize private persisted Harness research authority
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest==8.4.2 python-dotenv==1.2.3
          echo "BR_TEST_DATABASE=$RUNNER_TEMP/br-production-qa-v10.db" >> "$GITHUB_ENV"
      - name: Test policy, profiles, immutable media source and no false publication
        env:
          BR_TEST_DATABASE: ${{ runner.temp }}/br-production-qa-v10.db
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.database.schema import initialize_schema
          initialize_schema()
          PY
          python -m pytest -q tests/test_br_production_forensic_qa_v10.py tests/test_br_production_readiness_board_v10.py
          echo "BR_V10_HARNESS_PRODUCTION_GUARDS=PASS"
      - name: Encode real synthetic original good, mute and missing-audio variants
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          mkdir -m 700 "$RUNNER_TEMP/owned-v10-video" "$RUNNER_TEMP/private-v10-evidence"
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i 'testsrc2=size=320x180:rate=30:duration=3' \
            -f lavfi -i 'sine=frequency=500:sample_rate=48000:duration=3' \
            -shortest -c:v libx264 -preset ultrafast -threads 2 -pix_fmt yuv420p \
            -r 30 -c:a aac -ar 48000 -ac 2 -movflags +faststart \
            "$RUNNER_TEMP/owned-v10-video/original-with-audio.mp4"
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i 'testsrc2=size=320x180:rate=30:duration=3' \
            -f lavfi -i 'anullsrc=r=48000:cl=stereo' \
            -t 3 -shortest -c:v libx264 -preset ultrafast -threads 2 \
            -pix_fmt yuv420p -r 30 -c:a aac -ar 48000 -ac 2 \
            "$RUNNER_TEMP/owned-v10-video/muted-audio.mp4"
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i 'testsrc2=size=320x180:rate=30:duration=3' \
            -an -c:v libx264 -preset ultrafast -threads 2 \
            -pix_fmt yuv420p -r 30 \
            "$RUNNER_TEMP/owned-v10-video/no-audio.mp4"
          echo "BR_V10_ORIGINAL_FIXTURES_ENCODED=PASS"
      - name: Execute actual Harness-scoped FFmpeg research with negative controls
        env:
          BR_TEST_DATABASE: ${{ runner.temp }}/br-production-qa-v10.db
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          from app.services.harness_authorization_service import issue_harness_authorization
          from app.services.reverse_engineering_harness_service import PRODUCTION_QA_CAPABILITY_ID
          a=issue_harness_authorization(
              authorized_action="RESEARCH",
              subject=f"capability:{PRODUCTION_QA_CAPABILITY_ID}",
              lineage={"allowed_media_roots":[str(Path(os.environ["RUNNER_TEMP"])/"owned-v10-video")]},
          )
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write(f"BR_V10_RESEARCH_AUTH_ID={a.authorization_id}\n")
          print("BR_V10_HARNESS_AUTHORIZATION_PERSISTED=PASS")
          PY
          export BR_V10_RESEARCH_AUTH_ID="$(grep '^BR_V10_RESEARCH_AUTH_ID=' "$GITHUB_ENV" | tail -n1 | cut -d= -f2-)"
          test -n "$BR_V10_RESEARCH_AUTH_ID"
          python scripts/br_production_forensics_v10.py \
            --authorization-id "$BR_V10_RESEARCH_AUTH_ID" \
            --owned-mp4 "$RUNNER_TEMP/owned-v10-video/original-with-audio.mp4" \
            --profile synthetic_ci_canary \
            --output "$RUNNER_TEMP/private-v10-evidence/accepted.json"
          if python scripts/br_production_forensics_v10.py \
            --authorization-id "$BR_V10_RESEARCH_AUTH_ID" \
            --owned-mp4 "$RUNNER_TEMP/owned-v10-video/muted-audio.mp4" \
            --profile synthetic_ci_canary \
            --output "$RUNNER_TEMP/private-v10-evidence/muted.json"; then
            echo "BR_V10_MUTED_AUDIO_FALSE_PASS=FAIL"; exit 1
          else
            test "$?" -eq 3
          fi
          if python scripts/br_production_forensics_v10.py \
            --authorization-id "$BR_V10_RESEARCH_AUTH_ID" \
            --owned-mp4 "$RUNNER_TEMP/owned-v10-video/no-audio.mp4" \
            --profile synthetic_ci_canary \
            --output "$RUNNER_TEMP/private-v10-evidence/no-audio.json"; then
            echo "BR_V10_NO_AUDIO_FALSE_PASS=FAIL"; exit 1
          else
            test "$?" -eq 3
          fi
          if python scripts/br_production_forensics_v10.py \
            --authorization-id "$BR_V10_RESEARCH_AUTH_ID" \
            --owned-mp4 "$RUNNER_TEMP/owned-v10-video/original-with-audio.mp4" \
            --profile br_no_gta_1080p_master \
            --output "$RUNNER_TEMP/private-v10-evidence/not-a-real-episode.json"; then
            echo "BR_V10_3SEC_RELABELED_20MIN_FALSE_PASS=FAIL"; exit 1
          else
            test "$?" -eq 3
          fi
          python - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"private-v10-evidence"
          reads={p.stem:json.loads(p.read_text())["result"] for p in root.glob("*.json")}
          assert len(reads)==4
          from app.services.br_production_readiness_board_v10 import diagnose_technical_readiness
          for key,value in reads.items():
              board=diagnose_technical_readiness(value["evidence"])
              assert board["status"]=="PRODUCTION_RELEASE_BLOCKED"
              assert board["can_start_publication"] is False
              assert board["task_execution_attempted"] is False
              if key=="accepted":
                  assert board["technical_status"]=="TECHNICAL_SAMPLED_QA_PASS"
              else:
                  assert board["blocked_reasons"]
          good=reads["accepted"]
          assert good["technical_status"]=="TECHNICAL_SAMPLED_QA_PASS"
          assert good["evidence"]["metadata"]["video_codec"]=="h264"
          assert good["evidence"]["metadata"]["audio_codec"]=="aac"
          assert good["evidence"]["sampled_windows"][0]["v_decode_ok"] is True
          assert good["evidence"]["sampled_windows"][0]["a_decode_ok"] is True
          assert "SAMPLED_AUDIO_SILENT_OR_TOO_LOW" in reads["muted"]["evidence"]["failure_codes"]
          assert "EXPECTED_ONE_AUDIO_STREAM" in reads["no-audio"]["evidence"]["failure_codes"]
          assert "VIDEO_DURATION_NOT_20_TO_25_MINUTES" in reads["not-a-real-episode"]["evidence"]["failure_codes"]
          for r in reads.values():
              e=r["evidence"]
              actual=hashlib.sha256(json.dumps(
                  {k:v for k,v in e.items() if k!="receipt_sha256"},
                  sort_keys=True,ensure_ascii=False,separators=(",",":"),allow_nan=False
              ).encode()).hexdigest()
              assert actual==e["receipt_sha256"]
              assert r["production_ready"] is False
              assert r["publication"]=="FORBIDDEN"
              assert e["voice_identity_verified"] is False
              assert e["human_review_approved"] is False
              assert e["publish_authorized"] is False
              assert r["memory_write"]=="NOT_ATTEMPTED"
          print("BR_V10_REAL_FFMPEG_MEDIA_QA=PASS")
          print("BR_V10_MUTED_AND_MISSING_AUDIO_REJECTED=PASS")
          print("BR_V10_FAKE_LONGFORM_REJECTED=PASS")
          print("BR_V10_FALSE_PRODUCTION_READY_BLOCKED=PASS")
          print("BR_V10_CASE_SPECIFIC_NEXT_EXPERIMENTS=PASS")
          PY
