name: Harness Capability Boundary

on:
  push:
    branches:
      - codex/run-001-app
    paths:
      - "app/services/global_capability_registry.py"
      - "app/services/harness_routing_policy_service.py"
      - "app/services/harness_ai_provider_service.py"
      - "app/services/gta6_master_agent.py"
      - "app/services/harness_capability_service.py"
      - "app/services/codex_addy_capability_executor.py"
      - "app/integrations/deepseek_harness/server.py"
      - "app/database/harness_authorization_repository.py"
      - "app/database/schema.py"
      - "app/services/harness_authorization_service.py"
      - "tests/test_global_capability_registry.py"
      - "tests/test_harness_routing_policy_service.py"
      - "tests/test_harness_ai_provider_service.py"
      - "tests/test_harness_capability_service.py"
      - "tests/test_codex_addy_capability_executor.py"
      - "tests/test_codex_auth_boundary.py"
      - "tests/test_deepseek_harness.py"
      - "tests/test_harness_authorization_service.py"
      - "tests/test_gate4_agent_skill_integration.py"
      - ".github/workflows/harness-capability-boundary.yml"
  pull_request:
    paths:
      - "app/services/global_capability_registry.py"
      - "app/services/harness_routing_policy_service.py"
      - "app/services/harness_ai_provider_service.py"
      - "app/services/gta6_master_agent.py"
      - "app/services/harness_capability_service.py"
      - "app/services/codex_addy_capability_executor.py"
      - "app/integrations/deepseek_harness/server.py"
      - "app/database/harness_authorization_repository.py"
      - "app/database/schema.py"
      - "app/services/harness_authorization_service.py"
      - "tests/test_global_capability_registry.py"
      - "tests/test_harness_routing_policy_service.py"
      - "tests/test_harness_ai_provider_service.py"
      - "tests/test_harness_capability_service.py"
      - "tests/test_codex_addy_capability_executor.py"
      - "tests/test_codex_auth_boundary.py"
      - "tests/test_deepseek_harness.py"
      - "tests/test_harness_authorization_service.py"
      - "tests/test_gate4_agent_skill_integration.py"
      - ".github/workflows/harness-capability-boundary.yml"
  workflow_dispatch:

jobs:
  capability-boundary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Restore pinned Codex and Addy tooling
        run: bash scripts/agent-tooling/bootstrap.sh codex

      - name: Verify selected Addy skill without model calls
        run: python3 scripts/agent-tooling/check_discovery.py codex

      - name: Prove unauthenticated Harness canary fails closed
        run: |
          test -z "${OPENAI_API_KEY:-}"
          test -z "${CODEX_ACCESS_TOKEN:-}"
          export BR_TEST_DATABASE="${RUNNER_TEMP}/harness-capability-boundary.db"
          rm -f "${BR_TEST_DATABASE}"
          python - <<'PY'
          import json
          from app.database.schema import initialize_schema
          from app.integrations.deepseek_harness import server

          initialize_schema()

          payload = json.loads(server.br_capability_execute(
              capability_id="addy:code-review-and-quality",
              authorized_action="DEVELOPMENT",
              harness_decision_id="gha-auth-boundary",
              execution_id="gha-auth-boundary-1",
              payload_json=json.dumps({
                  "task": "Review tracked Python files read-only; do not modify anything."
              }),
          ))

          evidence = payload["result"]
          assert evidence["status"] == "BLOCKED", evidence
          assert evidence["active"] is False
          assert evidence["authority"] == "deepseek_harness"
          assert evidence["capability_id"] == "addy:code-review-and-quality"
          assert evidence["result"]["stage"] == "authentication"
          assert "no model turn started" in evidence["boundary"]

          print(json.dumps(evidence, ensure_ascii=False))
          PY
          test -z "$(git status --porcelain)"

      - name: Compile capability boundary
        run: |
          python -m py_compile \
            app/services/global_capability_registry.py \
            app/services/harness_routing_policy_service.py \
            app/services/harness_ai_provider_service.py \
            app/services/gta6_master_agent.py \
            app/services/harness_capability_service.py \
            app/services/harness_authorization_service.py \
            app/database/harness_authorization_repository.py \
            app/services/codex_addy_capability_executor.py \
            app/integrations/deepseek_harness/server.py

      - name: Test capability boundary
        run: |
          python -m pytest -q \
            tests/test_harness_authorization_service.py \
            tests/test_global_capability_registry.py \
            tests/test_harness_routing_policy_service.py \
            tests/test_harness_ai_provider_service.py \
            tests/test_gta6_master_agent.py \
            tests/test_harness_capability_service.py \
            tests/test_codex_addy_capability_executor.py \
            tests/test_deepseek_harness.py \
            tests/test_gate4_agent_skill_integration.py
