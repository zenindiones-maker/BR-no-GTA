name: Telegram Hermes Control Mission
run-name: Telegram Hermes ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: Unique dispatch identity
        required: true
        type: string
      mission_id:
        description: Stable Hermes mission identity
        required: true
        type: string
      mode:
        description: start or resume
        required: true
        type: choice
        options:
          - start
          - resume
      telegram_chat_id:
        description: Telegram chat identity
        required: true
        type: string
      goal_id:
        description: Harness goal identity
        required: true
        type: string
      artifact_ref:
        description: Canonical artifact reference
        required: false
        type: string
      request_text:
        description: Human request
        required: false
        type: string
      artifact_text_b64:
        description: Bounded script snapshot
        required: false
        type: string
      artifact_sha256:
        description: Script snapshot SHA-256
        required: false
        type: string
      parent_run_id:
        description: Start run to restore for resume
        required: false
        type: string
      human_answer:
        description: Human decision used only for resume
        required: false
        type: string

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: telegram-hermes-${{ inputs.mission_id }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/telegram-hermes-control/control.db
  BR_HERMES_UPSTREAM_ROOT: ${{ github.workspace }}/.runtime/hermes-agent
  MODE: ${{ inputs.mode }}
  MISSION_ID: ${{ inputs.mission_id }}
  TELEGRAM_CHAT_ID_INPUT: ${{ inputs.telegram_chat_id }}
  GOAL_ID: ${{ inputs.goal_id }}
  ARTIFACT_REF: ${{ inputs.artifact_ref }}
  REQUEST_TEXT: ${{ inputs.request_text }}
  ARTIFACT_TEXT_B64: ${{ inputs.artifact_text_b64 }}
  ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
  PARENT_RUN_ID: ${{ inputs.parent_run_id }}
  HUMAN_ANSWER: ${{ inputs.human_answer }}

jobs:
  mission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bounded Hermes runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/telegram-hermes-control .runtime
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install psutil==7.2.2 pyyaml==6.0.3 python-dotenv==1.2.2 rich==14.3.3 pathspec==1.1.1
          python scripts/bootstrap_hermes_agent.py \
            --target "$BR_HERMES_UPSTREAM_ROOT" \
            --output artifacts/telegram-hermes-control/hermes-upstream.json
          test "$(git -C "$BR_HERMES_UPSTREAM_ROOT" rev-parse HEAD)" = "9eca7f388f71755293343dddd6ec4d9111d68fc4"
          echo "HERMES_UPSTREAM_PINNED=PASS"

      - name: Restore waiting mission for resume
        if: inputs.mode == 'resume'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PARENT_RUN_ID" =~ ^[0-9]+$ ]]
          rm -rf artifacts/telegram-hermes-control
          mkdir -p artifacts/telegram-hermes-control
          gh run download "$PARENT_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "telegram-hermes-control-$PARENT_RUN_ID" \
            --dir artifacts/telegram-hermes-control
          test -f artifacts/telegram-hermes-control/telegram-hermes-control-proof.json
          test -d artifacts/telegram-hermes-control/hermes-home
          echo "HERMES_WAITING_MISSION_RESTORED=PASS"

      - name: Compile control-surface mission
        run: |
          set -euo pipefail
          python -m py_compile \
            app/services/telegram_conversation_service.py \
            app/services/telegram_hermes_dispatch_service.py \
            scripts/telegram_harness_gateway_v2.py \
            scripts/telegram_hermes_control_mission.py
          echo "TELEGRAM_HERMES_COMPILE=PASS"

      - name: Execute Harness-governed Hermes mission
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          args=(
            --mode "$MODE"
            --mission-id "$MISSION_ID"
            --goal-id "$GOAL_ID"
            --chat-id "$TELEGRAM_CHAT_ID_INPUT"
            --upstream-root "$BR_HERMES_UPSTREAM_ROOT"
            --artifact-dir artifacts/telegram-hermes-control
          )
          if [ "$MODE" = "start" ]; then
            args+=(
              --request-text "$REQUEST_TEXT"
              --artifact-ref "$ARTIFACT_REF"
              --artifact-text-b64 "$ARTIFACT_TEXT_B64"
              --artifact-sha256 "$ARTIFACT_SHA256"
            )
          else
            args+=(--human-answer "$HUMAN_ANSWER")
          fi
          python scripts/telegram_hermes_control_mission.py "${args[@]}" \
            2>&1 | tee artifacts/telegram-hermes-control/mission.log

      - name: Validate provider containment and safety
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("artifacts/telegram-hermes-control/telegram-hermes-control-proof.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["mission_id"] == os.environ["MISSION_ID"], d
          assert d["provider_blocker"] == "OPENCODE_EXTERNAL_403", d
          assert d["brain_status"] == "BLOCKED_PROVIDER", d
          assert d["NEW_VOICE_SYNTHESIS"] == "NO", d
          assert d["FULL_RENDER"] == "NO", d
          assert d["YOUTUBE_UPLOAD"] == "NO", d
          assert d["YOUTUBE_PUBLICATION"] == "NO", d
          if os.environ["MODE"] == "start":
              assert d["status"] == "WAITING_FOR_HUMAN", d
              assert d["task_id"] == "production-management", d
              assert len(d["authorization_audit"]) >= 5, d
          else:
              assert d["status"] == "COMPLETED_WITH_PROVIDER_BLOCK", d
              assert d["task_id"] == "production-management", d
              rows=[x for x in d["board"]["tasks"] if "production-management" in str(x.get("body") or "")]
              assert rows and rows[0]["status"] == "done", rows
          print("OPENCODE_EXTERNAL_403_CONTAINED=PASS")
          print("HARNESS_AUTHORITY_PRESERVED=PASS")
          print("NO_DIRECT_EXECUTOR_BYPASS=PASS")
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER=NO")
          print("YOUTUBE_UPLOAD=NO")
          print("YOUTUBE_PUBLICATION=NO")
          PY

      - name: Upload durable mission state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-hermes-control-${{ github.run_id }}
          path: artifacts/telegram-hermes-control/
          if-no-files-found: error
          retention-days: 30

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "telegram-hermes-control",
              "description": "Telegram -> Harness -> Hermes control mission",
              "target_url": (
                  "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d @/tmp/status.json
