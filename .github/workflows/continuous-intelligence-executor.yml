name: Continuous Intelligence Execution
run-name: Continuous Execute ${{ inputs.logical_cycle_id }}

on:
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        type: string
      expected_target_sha:
        required: true
        type: string
      expected_policy_sha256:
        required: true
        type: string
      logical_cycle_id:
        required: true
        type: string
      trigger_kind:
        required: true
        type: string
      mode:
        required: true
        type: choice
        options:
          - scheduled
          - proof
      scheduler_run_id:
        required: true
        type: string
      workflow_contract_version:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: br-continuous-intelligence-executor-${{ inputs.mode == 'proof' && inputs.logical_cycle_id || 'scheduled' }}
  cancel-in-progress: false

env:
  TARGET_REF: ${{ inputs.target_ref }}
  MODE: ${{ inputs.mode }}
  ZERO_COST_OPERATION: "TRUE"
  PYTHONPATH: .
  BR_CONTINUOUS_TARGET_REF: ${{ inputs.target_ref }}
  BR_CONTINUOUS_WORKFLOW_REVISION: ${{ github.sha }}
  BR_CONTINUOUS_LOGICAL_CYCLE_ID: ${{ inputs.logical_cycle_id }}

jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact promoted target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_target_sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact target and deployment policy before runtime
        id: target
        working-directory: target
        env:
          EXPECTED_SHA: ${{ inputs.expected_target_sha }}
          EXPECTED_POLICY_SHA256: ${{ inputs.expected_policy_sha256 }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "TARGET_SHA_DRIFT_BLOCKED expected=$EXPECTED_SHA actual=$actual" >&2
            exit 23
          fi
          actual_policy_sha="$(python3 - <<'PY'
          import hashlib, json
          payload=json.load(open("config/continuous_operation_policy.json", encoding="utf-8"))
          raw=json.dumps(
              payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          print(hashlib.sha256(raw).hexdigest())
          PY
          )"
          if [[ "$actual_policy_sha" != "$EXPECTED_POLICY_SHA256" ]]; then
            echo "DEPLOYMENT_POLICY_SHA_DRIFT_BLOCKED" >&2
            exit 24
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "CONTINUOUS_EXECUTOR_TARGET_SHA_EXACT_MATCH=PASS"
          echo "DEPLOYMENT_POLICY_BINDING=PASS"
          echo "SCHEDULER_RUN_ID=${{ inputs.scheduler_run_id }}"
          echo "LOGICAL_CYCLE_ID=${{ inputs.logical_cycle_id }}"
          echo "CONCURRENCY_EVENT_SEMANTICS=COALESCIBLE_LATEST_STATE_RECONCILIATION"

      - name: Restore prior durable attempt settlement
        id: prior
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/continuous-operation
          python3 scripts/continuous_state_checkpoint.py restore-attempt             --repository "$GITHUB_REPOSITORY"             --current-run-id "$GITHUB_RUN_ID"             --destination artifacts/continuous-operation/prior-attempt.json             --work-dir artifacts/continuous-operation/prior-attempt-restore             --workflow continuous-intelligence-executor.yml
          if [[ -s artifacts/continuous-operation/prior-attempt.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hold known deterministic defect on identical target SHA
        id: hold
        working-directory: target
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path

          target_sha=os.environ["TARGET_SHA"]
          prior_path=Path("artifacts/continuous-operation/prior-attempt.json")
          prior={}
          if prior_path.is_file():
              prior=json.loads(prior_path.read_text(encoding="utf-8"))

          held=(
              prior.get("status") in {"FAIL", "HELD_KNOWN_DEFECT"}
              and prior.get("failure_class") in {"CONTRACT_VIOLATION", "EXECUTOR_BUG"}
              and prior.get("retryability")=="NOT_RETRYABLE_ON_SAME_EXECUTABLE_SHA"
              and str(prior.get("target_sha") or "")==target_sha
              and bool(str(prior.get("failure_fingerprint") or ""))
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"held={'true' if held else 'false'}\n")

          if held:
              now=datetime.now(timezone.utc).isoformat()
              payload={
                  "schema":"ContinuousOperationAttempt/v1",
                  "run_id":os.environ.get("GITHUB_RUN_ID",""),
                  "target_ref":os.environ.get("BR_CONTINUOUS_TARGET_REF",""),
                  "target_sha":target_sha,
                  "workflow_revision":os.environ.get("BR_CONTINUOUS_WORKFLOW_REVISION",""),
                  "trigger_kind":os.environ.get("ORIGINAL_TRIGGER_KIND") or os.environ.get("GITHUB_EVENT_NAME","workflow_dispatch"),
                  "started_at":now,
                  "finished_at":now,
                  "status":"HELD_KNOWN_DEFECT",
                  "failure_class":prior["failure_class"],
                  "failure_fingerprint":prior["failure_fingerprint"],
                  "retryability":"NOT_RETRYABLE_ON_SAME_EXECUTABLE_SHA",
                  "causal_task_id":prior.get("causal_task_id"),
                  "causal_step":"PRECHECK_KNOWN_DEFECT_GATE",
                  "exception_type":prior.get("exception_type"),
                  "sanitized_error":"suppressed deterministic repeat on unchanged executable SHA",
                  "evidence_refs":[],
                  "artifact_refs":[],
                  "side_effects_started":"NO",
                  "side_effects_settled":"PASS",
                  "next_allowed_transition":"CODE_FIX_REQUIRED",
                  "wake_condition":"TARGET_SHA_CHANGED_OR_EXPLICIT_RETRY_AFTER_FIX",
              }
              out=Path("artifacts/continuous-operation/continuous-operation-attempt.json")
              out.write_text(json.dumps(payload, sort_keys=True, indent=2)+"\n", encoding="utf-8")
              print("CONTINUOUS_OPERATION_STATE=HELD_KNOWN_DEFECT")
              print("HEAVY_CYCLE_EXECUTED=NO")
          else:
              print("CONTINUOUS_OPERATION_KNOWN_DEFECT_HOLD=NOT_APPLICABLE")
          PY

      - name: Cheap source and contract preflight
        if: steps.hold.outputs.held != 'true'
        working-directory: target
        run: |
          set -euo pipefail
          python3 -m py_compile             app/services/task_result_envelope_service.py             app/services/continuous_operation_attempt_service.py             app/services/hermes_multiagent/capability_broker.py             scripts/continuous_intelligence_cycle.py             scripts/continuous_state_checkpoint.py             scripts/continuous_due_gate.py
          echo "CONTINUOUS_CHEAP_PREFLIGHT=PASS"

      - name: Setup Python
        if: steps.hold.outputs.held != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: target/requirements.txt

      - name: Install canonical target test runtime
        if: steps.hold.outputs.held != 'true'
        working-directory: target
        run: |
          set -euo pipefail
          mkdir -p artifacts/continuous-operation .runtime
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install psutil==7.2.2 pyyaml==6.0.3 python-dotenv==1.2.2 rich==14.3.3 pathspec==1.1.1

      - name: Continuous completion-contract preflight
        if: steps.hold.outputs.held != 'true'
        working-directory: target
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/target/artifacts/continuous-operation/preflight.db
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_continuous_operation_attempt.py             tests/test_continuous_operation.py             tests/test_continuous_scheduler_boundary.py             -k 'research_duration or scheduled_due_true or keyerror_is_nonretryable or failure_fingerprint or sanitizes_secret or deployment or scheduler or executor'
          echo "PRECHECK_CONTRACT_BLOCKED=NO"
          echo "TASK_RESULT_METRICS_CONTRACT=PASS"
          echo "NO_AUDIT_ORDER_DEPENDENCY=PASS"

      - name: Bootstrap pinned Hermes runtime
        if: steps.hold.outputs.held != 'true'
        working-directory: target
        run: |
          set -euo pipefail
          python scripts/bootstrap_hermes_agent.py             --target "$GITHUB_WORKSPACE/target/.runtime/hermes-agent"             --output artifacts/continuous-operation/hermes-upstream.json
          test "$(git -C "$GITHUB_WORKSPACE/target/.runtime/hermes-agent" rev-parse HEAD)" = "9eca7f388f71755293343dddd6ec4d9111d68fc4"
          echo "HERMES_UPSTREAM_PINNED=PASS"

      - name: Restore canonical continuous checkpoint
        if: steps.hold.outputs.held != 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
          BR_TEST_DATABASE: ${{ github.workspace }}/target/artifacts/continuous-operation/continuous.db
        run: |
          set -euo pipefail
          python scripts/continuous_state_checkpoint.py restore             --repository "$GITHUB_REPOSITORY"             --current-run-id "$GITHUB_RUN_ID"             --destination "$BR_TEST_DATABASE"             --work-dir artifacts/continuous-operation/restore             --workflow continuous-intelligence-executor.yml
          echo "CANONICAL_CHECKPOINT_RESTORED=PASS"

      - name: Compute policy due gates
        if: steps.hold.outputs.held != 'true'
        id: due
        working-directory: target
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/target/artifacts/continuous-operation/continuous.db
        run: |
          set -euo pipefail
          python scripts/continuous_due_gate.py --github-output "$GITHUB_OUTPUT"
          echo "DUE_GATE=PASS"

      - name: Weekly or proof regression suite
        if: steps.hold.outputs.held != 'true' && (inputs.mode == 'proof' || steps.due.outputs.weekly_due == 'true')
        working-directory: target
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/target/artifacts/continuous-operation/continuous.db
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_continuous_operation.py             tests/test_continuous_operation_attempt.py             tests/test_memory_plane_obsidian.py             tests/test_hermes_multiagent_boundary.py             tests/test_harness_learning_system.py
          echo "CONTINUOUS_REGRESSION_SUITE=PASS"

      - name: Execute one bounded continuous cycle
        if: steps.hold.outputs.held != 'true'
        working-directory: target
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/target/artifacts/continuous-operation/continuous.db
          BR_HERMES_UPSTREAM_ROOT: ${{ github.workspace }}/target/.runtime/hermes-agent
          BR_CONTINUOUS_REGRESSION_EVIDENCE: github-actions:${{ github.run_id }}:continuous-regression
          BR_CONTINUOUS_CROSS_CHANNEL_EVIDENCE: github-actions:${{ github.run_id }}:cross-channel
        run: |
          set -euo pipefail
          python scripts/continuous_intelligence_cycle.py             --mode "$MODE"             --artifact-dir artifacts/continuous-operation             --upstream-root "$BR_HERMES_UPSTREAM_ROOT"             --target-sha "${{ steps.target.outputs.sha }}"             --trigger-kind "${{ inputs.trigger_kind }}"
          echo "CONTINUOUS_CYCLE_EXECUTED=PASS"

      - name: Validate immutable safety boundaries
        if: steps.hold.outputs.held != 'true'
        working-directory: target
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/continuous-operation/continuous-operation-proof.json")
          if not p.is_file():
              p=Path("artifacts/continuous-operation/continuous-cycle.json")
          d=json.loads(p.read_text())
          assert d["status"]=="PASS"
          assert d["NEW_VOICE_SYNTHESIS"]=="NO"
          assert d["FULL_RENDER"]=="NO"
          assert d["YOUTUBE_UPLOAD"]=="NO"
          assert d["YOUTUBE_PUBLICATION"]=="NO"
          print("DEEPSEEK_HARNESS_AUTHORITY_PRESERVED=PASS")
          print("LEARNING_PLANE_AUTHORITY_PRESERVED=PASS")
          print("NO_AUTHORITY_ESCAPE=PASS")
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER=NO")
          print("YOUTUBE_UPLOAD=NO")
          print("YOUTUBE_PUBLICATION=NO")
          PY

      - name: Save canonical continuous checkpoint
        if: steps.hold.outputs.held != 'true' && success()
        working-directory: target
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/target/artifacts/continuous-operation/continuous.db
        run: |
          set -euo pipefail
          python scripts/continuous_state_checkpoint.py save             --database "$BR_TEST_DATABASE"             --output-dir artifacts/continuous-operation/state             --target-sha "${{ steps.target.outputs.sha }}"             --run-id "$GITHUB_RUN_ID"
          echo "CHECKPOINT_SAVED=PASS"

      - name: Settle workflow-level failure if cycle could not write an attempt
        if: always()
        working-directory: target
        env:
          JOB_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          EXPECTED_TARGET_SHA: ${{ inputs.expected_target_sha }}
          ORIGINAL_TRIGGER_KIND: ${{ inputs.trigger_kind }}
        run: |
          set -euo pipefail
          attempt="artifacts/continuous-operation/continuous-operation-attempt.json"
          if [[ -s "$attempt" ]]; then
            echo "FAILURE_SETTLEMENT_DURABLE=PASS"
            exit 0
          fi
          mkdir -p artifacts/continuous-operation
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from hashlib import sha256
          from pathlib import Path

          now=datetime.now(timezone.utc).isoformat()
          target_sha=(
              os.environ.get("TARGET_SHA")
              or os.environ.get("EXPECTED_TARGET_SHA")
              or ""
          )
          job_status=os.environ.get("JOB_STATUS","failure")
          failure_class="PRECHECK_CONTRACT_BLOCKED" if job_status!="success" else None
          fingerprint=None
          if failure_class:
              raw=f"{target_sha}|{os.environ.get('GITHUB_SHA','')}|{failure_class}|WORKFLOW_BOUNDARY"
              fingerprint=sha256(raw.encode()).hexdigest()
          payload={
              "schema":"ContinuousOperationAttempt/v1",
              "run_id":os.environ.get("GITHUB_RUN_ID",""),
              "target_ref":os.environ.get("BR_CONTINUOUS_TARGET_REF",""),
              "target_sha":target_sha,
              "workflow_revision":os.environ.get("BR_CONTINUOUS_WORKFLOW_REVISION",""),
              "trigger_kind":os.environ.get("GITHUB_EVENT_NAME","workflow_dispatch"),
              "started_at":now,
              "finished_at":now,
              "status":"FAIL" if failure_class else "PASS",
              "failure_class":failure_class,
              "failure_fingerprint":fingerprint,
              "retryability":"NOT_RETRYABLE_ON_SAME_EXECUTABLE_SHA" if failure_class else "NOT_APPLICABLE",
              "causal_task_id":None,
              "causal_step":"WORKFLOW_PREFLIGHT_OR_BOUNDARY",
              "exception_type":None,
              "sanitized_error":"workflow boundary failed before cycle settlement" if failure_class else None,
              "evidence_refs":[],
              "artifact_refs":[],
              "side_effects_started":"NO" if failure_class else "BOUNDED_BY_POLICY",
              "side_effects_settled":"PASS" if failure_class else "PASS",
              "next_allowed_transition":"CODE_FIX_REQUIRED" if failure_class else "SCHEDULE_NEXT_DUE",
              "wake_condition":"TARGET_SHA_CHANGED_OR_EXPLICIT_RETRY_AFTER_FIX" if failure_class else None,
          }
          Path("artifacts/continuous-operation/continuous-operation-attempt.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2)+"\n", encoding="utf-8"
          )
          PY
          echo "FAILURE_SETTLEMENT_DURABLE=PASS"

      - name: Upload canonical checkpoint transport
        if: steps.hold.outputs.held != 'true' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuous-operation-state-${{ github.run_id }}
          path: target/artifacts/continuous-operation/state/
          if-no-files-found: error
          retention-days: 90

      - name: Upload durable attempt settlement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuous-operation-attempt-${{ github.run_id }}
          path: target/artifacts/continuous-operation/continuous-operation-attempt.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload continuous evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuous-operation-${{ github.run_id }}
          path: |
            target/artifacts/continuous-operation/*.json
            target/artifacts/continuous-operation/baseline/
            target/artifacts/continuous-operation/candidate-trial/
            target/artifacts/continuous-operation/related-next-run/
            target/artifacts/continuous-operation/gta6-intelligence/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish target operation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/status.json
          import json, os
          from pathlib import Path

          attempt_path=Path("target/artifacts/continuous-operation/continuous-operation-attempt.json")
          attempt=json.loads(attempt_path.read_text(encoding="utf-8"))
          status=str(attempt.get("status") or "")
          if status=="PASS":
              state="success"
              description="Continuous operation settled"
          elif status=="HELD_KNOWN_DEFECT":
              state="error"
              description=(
                  f"HELD_KNOWN_DEFECT:{attempt.get('failure_class')}:"
                  f"{attempt.get('failure_fingerprint')}"
              )[:140]
          else:
              state="failure"
              description=(
                  f"Continuous failure:{attempt.get('failure_class') or 'UNKNOWN'}:"
                  f"{str(attempt.get('failure_fingerprint') or '')[:16]}"
              )[:140]
          print(json.dumps({
              "state":state,
              "context":"continuous-intelligence-operation",
              "description":description,
              "target_url":"https://github.com/"+os.environ["GITHUB_REPOSITORY"]+
                  "/actions/runs/"+os.environ["GITHUB_RUN_ID"],
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA"             -d @/tmp/status.json
