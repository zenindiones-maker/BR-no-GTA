name: OmniRoute AI Gateway
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: "health"
      execution_id:
        required: false
        default: ""
      provider:
        required: false
        default: ""
      model:
        required: false
        default: ""
      prompt_b64:
        required: false
        default: ""
      zero_cost_operation:
        required: true
        default: "true"
      source_sha:
        required: false
        default: ""
permissions:
  contents: read
jobs:
  omniroute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact dispatched source revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_SHA" ]; then
            test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
            echo "OPENCODE_SOURCE_SHA_PIN=PASS"
          fi
      - name: Enforce bounded zero-cost mode
        env:
          MODE: ${{ inputs.mode }}
          ZERO_COST_OPERATION: ${{ inputs.zero_cost_operation }}
        run: |
          set -euo pipefail
          test "$ZERO_COST_OPERATION" = "true"
          case "$MODE" in health|execute|opencode_native) ;; *) exit 2;; esac
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned OmniRoute
        if: ${{ inputs.mode == 'health' || inputs.mode == 'execute' }}
        run: |
          set -euo pipefail
          npm install -g omniroute@3.8.50
          omniroute --version
      - name: Start OmniRoute
        if: ${{ inputs.mode == 'health' || inputs.mode == 'execute' }}
        run: |
          set -euo pipefail
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then cat /tmp/omniroute.log || true; fi' EXIT
          OMNIROUTE_SERVER_HOST=127.0.0.1 nohup omniroute serve > /tmp/omniroute.log 2>&1 &
          pid=$!
          echo "$pid" > /tmp/omniroute.pid
          for i in {1..30}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo 'OmniRoute exited before readiness'
              exit 1
            fi
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:20128/api/monitoring/health >/tmp/omniroute-health.json 2>/dev/null; then
              kill -0 "$pid"
              python - <<'PY_BIND'
          import subprocess
          rows = subprocess.check_output(
              ["ss", "-H", "-ltn", "sport = :20128"], text=True
          ).splitlines()
          assert rows, "No gateway listener found"
          addresses = [row.split()[3] for row in rows]
          assert all(address in {"127.0.0.1:20128", "[::1]:20128"} for address in addresses), addresses
          PY_BIND
              cat /tmp/omniroute-health.json
              echo 'OMNIROUTE_HEALTH_ENDPOINT=/api/monitoring/health'
              exit 0
            fi
            sleep 2
          done
          echo 'OmniRoute readiness timed out'
          exit 1
      - name: Execute explicit free provider/model
        if: ${{ inputs.mode == 'execute' }}
        env:
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          PROMPT_B64: ${{ inputs.prompt_b64 }}
        run: |
          set -euo pipefail
          test -n "$PROVIDER"; test -n "$MODEL"; test -n "$PROMPT_B64"
          test "$PROVIDER" != "auto"
          case "$MODEL" in auto|auto/*) echo 'autonomous routing forbidden'; exit 3;; esac
          test "$PROVIDER" = "opencode"
          case "$MODEL" in oc/*) ;; *) echo 'model must be explicit OpenCode Free oc/*'; exit 4;; esac
          python - <<'PY'
          import base64, json, os, pathlib, time, urllib.request
          provider=os.environ['PROVIDER']; model=os.environ['MODEL']; prompt=base64.b64decode(os.environ['PROMPT_B64']).decode()
          started=time.monotonic()
          req=urllib.request.Request(f'http://127.0.0.1:20128/v1/providers/{provider}/chat/completions',data=json.dumps({'model':model,'messages':[{'role':'user','content':prompt}],'stream':False}).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=180) as resp: payload=json.loads(resp.read().decode())
          reported_model=str(payload.get('model') or '')
          valid_reported_model = reported_model == model or (
              provider == 'opencode' and model.startswith('oc/') and reported_model == model.removeprefix('oc/')
          )
          if not valid_reported_model: raise SystemExit(f'model mismatch expected={model!r} reported={reported_model!r}')
          choices=payload.get('choices') or []; text=str((choices[0].get('message') or {}).get('content') or '') if choices else ''
          if not text: raise SystemExit('empty result')
          warnings=[]
          if reported_model != model: warnings.append(f'provider_reported_model_alias:{reported_model}')
          out={'status':'EXECUTED','provider':provider,'model':model,'reported_model':reported_model,'text':text,'omniroute_version':'3.8.50','runtime_identity':'github-actions:ubuntu-latest:node24','elapsed_seconds':time.monotonic()-started,'fallback_occurred':False,'retry_count':0,'warnings':warnings,'errors':[]}
          p=pathlib.Path('runtime/omniroute-result'); p.mkdir(parents=True,exist_ok=True); (p/'result.json').write_text(json.dumps(out,sort_keys=True))
          PY
      - if: ${{ inputs.mode == 'execute' }}
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-result
          path: runtime/omniroute-result/result.json
          retention-days: 1
          if-no-files-found: error

      - name: Install pinned official OpenCode CLI
        if: ${{ inputs.mode == 'opencode_native' }}
        run: |
          set -euo pipefail
          npm install -g "@opencode/cli@2.0.8"
          REPORTED="$(opencode --version | awk '{print $NF}' | tr -d '\r' | sed -E 's/^v//')"
          test "$REPORTED" = "2.0.8"

      - name: Execute governed OpenCode CLI
        if: ${{ inputs.mode == 'opencode_native' }}
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          PROMPT_B64: ${{ inputs.prompt_b64 }}
          OPENCODE_DISABLE_AUTOCOMPACT: "true"
        run: |
          set -euo pipefail
          test -n "$EXECUTION_ID"
          test "$PROVIDER" = "opencode"
          test "$MODEL" = "oc/big-pickle"
          test -n "$PROMPT_B64"
          mkdir -p runtime/opencode-native-result runtime/opencode-native-workdir
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from app.services.opencode_semantic_profile import (
              semantic_profile_evidence,
              semantic_text_only_config_json,
              semantic_text_only_prompt,
          )
          prompt=base64.b64decode(os.environ["PROMPT_B64"], validate=True).decode("utf-8")
          if not prompt.strip():
              raise SystemExit("empty prompt")
          result_root=Path("runtime/opencode-native-result")
          (result_root/"prompt.txt").write_text(
              semantic_text_only_prompt(prompt),
              encoding="utf-8",
          )
          (result_root/"opencode-config.json").write_text(
              semantic_text_only_config_json(),
              encoding="utf-8",
          )
          (result_root/"semantic-profile.json").write_text(
              json.dumps(semantic_profile_evidence(), sort_keys=True),
              encoding="utf-8",
          )
          PY
          START="$(python - <<'PY'
          import time
          print(time.time())
          PY
          )"
          set +e
          ROOT="$PWD"
          PROMPT="$(cat runtime/opencode-native-result/prompt.txt)"
          export OPENCODE_CONFIG_CONTENT="$(cat runtime/opencode-native-result/opencode-config.json)"
          SEMANTIC_AGENT="build"
          (
            cd runtime/opencode-native-workdir
            timeout 180 opencode run \
              --standalone \
              --model "opencode/big-pickle" \
              --agent "$SEMANTIC_AGENT" \
              --format json \
              "$PROMPT"
          ) > "$ROOT/runtime/opencode-native-result/stdout.ndjson" \
            2> "$ROOT/runtime/opencode-native-result/stderr.txt"
          RC=$?
          set -e
          END="$(python - <<'PY'
          import time
          print(time.time())
          PY
          )"
          RC="$RC" START="$START" END="$END" python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root=Path("runtime/opencode-native-result")
          stdout=(root/"stdout.ndjson").read_text(encoding="utf-8", errors="replace")
          stderr=(root/"stderr.txt").read_text(encoding="utf-8", errors="replace")
          rc=int(os.environ["RC"])
          parts=[]; parse_errors=0; tool_call_count=0
          event_types=[]; tool_events=[]; error_events=[]
          for raw in stdout.splitlines():
              if not raw.strip():
                  continue
              try:
                  item=json.loads(raw)
              except json.JSONDecodeError:
                  parse_errors+=1
                  continue
              event_type=str(item.get("type") or "")
              event_types.append(event_type)
              if event_type in {"tool_use","tool_call","tool"}:
                  tool_call_count+=1
                  part=item.get("part") if isinstance(item.get("part"),dict) else {}
                  state=part.get("state") if isinstance(part.get("state"),dict) else {}
                  tool_events.append({
                      "tool":str(item.get("tool") or item.get("name") or part.get("tool") or part.get("name") or "")[:120],
                      "status":str(item.get("status") or part.get("status") or state.get("status") or "")[:80],
                  })
              if event_type=="error":
                  candidate=item.get("error") or item.get("message") or item.get("data")
                  if candidate:
                      safe=re.sub(
                          r"(?i)(authorization:|bearer\\s+|api[_-]?key|token=|sk-|ghp_|github_pat_)[^\\s,;]*",
                          "[REDACTED]",
                          str(candidate)[:1600],
                      )
                      error_events.append(safe)
              if event_type!="text":
                  continue
              part=item.get("part") or {}
              value=part.get("text")
              if isinstance(value,str) and value:
                  parts.append(value)
          answer="".join(parts).strip()
          safe_stderr=[]
          for line in stderr.splitlines():
              low=line.lower()
              if any(term in low for term in ("authorization:", "bearer ", "api_key", "apikey", "token=")):
                  continue
              if re.search(r"(sk-|ghp_|github_pat_)[A-Za-z0-9_-]{8,}", line):
                  continue
              safe_stderr.append(line[:500])
          elapsed=max(0.0,float(os.environ["END"])-float(os.environ["START"]))
          profile=json.loads((root/"semantic-profile.json").read_text(encoding="utf-8"))
          semantic_pass=rc==0 and bool(answer) and tool_call_count==0
          result={
              "status":"EXECUTED" if semantic_pass else "FAILED",
              "provider":"opencode",
              "canonical_model":"oc/big-pickle",
              "executor_model":"opencode/big-pickle",
              "text":answer,
              "cli_version":"2.0.8",
              "runtime_identity":"github-actions:ubuntu-latest:node24:opencode-cli",
              "execution_id":os.environ["EXECUTION_ID"],
              "elapsed_seconds":elapsed,
              "fallback_occurred":False,
              "retry_count":0,
              "exit_code":rc,
              "stdout_sha256":hashlib.sha256(stdout.encode()).hexdigest(),
              "stderr_sha256":hashlib.sha256(stderr.encode()).hexdigest(),
              "parse_errors":parse_errors,
              "tool_call_count":tool_call_count,
              "tool_events":tool_events,
              "error_events":error_events[-20:],
              "event_types":event_types,
              "semantic_agent":profile["semantic_agent"],
              "semantic_profile_version":profile["profile_version"],
              "semantic_contract":profile["semantic_contract"],
              "semantic_steps":profile["semantic_steps"],
              "semantic_tools_policy":"deny-all",
              "tools_exposed":0 if tool_call_count==0 else tool_call_count,
              "semantic_text_only_pass":semantic_pass,
              "safe_stderr":safe_stderr[-20:],
          }
          (root/"result.json").write_text(json.dumps(result,sort_keys=True),encoding="utf-8")
          print(json.dumps({
              "status":result["status"],
              "provider":result["provider"],
              "canonical_model":result["canonical_model"],
              "executor_model":result["executor_model"],
              "cli_version":result["cli_version"],
              "elapsed_seconds":result["elapsed_seconds"],
              "exit_code":result["exit_code"],
              "usable_text":bool(answer),
              "tool_call_count":tool_call_count,
              "tools_exposed":result["tools_exposed"],
              "semantic_agent":result["semantic_agent"],
              "semantic_profile_version":result["semantic_profile_version"],
              "semantic_text_only_pass":result["semantic_text_only_pass"],
              "fallback_occurred":False,
          },sort_keys=True))
          if tool_call_count != 0:
              print("OPENCODE_NATIVE_ERROR=semantic_tools_used")
              raise SystemExit(9)
          if result["status"]!="EXECUTED":
              print("OPENCODE_NATIVE_ERROR=native_execution_failed")
              raise SystemExit(rc or 1)
          print("OPENCODE_NATIVE_SEMANTIC_AGENT="+result["semantic_agent"])
          print("OPENCODE_NATIVE_SEMANTIC_PROFILE="+result["semantic_profile_version"])
          print("OPENCODE_NATIVE_SEMANTIC_TOOLS=DENY_ALL")
          print("OPENCODE_NATIVE_TOOLS_EXPOSED=0")
          print("OPENCODE_NATIVE_TOOL_CALL_COUNT=0")
          print("SEMANTIC_TEXT_ONLY=PASS")
          PY
          rm -f runtime/opencode-native-result/prompt.txt
          rm -rf runtime/opencode-native-workdir

      - name: Upload governed OpenCode native result
        if: ${{ always() && inputs.mode == 'opencode_native' }}
        uses: actions/upload-artifact@v4
        with:
          name: opencode-native-result
          path: |
            runtime/opencode-native-result/result.json
            runtime/opencode-native-result/stdout.ndjson
            runtime/opencode-native-result/stderr.txt
            runtime/opencode-native-result/semantic-profile.json
          retention-days: 7
          if-no-files-found: error

      - name: Shutdown OmniRoute
        if: always()
        run: |
          if [ -f /tmp/omniroute.pid ]; then kill "$(cat /tmp/omniroute.pid)" 2>/dev/null || true; fi
