name: Agent Tooling Bootstrap

on:
  push:
    branches:
      - codex/run-001-app
      - work/gate6f-analytics-learning
    paths:
      - '.github/workflows/agent-tooling-bootstrap.yml'
      - 'scripts/agent-tooling/**'
      - 'tests/test_agent_tooling_bootstrap.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-agent-tooling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Claude Code bootstrap contract
        run: python3 tests/test_agent_tooling_bootstrap.py

      - name: Restore pinned development tooling
        run: bash scripts/agent-tooling/bootstrap.sh all

      - name: Verify pinned Claude Code
        run: |
          case "$(claude --version)" in
            2.1.283*) ;;
            *) echo "CLAUDE_CODE_VERSION_MISMATCH" >&2; exit 1 ;;
          esac
          claude --help >/dev/null
          echo "CLAUDE_CODE_RUNTIME_PROOF=PASS"

      - name: Verify native Codex discovery without model calls
        run: python3 scripts/agent-tooling/check_discovery.py all
