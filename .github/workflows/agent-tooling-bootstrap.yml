name: Agent Tooling Bootstrap

on:
  push:
    branches:
      - codex/run-001-app
    paths:
      - '.github/workflows/agent-tooling-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-agent-tooling:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Higgsfield CLI
        run: |
          npm install -g @higgsfield/cli
          higgsfield version

      - name: Install selected Higgsfield skills
        run: |
          npx -y skills@1.5.26 add higgsfield-ai/skills \
            --skill higgsfield-generate \
            --skill higgsfield-youtube-thumbnail \
            --skill higgsfield-brandkit \
            --skill higgsfield-video-explainer \
            -y

      - name: Install compatible Agent Skills
        run: |
          npx -y skills@1.5.26 add addyosmani/agent-skills \
            --skill api-and-interface-design \
            --skill ci-cd-and-automation \
            --skill code-review-and-quality \
            --skill code-simplification \
            --skill constraint-driven-development \
            --skill context-engineering \
            --skill debugging-and-error-recovery \
            --skill deprecation-and-migration \
            --skill documentation-and-adrs \
            --skill doubt-driven-development \
            --skill frontend-ui-engineering \
            --skill git-workflow-and-versioning \
            --skill idea-refine \
            --skill incremental-implementation \
            --skill interview-me \
            --skill observability-and-instrumentation \
            --skill performance-optimization \
            --skill planning-and-task-breakdown \
            --skill security-and-hardening \
            --skill shipping-and-launch \
            --skill source-driven-development \
            --skill spec-driven-development \
            --skill test-driven-development \
            --skill using-agent-skills \
            -y

      - name: Show installed skills
        run: |
          npx -y skills@1.5.26 list
