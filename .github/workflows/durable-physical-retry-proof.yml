name: Durable Physical Retry Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - 'app/services/production_durable_resume_service.py'
      - '.github/workflows/real-multi-agent-production.yml'
      - 'tests/test_production_durable_resume_service.py'
      - 'tests/test_production_durable_resume_workflow.py'
      - '.github/workflows/durable-physical-retry-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install focused runtime
        run: |
          python -m pip install -q -r requirements.txt pytest
      - name: Prove durable physical retry contracts
        run: |
          pytest -q             tests/test_production_durable_resume_service.py             tests/test_production_durable_resume_workflow.py
