name: BR V18 Owner Ledger Specialist Read-Only
on:
  push:
    branches:
      - work/br-specialist-delivery-reconcile-v18
    paths:
      - "app/services/br_owner_delivery_reconcile_specialist_v18.py"
      - "tests/test_br_owner_delivery_reconcile_v18.py"
      - ".github/workflows/br-owner-delivery-readback-v18.yml"
      - "docs/architecture/br-specialist-delivery-v18.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: br-owner-ledger-specialist-v18-${{ github.ref }}
  cancel-in-progress: false
jobs:
  read-only-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install minimal prerequisites
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check pytest==8.4.2 python-dotenv==1.2.3
      - name: Prove bounded old-CAS guards and new no-send classifier
        run: |
          set -euo pipefail
          export BR_TEST_DATABASE="$RUNNER_TEMP/br-v18-ledger-read-auth.db"
          python - <<'PY'
          from app.database.schema import initialize_schema
          initialize_schema()
          PY
          python -m pytest -q \
            tests/test_br_owner_delivery_reconcile_v18.py \
            tests/test_owner_voice_ledger_transient_v13.py
          echo "BR_V18_OWNER_LEDGER_READ_ONLY_POLICY=PASS"
          echo "BR_V18_GIT_PUSH_ATTEMPTED=FALSE"
          echo "BR_V18_TELEGRAM_SEND_ATTEMPTED=FALSE"
          echo "BR_V18_REMOTE_PRIVATE_READBACK_BY_CI=NOT_ATTEMPTED"
          echo "BR_V18_OWNER_IDENTITY_APPROVED=FALSE"
