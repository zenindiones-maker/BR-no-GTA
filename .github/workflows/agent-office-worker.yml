name: Agent Office Worker

on:
  push:
    branches:
      - work/munder-difflin-agent-office
      - work/gate6f-analytics-learning
    paths:
      - "app/services/agent_office/**"
      - "app/services/agent_office_harness_service.py"
      - "integrations/munder_difflin/**"
      - "scripts/agent_office_*.py"
      - "tests/test_agent_office.py"
      - ".github/workflows/agent-office-worker.yml"
      - ".run/agent-office-execution-plane-canary.request.json"
  workflow_dispatch:
    inputs:
      branch:
        description: Exact authorized branch
        required: true
        type: string
      base_sha:
        description: Exact authorized base SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  bounded-read-only-mission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact mission revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.base_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bounded runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate Agent Office boundary
        run: |
          python scripts/agent_office_preflight.py
          python -m pytest -q tests/test_agent_office.py

      - name: Execute Harness-authorized read-only mission
        env:
          MISSION_BRANCH: ${{ inputs.branch || github.ref_name }}
          MISSION_BASE_SHA: ${{ inputs.base_sha || github.sha }}
        run: |
          python scripts/agent_office_canary.py \
            --branch "${MISSION_BRANCH}" \
            --base-sha "${MISSION_BASE_SHA}" \
            --output agent-office-evidence/result.json
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload bounded mission evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-office-worker-${{ github.run_id }}
          path: agent-office-evidence/result.json
          if-no-files-found: error
          retention-days: 14
