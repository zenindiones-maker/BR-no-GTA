name: VIDEO A Editorial Human Review Delivery

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/video-a-editorial-human-review-ready.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-a-editorial-human-review-delivery
  cancel-in-progress: true

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exact editorial review package
        run: |
          set -euo pipefail
          mkdir -p runtime/video-a-editorial-review
          python -m py_compile scripts/video_a_prepare_editorial_review.py
          python scripts/video_a_prepare_editorial_review.py \
            --output-dir runtime/video-a-editorial-review
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("runtime/video-a-editorial-review")
          m=json.loads((root/"review-metrics.json").read_text(encoding="utf-8"))
          assert m["EXTENDED_LOOK_FINDINGS_TOTAL"]==31,m
          assert m["META_PRODUCTION_LEAKAGE"]==0,m
          assert m["SCRIPT_HUMAN_REVIEW"]=="PENDING",m
          assert m["WAITING_FOR_HUMAN_REVIEW"]=="YES",m
          assert m["REVIEW_TARGET"]=="SCRIPT",m
          print("EDITORIAL_REVIEW_PACKAGE=PASS")
          print("FULL_RENDER_AUTHORIZED=NO")
          print("VOICE_SYNTHESIS=NO")
          print("VISUAL_COVERAGE_WORK=NO")
          PY

      - name: Deliver genuine SCRIPT_HUMAN_REVIEW_READY through Harness boundary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID || secrets.TELEGRAM_REVIEW_CHAT_ID }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_REVIEW_CHAT_ID || secrets.TELEGRAM_REVIEW_CHAT_ID }}
          BR_TEST_DATABASE: ${{ github.workspace }}/runtime/video-a-editorial-review/harness-delivery.db
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          test -n "${TELEGRAM_REVIEW_CHAT_ID:-}"
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from app.database.schema import initialize_schema
          from app.services.harness_authorization_service import (
              consume_harness_authorization,
              issue_harness_authorization,
          )
          from app.services.telegram_group_human_surface_service import (
              SCRIPT_HUMAN_REVIEW_READY,
              send_harness_message_to_human_group,
          )

          root=Path("runtime/video-a-editorial-review")
          checkpoint=Path(".run/video-a-editorial-review-delivery-checkpoint.json")
          delivery=json.loads((root/"editorial-delivery-manifest.json").read_text(encoding="utf-8"))
          presentation=json.loads((root/"telegram-presentation-manifest.json").read_text(encoding="utf-8"))
          order=[
              line.strip()
              for line in (root/"telegram-message-order.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          assert delivery["deliverable_type"]=="SCRIPT",delivery
          assert delivery["status"]=="READY_FOR_HUMAN_REVIEW",delivery
          assert delivery["complete_script_present"] is True,delivery
          assert delivery["artifact_origin"]=="EDITORIAL_PIPELINE",delivery
          assert delivery["artifact_real"] is True,delivery
          assert delivery["technical_qa_human_egress"]=="FORBIDDEN",delivery
          assert presentation["TECHNICAL_QA_HUMAN_EGRESS"]=="FORBIDDEN",presentation
          assert not any("-qa-" in name for name in order),order
          assert any("-summary-" in name for name in order),order
          assert any("-evidence-" in name for name in order),order
          assert any("-outline-" in name for name in order),order
          assert any("-script-" in name for name in order),order

          artifact_file=Path(delivery["artifact_file"])
          assert artifact_file.is_file(),artifact_file
          digest=hashlib.sha256(artifact_file.read_bytes()).hexdigest()
          # The artifact file is newline-terminated; the manifest hash is over
          # the exact canonical script text without that transport newline.
          canonical_script=artifact_file.read_text(encoding="utf-8").rstrip("\n")
          canonical_digest=hashlib.sha256(canonical_script.encode("utf-8")).hexdigest()
          assert canonical_digest==delivery["content_sha256"],(canonical_digest,delivery)
          artifact_file.write_text(canonical_script,encoding="utf-8")
          assert hashlib.sha256(artifact_file.read_bytes()).hexdigest()==delivery["content_sha256"]

          lineage={
              **delivery,
              "artifact_file":str(artifact_file),
          }

          delivered={}
          if checkpoint.is_file():
              prior=json.loads(checkpoint.read_text(encoding="utf-8"))
              if prior.get("presentation_id")==presentation["presentation_id"]:
                  delivered={
                      str(k):int(v)
                      for k,v in (prior.get("delivered") or {}).items()
                      if str(k) in order
                  }

          initialize_schema()
          authorization=issue_harness_authorization(
              authorized_action="EXECUTION",
              subject="human-surface:telegram_group",
              execution_id="video-a-editorial-human-review-delivery",
              lineage={
                  "authority":"DEEPSEEK_HARNESS",
                  "purpose":"SCRIPT_HUMAN_REVIEW_READY",
                  "editorial_artifact_id":delivery["editorial_artifact_id"],
                  "artifact_ref":delivery["artifact_ref"],
              },
          )
          try:
              for filename in order:
                  if filename in delivered:
                      print("TELEGRAM_RESUME_SKIP="+filename)
                      continue
                  text=(root/"telegram-human-readable"/filename).read_text(encoding="utf-8").strip()
                  result=send_harness_message_to_human_group(
                      authorization=authorization,
                      text=text,
                      category=SCRIPT_HUMAN_REVIEW_READY,
                      lineage=lineage,
                      deliverable_type="SCRIPT",
                      deliverable_status="READY_FOR_HUMAN_REVIEW",
                      complete_script_present=True,
                      harness_authorized=True,
                  )
                  assert result["status"]=="SENT",result
                  assert result["TELEGRAM_SEND"]=="YES",result
                  assert result["transport_mode"]=="TELEGRAM_NETWORK",result
                  message_id=result["telegram_message_id"]
                  assert isinstance(message_id,int),result
                  delivered[filename]=message_id
          finally:
              consume_harness_authorization(authorization)

          assert list(delivered)==order,(delivered,order)
          (root/"telegram-editorial-message-ids.txt").write_text(
              "\n".join(f"{name}={delivered[name]}" for name in order)+"\n",
              encoding="utf-8",
          )
          metrics=json.loads((root/"review-metrics.json").read_text(encoding="utf-8"))
          state={
              **metrics,
              "TELEGRAM_EDITORIAL_MESSAGE_IDS":delivered,
              "TELEGRAM_PRESENTATION_ID":presentation["presentation_id"],
              "HUMAN_PRESENTATION":"TELEGRAM_TEXT",
              "TECHNICAL_ATTACHMENTS_TO_HUMAN":"NO",
              "SCRIPT_HUMAN_REVIEW":"PENDING",
              "DELIVERABLE_STATUS":"READY_FOR_HUMAN_REVIEW",
              "PRODUCTION_READINESS":"FAIL",
              "FULL_RENDER_AUTHORIZED":"NO",
              "YOUTUBE_PUBLICATION":"NO",
              "WAITING_FOR_HUMAN_REVIEW":"YES",
              "REVIEW_TARGET":"SCRIPT",
              "NEW_VOICE_SYNTHESIS":"NO",
              "VISUAL_COVERAGE_WORK":"NO",
              "OPERATIONAL_TELEMETRY_PRESENT":"NO",
          }
          (root/"waiting-for-human-review.json").write_text(
              json.dumps(state,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          print("SCRIPT_HUMAN_REVIEW_READY_DELIVERY=PASS")
          print("HARNESS_AUTHORIZATION_REQUIRED=PASS")
          print("GENUINE_EDITORIAL_SCRIPT_REAL_DELIVERY=ALLOWED")
          print("OPERATIONAL_TELEMETRY_PRESENT=NO")
          print("TECHNICAL_QA_HUMAN_EGRESS=FORBIDDEN")
          PY

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-a-editorial-human-review-${{ github.run_id }}
          path: runtime/video-a-editorial-review/
          if-no-files-found: warn
          retention-days: 30
