name: VIDEO A Editorial Human Review Delivery

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/video-a-editorial-human-review-ready.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-a-editorial-human-review-delivery
  cancel-in-progress: true

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exact editorial review package
        run: |
          set -euo pipefail
          mkdir -p runtime/video-a-editorial-review
          python -m py_compile scripts/video_a_prepare_editorial_review.py
          python scripts/video_a_prepare_editorial_review.py \
            --output-dir runtime/video-a-editorial-review
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("runtime/video-a-editorial-review")
          m=json.loads((root/"review-metrics.json").read_text(encoding="utf-8"))
          assert m["EXTENDED_LOOK_FINDINGS_TOTAL"]==31,m
          assert m["META_PRODUCTION_LEAKAGE"]==0,m
          assert m["SCRIPT_HUMAN_REVIEW"]=="PENDING",m
          assert m["WAITING_FOR_HUMAN_REVIEW"]=="YES",m
          assert m["REVIEW_TARGET"]=="SCRIPT",m
          print("EDITORIAL_REVIEW_PACKAGE=PASS")
          print("FULL_RENDER_AUTHORIZED=NO")
          print("VOICE_SYNTHESIS=NO")
          print("VISUAL_COVERAGE_WORK=NO")
          PY

      - name: Send human-readable editorial review to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID || secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          set -euo pipefail
          root="runtime/video-a-editorial-review"
          checkpoint=".run/video-a-editorial-review-delivery-checkpoint.json"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_REVIEW_CHAT_ID"
          test -f "$root/telegram-message-order.txt"

          presentation_id="$(python - <<'PY'
          import json
          print(json.load(open("runtime/video-a-editorial-review/telegram-presentation-manifest.json",encoding="utf-8"))["presentation_id"])
          PY
          )"
          : > "$root/telegram-editorial-message-ids.txt"

          if test -f "$checkpoint"; then
            PRESENTATION_ID="$presentation_id" CHECKPOINT="$checkpoint" python - <<'PY' > "$root/telegram-editorial-message-ids.txt"
          import json,os
          d=json.load(open(os.environ["CHECKPOINT"],encoding="utf-8"))
          if d.get("presentation_id")==os.environ["PRESENTATION_ID"]:
              for filename,message_id in (d.get("delivered") or {}).items():
                  print(f"{filename}={message_id}")
          PY
          fi

          while IFS= read -r filename; do
            test -n "$filename" || continue
            if awk -F= -v f="$filename" '$1==f {found=1} END {exit !found}' "$root/telegram-editorial-message-ids.txt"; then
              echo "TELEGRAM_RESUME_SKIP=$filename"
              continue
            fi

            path="$root/telegram-human-readable/$filename"
            test -s "$path"
            body="$root/telegram-response.json"
            sent="NO"

            for attempt in 1 2 3 4 5 6 7 8; do
              http_code="$(curl --silent --show-error \
                -o "$body" \
                -w "%{http_code}" \
                -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                --data-urlencode "chat_id=$TELEGRAM_REVIEW_CHAT_ID" \
                --data-urlencode "text@$path")"

              if test "$http_code" = "200"; then
                RESPONSE_FILE="$body" FILE="$filename" python - <<'PY' >> "$root/telegram-editorial-message-ids.txt"
          import json,os
          d=json.load(open(os.environ["RESPONSE_FILE"],encoding="utf-8"))
          assert d.get("ok") is True,d
          print(os.environ["FILE"]+"="+str(d["result"]["message_id"]))
          PY
                sent="YES"
                break
              fi

              if test "$http_code" = "429"; then
                retry_after="$(BODY="$body" python - <<'PY'
          import json,os
          try:
              d=json.load(open(os.environ["BODY"],encoding="utf-8"))
              print(int((d.get("parameters") or {}).get("retry_after") or 5))
          except Exception:
              print(5)
          PY
                )"
                echo "TELEGRAM_RATE_LIMIT filename=$filename retry_after=$retry_after attempt=$attempt"
                sleep "$((retry_after + 2))"
                continue
              fi

              echo "TELEGRAM_SEND_FAIL filename=$filename http_code=$http_code"
              cat "$body"
              exit 1
            done

            test "$sent" = "YES"
            # Group chats are rate-limited more strictly than the global bot limit.
            sleep 4
          done < "$root/telegram-message-order.txt"

          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("runtime/video-a-editorial-review")
          ids={}
          for line in (root/"telegram-editorial-message-ids.txt").read_text().splitlines():
              k,v=line.split("=",1); ids[k]=int(v)
          metrics=json.loads((root/"review-metrics.json").read_text())
          manifest=json.loads((root/"telegram-presentation-manifest.json").read_text())
          assert len(ids)==manifest["message_count"],(ids,manifest)
          assert list(ids)==manifest["order"],(ids,manifest)
          state={
              **metrics,
              "TELEGRAM_EDITORIAL_MESSAGE_IDS":ids,
              "TELEGRAM_PRESENTATION_ID":manifest["presentation_id"],
              "HUMAN_PRESENTATION":"TELEGRAM_TEXT",
              "TECHNICAL_ATTACHMENTS_TO_HUMAN":"NO",
              "SCRIPT_HUMAN_REVIEW":"PENDING",
              "HUMAN_VOICE_REVIEW":"REJECTED",
              "PRODUCTION_READINESS":"FAIL",
              "FULL_RENDER_AUTHORIZED":"NO",
              "YOUTUBE_PUBLICATION":"NO",
              "WAITING_FOR_HUMAN_REVIEW":"YES",
              "REVIEW_TARGET":"SCRIPT",
              "NEW_VOICE_SYNTHESIS":"NO",
              "VISUAL_COVERAGE_WORK":"NO",
          }
          (root/"waiting-for-human-review.json").write_text(json.dumps(state,ensure_ascii=False,indent=2),encoding="utf-8")
          print("TELEGRAM_EDITORIAL_MESSAGE_IDS="+json.dumps(ids,separators=(",",":")))
          print("HUMAN_PRESENTATION=TELEGRAM_TEXT")
          print("TECHNICAL_ATTACHMENTS_TO_HUMAN=NO")
          print("SCRIPT_HUMAN_REVIEW=PENDING")
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER_AUTHORIZED=NO")
          PY

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-a-editorial-human-review-${{ github.run_id }}
          path: runtime/video-a-editorial-review/
          if-no-files-found: warn
          retention-days: 30
