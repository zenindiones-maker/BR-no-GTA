name: PyAV Compatibility Smoke Test

on:
  push:
    branches:
      - fix/ptbr-pyav-runtime-and-recovery-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decode-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/ptbr-pyav-runtime-and-recovery-v1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned decoder runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "av==18.0.0" "faster-whisper==1.2.0"
          python -m pip check

      - name: Decode synthetic WAV through faster-whisper
        run: |
          set -euo pipefail
          python - <<'PYTEST'
          import importlib.metadata
          import tempfile
          import wave
          from pathlib import Path
          from faster_whisper.audio import decode_audio

          av_version = importlib.metadata.version("av")
          fw_version = importlib.metadata.version("faster-whisper")
          assert av_version == "18.0.0", av_version
          assert fw_version == "1.2.0", fw_version

          with tempfile.TemporaryDirectory(prefix="pyav-smoke-") as tmp:
              sample = Path(tmp) / "probe.wav"
              with wave.open(str(sample), "wb") as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(16000)
                  wav.writeframes(bytes(32000))

              decoded = decode_audio(str(sample), sampling_rate=16000)
              assert len(decoded) >= 16000, f"decoded_samples={len(decoded)}"

          print(f"PYAV_FASTER_WHISPER_COMPATIBILITY=PASS:{av_version}")
          print("FASTER_WHISPER_DECODE_SMOKE=PASS")
          print(f"DECODED_SAMPLES={len(decoded)}")
          PYTEST
