name: Telegram Query Intelligence Focused

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/telegram-query-intelligence.request.json"

permissions:
  contents: read

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/telegram-query-intelligence/focused.db

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install focused runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/telegram-query-intelligence
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile exact-query path
        run: |
          set -euo pipefail
          python -m py_compile             app/services/telegram_gta6_query_service.py             app/services/telegram_conversation_service.py             app/services/harness_collaboration_service.py             scripts/telegram_harness_gateway_v2.py
          echo "TELEGRAM_QUERY_INTELLIGENCE_COMPILE=PASS"

      - name: Run focused human-query regressions
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_telegram_conversation_control.py::test_intent_classifier_covers_governed_taxonomy             tests/test_telegram_conversation_control.py::test_last_script_request_delivers_canonical_script_content             tests/test_telegram_conversation_control.py::test_multiturn_pronoun_feedback_binds_human_decision_and_learning             tests/test_telegram_conversation_control.py::test_natural_language_research_routes_exact_human_query_without_slash_command             tests/test_telegram_conversation_control.py::test_research_remains_useful_when_semantic_provider_is_unavailable             tests/test_telegram_conversation_control.py::test_broad_gta6_information_goal_is_not_downgraded_to_generic_chat             tests/test_telegram_conversation_control.py::test_waiting_for_human_is_explicit_state_not_silent_stop             tests/test_telegram_conversation_control.py::test_team_analysis_routes_to_hermes_action_boundary_without_chat_provider             tests/test_telegram_gateway_conversation.py::test_live_status_exact_human_path_sends_one_clean_final_message             --junitxml=artifacts/telegram-query-intelligence/pytest.xml
          echo "TELEGRAM_QUERY_INTELLIGENCE_TESTS=PASS"
          echo "HUMAN_QUERY_PRESERVED=PASS"
          echo "STATUS_PROVIDER_INDEPENDENT=PASS"
          echo "NEW_VOICE_SYNTHESIS=NO"
          echo "FULL_RENDER=NO"
          echo "YOUTUBE_UPLOAD=NO"
          echo "YOUTUBE_PUBLICATION=NO"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-query-intelligence-${{ github.run_id }}
          path: artifacts/telegram-query-intelligence/
          if-no-files-found: error
          retention-days: 30
