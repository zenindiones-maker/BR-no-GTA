name: BR V24 Agent Office Ingress Isolation Typecheck

on:
  push:
    branches:
      - work/br-slm-agent-reconstruction-v24
    paths:
      - ".github/workflows/br-v24-agent-office-ingress-isolation-typecheck.yml"
      - "scripts/br_v24_agent_office_no_ingress_patch.py"
      - "tests/test_br_v24_agent_office_no_ingress_patch.py"
      - "scripts/br_v24_office_review_bundle.py"
      - "tests/test_br_v24_office_review_bundle.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v24-office-ingress-typecheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ephemeral-no-ingress-source-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      npm_config_ignore_scripts: "true"
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=2048"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: chaitanyagiri/munder-difflin
          ref: 6248293a7cd9dfdbf9633d12bbe857831ccfee88
          path: .br-v24-untrusted-office-code-candidate
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prove BR authority and fail-closed source mutation contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/br-slm-agent-reconstruction-v24"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .br-v24-untrusted-office-code-candidate rev-parse HEAD)" = "6248293a7cd9dfdbf9633d12bbe857831ccfee88"
          python -m unittest discover -s tests -p 'test_br_v24_agent_office_no_ingress_patch.py' -v
          python -m unittest discover -s tests -p 'test_br_v24_office_review_bundle.py' -v
          python scripts/agent_office_preflight.py --upstream-dir "$GITHUB_WORKSPACE/.br-v24-untrusted-office-code-candidate"
      - name: Apply ONLY original-source pinned Slack/webhook denial in untrusted temporary checkout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/br_v24_agent_office_no_ingress_patch.py \
            --root "$GITHUB_WORKSPACE/.br-v24-untrusted-office-code-candidate" \
            --output "$RUNNER_TEMP/br-v24-office-ingress-candidate.json"
          test "$(git -C .br-v24-untrusted-office-code-candidate rev-parse HEAD)" = "6248293a7cd9dfdbf9633d12bbe857831ccfee88"
      - name: Refresh disposable no-tunnel lock and prove high vulnerabilities eliminated
        shell: bash
        working-directory: .br-v24-untrusted-office-code-candidate
        run: |
          set -euo pipefail
          npm pkg delete dependencies.localtunnel dependencies.tunnelmole
          npm pkg set 'overrides.proxy-addr=2.0.8'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          set +e
          npm audit fix --package-lock-only --omit=dev --ignore-scripts --no-fund --force=false > "$RUNNER_TEMP/br-v24-office-code-audit-fix.log" 2>&1
          rc=$?
          set -e
          echo "BR_V24_OFFICE_CODE_LOCK_FIX_EXIT=$rc"
          npm audit --omit=dev --json > "$RUNNER_TEMP/br-v24-office-code-audit.json" || true
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          obj=json.loads((Path(os.environ["RUNNER_TEMP"])/"br-v24-office-code-audit.json").read_text())
          stats=(obj.get("metadata") or {}).get("vulnerabilities") or {}
          if type(stats.get("high")) is not int or type(stats.get("critical")) is not int:
              raise SystemExit("BR_OFFICE_NPM_REPORT_INVALID")
          print("BR_V24_OFFICE_CODE_HIGH="+str(stats["high"]))
          print("BR_V24_OFFICE_CODE_CRITICAL="+str(stats["critical"]))
          if stats["high"] or stats["critical"]:
              raise SystemExit("BR_OFFICE_UNRESOLVED_HIGH_OR_CRITICAL")
          PY
          unexpected="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -Ev '^(package.json|package-lock.json|src/main/slack.ts|src/main/webhook.ts)$' || true)"
          test -z "$unexpected"
      - name: Install only reviewed candidate dependency tree, lifecycle scripts disabled, ephemeral runner
        shell: bash
        working-directory: .br-v24-untrusted-office-code-candidate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Compile static Node TypeScript without starting Agent Office runtime or exposed sockets
        shell: bash
        working-directory: .br-v24-untrusted-office-code-candidate
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc --noEmit -p tsconfig.node.json
          echo "BR_V24_OFFICE_CANDIDATE_STATIC_TYPESCRIPT=PASS"
          echo "BR_V24_OFFICE_EXTERNAL_INGRESS=DISABLED_IN_DISPOSABLE_SOURCE_ONLY"
          echo "BR_V24_OFFICE_RUNTIME_STARTED=FALSE"
          echo "BR_V24_OFFICE_SECURITY_ADMISSION=BLOCKED_PENDING_INDEPENDENT_REVIEW"
      - name: Bind exact upstream diff, production lock and npm evidence for independent review
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/br_v24_office_review_bundle.py \
            --vendor "$GITHUB_WORKSPACE/.br-v24-untrusted-office-code-candidate" \
            --patch-receipt "$RUNNER_TEMP/br-v24-office-ingress-candidate.json" \
            --npm-audit "$RUNNER_TEMP/br-v24-office-code-audit.json" \
            --output "$RUNNER_TEMP/br-v24-office-review-bundle.json"
          echo "BR_V24_OFFICE_REVIEW_BUNDLE=PASS"
          echo "BR_V24_OFFICE_RUNTIME_SECURITY_ADMISSION=BLOCKED"
      - name: Save only bounded source-diff receipt; no code or creds published
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-v24-office-no-ingress-typecheck-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/br-v24-office-ingress-candidate.json
            ${{ runner.temp }}/br-v24-office-review-bundle.json
          if-no-files-found: warn
          retention-days: 7
