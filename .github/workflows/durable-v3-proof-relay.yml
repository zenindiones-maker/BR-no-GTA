name: Durable V3 Proof Relay
# BootstrapRelease/v1 proof
on:
  push:
    branches: [work/gate6f-analytics-learning]
    paths: [.github/workflows/durable-v3-proof-relay.yml]
permissions: {}
jobs:
  relay:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MISSION: proof-bootstrap-release-30ab3781
      CONTINUATION: CONT-BOOTREL-314
      AUTHORIZATION: AUTH-BOOTREL-314
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - name: Validate canonical bootstrap and dispatch bounded proof
        id: relay
        run: |
          set -euo pipefail
          HEAD_JSON=$(gh api "repos/$GITHUB_REPOSITORY/contents/missions/$MISSION/head.json?ref=harness-state" --jq .content | tr -d '\n' | base64 -d)
          POLICY_REF=$(jq -r .bootstrap_policy_ref <<<"$HEAD_JSON")
          POLICY=$(gh api "repos/$GITHUB_REPOSITORY/contents/$POLICY_REF?ref=harness-state" --jq .content | tr -d '\n' | base64 -d)
          EXPECTED=$(jq -r '.bootstrap_release_sha // .expected_workflow_sha' <<<"$POLICY")
          BOOTSTRAP=$(jq -r '.bootstrap_release_ref // .bootstrap_ref' <<<"$POLICY")
          API_VERSION=$(jq -r '.github_api_version // "2022-11-28"' <<<"$POLICY")
          OBSERVED=$(gh api -H "X-GitHub-Api-Version: $API_VERSION" "repos/$GITHUB_REPOSITORY/git/ref/heads/$BOOTSTRAP" --jq .object.sha)
          test "$OBSERVED" = "$EXPECTED" || { echo BOOTSTRAP_RELEASE_REF_DRIFT; exit 78; }
          echo "BOOTSTRAP_RELEASE_REF_RESOLVES_EXPECTED_SHA=PASS"
          echo "BOOTSTRAP_DISPATCH_CONTRACT_MATCH=PASS"
          DISPATCH_ATTEMPT_ID="dispatch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BODY=$(jq -nc --arg ref "$BOOTSTRAP" --arg m "$MISSION" --arg c "$CONTINUATION" --arg a "$AUTHORIZATION" --arg d "$DISPATCH_ATTEMPT_ID" '{ref:$ref,inputs:{mission_id:$m,continuation_id:$c,authorization_id:$a,runtime_revision:"FORGED-INPUT-MUST-BE-IGNORED",dispatch_attempt_id:$d}}')
          RESP=$(gh api -H "X-GitHub-Api-Version: $API_VERSION" -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/durable-v3-entrypoint-proof.yml/dispatches" --input - <<<"$BODY") || { echo DELIVERY_RESULT_UNKNOWN; exit 75; }
          RUN_ID=$(jq -r '.workflow_run_id // empty' <<<"$RESP")
          test -n "$RUN_ID" || { echo DELIVERY_RESULT_UNKNOWN; exit 75; }
          echo "HTTP_DISPATCH_SUCCESS=PASS"
          echo "WORKFLOW_RUN_ID_DIRECT=PASS"
          echo "EXACT_DISPATCH_CORRELATION=PASS"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
          echo "DISPATCH_RECEIPT_RESOLVED=PASS"
      - name: Persist authority-neutral dispatch receipt
        env:
          WORKFLOW_RUN_ID: ${{ steps.relay.outputs.run_id }}
          EXPECTED_WORKFLOW_SHA: ${{ steps.relay.outputs.expected }}
        run: |
          python scripts/durable_v3_proof_relay.py --mission-id "$MISSION"             --continuation-id "$CONTINUATION" --authorization-id "$AUTHORIZATION"             --workflow-run-id "$WORKFLOW_RUN_ID"             --expected-workflow-sha "$EXPECTED_WORKFLOW_SHA"
