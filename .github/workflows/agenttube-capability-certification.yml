name: AgentTube Capability Certification

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/services/agenttube_capability_bridge.py"
      - "app/services/global_capability_registry.py"
      - "config/third_party/agenttube_*.json"
      - "docs/third-party/agenttube-*"
      - "tests/test_agenttube_capability_bridge.py"
      - "scripts/agenttube_capability_certification.py"
      - ".github/workflows/agenttube-capability-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore canonical test environment
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-${{ runner.arch }}-py312-br-no-gta-venv-v2-${{ hashFiles('requirements.txt', 'config/canonical-test-environment-cache-contract.txt') }}
      - name: Install dependencies on cache miss
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pytest
      - name: Focused AgentTube bridge tests
        run: .venv/bin/python -m pytest -q tests/test_agenttube_capability_bridge.py
      - name: Emit machine-readable certification
        run: PYTHONPATH="$GITHUB_WORKSPACE" .venv/bin/python scripts/agenttube_capability_certification.py
      - name: Upload canonical AgentTube certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenttube-capability-certification
          path: runtime/agenttube-certification.json
          if-no-files-found: warn
          retention-days: 14
