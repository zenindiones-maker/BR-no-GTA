name: BR V24 Agent Office Telemetry Loopback Candidate

on:
  push:
    branches:
      - work/br-slm-agent-reconstruction-v24
    paths:
      - ".github/workflows/br-v24-agent-office-telemetry-loopback.yml"
      - "scripts/br_v24_office_telemetry_loopback_patch.py"
      - "tests/test_br_v24_office_telemetry_loopback_patch.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v24-office-telemetry-loopback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-bound-telemetry-security-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      npm_config_ignore_scripts: "true"
      CI: "true"
    steps:
      - name: BR V24 exact SHA checkout, do not persist credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pinned disposable original upstream checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: chaitanyagiri/munder-difflin
          ref: 6248293a7cd9dfdbf9633d12bbe857831ccfee88
          path: .br-v24-untrusted-office-telemetry
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Validate provenance and negative source patch contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/br-slm-agent-reconstruction-v24"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .br-v24-untrusted-office-telemetry rev-parse HEAD)" = "6248293a7cd9dfdbf9633d12bbe857831ccfee88"
          python scripts/agent_office_preflight.py --upstream-dir "$GITHUB_WORKSPACE/.br-v24-untrusted-office-telemetry"
          python -m unittest discover -s tests -p 'test_br_v24_office_telemetry_loopback_patch.py' -v
          python -m unittest discover -s tests -p 'test_br_v24_agent_office_no_ingress_patch.py' -v
      - name: Apply only three bounded source patches in untrusted ephemeral checkout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/br_v24_agent_office_no_ingress_patch.py \
            --root "$GITHUB_WORKSPACE/.br-v24-untrusted-office-telemetry" \
            --output "$RUNNER_TEMP/br-v24-office-two-no-ingress.json"
          python scripts/br_v24_office_telemetry_loopback_patch.py \
            --vendor "$GITHUB_WORKSPACE/.br-v24-untrusted-office-telemetry" \
            --output "$RUNNER_TEMP/br-v24-office-telemetry-loopback.json"
      - name: Produce no-tunnel zero-HIGH ephemeral production dependency tree
        shell: bash
        working-directory: .br-v24-untrusted-office-telemetry
        run: |
          set -euo pipefail
          npm pkg delete dependencies.localtunnel dependencies.tunnelmole
          npm pkg set 'overrides.proxy-addr=2.0.8'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --omit=dev --ignore-scripts --no-fund --force=false || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/br-v24-office-telemetry-npm-audit.json" || true
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"br-v24-office-telemetry-npm-audit.json").read_text())
          d=data.get("metadata",{}).get("vulnerabilities",{})
          if not isinstance(data.get("vulnerabilities"),dict) or type(d.get("high")) is not int or type(d.get("critical")) is not int or d["high"] or d["critical"]:
              raise SystemExit("BR_V24_OFFICE_TELEMETRY_SECURITY_DEPENDENCIES_FAIL")
          print("BR_V24_OFFICE_TELEMETRY_PRODUCTION_HIGH_CRITICAL=0")
          PY
          changes="$(git diff --name-only HEAD)"
          expected="$(printf '%s\n' package-lock.json package.json src/main/slack.ts src/main/telemetry.ts src/main/webhook.ts | sort)"
          test "$(printf '%s\n' "$changes" | sort)" = "$expected"
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Typecheck exact patched upstream without running its services
        shell: bash
        working-directory: .br-v24-untrusted-office-telemetry
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit -p tsconfig.node.json
          echo "BR_V24_OFFICE_TELEMETRY_SOURCE_TYPESCRIPT=PASS"
          echo "BR_V24_OFFICE_UPSTREAM_RUNTIME=NOT_STARTED"
          echo "BR_V24_OFFICE_INDEPENDENT_SECURITY_REVIEW=REQUIRED"
          echo "BR_V24_OFFICE_RUNTIME_ADMISSION=BLOCKED"
      - name: Preserve bounded source security candidate receipts, no secrets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-v24-office-telemetry-loopback-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/br-v24-office-two-no-ingress.json
            ${{ runner.temp }}/br-v24-office-telemetry-loopback.json
          if-no-files-found: warn
          retention-days: 7
