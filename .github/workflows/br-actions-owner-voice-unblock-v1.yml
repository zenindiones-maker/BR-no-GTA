name: BR OWNER Voice Actions Isolated Regression

on:
  push:
    branches:
      - work/br-actions-owner-voice-unblock-20261010-v1
    paths:
      - .github/workflows/br-actions-owner-voice-unblock-v1.yml
      - tests/test_owner_voice_single_clone_workflow_v1.py
      - tests/test_owner_voice_prompt_consistency_service.py
      - app/services/owner_voice_prompt_consistency_service.py
      - app/services/gta6_pronunciation_lexicon_service.py
      - scripts/owner_voice_single_human_clone.py
      - scripts/owner_voice_single_clone_delivery.py
      - app/services/owner_voice_clone_step_output_service.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-owner-voice-safe-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voice-contracts-no-private-material:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install minimal focused test dependencies
        run: python -m pip install --disable-pip-version-check -q pytest==8.4.2 python-dotenv==1.2.3
      - name: Verify independent source and pronunciation contracts
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_owner_voice_single_clone_workflow_v1.py \
            tests/test_owner_voice_prompt_consistency_service.py \
            tests/test_owner_voice_coherent_no_fresh_sample.py \
            tests/test_owner_voice_human_review_delivery_policy.py \
            tests/test_owner_voice_segmented_delivery_manifest_regression.py \
            tests/test_owner_voice_single_clone_delivery_v1.py \
            tests/test_owner_voice_critical_audio_telegram_delivery.py
          echo 'OWNER_VOICE_ISOLATED_CONTRACTS=PASS'
          echo 'OWNER_VOICE_REAL_INFERENCE=NOT_ATTEMPTED'
          echo 'TELEGRAM_SIDE_EFFECT=NOT_ATTEMPTED'
          echo 'YOUTUBE_SIDE_EFFECT=NOT_ATTEMPTED'
