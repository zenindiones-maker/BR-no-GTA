name: BR Owner PTBR Lexicon Consistency V11b
on:
  push:
    branches:
      - work/br-ptbr-lexicon-consistency-v11b
    paths:
      - "config/pronunciation_lexicon.json"
      - "config/pronunciation_ptbr_candidate.json"
      - "config/pronunciation_evidence_registry.json"
      - "tests/test_voice_lexicon_consistency_v11b.py"
      - ".github/workflows/br-voice-lexicon-v11b.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: br-voice-lexicon-v11b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test canonical PTBR mapping and old/new evidence boundaries
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check pytest==8.4.2 python-dotenv==1.2.3 packaging==25.0
          python -m pytest -q tests/test_voice_lexicon_consistency_v11b.py tests/test_pronunciation_service.py
          echo "BR_OWNER_VAICY_SITI_ALL_THREE_LEXICONS=PASS"
          echo "BR_OWNER_ACOUSTIC_HUMAN_APPROVAL=REQUIRED"
