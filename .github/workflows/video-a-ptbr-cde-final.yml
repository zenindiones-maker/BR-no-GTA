name: VIDEO A Legacy PT-BR Candidate Path — RETIRED

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce owner-only voice policy
        run: |
          echo "LEGACY_VOICE_WORKFLOW=RETIRED"
          echo "OFFICIAL_VOICE=BR_OWNER_V1"
          echo "VOICE_REFERENCE_SOURCE=TELEGRAM"
          echo "VOICE_LANGUAGE=pt-BR"
          echo "VOICE_ACCENT_LOCALE=pt-BR"
          echo "GENERIC_VOICE_FALLBACK=0"
          echo "REASON=NEW_AUDITIONS_MUST_CLONE_PRIVATE_TELEGRAM_OWNER_REFERENCE"
          exit 1
