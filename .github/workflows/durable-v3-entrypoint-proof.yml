name: Durable V3 Entrypoint Proof
run-name: Durable V3 Entrypoint Proof · ${{ inputs.mission_id }} · ${{ github.run_id }} · attempt ${{ github.run_attempt }}

on:
  workflow_dispatch:
    inputs:
      mission_id: {required: true, type: string}
      continuation_id: {required: true, type: string}
      authorization_id: {required: true, type: string}
      runtime_revision: {required: false, type: string, description: "UNTRUSTED diagnostic input; never used for authority"}

permissions: {}

env:
  PYTHONPATH: .
  BOOTSTRAP_REF: durable-v3-bootstrap

jobs:
  trusted_claim:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      claim_id: ${{ steps.claim.outputs.claim_id }}
      fencing_epoch: ${{ steps.claim.outputs.fencing_epoch }}
      runtime_revision: ${{ steps.claim.outputs.runtime_revision }}
      orchestration_version: ${{ steps.claim.outputs.orchestration_version }}
      claimant_identity: ${{ steps.claim.outputs.claimant_identity }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: claim
        name: Trusted canonical claim
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          MISSION_ID: ${{ inputs.mission_id }}
          CONTINUATION_ID: ${{ inputs.continuation_id }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
        run: |
          set -euo pipefail
          python scripts/durable_v3_trusted_bootstrap.py claim             --mission-id "$MISSION_ID"             --continuation-id "$CONTINUATION_ID"             --authorization-id "$AUTHORIZATION_ID"
          echo "TRUSTED_CLAIM_JOB_EXTERNAL_SECRETS=NONE"
          echo "WORKFLOW_INPUT_RUNTIME_SHA=UNTRUSTED"

  runtime_execution:
    needs: trusted_claim
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      evidence_sha256: ${{ steps.stub.outputs.evidence_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.trusted_claim.outputs.runtime_revision }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact authorized runtime
        env:
          AUTHORIZED_RUNTIME: ${{ needs.trusted_claim.outputs.runtime_revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_RUNTIME"
          git cat-file -e "$AUTHORIZED_RUNTIME^{commit}"
          echo "EXACT_RUNTIME_CHECKOUT=PASS"
          echo "RUNTIME_JOB_STATE_WRITE_CAPABILITY=NONE"
      - name: Prove runtime cannot mutate harness-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/harness-state" --jq .object.sha)
          set +e
          OUT=$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/harness-state" -f sha="$STATE_SHA" -F force=false 2>&1)
          RC=$?
          set -e
          test "$RC" -ne 0
          grep -Eq '403|Resource not accessible|permission' <<<"$OUT"
          echo "RUNTIME_JOB_STATE_WRITE_CAPABILITY=NONE"
      - id: stub
        name: Activity evidence workload stub
        env:
          CLAIM_ID: ${{ needs.trusted_claim.outputs.claim_id }}
          FENCE: ${{ needs.trusted_claim.outputs.fencing_epoch }}
          RUNTIME: ${{ needs.trusted_claim.outputs.runtime_revision }}
          ORCH: ${{ needs.trusted_claim.outputs.orchestration_version }}
          CLAIMANT: ${{ needs.trusted_claim.outputs.claimant_identity }}
          MISSION: ${{ inputs.mission_id }}
          CONTINUATION: ${{ inputs.continuation_id }}
          AUTHORIZATION: ${{ inputs.authorization_id }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p={"schema":"ActivityExecutionEvidence/v1","mission_id":os.environ["MISSION"],
            "continuation_id":os.environ["CONTINUATION"],"authorization_id":os.environ["AUTHORIZATION"],
            "claim_id":os.environ["CLAIM_ID"],"fencing_epoch":int(os.environ["FENCE"]),
            "runtime_revision":os.environ["RUNTIME"],"orchestration_version":os.environ["ORCH"],
            "claimant_identity":json.loads(os.environ["CLAIMANT"]),"activity_id":"entrypoint-proof",
            "semantic_task_key":"semantic-stub","capability_id":"proof.stub","capability_version":"1",
            "completion_status":"COMPLETED","typed_output_refs":[],"partial_refs":[],"raw_exception_type":None,
            "raw_error_code":None,"provider_call_count":0,"agent_call_count":0,
            "observed_metrics":{"mission_metric":0},"executed_operations":[],"artifact_manifest_ref":None}
          raw=json.dumps(p,sort_keys=True,separators=(",",":")).encode();p["evidence_hash"]=hashlib.sha256(raw).hexdigest()
          data=json.dumps(p,sort_keys=True,separators=(",",":")).encode();Path("activity-evidence.json").write_bytes(data)
          h=hashlib.sha256(data).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("evidence_sha256="+h+"\n")
          print("SEMANTIC_EXECUTION_STARTED=YES");print("RUNTIME_RESULT_IS_EVIDENCE_NOT_AUTHORITY=PASS")
          print("PLANNER_CALLS=0");print("PROVIDER_CALLS=0");print("AGENT_CALLS=0");print("TASKRESULT_WRITES=0");print("SIDE_EFFECTS=0")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: activity-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: activity-evidence.json
          if-no-files-found: error
          retention-days: 1

  trusted_settlement:
    needs: [trusted_claim,runtime_execution]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: activity-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: untrusted-runtime-evidence
      - name: Trusted canonical settlement
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          MISSION_ID: ${{ inputs.mission_id }}
          CONTINUATION_ID: ${{ inputs.continuation_id }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          EVIDENCE_FILE: untrusted-runtime-evidence/activity-evidence.json
          EXPECTED_EVIDENCE_SHA256: ${{ needs.runtime_execution.outputs.evidence_sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$EVIDENCE_FILE" | awk '{print $1}')" = "$EXPECTED_EVIDENCE_SHA256" || { echo RESULT_EVIDENCE_INVALID:ARTIFACT_HASH; exit 78; }
          python scripts/durable_v3_trusted_bootstrap.py settle             --mission-id "$MISSION_ID"             --continuation-id "$CONTINUATION_ID"             --authorization-id "$AUTHORIZATION_ID"
          echo "TRUSTED_SETTLEMENT_JOB_EXTERNAL_SECRETS=NONE"
          echo "TRUST_PLANE_RUNTIME_ISOLATION=PASS"

  fail_closed_matrix:
    needs: [trusted_claim,trusted_settlement]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Probe stale forged and consumed authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          MISSION_ID: ${{ inputs.mission_id }}
          CONTINUATION_ID: ${{ inputs.continuation_id }}
          AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          OLD_CLAIM_ID: ${{ needs.trusted_claim.outputs.claim_id }}
          OLD_FENCE: ${{ needs.trusted_claim.outputs.fencing_epoch }}
        run: |
          python scripts/durable_v3_fail_closed_probe.py             --mission-id "$MISSION_ID"             --continuation-id "$CONTINUATION_ID"             --authorization-id "$AUTHORIZATION_ID"             --old-claim-id "$OLD_CLAIM_ID"             --old-fence "$OLD_FENCE"
          echo "ENTRYPOINT_FAIL_CLOSED_CORE=PASS"
