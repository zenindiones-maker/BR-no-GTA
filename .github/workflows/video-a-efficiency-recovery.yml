name: VIDEO A Efficiency Recovery

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run001/video-a-efficiency-recovery.request.json

permissions:
  contents: read
  actions: write

concurrency:
  group: video-a-efficiency-recovery
  cancel-in-progress: false

jobs:
  recover-canary-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONPATH: video-engine/backend:.
      GH_TOKEN: ${{ github.token }}
      SOURCE_RENDER_RUN_ID: "35401791023"
      SOURCE_RENDER_ARTIFACT_ID: "10570522173"
      NARRATION_RUN_ID: "35401841031"
      NARRATION_ARTIFACT_ID: "10570877480"
      EXISTING_MEDIA_RUN_ID: "35407875087"
      EXISTING_MEDIA_ARTIFACT_ID: "10572578507"
      EXISTING_RETRY_RUN_ID: "35408056905"
      EXISTING_RETRY_ARTIFACT_ID: "10572763599"
      EXISTING_RETRY_ARTIFACT_NAME: "video-a-retry-render-job-35408056905"
      TARGET_REF: work/gate6f-analytics-learning
      YTDLP_COOKIES_FILE: runtime/secrets/youtube-cookies.txt
      YTDLP_PO_TOKEN_BASE_URL: http://127.0.0.1:4416
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate exact recovery request
        id: recovery_mode
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('.run001/video-a-efficiency-recovery.request.json').read_text())
          expected={
              'source_render_run_id':35401841031,
              'narration_artifact_id':10570877480,
              'narration_producer_run_id':35401841031,
              'render_job_id':920101,
              'execution_id':'run001-video-a-investigative-v1',
              'final_voice':'Voice B',
              'job18_frozen':True,
              'youtube_publication':False,
          }
          for key,value in expected.items():
              if req.get(key)!=value:
                  raise SystemExit(f'RECOVERY_REQUEST_MISMATCH:{key}')
          resume=bool(req.get('resume_after_canary'))
          if resume:
              resume_expected={
                  'validated_canary_run_id':35408056905,
                  'validated_canary_artifact_id':10572723602,
                  'retry_handoff_artifact_id':10572763599,
                  'retry_handoff_producer_run_id':35408056905,
                  'media_artifact_id':10572578507,
                  'media_producer_run_id':35407875087,
              }
              for key,value in resume_expected.items():
                  if req.get(key)!=value:
                      raise SystemExit(f'RESUME_CHECKPOINT_MISMATCH:{key}')
          with Path(__import__('os').environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as stream:
              stream.write(f"resume_after_canary={'true' if resume else 'false'}\n")
          print('RECOVERY_REQUEST=PASS')
          print('RESUME_AFTER_CANARY=' + ('YES' if resume else 'NO'))
          print('NARRATION_REGENERATION_FORBIDDEN=YES')
          print('JOB18_UNCHANGED=YES')
          PY

      - name: Install recovery runtime
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -r requirements.txt pytest
          python -m pip install -U "yt-dlp[default]" "bgutil-ytdlp-pot-provider==1.3.1"
          python -m pip install "edge-tts==7.2.8" "faster-whisper==1.2.0"
          ffmpeg -version | head -n1
          ffprobe -version | head -n1

      - name: Focused asset checkpoint and efficiency tests
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_media_checkpoint_service.py \
            tests/test_operational_efficiency_policy.py \
            tests/test_operational_efficiency_history.py \
            tests/test_narration_pipeline.py \
            tests/test_professional_audiovisual_worker.py \
            tests/test_cloud_audiovisual_worker.py

      - uses: denoland/setup-deno@v2
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        with:
          deno-version: v2.x

      - name: Start pinned PO-token provider
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git runtime/bgutil-ytdlp-pot-provider
          cd runtime/bgutil-ytdlp-pot-provider/server
          deno install --allow-scripts=npm:canvas --frozen
          cd node_modules
          export DENO_NO_PROMPT=1
          nohup deno run --no-prompt --allow-env --allow-net --allow-ffi=. --allow-read=. ../src/main.ts --port 4416 > ../provider.log 2>&1 &
          echo $! > ../provider.pid
          sleep 4
          kill -0 "$(cat ../provider.pid)"

      - name: Prepare YouTube cookies
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES"
          mkdir -p runtime/secrets
          printf '%s' "$YOUTUBE_COOKIES" > runtime/secrets/youtube-cookies.txt
          chmod 600 runtime/secrets/youtube-cookies.txt

      - name: Restore exact governed RenderJob
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.SOURCE_RENDER_ARTIFACT_ID }}
          run-id: ${{ env.SOURCE_RENDER_RUN_ID }}
          github-token: ${{ github.token }}
          path: runtime/recovery/handoff
          merge-multiple: true

      - name: Restore QA-passed Voice B narration
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.NARRATION_ARTIFACT_ID }}
          run-id: ${{ env.NARRATION_RUN_ID }}
          github-token: ${{ github.token }}
          path: runtime/recovery/narration
          merge-multiple: true

      - name: Restore existing QA-passed media checkpoint
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.EXISTING_MEDIA_ARTIFACT_ID }}
          run-id: ${{ env.EXISTING_MEDIA_RUN_ID }}
          github-token: ${{ github.token }}
          path: runtime/recovery/media-checkpoint
          merge-multiple: true

      - name: Validate restored RenderJob and narration lineage
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          job=json.loads(Path('runtime/recovery/handoff/render-job.json').read_text())
          assert job['render_job_id']==920101
          assert job['execution_id']=='run001-video-a-investigative-v1'
          assert job['narration']['human_quality_baseline']=='Voice B'
          assert job['narration']['voice']=='pt-BR-ThalitaMultilingualNeural'
          assert job['narration']['rate']=='+0%'
          nq=json.loads(Path('runtime/recovery/narration/narration-qa.json').read_text())
          assert nq['status']=='PASS'
          assert nq['voice']=='pt-BR-ThalitaMultilingualNeural'
          assert nq['effective_rate']=='+0%'
          print('GOVERNED_RENDER_JOB=PASS')
          print('NARRATION_QA=PASS')
          PY

      - name: Reuse existing media checkpoint or recover only if absent
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        run: |
          set -euo pipefail
          if [ -f runtime/recovery/media-checkpoint/media-checkpoint-manifest.json ]; then
            mkdir -p runtime/recovery/proof
            python - <<'PY'
          import json
          from pathlib import Path
          from app.services.media_checkpoint_service import validate_media_checkpoint
          job=json.loads(Path('runtime/recovery/handoff/render-job.json').read_text())
          manifest=validate_media_checkpoint(
              checkpoint_root=Path('runtime/recovery/media-checkpoint'),
              job=job,
          )
          proof={
              'status':'PASS',
              'run_class':'WARM_RETRY',
              'capability_id':'media.materialize',
              'stage':'media_materialization',
              'source_checkpoint_run_id':35407875087,
              'source_checkpoint_artifact_id':10572578507,
              'content_hash':manifest['content_hash'],
              'asset_count':len(manifest['assets']),
              'media_valid_assets_reused':True,
              'redundant_media_downloads':0,
              'external_calls':0,
              'download_count':0,
          }
          Path('runtime/recovery/proof/media-materialization.json').write_text(
              json.dumps(proof,indent=2),encoding='utf-8'
          )
          print('MEDIA_VALID_ASSETS_REUSED=YES')
          print('REDUNDANT_MEDIA_DOWNLOADS=0')
          PY
          else
            python scripts/prepare_media_checkpoint.py \
              --render-job runtime/recovery/handoff/render-job.json \
              --asset-root runtime/recovery/fresh-media-root \
              --checkpoint-dir runtime/recovery/media-checkpoint \
              --evidence runtime/recovery/proof/media-materialization.json
          fi

      - name: Validate recovered media checkpoint
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from app.services.media_checkpoint_service import validate_media_checkpoint
          job=json.loads(Path('runtime/recovery/handoff/render-job.json').read_text())
          m=validate_media_checkpoint(checkpoint_root=Path('runtime/recovery/media-checkpoint'),job=job)
          assert m['status']=='PASS' and m['reusable'] is True
          print('MEDIA_CHECKPOINT=PASS')
          print('MEDIA_CHECKPOINT_CONTENT_HASH='+m['content_hash'])
          PY

      - name: Reuse published QA-passed media checkpoint identity
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        id: media_checkpoint
        run: |
          set -euo pipefail
          echo "artifact-id=${EXISTING_MEDIA_ARTIFACT_ID}" >> "$GITHUB_OUTPUT"
          echo "MEDIA_CHECKPOINT_ARTIFACT_REUSED=YES"
          echo "MEDIA_CHECKPOINT_ARTIFACT_ID=${EXISTING_MEDIA_ARTIFACT_ID}"

      - name: Prove warm reuse before canary
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        run: |
          set -euo pipefail
          rm -rf runtime/recovery/canary-input
          python scripts/prepare_professional_inputs.py \
            --render-job runtime/recovery/handoff/render-job.json \
            --asset-root runtime/recovery/canary-input \
            --cache-root runtime/recovery/narration-cache \
            --reuse-narration-dir runtime/recovery/narration \
            --reuse-media-dir runtime/recovery/media-checkpoint
          python - <<'PY'
          import json
          from pathlib import Path
          p=next(Path('runtime/recovery/canary-input').glob('**/professional-inputs.json'))
          d=json.loads(p.read_text())
          assert d['narration']['artifact_reused'] is True
          assert d['narration']['tts_request_count_on_reuse']==0
          assert d['media_checkpoint']['artifact_reused'] is True
          assert d['media_checkpoint']['redundant_media_downloads']==0
          print('NARRATION_ARTIFACT_REUSED=YES')
          print('REDUNDANT_TTS_REQUESTS=0')
          print('MEDIA_VALID_ASSETS_REUSED=YES')
          print('REDUNDANT_MEDIA_DOWNLOADS=0')
          PY

      - name: Profile representative 60-second EditPlan canary
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        run: |
          set -euo pipefail
          python scripts/profile_render_canary.py \
            --render-job runtime/recovery/handoff/render-job.json \
            --asset-root runtime/recovery/canary-input \
            --output-dir runtime/recovery/canary-output \
            --profile-output runtime/recovery/proof/render-canary-profile.json \
            --seconds 60

      - name: Start canary artifact upload clock
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        run: date +%s%N > /tmp/canary_upload_start_ns

      - name: Upload representative canary
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-a-render-canary-${{ github.run_id }}
          path: |
            runtime/recovery/canary-output/
            runtime/recovery/proof/render-canary-profile.json
          if-no-files-found: error
          retention-days: 14

      - name: Finalize canary execution profile
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time
          from pathlib import Path
          p=Path('runtime/recovery/proof/render-canary-profile.json')
          d=json.loads(p.read_text())
          start=int(Path('/tmp/canary_upload_start_ns').read_text().strip())
          d['artifact_upload_seconds']=(time.time_ns()-start)/1e9
          d['status']='PASS'
          p.write_text(json.dumps(d,indent=2),encoding='utf-8')
          print('REPRESENTATIVE_RENDER_CANARY=PASS')
          print('CANARY_ARTIFACT_UPLOAD_PROFILED=YES')
          print('RENDER_PRESET_CANDIDATE_PROMOTED=NO')
          PY

      - name: Upload immutable retry RenderJob handoff
        if: steps.recovery_mode.outputs.resume_after_canary != 'true'
        id: retry_handoff
        uses: actions/upload-artifact@v4
        with:
          name: video-a-retry-render-job-${{ github.run_id }}
          path: runtime/recovery/handoff/render-job.json
          if-no-files-found: error
          retention-days: 30

      - name: Dispatch official warm retry with narration and media checkpoints
        env:
          HANDOFF_ARTIFACT_ID: ${{ steps.retry_handoff.outputs.artifact-id || env.EXISTING_RETRY_ARTIFACT_ID }}
          HANDOFF_ARTIFACT_NAME: ${{ steps.retry_handoff.outputs.artifact-id && format('video-a-retry-render-job-{0}', github.run_id) || env.EXISTING_RETRY_ARTIFACT_NAME }}
          HANDOFF_PRODUCER_RUN_ID: ${{ steps.retry_handoff.outputs.artifact-id && github.run_id || env.EXISTING_RETRY_RUN_ID }}
          MEDIA_ARTIFACT_ID: ${{ steps.media_checkpoint.outputs.artifact-id || env.EXISTING_MEDIA_ARTIFACT_ID }}
          MEDIA_PRODUCER_RUN_ID: ${{ env.EXISTING_MEDIA_RUN_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from app.services.render_job_handoff_service import build_artifact_descriptor
          path=Path('runtime/recovery/handoff/render-job.json')
          job=json.loads(path.read_text())
          descriptor=build_artifact_descriptor(
              render_job_path=path,
              job=job,
              artifact_id=int(os.environ['HANDOFF_ARTIFACT_ID']),
              artifact_name=os.environ['HANDOFF_ARTIFACT_NAME'],
              producer_run_id=int(os.environ['HANDOFF_PRODUCER_RUN_ID']),
              producer_workflow='video-a-efficiency-recovery.yml',
              source_sha=os.environ['GITHUB_SHA'],
          )
          payload={
              'ref':os.environ['TARGET_REF'],
              'inputs':{
                  'render_job':'',
                  'render_job_descriptor':json.dumps(descriptor,separators=(',',':')),
                  'brain_decision_id':job['brain_decision_id'],
                  'execution_id':job['execution_id'],
                  'authorized_action':'EXECUTION',
                  'narration_artifact_id':os.environ['NARRATION_ARTIFACT_ID'],
                  'narration_producer_run_id':os.environ['NARRATION_RUN_ID'],
                  'media_artifact_id':os.environ['MEDIA_ARTIFACT_ID'],
                  'media_producer_run_id':os.environ['MEDIA_PRODUCER_RUN_ID'],
              },
          }
          Path('runtime/recovery/proof/retry-dispatch.json').write_text(json.dumps(payload,indent=2))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/render-worker.yml/dispatches" \
            --input runtime/recovery/proof/retry-dispatch.json
          echo "WARM_RENDER_RETRY_DISPATCH=ACCEPTED"

      - name: Resolve warm retry run
        run: |
          set -euo pipefail
          target='Render Worker · run001-video-a-investigative-v1'
          run_id=''
          for attempt in $(seq 1 30); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/render-worker.yml/runs?branch=${TARGET_REF}&event=workflow_dispatch&per_page=20")"
            run_id="$(printf '%s' "$runs" | jq -r --arg title "$target" --arg sha "$GITHUB_SHA" '.workflow_runs[] | select(.display_title==$title and .head_sha==$sha) | .id' | head -n1)"
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then break; fi
            sleep 4
          done
          test -n "$run_id"
          printf '{"status":"DISPATCHED","render_run_id":%s,"narration_artifact_id":10570877480,"media_artifact_id":10572578507,"media_producer_run_id":35407875087,"resume_after_canary":true}\n' \
            "$run_id" \
            > runtime/recovery/proof/warm-retry.json
          echo "WARM_RENDER_RETRY_RUN_ID=$run_id"

      - name: Upload recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-a-efficiency-recovery-proof-${{ github.run_id }}
          path: runtime/recovery/proof/
          if-no-files-found: warn
          retention-days: 30
