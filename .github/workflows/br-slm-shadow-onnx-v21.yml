name: BR V21 Real Compact ONNX Shadow Model Experiment
on:
  push:
    branches:
      - work/br-slm-shadow-onnx-v21
    paths:
      - "app/services/br_slm_onnx_shadow_v21.py"
      - "scripts/br_slm_shadow_benchmark_v21.py"
      - "tests/test_br_slm_onnx_shadow_v21.py"
      - ".github/workflows/br-slm-shadow-onnx-v21.yml"
      - "docs/architecture/br-slm-shadow-v21.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v21-local-onnx-shadow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shadow-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test denied model privilege and unsafe requests
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check pytest==8.4.2 numpy==2.2.6 python-dotenv==1.2.3
          export BR_TEST_DATABASE="$RUNNER_TEMP/br-v21-shadow-policy.db"
          python -m pytest -q tests/test_br_slm_onnx_shadow_v21.py
          echo "BR_V21_SLM_SHADOW_PRIVILEGE_DENIAL=PASS"
  real-local-inference:
    needs: shadow-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install bounded CPU-only ONNX runtime without PyTorch or remote code
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check \
            numpy==2.2.6 onnxruntime==1.23.2 tokenizers==0.22.1 \
            huggingface-hub==0.36.0
          echo "BR_V21_TRUST_REMOTE_CODE=FORBIDDEN"
          echo "BR_V21_PRIVATE_VOICE_REFERENCE=NOT_ACCESSED"
      - name: Download exact 69MB official Apache-2.0 weights with SHA-256 check
        run: |
          set -euo pipefail
          export HF_HOME="$RUNNER_TEMP/hf-v21-cache"
          mkdir -m 700 "$RUNNER_TEMP/mini-onnx-v21"
          python scripts/br_slm_shadow_benchmark_v21.py \
            --private-model-dir "$RUNNER_TEMP/mini-onnx-v21" \
            --private-output "$RUNNER_TEMP/slm-shadow-v21-evidence.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          report=json.loads(
              (Path(os.environ["RUNNER_TEMP"])/"slm-shadow-v21-evidence.json").read_text()
          )
          assert report["actual_onnx_cpu_inference"] is True
          assert report["case_count"]==20
          assert report["model_file_bytes"]>=60_000_000
          assert report["paid_calls"]==0
          assert report["ready_to_replace_v19_router"] is False
          assert report["operational_model_professional"] is False
          assert report["published"] is False
          assert all(row["can_authorize"] is False for row in report["results"])
          sha=hashlib.sha256(json.dumps(
              {k:v for k,v in report.items() if k!="receipt_sha256"},
              sort_keys=True,ensure_ascii=False,separators=(",",":"),allow_nan=False
          ).encode()).hexdigest()
          assert report["receipt_sha256"]==sha
          print("BR_V21_LOCAL_FROZEN_MODEL_INFERENCE=PASS")
          print("BR_V21_MODEL_QUALITY_GATE="+report["status"])
          print("BR_V21_MODEL_PROMOTION=NOT_ATTEMPTED")
          PY
