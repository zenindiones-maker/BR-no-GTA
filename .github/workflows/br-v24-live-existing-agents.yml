name: BR V24 Live Existing Agents Execution

on:
  push:
    branches:
      - work/br-slm-agent-reconstruction-v24
    paths:
      - ".github/workflows/br-v24-live-existing-agents.yml"
      - "scripts/br_v24_live_agent_receipt.py"
      - "scripts/real_agent_execution_proof.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v24-live-existing-agents-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-authorized-two-agent-handoff:
    name: Measured Agent Office -> Improvement with actual Harness authorizations
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      ZERO_COST_OPERATION: "TRUE"
      BR_CODEX_FEDERATION_CONFIGURED: "false"
      BR_TEST_DATABASE: ${{ runner.temp }}/br-v24-live-agents.sqlite3
      GH_PROMOTION_DISABLED: "true"
    steps:
      - name: Checkout exact V24 branch (no persisted write credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install repository runtime dependencies in ephemeral runner only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/br-slm-agent-reconstruction-v24"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m pip install --disable-pip-version-check -q -r requirements.txt
      - name: Execute actual registered agents with fresh Harness authorization and real repository evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/br-v24-agent-artifacts"
          python scripts/real_agent_execution_proof.py \
            --output "$RUNNER_TEMP/br-v24-agent-artifacts/proof.json"
          python scripts/br_v24_live_agent_receipt.py \
            --proof "$RUNNER_TEMP/br-v24-agent-artifacts/proof.json" \
            --output "$RUNNER_TEMP/br-v24-agent-artifacts/live-receipt.json"
          echo "BR_V24_REAL_EXISTING_AGENTS=PASS"
      - name: Upload bounded sanitized live execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-v24-existing-agent-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/br-v24-agent-artifacts/live-receipt.json
          if-no-files-found: warn
          retention-days: 7
