name: Codex Addy 24 Certification

on:
  push:
    branches:
      - codex/run-001-app
      - work/gate6f-analytics-learning
    paths:
      - '.github/workflows/codex-agent-skills-validation.yml'
      - 'scripts/agent-tooling/**'
      - 'app/services/codex_addy_capability_executor.py'
      - 'app/services/global_capability_registry.py'
      - 'app/services/global_capability_registry_base.py'
      - 'app/services/harness_authorization_service.py'
      - 'app/services/harness_capability_service.py'
      - 'tests/test_addy_24_certification.py'
      - 'tests/test_codex_addy_capability_executor.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  certify-addy-24:
    name: Certify all 24 Addy skills
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Restore pinned Addy tooling
        run: bash scripts/agent-tooling/bootstrap.sh codex

      - name: Prove pinned provisioning and registry alignment
        run: |
          python scripts/agent-tooling/certify_addy_24.py \
            --output artifacts/addy-24/provisioning-registry.json

      - name: Prove exact native Codex discovery without model calls
        run: |
          python scripts/agent-tooling/check_discovery.py \
            codex artifacts/addy-24/native-discovery.json

      - name: Prove Harness-governed execution contract for every Addy skill
        run: |
          pytest -q tests/test_addy_24_certification.py \
            --junitxml=artifacts/addy-24/governed-execution.xml

      - name: Preserve existing Codex/Addy executor regression tests
        run: pytest -q tests/test_codex_addy_capability_executor.py

      - name: Derive final 24-of-24 certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("artifacts/addy-24")
          provision = json.loads((root / "provisioning-registry.json").read_text())
          discovery = json.loads((root / "native-discovery.json").read_text())
          suite = ET.parse(root / "governed-execution.xml").getroot()
          if suite.tag == "testsuites":
              tests = sum(int(item.attrib.get("tests", "0")) for item in suite)
              failures = sum(int(item.attrib.get("failures", "0")) for item in suite)
              errors = sum(int(item.attrib.get("errors", "0")) for item in suite)
          else:
              tests = int(suite.attrib.get("tests", "0"))
              failures = int(suite.attrib.get("failures", "0"))
              errors = int(suite.attrib.get("errors", "0"))

          expected = set(provision["skills"][index]["skill"] for index in range(24))
          discovered = set(discovery["discovered_skills"])
          execution_case_count = sum(
              1 for case in ET.parse(root / "governed-execution.xml").iter("testcase")
              if "test_each_addy_skill_has_governed_harness_execution_contract" in case.attrib.get("name", "")
          )
          checks = {
              "provisioning": provision["status"] == "PASS"
                  and provision["materialized_count"] == 24,
              "registry": provision["registry_count"] == 24,
              "native_discovery": discovery["status"] == "PASS"
                  and discovery["discovered_enabled_count"] == 24
                  and discovered == expected,
              "governed_execution": execution_case_count == 24
                  and failures == 0 and errors == 0,
          }
          if not all(checks.values()):
              raise SystemExit(f"ADDY_24_CERTIFICATION=FAIL checks={checks}")

          report = {
              "schema_version": 1,
              "status": "PASS",
              "expected_count": 24,
              "source_sha": provision["source_sha"],
              "checks": checks,
              "governed_execution_case_count": execution_case_count,
              "pytest_total_tests": tests,
              "skills": sorted(expected),
              "authority": "deepseek_harness",
              "semantic_quality_claimed": False,
              "model_turns_for_installation_and_discovery": 0,
          }
          (root / "certification.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print("ADDY_24_CERTIFICATION=PASS")
          print("ADDY_24_COUNT=24/24")
          print("ADDY_24_AUTHORITY=deepseek_harness")
          PY

      - name: Upload Addy 24 evidence
        uses: actions/upload-artifact@v4
        with:
          name: addy-24-certification
          path: artifacts/addy-24/
          if-no-files-found: error
