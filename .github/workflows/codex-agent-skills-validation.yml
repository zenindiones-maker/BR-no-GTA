name: Codex Agent Skills Validation

on:
  push:
    branches:
      - codex/run-001-app
    paths:
      - '.github/workflows/codex-agent-skills-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-codex-agent-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore pinned development tooling
        run: bash scripts/agent-tooling/bootstrap.sh codex

      - name: Verify native Codex discovery without model calls
        run: python3 scripts/agent-tooling/check_discovery.py codex
