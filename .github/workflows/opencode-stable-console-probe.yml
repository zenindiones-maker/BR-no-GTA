name: OpenCode Stable Console Admission Probe

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/opencode-stable-console-probe.request.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run official stable OpenCode with global deny-all
        run: |
          set -euo pipefail
          mkdir -p artifacts/opencode-stable-probe
          cat > artifacts/opencode-stable-probe/opencode.json <<'JSON'
          {
            "$schema": "https://opencode.ai/config.json",
            "default_agent": "build",
            "permission": "deny"
          }
          JSON
          export OPENCODE_CONFIG="$PWD/artifacts/opencode-stable-probe/opencode.json"
          export OPENCODE_CLIENT=cli
          npx --yes opencode-ai@1.18.31 --version | tee artifacts/opencode-stable-probe/version.txt
          set +e
          npx --yes opencode-ai@1.18.31 run             --model opencode/big-pickle             --agent build             --format json             "Responda apenas: TESTE_OK"             > artifacts/opencode-stable-probe/stdout.ndjson             2> artifacts/opencode-stable-probe/stderr.txt
          rc=$?
          set -e
          echo "$rc" > artifacts/opencode-stable-probe/exit-code.txt
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/opencode-stable-probe")
          events=[]
          parse_errors=[]
          texts=[]
          errors=[]
          tools=[]
          finish=[]
          for line in root.joinpath("stdout.ndjson").read_text(encoding="utf-8",errors="replace").splitlines():
              line=line.strip()
              if not line:
                  continue
              try:
                  event=json.loads(line)
              except Exception as exc:
                  parse_errors.append({"line":line[:1000],"error":str(exc)})
                  continue
              events.append(str(event.get("type") or "<missing>"))
              if event.get("type")=="text":
                  part=event.get("part") if isinstance(event.get("part"),dict) else {}
                  text=part.get("text") or event.get("text")
                  if text:
                      texts.append(str(text))
              if event.get("type")=="error":
                  errors.append(event)
              if event.get("type") in {"tool_use","tool_call","tool"}:
                  tools.append(event)
              if event.get("type") in {"step_finish","step-finish"}:
                  part=event.get("part") if isinstance(event.get("part"),dict) else {}
                  reason=event.get("finish_reason") or event.get("reason") or part.get("finish_reason") or part.get("reason")
                  if reason:
                      finish.append(str(reason))
          answer="".join(texts).strip()
          summary={
              "PROCESS_EXIT_CODE": int(root.joinpath("exit-code.txt").read_text().strip()),
              "EVENT_COUNT": len(events),
              "PARSE_ERRORS": parse_errors,
              "ERROR_EVENTS": errors,
              "SAFE_STDERR": root.joinpath("stderr.txt").read_text(encoding="utf-8",errors="replace").splitlines()[-40:],
              "STDOUT_NDJSON_EVENT_TYPES": events,
              "FINISH_REASON": finish[-1] if finish else None,
              "ANSWER_ACCUMULATED": answer,
              "TOOL_CALL_COUNT": len(tools),
              "TOOLS_EXPOSED_EQUIVALENT": 0 if not tools else len(tools),
              "CLI_PACKAGE": "opencode-ai@1.18.31",
              "MODEL": "opencode/big-pickle",
          }
          root.joinpath("summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2,default=str)+"\n",encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False))
          PY

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-stable-console-probe-${{ github.run_id }}
          path: artifacts/opencode-stable-probe/
          if-no-files-found: error
          retention-days: 14
