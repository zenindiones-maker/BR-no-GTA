name: Send Official Voice Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - '.run001/send-official-voice-proof.request.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: send-official-voice-proof
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "35444013735"
      SOURCE_ARTIFACT: "pronunciation-proof-35444013735-1"
      EXPECTED_OPENING_SHA256: "1a3cf7de3a6a570ba1079ab3ed38c80dd1614678ff3e64fe6b68b269fb03dc43"
      EXPECTED_FINAL_SHA256: "9e2e7a2d9717f460dd45cf0d07e96a4596e4f61372c6d87028b8809a052c59ca"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID || secrets.TELEGRAM_REVIEW_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gate6f-analytics-learning
          fetch-depth: 0
          persist-credentials: false

      - name: Recover exact human-approved source artifact
        run: |
          set -euo pipefail
          rm -rf runtime/official-voice-proof
          mkdir -p runtime/official-voice-proof/source runtime/official-voice-proof/evidence
          gh run download "$SOURCE_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "$SOURCE_ARTIFACT"             --dir runtime/official-voice-proof/source

          opening="runtime/official-voice-proof/source/samples/I-opening-fluid-2.mp3"
          final="runtime/official-voice-proof/source/samples/G-brand-mixed.mp3"
          test -s "$opening"
          test -s "$final"

          opening_sha="$(sha256sum "$opening" | awk '{print $1}')"
          final_sha="$(sha256sum "$final" | awk '{print $1}')"
          test "$opening_sha" = "$EXPECTED_OPENING_SHA256"
          test "$final_sha" = "$EXPECTED_FINAL_SHA256"

          echo "OFFICIAL_OPENING_FLUID2_HASH=PASS"
          echo "OFFICIAL_FINAL_SIGNATURE_HASH=PASS"

      - name: Send exact approved references to Telegram
        id: telegram
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "EXTERNAL_SECRET_BLOCKER=TELEGRAM_BOT_TOKEN"
            exit 2
          fi
          if [ -z "$TELEGRAM_REVIEW_CHAT_ID" ]; then
            echo "EXTERNAL_SECRET_BLOCKER=TELEGRAM_REVIEW_CHAT_ID"
            exit 2
          fi

          opening="runtime/official-voice-proof/source/samples/I-opening-fluid-2.mp3"
          final="runtime/official-voice-proof/source/samples/G-brand-mixed.mp3"

          curl --fail-with-body --silent --show-error             -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendAudio"             -F "chat_id=$TELEGRAM_REVIEW_CHAT_ID"             -F "audio=@$opening"             -F "performer=BR no GTA 6"             -F "title=Abertura oficial - Fluid 2"             -F "caption=BR no GTA 6 · PROVA OFICIAL 1/2 · ABERTURA · Voice B · Fluid 2 · referência humana aprovada de fluidez/prosódia."             > runtime/official-voice-proof/evidence/opening-response.json

          sleep 1

          curl --fail-with-body --silent --show-error             -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendAudio"             -F "chat_id=$TELEGRAM_REVIEW_CHAT_ID"             -F "audio=@$final"             -F "performer=BR no GTA 6"             -F "title=Assinatura final oficial - G"             -F "caption=BR no GTA 6 · PROVA OFICIAL 2/2 · ASSINATURA FINAL · Voice B · GTA 6 aprovado · Vice City aprovado."             > runtime/official-voice-proof/evidence/final-response.json

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root=Path("runtime/official-voice-proof")
          opening=root/"source/samples/I-opening-fluid-2.mp3"
          final=root/"source/samples/G-brand-mixed.mp3"

          def load(name):
              payload=json.loads((root/f"evidence/{name}-response.json").read_text())
              assert payload.get("ok") is True, payload
              return payload

          o=load("opening")
          f=load("final")
          evidence={
              "schema_version":1,
              "status":"PASS",
              "source_run_id":int(os.environ["SOURCE_RUN_ID"]),
              "source_artifact":os.environ["SOURCE_ARTIFACT"],
              "trigger_head":os.environ.get("GITHUB_SHA"),
              "opening":{
                  "sample":"I-opening-fluid-2.mp3",
                  "role":"HUMAN_APPROVED_PROSODY_REFERENCE",
                  "sha256":hashlib.sha256(opening.read_bytes()).hexdigest(),
                  "telegram_message_id":int(o["result"]["message_id"]),
              },
              "final_signature":{
                  "sample":"G-brand-mixed.mp3",
                  "role":"HUMAN_APPROVED_FINAL_END_SIGNATURE",
                  "sha256":hashlib.sha256(final.read_bytes()).hexdigest(),
                  "telegram_message_id":int(f["result"]["message_id"]),
                  "gta6_pronunciation_approved":True,
                  "vice_city_pronunciation_approved":True,
              },
              "voice":"Voice B",
              "voice_short_name":"pt-BR-ThalitaMultilingualNeural",
              "job18_unchanged":True,
              "publication_authority_unchanged":True,
              "youtube_publication":False,
          }
          (root/"evidence/official-voice-proof.json").write_text(
              json.dumps(evidence,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          print("OFFICIAL_VOICE_PROOF_TELEGRAM=PASS")
          print(f"OPENING_MESSAGE_ID={evidence['opening']['telegram_message_id']}")
          print(f"FINAL_SIGNATURE_MESSAGE_ID={evidence['final_signature']['telegram_message_id']}")
          print("JOB18_UNCHANGED=YES")
          print("YOUTUBE_PUBLICATION=NO")
          PY

      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-voice-proof-${{ github.run_id }}
          path: runtime/official-voice-proof/evidence/
          if-no-files-found: warn
          retention-days: 30
