name: BR V15 Grounded Launch and LlamaFactory Safety Preflight
on:
  push:
    branches:
      - work/br-v15-grounded-launch-preflight
    paths:
      - "app/services/br_grounded_launch_preflight_v15.py"
      - "scripts/br_grounded_launch_preflight_v15.py"
      - "tests/test_br_grounded_launch_preflight_v15.py"
      - "docs/architecture/br-grounded-launch-v15.md"
      - ".github/workflows/br-grounded-launch-preflight-v15.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v15-truth-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fail-closed:
    name: Evaluate real-shaped ledger events without private credentials or media
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install only bounded project test dependencies
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check \
            -r requirements.txt pytest==8.4.2 python-dotenv==1.2.3
      - name: Run real Git CAS and adversarial launch reality checks
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_br_grounded_launch_preflight_v15.py \
            tests/test_owner_voice_audition_ledger_store_integration.py \
            tests/test_owner_voice_ledger_transient_v13.py \
            tests/test_br_llamafactory_admission_v13.py
          echo "BR_V15_REAL_GIT_CAS_AND_DELIVERY_VS_IDENTITY=PASS"
          echo "BR_V15_LLAMAFACTORY_STAGED_NOT_TRAINING=PASS"
      - name: Test offline operator entrypoint with explicitly synthetic ledger head
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          fixture={
            "state":"CONFIRMED",
            "side_effect_status":"SENT",
            "confirmed_message_ids":{"reference":665,"clone":666,"control":667},
            "clone_identity_gate":"FAIL",
            "content_audio_prescreen":"FAIL",
            "human_review":"PENDING",
            "review_token":"must-not-appear-anywhere",
          }
          p=root/"synthetic-ledger-head.json"
          p.write_text(json.dumps(fixture))
          p.chmod(0o600)
          PY
          python scripts/br_grounded_launch_preflight_v15.py \
            --ledger-head "$RUNNER_TEMP/synthetic-ledger-head.json" \
            --latest-run-id 37808729277 \
            --latest-failure LEDGER_FAST_FORWARD_PUSH_REJECTED \
            --out "$RUNNER_TEMP/launch-v15.json"
          python - <<'PY'
          import json,os,stat
          from pathlib import Path
          file=Path(os.environ["RUNNER_TEMP"])/"launch-v15.json"
          a=json.loads(file.read_text())
          assert a["status"]=="PRODUCTION_RELEASE_BLOCKED"
          assert a["ledger_head"]["telegram_delivery_reported"] is True
          assert a["ledger_head"]["identity_gate_reported"]=="FAIL"
          assert a["llamafactory"]["training_permitted"] is False
          assert a["release_authorization"]=="FORBIDDEN"
          assert a["review_provenance_verified"] is False
          assert "must-not-appear-anywhere" not in file.read_text()
          assert stat.S_IMODE(file.stat().st_mode)==0o600
          print("BR_V15_OPERATOR_PREFLIGHT_PRIVATE_SANITIZED=PASS")
          print("BR_V15_ACTUAL_TELEGRAM_SEND_ATTEMPTED=FALSE")
          print("BR_V15_ACTUAL_LLM_TRAINING_ATTEMPTED=FALSE")
          PY
      - name: Full root regression suite
        run: |
          set -euo pipefail
          python -m pytest -q tests/
          echo "BR_V15_ROOT_SUITE=PASS"
          echo "BR_V15_CANONICAL_PROMOTION=NOT_ATTEMPTED"
          echo "BR_V15_BR_OWNER_V1_ACTIVATION=BLOCKED"
