name: Semantic Planner Context Profile

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "scripts/semantic_planner_context_profile.py"
      - ".github/workflows/semantic-planner-context-profile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      ZERO_COST_OPERATION: "TRUE"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt psutil==7.2.2
      - name: Measure current semantic prompt composition
        run: |
          set -euo pipefail
          python scripts/semantic_planner_context_profile.py
      - name: Upload context evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-planner-context-profile
          path: artifacts/semantic-context-profile/context-profile.json
          if-no-files-found: error
          retention-days: 30
