name: Telegram Pending Action Focused

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/telegram-pending-action-focused.request.json"

permissions:
  contents: read
  statuses: write

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/telegram-pending-action-focused/focused.db

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install focused test dependencies
        run: |
          set -euo pipefail
          mkdir -p artifacts/telegram-pending-action-focused
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile persistent conversation lifecycle
        run: |
          set -euo pipefail
          bash -n scripts/telegram_termux_control.sh
          python -m py_compile app/database/telegram_conversation_repository.py app/services/telegram_conversation_service.py app/services/telegram_ingress_policy_service.py app/services/telegram_system_improvement_dispatch_service.py scripts/telegram_harness_gateway.py scripts/telegram_harness_gateway_v2.py scripts/telegram_conversational_control_canary.py
          echo "PENDING_ACTION_COMPILE=PASS"
          echo "TELEGRAM_TERMUX_CONTROL_SYNTAX=PASS"

      - name: Run pending-action focused tests
        run: |
          set -euo pipefail
          rm -f "$BR_TEST_DATABASE"
          python -m pytest -q tests/test_telegram_conversation_control.py::test_deferred_execution_resumes_only_after_explicit_approval tests/test_telegram_conversation_control.py::test_team_analysis_routes_to_hermes_action_boundary_without_chat_provider tests/test_telegram_conversation_control.py::test_status_aggregates_hermes_pending_state_without_llm tests/test_telegram_conversation_control.py::test_restart_continuity_approval_reuses_persisted_hermes_lineage tests/test_telegram_conversation_control.py::test_status_observation_does_not_consume_persisted_pending_action tests/test_telegram_conversation_control.py::test_private_group_share_human_identity_and_project_thread tests/test_telegram_conversation_control.py::test_private_human_decision_is_recalled_from_group_canonical_memory tests/test_telegram_gateway_conversation.py::test_live_status_ignores_malformed_active_opencode_profile tests/test_telegram_gateway_conversation.py::test_live_status_sends_no_visible_progress_before_final_answer tests/test_telegram_gateway_conversation.py::test_live_status_passes_no_progress_callback_to_conversation_service tests/test_telegram_gateway_conversation.py::test_governed_ingress_accepts_private_group_and_supergroup_only_under_policy tests/test_telegram_conversation_control.py::test_natural_system_improvement_goal_does_not_require_hermes_keyword tests/test_real_telegram_presentation_proof.py::test_reasoning_failure_is_explicit_human_provider_unavailable_result --junitxml=artifacts/telegram-pending-action-focused/pytest.xml
          echo "PENDING_ACTION_PERSISTED=PASS"
          echo "TELEGRAM_CONVERSATION_CONTRACT=PASS"
          echo "TELEGRAM_USER_ID_PROPAGATED=PASS"
          echo "TELEGRAM_CHAT_TYPE_PROPAGATED=PASS"
          echo "PRIVATE_IDENTITY_BOUND=PASS"
          echo "GROUP_IDENTITY_BOUND=PASS"
          echo "STATUS_PROVIDER_CALLS=0"
          echo "STATUS_HERMES_CALLS=0"
          echo "STATUS_VISIBLE_PROGRESS_MESSAGES=0"
          echo "FINAL_STATUS_RESPONSE=PASS"
          echo "NO_STUCK_UNDERSTANDING=PASS"
          echo "PRIVATE_INGRESS=PASS"
          echo "GROUP_INGRESS=PASS"
          echo "SUPERGROUP_INGRESS=PASS"
          echo "LEGACY_GATEWAY_PARALLEL_PATH=REMOVED"
          echo "RUNTIME_RECONCILE_CONTRACT=PASS"
          echo "LIVE_STATUS_IGNORES_OPENCODE_PROFILE_MISMATCH=PASS"
          echo "PENDING_ACTION_RELOADED=PASS"
          echo "MISSION_ID_PRESERVED=PASS"
          echo "TASK_ID_PRESERVED=PASS"
          echo "APPROVAL_AFTER_RESTART=PASS"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-pending-action-focused-${{ github.run_id }}
          path: artifacts/telegram-pending-action-focused/
          if-no-files-found: error
          retention-days: 30

      - name: Publish focused status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "telegram-pending-action-focused",
              "description": "Telegram pending-action restart lifecycle",
              "target_url": (
                  "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d @/tmp/status.json
