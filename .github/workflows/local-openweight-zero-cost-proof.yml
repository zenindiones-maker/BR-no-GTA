name: Local Open-Weight Zero-Cost Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "scripts/local_openweight_zero_cost_probe.py"
      - ".github/workflows/local-openweight-zero-cost-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZERO_COST_OPERATION: "TRUE"
      OLLAMA_VERSION: "0.34.2"
      OLLAMA_MODEL: "qwen3:4b-instruct"
      OLLAMA_EXPECTED_DIGEST_PREFIX: "0edcdef34593"
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NO_CLOUD: "1"
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@v4

      - name: Record standard public runner identity
        run: |
          set -euo pipefail
          mkdir -p artifacts/local-openweight-zero-cost
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "repository_private=$REPOSITORY_PRIVATE"
            echo "zero_cost_operation=$ZERO_COST_OPERATION"
          } | tee artifacts/local-openweight-zero-cost/runtime.txt
          test "$REPOSITORY_PRIVATE" = "false"
          test "$ZERO_COST_OPERATION" = "TRUE"

      - name: Install pinned Ollama
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          }
          curl --fail --show-error --location             "https://raw.githubusercontent.com/ollama/ollama/v0.34.2/scripts/install.sh"             -o artifacts/local-openweight-zero-cost/ollama-install.sh
          sha256sum artifacts/local-openweight-zero-cost/ollama-install.sh             | tee artifacts/local-openweight-zero-cost/ollama-install.sha256
          OLLAMA_VERSION="$OLLAMA_VERSION" OLLAMA_NO_START=1             sh artifacts/local-openweight-zero-cost/ollama-install.sh
          ollama --version             | tee artifacts/local-openweight-zero-cost/ollama-version.txt
          ollama --version | grep -F "$OLLAMA_VERSION"

      - name: Start loopback-only local inference server
        run: |
          set -euo pipefail
          nohup env             OLLAMA_HOST="$OLLAMA_HOST"             OLLAMA_NO_CLOUD="$OLLAMA_NO_CLOUD"             ollama serve             > artifacts/local-openweight-zero-cost/ollama.log 2>&1 &
          echo "$!" > artifacts/local-openweight-zero-cost/ollama.pid
          READY=0
          for i in {1..60}; do
            if ! kill -0 "$(cat artifacts/local-openweight-zero-cost/ollama.pid)" 2>/dev/null; then
              break
            fi
            if curl --connect-timeout 1 --max-time 2 -fsS               http://127.0.0.1:11434/api/tags               > artifacts/local-openweight-zero-cost/tags-before-pull.json 2>/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1"
          ss -H -ltn 'sport = :11434'             | tee artifacts/local-openweight-zero-cost/listener.txt
          python - <<'PY'
          import subprocess
          rows=subprocess.check_output(
              ["ss","-H","-ltn","sport = :11434"], text=True
          ).splitlines()
          assert rows, "Ollama listener missing"
          addresses=[row.split()[3] for row in rows]
          assert all(
              address in {"127.0.0.1:11434","[::1]:11434"}
              for address in addresses
          ), addresses
          print("LOCAL_OPENWEIGHT_LOOPBACK_ONLY=PASS")
          PY

      - name: Pull exact open-weight model
        run: |
          set -euo pipefail
          ollama pull "$OLLAMA_MODEL"             | tee artifacts/local-openweight-zero-cost/model-pull.txt
          curl --fail --show-error --silent             http://127.0.0.1:11434/api/tags             > artifacts/local-openweight-zero-cost/tags-after-pull.json
          python - <<'PY'
          import json, os
          data=json.load(open("artifacts/local-openweight-zero-cost/tags-after-pull.json"))
          expected=os.environ["OLLAMA_MODEL"]
          prefix=os.environ["OLLAMA_EXPECTED_DIGEST_PREFIX"]
          rows=[
              item for item in data.get("models",[])
              if item.get("name")==expected or item.get("model")==expected
          ]
          assert len(rows)==1, rows
          digest=str(rows[0].get("digest") or "")
          normalized=digest.removeprefix("sha256:")
          assert normalized.startswith(prefix), (digest,prefix)
          print("LOCAL_OPENWEIGHT_MODEL_DIGEST=PASS")
          print("LOCAL_OPENWEIGHT_OBSERVED_DIGEST="+digest)
          PY

      - name: Prove real inference with external network disabled
        id: inference
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo iptables-save > artifacts/local-openweight-zero-cost/iptables-before.rules
          if command -v ip6tables-save >/dev/null; then
            sudo ip6tables-save > artifacts/local-openweight-zero-cost/ip6tables-before.rules
          fi
          restore_network() {
            sudo iptables-restore < artifacts/local-openweight-zero-cost/iptables-before.rules || true
            if [ -f artifacts/local-openweight-zero-cost/ip6tables-before.rules ]; then
              sudo ip6tables-restore < artifacts/local-openweight-zero-cost/ip6tables-before.rules || true
            fi
          }
          trap restore_network EXIT

          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -j REJECT
          if command -v ip6tables >/dev/null; then
            sudo ip6tables -I OUTPUT 1 -o lo -j ACCEPT
            sudo ip6tables -I OUTPUT 2 -j REJECT
          fi
          sudo iptables -S OUTPUT             > artifacts/local-openweight-zero-cost/iptables-during-inference.txt
          if command -v ip6tables >/dev/null; then
            sudo ip6tables -S OUTPUT               > artifacts/local-openweight-zero-cost/ip6tables-during-inference.txt
          fi

          set +e
          python scripts/local_openweight_zero_cost_probe.py             --output artifacts/local-openweight-zero-cost/proof.json             --ollama-version "$OLLAMA_VERSION"             --repository-private "$REPOSITORY_PRIVATE"             --egress-blocked
          RC=$?
          set -e
          echo "probe_rc=$RC" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Shutdown local model runtime
        if: always()
        run: |
          if [ -f artifacts/local-openweight-zero-cost/ollama.pid ]; then
            kill "$(cat artifacts/local-openweight-zero-cost/ollama.pid)" 2>/dev/null || true
          fi

      - name: Upload local open-weight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-openweight-zero-cost-proof
          path: artifacts/local-openweight-zero-cost/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce local provider proof
        if: steps.inference.outcome != 'success'
        run: |
          echo "LOCAL_OPENWEIGHT_ZERO_COST_PROOF=FAIL"
          exit 1
