name: BR ArtCraft FilmCraft Real Native Frame

on:
  push:
    branches:
      - work/br-artcraft-film-real-frame-proof-v1
    paths:
      - .github/workflows/br-artcraft-film-real-frame.yml
      - scripts/artcraft_single_native_film_proof.py

permissions:
  contents: read
  actions: read

concurrency:
  group: artcraft-real-film-frame-proof
  cancel-in-progress: false

jobs:
  exact-film-native:
    name: Real SHA-verified FilmCraft PNG in no-network container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted BR study files without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Recover completed SHA-pinned binary artifact via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p film-proof-evidence
          gh run download 38014176264 -R "$GITHUB_REPOSITORY" \
            -n artcraft-real-native-filmcraft -D film-proof-evidence
          test -s film-proof-evidence/filmcraft-cli
          test -s film-proof-evidence/result.json
          python3 - <<'PY'
          import hashlib,hmac,json
          from pathlib import Path
          p=Path("film-proof-evidence/filmcraft-cli")
          d=json.loads(Path("film-proof-evidence/result.json").read_text())
          assert d["pinned_sha"]=="7b6c134472287db4367fca80bcb498240ba36567"
          assert d["source_status"]=="verified"
          for gate in ("build_status","tests_status","cli_status","cli_smoke_status"):
              assert d[gate]=="success", (gate,d.get(gate))
          a=d["compiled_artifact"]
          assert a["filename"]=="filmcraft-cli" and a["debug_stripped"] is True
          assert p.stat().st_size==a["bytes"]
          digest=hashlib.file_digest(p.open("rb"),"sha256").hexdigest()
          assert hmac.compare_digest(digest,a["sha256"])
          print("PINNED_REAL_FILMCRAFT_BINARY=PASS",digest)
          PY
      - name: Create public-system-only runtime sandbox, no upstream code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/br-real-film-image"
          cat > "$RUNNER_TEMP/br-real-film-image/Dockerfile" <<'DOCKERFILE'
          FROM python:3.12-slim-bookworm
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ffmpeg libasound2 libudev1 libx11-6 libxkbcommon0 libxcursor1 libxrandr2 libxi6 \
              libgl1 libwayland-client0 libfontconfig1 libfreetype6 libdbus-1-3 \
              libgtk-3-0 libvulkan1 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker build --tag artcraft-film-real-sandbox:v1 \
            --file "$RUNNER_TEMP/br-real-film-image/Dockerfile" \
            "$RUNNER_TEMP/br-real-film-image"
          chmod u+x film-proof-evidence/filmcraft-cli
          mkdir -p film-real-qa/fixtures film-real-qa/frames
          python3 -m py_compile scripts/artcraft_single_native_film_proof.py
      - name: Create reference media using synthetic-only FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 2g --cpus 1 \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/scripts:/scripts:ro" -v "$PWD/film-real-qa/fixtures:/fixtures:rw" \
            artcraft-film-real-sandbox:v1 \
            python3 /scripts/artcraft_make_synthetic_interop_fixtures.py /fixtures
      - name: Render actual FilmCraft frame inside credential-free disconnected Docker
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,nosuid,size=256m \
            --pids-limit 256 --memory 4g --cpus 2 \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/docs/research/artcraft-seven-pinned-sources.json:/manifest.json:ro" \
            -v "$PWD/film-proof-evidence:/evidence:ro" \
            -v "$PWD/film-real-qa/fixtures:/fixtures:ro" \
            -v "$PWD/film-real-qa/frames:/out:rw" \
            artcraft-film-real-sandbox:v1 \
            python3 /scripts/artcraft_single_native_film_proof.py \
              --manifest /manifest.json --fixtures /fixtures \
              --binary /evidence/filmcraft-cli --build-receipt /evidence/result.json \
              --output /out
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("film-real-qa/frames/native-filmcraft-receipt.json").read_text())
          assert d["gate"]=="PASS" and d["native_executed"] is True
          assert d["production_approved"] is False
          assert d["harness_authority"]=="NONE"
          print("FILMCRAFT_NATIVE_REAL_PROOF=PASS",d["frame"])
          PY
          ffmpeg -hide_banner -v error -nostdin -i film-real-qa/frames/real-filmcraft-frame.png \
            -frames:v 1 -f null -
          sha256sum film-real-qa/frames/real-filmcraft-frame.png
      - name: Preserve native binary provenance and FilmCraft actual frame
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-filmcraft-real-render-evidence
          path: film-real-qa/
          if-no-files-found: warn
          retention-days: 30
