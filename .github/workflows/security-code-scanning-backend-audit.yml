name: Security Code Scanning Backend Audit

on:
  push:
    branches:
      - audit/code-scanning-backend-1d834

permissions: {}

jobs:
  backend-audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CANDIDATE_SHA: c3fcf264cf4b93250f26a8df03b9cb2c920e8514
      CANDIDATE_REF: refs/heads/staging/security-guardian-foundation-v1
    steps:
      - name: Query authenticated CodeQL analyses
        shell: bash
        run: |
          set -euo pipefail
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "repos/${REPOSITORY}/code-scanning/analyses?tool_name=CodeQL&ref=${CANDIDATE_REF}&per_page=100"             > "${RUNNER_TEMP}/candidate-analyses.json"

      - name: Prove exact candidate CodeQL analysis
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          items=json.loads((Path(os.environ["RUNNER_TEMP"])/"candidate-analyses.json").read_text())
          sha=os.environ["CANDIDATE_SHA"]
          ref=os.environ["CANDIDATE_REF"]
          exact=[
              item for item in items
              if item.get("commit_sha")==sha
              and item.get("ref")==ref
              and ((item.get("tool") or {}).get("name")=="CodeQL")
          ]
          exact.sort(key=lambda x:(x.get("created_at") or "",x.get("id") or 0),reverse=True)
          if not exact:
              print("CODE_SCANNING_BACKEND_PROOF=FAIL")
              raise SystemExit("EXACT_CODEQL_ANALYSIS_MISSING")
          item=exact[0]
          fields={
              "CODEQL_ANALYSIS_ID":item.get("id"),
              "CODEQL_ANALYSIS_REF":item.get("ref"),
              "CODEQL_ANALYSIS_COMMIT_SHA":item.get("commit_sha"),
              "CODEQL_ANALYSIS_KEY":item.get("analysis_key"),
              "CODEQL_ANALYSIS_CATEGORY":item.get("category"),
              "CODEQL_ANALYSIS_ENVIRONMENT":item.get("environment"),
              "CODEQL_ANALYSIS_RESULTS_COUNT":item.get("results_count"),
              "CODEQL_ANALYSIS_RULES_COUNT":item.get("rules_count"),
              "CODEQL_ANALYSIS_ERROR":item.get("error"),
              "CODEQL_ANALYSIS_CREATED_AT":item.get("created_at"),
          }
          for k,v in fields.items():
              print(f"{k}={v}")
          if item.get("error") not in (None,""):
              print("CODE_SCANNING_BACKEND_PROOF=FAIL")
              raise SystemExit("CODEQL_ANALYSIS_ERROR")
          print("CODE_SCANNING_BACKEND_PROOF=PASS")
          PY
