name: Security Code Scanning Backend Audit

on:
  push:
    branches:
      - audit/code-scanning-backend-1d834

permissions: {}

jobs:
  backend-audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CANDIDATE_SHA: 1d834b5ddc8b7d7bcc1850b48ac5b87b0ae76ad5
      CANDIDATE_REF: refs/heads/staging/security-guardian-foundation-v1
      CANONICAL_SHA: 0e6704ecd60ed2f7266b4b299017910a6491e068
      CANONICAL_REF: refs/heads/work/gate6f-analytics-learning
    steps:
      - name: Query authenticated CodeQL analyses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "repos/${REPOSITORY}/code-scanning/analyses?tool_name=CodeQL&ref=${CANDIDATE_REF}&per_page=100"             > "${RUNNER_TEMP}/candidate-analyses.json"

          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "repos/${REPOSITORY}/code-scanning/analyses?tool_name=CodeQL&ref=${CANONICAL_REF}&per_page=100"             > "${RUNNER_TEMP}/canonical-analyses.json"

      - name: Prove exact candidate and canonical CodeQL analyses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          candidate = json.loads((temp / "candidate-analyses.json").read_text())
          canonical = json.loads((temp / "canonical-analyses.json").read_text())

          def choose(items, sha, ref):
              exact = [
                  item for item in items
                  if item.get("commit_sha") == sha
                  and item.get("ref") == ref
                  and ((item.get("tool") or {}).get("name") == "CodeQL")
              ]
              exact.sort(key=lambda x: (x.get("created_at") or "", x.get("id") or 0), reverse=True)
              return exact[0] if exact else None

          cand = choose(candidate, os.environ["CANDIDATE_SHA"], os.environ["CANDIDATE_REF"])
          canon = choose(canonical, os.environ["CANONICAL_SHA"], os.environ["CANONICAL_REF"])

          def emit(prefix, item):
              if item is None:
                  print(prefix + "_FOUND=NO")
                  return
              print(prefix + "_FOUND=YES")
              print(prefix + "_ID=" + str(item.get("id")))
              print(prefix + "_REF=" + str(item.get("ref")))
              print(prefix + "_COMMIT_SHA=" + str(item.get("commit_sha")))
              print(prefix + "_ANALYSIS_KEY=" + str(item.get("analysis_key")))
              print(prefix + "_RESULTS_COUNT=" + str(item.get("results_count")))
              print(prefix + "_RULES_COUNT=" + str(item.get("rules_count")))
              print(prefix + "_ERROR=" + str(item.get("error")))
              print(prefix + "_CATEGORY=" + str(item.get("category")))
              print(prefix + "_ENVIRONMENT=" + str(item.get("environment")))
              print(prefix + "_CREATED_AT=" + str(item.get("created_at")))

          emit("CANDIDATE_ANALYSIS", cand)
          emit("CANONICAL_ANALYSIS", canon)

          if cand is None or cand.get("error"):
              print("CODE_SCANNING_BACKEND_PROOF=FAIL")
              print("BLOCKER=GITHUB_CODE_SCANNING_RULE_NOT_SATISFIED")
              raise SystemExit(20)

          if canon is None or canon.get("error"):
              print("CODE_SCANNING_BACKEND_PROOF=FAIL")
              print("BLOCKER=GITHUB_CODE_SCANNING_RULE_NOT_SATISFIED")
              raise SystemExit(21)

          print("CODEQL_ANALYSES_EXACT_BINDING=PASS")
          PY

      - name: Probe default setup administrative endpoint
        shell: bash
        run: |
          set +e
          body="${RUNNER_TEMP}/default-setup.json"
          err="${RUNNER_TEMP}/default-setup.stderr"
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "repos/${REPOSITORY}/code-scanning/default-setup"             >"$body" 2>"$err"
          rc=$?
          set -e
          echo "DEFAULT_SETUP_QUERY_RC=$rc"
          if [ "$rc" -eq 0 ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"default-setup.json").read_text())
          print("DEFAULT_SETUP_STATE="+str(d.get("state")))
          print("DEFAULT_SETUP_LANGUAGES="+json.dumps(d.get("languages"), sort_keys=True))
          print("DEFAULT_SETUP_QUERY_SUITE="+str(d.get("query_suite")))
          print("DEFAULT_SETUP_UPDATED_AT="+str(d.get("updated_at")))
          PY
          else
            echo "DEFAULT_SETUP_STATE=UNVERIFIED_ADMIN_READ_REQUIRED"
            sed -E 's/[A-Za-z0-9_=-]{20,}/[REDACTED]/g' "$err" || true
            exit 22
          fi
