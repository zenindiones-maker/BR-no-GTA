name: DeepSeek Harness

on:
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BR-no-GTA
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Environment
        run: |
          echo "===== ENVIRONMENT ====="
          uname -a
          node -v
          npm -v
          git --version
          python3 --version

      - name: Install pnpm
        run: |
          echo "===== PNPM ====="
          npm install --global pnpm@10
          pnpm --version

      - name: DeepSeek Harness CLI
        run: |
          echo "===== DSH HELP ====="
          npx --yes @deepseek-ai/dsh --help

      - name: DeepSeek Harness plugin manager
        run: |
          echo "===== DSH PLUGIN ====="
          npx --yes @deepseek-ai/dsh plugin --profile headless list

      - name: DeepSeek Harness Package
        run: |
          echo "===== PACKAGE ====="
          npm view @deepseek-ai/dsh name version description repository.url

      - name: BR baseline
        run: |
          echo "===== BR GIT ====="
          git rev-parse HEAD
          git status --short

      - name: Install BR dependencies
        run: |
          echo "===== PYTHON DEPENDENCIES ====="
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest==9.1.1

      - name: MCP SDK
        run: |
          echo "===== MCP SDK ====="
          python3 -m pip show mcp
          python3 - <<'PY'
          import mcp
          from mcp.server.fastmcp import FastMCP
          print("MCP IMPORT: OK")
          print("FASTMCP: OK")
          PY

      - name: DSH MCP discovery
        run: |
          echo "===== DSH MCP DISCOVERY ====="
          printf '%s\\n' "Verificando patch do BR MCP..."
          test -f .dsh/cordis.patch.yml
          grep -A14 -B2 "mcp-br" .dsh/cordis.patch.yml

          echo "===== DSH CONFIG ====="
          npx --yes @deepseek-ai/dsh \
            --profile headless \
            --patch .dsh/cordis.patch.yml \
            --dump-config 2>&1 | tee /tmp/dsh-config.log

          echo "===== MCP SERVER DIRECT DISCOVERY ====="
          python3 - <<'PY2'
          import asyncio
          import sys

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              server = StdioServerParameters(
                  command=sys.executable,
                  args=["-m", "app.integrations.deepseek_harness.server"],
              )

              async with stdio_client(server) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      result = await session.list_tools()

                      names = [tool.name for tool in result.tools]

                      print("MCP TOOLS:", names)
                      print("TOTAL:", len(names))

                      expected = {
                          "br_research_run",
                          "br_editorial_process_next",
                          "br_execution_run_once",
                          "br_gta6_monitor_run_once",
                      }

                      assert set(names) == expected
                      assert len(names) == 4

                      print("MCP DISCOVERY: OK")

          asyncio.run(main())
          PY2

          echo "===== DSH MCP PATCH CHECK ====="
          grep -q "serverName: br" .dsh/cordis.patch.yml
          grep -q "app.integrations.deepseek_harness.server" .dsh/cordis.patch.yml
          echo "DSH MCP CONFIG: OK"

      - name: BR tests
        run: |
          echo "===== PYTEST ====="
          python3 --version
          python3 -m pytest -q
