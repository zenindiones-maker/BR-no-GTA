name: DeepSeek Harness

on:
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BR-no-GTA
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Environment
        run: |
          echo "===== ENVIRONMENT ====="
          uname -a
          node -v
          npm -v
          git --version
          python3 --version

      - name: Install pnpm
        run: |
          echo "===== PNPM ====="
          npm install --global pnpm@10
          pnpm --version

      - name: DeepSeek Harness CLI
        run: |
          echo "===== DSH HELP ====="
          npx --yes @deepseek-ai/dsh --help

      - name: DeepSeek Harness plugin manager
        run: |
          echo "===== DSH PLUGIN ====="
          npx --yes @deepseek-ai/dsh plugin --profile headless list

      - name: DeepSeek Harness Package
        run: |
          echo "===== PACKAGE ====="
          npm view @deepseek-ai/dsh name version description repository.url

      - name: BR baseline
        run: |
          echo "===== BR GIT ====="
          git rev-parse HEAD
          git status --short

      - name: Install BR dependencies
        run: |
          echo "===== PYTHON DEPENDENCIES ====="
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pytest==9.1.1

      - name: BR tests
        run: |
          echo "===== PYTEST ====="
          python3 --version
          python3 -m pytest -q
