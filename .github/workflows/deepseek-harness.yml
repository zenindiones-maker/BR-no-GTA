name: DeepSeek Harness

on:
  workflow_dispatch:

jobs:
  harness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout BR-no-GTA
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Environment
        run: |
          echo "===== ENVIRONMENT ====="
          uname -a
          node -v
          npm -v
          git --version
          python3 --version

      - name: DeepSeek Harness CLI
        run: |
          echo "===== DSH HELP ====="
          npx --yes @deepseek-ai/dsh --help

      - name: DeepSeek Harness Package
        run: |
          echo "===== PACKAGE ====="
          npm view @deepseek-ai/dsh name version description repository.url

      - name: BR baseline
        run: |
          echo "===== BR GIT ====="
          git rev-parse HEAD
          git status --short

      - name: BR tests
        run: |
          echo "===== PYTEST ====="
          python3 -m pip install -q pytest
          python3 -m pytest -q
