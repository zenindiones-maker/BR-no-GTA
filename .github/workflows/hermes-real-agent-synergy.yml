name: Hermes Real Agent Synergy

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/hermes-real-agent-synergy.request.json"

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: hermes-real-agent-synergy
  cancel-in-progress: true

env:
  PYTHONPATH: .
  GH_TOKEN: ${{ github.token }}
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/hermes-real-agent-synergy/synergy.db
  BR_HERMES_UPSTREAM_ROOT: ${{ github.workspace }}/.runtime/hermes-agent
  BR_OPENCODE_NATIVE_REPOSITORY: ${{ github.repository }}
  BR_OPENCODE_NATIVE_REF: ${{ github.ref_name }}
  BR_OPENCODE_NATIVE_SOURCE_SHA: ${{ github.sha }}
  BR_OPENCODE_NATIVE_EXECUTION_MODE: same_runner
  BR_OPENCODE_NATIVE_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/hermes-real-agent-synergy/opencode
  AGENT_OFFICE_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/hermes-real-agent-synergy/agent-office
  ZERO_COST_OPERATION: "TRUE"

jobs:
  synergy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install bounded collaboration runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/hermes-real-agent-synergy .runtime
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install psutil==7.2.2 pyyaml==6.0.3 python-dotenv==1.2.2 rich==14.3.3 pathspec==1.1.1
          npm install --global @opencode/cli@2.0.8
          test "$(opencode --version | awk '{print $NF}' | tr -d '\r' | sed -E 's/^v//')" = "2.0.8"
          echo "BOUNDED_COLLABORATION_RUNTIME=PASS"

      - name: Bootstrap pinned Hermes core
        run: |
          set -euo pipefail
          python scripts/bootstrap_hermes_agent.py             --target "$BR_HERMES_UPSTREAM_ROOT"             --output artifacts/hermes-real-agent-synergy/hermes-upstream.json
          test "$(git -C "$BR_HERMES_UPSTREAM_ROOT" rev-parse HEAD)" = "9eca7f388f71755293343dddd6ec4d9111d68fc4"
          test "$(git -C "$BR_HERMES_UPSTREAM_ROOT" status --porcelain)" = ""
          echo "HERMES_UPSTREAM_PINNED=PASS"

      - name: Compile real-agent boundary
        run: |
          set -euo pipefail
          python -m py_compile             app/services/hermes_multiagent/*.py             scripts/hermes_real_agent_synergy_canary.py             scripts/opencode_semantic_text_v3_proof.py
          echo "HERMES_REAL_AGENT_COMPILE=PASS"

      - name: Run focused broker Registry and lifecycle tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ env.BR_HERMES_UPSTREAM_ROOT }}
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_hermes_real_agent_synergy.py             tests/test_hermes_multiagent_boundary.py             tests/test_hermes_kanban_live_core.py             tests/test_global_capability_registry.py             tests/test_harness_routing_policy_service.py             tests/test_telegram_harness_integration.py             tests/test_opencode_semantic_text_profile.py             tests/test_delegated_agent_autonomy.py             tests/test_agent_office.py             --junitxml=artifacts/hermes-real-agent-synergy/focused.xml
          echo "HERMES_REAL_AGENT_FOCUSED=PASS"

      - name: Prove semantic OpenCode v3 on this runner
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ env.BR_HERMES_UPSTREAM_ROOT }}
        run: |
          set -euo pipefail
          python scripts/opencode_semantic_text_v3_proof.py             --output artifacts/hermes-real-agent-synergy/opencode-semantic-v3-proof.json             | tee artifacts/hermes-real-agent-synergy/opencode-semantic-v3-proof.log
          echo "OPENCODE_SEMANTIC_V3_RUNTIME=PASS"

      - name: Bootstrap bounded Codex Agent Office runtime
        run: |
          set -euo pipefail
          bash scripts/agent-tooling/bootstrap.sh codex
          codex_home="$RUNNER_TEMP/br-hermes-real-synergy-codex-$GITHUB_RUN_ID"
          install -d -m 700 "$codex_home"
          echo "CODEX_HOME=$codex_home" >> "$GITHUB_ENV"
          bash scripts/prepare_codex_linux_sandbox.sh
          python scripts/codex_sandbox_preflight.py             --repository-root "$GITHUB_WORKSPACE"             --output artifacts/hermes-real-agent-synergy/codex-sandbox-preflight.json
          echo "AGENT_OFFICE_RUNTIME=PASS"

      - name: Trusted Codex authentication bootstrap
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ vars.TELEGRAM_ALLOWED_USER_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          set -euo pipefail
          codex --version
          python scripts/codex_auth_bootstrap.py             --output artifacts/hermes-real-agent-synergy/codex-auth-status.json             --allow-device-auth             --timeout-seconds 2700
          echo "CODEX_AUTH_PREREQUISITE=PASS"

      - name: Execute real Registry agents through Hermes
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ env.BR_HERMES_UPSTREAM_ROOT }}
        run: |
          set -euo pipefail
          before="$(git status --porcelain --untracked-files=no)"
          python scripts/hermes_real_agent_synergy_canary.py             --upstream-root "$BR_HERMES_UPSTREAM_ROOT"             --artifact-dir artifacts/hermes-real-agent-synergy             2>&1 | tee artifacts/hermes-real-agent-synergy/canary.log
          after="$(git status --porcelain --untracked-files=no)"
          test "$before" = "$after"
          echo "CANONICAL_WORKTREE_MUTATION=NONE"

      - name: Validate required real synergy gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path("artifacts/hermes-real-agent-synergy/hermes-real-agent-synergy-proof.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["status"]=="PASS",d["checks"]
          required=[
              "REGISTRY_TO_HERMES_ROSTER",
              "REAL_AGENT_ID_PRESERVED",
              "REAL_CAPABILITY_EXECUTION",
              "GTA6_BRAIN_COLLABORATION",
              "BRAIN_RECOMMENDATION_RETURNED_TO_HARNESS",
              "TUBEGENT_COLLABORATION",
              "SYSTEM_IMPROVEMENT_COLLABORATION",
              "AGENT_OFFICE_COLLABORATION",
              "AGENT_TO_AGENT_HANDOFF",
              "CROSS_AGENT_EVIDENCE_CONSUMED",
              "REVIEW_REQUEST_CHANGES",
              "BLOCK_AND_RESUME",
              "HUMAN_TELEGRAM_LOOP",
              "HARNESS_AUTHORIZATION_PER_EXECUTION",
              "NO_DIRECT_EXECUTOR_BYPASS",
              "NO_SECOND_REGISTRY",
              "NO_SECOND_MEMORY",
              "NO_SECOND_LEARNING_PLANE",
              "PUBLICATION_AUTHORITY_NONE",
              "RIGHT_AGENT_FOR_RIGHT_TASK",
              "HERMES_LEARNING_EPISODES",
              "NO_NEW_VOICE_SYNTHESIS",
              "NO_FULL_RENDER",
              "NO_YOUTUBE_UPLOAD",
              "NO_YOUTUBE_PUBLICATION",
          ]
          for key in required:
              assert d["checks"].get(key) is True,(key,d["checks"])
              print(f"{key}=PASS")
          assert d["checks"]["BRAIN_DIRECT_EXECUTION"] is False,d["checks"]
          print("BRAIN_DIRECT_EXECUTION=NO")
          print("PUBLICATION_AUTHORITY=NONE")
          print("HERMES_REAL_AGENT_SYNERGY=PASS")
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER=NO")
          print("YOUTUBE_UPLOAD=NO")
          print("YOUTUBE_PUBLICATION=NO")
          PY

      - name: Upload complete real synergy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-real-agent-synergy-${{ github.run_id }}
          path: artifacts/hermes-real-agent-synergy/
          if-no-files-found: error
          retention-days: 30

      - name: Publish commit status
        if: always()
        env:
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json,os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "hermes-real-agent-synergy",
              "description": "Hermes real Registry-agent synergy",
              "target_url": (
                  "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d @/tmp/status.json
