name: Phone Control Harness Validation

on:
  push:
    branches:
      - work/phone-control-harness
  pull_request:
    paths:
      - "app/services/phone_control_*.py"
      - "app/services/harness_mcp_capability_execution.py"
      - "app/integrations/deepseek_harness/server.py"
      - "app/services/global_capability_registry.py"
      - "app/services/global_capability_registry_base.py"
      - "app/settings.py"
      - "tests/test_phone_control_service.py"
      - "tests/test_phone_control_mcp_boundary.py"
      - ".github/workflows/phone-control-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Create isolated test venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pytest

      - name: Compile touched Python
        run: |
          .venv/bin/python -m compileall -q \
            app/services/global_capability_registry.py \
            app/services/global_capability_registry_base.py \
            app/services/phone_control_service.py \
            app/services/phone_control_runtime.py \
            app/services/phone_control_harness_service.py \
            app/services/harness_mcp_capability_execution.py \
            app/integrations/deepseek_harness/server.py \
            app/settings.py \
            tests/test_phone_control_service.py \
            tests/test_phone_control_mcp_boundary.py

      - name: Focused phone and Harness tests
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_phone_control_service.py \
            tests/test_phone_control_mcp_boundary.py \
            tests/test_harness_authorization_service.py \
            tests/test_global_capability_registry.py \
            tests/test_harness_routing_policy_service.py \
            tests/test_harness_capability_service.py \
            tests/test_deepseek_harness.py

      - name: Diff and secret guard
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          # A historical hard-coded base included unrelated old documentation.
          # Compare only the current event's introduced changes, with the same
          # whitespace, path and secret guards still enforced.
          base="${EVENT_BASE_SHA}"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0{40}$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "${base}^{commit}"
          common="$(git merge-base "${base}" HEAD)"
          test -n "$common"
          echo "PHONE_REVIEW_DIFF_BASE=$common"
          git diff --check "${common}..HEAD"
          test -z "$(git diff --name-only "${common}..HEAD" | grep -Ei 'job.?18' || true)"
          ! git diff "${common}..HEAD" -- . ':!tests/test_phone_control_service.py' ':!tests/test_phone_control_mcp_boundary.py' | grep -E 'BR_PHONE_PORTAL_TOKEN[[:space:]]*=[[:space:]]*[^"'"']+'

      - name: Canonical full application suite
        run: .venv/bin/python -m pytest -q tests/
