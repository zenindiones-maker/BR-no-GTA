name: RUN-001 Job19 Redispatch

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .github/workflows/run001-job19-redispatch.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  redispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recover exact Job19 envelope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/job19
          gh run download 34982292834 \
            --repo "$GITHUB_REPOSITORY" \
            --name render-failure-34982292834-1 \
            --dir /tmp/job19
          JOB_FILE="$(find /tmp/job19 -path '*/materialization/*/19/render-job.json' -print -quit)"
          test -n "$JOB_FILE"
          python - "$JOB_FILE" <<'PY'
          import json, pathlib, sys
          src = pathlib.Path(sys.argv[1])
          job = json.loads(src.read_text(encoding="utf-8"))
          assert job["render_job_id"] == 19
          assert job["video_id"] == 4
          assert job["execution_id"] == "7307774b-b6c4-48e7-8b43-b13dce9ec50f"
          assert job["brain_decision_id"] == "9a783198-11a7-497b-98e8-0c172798b655"
          assert job["authorized_action"] == "EXECUTION"
          assert job.get("lineage", {}).get("zero_cost_operation") is True
          pathlib.Path("/tmp/render-job.json").write_text(
              json.dumps(job, separators=(",", ":"), ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Dispatch real render on patched branch HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run render-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref work/gate6f-analytics-learning \
            --raw-field render_job="$(cat /tmp/render-job.json)" \
            --raw-field brain_decision_id="9a783198-11a7-497b-98e8-0c172798b655" \
            --raw-field execution_id="7307774b-b6c4-48e7-8b43-b13dce9ec50f" \
            --raw-field authorized_action="EXECUTION"
          echo "JOB18_UNCHANGED=YES"
          echo "ZERO_COST_OPERATION=TRUE"
