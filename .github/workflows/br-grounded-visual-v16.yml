name: BR V16 Real Visual Timeline and Harness Gate
on:
  push:
    branches:
      - work/br-v16-grounded-visual-timeline
    paths:
      - "app/services/br_harness_visual_timeline_v16.py"
      - "app/services/br_harness_sensory_authorization_v12.py"
      - "tests/test_br_harness_visual_timeline_v16.py"
      - "docs/architecture/br-grounded-visual-v16.md"
      - ".github/workflows/br-grounded-visual-v16.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: br-v16-temporal-observation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  genuine-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install bounded original decode dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install -q --disable-pip-version-check -r requirements.txt pytest==8.4.2 python-dotenv==1.2.3 pillow==11.3.0
      - name: Setup exact private persisted Harness authority
        run: |
          set -euo pipefail
          echo "BR_TEST_DATABASE=$RUNNER_TEMP/br-v16-auth.db" >> "$GITHUB_ENV"
      - name: Test actual original cut, negative control, authorization and consistency
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.database.schema import initialize_schema
          initialize_schema()
          PY
          python -m pytest -q \
            tests/test_br_harness_visual_timeline_v16.py \
            tests/test_br_harness_sensory_pixel_v12.py \
            tests/test_br_grounded_launch_preflight_v15.py \
            tests/test_owner_voice_ledger_transient_v13.py \
            tests/test_br_llamafactory_admission_v13.py
          echo "BR_V16_GENUINE_FRAME_TIMELINE=PASS"
          echo "BR_V16_SCENE_SEMANTICS_CLAIM=FORBIDDEN"
          echo "BR_V16_OWNER_VOICE_TRAINING=NOT_ATTEMPTED"
          echo "BR_V16_TELEGRAM_SEND=NOT_ATTEMPTED"
          echo "BR_V16_CANONICAL_PROMOTION=NOT_ATTEMPTED"
