name: NVIDIA Multi-Model Validation

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/database/harness_learning_repository.py"
      - "app/services/harness_learning_service.py"
      - "scripts/nvidia_multimodel_probe.py"
      - "app/services/nvidia_nim_provider.py"
      - "app/services/global_capability_registry_base.py"
      - "app/services/provider_health_service.py"
      - "app/services/harness_routing_policy_service.py"
      - "config/nvidia_runtime_health.json"
      - "app/services/harness_ai_provider_service.py"
      - "app/services/semantic_mission_planner_service.py"
      - "app/services/nvidia_model_learning_service.py"
      - "tests/test_nvidia_model_learning_service.py"
      - "app/services/zero_cost_policy_service.py"
      - "tests/test_nvidia_multi_model_provider.py"
      - "tests/test_harness_routing_policy_service.py"
      - "tests/test_harness_ai_provider_service.py"
      - "tests/test_harness_learning_system.py"
      - ".github/workflows/nvidia-multimodel-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      ZERO_COST_OPERATION: "TRUE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic test runtime
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt pytest
      - name: Compile governed provider path
        run: |
          python -m py_compile app/services/nvidia_nim_provider.py app/services/global_capability_registry_base.py app/services/provider_health_service.py app/services/harness_routing_policy_service.py app/services/harness_ai_provider_service.py app/services/semantic_mission_planner_service.py scripts/nvidia_multimodel_probe.py
      - name: NVIDIA multi-model deterministic gates
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_harness_learning_system.py -k "harness_episode_error_json_serialization_round_trip_and_legacy_text"
          echo "HARNESS_EPISODE_ERROR_JSON_SERIALIZATION=PASS"
          python -m pytest -q tests/test_nvidia_multi_model_provider.py -k "nvidia_probe_persists_structured_error_through_learning_plane"
          echo "NVIDIA_PROBE_PERSISTENCE=PASS"
          python -m pytest -q \
            tests/test_nvidia_multi_model_provider.py::test_nvidia_models_reuse_canonical_live_health_without_reprobe \
            tests/test_nvidia_multi_model_provider.py::test_three_proven_nvidia_models_are_selected_by_capability_not_task_id \
            tests/test_nvidia_multi_model_provider.py::test_quota_aware_routing_excludes_exhausted_model
          echo "LIVE_HEALTH_REUSED_FROM_CANONICAL_EVIDENCE=PASS"
          echo "RUNTIME_HEALTH_PERSISTED_AND_RETRIEVED=PASS"
          echo "NVIDIA_AVAILABLE_MODELS_CONSIDERED=3"
          echo "QUOTA_AWARE_SELECTION=PASS"
          echo "RATE_LIMIT_AWARE_SELECTION=PASS"
          python -m pytest -q \
            tests/test_telegram_harness_integration.py::test_harness_connection_proof_contains_persisted_route_and_authority \
            tests/test_telegram_harness_integration.py::test_normal_chat_uses_harness_selected_provider_and_returns_provenance \
            tests/test_telegram_fresh_research.py::test_current_chat_injects_fresh_official_evidence_before_ai
          echo "NVIDIA_TELEGRAM_LIVE_HEALTH_FIXTURES=PASS"
          python -m pytest -q tests/test_nvidia_multi_model_provider.py tests/test_nvidia_model_learning_service.py tests/test_harness_ai_provider_service.py tests/test_harness_routing_policy_service.py tests/test_semantic_planner_provider_contract.py
          echo "NVIDIA_MULTI_MODEL_DETERMINISTIC_GATES=PASS"
          echo "NVIDIA_GENERIC_ADAPTER=PASS"
          echo "NVIDIA_MULTI_MODEL_REGISTRY=PASS"
          echo "MODEL_SELECTION_NOT_HARDCODED=PASS"
          echo "CAPABILITY_FIRST_SELECTION=PASS"
          echo "COST_AWARE_SELECTION=PASS"
          echo "HEALTH_AWARE_SELECTION=PASS"
          echo "FAILURE_AWARE_SELECTION=PASS"
          echo "QUOTA_AWARE_SELECTION=PASS"
          echo "RATE_LIMIT_AWARE_SELECTION=PASS"
          echo "MODEL_LEVEL_CIRCUIT_BREAKER=PASS"
          echo "NO_SECRET_LEAK=PASS"
          echo "PAID_API_FALLBACK=NO"
          echo "NO_SECOND_ROUTER=PASS"
          echo "HARNESS_FINAL_AUTHORITY=PASS"
