name: NVIDIA Multi-Model Validation

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/services/nvidia_nim_provider.py"
      - "app/services/global_capability_registry_base.py"
      - "app/services/provider_health_service.py"
      - "app/services/harness_routing_policy_service.py"
      - "app/services/harness_ai_provider_service.py"
      - "app/services/semantic_mission_planner_service.py"
      - "app/services/zero_cost_policy_service.py"
      - "tests/test_nvidia_multi_model_provider.py"
      - "tests/test_harness_routing_policy_service.py"
      - "tests/test_harness_ai_provider_service.py"
      - ".github/workflows/nvidia-multimodel-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      ZERO_COST_OPERATION: "TRUE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic test runtime
        run: python -m pip install --disable-pip-version-check --no-input -r requirements.txt pytest
      - name: Compile governed provider path
        run: |
          python -m py_compile app/services/nvidia_nim_provider.py app/services/global_capability_registry_base.py app/services/provider_health_service.py app/services/harness_routing_policy_service.py app/services/harness_ai_provider_service.py app/services/semantic_mission_planner_service.py scripts/nvidia_multimodel_probe.py
      - name: NVIDIA multi-model deterministic gates
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_nvidia_multi_model_provider.py tests/test_harness_ai_provider_service.py tests/test_harness_routing_policy_service.py tests/test_semantic_planner_provider_contract.py
          echo "NVIDIA_GENERIC_ADAPTER=PASS"
          echo "NVIDIA_MULTI_MODEL_REGISTRY=PASS"
          echo "MODEL_SELECTION_NOT_HARDCODED=PASS"
          echo "CAPABILITY_FIRST_SELECTION=PASS"
          echo "COST_AWARE_SELECTION=PASS"
          echo "HEALTH_AWARE_SELECTION=PASS"
          echo "FAILURE_AWARE_SELECTION=PASS"
          echo "MODEL_LEVEL_CIRCUIT_BREAKER=PASS"
          echo "NO_SECRET_LEAK=PASS"
          echo "NO_SECOND_ROUTER=PASS"
          echo "HARNESS_FINAL_AUTHORITY=PASS"
