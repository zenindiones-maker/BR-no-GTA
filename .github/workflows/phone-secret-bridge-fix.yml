name: Phone Executor Secret Bridge Fix

on:
  push:
    branches: [work/gate6f-analytics-learning]
    paths: [.github/workflows/phone-secret-bridge-fix.yml]

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply secret bridge fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/services/phone_control_service.py')
          s=p.read_text()
          old='''def _executor_command() -> list[str]:\n    raw = settings.PHONE_CONTROL_EXECUTOR_COMMAND.strip()\n    if not raw:\n        raise _blocked("Isolated phone control executor command is not configured", stage="runtime")\n    command = shlex.split(raw)\n    if not command:\n        raise _blocked("Isolated phone control executor command is invalid", stage="runtime")\n    return command\n'''
          new='''def _executor_command() -> list[str]:\n    raw = settings.PHONE_CONTROL_EXECUTOR_COMMAND.strip()\n    if not raw:\n        raise _blocked("Isolated phone control executor command is not configured", stage="runtime")\n    command = shlex.split(raw)\n    if not command:\n        raise _blocked("Isolated phone control executor command is invalid", stage="runtime")\n    return command\n\n\ndef _bridge_runtime_secret(command: list[str], token: str) -> tuple[list[str], bool]:\n    """Place the Portal secret inside a proot login boundary without persisting it.\n\n    Ordinary executors inherit the minimal child environment as before.  A\n    proot-distro login is an environment boundary, so the runtime-only secret\n    must be injected after its ``--`` separator.\n    """\n    if not command:\n        raise _blocked("Isolated phone control executor command is invalid", stage="runtime")\n    executable = Path(command[0]).name\n    if executable != "proot-distro":\n        return list(command), False\n    if "login" not in command or "--" not in command:\n        raise _blocked("proot-distro phone executor must use a login -- boundary", stage="runtime")\n    boundary = command.index("--")\n    if boundary + 1 >= len(command):\n        raise _blocked("proot-distro phone executor has no isolated command", stage="runtime")\n    bridged = [\n        *command[: boundary + 1],\n        "env",\n        f"MOBILERUN_PORTAL_TOKEN={token}",\n        *command[boundary + 1 :],\n    ]\n    return bridged, True\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old2='''    token = _secret()\n    command = _executor_command()\n\n    request: dict[str, Any] = {'''
          new2='''    token = _secret()\n    command, secret_bridged = _bridge_runtime_secret(_executor_command(), token)\n\n    request: dict[str, Any] = {'''
          assert s.count(old2)==1
          s=s.replace(old2,new2)
          old3='''    child_env["MOBILERUN_PORTAL_TOKEN"] = token\n\n    runtime_script = settings.BASE_DIR / "app" / "services" / "phone_control_runtime.py"'''
          new3='''    if not secret_bridged:\n        child_env["MOBILERUN_PORTAL_TOKEN"] = token\n\n    runtime_script = settings.BASE_DIR / "app" / "services" / "phone_control_runtime.py"'''
          assert s.count(old3)==1
          s=s.replace(old3,new3)
          p.write_text(s)

          t=Path('tests/test_phone_control_service.py')
          ts=t.read_text()
          marker='''def test_portal_unavailable_returns_sanitized_error(monkeypatch):\n'''
          addition='''def test_proot_executor_bridges_secret_after_boundary_without_outer_env(monkeypatch):\n    token = _runtime_ready(monkeypatch)\n    monkeypatch.setattr(\n        phone_control_service.settings,\n        "PHONE_CONTROL_EXECUTOR_COMMAND",\n        "proot-distro login ubuntu -- /root/mobile-harness/.venv/bin/python",\n    )\n    captured = {}\n\n    def fake_run(command, **kwargs):\n        captured["command"] = command\n        captured["env"] = kwargs["env"]\n        return SimpleNamespace(\n            returncode=0,\n            stdout=json.dumps({"success": True, "result": {"ui_nonempty": True}}),\n            stderr="",\n        )\n\n    monkeypatch.setattr(phone_control_service.subprocess, "run", fake_run)\n    record = GLOBAL_CAPABILITY_REGISTRY.get("phone.control")\n    result = phone_control_service.execute_phone_control_capability(record, {"operation": "ui"})\n    boundary = captured["command"].index("--")\n    assert captured["command"][boundary + 1 : boundary + 3] == [\n        "env", f"MOBILERUN_PORTAL_TOKEN={token}"\n    ]\n    assert "MOBILERUN_PORTAL_TOKEN" not in captured["env"]\n    assert result["success"] is True\n\n\ndef test_non_proot_executor_preserves_minimal_child_env_secret(monkeypatch):\n    token = _runtime_ready(monkeypatch)\n    captured = {}\n\n    def fake_run(command, **kwargs):\n        captured["command"] = command\n        captured["env"] = kwargs["env"]\n        return SimpleNamespace(returncode=0, stdout=json.dumps({"success": True, "result": {}}), stderr="")\n\n    monkeypatch.setattr(phone_control_service.subprocess, "run", fake_run)\n    record = GLOBAL_CAPABILITY_REGISTRY.get("phone.control")\n    phone_control_service.execute_phone_control_capability(record, {"operation": "ui"})\n    assert captured["env"]["MOBILERUN_PORTAL_TOKEN"] == token\n    assert "env" not in captured["command"][:1]\n\n\ndef test_malformed_proot_boundary_fails_closed(monkeypatch):\n    token = _runtime_ready(monkeypatch)\n    with pytest.raises(CapabilityExecutionBlocked, match="login -- boundary"):\n        phone_control_service._bridge_runtime_secret(\n            ["proot-distro", "login", "ubuntu", "python3"], token\n        )\n\n\n'''
          assert ts.count(marker)==1
          t.write_text(ts.replace(marker, addition+marker))
          PY
      - name: Setup test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q --upgrade pip
          .venv/bin/python -m pip install -q -r requirements.txt
      - name: Compile
        run: .venv/bin/python -m compileall -q app tests
      - name: Focused tests
        run: .venv/bin/python -m pytest -q tests/test_phone_control_service.py tests/test_harness_routing_policy_service.py
      - name: Full suite
        run: .venv/bin/python -m pytest -q tests/
      - name: Frozen and secret guards
        run: |
          git diff --check
          test "$(git diff --name-only HEAD | grep -E 'job.?18|Job.?18' || true)" = ""
          grep -q 'ZERO_COST_OPERATION = True' app/services/zero_cost_policy_service.py
          ! git diff | grep -E 'MOBILERUN_PORTAL_TOKEN=[A-Za-z0-9_-]{16,}'
      - name: Commit validated fix
        env:
          BRANCH: work/gate6f-analytics-learning
        run: |
          git rm .github/workflows/phone-secret-bridge-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/services/phone_control_service.py tests/test_phone_control_service.py
          git diff --cached --check
          git commit -m 'fix(phone): bridge portal secret across proot boundary'
          git push origin HEAD:$BRANCH
