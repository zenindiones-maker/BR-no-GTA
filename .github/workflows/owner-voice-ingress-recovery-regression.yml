name: Owner Voice Ingress Recovery Regression (No Side Effects)
on:
  push:
    branches:
      - work/owner-voice-safe-ingress-recovery-20261010
    paths:
      - "scripts/owner_voice_reference_handoff.py"
      - "app/services/owner_voice_telegram_pending_recovery_service.py"
      - "tests/test_owner_voice_pending_recovery_transport.py"
      - "tests/test_owner_voice_handoff_resume.py"
      - ".github/workflows/owner-voice-ingress-recovery-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install -q --disable-pip-version-check pytest==8.4.2 python-dotenv==1.2.3
      - name: Prove no competing polling and fail-closed handoff
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_owner_voice_pending_recovery_transport.py             tests/test_owner_voice_reference_handoff.py             tests/test_owner_voice_handoff_resume.py
          echo "OWNER_VOICE_INGRESS_TESTS=PASS"
          echo "TELEGRAM_GETUPDATES_ATTEMPTED=FALSE"
          echo "TELEGRAM_SEND_ATTEMPTED=FALSE"
          echo "OWNER_VOICE_MEDIA_PROCESSED=FALSE"
