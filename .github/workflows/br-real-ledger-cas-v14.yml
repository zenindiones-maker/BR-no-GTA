name: BR V14 Real Ledger CAS and Production Readiness Boundaries
on:
  push:
    branches:
      - work/br-v14-ledger-reality-and-launch-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v14-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-git-ledger:
    name: Real local Git mission isolation, fast-forward CAS and voice denial
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact tested unit dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q \
            -r requirements.txt pytest==8.4.2 python-dotenv==1.2.3
      - name: Prove actual Git CAS, event namespace and failed retry rules
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_owner_voice_audition_ledger_store_integration.py \
            tests/test_owner_voice_ledger_transient_v13.py \
            tests/test_owner_voice_audition_ledger_authority.py \
            tests/test_owner_voice_audition_outbox_semantics.py \
            tests/test_owner_voice_audition_delivery_durable_v3.py \
            tests/test_br_llamafactory_admission_v13.py
          echo "BR_V14_REAL_LOCAL_GIT_LEDGER_CAS=PASS"
          echo "BR_V14_CROSS_MISSION_LEDGER_WRITE=DENIED"
          echo "BR_V14_TRANSIENT_PUSH_ONE_BOUNDED_RETRY=PASS"
          echo "BR_V14_OWNER_VOICE_IDENTITY_APPROVAL=NOT_VERIFIED"
          echo "BR_V14_LLAMAFACTORY_TRAINING_STARTED=FALSE"
      - name: Strictly admit root suite without changing independent npm security gate
        run: |
          set -euo pipefail
          python -m pytest -q tests/
          echo "BR_V14_ROOT_SUITE=PASS"
          echo "BR_V14_AGENT_OFFICE_UPSTREAM_HIGH_CVEs=SECURITY_REVIEW_REQUIRED"
          echo "BR_V14_CANONICAL_PROMOTION=NOT_ATTEMPTED"
