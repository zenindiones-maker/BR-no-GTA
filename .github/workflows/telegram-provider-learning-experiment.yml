name: Telegram Provider Learning Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning

permissions:
  contents: read

jobs:
  observed-provider-experiment:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'run telegram provider experiment')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMNIROUTE_VERSION: "3.8.50"
      BASELINE_MODEL: "oc/big-pickle"
      CANDIDATE_MODELS: "oc/deepseek-v4-flash-free oc/mimo-v2.5-free oc/nemotron-3-ultra-free"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned OmniRoute
        run: |
          set -euo pipefail
          npm install -g "omniroute@${OMNIROUTE_VERSION}"
          test "$(omniroute --version | tr -d '\r')" = "${OMNIROUTE_VERSION}"

      - name: Start loopback-only OmniRoute
        run: |
          set -euo pipefail
          OMNIROUTE_SERVER_HOST=127.0.0.1 nohup omniroute serve >/tmp/omniroute.log 2>&1 &
          echo $! >/tmp/omniroute.pid
          for i in {1..40}; do
            if ! kill -0 "$(cat /tmp/omniroute.pid)" 2>/dev/null; then
              cat /tmp/omniroute.log || true
              exit 1
            fi
            if curl --connect-timeout 2 --max-time 5 -fsS \
                http://127.0.0.1:20128/api/monitoring/health \
                > /tmp/omniroute-health.json 2>/dev/null; then
              python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/omniroute-health.json').read_text())
          assert payload.get('status') == 'healthy', payload
          print(json.dumps(payload, sort_keys=True))
          PY
              exit 0
            fi
            sleep 2
          done
          cat /tmp/omniroute.log || true
          exit 1

      - name: Probe official live OpenCode model catalog
        run: |
          set -euo pipefail
          mkdir -p runtime/telegram-provider-experiment
          python - <<'PY'
          import hashlib, json, pathlib, urllib.error, urllib.request
          out={'url':'https://opencode.ai/zen/v1/models'}
          try:
              req=urllib.request.Request(
                  out['url'],
                  headers={'Accept':'application/json','User-Agent':'BR-no-GTA-learning-probe/1'},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  raw=resp.read()
                  out['http_status']=resp.status
                  out['body_sha256']=hashlib.sha256(raw).hexdigest()
                  payload=json.loads(raw.decode())
                  rows=payload.get('data') if isinstance(payload,dict) else None
                  out['models']=sorted(
                      str(item.get('id'))
                      for item in (rows or [])
                      if isinstance(item,dict) and item.get('id')
                  )
          except urllib.error.HTTPError as exc:
              raw=exc.read()
              out.update(
                  http_status=exc.code,
                  body_sha256=hashlib.sha256(raw).hexdigest(),
                  models=[],
                  error_type='HTTPError',
              )
          pathlib.Path('runtime/telegram-provider-experiment/live-catalog.json').write_text(
              json.dumps(out,sort_keys=True)
          )
          print(json.dumps({k:v for k,v in out.items() if k!='models'}|{'model_count':len(out.get('models',[]))},sort_keys=True))
          PY

      - name: Execute baseline and explicit candidates
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.error, urllib.request

          provider='opencode'
          baseline=os.environ['BASELINE_MODEL']
          candidates=os.environ['CANDIDATE_MODELS'].split()
          prompt='Return only: BR_NO_GTA_PROVIDER_LEARNING_OK'
          models=[baseline,*candidates]
          root=pathlib.Path('runtime/telegram-provider-experiment')
          observations=[]

          for index, model in enumerate(models):
              started=time.monotonic()
              request_body=json.dumps({
                  'model':model,
                  'messages':[{'role':'user','content':prompt}],
                  'stream':False,
              }).encode()
              req=urllib.request.Request(
                  f'http://127.0.0.1:20128/v1/providers/{provider}/chat/completions',
                  data=request_body,
                  headers={'Content-Type':'application/json'},
                  method='POST',
              )
              item={
                  'observed':True,
                  'provider':provider,
                  'model':model,
                  'role':'baseline' if index == 0 else 'candidate',
                  'omniroute_version':os.environ['OMNIROUTE_VERSION'],
                  'runtime_identity':'github-actions:ubuntu-latest:node24',
                  'fallback_occurred':False,
                  'retry_count':0,
                  'request_shape':{
                      'endpoint':'/v1/providers/opencode/chat/completions',
                      'content_type':'application/json',
                      'stream':False,
                  },
              }
              try:
                  with urllib.request.urlopen(req,timeout=180) as resp:
                      raw=resp.read()
                      payload=json.loads(raw.decode())
                      choices=payload.get('choices') or []
                      text=str((choices[0].get('message') or {}).get('content') or '') if choices else ''
                      item.update(
                          outcome='COMPLETED' if text.strip() else 'FAILED',
                          http_status=resp.status,
                          reported_model=str(payload.get('model') or ''),
                          usable_text=bool(text.strip()),
                          response_text_sha256=hashlib.sha256(text.encode()).hexdigest(),
                          response_chars=len(text),
                          error_code=None if text.strip() else 'empty_response',
                      )
              except urllib.error.HTTPError as exc:
                  raw=exc.read()
                  item.update(
                      outcome='FAILED',
                      http_status=exc.code,
                      usable_text=False,
                      error_code=f'upstream_http_{exc.code}',
                      response_body_sha256=hashlib.sha256(raw).hexdigest(),
                      response_chars=len(raw),
                  )
              except Exception as exc:
                  item.update(
                      outcome='FAILED',
                      http_status=None,
                      usable_text=False,
                      error_code=type(exc).__name__,
                  )
              item['elapsed_seconds']=time.monotonic()-started
              observations.append(item)
              print(json.dumps(item,sort_keys=True))

          evidence={
              'experiment':'telegram-provider-recovery',
              'capability':'ai.reasoning.text',
              'task_class':'telegram-reasoning',
              'authority':'DeepSeek Harness candidate evaluation only; no promotion performed',
              'zero_cost_operation':True,
              'baseline_model':baseline,
              'candidate_models':candidates,
              'observations':observations,
              'workload_fingerprint':hashlib.sha256(prompt.encode()).hexdigest(),
              'promotion_performed':False,
          }
          (root/'observations.json').write_text(json.dumps(evidence,sort_keys=True))
          PY

      - name: Validate observed experiment evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runtime/telegram-provider-experiment/observations.json')
          data=json.loads(p.read_text())
          rows=data['observations']
          assert data['promotion_performed'] is False
          assert data['zero_cost_operation'] is True
          assert len(rows) == 4
          assert rows[0]['role'] == 'baseline'
          assert all(row['observed'] is True for row in rows)
          assert all(row['fallback_occurred'] is False for row in rows)
          assert all('elapsed_seconds' in row for row in rows)
          assert all(row['outcome'] in {'COMPLETED','FAILED'} for row in rows)
          print('OBSERVED_PROVIDER_EXPERIMENT=PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-provider-learning-experiment
          path: runtime/telegram-provider-experiment/
          retention-days: 7
          if-no-files-found: error

      - name: Shutdown OmniRoute
        if: always()
        run: |
          if [ -f /tmp/omniroute.pid ]; then
            kill "$(cat /tmp/omniroute.pid)" 2>/dev/null || true
          fi
