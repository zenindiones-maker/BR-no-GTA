name: New Video E2E Benchmark

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run/new-video-benchmark.request.json
      - .github/workflows/new-video-e2e-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: new-video-e2e-benchmark-novo-1
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      GITHUB_ACTIONS_REPOSITORY: ${{ github.repository }}
      GITHUB_ACTIONS_RENDER_REF: work/gate6f-analytics-learning
      BR_RENDER_EXECUTOR: github_actions
      BR_TEST_DATABASE: ${{ github.workspace }}/runtime/new-video-benchmark/mission.db
      BR_PERFORMANCE_TRACE_FILE: ${{ github.workspace }}/runtime/new-video-benchmark/performance-trace.jsonl
      BR_PERFORMANCE_TRACE_ID: "new-video-benchmark:${{ github.run_id }}:${{ github.run_attempt }}"
      BR_OPENCODE_NATIVE_EXECUTION_MODE: same_runner
      BR_OPENCODE_NATIVE_REPOSITORY: ${{ github.repository }}
      BR_OPENCODE_NATIVE_REF: ${{ github.ref_name }}
      BR_OPENCODE_NATIVE_SOURCE_SHA: ${{ github.sha }}
      BR_OPENCODE_NATIVE_POLL_INTERVAL: "2"
      BR_OPENCODE_NATIVE_RUN_TIMEOUT: "900"
      BR_OPENCODE_NATIVE_ARTIFACT_ROOT: ${{ github.workspace }}/runtime/new-video-benchmark/opencode-artifacts
      BR_BENCHMARK_ITEM_KEY: novo-1
      ZERO_COST_OPERATION: "TRUE"

    steps:
      - name: Start benchmark wall clock
        run: |
          set -euo pipefail
          echo "BENCHMARK_START_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"
          echo "BENCHMARK_START_EPOCH_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          echo "NEW_VIDEO_BENCHMARK_RUN_ID=$GITHUB_RUN_ID"

      - name: Checkout exact benchmark revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install benchmark controller runtime
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt pytest
          npm install --global @opencode/cli@2.0.8
          test "$(opencode --version | awk '{print $NF}' | tr -d '\r' | sed -E 's/^v//')" = "2.0.8"
          mkdir -p runtime/new-video-benchmark runtime/new-video-benchmark/delivery
          echo "BENCHMARK_RUNTIME=PASS"

      - name: Focused benchmark contract test
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_new_video_benchmark_contract.py tests/test_youtube_role_context_service.py
          python -m py_compile \
            scripts/new_video_benchmark_delivery.py \
            scripts/new_video_benchmark_quality.py \
            scripts/aggregate_new_video_benchmark.py \
            scripts/telegram_narration_review_worker.py
          echo "NEW_VIDEO_BENCHMARK_CONTRACT=PASS"

      - name: Restore valid fresh research from previous failed benchmark
        id: reuse_fresh
        uses: actions/download-artifact@v4
        with:
          artifact-ids: "10605874745"
          run-id: "35513472760"
          github-token: ${{ github.token }}
          path: runtime/previous-benchmark
          merge-multiple: true

      - name: Reuse only validated fresh research checkpoint
        id: fresh_checkpoint
        run: |
          set -euo pipefail
          SRC="$(find runtime/previous-benchmark -type f -name fresh-research.json | head -n1 || true)"
          if [ -n "$SRC" ]; then
            python - "$SRC" <<'PY'
          import json, pathlib, shutil, sys
          src=pathlib.Path(sys.argv[1])
          d=json.loads(src.read_text(encoding="utf-8"))
          assert d.get("status")=="PASS", d
          submitted=d.get("submitted_source") or {}
          assert submitted.get("resolution_status")=="PASS", submitted
          out=pathlib.Path("runtime/new-video-benchmark/fresh-research.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          shutil.copy2(src,out)
          print("FRESH_RESEARCH_CHECKPOINT_REUSE=YES")
          PY
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rehydrate promoted OpenCode profile
        run: |
          set -euo pipefail
          python scripts/hydrate_promoted_opencode_profile.py \
            --output runtime/new-video-benchmark/provider-promotion.json
          python - <<'PY'
          import json
          d=json.load(open("runtime/new-video-benchmark/provider-promotion.json"))
          assert d["status"]=="PASS", d
          assert d["active_profile"]["version"]=="v2", d
          assert d["quality_regression"]=="NO", d
          assert d["fallback_occurred"] is False, d
          print("PROMOTED_PROVIDER_REHYDRATION=PASS")
          PY

      - name: Fresh Rockstar research
        if: steps.fresh_checkpoint.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          python scripts/e2e_latency_stage.py start fresh_research \
            --state runtime/new-video-benchmark/latency-stages.json \
            --category EXTERNAL_RESEARCH_TIME --work-class NECESSARY \
            --output-artifact runtime/new-video-benchmark/fresh-research.json
          QUERY_B64="$(printf '%s' 'Quais fatos oficiais atuais sobre GTA VI sustentam uma pauta nova e independente para o BR no GTA 6?' | base64 -w0)"
          SOURCE_B64="$(printf '%s' 'https://www.rockstargames.com/VI' | base64 -w0)"
          python scripts/gta6_fresh_research_worker.py \
            --query-b64 "$QUERY_B64" \
            --source-url-b64 "$SOURCE_B64" \
            --execution-id "new-video-benchmark-$GITHUB_RUN_ID" \
            --output runtime/new-video-benchmark/fresh-research.json
          python scripts/e2e_latency_stage.py end fresh_research \
            --state runtime/new-video-benchmark/latency-stages.json \
            --category EXTERNAL_RESEARCH_TIME --work-class NECESSARY \
            --output-artifact runtime/new-video-benchmark/fresh-research.json

      - name: Governed fact-check editorial and new Goal
        run: |
          set -euo pipefail
          python scripts/e2e_latency_stage.py start governed_editorial \
            --state runtime/new-video-benchmark/latency-stages.json \
            --category AI_PROVIDER_TIME --work-class NECESSARY \
            --input-file runtime/new-video-benchmark/fresh-research.json \
            --output-artifact runtime/new-video-benchmark/multi-agent-proof.json
          python scripts/prove_real_multi_agent_synergy.py \
            --fresh-research runtime/new-video-benchmark/fresh-research.json \
            --output runtime/new-video-benchmark/multi-agent-proof.json
          python scripts/e2e_latency_stage.py end governed_editorial \
            --state runtime/new-video-benchmark/latency-stages.json \
            --category AI_PROVIDER_TIME --work-class NECESSARY \
            --input-file runtime/new-video-benchmark/fresh-research.json \
            --output-artifact runtime/new-video-benchmark/multi-agent-proof.json

      - name: Build new script production plan and package
        run: |
          set -euo pipefail
          python scripts/e2e_latency_stage.py start product_package \
            --state runtime/new-video-benchmark/latency-stages.json \
            --category CONTROL_PLANE_TIME --work-class NECESSARY \
            --input-file runtime/new-video-benchmark/multi-agent-proof.json \
            --output-artifact runtime/new-video-benchmark/product-quality-e2e.json
          python scripts/youtube_product_quality_e2e.py \
            --synergy-proof runtime/new-video-benchmark/multi-agent-proof.json \
            --output runtime/new-video-benchmark/product-quality-e2e.json
          python scripts/e2e_latency_stage.py end product_package \
            --state runtime/new-video-benchmark/latency-stages.json \
            --category CONTROL_PLANE_TIME --work-class NECESSARY \
            --input-file runtime/new-video-benchmark/multi-agent-proof.json \
            --output-artifact runtime/new-video-benchmark/product-quality-e2e.json
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os, time
          d=json.load(open("runtime/new-video-benchmark/product-quality-e2e.json"))
          start=int(os.environ["BENCHMARK_START_EPOCH_MS"])
          print(f"GOAL_ID={d['goal_id']}")
          print(f"CONTENT_ITEM_ID={d['content_item_id']}")
          print(f"SCRIPT_ID={d['script_id']}")
          print(f"PRODUCTION_PLAN_ID={d['production_plan_id']}")
          print(f"TIME_TO_SCRIPT_READY_MS={int(time.time()*1000)-start}")
          PY

      - name: Restore reusable content-addressed MediaKnowledge
        uses: actions/download-artifact@v4
        with:
          artifact-ids: "10590341059"
          run-id: "35460016361"
          github-token: ${{ github.token }}
          path: runtime/media-knowledge-source
          merge-multiple: true

      - name: Create independent Video and RenderJob with current Voice B contract
        run: |
          set -euo pipefail
          python scripts/new_video_benchmark_delivery.py prepare-handoff \
            --product runtime/new-video-benchmark/product-quality-e2e.json \
            --media-artifact-dir runtime/media-knowledge-source/product-delivery/media-knowledge \
            --media-descriptor .run001/media-knowledge-checkpoints/gta6-extended-look-official-20260827.json \
            --product-label A \
            --benchmark-label NOVO-1 \
            --out runtime/new-video-benchmark/delivery
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open("runtime/new-video-benchmark/delivery/state.json"))
          for key in ("VIDEO_ID","RENDER_JOB_ID"):
              print(f"{key}={d[key]}")
          PY

      - name: Publish RenderJob handoff artifact
        id: handoff
        uses: actions/upload-artifact@v4
        with:
          name: new-video-benchmark-render-job-${{ github.run_id }}
          path: runtime/new-video-benchmark/delivery/render-job-handoff/render-job.json
          if-no-files-found: error
          retention-days: 30

      - name: Dispatch professional render
        env:
          HANDOFF_ARTIFACT_ID: ${{ steps.handoff.outputs.artifact-id }}
          HANDOFF_ARTIFACT_NAME: new-video-benchmark-render-job-${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/new_video_benchmark_delivery.py dispatch-handoff \
            --out runtime/new-video-benchmark/delivery \
            --artifact-id "$HANDOFF_ARTIFACT_ID" \
            --artifact-name "$HANDOFF_ARTIFACT_NAME" \
            --producer-run-id "$GITHUB_RUN_ID" \
            --source-sha "$GITHUB_SHA"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open("runtime/new-video-benchmark/delivery/state.json"))
          print(f"RENDER_RUN_ID={d['RENDER_RUN_ID']}")
          PY
          echo "NEW_VIDEO_BENCHMARK_RUN_ID=$GITHUB_RUN_ID"
          echo "GOAL_ID=$GOAL_ID"
          echo "VIDEO_ID=$VIDEO_ID"
          echo "RENDER_JOB_ID=$RENDER_JOB_ID"
          echo "BENCHMARK_START_TIMESTAMP=$BENCHMARK_START_TIMESTAMP"

      - name: Wait only for benchmark render
        run: |
          set -euo pipefail
          python scripts/e2e_latency_stage.py start render_wait \
            --state runtime/new-video-benchmark/latency-stages.json \
            --category WAITING_EXTERNAL_TIME --work-class WAITING \
            --output-artifact runtime/new-video-benchmark/render-watch.json
          python scripts/watch_github_run.py \
            --run-id "$RENDER_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --interval-seconds 30 \
            --output runtime/new-video-benchmark/render-watch.json
          python scripts/e2e_latency_stage.py end render_wait \
            --state runtime/new-video-benchmark/latency-stages.json \
            --category WAITING_EXTERNAL_TIME --work-class WAITING \
            --output-artifact runtime/new-video-benchmark/render-watch.json

      - name: Reconcile professional render QA
        run: |
          set -euo pipefail
          python scripts/new_video_benchmark_delivery.py reconcile-render \
            --out runtime/new-video-benchmark/delivery
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os, time
          d=json.load(open("runtime/new-video-benchmark/delivery/state.json"))
          start=int(os.environ["BENCHMARK_START_EPOCH_MS"])
          print(f"ARTIFACT_ID={d['ARTIFACT_ID']}")
          print(f"TIME_TO_RENDER_READY_MS={int(time.time()*1000)-start}")
          PY

      - name: Download render output and narration master
        run: |
          set -euo pipefail
          mkdir -p runtime/new-video-benchmark/render-output runtime/new-video-benchmark/narration-output
          gh run download "$RENDER_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name render-output --dir runtime/new-video-benchmark/render-output
          NARRATION_ARTIFACT_NAME="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RENDER_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("narration-bundle-")) | .name' | head -n1)"
          test -n "$NARRATION_ARTIFACT_NAME"
          gh run download "$RENDER_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$NARRATION_ARTIFACT_NAME" --dir runtime/new-video-benchmark/narration-output
          python - <<'PY' >> "$GITHUB_ENV"
          import os, time
          start=int(os.environ["BENCHMARK_START_EPOCH_MS"])
          print(f"TIME_TO_NARRATION_READY_MS={int(time.time()*1000)-start}")
          PY

      - name: Evaluate benchmark quality
        run: |
          set -euo pipefail
          python scripts/e2e_latency_stage.py start benchmark_quality \
            --state runtime/new-video-benchmark/latency-stages.json \
            --category QA_TIME --work-class NECESSARY \
            --input-file runtime/new-video-benchmark/delivery/state.json \
            --output-artifact runtime/new-video-benchmark/quality.json
          python scripts/new_video_benchmark_quality.py \
            --proof runtime/new-video-benchmark/multi-agent-proof.json \
            --product runtime/new-video-benchmark/product-quality-e2e.json \
            --render-root runtime/new-video-benchmark/render-output \
            --narration-root runtime/new-video-benchmark/narration-output \
            --state runtime/new-video-benchmark/delivery/state.json \
            --output runtime/new-video-benchmark/quality.json
          python scripts/e2e_latency_stage.py end benchmark_quality \
            --state runtime/new-video-benchmark/latency-stages.json \
            --category QA_TIME --work-class NECESSARY \
            --input-file runtime/new-video-benchmark/delivery/state.json \
            --output-artifact runtime/new-video-benchmark/quality.json

      - name: Deliver narration master to Telegram without recompression
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          set -euo pipefail
          python scripts/telegram_narration_review_worker.py \
            --narration-root runtime/new-video-benchmark/narration-output \
            --state runtime/new-video-benchmark/delivery/state.json \
            --quality runtime/new-video-benchmark/quality.json \
            --output runtime/new-video-benchmark/delivery/narration-telegram.json

      - name: Create private YouTube publication
        run: |
          set -euo pipefail
          python scripts/new_video_benchmark_delivery.py create-publication \
            --product runtime/new-video-benchmark/product-quality-e2e.json \
            --out runtime/new-video-benchmark/delivery

      - name: Dispatch YouTube PRIVATE
        run: |
          set -euo pipefail
          python scripts/new_video_benchmark_delivery.py dispatch-upload \
            --out runtime/new-video-benchmark/delivery
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open("runtime/new-video-benchmark/delivery/state.json"))
          print(f"YOUTUBE_UPLOAD_RUN_ID={d['YOUTUBE_UPLOAD_RUN_ID']}")
          PY

      - name: Wait only for private HD review readiness
        run: |
          set -euo pipefail
          python scripts/e2e_latency_stage.py start youtube_wait \
            --state runtime/new-video-benchmark/latency-stages.json \
            --category WAITING_EXTERNAL_TIME --work-class WAITING \
            --output-artifact runtime/new-video-benchmark/youtube-watch.json
          python scripts/watch_github_run.py \
            --run-id "$YOUTUBE_UPLOAD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --interval-seconds 30 \
            --output runtime/new-video-benchmark/youtube-watch.json
          python scripts/e2e_latency_stage.py end youtube_wait \
            --state runtime/new-video-benchmark/latency-stages.json \
            --category WAITING_EXTERNAL_TIME --work-class WAITING \
            --output-artifact runtime/new-video-benchmark/youtube-watch.json

      - name: Reconcile private YouTube and Telegram human review
        run: |
          set -euo pipefail
          python scripts/new_video_benchmark_delivery.py reconcile-upload \
            --out runtime/new-video-benchmark/delivery
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          final=json.load(open("runtime/new-video-benchmark/delivery/final.json"))
          start=int(os.environ["BENCHMARK_START_EPOCH_MS"])
          final["NEW_VIDEO_BENCHMARK_RUN_ID"]=int(os.environ["GITHUB_RUN_ID"])
          final["BENCHMARK_START_TIMESTAMP"]=os.environ["BENCHMARK_START_TIMESTAMP"]
          final["TIME_TO_SCRIPT_READY_MS"]=int(os.environ["TIME_TO_SCRIPT_READY_MS"])
          final["TIME_TO_NARRATION_READY_MS"]=int(os.environ["TIME_TO_NARRATION_READY_MS"])
          final["TIME_TO_RENDER_READY_MS"]=int(os.environ["TIME_TO_RENDER_READY_MS"])
          final["TIME_TO_TELEGRAM_REVIEW_MS"]=int(time.time()*1000)-start
          Path("runtime/new-video-benchmark/delivery/final.json").write_text(json.dumps(final,ensure_ascii=False,indent=2))
          print("HUMAN_REVIEW_READY=PASS")
          print(f"TELEGRAM_MESSAGE_ID={final['TELEGRAM_MESSAGE_ID']}")
          print(f"HUMAN_REVIEW_STATUS={final['HUMAN_REVIEW_STATUS']}")
          PY

      - name: Build benchmark latency profile
        if: always()
        run: |
          set -euo pipefail
          python scripts/summarize_performance_trace.py \
            --trace runtime/new-video-benchmark/performance-trace.jsonl \
            --output runtime/new-video-benchmark/latency-profile.json \
            --run-id "$GITHUB_RUN_ID"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("runtime/new-video-benchmark/latency-profile.json")
          d=json.loads(p.read_text())
          for key in ("E2E_WALL_CLOCK_MS","CRITICAL_PATH_MS","CUMULATIVE_WORK_MS","PARALLELISM_SAVED_MS"):
              print(f"{key}={d.get(key)}")
          final=Path("runtime/new-video-benchmark/delivery/final.json")
          if final.is_file():
              f=json.loads(final.read_text())
              for key in ("TIME_TO_SCRIPT_READY_MS","TIME_TO_NARRATION_READY_MS","TIME_TO_RENDER_READY_MS","TIME_TO_TELEGRAM_REVIEW_MS"):
                  print(f"{key}={f.get(key)}")
          PY

      - name: Upload complete new-video benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-video-e2e-benchmark-${{ github.run_id }}
          path: |
            runtime/new-video-benchmark/
            runtime/youtube-upload/results/
          if-no-files-found: warn
          retention-days: 30
