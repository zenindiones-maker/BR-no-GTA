name: NVIDIA Semantic Planner Live Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/nvidia-semantic-planner-live-proof.request.json"

permissions:
  contents: read

concurrency:
  group: nvidia-semantic-planner-live-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/nvidia-semantic-planner-live-proof/control.db

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bounded runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/nvidia-semantic-planner-live-proof
          python -m pip install -r requirements.txt pytest >/dev/null

      - name: Run focused deterministic gates
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_nvidia_multi_model_provider.py \
            tests/test_nvidia_model_learning_service.py \
            tests/test_semantic_planner_provider_contract.py
          echo "NVIDIA_MULTI_MODEL_VALIDATION=PASS"

      - name: Run controlled real semantic planner proof
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/nvidia-semantic-planner-live-proof
          python scripts/nvidia_semantic_planner_live_proof.py \
            --request .run/nvidia-semantic-planner-live-proof.request.json \
            --output artifacts/nvidia-semantic-planner-live-proof/report.json

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-semantic-planner-live-proof-${{ github.run_id }}
          path: artifacts/nvidia-semantic-planner-live-proof
          if-no-files-found: warn
