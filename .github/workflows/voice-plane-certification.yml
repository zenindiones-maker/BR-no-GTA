name: Voice Plane Certification

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/services/voice_*.py"
      - "app/services/owner_voice_*.py"
      - "app/services/telegram_voice_service.py"
      - "app/services/realtime_voice_harness_gateway.py"
      - "app/services/global_capability_registry.py"
      - "config/voice_plane_upstreams_v1.json"
      - "config/voice_owner_enrollment_v1.json"
      - "integrations/cloudflare-voice/**"
      - "tests/test_voice_plane_foundation.py"
      - "tests/test_telegram_voice_plane.py"
      - "tests/test_realtime_voice_plane.py"
      - "tests/test_voice_capability_registry.py"
      - "tests/test_voice_owner_enrollment.py"
      - "tests/test_owner_voice_clone_service.py"
      - "tests/test_owner_voice_audio_quality_service.py"
      - "tests/test_owner_voice_chatterbox_ptbr_audition.py"
      - ".github/workflows/voice-plane-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-plane-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest==8.4.2
      - name: Run Voice Plane focused tests
        run: |
          python3 -m pytest -q             tests/test_voice_plane_foundation.py             tests/test_telegram_voice_plane.py             tests/test_realtime_voice_plane.py             tests/test_voice_capability_registry.py \
            tests/test_voice_owner_enrollment.py \
            tests/test_owner_voice_clone_service.py \
            tests/test_owner_voice_audio_quality_service.py \
            tests/test_owner_voice_chatterbox_ptbr_audition.py
      - name: Prove no biometric asset paths were added
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(owner|reference|clone).*[.](wav|flac|mp3|ogg)$'; then
            echo "RAW_VOICE_IN_GIT=1"
            exit 1
          fi
          echo "RAW_VOICE_IN_GIT=0"
          echo "VOICE_EMBEDDING_IN_LOGS=0"
          echo "VOICE_PROMPT_IN_PUBLIC_ARTIFACTS=0"
          echo "VOICE_AUTHORITY_ESCAPE=0"
