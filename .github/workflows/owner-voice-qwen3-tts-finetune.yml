name: BR_OWNER_V1 Qwen3-TTS 1.7B Fine Tune

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q pytest
      - run: python -m pytest -q tests/test_owner_voice_qwen3_tts_finetune_contract.py
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row=json.loads(Path("config/owner_voice_qwen3_tts_finetune_v1.json").read_text())
          assert row["runtime_activation_after_training"] is False
          print("OWNER_QWEN3_TTS_FINETUNE_CONTRACT=PASS")
          PY

  train:
    needs: contract
    runs-on: [self-hosted, linux, x64, br-owner-voice-gpu]
    timeout-minutes: 480
    permissions:
      contents: read
    env:
      BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64: ${{ secrets.BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64 }}
      BR_OWNER_TELEGRAM_REFERENCE_INDEX: ${{ secrets.BR_OWNER_TELEGRAM_REFERENCE_INDEX }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BR_OWNER_STT_MODEL: large-v3-turbo
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: GPU and zero-fallback preflight
        run: |
          set -euo pipefail
          nvidia-smi
          test -n "${BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64:-}${BR_OWNER_TELEGRAM_REFERENCE_INDEX:-}"
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          echo "SOLE_AUTHORIZED_IDENTITY=BR_OWNER_V1"
          echo "OWNER_REFERENCE_SOURCE=TELEGRAM_HUMAN_OWNER"
          echo "GENERIC_VOICE_FALLBACK=FORBIDDEN"

      - name: Establish private fine-tune workspace
        run: |
          set -euo pipefail
          PRIVATE="${HOME}/.local/share/br-owner-voice/finetune/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          PUBLIC_CACHE="${HOME}/.cache/br-owner-voice/hf-public"
          MODEL_CANDIDATE="${HOME}/.local/share/br-owner-voice/models/candidates/${GITHUB_RUN_ID}"
          mkdir -p "$PRIVATE" "$PUBLIC_CACHE" "$MODEL_CANDIDATE"
          chmod 700 "$PRIVATE" "$MODEL_CANDIDATE"
          {
            echo "BR_OWNER_FINETUNE_PRIVATE_WORKSPACE=$PRIVATE"
            echo "BR_OWNER_PUBLIC_MODEL_CACHE=$PUBLIC_CACHE"
            echo "BR_OWNER_FINETUNE_MODEL_CANDIDATE=$MODEL_CANDIDATE"
          } >> "$GITHUB_ENV"

      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python3 -m venv "$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/venv"
          PY="$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/venv/bin/python"
          "$PY" -m pip install --disable-pip-version-check --prefer-binary             "qwen-tts==0.1.1" "faster-whisper==1.2.0" "av==18.0.0"             "speechbrain==1.1.1" soundfile requests huggingface_hub accelerate safetensors
          "$PY" -m pip check

      - name: Build private owner-only training dataset
        id: dataset
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          "$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/venv/bin/python"             scripts/owner_voice_qwen3_tts_finetune_dataset.py

      - name: Fetch exact upstream and apply governed fixes
        run: |
          set -euo pipefail
          ROOT="$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/Qwen3-TTS"
          git clone --filter=blob:none https://github.com/QwenLM/Qwen3-TTS.git "$ROOT"
          git -C "$ROOT" checkout --detach 022e286b98fbec7e1e916cb940cdf532cd9f488e
          test "$(git -C "$ROOT" rev-parse HEAD)" = "022e286b98fbec7e1e916cb940cdf532cd9f488e"
          "$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/venv/bin/python"             scripts/owner_voice_qwen3_tts_finetune_patch.py "$ROOT"

      - name: Prepare Qwen 12Hz audio codes
        env:
          HF_HOME: ${{ env.BR_OWNER_PUBLIC_MODEL_CACHE }}/huggingface
        run: |
          set -euo pipefail
          ROOT="$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/Qwen3-TTS"
          "$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/venv/bin/python"             "$ROOT/finetuning/prepare_data.py"             --device cuda:0             --tokenizer_model_path Qwen/Qwen3-TTS-Tokenizer-12Hz             --input_jsonl "${{ steps.dataset.outputs.train_raw_jsonl }}"             --output_jsonl "$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/train_with_codes.jsonl"

      - name: Fine-tune BR_OWNER_V1 Qwen3-TTS 1.7B
        env:
          HF_HOME: ${{ env.BR_OWNER_PUBLIC_MODEL_CACHE }}/huggingface
        run: |
          set -euo pipefail
          ROOT="$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/Qwen3-TTS"
          cd "$ROOT/finetuning"
          "$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/venv/bin/python" sft_12hz.py             --init_model_path Qwen/Qwen3-TTS-12Hz-1.7B-Base             --output_model_path "$BR_OWNER_FINETUNE_MODEL_CANDIDATE"             --train_jsonl "$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/train_with_codes.jsonl"             --batch_size 2             --lr 2e-6             --num_epochs 10             --speaker_name BR_OWNER_V1
          echo "OWNER_QWEN3_TTS_FINETUNE=PASS"
          echo "runtime_activation=false"
          echo "HUMAN_REVIEW=PENDING"

      - name: Preserve private candidate and remove transient biometrics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -rf             "$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/owner-references"             "$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/identity-16k"             "$BR_OWNER_FINETUNE_PRIVATE_WORKSPACE/dataset/audio"
          echo "PUBLIC_OWNER_AUDIO_ARTIFACTS=0"
          echo "PUBLIC_FINETUNE_MODEL_ARTIFACTS=0"
