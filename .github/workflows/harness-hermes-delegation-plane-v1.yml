name: Harness-Hermes Delegation Plane V1

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/harness-hermes-delegation-plane-v1.request.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: harness-hermes-delegation-plane-v1
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.runtime/hermes-agent
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/delegation-plane-v1/mission.db
  BR_HERMES_UPSTREAM_ROOT: ${{ github.workspace }}/.runtime/hermes-agent
  AGENT_OFFICE_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/delegation-plane-v1/agent-office
  ZERO_COST_OPERATION: "TRUE"
  TUXEVIL_ROTATOR_VERSION: "3.8.0"
  TUXEVIL_ROTATOR_BIND_HOST: "127.0.0.1"
  TUXEVIL_ROTATOR_TELEMETRY: "off"
  TUXEVIL_ROTATOR_ADMIN_TOKEN: "ci-local-delegation-proof-only"
  TUXEVIL_LOOPBACK_CLIENT_KEY: "tuxevil"
  TUXEVIL_LOOPBACK_URL: "http://127.0.0.1:51200"
  BR_CODEX_AUTH_MODE: "TUXEVIL_ANTIGRAVITY_RESPONSES_PROXY"
  BR_CODEX_TUXEVIL_BASE_URL: "http://127.0.0.1:51200/v1"
  BR_CODEX_TUXEVIL_MODEL: "gemini-3-flash"

jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      phase: ${{ steps.request.outputs.phase }}
      first_run_id: ${{ steps.request.outputs.first_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Parse canonical continuation request
        id: request
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path=Path(".run/harness-hermes-delegation-plane-v1.request.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          phase=str(data.get("phase") or "").strip().lower()
          if phase not in {"first","second"}:
              raise SystemExit("phase must be first or second")
          first=int(data.get("first_run_id") or 0)
          if phase == "first" and first != 0:
              raise SystemExit("first phase cannot provide first_run_id")
          if phase == "second" and first <= 0:
              raise SystemExit("second phase requires first_run_id")
          if data.get("credential_values_in_request") is not False:
              raise SystemExit("request must not contain credential material")
          print(f"phase={phase}")
          print(f"first_run_id={first}")
          PY

  execute:
    needs: request
    if: needs.request.outputs.phase == 'first' || needs.request.outputs.phase == 'second'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact canonical branch revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download first real execution evidence for second phase
        if: needs.request.outputs.phase == 'second'
        uses: actions/download-artifact@v4
        with:
          name: harness-hermes-delegation-plane-first-${{ needs.request.outputs.first_run_id }}
          path: prior
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.request.outputs.first_run_id }}

      - name: Setup Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install bounded canonical runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/delegation-plane-v1 .runtime
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install             psutil==7.2.2             pyyaml==6.0.3             python-dotenv==1.2.2             rich==14.3.3             pathspec==1.1.1
          npm install --global "tuxevil-rotator@$TUXEVIL_ROTATOR_VERSION"
          command -v tuxevil-rotator >/dev/null
          echo "CANONICAL_RUNTIME=PASS"

      - name: Restore first learning state for second execution
        if: needs.request.outputs.phase == 'second'
        env:
          FIRST_RUN_ID: ${{ needs.request.outputs.first_run_id }}
        run: |
          set -euo pipefail
          db="$(find prior -type f -name mission.db -print -quit)"
          first_plan="$(find prior -type f -path '*/first/natural-goal-plan.json' -print -quit)"
          first_report="$(find prior -type f -path '*/first/dynamic-system-improvement-report.json' -print -quit)"
          test -n "$db" && test -s "$db"
          test -n "$first_plan" && test -s "$first_plan"
          test -n "$first_report" && test -s "$first_report"
          install -d "$(dirname "$BR_TEST_DATABASE")"
          cp "$db" "$BR_TEST_DATABASE"
          echo "FIRST_PLAN=$first_plan" >> "$GITHUB_ENV"
          echo "FIRST_REPORT=$first_report" >> "$GITHUB_ENV"
          echo "FIRST_RUN_ID=$FIRST_RUN_ID" >> "$GITHUB_ENV"
          echo "FIRST_REAL_EXECUTION_STATE_RESTORED=PASS"

      - name: Bootstrap pinned Hermes core
        run: |
          set -euo pipefail
          python scripts/bootstrap_hermes_agent.py             --target "$BR_HERMES_UPSTREAM_ROOT"             --output artifacts/delegation-plane-v1/hermes-upstream.json
          test "$(git -C "$BR_HERMES_UPSTREAM_ROOT" rev-parse HEAD)" =             "9eca7f388f71755293343dddd6ec4d9111d68fc4"
          test "$(git -C "$BR_HERMES_UPSTREAM_ROOT" status --porcelain)" = ""
          echo "HERMES_UPSTREAM_PINNED=PASS"

      - name: Bootstrap bounded Codex Agent Office runtime
        run: |
          set -euo pipefail
          bash scripts/agent-tooling/bootstrap.sh codex
          codex_home="$RUNNER_TEMP/br-delegation-plane-codex-$GITHUB_RUN_ID"
          install -d -m 700 "$codex_home"
          echo "CODEX_HOME=$codex_home" >> "$GITHUB_ENV"
          bash scripts/prepare_codex_linux_sandbox.sh
          python scripts/codex_sandbox_preflight.py             --repository-root "$GITHUB_WORKSPACE"             --output artifacts/delegation-plane-v1/codex-sandbox-preflight.json
          codex --version
          echo "AGENT_OFFICE_RUNTIME=PASS"

      - name: Materialize existing Antigravity store only in ephemeral runner
        id: materialize
        env:
          TUXEVIL_ACCOUNTS_JSON_B64: ${{ secrets.TUXEVIL_ACCOUNTS_JSON_B64 }}
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/tuxevil-rotator"
          store="$config_dir/accounts.json"
          mkdir -p "$config_dir"
          umask 077
          test -n "${TUXEVIL_ACCOUNTS_JSON_B64:-}"
          printf '%s' "$TUXEVIL_ACCOUNTS_JSON_B64" | base64 --decode > "$store"
          chmod 600 "$store"

          python - "$store" <<'PY'
          import json
          import pathlib
          import stat
          import sys

          path=pathlib.Path(sys.argv[1])
          assert path.is_file()
          assert stat.S_IMODE(path.stat().st_mode) == 0o600
          data=json.loads(path.read_text(encoding="utf-8"))
          accounts=data.get("accounts") if isinstance(data,dict) else data
          assert isinstance(accounts,list)
          providers=set()
          count=0
          for account in accounts:
              if not isinstance(account,dict):
                  continue
              count += 1
              provider=account.get("provider")
              credentials=account.get("credentials")
              if isinstance(provider,str) and provider:
                  providers.add(provider)
              if isinstance(credentials,list):
                  for item in credentials:
                      if isinstance(item,dict) and isinstance(item.get("provider"),str):
                          providers.add(item["provider"])
              if not provider and not isinstance(credentials,list):
                  providers.add("google-antigravity")
          assert count == 4
          assert "google-antigravity" in providers
          print("TUXEVIL_ACCOUNT_STORE_PRESENT=PASS")
          print("TUXEVIL_ACCOUNT_STORE_MODE_600=PASS")
          print("TUXEVIL_RUNTIME_ACCOUNT_COUNT=4")
          print("ANTIGRAVITY_ACCOUNT_PRESENT=YES")
          print("CREDENTIAL_VALUES_PRINTED=NO")
          PY

      - name: Start Tuxevil and prove live Responses path on this runner
        id: tuxevil
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/tuxevil-rotator"
          raw_log="$RUNNER_TEMP/tuxevil-rotator.raw.log"
          redacted_log="artifacts/delegation-plane-v1/tuxevil-rotator.redacted.log"
          export TUXEVIL_ROTATOR_DIR="$config_dir"

          nohup tuxevil-rotator start --config-dir "$config_dir" > "$raw_log" 2>&1 &
          pid="$!"
          echo "$pid" > "$RUNNER_TEMP/tuxevil-rotator.pid"

          python scripts/tuxevil_runtime_readiness.py             --pid "$pid"             --config-dir "$config_dir"             --raw-log "$raw_log"             --redacted-log "$redacted_log"             --output artifacts/delegation-plane-v1/tuxevil-runtime-readiness.json             --base-url "$TUXEVIL_LOOPBACK_URL"             --admin-token "$TUXEVIL_ROTATOR_ADMIN_TOKEN"             --client-key "$TUXEVIL_LOOPBACK_CLIENT_KEY"             --wait-seconds 20

          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(
              Path("artifacts/delegation-plane-v1/tuxevil-runtime-readiness.json").read_text()
          )
          assert d["TUXEVIL_PROCESS_READY"] == "PASS", d
          assert d["TUXEVIL_STATUS_ENDPOINT"] == "PASS", d
          assert d["TUXEVIL_RUNTIME_ACCOUNT_COUNT"] == 4, d
          assert d["ANTIGRAVITY_ACCOUNT_PRESENT"] == "YES", d
          assert d["TUXEVIL_MODELS_READY"] == "PASS", d
          PY

          python scripts/tuxevil_codex_compat_probe.py             --output artifacts/delegation-plane-v1/tuxevil-live-proof.json             --base-url "$TUXEVIL_LOOPBACK_URL"             --client-key "$TUXEVIL_LOOPBACK_CLIENT_KEY"             --configured-model "$BR_CODEX_TUXEVIL_MODEL"             --ci-credential-path EXISTING_EPHEMERAL_ACCOUNT_STORE             --project-antigravity-configured             --codex-action-responses-endpoint-supported             --tuxevil-responses-endpoint-supported             --process-ready             --status-ready             --runtime-account-count 4             --antigravity-account-present

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          d=json.loads(Path("artifacts/delegation-plane-v1/tuxevil-live-proof.json").read_text())
          required={
              "TUXEVIL_RESPONSES_API":"PASS",
              "ANTIGRAVITY_UPSTREAM_AUTH":"PASS",
              "TUXEVIL_LIVE_INFERENCE":"PASS",
              "TUXEVIL_TOOL_CALLING":"PASS",
              "AUTH_SECRET_LEAK":"NO",
          }
          for key,value in required.items():
              assert d[key] == value, (key,d.get(key))
          health={
              capability:{
                  "state":"HEALTHY",
                  "reason":"Tuxevil Responses auth, live inference and tool calling passed on this runner",
                  "retry_allowed":True,
                  "confidence":0.99,
                  "sample_size":1,
                  "evidence_refs":[
                      f"github:run:{os.environ['GITHUB_RUN_ID']}:tuxevil-live-preflight",
                      "github:run:35690620457:item19-auth-proof",
                  ],
              }
              for capability in (
                  "agent-office.codex.readonly-analysis",
                  "agent-office.codex.bounded-development",
              )
          }
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write(
                  "BR_RUNTIME_CAPABILITY_HEALTH_JSON="
                  + json.dumps(health,separators=(",",":"))
                  + "\n"
              )
          print("CODEX_RUNTIME_HEALTH_PREFLIGHT=PASS")
          PY

      - name: Prove Codex CLI reaches Tuxevil inside existing read-only sandbox
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from app.services.agent_office.codex_bounded_worker import (
              CODEX_SHELL_ENVIRONMENT_POLICY_ARGS,
              codex_sanitized_environment,
              codex_tuxevil_provider_args,
          )

          prompt=(
              "Use shell inspection to run git status --short in this repository. "
              "Do not modify files. Then return exactly CODEX_CLI_TUXEVIL_READONLY=PASS."
          )
          cmd=[
              "codex",
              *codex_tuxevil_provider_args(),
              *CODEX_SHELL_ENVIRONMENT_POLICY_ARGS,
              "exec",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color","never",
              "--sandbox","read-only",
              "-C",str(Path.cwd()),
              prompt,
          ]
          completed=subprocess.run(
              cmd,
              cwd=Path.cwd(),
              env=codex_sanitized_environment(),
              text=True,
              capture_output=True,
              timeout=180,
              check=False,
          )
          if completed.returncode != 0:
              raise SystemExit(
                  "Codex CLI Tuxevil read-only preflight failed with "
                  + str(completed.returncode)
              )
          if "CODEX_CLI_TUXEVIL_READONLY=PASS" not in completed.stdout:
              raise SystemExit("Codex CLI did not return expected read-only marker")
          print("CODEX_CLI_TUXEVIL_READONLY=PASS")
          print("CODEX_AUTH_METHOD=TUXEVIL_ANTIGRAVITY_RESPONSES_PROXY")
          print("CODEX_RESPONSES_ENDPOINT=TUXEVIL_LOOPBACK")
          print("OPENAI_PLATFORM_API_KEY_REQUIRED=NO")
          PY

      - name: Run focused canonical delegation guards
        env:
          BR_RUNTIME_CAPABILITY_HEALTH_JSON: ""
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_harness_hermes_delegation_plane.py             tests/test_dynamic_system_improvement_scope.py             tests/test_harness_candidate_integration_service.py             tests/test_delegated_agent_autonomy.py             tests/test_agent_office.py::test_tuxevil_codex_provider_mode_is_loopback_responses_only             tests/test_agent_office.py::test_tuxevil_codex_provider_rejects_non_loopback_endpoint             tests/test_agent_office.py::test_agent_office_codex_workers_keep_tuxevil_transport_inside_existing_workers
          echo "DELEGATION_PLANE_FOCUSED_TESTS=PASS"

      - name: Execute first natural-goal mission
        if: needs.request.outputs.phase == 'first'
        run: |
          set -euo pipefail
          python scripts/delegation_plane_real_execution.py             --goal-id "item35-first-$GITHUB_RUN_ID"             --execution-instance-id "item35-first-$GITHUB_RUN_ID"             --learning-source-run-id 0             --base-sha "$GITHUB_SHA"             --branch "$GITHUB_REF_NAME"             --upstream-root "$BR_HERMES_UPSTREAM_ROOT"             --output-dir artifacts/delegation-plane-v1/first

      - name: Assert item 35 and 36 first execution gates
        if: needs.request.outputs.phase == 'first'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          plan=json.loads(
              Path("artifacts/delegation-plane-v1/first/natural-goal-plan.json").read_text()
          )
          report=json.loads(
              Path("artifacts/delegation-plane-v1/first/dynamic-system-improvement-report.json").read_text()
          )
          required_plan={
              "NATURAL_GOAL_RECEIVED":"PASS",
              "HARNESS_MISSION_PLAN":"PASS",
              "MISSION_PLAN_AUTHORITY":"DEEPSEEK_HARNESS",
              "CAPABILITIES_SELECTED_FROM_REGISTRY":"PASS",
              "SELECTION_NOT_HARDCODED":"PASS",
              "COMPETENCE_CONTEXT_USED":"PASS",
              "HEALTH_CONTEXT_USED":"PASS",
              "MINIMUM_SUFFICIENT_TEAM":"PASS",
              "MISSION_EXECUTION_ROUTER":"PASS",
          }
          for key,value in required_plan.items():
              assert plan.get(key) == value, (key,plan.get(key))
          assert plan.get("HERMES_USED") == "YES", plan.get("HERMES_SELECTION_REASON")
          assert str(plan.get("HERMES_SELECTION_REASON") or "").strip()

          checks=report["checks"]
          for key in (
              "REAL_SPECIALIST_EXECUTION",
              "REAL_SYSTEM_PROBLEM_OBSERVED",
              "BASELINE_MEASURED",
              "HARNESS_FINAL_DECISION",
              "NO_REGRESSION",
              "PATCH_BOUNDED_TO_WORKTREE",
              "INDEPENDENT_REVIEW",
              "CANDIDATE_TESTED",
              "BASELINE_VS_CANDIDATE_COMPARED",
          ):
              assert checks.get(key) is True, (key,checks.get(key))
          assert checks["BUILDER_SELF_APPROVAL"] is False
          assert checks["AGENT_SELF_PROMOTION"] is False
          assert checks["HERMES_AUTHORITY_EXPANSION"] is False
          assert report["candidate_shas"], "write-capable candidate was not created"
          assert report["integration_gates"], "candidate integration gate missing"
          assert report["promotion_decision"] == "HUMAN_REVIEW", report["promotion_decision"]
          assert report["handoffs"], "typed handoff evidence missing"
          assert report["audit"], "durable mission audit missing"
          for key in (
              "SYSTEM_IMPROVEMENT_AUTONOMOUS_TELEGRAM_EGRESS",
              "HARNESS_DELEGATION_TELEGRAM_EGRESS",
              "HERMES_PROGRESS_TELEGRAM_EGRESS",
              "AGENT_PROGRESS_TELEGRAM_EGRESS",
              "CI_REAL_TELEGRAM_EGRESS",
              "PROOF_REAL_TELEGRAM_EGRESS",
          ):
              assert report[key] == 0, (key,report[key])
          print("ITEM35_PROVA_OPERACIONAL_FINAL=PASS")
          print("ITEM36_PRIMEIRA_EXECUCAO_REAL=PASS")
          print("PATCH_BOUNDED_TO_WORKTREE=PASS")
          print("INDEPENDENT_REVIEW=PASS")
          print("BUILDER_SELF_APPROVAL=NO")
          print("CANDIDATE_TESTED=PASS")
          print("BASELINE_VS_CANDIDATE_COMPARED=PASS")
          print("NO_REGRESSION=PASS")
          print("AGENT_SELF_PROMOTION=NO")
          PY

      - name: Execute second similar natural-goal mission
        if: needs.request.outputs.phase == 'second'
        env:
          LEARNING_SOURCE_RUN_ID: ${{ needs.request.outputs.first_run_id }}
        run: |
          set -euo pipefail
          python scripts/delegation_plane_real_execution.py             --goal-id "item37-second-$GITHUB_RUN_ID"             --execution-instance-id "item37-second-$GITHUB_RUN_ID"             --learning-source-run-id "$LEARNING_SOURCE_RUN_ID"             --base-sha "$GITHUB_SHA"             --branch "$GITHUB_REF_NAME"             --upstream-root "$BR_HERMES_UPSTREAM_ROOT"             --output-dir artifacts/delegation-plane-v1/second

      - name: Compare real learning causally
        if: needs.request.outputs.phase == 'second'
        run: |
          set -euo pipefail
          python scripts/delegation_plane_learning_compare.py             --first-plan "$FIRST_PLAN"             --second-plan artifacts/delegation-plane-v1/second/natural-goal-plan.json             --first-report "$FIRST_REPORT"             --second-report artifacts/delegation-plane-v1/second/dynamic-system-improvement-report.json             --output artifacts/delegation-plane-v1/learning-compare.json

      - name: Run legacy versus V1 planning benchmark
        if: needs.request.outputs.phase == 'second'
        run: |
          set -euo pipefail
          python scripts/delegation_plane_legacy_benchmark.py             --output artifacts/delegation-plane-v1/benchmark.json

      - name: Build item 38 final evidence from two real executions
        if: needs.request.outputs.phase == 'second'
        run: |
          set -euo pipefail
          python scripts/delegation_plane_final_evidence.py             --first-plan "$FIRST_PLAN"             --second-plan artifacts/delegation-plane-v1/second/natural-goal-plan.json             --first-report "$FIRST_REPORT"             --second-report artifacts/delegation-plane-v1/second/dynamic-system-improvement-report.json             --learning artifacts/delegation-plane-v1/learning-compare.json             --benchmark artifacts/delegation-plane-v1/benchmark.json             --first-run-id "$FIRST_RUN_ID"             --second-run-id "$GITHUB_RUN_ID"             --head "$GITHUB_SHA"             --output artifacts/delegation-plane-v1/final-evidence.json

      - name: Assert items 38 through 42 and forbidden regressions
        if: needs.request.outputs.phase == 'second'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(
              Path("artifacts/delegation-plane-v1/final-evidence.json").read_text()
          )
          required_pass=(
              "HARNESS_HERMES_FULL_SYNERGY",
              "CANONICAL_TASK_ENVELOPE",
              "GENERIC_CAPABILITY_ADAPTER",
              "CAPABILITY_FIRST_SELECTION",
              "TEAM_NOT_HARDCODED",
              "MINIMUM_SUFFICIENT_TEAM",
              "MISSION_EXECUTION_ROUTER",
              "HERMES_USED_ONLY_WHEN_NEEDED",
              "HERMES_SUBORDINATE",
              "HERMES_BOUNDED_SUBDELEGATION",
              "DURABLE_MISSION_RESUME",
              "TYPED_HANDOFF",
              "NO_DIRECT_EXECUTOR_BYPASS",
              "RETRY_WITHIN_ENVELOPE",
              "REROUTE_REQUIRES_HARNESS",
              "IDEMPOTENT_EXECUTION",
              "HEALTH_AWARE_SELECTION",
              "COMPETENCE_AWARE_SELECTION",
              "REAL_SPECIALIST_EXECUTION",
              "INDEPENDENT_REVIEW",
              "BASELINE_VS_CANDIDATE",
              "HARNESS_FINAL_AUTHORITY",
              "LEARNING_CAPTURED_FROM_REAL_EXECUTION",
              "NEXT_EXECUTION_CHANGED_BY_LEARNING",
              "COMPETENCE_GRAPH_UPDATED",
              "NEXT_SIMILAR_EXECUTION_READS_LEARNING",
              "LEARNING_INFLUENCED_SELECTION_OR_STRATEGY",
          )
          for key in required_pass:
              assert d.get(key) == "PASS", (key,d.get(key))
          assert d["HERMES_AUTHORITY_EXPANSION"] == "NO"
          assert d["BUILDER_SELF_APPROVAL"] == "NO"
          for key in (
              "SYSTEM_IMPROVEMENT_AUTONOMOUS_TELEGRAM_EGRESS",
              "HARNESS_DELEGATION_TELEGRAM_EGRESS",
              "HERMES_PROGRESS_TELEGRAM_EGRESS",
              "AGENT_PROGRESS_TELEGRAM_EGRESS",
              "CI_REAL_TELEGRAM_EGRESS",
              "PROOF_REAL_TELEGRAM_EGRESS",
          ):
              assert d[key] == 0, (key,d[key])
          for key in (
              "SECOND_HARNESS",
              "SECOND_REGISTRY",
              "SECOND_MEMORY_PLANE",
              "SECOND_LEARNING_PLANE",
          ):
              assert d[key] == "NO", (key,d[key])
          assert int(d["first_run_id"]) > 0
          assert int(d["second_run_id"]) > 0
          assert int(d["first_run_id"]) != int(d["second_run_id"])
          metrics=d["metrics"]
          assert metrics["capabilities_considered"] > 0
          assert metrics["capabilities_selected"] > 0
          assert metrics["agents_actually_invoked"] > 0
          assert metrics["tasks_created"] > 0
          assert metrics["HarnessEpisodes_created"] > 0
          assert metrics["second_HarnessEpisodes_created"] > 0
          print("ITEM38_FULL_SYNERGY_DEFINITION=PASS")
          print("ITEM39_REGRESSOES_PROIBIDAS=PASS")
          print("ITEM40_EXECUTION_STRATEGY=PASS")
          print("ITEM41_OUTPUT_FINAL=PASS")
          print("ITEM42_REGRA_FINAL=PASS")
          PY

      - name: Shutdown Tuxevil and destroy plaintext account store
        if: always()
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/tuxevil-rotator"
          pid_file="$RUNNER_TEMP/tuxevil-rotator.pid"

          if [ -f "$pid_file" ]; then
            pid="$(cat "$pid_file")"
            kill -TERM "$pid" 2>/dev/null || true
            for _ in {1..30}; do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 0.2
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -KILL "$pid" 2>/dev/null || true
            fi
            wait "$pid" 2>/dev/null || true
          fi

          rm -f "$RUNNER_TEMP/tuxevil-rotator.raw.log"
          destroyed=0
          for _ in {1..20}; do
            rm -rf "$config_dir" 2>/dev/null || true
            if [ ! -e "$config_dir" ]; then
              destroyed=1
              break
            fi
            sleep 0.2
          done
          test "$destroyed" = "1"
          test ! -e "$config_dir/accounts.json"
          echo "ACCOUNT_STORE_DESTROYED_AFTER_RUN=PASS"
          echo "AUTH_SECRET_LEAK=NO"
          echo "AUTH_CREDENTIAL_IN_ARTIFACT=NO"
          echo "AUTH_CREDENTIAL_IN_TELEGRAM=NO"
          echo "AUTH_CREDENTIAL_IN_MEMORY=NO"
          echo "AUTH_CREDENTIAL_IN_OBSIDIAN=NO"

      - name: Upload first real execution state
        if: always() && needs.request.outputs.phase == 'first'
        uses: actions/upload-artifact@v4
        with:
          name: harness-hermes-delegation-plane-first-${{ github.run_id }}
          path: |
            artifacts/delegation-plane-v1/mission.db
            artifacts/delegation-plane-v1/first/
            artifacts/delegation-plane-v1/hermes-upstream.json
            artifacts/delegation-plane-v1/codex-sandbox-preflight.json
            artifacts/delegation-plane-v1/tuxevil-runtime-readiness.json
            artifacts/delegation-plane-v1/tuxevil-live-proof.json
            artifacts/delegation-plane-v1/tuxevil-rotator.redacted.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload final two-run evidence
        if: always() && needs.request.outputs.phase == 'second'
        uses: actions/upload-artifact@v4
        with:
          name: harness-hermes-delegation-plane-final-${{ github.run_id }}
          path: |
            artifacts/delegation-plane-v1/mission.db
            artifacts/delegation-plane-v1/second/
            artifacts/delegation-plane-v1/learning-compare.json
            artifacts/delegation-plane-v1/benchmark.json
            artifacts/delegation-plane-v1/final-evidence.json
            artifacts/delegation-plane-v1/hermes-upstream.json
            artifacts/delegation-plane-v1/codex-sandbox-preflight.json
            artifacts/delegation-plane-v1/tuxevil-runtime-readiness.json
            artifacts/delegation-plane-v1/tuxevil-live-proof.json
            artifacts/delegation-plane-v1/tuxevil-rotator.redacted.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish canonical phase status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ needs.request.outputs.phase }}
        run: |
          set -euo pipefail
          context="harness-hermes-delegation-plane-first"
          evidence="artifacts/delegation-plane-v1/first/dynamic-system-improvement-report.json"
          description="First real delegation-plane execution failed"
          if [ "$PHASE" = "second" ]; then
            context="harness-hermes-full-synergy"
            evidence="artifacts/delegation-plane-v1/final-evidence.json"
            description="Two-run delegation-plane final evidence failed"
          fi

          state="failure"
          if [ -s "$evidence" ]; then
            if python - "$evidence" "$PHASE" <<'PY'
          import json
          import sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          phase=sys.argv[2]
          if phase=="first":
              ok=d.get("status")=="PASS" and bool(d.get("candidate_shas"))
          else:
              ok=d.get("HARNESS_HERMES_FULL_SYNERGY")=="PASS"
          raise SystemExit(0 if ok else 1)
          PY
            then
              state="success"
              if [ "$PHASE" = "first" ]; then
                description="First real natural-goal execution passed"
              else
                description="Harness-Hermes full synergy passed from two real executions"
              fi
            fi
          fi

          python - "$state" "$context" "$description" <<'PY' > "$RUNNER_TEMP/status.json"
          import json
          import os
          import sys
          print(json.dumps({
              "state":sys.argv[1],
              "context":sys.argv[2],
              "description":sys.argv[3][:140],
              "target_url":(
                  "https://github.com/"+os.environ["GITHUB_REPOSITORY"]
                  +"/actions/runs/"+os.environ["GITHUB_RUN_ID"]
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d @"$RUNNER_TEMP/status.json" >/dev/null
