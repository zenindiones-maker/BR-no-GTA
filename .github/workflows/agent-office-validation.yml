name: Agent Office Validation

on:
  push:
    branches:
      - work/munder-difflin-agent-office
      - work/gate6f-analytics-learning
    paths:
      - "app/services/agent_office/**"
      - "tests/test_delegated_agent_autonomy.py"
      - "app/database/schema.py"
      - "app/database/agent_execution_lease_repository.py"
      - "app/services/agent_office_harness_service.py"
      - "app/services/global_capability_registry.py"
      - "app/services/global_capability_registry_base.py"
      - "app/services/codex_addy_capability_executor.py"
      - "app/services/addy_harness_service.py"
      - "app/services/harness_capability_service.py"
      - "app/services/harness_mcp_capability_execution.py"
      - "integrations/munder_difflin/**"
      - "scripts/agent_office_*.py"
      - "scripts/agent-tooling/**"
      - "tests/test_agent_office.py"
      - "tests/test_harness_capability_service.py"
      - ".github/workflows/agent-office-*.yml"
  pull_request:
    paths:
      - "app/services/agent_office/**"
      - "app/services/agent_office_harness_service.py"
      - "app/services/global_capability_registry.py"
      - "app/services/global_capability_registry_base.py"
      - "app/services/codex_addy_capability_executor.py"
      - "app/services/addy_harness_service.py"
      - "app/services/harness_capability_service.py"
      - "app/services/harness_mcp_capability_execution.py"
      - "integrations/munder_difflin/**"
      - "scripts/agent_office_*.py"
      - "scripts/agent-tooling/**"
      - "tests/test_agent_office.py"
      - "tests/test_harness_capability_service.py"
      - ".github/workflows/agent-office-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UPSTREAM_DIR: ${{ github.workspace }}/.agent-office-upstream
    steps:
      - name: Checkout BR-no-GTA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Munder Difflin source
        uses: actions/checkout@v4
        with:
          repository: chaitanyagiri/munder-difflin
          ref: 6248293a7cd9dfdbf9633d12bbe857831ccfee88
          path: .agent-office-upstream

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .agent-office-upstream/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify pin and disabled autonomy policy
        run: python scripts/agent_office_preflight.py --upstream-dir "${UPSTREAM_DIR}"

      - name: Install pinned upstream without Electron native scripts
        working-directory: .agent-office-upstream
        run: npm ci --ignore-scripts

      - name: Typecheck pinned upstream core
        working-directory: .agent-office-upstream
        run: npm run typecheck:node

      - name: Enforce reviewed non-runtime upstream audit boundary
        working-directory: .agent-office-upstream
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/agent-office-evidence"
          npm audit --omit=dev --json > "${GITHUB_WORKSPACE}/agent-office-evidence/upstream-npm-audit.json" || true
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          audit = json.loads((root / "agent-office-evidence/upstream-npm-audit.json").read_text())
          lock = json.loads((root / "integrations/munder_difflin/UPSTREAM.lock").read_text())
          observed = sorted(
              name for name, item in audit["vulnerabilities"].items()
              if item["severity"] in {"high", "critical"}
          )
          expected = sorted(lock["audit_review"]["allowed_high_packages"])
          assert audit["metadata"]["vulnerabilities"]["critical"] == 0
          assert observed == expected, (observed, expected)
          print("UPSTREAM_AUDIT_BOUNDARY=PASS")
          PY

      - name: Install BR test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Agent Office boundary
        run: |
          python -m py_compile \
            app/services/agent_office/*.py \
            app/services/agent_office_harness_service.py \
            app/database/agent_execution_lease_repository.py \
            app/services/harness_mcp_capability_execution.py \
            scripts/agent_office_preflight.py \
            scripts/agent_office_canary.py \
            scripts/agent_office_addy_24_canary.py

      - name: Test authorization, routing, worktrees and evidence
        run: python -m pytest -q tests/test_agent_office.py tests/test_delegated_agent_autonomy.py tests/test_harness_capability_service.py tests/test_harness_routing_policy_service.py

      - name: Run bounded parallel-task canary
        run: |
          python scripts/agent_office_canary.py \
            --branch "${GITHUB_REF_NAME}" \
            --base-sha "${GITHUB_SHA}" \
            --output agent-office-evidence/canary.json
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Prove Addy 24 Agent Office swarm routing and isolation
        run: |
          python scripts/agent_office_addy_24_canary.py \
            --branch "${GITHUB_REF_NAME}" \
            --base-sha "${GITHUB_SHA}" \
            --output agent-office-evidence/addy-24-swarm.json
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload Agent Office evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-office-validation-${{ github.run_id }}
          path: agent-office-evidence/
          if-no-files-found: error
          retention-days: 14
