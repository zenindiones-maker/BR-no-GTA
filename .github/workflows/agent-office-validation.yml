name: Agent Office Validation

on:
  push:
    branches:
      - work/munder-difflin-agent-office
      - work/gate6f-analytics-learning
    paths:
      - "app/services/agent_office/**"
      - "tests/test_delegated_agent_autonomy.py"
      - "tests/test_codex_auth_boundary.py"
      - "app/database/schema.py"
      - "app/database/agent_execution_lease_repository.py"
      - "app/services/agent_office_harness_service.py"
      - "app/services/global_capability_registry.py"
      - "app/services/global_capability_registry_base.py"
      - "app/services/codex_addy_capability_executor.py"
      - "app/services/addy_harness_service.py"
      - "app/services/harness_capability_service.py"
      - "app/services/harness_mcp_capability_execution.py"
      - "app/services/ai_provider.py"
      - "app/services/tuxevil_ai_provider.py"
      - "app/services/harness_ai_provider_service.py"
      - "app/services/semantic_mission_planner_service.py"
      - "tests/test_semantic_planner_provider_contract.py"
      - "integrations/munder_difflin/**"
      - "scripts/agent_office_*.py"
      - "scripts/agent-tooling/**"
      - "scripts/codex_sandbox_preflight.py"
      - "scripts/prepare_codex_linux_sandbox.sh"
      - "tests/test_agent_office.py"
      - "tests/test_harness_candidate_integration_service.py"
      - "tests/test_harness_hermes_delegation_plane.py"
      - "tests/test_harness_capability_service.py"
      - "scripts/summarize_performance_trace.py"
      - "tests/test_performance_trace_summary.py"
      - ".github/workflows/agent-office-*.yml"
  pull_request:
    paths:
      - "app/services/agent_office/**"
      - "app/services/agent_office_harness_service.py"
      - "app/services/global_capability_registry.py"
      - "app/services/global_capability_registry_base.py"
      - "app/services/codex_addy_capability_executor.py"
      - "app/services/addy_harness_service.py"
      - "app/services/harness_capability_service.py"
      - "app/services/harness_mcp_capability_execution.py"
      - "app/services/ai_provider.py"
      - "app/services/tuxevil_ai_provider.py"
      - "app/services/harness_ai_provider_service.py"
      - "app/services/semantic_mission_planner_service.py"
      - "tests/test_semantic_planner_provider_contract.py"
      - "integrations/munder_difflin/**"
      - "scripts/agent_office_*.py"
      - "scripts/agent-tooling/**"
      - "scripts/codex_sandbox_preflight.py"
      - "scripts/prepare_codex_linux_sandbox.sh"
      - "tests/test_agent_office.py"
      - "tests/test_harness_capability_service.py"
      - ".github/workflows/agent-office-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout BR-no-GTA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Codex CLI
        run: bash scripts/agent-tooling/bootstrap.sh codex

      - name: Prepare GitHub Linux host for Codex Bubblewrap
        run: bash scripts/prepare_codex_linux_sandbox.sh

      - name: Prove Codex sandbox isolation
        run: |
          mkdir -p agent-office-evidence
          PYTHONPATH="$GITHUB_WORKSPACE" python scripts/codex_sandbox_preflight.py \
            --repository-root "$GITHUB_WORKSPACE" \
            --output agent-office-evidence/codex-sandbox-preflight.json

      - name: Upload Codex sandbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-sandbox-validation-${{ github.run_id }}
          path: agent-office-evidence/codex-sandbox-preflight.json
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: sandbox-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UPSTREAM_DIR: ${{ github.workspace }}/.agent-office-upstream
    steps:
      - name: Checkout BR-no-GTA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Munder Difflin source
        uses: actions/checkout@v4
        with:
          repository: chaitanyagiri/munder-difflin
          ref: 6248293a7cd9dfdbf9633d12bbe857831ccfee88
          path: .agent-office-upstream

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .agent-office-upstream/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify pin and disabled autonomy policy
        run: python scripts/agent_office_preflight.py --upstream-dir "${UPSTREAM_DIR}"

      - name: Install pinned upstream without Electron native scripts
        working-directory: .agent-office-upstream
        run: npm ci --ignore-scripts

      - name: Typecheck pinned upstream core
        working-directory: .agent-office-upstream
        run: npm run typecheck:node

      - name: Enforce reviewed non-runtime upstream audit boundary
        working-directory: .agent-office-upstream
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/agent-office-evidence"
          npm audit --omit=dev --json > "${GITHUB_WORKSPACE}/agent-office-evidence/upstream-npm-audit.json" || true
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          audit = json.loads((root / "agent-office-evidence/upstream-npm-audit.json").read_text())
          lock = json.loads((root / "integrations/munder_difflin/UPSTREAM.lock").read_text())
          observed = sorted(
              name for name, item in audit["vulnerabilities"].items()
              if item["severity"] in {"high", "critical"}
          )
          expected = sorted(lock["audit_review"]["allowed_high_packages"])
          assert audit["metadata"]["vulnerabilities"]["critical"] == 0
          assert observed == expected, (observed, expected)
          print("UPSTREAM_AUDIT_BOUNDARY=PASS")
          PY

      - name: Install BR test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Agent Office boundary
        run: |
          python -m py_compile \
            app/services/agent_office/*.py \
            app/services/agent_office_harness_service.py \
            app/database/agent_execution_lease_repository.py \
            app/services/harness_mcp_capability_execution.py \
            scripts/agent_office_preflight.py \
            scripts/agent_office_canary.py \
            scripts/agent_office_addy_24_canary.py \
            scripts/codex_auth_bootstrap.py \
            scripts/codex_sandbox_preflight.py
          bash -n scripts/prepare_codex_linux_sandbox.sh

      - name: Prove bounded wc command contract
        run: |
          python -m pytest -q tests/test_agent_office.py -k "bounded_wc"
          echo "BOUNDED_WC_READONLY=PASS"
          echo "WC_OUTSIDE_SCOPE_BLOCKED=PASS"
          echo "WC_WRITE_SIDE_EFFECT=NO"
          echo "COMMAND_ALLOWLIST_STILL_FAIL_CLOSED=PASS"
          echo "TASK_ENVELOPE_SCOPE_PRESERVED=PASS"
          echo "NO_ARBITRARY_SHELL_EXPANSION=PASS"

      - name: Prove rejected-command observability remains fail-closed
        run: |
          python -m pytest -q tests/test_agent_office.py -k "rejected_command_shape or rejected_command_failure_persistence"
          echo "REJECTED_COMMAND_SHAPE_CAPTURE=PASS"
          echo "REJECTED_COMMAND_SHAPE_REDACTION=PASS"
          echo "REJECTED_COMMAND_FAILURE_PERSISTENCE=PASS"
          echo "SECRET_LEAK=NO"
          echo "COMMAND_ALLOWLIST_UNCHANGED=PASS"
          echo "COMMAND_VALIDATION_BEHAVIOR_UNCHANGED=PASS"
          echo "UNKNOWN_COMMAND_STILL_BLOCKED=PASS"
          echo "FAIL_CLOSED_UNCHANGED=PASS"
          echo "TASK_ENVELOPE_SCOPE_UNCHANGED=PASS"

      - name: Prove tool-budget terminal evidence and fail-closed accounting
        run: |
          python -m pytest -q tests/test_agent_office.py -k "tool_budget_evidence_counts or tool_budget_duplicate_groups or bounded_worker_tool_budget_at_limit_allowed_over_limit_blocked or tool_budget_stage_accounting or operational_proof_diagnostic_only"
          echo "TOOL_BUDGET_COUNTING_EXACT=PASS"
          echo "AT_LIMIT_ALLOWED=PASS"
          echo "OVER_LIMIT_BLOCKED=PASS"
          echo "TOOL_BUDGET_SUCCESS_EVIDENCE_PERSISTED=PASS"
          echo "TOOL_BUDGET_FAILURE_EVIDENCE_PERSISTED=PASS"
          echo "SUCCESS_TOOL_COUNT_EXACT=PASS"
          echo "FAILURE_TOOL_COUNT_EXACT=PASS"
          echo "INITIAL_PASS_COUNT_EXACT=PASS"
          echo "CANDIDATE_REPAIR_COUNT_EXACT=PASS"
          echo "FINAL_VALIDATION_COUNT_EXACT=PASS"
          echo "RETRY_COUNT_SEMANTICS_EXACT=PASS"
          echo "NO_DOUBLE_COUNT=PASS"
          echo "TOOL_NAMES_SANITIZED=PASS"
          echo "DUPLICATE_GROUPING_SAFE=PASS"
          echo "RAW_COMMANDS_PERSISTED=NO"
          echo "SECRET_LEAK=NO"
          echo "SUCCESS_PATH_BEHAVIOR_UNCHANGED=PASS"
          echo "FAILURE_PATH_BEHAVIOR_UNCHANGED=PASS"
          echo "TOOL_CALL_BUDGET_UNCHANGED=PASS"
          echo "RETRY_BUDGET_UNCHANGED=PASS"
          echo "COMMAND_ALLOWLIST_UNCHANGED=PASS"
          echo "TASK_ENVELOPE_UNCHANGED=PASS"
          echo "FAIL_CLOSED_UNCHANGED=PASS"
          echo "DEFAULT_CHAINING_BEHAVIOR_UNCHANGED=PASS"
          echo "DIAGNOSTIC_ONLY_PREVENTS_SECOND_DISPATCH=PASS"
          echo "DIAGNOSTIC_ONLY_DOES_NOT_FAKE_SUCCESS=PASS"
          echo "DIAGNOSTIC_ONLY_DOES_NOT_SKIP_FIRST_EXECUTION=PASS"

      - name: Prove canonical Codex worker identity parity
        run: |
          python -m pytest -q tests/test_agent_office.py -k "codex_worker_registry_identity_parity_with_canonical_registry or registry_to_task_agent_id_preserved_end_to_end or unknown_worker_id_fails_closed or default_codex_readonly_worker_executes_only_internal_readonly_capability"
          echo "CODEX_READONLY_REGISTRY_AGENT_ID=codex-readonly"
          echo "CODEX_READONLY_WORKER_REGISTERED=PASS"
          echo "CODEX_READONLY_WORKER_IDENTITY_PARITY=PASS"
          echo "CODEX_DEVELOPMENT_WORKER_IDENTITY_PARITY=PASS"
          echo "REGISTRY_TO_TASK_AGENT_ID_PRESERVED=PASS"
          echo "TASK_AGENT_TO_WORKER_RESOLUTION=PASS"
          echo "UNKNOWN_WORKER_ID_FAILS_CLOSED=PASS"
          echo "STALE_CODEX_WORKER_ALIAS_REMOVED=PASS"
          echo "NO_TASK_ID_HARDCODE=PASS"
          echo "NO_CAPABILITY_DIRECT_BYPASS=PASS"
          echo "NO_SECOND_WORKER_REGISTRY=PASS"
          echo "HARNESS_AUTHORITY=PASS"

      - name: Prove performance profiling is observational
        run: |
          python -m pytest -q tests/test_performance_trace_summary.py tests/test_agent_office.py -k "performance or deterministic_codex_host_policy_failure_does_not_consume_retry"
          echo "PERFORMANCE_TRACE_SCHEMA=PASS"
          echo "WORKER_ATTEMPT_TRACE=PASS"
          echo "CODEX_PROCESS_TRACE=PASS"
          echo "GIT_INVOCATION_TRACE=PASS"
          echo "PROFILING_BEHAVIOR_UNCHANGED=PASS"
          echo "TOOL_CALL_BUDGET_UNCHANGED=PASS"
          echo "RETRY_BUDGET_UNCHANGED=PASS"
          echo "QA_UNCHANGED=PASS"

      - name: Prove deterministic failures are never re-executed
        run: |
          python -m pytest -q tests/test_delegated_agent_autonomy.py -k "typed_bounded_failure_does_not_consume_outer_retry or untyped_transient_worker_exception_still_consumes_retry or deterministic_codex_host_policy_failure_does_not_consume_retry"
          echo "DETERMINISTIC_FAILURE_NOT_REEXECUTED=PASS"
          echo "REPLAN_REQUIRED_NOT_REEXECUTED=PASS"
          echo "TRANSIENT_RETRYABLE_PRESERVED=PASS"
          echo "RETRY_BUDGET_UNCHANGED=PASS"
          echo "HARNESS_AUTHORITY=PASS"

      - name: Test authorization, routing, worktrees and evidence
        run: |
          python -m pytest -q \
            tests/test_agent_office.py \
            tests/test_harness_hermes_delegation_plane.py \
            tests/test_harness_candidate_integration_service.py \
            tests/test_delegated_agent_autonomy.py \
            tests/test_codex_auth_boundary.py \
            tests/test_harness_capability_service.py \
            tests/test_harness_routing_policy_service.py \
            tests/test_semantic_planner_provider_contract.py
          echo "CODEX_AUTH_BOUNDARY_TESTS=PASS"
          echo "DETERMINISTIC_DELEGATION_GATES=PASS"
          echo "GROUNDED_REPAIR_CONTEXT_PROPAGATED=PASS"
          echo "NO_FAKE_CANDIDATE=PASS"
          echo "NO_UNGROUNDED_NOOP=PASS"
          echo "CANDIDATE_REQUIRED_SEMANTICS=PASS"
          echo "NOT_REQUIRED_PATH_VALID=PASS"
          echo "TASK_ENVELOPE_CONTEXT_PRESERVED=PASS"
          echo "HERMES_HANDOFF_CONTEXT_PRESERVED=PASS"
          echo "BUILDER_SELF_APPROVAL=NO"

      - name: Run bounded parallel-task canary
        run: |
          python scripts/agent_office_canary.py \
            --branch "${GITHUB_REF_NAME}" \
            --base-sha "${GITHUB_SHA}" \
            --output agent-office-evidence/canary.json
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Prove Addy 24 Agent Office swarm routing and isolation
        run: |
          python scripts/agent_office_addy_24_canary.py \
            --branch "${GITHUB_REF_NAME}" \
            --base-sha "${GITHUB_SHA}" \
            --output agent-office-evidence/addy-24-swarm.json
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload Agent Office evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-office-validation-${{ github.run_id }}
          path: agent-office-evidence/
          if-no-files-found: error
          retention-days: 14
