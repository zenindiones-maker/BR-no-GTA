name: BR V24 Hermes Durable Task Result QA

on:
  push:
    branches:
      - work/br-slm-agent-reconstruction-v24
    paths:
      - ".github/workflows/br-v24-hermes-durable-task-result-qa.yml"
      - "app/services/hermes_multiagent/runtime.py"
      - "tests/test_br_v24_hermes_checkpoint_task_results.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v24-hermes-task-results-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-correctness-and-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify immutable first-party development checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/br-slm-agent-reconstruction-v24"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "BR_TEST_DATABASE=$RUNNER_TEMP/br-v24-hermes-task-results.sqlite3" >> "$GITHUB_ENV"
          python -m pip install -q --disable-pip-version-check -r requirements.txt pytest
      - name: Real source-preserving checkpoint reconstruction and corruption rejection
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_br_v24_hermes_checkpoint_task_results.py
          echo "BR_V24_HERMES_TASKRESULT_EXPORT_RESTORE=PASS"
          echo "BR_V24_HERMES_FULL_TWO_RUNNER_END_TO_END=NOT_ATTEMPTED"
          echo "BR_V24_HERMES_PRODUCTION_PROMOTION=BLOCKED"
