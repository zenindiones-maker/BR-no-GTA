name: Claude Code OmniRoute Zero-Cost Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".github/workflows/claude-code-omniroute-proof.yml"
      - "scripts/agent-tooling/bootstrap.sh"
      - "scripts/agent-tooling/claude_omniroute_contract.py"
      - "tests/test_claude_omniroute_contract.py"
  workflow_dispatch:
    inputs:
      provider:
        description: "Harness-selected provider"
        required: true
        default: "opencode"
      model:
        description: "Harness-selected model"
        required: true
        default: "oc/big-pickle"
      source_sha:
        description: "Exact source revision"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  claude-omniroute-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HARNESS_SELECTED_PROVIDER: ${{ inputs.provider || 'opencode' }}
      HARNESS_SELECTED_MODEL: ${{ inputs.model || 'oc/big-pickle' }}
      ANTHROPIC_BASE_URL: http://127.0.0.1:20128
      ANTHROPIC_AUTH_TOKEN: omniroute-no-auth
      ANTHROPIC_MODEL: ${{ inputs.model || 'oc/big-pickle' }}
      ANTHROPIC_CUSTOM_MODEL_OPTION: ${{ inputs.model || 'oc/big-pickle' }}
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "190000"

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact dispatched source revision
        if: ${{ inputs.source_sha != '' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prove static Claude OmniRoute boundary
        run: |
          set -euo pipefail
          python3 -m unittest -q tests.test_claude_omniroute_contract
          python3 scripts/agent-tooling/claude_omniroute_contract.py             --provider "$HARNESS_SELECTED_PROVIDER"             --model "$HARNESS_SELECTED_MODEL"             --base-url "$ANTHROPIC_BASE_URL"             --zero-cost-proof

      - name: Install pinned Claude Code
        run: bash scripts/agent-tooling/bootstrap.sh claude

      - name: Install pinned OmniRoute
        run: |
          set -euo pipefail
          npm install -g omniroute@3.8.50
          omniroute --version

      - name: Start loopback-only OmniRoute
        run: |
          set -euo pipefail
          OMNIROUTE_SERVER_HOST=127.0.0.1 nohup omniroute serve >/tmp/omniroute-claude.log 2>&1 &
          echo $! >/tmp/omniroute-claude.pid
          for i in {1..40}; do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:20128/api/monitoring/health >/tmp/omniroute-claude-health.json 2>/dev/null; then
              python3 - <<'PY'
          import subprocess
          rows = subprocess.check_output(["ss", "-H", "-ltn", "sport = :20128"], text=True).splitlines()
          assert rows
          addresses = [row.split()[3] for row in rows]
          assert all(address in {"127.0.0.1:20128", "[::1]:20128"} for address in addresses), addresses
          PY
              echo "OMNIROUTE_LOOPBACK_ONLY=PASS"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/omniroute-claude.log || true
          exit 1

      - name: Probe OmniRoute Anthropic Messages endpoint
        run: |
          set -euo pipefail
          mkdir -p runtime/claude-omniroute
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.request

          root = Path("runtime/claude-omniroute")
          request_body = {
              "model": os.environ["HARNESS_SELECTED_MODEL"],
              "max_tokens": 128,
              "stream": False,
              "messages": [
                  {
                      "role": "user",
                      "content": "Return exactly this marker and nothing else: OMNIROUTE_ANTHROPIC_MESSAGES_OK",
                  }
              ],
          }
          req = urllib.request.Request(
              os.environ["ANTHROPIC_BASE_URL"] + "/v1/messages",
              data=json.dumps(request_body).encode("utf-8"),
              headers={
                  "content-type": "application/json",
                  "anthropic-version": "2023-06-01",
                  "authorization": "Bearer " + os.environ["ANTHROPIC_AUTH_TOKEN"],
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=180) as response:
                  raw = response.read().decode("utf-8", errors="replace")
                  http_status = int(response.status)
              payload = json.loads(raw)
              blocks = payload.get("content") if isinstance(payload, dict) else None
              text_parts = []
              if isinstance(blocks, list):
                  for block in blocks:
                      if isinstance(block, dict) and block.get("type") == "text":
                          value = block.get("text")
                          if isinstance(value, str):
                              text_parts.append(value)
              text = "".join(text_parts).strip()
              passed = 200 <= http_status < 300 and bool(text)
              evidence = {
                  "schema": "OmniRouteAnthropicMessagesProbe/v1",
                  "status": "PASS" if passed else "FAIL",
                  "http_status": http_status,
                  "provider": os.environ["HARNESS_SELECTED_PROVIDER"],
                  "requested_model": os.environ["HARNESS_SELECTED_MODEL"],
                  "reported_model": payload.get("model") if isinstance(payload, dict) else None,
                  "response_type": payload.get("type") if isinstance(payload, dict) else None,
                  "nonempty_text": bool(text),
                  "body_sha256": hashlib.sha256(raw.encode()).hexdigest(),
              }
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode("utf-8", errors="replace")
              try:
                  error_payload = json.loads(raw)
              except json.JSONDecodeError:
                  error_payload = {}
              error = error_payload.get("error") if isinstance(error_payload, dict) else None
              evidence = {
                  "schema": "OmniRouteAnthropicMessagesProbe/v1",
                  "status": "FAIL",
                  "http_status": int(exc.code),
                  "provider": os.environ["HARNESS_SELECTED_PROVIDER"],
                  "requested_model": os.environ["HARNESS_SELECTED_MODEL"],
                  "error_type": error.get("type") if isinstance(error, dict) else None,
                  "error_code": error.get("code") if isinstance(error, dict) else None,
                  "body_sha256": hashlib.sha256(raw.encode()).hexdigest(),
              }
          (root / "gateway-probe.json").write_text(
              json.dumps(evidence, sort_keys=True), encoding="utf-8"
          )
          print("OMNIROUTE_ANTHROPIC_MESSAGES_STATUS=" + evidence["status"])
          print("OMNIROUTE_ANTHROPIC_MESSAGES_HTTP=" + str(evidence.get("http_status")))
          if evidence["status"] != "PASS":
              raise SystemExit("OmniRoute Anthropic Messages probe failed")
          PY

      - name: Execute Claude Code through governed OmniRoute
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-omniroute-config
        run: |
          set -euo pipefail
          test "$HARNESS_SELECTED_PROVIDER" = "opencode"
          test "$HARNESS_SELECTED_MODEL" = "oc/big-pickle"
          test "$ANTHROPIC_MODEL" = "$HARNESS_SELECTED_MODEL"
          test "$ANTHROPIC_BASE_URL" = "http://127.0.0.1:20128"
          case "$ANTHROPIC_BASE_URL" in */v1|*/v1/) exit 4;; esac
          unset ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN
          mkdir -p runtime/claude-omniroute
          BEFORE="$(git status --porcelain)"
          PROMPT='Return exactly this marker and nothing else: CLAUDE_OMNIROUTE_RUNTIME_OK'
          set +e
          timeout 180 claude -p "$PROMPT"             --model "$HARNESS_SELECTED_MODEL"             --output-format json             --max-turns 1             --tools ""             --disallowedTools "mcp__*"             --permission-prompts none             --no-session-persistence             --restricted             --bare             >runtime/claude-omniroute/stdout.json             2>runtime/claude-omniroute/stderr.txt
          RC=$?
          set -e
          AFTER="$(git status --porcelain)"
          test "$BEFORE" = "$AFTER"
          RC="$RC" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path("runtime/claude-omniroute")
          stdout = (root / "stdout.json").read_text(encoding="utf-8", errors="replace")
          stderr = (root / "stderr.txt").read_text(encoding="utf-8", errors="replace")
          rc = int(os.environ["RC"])
          try:
              payload = json.loads(stdout)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"invalid Claude Code JSON output: {exc}")
          result = payload.get("result")
          if rc != 0 or not isinstance(result, str) or not result.strip():
              import re

              def redact(value):
                  text = str(value or "")
                  text = re.sub(
                      r"(?i)(authorization:|bearer\\s+|api[_-]?key|token=)[^\\s,;]*",
                      "[REDACTED]",
                      text,
                  )
                  text = re.sub(
                      r"(?i)(sk-|oma_live_)[A-Za-z0-9._-]{8,}",
                      "[REDACTED]",
                      text,
                  )
                  return text

              safe_lines = [
                  redact(line[:500])
                  for line in stderr.splitlines()
              ][-30:]
              gateway_log_path = Path("/tmp/omniroute-claude.log")
              gateway_log = (
                  gateway_log_path.read_text(encoding="utf-8", errors="replace")
                  if gateway_log_path.exists()
                  else ""
              )
              gateway_error_lines = [
                  redact(line[:500])
                  for line in gateway_log.splitlines()
                  if any(
                      term in line.lower()
                      for term in ("/v1/messages", "error", "failed", "oc/big-pickle")
                  )
              ][-30:]
              failure = {
                  "schema": "ClaudeCodeOmniRouteProof/v1",
                  "status": "FAILED",
                  "authority": "DEEPSEEK_HARNESS",
                  "executor": "claude-code",
                  "claude_code_version": "2.1.283",
                  "gateway": "omniroute",
                  "omniroute_version": "3.8.50",
                  "provider": os.environ["HARNESS_SELECTED_PROVIDER"],
                  "model": os.environ["HARNESS_SELECTED_MODEL"],
                  "base_url": os.environ["ANTHROPIC_BASE_URL"],
                  "auth_class": "LOCAL_LOOPBACK_SENTINEL",
                  "model_discovery": False,
                  "fallback_occurred": False,
                  "tools_exposed": 0,
                  "repository_mutation": False,
                  "claude_return_code": rc,
                  "claude_payload_type": payload.get("type") if isinstance(payload, dict) else None,
                  "claude_payload_subtype": payload.get("subtype") if isinstance(payload, dict) else None,
                  "claude_is_error": payload.get("is_error") if isinstance(payload, dict) else None,
                  "claude_result": redact(payload.get("result") if isinstance(payload, dict) else "")[:2000],
                  "model_usage": payload.get("modelUsage") if isinstance(payload, dict) else None,
                  "stderr_diagnostics": safe_lines,
                  "gateway_log_sha256": hashlib.sha256(gateway_log.encode()).hexdigest(),
                  "gateway_error_lines": gateway_error_lines,
                  "stdout_sha256": hashlib.sha256(stdout.encode()).hexdigest(),
                  "stderr_sha256": hashlib.sha256(stderr.encode()).hexdigest(),
              }
              (root / "result.json").write_text(
                  json.dumps(failure, sort_keys=True), encoding="utf-8"
              )
              print("CLAUDE_CODE_OMNIROUTE_RUNTIME_PROOF=FAIL")
              print("CLAUDE_CODE_FAILURE_RESULT=" + failure["claude_result"][:1000])
              raise SystemExit(f"Claude Code OmniRoute execution failed rc={rc}")
          evidence = {
              "schema": "ClaudeCodeOmniRouteProof/v1",
              "status": "EXECUTED",
              "authority": "DEEPSEEK_HARNESS",
              "executor": "claude-code",
              "claude_code_version": "2.1.283",
              "gateway": "omniroute",
              "omniroute_version": "3.8.50",
              "provider": os.environ["HARNESS_SELECTED_PROVIDER"],
              "model": os.environ["HARNESS_SELECTED_MODEL"],
              "base_url": os.environ["ANTHROPIC_BASE_URL"],
              "auth_class": "LOCAL_LOOPBACK_SENTINEL",
              "model_discovery": False,
              "fallback_occurred": False,
              "tools_exposed": 0,
              "repository_mutation": False,
              "result": result.strip(),
              "stdout_sha256": hashlib.sha256(stdout.encode()).hexdigest(),
              "stderr_sha256": hashlib.sha256(stderr.encode()).hexdigest(),
          }
          (root / "result.json").write_text(json.dumps(evidence, sort_keys=True), encoding="utf-8")
          print("CLAUDE_CODE_OMNIROUTE_RUNTIME_PROOF=PASS")
          print("CLAUDE_CODE_OMNIROUTE_PROVIDER=" + evidence["provider"])
          print("CLAUDE_CODE_OMNIROUTE_MODEL=" + evidence["model"])
          PY

      - name: Upload proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-omniroute-proof
          path: runtime/claude-omniroute/
          retention-days: 7
          if-no-files-found: error

      - name: Shutdown OmniRoute
        if: always()
        run: |
          if [ -f /tmp/omniroute-claude.pid ]; then
            kill "$(cat /tmp/omniroute-claude.pid)" 2>/dev/null || true
          fi
