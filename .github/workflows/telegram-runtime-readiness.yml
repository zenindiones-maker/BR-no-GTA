name: Telegram Runtime Readiness

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/telegram-runtime-readiness.request.json"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Telegram bot group delivery prerequisites
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || {
            echo "EXTERNAL_SECRET_BLOCKER=TELEGRAM_BOT_TOKEN"
            exit 2
          }
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.environ["TELEGRAM_BOT_TOKEN"]
          def call(method):
              req=urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=urllib.parse.urlencode({}).encode(),
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  data=json.load(response)
              if not data.get("ok"):
                  raise SystemExit(f"TELEGRAM_API_{method}=FAIL")
              return data.get("result") or {}
          me=call("getMe")
          webhook=call("getWebhookInfo")
          can_join=bool(me.get("can_join_groups"))
          can_read=bool(me.get("can_read_all_group_messages"))
          webhook_conflict=bool(str(webhook.get("url") or "").strip())
          print("TELEGRAM_GETME=PASS")
          print("TELEGRAM_BOT_CAN_JOIN_GROUPS=" + ("YES" if can_join else "NO"))
          print("TELEGRAM_BOT_CAN_READ_ALL_GROUP_MESSAGES=" + ("YES" if can_read else "NO"))
          print("TELEGRAM_WEBHOOK_CONFLICT=" + ("YES" if webhook_conflict else "NO"))
          print("GROUP_NATURAL_LANGUAGE_DELIVERY_READY=" + ("PASS" if can_join and can_read and not webhook_conflict else "FAIL"))
          if not can_join:
              raise SystemExit("GROUP_BLOCKER=BOT_CANNOT_JOIN_GROUPS")
          if not can_read:
              raise SystemExit("GROUP_BLOCKER=TELEGRAM_PRIVACY_MODE")
          if webhook_conflict:
              raise SystemExit("GROUP_BLOCKER=WEBHOOK_CONFLICTS_WITH_A15_LONG_POLLING")
          PY

      - name: Assert runtime reconciliation contract
        run: |
          set -euo pipefail
          bash -n scripts/telegram_termux_control.sh
          python -m pytest -q tests/test_telegram_a15_runtime_contract.py
          echo "A15_RUNTIME_RECONCILE_CONTRACT=PASS"
