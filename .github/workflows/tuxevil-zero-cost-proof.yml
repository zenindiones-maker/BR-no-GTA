name: Tuxevil Zero-Cost Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "scripts/tuxevil_zero_cost_probe.py"
      - ".github/workflows/tuxevil-zero-cost-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ZERO_COST_OPERATION: "TRUE"
      TUXEVIL_ROTATOR_VERSION: "3.8.0"
      TUXEVIL_ROTATOR_BIND_HOST: "127.0.0.1"
      TUXEVIL_ROTATOR_TELEMETRY: "off"
      TUXEVIL_ROTATOR_ADMIN_TOKEN: "ci-local-proof-only"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record public-runner identity
        run: |
          set -euo pipefail
          mkdir -p artifacts/tuxevil-zero-cost
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "sha=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "zero_cost_operation=$ZERO_COST_OPERATION"
          } > artifacts/tuxevil-zero-cost/runtime.txt

      - name: Install pinned Tuxevil Rotator
        run: |
          set -euo pipefail
          npm view "tuxevil-rotator@$TUXEVIL_ROTATOR_VERSION"             version dist.integrity gitHead --json             > artifacts/tuxevil-zero-cost/npm-metadata.json
          npm install --global "tuxevil-rotator@$TUXEVIL_ROTATOR_VERSION"
          npm list --global --depth=0 tuxevil-rotator             > artifacts/tuxevil-zero-cost/npm-list.txt
          command -v tuxevil-rotator             > artifacts/tuxevil-zero-cost/executable.txt
          tuxevil-rotator --help             > artifacts/tuxevil-zero-cost/help.txt 2>&1

      - name: Start isolated loopback rotator without invented credentials
        id: start
        run: |
          set -euo pipefail
          export TUXEVIL_ROTATOR_DIR="$RUNNER_TEMP/tuxevil-rotator"
          mkdir -p "$TUXEVIL_ROTATOR_DIR"
          nohup tuxevil-rotator start --config-dir "$TUXEVIL_ROTATOR_DIR"             > artifacts/tuxevil-zero-cost/rotator.log 2>&1 &
          echo "$!" > artifacts/tuxevil-zero-cost/rotator.pid
          READY=0
          for i in {1..30}; do
            if ! kill -0 "$(cat artifacts/tuxevil-zero-cost/rotator.pid)" 2>/dev/null; then
              break
            fi
            if curl --connect-timeout 1 --max-time 2 -sS               -H 'Authorization: Bearer tuxevil'               http://127.0.0.1:51200/v1/models               > artifacts/tuxevil-zero-cost/models-readiness.json 2>/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" = "1" ]; then
            echo "TUXEVIL_RUNTIME_BOOTSTRAP=PASS"
          else
            echo "TUXEVIL_RUNTIME_BOOTSTRAP=FAIL"
            cat artifacts/tuxevil-zero-cost/rotator.log || true
          fi

      - name: Run live zero-cost proof
        id: probe
        continue-on-error: true
        env:
          SERVER_READY: ${{ steps.start.outputs.ready }}
        run: |
          set -euo pipefail
          META="artifacts/tuxevil-zero-cost/npm-metadata.json"
          VERSION="$(python -c 'import json;print(json.load(open("'"$META"'")).get("version",""))')"
          INTEGRITY="$(python -c 'import json;print(json.load(open("'"$META"'")).get("dist",{}).get("integrity",""))')"
          GIT_HEAD="$(python -c 'import json;print(json.load(open("'"$META"'")).get("gitHead",""))')"
          EXTRA=()
          if [ "$SERVER_READY" = "1" ]; then EXTRA+=(--server-started); fi
          python scripts/tuxevil_zero_cost_probe.py             --output artifacts/tuxevil-zero-cost/proof.json             --package-version "$VERSION"             --package-integrity "$INTEGRITY"             --package-git-head "$GIT_HEAD"             "${EXTRA[@]}"

      - name: Capture isolated config shape
        if: always()
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tuxevil-rotator"
          python - "$DIR" <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          out=[]
          if root.exists():
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  row={"path":str(path.relative_to(root)),"size":path.stat().st_size}
                  name=path.name.lower()
                  if "account" in name or "config" in name:
                      raw=path.read_bytes()
                      row["sha256"]=hashlib.sha256(raw).hexdigest()
                      try:
                          data=json.loads(raw.decode("utf-8"))
                      except Exception:
                          data=None
                      if isinstance(data,dict):
                          accounts=data.get("accounts")
                          row["account_count"]=len(accounts) if isinstance(accounts,list) else None
                          row["keys"]=sorted(
                              key for key in data.keys()
                              if not any(term in key.lower() for term in ("token","secret","key"))
                          )
                  out.append(row)
          pathlib.Path("artifacts/tuxevil-zero-cost/config-shape.json").write_text(
              json.dumps(out,indent=2,sort_keys=True),
              encoding="utf-8",
          )
          PY

      - name: Shutdown rotator
        if: always()
        run: |
          if [ -f artifacts/tuxevil-zero-cost/rotator.pid ]; then
            kill "$(cat artifacts/tuxevil-zero-cost/rotator.pid)" 2>/dev/null || true
          fi

      - name: Upload Tuxevil evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuxevil-zero-cost-proof
          path: artifacts/tuxevil-zero-cost/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce proof result
        if: steps.probe.outcome != 'success'
        run: |
          echo "TUXEVIL_ZERO_COST_PROOF=FAIL"
          exit 1
