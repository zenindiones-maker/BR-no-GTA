name: Semantic Planner Optimized Inference Profile

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/services/semantic_mission_planner_service.py"
      - "app/services/harness_adaptive_planning_service.py"
      - "app/services/local_openweight_ai_provider.py"
      - "scripts/semantic_planner_optimized_inference_profile.py"
      - "scripts/semantic_planner_single_proposal_proof.py"
      - ".github/workflows/semantic-planner-optimized-profile.yml"

permissions:
  contents: read

concurrency:
  group: semantic-optimized-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      ZERO_COST_OPERATION: "TRUE"
      BR_LOCAL_OPENWEIGHT_ENABLED: "1"
      BR_LOCAL_OPENWEIGHT_URL: "http://127.0.0.1:11434"
      OLLAMA_VERSION: "0.34.2"
      OLLAMA_MODEL: "qwen3:4b-instruct"
      OLLAMA_EXPECTED_DIGEST: "0edcdef34593eac1aa2be9c7d06c432dcf81945adca5eca2f27662c18f168ba0"
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NO_CLOUD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install profiling runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt psutil==7.2.2
      - name: Bootstrap exact proven local provider
        run: |
          set -euo pipefail
          BOOTSTRAP_START_MS="$(date +%s%3N)"
          command -v zstd >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          }
          curl --fail --show-error --location             "https://raw.githubusercontent.com/ollama/ollama/v0.34.2/scripts/install.sh"             -o /tmp/ollama-install.sh
          OLLAMA_VERSION="$OLLAMA_VERSION" OLLAMA_NO_START=1 sh /tmp/ollama-install.sh
          ollama --version | grep -F "$OLLAMA_VERSION"
          if ! curl --connect-timeout 1 --max-time 2 -fsS               http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            nohup env OLLAMA_HOST="$OLLAMA_HOST" OLLAMA_NO_CLOUD="$OLLAMA_NO_CLOUD"               ollama serve >/tmp/ollama-optimized-profile.log 2>&1 &
            echo "$!" >/tmp/ollama-optimized-profile.pid
          fi
          for i in {1..60}; do
            curl --connect-timeout 1 --max-time 2 -fsS               http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags >/dev/null
          MODEL_PULL_START_MS="$(date +%s%3N)"
          timeout 180s ollama pull "$OLLAMA_MODEL"
          MODEL_PULL_END_MS="$(date +%s%3N)"
          echo "MODEL_PULL_MS=$((MODEL_PULL_END_MS-MODEL_PULL_START_MS))" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:11434/api/tags",timeout=5) as r:
              data=json.load(r)
          rows=[item for item in data.get("models",[]) if item.get("name")==os.environ["OLLAMA_MODEL"] or item.get("model")==os.environ["OLLAMA_MODEL"]]
          assert len(rows)==1, rows
          digest=str(rows[0].get("digest") or "").removeprefix("sha256:")
          assert digest==os.environ["OLLAMA_EXPECTED_DIGEST"], digest
          print("OPTIMIZED_PROFILE_BOOTSTRAP=PASS")
          print("OPTIMIZED_PROFILE_MODEL_DIGEST=PASS")
          PY
          BOOTSTRAP_END_MS="$(date +%s%3N)"
          echo "LOCAL_PROVIDER_BOOTSTRAP_MS=$((BOOTSTRAP_END_MS-BOOTSTRAP_START_MS))" >> "$GITHUB_ENV"
      - name: Profile optimized semantic inference
        id: profile
        run: |
          set -euo pipefail
          mkdir -p artifacts/semantic-optimized-profile
          sudo iptables-save >/tmp/optimized-iptables-before.rules
          if command -v ip6tables-save >/dev/null; then
            sudo ip6tables-save >/tmp/optimized-ip6tables-before.rules
          fi
          restore_network() {
            sudo iptables-restore </tmp/optimized-iptables-before.rules || true
            if [ -f /tmp/optimized-ip6tables-before.rules ]; then
              sudo ip6tables-restore </tmp/optimized-ip6tables-before.rules || true
            fi
          }
          trap restore_network EXIT
          sudo iptables -I OUTPUT 1 -o lo -j ACCEPT
          sudo iptables -I OUTPUT 2 -j REJECT
          if command -v ip6tables >/dev/null; then
            sudo ip6tables -I OUTPUT 1 -o lo -j ACCEPT
            sudo ip6tables -I OUTPUT 2 -j REJECT
          fi
          python scripts/semantic_planner_optimized_inference_profile.py             --output artifacts/semantic-optimized-profile/optimized-profile.json
      - name: Shutdown runtime
        if: always()
        run: |
          if [ -f /tmp/ollama-optimized-profile.pid ]; then
            kill "$(cat /tmp/ollama-optimized-profile.pid)" 2>/dev/null || true
          fi
      - name: Upload optimized profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-planner-optimized-profile
          path: artifacts/semantic-optimized-profile/optimized-profile.json
          if-no-files-found: error
          retention-days: 30

      - name: Assert diagnostic role and bounded behavior
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/semantic-optimized-profile/optimized-profile.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["LOCAL_PROVIDER_ROLE"] == "diagnostic_profile", d
          assert d["CRITICAL_PATH_PREREQUISITE"] is False, d
          assert d["fallback_eligibility"] is False, d
          assert d["SERIAL_BUDGET_SEARCH_ATTEMPTS"] == 1, d
          assert len(d["semantic_attempts"]) in {1, 2}, d
          assert d["PROFILE_DIAGNOSTIC_CAPTURED"] is True, d
          if d["LOCAL_PROVIDER_PROFILE_RESULT"] == "FAIL":
              assert d.get("failure_class"), d
          print("LOCAL_PROVIDER_ROLE=diagnostic_profile")
          print("LOCAL_PROVIDER_DIAGNOSTIC_GATE=PASS")
          print("SERIAL_TOKEN_BUDGET_SEARCH=NO")
          print("LOCAL_PROVIDER_PROFILE_RESULT="+str(d["LOCAL_PROVIDER_PROFILE_RESULT"]))
          PY
