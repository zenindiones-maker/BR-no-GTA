name: Persistent Intelligence Force DD1 Validation

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/services/persistent_intelligence_contracts.py"
      - "app/services/persistent_intelligence_force_service.py"
      - "app/services/global_capability_registry.py"
      - "app/database/persistent_intelligence_repository.py"
      - "app/database/schema.py"
      - "scripts/persistent_intelligence_force_dd1_proof.py"
      - "tests/test_persistent_intelligence_force_dd1.py"
      - ".github/workflows/persistent-intelligence-force-dd1-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistent-intelligence-force-dd1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/persistent-force-dd1/control.db

jobs:
  validate-dd1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r requirements.txt pytest
          mkdir -p artifacts/persistent-force-dd1

      - name: Compile DD1 boundaries
        run: |
          set -euo pipefail
          python -m py_compile \
            app/services/persistent_intelligence_contracts.py \
            app/services/persistent_intelligence_force_service.py \
            app/services/global_capability_registry.py \
            app/database/persistent_intelligence_repository.py \
            app/database/schema.py \
            scripts/persistent_intelligence_force_dd1_proof.py

      - name: Run DD1 focused and authority regression
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_persistent_intelligence_force_dd1.py \
            tests/test_harness_authorization_service.py \
            tests/test_delegated_agent_autonomy.py \
            tests/test_harness_durable_execution_v3.py \
            tests/test_global_capability_registry.py \
            --junitxml=artifacts/persistent-force-dd1/pytest.xml

      - name: Run DD1 operational proof
        run: |
          set -euo pipefail
          python -m scripts.persistent_intelligence_force_dd1_proof \
            --database "$BR_TEST_DATABASE" \
            --output artifacts/persistent-force-dd1/proof.json

      - name: Validate machine-readable DD1 proof
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          result=json.loads(Path("artifacts/persistent-force-dd1/proof.json").read_text(encoding="utf-8"))
          assert result["schema"]=="PersistentIntelligenceForceDD1Proof/v1"
          assert result["status"]=="PASS", result
          required={
              "PERSISTENT_RESPONSIBILITY",
              "PERSISTENT_RESPONSIBILITY_NOT_CONTROL_PLANE",
              "PERSISTENT_AGENT_IDENTITY",
              "SESSION_ROTATION_PRESERVES_RESPONSIBILITY_IDENTITY",
              "EVENT_DRIVEN_WAKE",
              "STATE_MACHINE_BOUNDED",
              "BOUNDED_TIME_BUDGET",
              "TIME_BUDGET_ENFORCED",
              "COST_BUDGET_ENFORCED",
              "RETRY_BUDGET_ENFORCED",
              "BUDGET_EXHAUSTED_TYPED",
              "PROACTIVE_BACKGROUND_READ_ONLY",
              "NO_INFINITE_AGENT_LOOP",
              "OWNER_PAUSE_RESUME",
              "DURABLE_RESTART",
              "ACTIVITY_FEED",
              "ACTIVITY_FEED_IS_PROJECTION_ONLY",
              "CUSTOM_RULES",
              "CUSTOM_RULE_CANNOT_EXPAND_AUTHORITY",
              "SIDE_EFFECT_REQUIRES_FRESH_AUTHORIZATION",
              "DUPLICATE_WAKE_IDEMPOTENT",
              "DUPLICATE_OPPORTUNITY_IDEMPOTENT",
              "HARNESS_SOLE_AUTHORITY",
          }
          assert required.issubset(result["gates"])
          assert all(result["gates"][name]=="PASS" for name in required)
          print("PERSISTENT_FORCE_DD1=PASS")
          PY

      - name: Upload DD1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-intelligence-force-dd1-${{ github.run_id }}
          path: artifacts/persistent-force-dd1/
          if-no-files-found: error
          retention-days: 30
