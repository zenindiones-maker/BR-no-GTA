name: BR Harness Sensory and Coherent Owner Voice V12
on:
  push:
    branches:
      - work/br-harness-sensory-owner-v12
    paths:
      - "app/services/br_harness_sensory_pixel_v12.py"
      - "app/services/br_harness_sensory_authorization_v12.py"
      - "app/services/global_capability_registry.py"
      - "scripts/owner_voice_single_human_clone.py"
      - "tests/test_owner_voice_single_clone_workflow_v1.py"
      - "tests/test_owner_voice_serial_generation_v11.py"
      - "tests/test_voice_lexicon_consistency_v11b.py"
      - "tests/test_br_harness_sensory_pixel_v12.py"
      - ".github/workflows/br-harness-sensory-owner-v12.yml"
      - "docs/architecture/br-harness-sensory-owner-v12.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: br-v12-sensory-owner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    name: Verify owner Qwen conditioning and Harness authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install bounded test prerequisites (no Qwen weights)
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check \
            pytest==8.4.2 python-dotenv==1.2.3 numpy==2.2.6 packaging==25.0 pillow==11.3.0
          echo "BR_TEST_DATABASE=$RUNNER_TEMP/br-v12-observation.db" >> "$GITHUB_ENV"
      - name: Initialize persisted Harness authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.database.schema import initialize_schema
          initialize_schema()
          PY
      - name: Run owner policy, semantic-denial and pixel measurements
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_br_harness_sensory_pixel_v12.py \
            tests/test_voice_lexicon_consistency_v11b.py \
            tests/test_owner_voice_serial_generation_v11.py \
            tests/test_owner_voice_single_clone_workflow_v1.py \
            tests/test_owner_voice_speaker_identity_service.py \
            tests/test_pronunciation_service.py
          echo "BR_V12_OWNER_PROMPT_COHERENCE_TESTS=PASS"
          echo "BR_V12_HARNESS_SCOPED_REAL_PIXELS=PASS"
          echo "BR_V12_OWNER_CLONE_IDENTITY_APPROVED=FALSE"
          echo "BR_V12_AUTOMATIC_PRODUCTION_PROMOTION=FALSE"
  actual-video:
    name: Extract real video frame pixels in ephemeral CI
    runs-on: ubuntu-24.04
    needs: contracts
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install original video/Pillow tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install -q --disable-pip-version-check pytest==8.4.2 pillow==11.3.0 python-dotenv==1.2.3
      - name: Decode real changing frames rather than inspect a catalog
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_br_harness_sensory_pixel_v12.py -k real_video
          echo "BR_V12_VIDEO_FRAME_FFMPEG_OBSERVATION=PASS"
          echo "BR_V12_SEMANTIC_EYES_REQUIRE_SEPARATE_PROVIDER_PROOF=TRUE"
