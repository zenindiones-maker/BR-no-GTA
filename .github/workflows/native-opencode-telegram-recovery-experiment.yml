name: Native OpenCode Telegram Recovery Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-opencode:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'run native opencode candidate')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install official OpenCode CLI
        run: |
          set -euo pipefail
          npm install --global @opencode/cli
          mkdir -p runtime/native-opencode-experiment
          opencode --version | tee runtime/native-opencode-experiment/version.txt

      - name: Observe available OpenCode models
        run: |
          set -euo pipefail
          set +e
          opencode models --standalone > runtime/native-opencode-experiment/models.txt 2> runtime/native-opencode-experiment/models.stderr
          rc=$?
          set -e
          RC="$rc" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path("runtime/native-opencode-experiment")
          stdout=(root/"models.txt").read_text(errors="replace")
          stderr=(root/"models.stderr").read_text(errors="replace")
          rows=[line.strip() for line in stdout.splitlines() if line.strip()]
          models=[
              line for line in rows
              if "/" in line
              and not line.startswith(("http://","https://"))
              and " " not in line
              and not line.startswith("--")
          ]
          evidence={
              "exit_code": int(os.environ["RC"]),
              "stdout_sha256": hashlib.sha256(stdout.encode()).hexdigest(),
              "stderr_sha256": hashlib.sha256(stderr.encode()).hexdigest(),
              "models": sorted(set(models)),
          }
          (root/"model-catalog.json").write_text(json.dumps(evidence,sort_keys=True))
          print(json.dumps({"exit_code":evidence["exit_code"],"model_count":len(evidence["models"])},sort_keys=True))
          PY

      - name: Execute explicit native OpenCode candidates
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, time

          root=pathlib.Path("runtime/native-opencode-experiment")
          catalog=json.loads((root/"model-catalog.json").read_text())
          available=catalog.get("models") or []
          suffixes=[
              "big-pickle",
              "mimo-v2.5-free",
              "ling-3.0-flash-fin-free",
              "nemotron-3.5-lightning-free",
          ]
          prompt="Return only: BR_NO_GTA_NATIVE_OPENCODE_OK"
          observations=[]
          for suffix in suffixes:
              matches=[item for item in available if item == suffix or item.endswith("/"+suffix)]
              item={
                  "observed":True,
                  "executor":"official-opencode-cli",
                  "model_suffix":suffix,
                  "fallback_occurred":False,
                  "retry_count":0,
              }
              if len(matches) != 1:
                  item.update(
                      outcome="UNAVAILABLE",
                      selected_model=None,
                      exit_code=None,
                      usable_text=False,
                      error_code="model_identity_missing_or_ambiguous",
                      matching_models=matches,
                      elapsed_seconds=0.0,
                  )
                  observations.append(item)
                  print(json.dumps(item,sort_keys=True))
                  continue
              model=matches[0]
              started=time.monotonic()
              process=subprocess.run(
                  [
                      "opencode","run","--standalone","--format","json",
                      "--model",model,prompt,
                  ],
                  capture_output=True,
                  text=True,
                  timeout=240,
              )
              elapsed=time.monotonic()-started
              stdout=process.stdout
              stderr=process.stderr
              usable=process.returncode == 0 and bool(stdout.strip())
              item.update(
                  selected_model=model,
                  outcome="COMPLETED" if usable else "FAILED",
                  exit_code=process.returncode,
                  usable_text=usable,
                  elapsed_seconds=elapsed,
                  stdout_sha256=hashlib.sha256(stdout.encode()).hexdigest(),
                  stderr_sha256=hashlib.sha256(stderr.encode()).hexdigest(),
                  stdout_chars=len(stdout),
                  stderr_chars=len(stderr),
                  error_code=None if usable else "native_opencode_execution_failed",
              )
              observations.append(item)
              print(json.dumps(item,sort_keys=True))
          evidence={
              "schema":"telegram-provider-recovery/native-opencode-v1",
              "observed":True,
              "capability":"ai.reasoning.text",
              "task_class":"telegram-reasoning",
              "baseline":{
                  "executor":"omniroute-3.8.50",
                  "model":"oc/big-pickle",
                  "run_id":35343464974,
                  "outcome":"FAILED",
                  "http_status":403,
                  "provider_error_code":"insufficient_quota",
                  "provider_error_message":"OpenCode free tier restricted to OpenCode runtime",
              },
              "candidate_executor":"official-opencode-cli",
              "prompt_sha256":hashlib.sha256(prompt.encode()).hexdigest(),
              "observations":observations,
              "promotion_performed":False,
              "fallback_occurred":False,
          }
          (root/"observations.json").write_text(json.dumps(evidence,sort_keys=True))
          PY

      - name: Validate observed evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("runtime/native-opencode-experiment/observations.json").read_text())
          assert data["observed"] is True
          assert data["promotion_performed"] is False
          assert data["fallback_occurred"] is False
          assert len(data["observations"]) == 4
          assert all(row["observed"] is True for row in data["observations"])
          assert all(row["fallback_occurred"] is False for row in data["observations"])
          print("NATIVE_OPENCODE_OBSERVED_EXPERIMENT=PASS")
          print("SUCCESSFUL_CANDIDATES="+str(sum(row["outcome"]=="COMPLETED" for row in data["observations"])))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: native-opencode-telegram-recovery-experiment
          path: runtime/native-opencode-experiment/
          retention-days: 14
          if-no-files-found: error
