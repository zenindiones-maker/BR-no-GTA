name: RUN-001 Canary Isolation Validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Canary specialized
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZERO_COST_OPERATION: "TRUE"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore canonical test environment
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-py312-br-no-gta-venv-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies on cache miss
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pytest

      - name: Focused fail-closed tests
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_production_execution_goal_targeting.py \
            tests/test_harness_authorization_service.py \
            tests/test_gate6e_production_media_registry.py \
            tests/test_render_worker_service.py

      - name: Zero-cost and Job18 guards
        run: |
          .venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          assert os.environ["ZERO_COST_OPERATION"] == "TRUE"
          changed = Path("app/services/production_execution_service.py").read_text()
          assert "claim_render_job(18" not in changed
          assert "transition_render_job(18" not in changed
          assert "update_render_job_status(18" not in changed
          assert "zero_cost_operation=True" in changed
          print("ZERO_COST_GUARD=PASS")
          print("JOB18_GUARD=PASS")
          PY
