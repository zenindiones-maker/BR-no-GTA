name: Owner Voice Two Video Acoustic Offline Contract
on:
  push:
    branches: [work/br-owner-voice-coherent-qa-recovery-v1]
    paths:
      - 'scripts/owner_voice_two_video_acoustic_probe.py'
      - 'tests/test_owner_voice_two_video_acoustic_probe.py'
      - '.github/workflows/owner-voice-two-video-acoustic-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Syntax and offline tests only (no private media)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          python3 -m pip install --disable-pip-version-check -q 'numpy==2.2.6'
          python3 -m py_compile scripts/owner_voice_two_video_acoustic_probe.py
          python3 -m unittest discover -s tests -p 'test_owner_voice_two_video_acoustic_probe.py' -v
          echo 'PRIVATE_MEDIA_ACCESSED=NO'
          echo 'VOCABULARY_EXTRACTED=NOT_CLAIMED'
          echo 'REMOTE_CODESPACE_EXECUTION=REQUIRED'
