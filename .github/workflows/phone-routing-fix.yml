name: Phone Routing Provider Separation Fix

on:
  push:
    branches: [work/gate6f-analytics-learning]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply generic provider separation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/harness_routing_policy_service.py')
          text = path.read_text()
          old = '''    capability = capability_candidates[0]\n    provider, primary_provider, fallback_candidates, fallback_occurred, provider_rejections = (\n        _select_provider(request, registry)\n    )\n    rejected.extend(provider_rejections)\n'''
          new = '''    capability = capability_candidates[0]\n\n    # A provider_id attached to an executable capability identifies the provider\n    # of that concrete implementation. It is not, by itself, a request for an\n    # ai.provider.* model provider. When the caller's preferred provider is the\n    # capability's own bound provider, the Registry executor is sufficient and\n    # AI provider/model selection must not be manufactured. Explicit AI-backed\n    # capabilities (which do not own that preferred provider identity) continue\n    # through _select_provider unchanged.\n    capability_provider = (\n        normalize_provider_id(capability.provider_id)\n        if capability.provider_id\n        else None\n    )\n    preferred_provider_ids = tuple(\n        normalize_provider_id(item) for item in request.preferred_providers\n    )\n    implementation_provider_satisfies_request = bool(\n        request.provider_required\n        and capability.capability_type in {"EXECUTOR", "CAPABILITY"}\n        and capability_provider\n        and preferred_provider_ids\n        and capability_provider in preferred_provider_ids\n    )\n\n    if implementation_provider_satisfies_request:\n        provider = None\n        primary_provider = None\n        fallback_candidates = ()\n        fallback_occurred = False\n        provider_rejections = []\n    else:\n        provider, primary_provider, fallback_candidates, fallback_occurred, provider_rejections = (\n            _select_provider(request, registry)\n        )\n    rejected.extend(provider_rejections)\n'''
          assert old in text, 'routing selection anchor changed'
          text = text.replace(old, new, 1)
          old_meta = '''        "provider_domain": request.provider_domain if request.provider_required else None,\n'''
          new_meta = '''        "provider_domain": (\n            request.provider_domain\n            if request.provider_required and not implementation_provider_satisfies_request\n            else None\n        ),\n        "capability_provider_id": capability.provider_id,\n        "implementation_provider_satisfies_request": implementation_provider_satisfies_request,\n'''
          assert old_meta in text, 'policy metadata anchor changed'
          path.write_text(text.replace(old_meta, new_meta, 1))

          test_path = Path('tests/test_phone_routing_provider_separation.py')
          test_path.write_text('''from dataclasses import replace\n\nimport pytest\n\nfrom app.services.global_capability_registry import GLOBAL_CAPABILITY_REGISTRY\nfrom app.services.harness_routing_policy_service import (\n    HarnessRoutingRequest, RoutingPolicyError, route_harness_request,\n)\n\n\ndef _phone_request(**changes):\n    request = HarnessRoutingRequest(\n        intent="control local Android phone",\n        authorized_action="EXECUTION",\n        domain="device/mobile-control",\n        required_capability_id="phone.control",\n        provider_required=True,\n        preferred_providers=("mobilerun-local",),\n        fallback_allowed=False,\n    )\n    return replace(request, **changes)\n\n\ndef test_phone_registry_executor_does_not_require_ai_provider():\n    decision = route_harness_request(_phone_request())\n    record = GLOBAL_CAPABILITY_REGISTRY.get("phone.control")\n    assert record is not None\n    assert decision.selected_capability_id == "phone.control"\n    assert decision.selected_provider is None\n    assert decision.selected_model is None\n    assert decision.primary_provider is None\n    assert decision.selected_provider_executor_binding is None\n    assert decision.selected_executor_binding == record.executor_binding\n    assert decision.policy_metadata["domain"] == "device/mobile-control"\n    assert decision.policy_metadata["capability_provider_id"] == "mobilerun-local"\n    assert decision.policy_metadata["implementation_provider_satisfies_request"] is True\n    assert record.cost_class == "FREE_NO_BILLING"\n    rendered = repr(decision.to_dict()).lower()\n    for forbidden in ("nvidia-nim", "nvidia_nim", "tuxevil", "gemini"):\n        assert forbidden not in rendered\n\n\ndef test_ai_provider_requirement_still_uses_provider_policy(monkeypatch):\n    import app.services.harness_routing_policy_service as policy\n    called = {"value": False}\n    original = policy._select_provider\n    def tracked(request, registry):\n        called["value"] = True\n        return original(request, registry)\n    monkeypatch.setattr(policy, "_select_provider", tracked)\n    request = HarnessRoutingRequest(\n        intent="AI reasoning", authorized_action="DECISION",\n        required_capability_id="ai.reasoning.text", provider_required=True,\n        provider_domain="ai", fallback_allowed=False,\n    )\n    try:\n        route_harness_request(request)\n    except RoutingPolicyError:\n        pass\n    assert called["value"] is True\n\n\ndef test_phone_provider_mismatch_remains_fail_closed():\n    with pytest.raises(RoutingPolicyError):\n        route_harness_request(_phone_request(preferred_providers=("gemini",)))\n\n\ndef test_phone_capability_does_not_self_authorize():\n    decision = route_harness_request(_phone_request())\n    assert not hasattr(decision, "authorization_id")\n    assert decision.authorized_action == "EXECUTION"\n''')
          PY
      - name: Setup test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pytest
      - name: Compile
        run: .venv/bin/python -m compileall -q app tests
      - name: Focused tests
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_phone_routing_provider_separation.py \
            tests/test_harness_routing_policy_service.py \
            tests/test_phone_control_service.py \
            tests/test_harness_authorization_service.py
      - name: Full suite
        run: .venv/bin/python -m pytest -q tests/
      - name: Frozen boundary and zero-cost guards
        run: |
          test "$(git diff --name-only | grep -ci 'job18' || true)" -eq 0
          grep -q 'ZERO_COST_OPERATION' app/services/zero_cost_policy_service.py
      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/services/harness_routing_policy_service.py tests/test_phone_routing_provider_separation.py
          git diff --cached --check
          git commit -m 'fix(harness): separate capability provider from AI provider routing'
          git push origin HEAD:work/gate6f-analytics-learning
