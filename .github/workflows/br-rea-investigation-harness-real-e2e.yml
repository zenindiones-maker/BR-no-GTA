name: BR REA investigation Harness real E2E

on:
  push:
    branches:
      - work/br-rea-investigation-harness-gate-v1
    paths:
      - app/services/br_rea_investigation_executor.py
      - app/services/br_rea_issuer_attestation_service.py
      - app/services/global_capability_registry.py
      - app/services/harness_capability_service.py
      - app/services/harness_mcp_capability_execution.py
      - app/integrations/deepseek_harness/server.py
      - app/database/harness_authorization_repository.py
      - scripts/br_rea_investigation_harness_e2e.py
      - scripts/br_system_static_surface_audit.py
      - scripts/br_rea_investigation_acceptance.sh
      - app/services/owner_voice_dubbing_reference_policy.py
      - tests/test_owner_voice_dubbing_reference_policy.py
      - tests/test_br_system_static_surface_audit.py
      - tests/test_br_rea_investigation_executor.py
      - tests/test_br_rea_public_mcp_denial.py
      - .github/workflows/br-rea-investigation-harness-real-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-rea-investigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-research-sensor:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout BR-no-GTA (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install exact first-party declared BR Python runtime dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt pytest==8.4.2
      - name: Verify source compiles
        run: |
          python3 -m py_compile app/services/br_rea_investigation_executor.py \
            app/services/br_rea_issuer_attestation_service.py \
            app/services/harness_capability_service.py \
            app/services/harness_mcp_capability_execution.py \
            app/integrations/deepseek_harness/server.py \
            scripts/br_rea_investigation_harness_e2e.py \
            tests/test_br_rea_investigation_executor.py \
            app/services/owner_voice_dubbing_reference_policy.py \
            tests/test_owner_voice_dubbing_reference_policy.py
      - name: Run real adversarial SQLite and filesystem tests
        run: python3 -m unittest discover -s tests -p test_br_rea_investigation_executor.py -v
      - name: Verify public MCP cannot self-issue REA authorization
        run: python3 -m unittest discover -s tests -p test_br_rea_public_mcp_denial.py -v
      - name: Execute Owner Voice reference policy regressions
        run: python3 -m pytest -q tests/test_owner_voice_dubbing_reference_policy.py
      - name: Validate real and adversarial whole-source inventory
        run: python3 -m unittest discover -s tests -p test_br_system_static_surface_audit.py -v
      - name: Inventory tracked BR repository and workflow hazards
        run: python3 scripts/br_system_static_surface_audit.py
      - name: Execute routed Harness E2E on actual repository code
        run: python3 scripts/br_rea_investigation_harness_e2e.py
      - name: Verify one-command acceptance on authorized runner
        run: bash scripts/br_rea_investigation_acceptance.sh
