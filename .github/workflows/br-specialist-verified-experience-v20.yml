name: BR V20 Specialist Verified Experience and Recovery
on:
  push:
    branches:
      - work/br-specialist-evidence-learning-v20
    paths:
      - "app/services/br_specialist_verified_experience_v20.py"
      - "tests/test_br_specialist_verified_experience_v20.py"
      - "scripts/br_specialist_experience_benchmark_v20.py"
      - ".github/workflows/br-specialist-verified-experience-v20.yml"
      - "docs/architecture/br-specialist-evidence-learning-v20.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v20-specialist-measured-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controlled-specialist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install actual FFmpeg and repository-pinned dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install -q --disable-pip-version-check \
            -r requirements.txt pytest==8.4.2 python-dotenv==1.2.3 pillow==12.3.0
          echo "BR_TEST_DATABASE=$RUNNER_TEMP/br-v20-specialist-actual.db" >> "$GITHUB_ENV"
          echo "BR_V20_DOWNLOAD_NEW_MODEL=FALSE"
          echo "BR_V20_PRIVATE_TELEGRAM_DATA=NOT_ACCESSED"
      - name: Check original V17 V18 V19 and adversarial V20 contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.database.schema import initialize_schema
          initialize_schema()
          PY
          python -m pytest -q \
            tests/test_br_specialist_verified_experience_v20.py \
            tests/test_br_specialist_policy_router_v19.py \
            tests/test_br_specialist_intelligence_v17.py \
            tests/test_br_owner_delivery_reconcile_v18.py
          echo "BR_V20_LEAST_PRIVILEGE_REGRESSION=PASS"
      - name: Re-run real 60-route and 20-Harness-FFmpeg evidence cases
        run: |
          set -euo pipefail
          python scripts/br_specialist_experience_benchmark_v20.py \
            --root "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/br-v20-experience-private.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          out=json.loads((root/"br-v20-experience-private.json").read_text())
          assert out["router_correct"]==out["router_trials"]==60
          assert out["av_correct"]==out["av_trials"]==20
          assert out["status"]=="CONTROLLED_BASELINE_VERIFIED"
          assert out["repeated_all_pass"] is True
          assert out["private_voice_access"] is False
          assert out["telegram_send"] is False
          assert out["professional_slm_verified"] is False
          assert out["production_promotion"]=="NOT_ATTEMPTED"
          canonical=hashlib.sha256(json.dumps(
              {k:v for k,v in out.items() if k!="receipt_sha256"},
              sort_keys=True,separators=(",",":"),ensure_ascii=False,allow_nan=False,
          ).encode()).hexdigest()
          assert canonical==out["receipt_sha256"]
          assert out["measured_total_wall_seconds"]>0
          assert (root/"br-v20-routing-source-private.json").is_file()
          assert (root/"br-v20-visual-source-private.json").is_file()
          print("BR_V20_TRUE_END_STATE_VERIFICATION=PASS")
          print("BR_V20_REPEATED_ROUTING_AND_AV=80/80")
          print("BR_V20_UNAUTHORIZED_EXPANSION=FALSE")
          print("BR_V20_PROFESSIONAL_SLM=NOT_VERIFIED")
          PY
