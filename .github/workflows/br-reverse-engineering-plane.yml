name: BR Reverse Engineering Evidence Gate
on:
  push:
    branches:
      - work/br-extreme-reverse-engineering-v1
      - work/br-reverse-engineering-evidence-v3
      - work/br-reverse-engineering-experiment-intelligence-v4
      - work/br-reconstruction-fidelity-v5
      - work/br-multimodal-production-research-v6
    paths:
      - "app/services/reverse_engineering_media_service.py"
      - "app/services/reverse_engineering_forensics_service.py"
      - "app/services/reverse_engineering_scene_v3_service.py"
      - "app/services/reverse_engineering_audio_v3_service.py"
      - "app/services/reverse_engineering_web_har_service.py"
      - "app/services/reverse_engineering_longform_coverage_service.py"
      - "app/services/reverse_engineering_experiment_intelligence_v4.py"
      - "app/services/reverse_engineering_fidelity_v5_service.py"
      - "app/services/reverse_engineering_studio_v6_service.py"
      - "scripts/br_studio_forensics_v6.py"
      - "tests/test_reverse_engineering_studio_v6.py"
      - "app/services/reverse_engineering_fidelity_trial_bridge_v5.py"
      - "docs/architecture/br-reconstruction-fidelity-laboratory-v5.md"
      - "tests/test_reverse_engineering_fidelity_trial_bridge_v5.py"
      - "tests/test_reverse_engineering_fidelity_v5.py"
      - "tests/test_reverse_engineering_fidelity_harness_v5.py"
      - "docs/architecture/br-reverse-engineering-experiment-intelligence-v4.md"
      - "AGENTS.md"
      - "tests/test_reverse_engineering_experiment_intelligence_v4.py"
      - "tests/test_reverse_engineering_experiment_harness_v4.py"
      - "tests/test_reverse_engineering_longform_coverage.py"
      - "tests/test_reverse_engineering_web_har_v3.py"
      - "tests/test_reverse_engineering_multimodal_v3.py"
      - "app/services/reverse_engineering_story_service.py"
      - "app/services/reverse_engineering_learning_proposal_service.py"
      - "tests/test_reverse_engineering_learning_proposal_v1.py"
      - "tests/test_reverse_engineering_story_v1.py"
      - "app/services/reverse_engineering_harness_service.py"
      - "app/services/global_capability_registry.py"
      - "scripts/br_reverse_engineering_harness.py"
      - "tests/test_reverse_engineering_harness_v2.py"
      - "tests/test_reverse_engineering_media_service.py"
      - "scripts/br_reverse_engineering_observe.py"
      - "integrations/rea_install_and_doctor.sh"
      - "integrations/rea"
      - ".gitmodules"
      - ".github/workflows/br-reverse-engineering-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-reverse-engineering-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Measured media and REA CLI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prove deterministic observation contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest "python-dotenv==1.2.3" "scenedetect==0.7.1" "opencv-python-headless==4.12.0.88" "opentimelineio==0.18.1"
          python -m pytest -q tests/test_reverse_engineering_media_service.py tests/test_reverse_engineering_harness_v2.py tests/test_reverse_engineering_story_v1.py tests/test_reverse_engineering_learning_proposal_v1.py tests/test_reverse_engineering_multimodal_v3.py tests/test_reverse_engineering_web_har_v3.py tests/test_reverse_engineering_longform_coverage.py tests/test_reverse_engineering_experiment_intelligence_v4.py tests/test_reverse_engineering_experiment_harness_v4.py tests/test_reverse_engineering_fidelity_v5.py tests/test_reverse_engineering_fidelity_harness_v5.py tests/test_reverse_engineering_fidelity_trial_bridge_v5.py tests/test_reverse_engineering_studio_v6.py tests/test_global_capability_registry.py
      - name: Install required FFmpeg observation runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Measure a genuinely generated media sample
        run: |
          set -euo pipefail
          ffmpeg -nostdin -hide_banner -v error \
            -f lavfi -i "color=c=black:s=128x72:r=10" \
            -f lavfi -i "sine=frequency=440:sample_rate=16000" \
            -t 2 -c:v mpeg4 -c:a aac -shortest \
            "$RUNNER_TEMP/owned-sample.mp4"
          printf '1\n00:00:00,000 --> 00:00:01,000\nTeste de dublagem\n' > "$RUNNER_TEMP/owned.srt"
          python scripts/br_reverse_engineering_observe.py \
            --input "$RUNNER_TEMP/owned-sample.mp4" --rights owned \
            --transcript "$RUNNER_TEMP/owned.srt" \
            --output "$RUNNER_TEMP/br-observation.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"br-observation.json").read_text())
          assert data["schema_version"]=="BRReverseEngineeringObservation/v1"
          assert data["evidence"]["container_and_streams"]["status"]=="MEASURED"
          assert len(data["source"]["sha256"])==64
          assert data["evidence"]["script_timing"]["cue_count"]==1
          assert data["reconstruction"]["human_quality_approval_required"] is True
          print("BR_REVERSE_ENGINEERING_E2E=PASS")
          PY
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.11.0"
      - name: Install isolated pinned REA CLI (no Hopper, MCP registration or secrets)
        run: |
          set -euo pipefail
          PREFIX="$RUNNER_TEMP/rea-install"
          BR_REA_INSTALL_PREFIX="$PREFIX" bash integrations/rea_install_and_doctor.sh --install
          test -s "$PREFIX/rea-capabilities.json"
          "$PREFIX/node_modules/.bin/rea" --version
          echo "BR_REA_PINNED_CLI_SMOKE=PASS"
      - name: Prove actual Harness authorization and real FFmpeg/REA evidence
        env:
          BR_REA_INSTALL_PREFIX: ${{ runner.temp }}/rea-install
          BR_TEST_DATABASE: ${{ runner.temp }}/reverse-harness-ci.db
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/authorized/owned-jsapp"
          printf '{"name":"owned-jsapp","type":"module","version":"1.0.0"}\n' > "$RUNNER_TEMP/authorized/owned-jsapp/package.json"
          printf 'export function reverseEvidence(value){return value * 2;}\n' > "$RUNNER_TEMP/authorized/owned-jsapp/index.js"
          cp "$RUNNER_TEMP/owned-sample.mp4" "$RUNNER_TEMP/authorized/owned-sample.mp4"
          printf '{"log":{"version":"1.2","entries":[{"request":{"method":"GET","url":"https://example.test/assets/secret?token=private"},"response":{"status":200,"content":{"mimeType":"text/javascript","text":"private"}},"time":35.5}]}}\n' > "$RUNNER_TEMP/authorized/owned-observation.har"
          ffmpeg -nostdin -hide_banner -v error -i "$RUNNER_TEMP/authorized/owned-sample.mp4" -af "volume=0.5" -c:v copy "$RUNNER_TEMP/authorized/owned-candidate.mp4"
          python - <<'PY'
          import os
          from app.database.schema import initialize_schema
          from app.services.harness_authorization_service import issue_harness_authorization
          from app.services.reverse_engineering_harness_service import MEDIA_CAPABILITY_ID, REA_CAPABILITY_ID, WEB_HAR_CAPABILITY_ID, FIDELITY_CAPABILITY_ID
          initialize_schema()
          for label,cid in (("MEDIA",MEDIA_CAPABILITY_ID),("REA",REA_CAPABILITY_ID),("HAR",WEB_HAR_CAPABILITY_ID),("FIDELITY",FIDELITY_CAPABILITY_ID)):
              a=issue_harness_authorization(
                  authorized_action="RESEARCH", subject=f"capability:{cid}",
                  lineage={"allowed_media_roots":[os.path.join(os.environ["RUNNER_TEMP"],"authorized")]},
              )
              with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
                  f.write(f"BR_{label}_HARNESS_AUTH_ID={a.authorization_id}\n")
          PY
      - name: Exercise real Harness-governed media and software observation
        env:
          BR_REA_INSTALL_PREFIX: ${{ runner.temp }}/rea-install
          BR_TEST_DATABASE: ${{ runner.temp }}/reverse-harness-ci.db
        run: |
          set -euo pipefail
          python scripts/br_reverse_engineering_harness.py \
            --authorization-id "$BR_MEDIA_HARNESS_AUTH_ID" \
            --mode media --input "$RUNNER_TEMP/authorized/owned-sample.mp4" \
            --rights owned --audio-dynamics --adaptive-shot-window 2.0 --goal "Create an independent voice and video mastering experiment" \
            --candidate "$RUNNER_TEMP/authorized/owned-candidate.mp4" --candidate-rights owned \
            --output "$RUNNER_TEMP/harness-media.json"
          python scripts/br_reverse_engineering_harness.py \
            --authorization-id "$BR_REA_HARNESS_AUTH_ID" \
            --mode rea-js --input "$RUNNER_TEMP/authorized/owned-jsapp" \
            --rights owned --output "$RUNNER_TEMP/harness-rea.json"
          python scripts/br_reverse_engineering_harness.py \
            --authorization-id "$BR_HAR_HARNESS_AUTH_ID" \
            --mode web-har --input "$RUNNER_TEMP/authorized/owned-observation.har" \
            --rights owned --output "$RUNNER_TEMP/harness-har.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])
          a=json.loads((base/"harness-media.json").read_text())["result"]
          b=json.loads((base/"harness-rea.json").read_text())["result"]
          w=json.loads((base/"harness-har.json").read_text())["result"]
          assert a["status"]=="MEASURED"
          assert a["evidence"]["audio"]["loudness"]["status"]=="MEASURED"
          assert a["evidence"]["video"]["status"]=="MEASURED"
          assert a["evidence"]["audio"]["dynamics"]["status"]=="MEASURED"
          assert a["evidence"]["video"]["adaptive_shots"]["status"]=="MEASURED"
          assert a["evidence"]["video"]["adaptive_shots"]["full_duration_covered"] is True
          assert a["evidence"]["interpretation"]["speaker_identity_verified"] is False
          assert a["learning_proposal"]["gate"]["quality_approved"] is False
          assert a["learning_proposal"]["differential"]["quality_pass"] is None
          assert a["learning_proposal"]["publication"]=="FORBIDDEN"
          assert b["status"]=="MEASURED"
          assert b["evidence"]["rea_version"]=="6.0.0"
          assert w["evidence"]["request_count"]==1
          assert w["evidence"]["network_access"]=="NONE"
          assert "example.test" not in json.dumps(w)
          assert a["approval"]==b["approval"]=="NOT_REQUESTED"
          assert a["production_mutation"] is b["production_mutation"] is False
          print("BR_EXTREME_REVERSE_ENGINEERING_HARNESS_E2E=PASS")
          PY
      - name: Verify independently-detected real cuts on original synthetic video
        run: |
          set -euo pipefail
          ffmpeg -nostdin -hide_banner -v error \
            -f lavfi -i 'color=c=red:s=160x90:r=12:d=2' \
            -f lavfi -i 'color=c=blue:s=160x90:r=12:d=2' \
            -f lavfi -i 'color=c=green:s=160x90:r=12:d=2' \
            -filter_complex '[0:v][1:v][2:v]concat=n=3:v=1:a=0,format=yuv420p[v]' \
            -map '[v]' -c:v mpeg4 "$RUNNER_TEMP/owned-shot-test.mp4"
          python - <<'PY'
          import os
          from app.services.reverse_engineering_scene_v3_service import analyze_shots
          sample=os.path.join(os.environ["RUNNER_TEMP"],"owned-shot-test.mp4")
          receipt=analyze_shots(sample,window_seconds=6.0,algorithm="adaptive")
          print("DETECTED_CUTS",receipt["cut_candidates_seconds"])
          assert receipt["full_duration_covered"] is True
          assert receipt["cut_count"] >= 2, receipt
          assert any(abs(t-2.0)<0.3 for t in receipt["cut_candidates_seconds"])
          assert any(abs(t-4.0)<0.3 for t in receipt["cut_candidates_seconds"])
          from app.services.reverse_engineering_longform_coverage_service import merge_shot_receipts
          first=analyze_shots(sample,window_seconds=3.25,algorithm="adaptive")
          second=analyze_shots(sample,start_seconds=2.5,window_seconds=3.5,algorithm="adaptive")
          merged=merge_shot_receipts([first,second])
          assert merged["full_duration_covered_by_receipts"] is True
          assert merged["coverage_percent"]==100
          assert merged["quality_approved"] is False
          print("BR_LONGFORM_SHOT_COVERAGE_REAL_VIDEO=PASS")
          print("BR_ADAPTIVE_SHOT_REAL_VIDEO=PASS")
          PY

      - name: Verify V4 Harness evaluator on genuinely measured paired FFmpeg audio
        env:
          BR_TEST_DATABASE: ${{ runner.temp }}/reverse-harness-ci.db
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from app.services.reverse_engineering_experiment_intelligence_v4 import _hash
          from app.services.harness_authorization_service import issue_harness_authorization
          from app.services.harness_capability_adapter import CapabilityAdapter
          from app.services.harness_collaboration_service import TaskEnvelope
          from app.services.harness_routing_policy_service import HarnessRoutingRequest, route_harness_request
          from app.services.reverse_engineering_harness_service import EXPERIMENT_CAPABILITY_ID
          from app.services.reverse_engineering_media_service import _sha256

          base=Path(os.environ["RUNNER_TEMP"])
          earlier=json.loads((base/"harness-media.json").read_text())["result"]
          real_ref=earlier["evidence"]
          learning=earlier["learning_proposal"]
          baseline=real_ref["audio"]["loudness"]["metrics"]["input_i"]["value"]
          delta=learning["differential"]["metric_deltas_candidate_minus_reference"]["input_i"]
          candidate=round(baseline+delta,3)
          baseline_artifact=real_ref["source"]["sha256"]
          candidate_artifact=_sha256(base/"authorized"/"owned-candidate.mp4")
          assert candidate_artifact != baseline_artifact
          dataset={
              "schema_version":"BRTechniqueExperimentDataset/v1",
              "dataset_id":"ci-original-audio-one-pair-only",
              "domain":"audio", "task_class":"mix-master",
              "rubric":{
                  "metric":"integrated_lufs", "direction":"target",
                  "target":-30.0, "tolerance":0.1,
                  "measurement_method":"FFmpeg_loudnorm_input_analysis_ITU_BS1770_EBU_R128",
                  "zero_cost":True,
              },
              "cases":[{"case_id":"real-ci-001","split":"development",
                        "reference_sha256":baseline_artifact}],
          }
          dataset["dataset_sha256"]=_hash(dataset)
          observation={
              "technique_id":"owned-volume-change", "case_id":"real-ci-001",
              "baseline_metric":baseline, "candidate_metric":candidate,
              "baseline_artifact_sha256":baseline_artifact,
              "candidate_artifact_sha256":candidate_artifact,
              "baseline_evidence_sha256":real_ref["evidence_sha256"],
              "candidate_evidence_sha256":learning["candidate_evidence_sha256"],
              "measurement_method":"FFmpeg_loudnorm_input_analysis_ITU_BS1770_EBU_R128",
              "execution_status":"MEASURED", "cost_usd":0.0,
              "critical_regression":False,
          }
          observation["observation_sha256"]=_hash(observation)
          auth=issue_harness_authorization(
              authorized_action="RESEARCH",
              subject=f"capability:{EXPERIMENT_CAPABILITY_ID}",
              lineage={
                  "experiment_dataset_sha256":dataset["dataset_sha256"],
                  "experiment_domain":"audio",
                  "experiment_task_class":"mix-master",
                  "allowed_technique_ids":["owned-volume-change"],
              },
          )
          route=route_harness_request(HarnessRoutingRequest(
              intent="Evaluate original audio technique using real measured evidence",
              authorized_action="RESEARCH",
              domain="experiment-intelligence",
              required_capability_id=EXPERIMENT_CAPABILITY_ID,
              fallback_allowed=False,provider_required=False,learning_required=False,
          ))
          result=CapabilityAdapter().execute(
              authorization=auth,
              task_envelope=TaskEnvelope(
                  task_id="ci-real-v4-one-pair",capability_id=EXPERIMENT_CAPABILITY_ID,
                  action="RESEARCH",objective="Evaluate a genuine FFmpeg pair without promotion",
              ),
              routing_decision=route,
              payload={
                  "dataset":dataset,"observations":[observation],
                  "allowed_technique_ids":["owned-volume-change"],
              },
          ).result
          assert result["status"]=="ASSESSED_NOT_LEARNED"
          assert result["evidence"]["results"][0]["status"]=="INSUFFICIENT_EVIDENCE"
          assert result["evidence"]["recommended_for_independent_review"]==[]
          assert result["memory_write"]=="NOT_ATTEMPTED"
          assert result["next_benchmark_proposal"]["routing_changed"] is False
          assert result["production_mutation"] is False
          print("BR_V4_REAL_FFMPEG_HARNESS_ASSESSMENT=PASS")
          print("BR_V4_EVIDENCE_STILL_INSUFFICIENT=PASS")
          PY
      - name: Prove reconstruction fidelity on actual FFmpeg originals and derived versions
        env:
          BR_TEST_DATABASE: ${{ runner.temp }}/reverse-harness-ci.db
        run: |
          set -euo pipefail
          python scripts/br_reverse_engineering_harness.py \
            --authorization-id "$BR_FIDELITY_HARNESS_AUTH_ID" \
            --mode fidelity --input "$RUNNER_TEMP/authorized/owned-sample.mp4" \
            --rights owned --candidate "$RUNNER_TEMP/authorized/owned-candidate.mp4" \
            --candidate-rights owned --window-seconds 1.0 \
            --output "$RUNNER_TEMP/fidelity-edited.json"
          cp "$RUNNER_TEMP/authorized/owned-sample.mp4" "$RUNNER_TEMP/authorized/owned-copy.mp4"
          python scripts/br_reverse_engineering_harness.py \
            --authorization-id "$BR_FIDELITY_HARNESS_AUTH_ID" \
            --mode fidelity --input "$RUNNER_TEMP/authorized/owned-sample.mp4" \
            --rights owned --candidate "$RUNNER_TEMP/authorized/owned-copy.mp4" \
            --candidate-rights owned --window-seconds 1.0 \
            --output "$RUNNER_TEMP/fidelity-exact.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])
          changed=json.loads((base/"fidelity-edited.json").read_text())["result"]["evidence"]
          same=json.loads((base/"fidelity-exact.json").read_text())["result"]["evidence"]
          assert same["video"]["status"]=="MEASURED",same
          assert same["video"]["mean_frame_ssim"]==1.0,same
          assert same["video"]["lossless_pixel_match"] is True,same
          assert same["audio"]["waveform_bit_equivalent_after_decode"] is True,same
          assert changed["video"]["lossless_pixel_match"] is True,changed
          assert changed["audio"]["waveform_bit_equivalent_after_decode"] is False,changed
          assert changed["audio"]["unadjusted_difference_rmse_linear"] > 0.01,changed
          assert changed["audio"]["normalized_correlation"] > 0.99,changed
          assert 0.40 < changed["audio"]["candidate_to_reference_rms_ratio"] < 0.60,changed
          assert changed["quality_approved"] is False
          assert changed["identity_verified"] is False
          assert changed["publication_authorized"] is False
          assert changed["harness_learning_write"]=="NOT_ATTEMPTED"
          print("BR_V5_REAL_RECONSTRUCTION_FIDELITY=PASS")
          print("BR_V5_CORRELATION_CANNOT_HIDE_GAIN_DIFFERENCE=PASS")
          PY
      - name: Prove a real measured reconstruction experiment remains non-promotable
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from app.services.reverse_engineering_fidelity_trial_bridge_v5 import build_paired_fidelity_trial
          from app.services.reverse_engineering_experiment_intelligence_v4 import _hash, assess_technique_experiments
          root=Path(os.environ["RUNNER_TEMP"])
          original=json.loads((root/"fidelity-edited.json").read_text())["result"]["evidence"]
          improved=json.loads((root/"fidelity-exact.json").read_text())["result"]["evidence"]
          result=build_paired_fidelity_trial(
              baseline_receipt=original, candidate_receipt=improved,
              technique_id="owned-audio-gain-reconstruction", case_id="real-case-1",
              metric="audio_difference_rmse_linear",
              safety_review_evidence_sha256="a"*64,
              declared_cost_usd=0.0,
          )
          assert result["baseline_metric"] > result["candidate_metric"]
          assert result["candidate_metric"] == 0.0
          dataset={
              "schema_version":"BRTechniqueExperimentDataset/v1",
              "dataset_id":"real-ffmpeg-fidelity-bridge-v5",
              "domain":"audio","task_class":"mix-master",
              "rubric":{"metric":"audio_difference_rmse_linear","direction":"lower",
                        "target":None,"tolerance":0.001,
                        "measurement_method":result["measurement_method"],"zero_cost":True},
              "cases":[{"case_id":"real-case-1","split":"development",
                        "reference_sha256":result["baseline_artifact_sha256"]}],
          }
          dataset["dataset_sha256"]=_hash(dataset)
          a=assess_technique_experiments(
              dataset=dataset,observations=[result],
              allowed_technique_ids=["owned-audio-gain-reconstruction"],
          )
          assert a["results"][0]["status"]=="INSUFFICIENT_EVIDENCE"
          assert a["recommended_for_independent_review"]==[]
          assert a["production_promotion"]=="FORBIDDEN"
          assert a["memory_write"]=="NOT_ATTEMPTED"
          print("BR_V5_FIDELITY_TO_LEARNING_BRIDGE=PASS")
          print("BR_V5_ZERO_FALSE_PROMOTION=PASS")
          PY
