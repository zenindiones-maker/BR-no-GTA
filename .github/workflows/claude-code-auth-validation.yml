name: Claude Code Gateway Boundary

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".github/workflows/claude-code-auth-validation.yml"
      - ".github/workflows/claude-code-omniroute-proof.yml"
      - "scripts/agent-tooling/bootstrap.sh"
      - "scripts/agent-tooling/claude_omniroute_contract.py"
      - "scripts/agent-tooling/claude_omniroute_replan.py"
      - "tests/test_claude_omniroute_contract.py"
      - "tests/test_claude_omniroute_replan.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prove Claude OmniRoute contract
        run: |
          set -euo pipefail
          python3 -m unittest -q tests.test_claude_omniroute_contract
          python3 -m unittest -q tests.test_claude_omniroute_replan

      - name: Install pinned Claude Code
        run: bash scripts/agent-tooling/bootstrap.sh claude

      - name: Validate pinned CLI without credentials or model call
        run: |
          set -euo pipefail
          claude --version | grep '^2\.1\.283'
          claude --help >/dev/null
          python3 scripts/agent-tooling/claude_omniroute_contract.py             --provider opencode             --model oc/big-pickle             --zero-cost-proof
          echo "CLAUDE_CODE_GATEWAY_BOUNDARY=PASS"
