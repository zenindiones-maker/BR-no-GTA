name: BR OWNER Contextual PTBR Critical-name Regression
on:
  push:
    branches:
      - work/br-owner-ptbr-contextual-audition-20261010-v1
    paths:
      - .github/workflows/br-owner-ptbr-contextual-regression.yml
      - tests/test_owner_voice_critical_audio_dictionary_execution.py
      - app/services/gta6_owner_audio_dictionary_service.py
      - tests/test_gta6_owner_audio_dictionary.py
      - scripts/owner_voice_single_human_clone.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-owner-contracts-no-private-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install minimal regression dependencies
        run: python -m pip install --disable-pip-version-check -q pytest==8.4.2 python-dotenv==1.2.3
      - name: Verify source policy without reading private audio
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_owner_voice_critical_audio_dictionary_execution.py \
            tests/test_gta6_owner_audio_dictionary.py \
            tests/test_owner_voice_prompt_consistency_service.py \
            tests/test_owner_voice_critical_audio_telegram_delivery.py \
            tests/test_owner_voice_single_clone_workflow_v1.py
          echo 'OWNER_CONTEXTUAL_PTBR_CONTRACT=PASS'
          echo 'REAL_TTS_INFERENCE=NOT_ATTEMPTED'
          echo 'TELEGRAM_SIDE_EFFECT=NOT_ATTEMPTED'
