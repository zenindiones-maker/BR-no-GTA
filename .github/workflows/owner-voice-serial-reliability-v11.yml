name: BR Owner Voice Serial Generation V11 (Contract Proof)
on:
  push:
    branches:
      - work/br-owner-voice-serial-audition-v11
    paths:
      - "app/services/owner_voice_serial_generation_v11.py"
      - "scripts/owner_voice_single_human_clone.py"
      - "tests/test_owner_voice_serial_generation_v11.py"
      - "tests/test_owner_voice_single_clone_workflow_v1.py"
      - ".github/workflows/owner-voice-serial-reliability-v11.yml"
      - "docs/architecture/br-owner-voice-and-production-gates-v11.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-owner-v11-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owner-voice-segmented-contract:
    name: Verify owner-only model interface and private checkpoints
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install minimal pinned test dependencies only
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q \
            pytest==8.4.2 packaging==25.0 python-dotenv==1.2.3 numpy==2.2.6
      - name: Prove segment isolation and prior clone policies
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_owner_voice_serial_generation_v11.py \
            tests/test_owner_voice_single_clone_workflow_v1.py \
            tests/test_owner_voice_clone_service.py \
            tests/test_owner_voice_speaker_identity_service.py \
            tests/test_pronunciation_service.py
          echo "BR_OWNER_V11_SERIAL_GENERATION_CONTRACT=PASS"
      - name: Prove private biometric media cannot be checked into Git
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(owner|reference|clone|private-qwen-segment)[^/]*\.(wav|flac|mp3|ogg)$'; then
            echo "BR_OWNER_V11_RAW_BIOMETRIC_ASSETS_EXPOSED=FAIL"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          source=Path("scripts/owner_voice_single_human_clone.py").read_text()
          assert "QWEN_GENERATION_HEARTBEAT_SECONDS=30" in source
          assert 'QWEN_MODEL_ID="Qwen/Qwen3-TTS-12Hz-1.7B-Base"' in source
          assert 'VOICE_IDENTITY_ID="BR_OWNER_V1"' in source
          assert "build_gta6_pronunciation_batches(SHORT_TEXT)" in source
          assert "generate_one_private_audition(" in source
          assert "GTA6_PRONUNCIATION_SEGMENT_COUNT=" in source
          assert "SINGLE_CLONE" in source
          from app.services.gta6_pronunciation_lexicon_service import build_gta6_pronunciation_segments
          assert build_gta6_pronunciation_segments("Vice City")[0]["spoken_text"]=="vaicy siti"
          print("BR_OWNER_V11_VOICE_SINGLE_IDENTITY_AND_VAICY_SITI=PASS")
          print("BR_OWNER_V11_TELEGRAM_DELIVERY_ATTEMPTED=FALSE")
          print("BR_OWNER_V11_ACTUAL_QWEN_INFERENCE_ATTEMPTED=FALSE")
          print("BR_OWNER_V11_CANONICAL_PROMOTION_ATTEMPTED=FALSE")
          PY
