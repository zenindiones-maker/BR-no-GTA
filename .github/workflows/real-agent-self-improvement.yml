name: Real Agent Self Improvement Mission

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "scripts/real_agent_self_improvement_mission.py"
      - "scripts/zero_cost_route_inventory.py"
      - "scripts/task02_deterministic_team.py"
      - "scripts/task02_real_multiagent_chain.py"
      - "tests/test_task02_deterministic_team.py"
      - "tests/test_zero_cost_route_inventory.py"
      - "tests/test_harness_residual_replanning_service.py"
      - "tests/test_real_agent_self_improvement_residual_replan.py"
      - "scripts/dynamic_system_improvement_mission.py"
      - "app/services/execution_mission_envelope_service.py"
      - "app/services/harness_adaptive_planning_service.py"
      - "app/services/harness_executor_availability_service.py"
      - "app/services/harness_collaboration_service.py"
      - "app/services/addy_harness_service.py"
      - "app/services/agent_session_service.py"
      - "app/services/artifact_import_service.py"
      - "app/services/artifact_evidence_reuse_service.py"
      - "app/services/github_actions_run_tracker.py"
      - "app/services/harness_routing_policy_service.py"
      - "app/services/hermes_multiagent/capability_broker.py"
      - "app/services/task_input_contract_service.py"
      - "app/services/harness_internal_recovery_service.py"
      - "app/services/provider_failure_domain_service.py"
      - "app/services/provider_availability_reconciliation_service.py"
      - "scripts/provider_availability_reconciliation.py"
      - "app/services/recovery_execution_service.py"
      - "app/services/semantic_tool_loop_service.py"
      - "app/services/local_openweight_ai_provider.py"
      - "app/services/task_output_contract_service.py"
      - "app/services/global_capability_registry.py"
      - "tests/test_addy_harness_service.py"
      - "tests/test_agent_session_service.py"
      - "tests/test_artifact_import_service.py"
      - "tests/test_artifact_evidence_reuse_service.py"
      - "tests/test_github_actions_run_tracker.py"
      - "tests/test_harness_routing_policy_service.py"
      - "tests/test_semantic_agent_tool_loop.py"
      - "tests/test_task_input_contract_service.py"
      - "tests/test_harness_internal_recovery_service.py"
      - "tests/test_provider_failure_domain_service.py"
      - "tests/test_provider_availability_reconciliation_service.py"
      - "tests/test_provider_availability_reconciliation_wake.py"
      - "tests/test_provider_availability_boundaries.py"
      - "tests/test_recovery_execution_service.py"
      - "tests/test_harness_executor_availability_service.py"
      - "tests/test_harness_collaboration_service.py"
      - "tests/test_real_agent_self_improvement_residual_replan.py"
      - ".github/workflows/real-agent-self-improvement.yml"
      - ".run/real-agent-self-improvement.request.json"
  workflow_dispatch:
    inputs:
      operation:
        description: Mission execution or provider availability reconciliation
        required: false
        default: "MISSION"
        type: choice
        options:
          - MISSION
          - PROVIDER_RECONCILIATION
      wait_run_id:
        description: Optional exact self-improvement run containing the active durable provider wait
        required: false
        default: ""
        type: string
      health_event_run_id:
        description: Optional provider-health proof run containing fresh evidence
        required: false
        default: ""
        type: string
      health_event_artifact_name:
        description: Optional exact provider-health artifact name
        required: false
        default: ""
        type: string
      resume_from_run_id:
        description: Exact prior self-improvement run containing the durable wait checkpoint
        required: false
        default: ""
        type: string
      resume_from_artifact_name:
        description: Exact prior self-improvement artifact name
        required: false
        default: ""
        type: string
      provider_reconciliation_run_id:
        description: Reconciliation run authorizing provider availability requeue
        required: false
        default: ""
        type: string
      provider_reconciliation_artifact_name:
        description: Exact reconciliation artifact name
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: real-agent-self-improvement-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_CODEX_FEDERATION_CONFIGURED: "false"
  BR_NEW_CODEX_DEVICE_AUTH: "DENIED"
  BR_TEST_DATABASE: ${{ github.workspace }}/runtime/real-agent-self-improvement/learning.sqlite3
  BR_PERFORMANCE_TRACE_FILE: ${{ github.workspace }}/runtime/real-agent-self-improvement/performance-trace.jsonl
  BR_PERFORMANCE_TRACE_ID: real-agent-self-improvement:${{ github.run_id }}:${{ github.run_attempt }}

jobs:
  mission:
    if: inputs.operation != 'PROVIDER_RECONCILIATION'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            config/delegation-plane-preflight-extra-requirements.txt

      - name: Install bounded runtime
        run: |
          set -euo pipefail
          started="$(date +%s%N)"
          mkdir -p runtime/real-agent-self-improvement
          python -m pip install --upgrade pip >/dev/null
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt pytest >/dev/null
          python -m pip install --disable-pip-version-check --no-input -r config/delegation-plane-preflight-extra-requirements.txt >/dev/null
          python -m pip check >/dev/null
          finished="$(date +%s%N)"
          python - "$started" "$finished" <<'PY' >> "$GITHUB_ENV"
          import sys
          started=int(sys.argv[1]); finished=int(sys.argv[2])
          print(f"BASE_WORKFLOW_BOOTSTRAP_MS={max(0, finished-started)/1_000_000:.3f}")
          PY

      - name: Focused real-execution contracts
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_task_result_envelope_service.py             tests/test_system_synergy_service.py             tests/test_harness_learning_system.py             tests/test_dynamic_system_improvement_scope.py             tests/test_execution_mission_envelope_service.py             tests/test_production_mission_execution_contracts.py             tests/test_harness_executor_availability_service.py             tests/test_harness_collaboration_service.py             tests/test_addy_harness_service.py             tests/test_agent_session_service.py             tests/test_artifact_import_service.py             tests/test_artifact_evidence_reuse_service.py             tests/test_github_actions_run_tracker.py             tests/test_harness_routing_policy_service.py             tests/test_semantic_agent_tool_loop.py             tests/test_task_input_contract_service.py             tests/test_harness_internal_recovery_service.py             tests/test_provider_failure_domain_service.py             tests/test_provider_availability_reconciliation_service.py             tests/test_provider_availability_reconciliation_wake.py             tests/test_provider_availability_boundaries.py             tests/test_recovery_execution_service.py             tests/test_zero_cost_route_inventory.py
          python -m py_compile scripts/real_agent_self_improvement_mission.py scripts/provider_availability_reconciliation.py app/services/provider_availability_reconciliation_service.py
          echo "REAL_SELF_IMPROVEMENT_FOCUSED_CONTRACTS=PASS"

      - name: Restore exact real production incident evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_FROM_RUN_ID: ${{ inputs.resume_from_run_id || '' }}
          RESUME_FROM_ARTIFACT_NAME: ${{ inputs.resume_from_artifact_name || '' }}
          PROVIDER_RECONCILIATION_RUN_ID: ${{ inputs.provider_reconciliation_run_id || '' }}
          PROVIDER_RECONCILIATION_ARTIFACT_NAME: ${{ inputs.provider_reconciliation_artifact_name || '' }}
        run: |
          set -euo pipefail
          read -r SOURCE_RUN SOURCE_ARTIFACT <<EOF
          $(python - <<'PY'
          import json
          d=json.load(open(".run/real-agent-self-improvement.request.json"))
          i=d["incident"]
          print(i["source_run_id"], i["source_artifact_name"])
          PY
          )
          EOF
          root="runtime/real-agent-self-improvement/incident-source"
          mkdir -p "$root"
          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir "$root"
          test -n "$(find "$root" -type f -print -quit)"
          echo "INCIDENT_SOURCE_RUN=$SOURCE_RUN"
          echo "INCIDENT_SOURCE_ARTIFACT=$SOURCE_ARTIFACT"
          echo "REAL_INCIDENT_EVIDENCE_RESTORED=PASS"

          read -r RESIDUAL_RUN RESIDUAL_ARTIFACT RESIDUAL_PATH <<EOF
          $(python - <<'PY'
          import json
          d=json.load(open(".run/real-agent-self-improvement.request.json"))
          s=d.get("residual_evidence_source") or {}
          print(s.get("run_id") or "",s.get("artifact_name") or "",s.get("artifact_path") or "")
          PY
          )
          EOF
          if [ -n "$RESIDUAL_RUN" ]; then
            stage="$RUNNER_TEMP/residual-evidence-source"
            rm -rf "$stage"; mkdir -p "$stage"
            gh run download "$RESIDUAL_RUN" --repo "$GITHUB_REPOSITORY" --name "$RESIDUAL_ARTIFACT" --dir "$stage"
            mkdir -p runtime/real-agent-self-improvement/residual-input
            cp "$stage/$RESIDUAL_PATH" runtime/real-agent-self-improvement/residual-input/incident-evidence-pack.json
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path("runtime/real-agent-self-improvement/residual-input/incident-evidence-pack.json")
          d=json.loads(p.read_text())
          assert d.get("schema")=="IncidentEvidencePack/v1"
          assert d.get("sha256")
          print("RESIDUAL_TYPED_EVIDENCE_RESTORED=PASS")
          PY
          fi

          read -r CHECKPOINT_RUN CHECKPOINT_ARTIFACT <<EOF
          $(python - <<'PY'
          import json, os
          d=json.load(open(".run/real-agent-self-improvement.request.json"))
          c=d.get("checkpoint_source") or {}
          resume_run=str(os.getenv("RESUME_FROM_RUN_ID") or "").strip()
          resume_artifact=str(
              os.getenv("RESUME_FROM_ARTIFACT_NAME") or ""
          ).strip()
          if resume_run and not resume_artifact:
              resume_artifact=f"real-agent-self-improvement-{resume_run}"
          print(
              resume_run or c.get("run_id") or "",
              resume_artifact or c.get("artifact_name") or "",
          )
          PY
          )
          EOF
          if [ -n "$CHECKPOINT_RUN" ] && [ -n "$CHECKPOINT_ARTIFACT" ]; then
            checkpoint_root="runtime/real-agent-self-improvement/checkpoint-source"
            checkpoint_stage="runtime/real-agent-self-improvement/checkpoint-stage"
            rm -rf "$checkpoint_root" "$checkpoint_stage"
            mkdir -p "$checkpoint_root" "$checkpoint_stage"
            gh run download "$CHECKPOINT_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$CHECKPOINT_ARTIFACT" \
              --dir "$checkpoint_stage"
            test -n "$(find "$checkpoint_stage" -type f -print -quit)"

            # The previous artifact contains its own historical checkpoint-source
            # inputs. They are lineage evidence, not the next operational
            # checkpoint. Materialize only files produced by that run itself.
            python - <<'PY'
          from pathlib import Path
          import shutil

          stage=Path("runtime/real-agent-self-improvement/checkpoint-stage")
          target=Path("runtime/real-agent-self-improvement/checkpoint-source")
          copied=0
          for src in sorted(stage.rglob("*")):
              if not src.is_file():
                  continue
              rel=src.relative_to(stage)
              if rel.parts and rel.parts[0] in {
                  "checkpoint-source",
                  "checkpoint-stage",
                  "incident-source",
              }:
                  continue
              dst=target/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              copied+=1
          if copied==0:
              raise RuntimeError("canonical checkpoint snapshot is empty")
          nested=[
              p for p in target.rglob("*")
              if p.is_dir() and p.name in {"checkpoint-source","checkpoint-stage"}
          ]
          if nested:
              raise RuntimeError(
                  "recursive checkpoint packaging survived normalization: "
                  +repr([str(p) for p in nested])
              )
          print("CHECKPOINT_RECURSIVE_PACKAGING_ELIMINATED=PASS")
          print("CHECKPOINT_LINEAGE_PRESERVED=PASS")
          print("CHECKPOINT_NESTING_DEPTH_BOUNDED=PASS")
          PY
            rm -rf "$checkpoint_stage"
            echo "NODE_CHECKPOINT_SOURCE_RUN=$CHECKPOINT_RUN"
            echo "NODE_CHECKPOINT_SOURCE_ARTIFACT=$CHECKPOINT_ARTIFACT"
            echo "NODE_CHECKPOINT_SOURCE_RESTORED=PASS"
          fi

          if [ -n "$PROVIDER_RECONCILIATION_RUN_ID" ]; then
            reconciliation_root="runtime/real-agent-self-improvement/provider-reconciliation-source"
            rm -rf "$reconciliation_root"
            mkdir -p "$reconciliation_root"
            reconciliation_artifact="$PROVIDER_RECONCILIATION_ARTIFACT_NAME"
            if [ -z "$reconciliation_artifact" ]; then
              reconciliation_artifact="provider-availability-reconciliation-$PROVIDER_RECONCILIATION_RUN_ID"
            fi
            gh run download "$PROVIDER_RECONCILIATION_RUN_ID"               --repo "$GITHUB_REPOSITORY"               --name "$reconciliation_artifact"               --dir "$reconciliation_root"
            python - <<'PY'
          import json
          from pathlib import Path
          root=Path("runtime/real-agent-self-improvement/provider-reconciliation-source")
          result=root/"provider-availability-reconciliation-result.json"
          if not result.is_file():
              matches=list(root.rglob("provider-availability-reconciliation-result.json"))
              if len(matches)!=1:
                  raise RuntimeError(
                      "PROVIDER_RECONCILIATION_RESULT_COUNT="
                      +str(len(matches))
                  )
              result=matches[0]
          data=json.loads(result.read_text())
          assert data["schema"]=="ProviderAvailabilityReconciliationResult/v1"
          assert data["decision"]=="REQUEUE_TASK"
          assert int(data["new_effective_count"])>0
          print("PROVIDER_RECONCILIATION_REQUEUE_AUTHORIZED=PASS")
          print("SAME_MISSION_ID_AFTER_PROVIDER_WAIT=PASS")
          PY
            reconciliation_db="$(find "$reconciliation_root" -type f -name 'reconciliation-learning.db' -print -quit)"
            if [ -n "$reconciliation_db" ]; then
              cp "$reconciliation_db" "$BR_TEST_DATABASE"
              echo "PROVIDER_HEALTH_EVIDENCE_RESTORED=PASS"
            fi
          fi

      - name: Detect governed provider-level recovery need
        id: provider_recovery
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          from app.services.provider_health_service import (
              semantic_provider_health,
          )
          from app.services.provider_availability_reconciliation_service import (
              resolve_requeue_checkpoint_identity,
          )

          request=json.load(open(".run/real-agent-self-improvement.request.json"))
          checkpoint=request.get("checkpoint_source") or {}
          reconciliation_result=None
          reconciliation_root=Path(
              "runtime/real-agent-self-improvement/"
              "provider-reconciliation-source"
          )
          if reconciliation_root.is_dir():
              canonical_result=(
                  reconciliation_root
                  / "provider-availability-reconciliation-result.json"
              )
              if canonical_result.is_file():
                  result_path=canonical_result
                  print(
                      "PROVIDER_RECONCILIATION_CANONICAL_RESULT="
                      "ROOT_DIRECT"
                  )
              else:
                  result_paths=list(
                      reconciliation_root.rglob(
                          "provider-availability-reconciliation-result.json"
                      )
                  )
                  if len(result_paths)!=1:
                      raise RuntimeError(
                          "PROVIDER_RECONCILIATION_RESULT_COUNT="
                          +str(len(result_paths))
                      )
                  result_path=result_paths[0]
                  print(
                      "PROVIDER_RECONCILIATION_CANONICAL_RESULT="
                      "UNIQUE_FALLBACK"
                  )
              reconciliation_result=json.loads(
                  result_path.read_text(encoding="utf-8")
              )
          identity=resolve_requeue_checkpoint_identity(
              request_checkpoint=checkpoint,
              reconciliation_result=reconciliation_result,
          )
          agent_instance_id=identity["agent_instance_id"]
          root=Path("runtime/real-agent-self-improvement/checkpoint-source")
          # Artifact packaging may add one or more directory prefixes. Resolve
          # the canonical AgentSession by identity, never by a fixed extraction
          # prefix. Fail closed on missing or ambiguous identity matches.
          sessions=sorted(
              path for path in root.rglob("*.json")
              if path.parent.name=="agent-sessions"
          )
          matches=[]
          expected_task_id=identity["task_id"]
          expected_mission_id=identity["mission_id"]
          print("CHECKPOINT_IDENTITY_SOURCE="+identity["source"])
          for path in sessions:
              try:
                  data=json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if data.get("schema")!="AgentSession/v1":
                  continue
              if str(data.get("AGENT_INSTANCE_ID") or "")!=agent_instance_id:
                  continue
              session_task_id=str(
                  data.get("TASK_ID")
                  or data.get("task_id")
                  or ""
              )
              if expected_task_id and session_task_id and session_task_id!=expected_task_id:
                  continue
              session_mission_id=str(
                  data.get("MISSION_ID")
                  or data.get("mission_id")
                  or ""
              )
              if (
                  expected_mission_id
                  and session_mission_id
                  and session_mission_id!=expected_mission_id
              ):
                  continue
              matches.append((path,data))

          print("CHECKPOINT_CANONICAL_SNAPSHOT_COUNT="+str(len(matches)))
          if len(matches)!=1:
              raise RuntimeError(
                  "checkpoint AgentSession resolution must yield exactly one "
                  f"identity match; agent_instance_id={agent_instance_id!r} "
                  f"task_id={expected_task_id!r} matches="
                  f"{[str(path) for path,_ in matches]!r}"
              )
          selected_path,selected=matches[0]
          resolved_agent_id=str(selected.get("AGENT_INSTANCE_ID") or "")
          resolved_task_id=str(
              selected.get("TASK_ID")
              or selected.get("task_id")
              or expected_task_id
          )
          resolved_mission_id=str(
              selected.get("MISSION_ID")
              or selected.get("mission_id")
              or ""
          )
          if resolved_agent_id!=agent_instance_id:
              raise RuntimeError("checkpoint AgentSession identity mismatch")
          if expected_task_id and resolved_task_id!=expected_task_id:
              raise RuntimeError("checkpoint AgentSession task mismatch")
          if expected_mission_id and resolved_mission_id!=expected_mission_id:
              raise RuntimeError("checkpoint AgentSession mission mismatch")
          # Mission identity is intrinsic to the restored AgentSession. Require it
          # to be present so a package collision cannot silently cross missions.
          if not resolved_mission_id:
              raise RuntimeError("checkpoint AgentSession missing mission identity")
          print("CHECKPOINT_AGENT_SESSION_RESOLVED=PASS")
          print("CHECKPOINT_AGENT_INSTANCE_ID_MATCH=PASS")
          print("CHECKPOINT_MISSION_ID_MATCH=PASS")
          print("CHECKPOINT_TASK_ID_MATCH=PASS")

          def walk(value):
              if isinstance(value,dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value,list):
                  for child in value:
                      yield from walk(child)

          exhausted=set()
          if selected is not None:
              for node in walk(selected):
                  for item in (
                      node.get("EXHAUSTED_PROVIDER_MODEL_PAIRS")
                      or node.get("exhausted_provider_model_pairs")
                      or []
                  ):
                      if not isinstance(item,dict):
                          continue
                      provider=str(item.get("provider_id") or item.get("provider") or "")
                      model=str(item.get("model_id") or item.get("model") or "")
                      if provider and model:
                          exhausted.add((provider,model))
                  provider_attempt_rows=node.get("PROVIDER_ATTEMPTS")
                  if provider_attempt_rows is None:
                      provider_attempt_rows=node.get("provider_attempts")
                  for item in provider_attempt_rows or []:
                      if not isinstance(item,dict):
                          continue
                      performance=item.get("performance") or {}
                      semantic_failure=bool(
                          isinstance(performance,dict)
                          and (
                              performance.get("output_truncated")
                              or str(performance.get("finish_reason") or "").lower()=="length"
                          )
                      )
                      if str(item.get("status") or "").upper()!="FAILED" and not semantic_failure:
                          continue
                      provider=str(item.get("provider_id") or item.get("provider") or "")
                      model=str(item.get("model_id") or item.get("model") or "")
                      if provider and model:
                          exhausted.add((provider,model))

          preferred=str((selected or {}).get("PROVIDER_ID") or "").strip()
          if not preferred and exhausted:
              preferred=sorted(exhausted)[-1][0]
          health=semantic_provider_health()
          for provider_health_row in health.get("providers") or []:
              print(
                  "PROVIDER_HEALTH="
                  + str(provider_health_row.get("provider_id") or "")
                  + ":"
                  + str(provider_health_row.get("state") or "")
                  + ":zero_cost="
                  + str(bool(provider_health_row.get("zero_cost_eligible"))).lower()
              )
          eligible=[
              str(item).strip()
              for item in health.get("eligible_zero_cost_provider_ids") or []
              if str(item).strip()
          ]
          current_failure=str((selected or {}).get("FAILURE_CLASS") or "").strip()
          current_status=str((selected or {}).get("STATUS") or "").strip().upper()
          final_output_valid=bool((selected or {}).get("FINAL_OUTPUT_VALID"))
          recovery_history=False
          pending_recovery_strategy=False
          local_failed=False
          for node in walk(selected or {}):
              if str(node.get("RECOVERY_STRATEGY") or "").strip():
                  pending_recovery_strategy=True
              for item in (node.get("PROVIDER_ATTEMPTS") or node.get("provider_attempts") or []):
                  if not isinstance(item,dict):
                      continue
                  performance=item.get("performance") or {}
                  failed_contract=bool(isinstance(performance,dict) and performance.get("output_truncated"))
                  if str(item.get("status") or "").upper()!="FAILED" and not failed_contract:
                      continue
                  recovery_history=True
                  if str(item.get("provider_id") or item.get("provider") or "")=="ollama_local":
                      local_failed=True
          budget_during_provider_recovery=bool(
              current_failure=="AgentToolBudgetExceeded"
              and recovery_history and exhausted and not final_output_valid
          )
          provider_level_replan_required=bool(
              selected and current_status in {"FAILED","RUNNING"} and exhausted
              and not final_output_valid
              and (
                  current_failure=="RoutingPolicyError"
                  or budget_during_provider_recovery
                  or pending_recovery_strategy
                  or recovery_history
              )
          )
          if recovery_history:
              print("CAUSAL_FAILURE_CHAIN_RESTORED=PASS")
          if budget_during_provider_recovery:
              print("RECOVERY_FAILURE_CLASS=RECOVERY_BUDGET_EXHAUSTED_DURING_PROVIDER_RECOVERY")
              print("AGENT_TOOL_BUDGET_CAUSE_CLASSIFIED=PASS")
              print("RECOVERY_NOT_TERMINATED_BY_BUDGET_ALONE=PASS")
          if exhausted:
              print("EXHAUSTED_PROVIDER_MODEL_PAIRS_PRESERVED=PASS")
          if local_failed:
              print("FAILED_LOCAL_PROVIDER_NOT_REUSED=PASS")
          print("SAME_AGENT_SESSION_PRESERVED=PASS")

          alternate_route_ready=False
          alternate_route_provider=""
          alternate_route_model=""
          route_rejections=[]
          if provider_level_replan_required:
              from app.services.harness_routing_policy_service import (
                  HarnessRoutingRequest,
                  RoutingPolicyError,
                  route_harness_request,
              )
              try:
                  decision=route_harness_request(
                      HarnessRoutingRequest(
                          intent=(
                              "preflight governed Addy provider-level recovery"
                          ),
                          authorized_action="DEVELOPMENT",
                          domain="ai",
                          task_class=(
                              "addy-semantic:debugging-and-error-recovery"
                          ),
                          required_capability_id="ai.reasoning.text",
                          provider_required=True,
                          provider_domain="ai",
                          allowed_providers=tuple(eligible),
                          exhausted_provider_model_pairs=tuple(
                              sorted(exhausted)
                          ),
                          fallback_allowed=False,
                          zero_cost_operation=True,
                          failure_pattern="provider_model_set_exhausted",
                          learning_required=False,
                          required_model_capabilities=(
                              "reasoning",
                              "semantic_planning",
                              "structured_output",
                          ),
                          structured_output_required=True,
                      )
                  )
                  alternate_route_provider=str(
                      decision.selected_provider or ""
                  ).strip()
                  alternate_route_model=str(
                      decision.selected_model or ""
                  ).strip()
                  alternate_route_ready=bool(
                      alternate_route_provider
                      and alternate_route_model
                      and (
                          alternate_route_provider,
                          alternate_route_model,
                      ) not in exhausted
                  )
                  route_rejections=[
                      item.to_dict() if hasattr(item,"to_dict") else {
                          "candidate_id":item.candidate_id,
                          "stage":item.stage,
                          "reasons":list(item.reasons),
                      }
                      for item in decision.rejected_candidates
                  ]
              except RoutingPolicyError as exc:
                  route_rejections=list(
                      exc.evidence.get("rejected_candidates") or []
                  )
                  alternate_route_ready=False
          print("MODEL_LEVEL_ELIGIBILITY_EVALUATED=PASS")
          for rejection in route_rejections:
              if str(rejection.get("stage") or "")!="provider":
                  continue
              print(
                  "MODEL_ROUTE_REJECTED="
                  + str(rejection.get("candidate_id") or "")
                  + ":"
                  + ",".join(str(x) for x in rejection.get("reasons") or [])
              )

          # Provider-level recovery is a new governed planning stage. Materialize
          # the canonical local zero-cost provider as an additional candidate;
          # Harness routing still selects the winner. This avoids trusting a
          # preflight result that can drift from the execution-time request.
          need=False
          if alternate_route_ready:
              print("NEXT_RECOVERY_STRATEGY_SELECTED=HARNESS_MODEL_ROUTE")
              print("RECOVERY_ROUTE_CHANGED=PASS")
          elif provider_level_replan_required:
              print("NEXT_RECOVERY_STRATEGY_SELECTED=MODEL_HEALTH_RECONCILIATION")
          print("prepare_alt_provider="+("true" if need else "false"))
          print("provider_level_replan_required="+(
              "true" if provider_level_replan_required else "false"
          ))
          print("preferred_provider="+preferred)
          print("eligible_provider_count="+str(len(eligible)))
          print("alternate_route_ready="+(
              "true" if alternate_route_ready else "false"
          ))
          print("alternate_route_provider="+alternate_route_provider)
          print("alternate_route_model="+alternate_route_model)
          print("exhausted_pair_count="+str(len(exhausted)))
          print(
              "provider_candidate_materialization="
              + ("required" if need else "not_required")
          )
          PY
          echo "PROVIDER_LEVEL_RECOVERY_REQUIRED=${{ steps.provider_recovery.outputs.provider_level_replan_required }}"
          echo "PREEXISTING_ALTERNATE_ROUTE_READY=${{ steps.provider_recovery.outputs.alternate_route_ready }}"
          echo "PREEXISTING_ALTERNATE_ROUTE_PROVIDER=${{ steps.provider_recovery.outputs.alternate_route_provider }}"
          echo "MATERIALIZE_CANONICAL_LOCAL_PROVIDER=${{ steps.provider_recovery.outputs.prepare_alt_provider }}"

      - name: Set up Node 24 for bounded Codex CLI
        if: steps.provider_recovery.outputs.provider_level_replan_required == 'true' && steps.provider_recovery.outputs.alternate_route_ready != 'true' && env.BR_NEW_CODEX_DEVICE_AUTH != 'DENIED'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Materialize bounded Codex CLI
        if: steps.provider_recovery.outputs.provider_level_replan_required == 'true' && steps.provider_recovery.outputs.alternate_route_ready != 'true' && env.BR_NEW_CODEX_DEVICE_AUTH != 'DENIED'
        run: |
          set -euo pipefail
          export CODEX_HOME="$RUNNER_TEMP/br-codex-home"
          echo "CODEX_HOME=$CODEX_HOME" >> "$GITHUB_ENV"
          mkdir -p "$CODEX_HOME"
          chmod 700 "$CODEX_HOME"
          bash scripts/agent-tooling/bootstrap.sh codex
          export PATH="$HOME/.local/share/br-agent-tooling/bin:$PATH"
          codex --version

      - name: Authenticate bounded Codex CLI
        if: steps.provider_recovery.outputs.provider_level_replan_required == 'true' && steps.provider_recovery.outputs.alternate_route_ready != 'true' && env.BR_NEW_CODEX_DEVICE_AUTH != 'DENIED'
        timeout-minutes: 12
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ vars.TELEGRAM_ALLOWED_USER_ID }}
          CODEX_AUTH_DELIVERY_EVIDENCE_FILE: runtime/real-agent-self-improvement/codex-device-auth-delivery.json
        run: |
          set -euo pipefail
          python scripts/codex_auth_bootstrap.py --allow-device-auth --timeout-seconds 600 --output runtime/real-agent-self-improvement/codex-auth-status.json
          codex login status

      - name: Record unavailable optional Codex capability
        if: steps.provider_recovery.outputs.provider_level_replan_required == 'true' && steps.provider_recovery.outputs.alternate_route_ready != 'true' && env.BR_NEW_CODEX_DEVICE_AUTH == 'DENIED'
        run: |
          set -euo pipefail
          mkdir -p runtime/real-agent-self-improvement
          printf '%s\n' '{"CODEX_AUTH":"UNAVAILABLE","CODEX_ELIGIBILITY":"BLOCKED","NEW_CODEX_DEVICE_AUTH":"DENIED","HARNESS_DYNAMIC_FALLBACK_REQUIRED":true}' > runtime/real-agent-self-improvement/codex-auth-status.json
          echo "CODEX_AUTH=UNAVAILABLE"
          echo "CODEX_ELIGIBILITY=BLOCKED"

      - name: Preflight existing codex-readonly semantic agent
        if: steps.provider_recovery.outputs.provider_level_replan_required == 'true' && steps.provider_recovery.outputs.alternate_route_ready != 'true' && env.BR_NEW_CODEX_DEVICE_AUTH != 'DENIED'
        id: codex_semantic_preflight
        run: |
          set -euo pipefail
          python scripts/task02_codex_semantic_preflight.py \
            --output runtime/real-agent-self-improvement/task02-codex-semantic-preflight.json
          test "$(python -c 'import json; print(json.load(open("runtime/real-agent-self-improvement/task02-codex-semantic-preflight.json"))["PREFLIGHT_STATUS"])')" = "PASS"
          echo "semantic_preflight_passed=true" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from app.services.global_capability_registry import GLOBAL_CAPABILITY_REGISTRY
          from app.services.capability_health_service import capability_health
          snapshot={}
          for record in GLOBAL_CAPABILITY_REGISTRY.all():
              health=capability_health(record.capability_id)
              if str(record.health_policy or "")=="SEMANTIC_PROVIDER_REQUIRED" and health.state in {"BLOCKED","QUARANTINED"}:
                  snapshot[record.capability_id]={"eligible":False,"health_state":health.state,"reason":health.reason,"evidence_refs":list(health.evidence_refs)}
          for record in GLOBAL_CAPABILITY_REGISTRY.all():
              if str(record.health_policy or "")=="CODEX_AUTH_REQUIRED":
                  snapshot[record.capability_id]={
                      "eligible":True,
                      "health_state":"HEALTHY",
                      "reason":"authenticated Codex runtime preflight",
                      "evidence_refs":["artifact:task02-codex-semantic-preflight.json"],
                  }
          print("BR_RUNTIME_CAPABILITY_ELIGIBILITY_JSON="+json.dumps(snapshot,separators=(",",":")))
          PY

      - name: Prove deterministic task-02 decomposition
        if: steps.codex_semantic_preflight.outputs.semantic_preflight_passed == 'true' && false
        id: deterministic_task02
        run: |
          set -euo pipefail
          python scripts/task02_deterministic_team.py \
            --checkpoint-root runtime/real-agent-self-improvement/checkpoint-source \
            --request .run/real-agent-self-improvement.request.json \
            --output-dir runtime/real-agent-self-improvement/deterministic-team
          echo "deterministic_team_closed=true" >> "$GITHUB_OUTPUT"

      - name: Bootstrap pinned Hermes core for task-02 chain
        if: steps.deterministic_task02.outputs.deterministic_team_closed == 'true'
        run: |
          set -euo pipefail
          python scripts/bootstrap_hermes_agent.py --target "$RUNNER_TEMP/task02-hermes-agent" --output runtime/real-agent-self-improvement/hermes-upstream.json
          test "$(git -C "$RUNNER_TEMP/task02-hermes-agent" rev-parse HEAD)" = "9eca7f388f71755293343dddd6ec4d9111d68fc4"
          echo "BR_TASK02_HERMES_UPSTREAM_ROOT=$RUNNER_TEMP/task02-hermes-agent" >> "$GITHUB_ENV"

      - name: Execute real Hermes Agent Office task-02 chain
        if: steps.deterministic_task02.outputs.deterministic_team_closed == 'true'
        id: task02_real_chain
        run: |
          set -euo pipefail
          python scripts/task02_real_multiagent_chain.py \
            --checkpoint-root runtime/real-agent-self-improvement/checkpoint-source \
            --request .run/real-agent-self-improvement.request.json \
            --artifact-dir runtime/real-agent-self-improvement/task02-real-chain | tee runtime/real-agent-self-improvement/task02-real-chain.log
          grep -q '"REAL_DETERMINISTIC_MULTI_AGENT_CHAIN": "PASS"' runtime/real-agent-self-improvement/task02-real-chain/task02-real-chain-report.json
          grep -q '"SEMANTIC_REASONING_REQUIRED": "YES"' runtime/real-agent-self-improvement/task02-real-chain/task02-real-chain-report.json
          echo "real_chain_closed=true" >> "$GITHUB_OUTPUT"

      - name: Close canonical route inventory
        if: steps.task02_real_chain.outputs.real_chain_closed == 'true'
        id: route_inventory
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/zero_cost_route_inventory.py \
            --checkpoint-root runtime/real-agent-self-improvement/checkpoint-source \
            --request .run/real-agent-self-improvement.request.json \
            --output runtime/real-agent-self-improvement/zero-cost-route-inventory.json
          echo "route_inventory_closed=true" >> "$GITHUB_OUTPUT"

      - name: Prepare bounded local zero-cost alternate provider
        if: steps.provider_recovery.outputs.prepare_alt_provider == 'true'
        timeout-minutes: 10
        env:
          OLLAMA_HOST: "127.0.0.1:11434"
          OLLAMA_NO_CLOUD: "1"
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          test "$REPOSITORY_PRIVATE" = "false"
          read -r OLLAMA_VERSION OLLAMA_MODEL OLLAMA_EXPECTED_DIGEST <<EOF
          $(python - <<'PY'
          from app.services.local_openweight_ai_provider import (
              LOCAL_OPENWEIGHT_MODEL_DIGEST,
              LOCAL_OPENWEIGHT_MODEL_ID,
              LOCAL_OPENWEIGHT_OLLAMA_VERSION,
          )
          print(
              LOCAL_OPENWEIGHT_OLLAMA_VERSION,
              LOCAL_OPENWEIGHT_MODEL_ID,
              LOCAL_OPENWEIGHT_MODEL_DIGEST,
          )
          PY
          )
          EOF
          export OLLAMA_VERSION OLLAMA_MODEL OLLAMA_EXPECTED_DIGEST

          mkdir -p runtime/real-agent-self-improvement/local-provider
          command -v zstd >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          }
          curl --fail --show-error --location             "https://raw.githubusercontent.com/ollama/ollama/v$OLLAMA_VERSION/scripts/install.sh"             -o runtime/real-agent-self-improvement/local-provider/ollama-install.sh
          OLLAMA_VERSION="$OLLAMA_VERSION" OLLAMA_NO_START=1             sh runtime/real-agent-self-improvement/local-provider/ollama-install.sh
          ollama --version | grep -F "$OLLAMA_VERSION"

          nohup env             OLLAMA_HOST="$OLLAMA_HOST"             OLLAMA_NO_CLOUD="$OLLAMA_NO_CLOUD"             ollama serve             > runtime/real-agent-self-improvement/local-provider/ollama.log 2>&1 &
          echo "$!" > runtime/real-agent-self-improvement/local-provider/ollama.pid

          READY=0
          for i in {1..60}; do
            if ! kill -0 "$(cat runtime/real-agent-self-improvement/local-provider/ollama.pid)" 2>/dev/null; then
              break
            fi
            if curl --connect-timeout 1 --max-time 2 -fsS               http://127.0.0.1:11434/api/tags               > runtime/real-agent-self-improvement/local-provider/tags-before.json 2>/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1"

          ollama pull "$OLLAMA_MODEL"             | tee runtime/real-agent-self-improvement/local-provider/model-pull.txt
          curl --fail --show-error --silent             http://127.0.0.1:11434/api/tags             > runtime/real-agent-self-improvement/local-provider/tags-after.json

          python - <<'PY'
          import json, os
          data=json.load(open(
              "runtime/real-agent-self-improvement/local-provider/tags-after.json"
          ))
          expected_model=os.environ["OLLAMA_MODEL"]
          expected_digest=os.environ["OLLAMA_EXPECTED_DIGEST"]
          rows=[
              item for item in data.get("models",[])
              if item.get("name")==expected_model or item.get("model")==expected_model
          ]
          assert len(rows)==1, rows
          digest=str(rows[0].get("digest") or "").removeprefix("sha256:")
          assert digest==expected_digest, (digest,expected_digest)
          print("ALTERNATE_PROVIDER_MODEL_IDENTITY=PASS")
          PY

          {
            echo "BR_LOCAL_OPENWEIGHT_ENABLED=1"
            echo "BR_LOCAL_OPENWEIGHT_URL=http://127.0.0.1:11434"
          } >> "$GITHUB_ENV"
          echo "PROVIDER_MODEL_SET_EXHAUSTED_CLASSIFIED=PASS"
          echo "ALTERNATE_PROVIDER_RUNTIME=ollama_local"
          echo "ALTERNATE_PROVIDER_ZERO_COST=PASS"
          echo "ALTERNATE_PROVIDER_IDENTITY_SOURCE=CANONICAL_PROVIDER_MODULE"

      - name: Execute real natural-goal self-improvement mission
        id: mission
        if: steps.route_inventory.outputs.route_inventory_closed != 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          extra=()
          if [ -d runtime/real-agent-self-improvement/provider-reconciliation-source ]; then
            extra+=(--provider-reconciliation-dir runtime/real-agent-self-improvement/provider-reconciliation-source)
          fi
          python scripts/real_agent_self_improvement_mission.py             --output-dir runtime/real-agent-self-improvement             --base-sha "$GITHUB_SHA"             --branch "$GITHUB_REF_NAME"             --request .run/real-agent-self-improvement.request.json             --incident-source-dir runtime/real-agent-self-improvement/incident-source             --checkpoint-source-dir runtime/real-agent-self-improvement/checkpoint-source             "${extra[@]}"
          iteration_result="$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/real-agent-self-improvement/final.json").read_text())
          print(d.get("ITERATION_RESULT") or "COMPLETED")
          PY
          )"
          echo "iteration_result=$iteration_result" >> "$GITHUB_OUTPUT"
          echo "SELF_IMPROVEMENT_ITERATION_RESULT=$iteration_result"

      - name: Assert typed nonterminal provider wait
        if: steps.mission.outputs.iteration_result == 'NONTERMINAL_WAIT'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/real-agent-self-improvement/final.json").read_text())
          assert d["ITERATION_RESULT"]=="NONTERMINAL_WAIT"
          assert d["MISSION_STATUS"]=="WAITING_FOR_PROVIDER_AVAILABILITY"
          assert d["MISSION_TERMINAL"] is False
          assert d["HUMAN_INTERVENTION_REQUIRED"] is False
          assert d["PROVIDER_POOL_EXHAUSTED_TYPED"] is True
          assert d["NO_PROVIDER_CALL_ON_EMPTY_POOL"] is True
          assert d["NO_BLIND_REPLAN"] is True
          assert d["DURABLE_WAIT_STATE_PERSISTED"] is True
          assert d["EXECUTION_LEASE_RELEASED"] is True
          assert int(d["PROVIDER_CALLS_WHILE_WAITING"])==0
          assert int(d["AGENT_TURNS_WHILE_WAITING"])==0
          assert int(d["SEMANTIC_PLANNER_CALLS_WHILE_WAITING"])==0
          print("PROVIDER_POOL_EXHAUSTED_TYPED=PASS")
          print("WAITING_FOR_PROVIDER_AVAILABILITY=PASS")
          print("MISSION_TERMINAL=FALSE")
          print("HUMAN_INTERVENTION_REQUIRED=FALSE")
          print("NO_PROVIDER_CALL_ON_EMPTY_POOL=PASS")
          print("NO_BLIND_REPLAN=PASS")
          print("DURABLE_WAIT_STATE_PERSISTED=PASS")
          print("EXECUTION_LEASE_RELEASED=PASS")
          PY

      - name: Assert real self-improvement gates
        if: steps.route_inventory.outputs.route_inventory_closed != 'true' && steps.mission.outputs.iteration_result != 'NONTERMINAL_WAIT'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(
              Path("runtime/real-agent-self-improvement/final.json").read_text(
                  encoding="utf-8"
              )
          )
          true_gates=(
              "PROFILE_ARTIFACT_CREATED",
              "ROOT_CAUSE_INPUT_PROFILE_RESOLVED",
              "ROOT_CAUSE_ARTIFACT_CREATED",
              "PROPOSAL_INPUT_ROOT_CAUSE_RESOLVED",
              "PROPOSAL_ARTIFACT_CREATED",
              "TRANSITIVE_LINEAGE_PRESERVED",
              "TASK_RESULT_ENVELOPE_REAL",
              "DOWNSTREAM_ARTIFACT_CONSUMED",
              "REVIEW_SELECTED_FROM_REGISTRY",
              "REVIEWER_DIFFERENT_FROM_PRIMARY_AUTHOR",
              "REVIEW_INPUT_ARTIFACT_RESOLVED",
              "REVIEW_AGENT_EXECUTED",
              "REVIEW_ARTIFACT_CREATED",
              "LEARNING_CAPTURED_FROM_REAL_EXECUTION",
              "NEXT_EXECUTION_READS_LEARNING",
              "LEARNING_INFLUENCED_SELECTION_OR_STRATEGY",
              "NEXT_EXECUTION_CHANGED_BY_LEARNING",
              "PROVIDER_COMPETENCE_NOT_WRONGLY_PENALIZED",
              "NO_NEW_CODEX_MISSION",
              "NO_FAKE_CANDIDATE",
              "NO_HARDCODED_AGENT_CHAIN",
              "REAL_AGENT_SELF_IMPROVEMENT",
              "REAL_PROVIDER_FAILURE_EPISODE",
              "AGENT_DIAGNOSIS",
              "AGENT_ROOT_CAUSE",
              "AGENT_CANDIDATE_PROPOSAL",
              "INDEPENDENT_REVIEW",
              "HARNESS_FIX_DECISION",
              "RECOVERY_EXECUTION_LINKED_TO_FAILURE",
              "LEARNING_MEMORY_UPDATED",
              "NEXT_SIMILAR_EXECUTION_CAN_USE_RECOVERY",
              "DETERMINISTIC_FEASIBILITY_PRECHECK",
              "NO_FAKE_REVIEWER",
              "NO_REVIEW_AUTHORITY_INFLATION",
              "NO_CODEX_AUTH_BYPASS",
              "HERMES_NOT_MISREPRESENTED_AS_REVIEW_AUTHOR",
              "REVIEW_PROVIDER_SELECTED_BY_HARNESS",
              "RECOVERY_CANDIDATE_SPEC_CREATED",
              "APPLY_RECOVERY_EXECUTED",
              "VALIDATE_RECOVERY_EXECUTED",
              "FOCUSED_TESTS_EXECUTED",
          )
          for key in true_gates:
              assert data[key] is True, (key, data[key])
          assert data["CODEX_CHECKPOINT_PRESERVED"] == 35850473901
          assert float(data["TOTAL_MISSION_WALL_CLOCK_MS"]) > 0
          assert float(data["HARNESS_PLANNING_MS"]) > 0
          assert float(data["REGISTRY_SELECTION_MS"]) >= 0
          assert float(data["AGENT_EXECUTION_TOTAL_MS"]) > 0
          assert float(data["ARTIFACT_HANDOFF_MS"]) >= 0
          assert float(data["LEARNING_WRITE_MS"]) > 0
          assert float(data["NEXT_EXECUTION_LEARNING_READ_MS"]) > 0
          assert 0 <= float(data["USEFUL_WORK_RATIO"]) <= 1
          assert data["DIRECT_PROVIDER_BYPASS"] == "NO"
          assert data["HARDCODED_PROVIDER"] == "NO"
          assert int(data["PROVIDER_CALLS_ON_DETERMINISTIC_IMPOSSIBILITY"]) == 0
          assert int(data["DUPLICATE_SERIALIZATION_COUNT"]) == 0
          assert int(data["DUPLICATE_BOOTSTRAP_COUNT"]) == 0
          assert data["INCIDENT_RECOVERY_PLANNING_MODE"] == "DETERMINISTIC_INCIDENT_RECOVERY"
          assert int(data["INCIDENT_RECOVERY_SEMANTIC_PLANNER_CALLS"]) == 0
          assert data["REVIEW_VERDICT"] == "ACCEPT"
          assert data["HARNESS_DECISION"] == "AUTHORIZED"
          assert data["APPLY_CAPABILITY"] == "harness.recovery.apply-local"
          assert data["VALIDATE_CAPABILITY"] == "harness.recovery.validate-local"
          assert data["SANDBOXED_MUTATION"] == "PASS"
          assert data["BASE_SHA_VERIFIED"] == "PASS"
          assert data["PATCH_HASH_VERIFIED"] == "PASS"
          assert data["PATH_ALLOWLIST_ENFORCED"] == "PASS"
          assert data["NO_UNREVIEWED_MUTATION"] == "PASS"
          assert data["RECOVERY_VALIDATION_RESULT"] == "PASS"
          assert int(data["MISSION_CLASS_OVERRIDE_COUNT"]) == 0
          assert int(data["READ_ONLY_ROLE_MUTATION_REQUIREMENTS"]) == 0
          assert int(data["DETERMINISTIC_ROLE_SEMANTIC_REQUIREMENTS"]) == 0
          print("REAL_AGENT_SELF_IMPROVEMENT_GATES=PASS")
          print("CANONICAL_CODEX_CHECKPOINT_PRESERVED=PASS")
          print("NO_NEW_NATURAL_SWARM=PASS")
          print("FAILURE_EPISODE_ID="+str(data.get("FAILURE_EPISODE_ID")))
          print("DIAGNOSIS_AUTHOR="+str(data.get("DIAGNOSIS_AUTHOR")))
          print("ROOT_CAUSE_AUTHOR="+str(data.get("ROOT_CAUSE_AUTHOR")))
          print("CANDIDATE_AUTHOR="+str(data.get("CANDIDATE_AUTHOR")))
          print("REVIEW_AUTHOR="+str(data.get("REVIEW_AUTHOR")))
          print("HARNESS_DECISION_ID="+str(data.get("HARNESS_DECISION_ID")))
          print("PROVIDER_CALL_ATTEMPTED="+str(data.get("PROVIDER_CALL_ATTEMPTED")))
          print("PROVIDER_FAILURE_CLASS="+str(data.get("PROVIDER_FAILURE_CLASS")))
          print("PROVIDER_COMPETENCE_PENALIZED="+str(data.get("PROVIDER_COMPETENCE_PENALIZED")))
          print("REVIEWER_MATRIX_ARTIFACT_REF="+str(data.get("REVIEWER_MATRIX_ARTIFACT_REF")))
          print("REVIEW_CAPABILITY_SELECTED="+str(data.get("REVIEW_CAPABILITY_SELECTED")))
          print("REVIEWER_HEALTH="+str(data.get("REVIEWER_HEALTH")))
          print("DETERMINISTIC_FEASIBILITY_PRECHECK_MS="+str(data.get("DETERMINISTIC_FEASIBILITY_PRECHECK_MS")))
          print("DUPLICATE_SERIALIZATION_COUNT="+str(data.get("DUPLICATE_SERIALIZATION_COUNT")))
          print("DUPLICATE_BOOTSTRAP_COUNT="+str(data.get("DUPLICATE_BOOTSTRAP_COUNT")))
          print("INCIDENT_RECOVERY_PLANNING_MODE="+str(data.get("INCIDENT_RECOVERY_PLANNING_MODE")))
          print("REVIEW_VERDICT="+str(data.get("REVIEW_VERDICT")))
          print("RECOVERY_CANDIDATE_SPEC_CREATED="+str(data.get("RECOVERY_CANDIDATE_SPEC_CREATED")))
          print("APPLY_CAPABILITY="+str(data.get("APPLY_CAPABILITY")))
          print("APPLY_RECOVERY_EXECUTED="+str(data.get("APPLY_RECOVERY_EXECUTED")))
          print("VALIDATE_CAPABILITY="+str(data.get("VALIDATE_CAPABILITY")))
          print("VALIDATE_RECOVERY_EXECUTED="+str(data.get("VALIDATE_RECOVERY_EXECUTED")))
          print("RECOVERY_VALIDATION_RESULT="+str(data.get("RECOVERY_VALIDATION_RESULT")))
          PY

      - name: Upload real self-improvement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-agent-self-improvement-${{ github.run_id }}
          path: runtime/real-agent-self-improvement/
          if-no-files-found: error
          retention-days: 30

      - name: Dispatch provider availability reconciliation
        if: steps.mission.outputs.iteration_result == 'NONTERMINAL_WAIT'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run real-agent-self-improvement.yml             --repo "$GITHUB_REPOSITORY"             --ref work/gate6f-analytics-learning             -f operation=PROVIDER_RECONCILIATION             -f wait_run_id="$GITHUB_RUN_ID"
          echo "PROVIDER_AVAILABILITY_RECONCILIATION_DISPATCHED=PASS"


  provider-reconcile:
    if: inputs.operation == 'PROVIDER_RECONCILIATION'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REF: work/gate6f-analytics-learning
      BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/provider-availability-reconciliation/reconciliation-learning.db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gate6f-analytics-learning
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bounded reconciliation runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/provider-availability-reconciliation
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt pytest >/dev/null
          python -m py_compile             app/services/provider_availability_reconciliation_service.py             scripts/provider_availability_reconciliation.py
          python -m pytest -q             tests/test_provider_availability_reconciliation_service.py             tests/test_provider_availability_reconciliation_wake.py             tests/test_provider_availability_boundaries.py             tests/test_harness_internal_recovery_service.py
          echo "PROVIDER_RECONCILIATION_FOCUSED_TESTS=PASS"

      - name: Resolve active durable provider wait
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_WAIT_RUN_ID: ${{ inputs.wait_run_id || '' }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_WAIT_RUN_ID:-}"
          root="artifacts/provider-availability-reconciliation/wait-source"
          rm -rf "$root"
          mkdir -p "$root"
          wait_run=""

          if [ -n "$requested" ]; then
            wait_run="$requested"
            artifact="real-agent-self-improvement-$wait_run"
            if ! gh run download "$wait_run"               --repo "$GITHUB_REPOSITORY"               --name "$artifact"               --dir "$root"; then
              echo "active_wait=false" >> "$GITHUB_OUTPUT"
              echo "ACTIVE_PROVIDER_WAIT=NO"
              exit 0
            fi
          else
            mapfile -t runs < <(
              gh run list                 --repo "$GITHUB_REPOSITORY"                 --workflow real-agent-self-improvement.yml                 --branch "$TARGET_REF"                 --limit 16                 --json databaseId,status                 --jq '.[].databaseId'
            )
            for run_id in "${runs[@]}"; do
              if [ "$run_id" = "$GITHUB_RUN_ID" ]; then
                continue
              fi
              stage="$RUNNER_TEMP/provider-wait-source-$run_id"
              rm -rf "$stage"
              mkdir -p "$stage"
              if gh run download "$run_id"                 --repo "$GITHUB_REPOSITORY"                 --name "real-agent-self-improvement-$run_id"                 --dir "$stage" >/dev/null 2>&1; then
                rm -rf "$root"
                mv "$stage" "$root"
                wait_run="$run_id"
                break
              fi
            done
          fi

          if [ -z "$wait_run" ]; then
            echo "active_wait=false" >> "$GITHUB_OUTPUT"
            echo "ACTIVE_PROVIDER_WAIT=NO"
            exit 0
          fi

          python - "$root" "$wait_run" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys

          root=Path(sys.argv[1])
          run_id=sys.argv[2]
          output=Path(sys.argv[3])
          final=root/"final.json"
          if not final.is_file():
              matches=[
                  p for p in root.rglob("final.json")
                  if "checkpoint-source" not in p.parts
                  and "checkpoint-stage" not in p.parts
              ]
              final=matches[0] if len(matches)==1 else None
          if final is None or not final.is_file():
              with output.open("a") as h:
                  h.write("active_wait=false\n")
              print("ACTIVE_PROVIDER_WAIT=NO")
              raise SystemExit(0)
          data=json.loads(final.read_text())
          if data.get("ITERATION_RESULT")!="NONTERMINAL_WAIT":
              with output.open("a") as h:
                  h.write("active_wait=false\n")
              print("ACTIVE_PROVIDER_WAIT=NO")
              raise SystemExit(0)
          expected=str(data.get("PROVIDER_AVAILABILITY_WAIT_HASH") or "")
          candidates=[]
          for p in root.rglob("*.json"):
              if "provider-availability-waits" not in p.parts:
                  continue
              try:
                  row=json.loads(p.read_text())
              except Exception:
                  continue
              if row.get("schema")!="ProviderAvailabilityWait/v1":
                  continue
              if expected and str(row.get("content_sha256") or "")!=expected:
                  continue
              candidates.append((p,row))
          if len(candidates)!=1:
              raise RuntimeError(
                  "ACTIVE_PROVIDER_WAIT_COUNT="+str(len(candidates))
              )
          _,row=candidates[0]
          target=Path(
              "artifacts/provider-availability-reconciliation/input-wait.json"
          )
          target.write_text(
              json.dumps(row,indent=2,sort_keys=True)+"\n"
          )
          with output.open("a") as h:
              h.write("active_wait=true\n")
              h.write(f"wait_run_id={run_id}\n")
              h.write(f"mission_id={row.get('mission_id') or ''}\n")
              h.write(f"task_id={row.get('task_id') or ''}\n")
              h.write(
                  "wait_started_at="
                  +str(row.get("wait_started_at") or "")
                  +"\n"
              )
          print("ACTIVE_PROVIDER_WAIT=YES")
          print("WAIT_SOURCE_RUN="+run_id)
          print("WAIT_MISSION_ID="+str(row.get("mission_id") or ""))
          print("WAIT_TASK_ID="+str(row.get("task_id") or ""))
          PY

      - name: Restore latest reconciliation state for same wait epoch
        if: steps.wait.outputs.active_wait == 'true'
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_MISSION_ID: ${{ steps.wait.outputs.mission_id }}
          WAIT_TASK_ID: ${{ steps.wait.outputs.task_id }}
          WAIT_STARTED_AT: ${{ steps.wait.outputs.wait_started_at }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/provider-availability-reconciliation/prior
          mapfile -t runs < <(
            gh run list               --repo "$GITHUB_REPOSITORY"               --workflow real-agent-self-improvement.yml               --branch "$TARGET_REF"               --limit 20               --json databaseId,status,conclusion               --jq '.[] | select(.status=="completed" and .conclusion=="success") | .databaseId'
          )
          selected=""
          terminal_prior=""
          for run_id in "${runs[@]}"; do
            if [ "$run_id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi
            stage="artifacts/provider-availability-reconciliation/prior/$run_id"
            mkdir -p "$stage"
            if ! gh run download "$run_id"               --repo "$GITHUB_REPOSITORY"               --name "provider-availability-reconciliation-$run_id"               --dir "$stage" >/dev/null 2>&1; then
              continue
            fi
            verdict="$(python - "$stage" <<'PY'
          import json,os,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          matches=list(root.rglob("provider-availability-reconciliation-result.json"))
          if len(matches)!=1:
              print("NO_MATCH")
              raise SystemExit
          d=json.loads(matches[0].read_text())
          nxt=dict(d.get("next_wait") or {})
          same=(
              str(d.get("mission_id") or "")==os.environ["WAIT_MISSION_ID"]
              and str(d.get("task_id") or "")==os.environ["WAIT_TASK_ID"]
              and str(nxt.get("wait_started_at") or "")==os.environ["WAIT_STARTED_AT"]
          )
          print(str(d.get("decision") or "") if same else "NO_MATCH")
          PY
            )"
            if [ "$verdict" = "STILL_WAITING" ]; then
              next_wait="$(find "$stage" -type f -name provider-availability-next-wait.json -print -quit)"
              test -n "$next_wait"
              cp "$next_wait"                 artifacts/provider-availability-reconciliation/input-wait.json
              selected="$run_id"
              break
            fi
            if [ "$verdict" = "REQUEUE_TASK" ] ||                [ "$verdict" = "STRUCTURAL_BLOCK" ] ||                [ "$verdict" = "EXTERNAL_GATE" ]; then
              terminal_prior="$verdict"
              selected="$run_id"
              break
            fi
          done
          echo "prior_run_id=$selected" >> "$GITHUB_OUTPUT"
          echo "prior_terminal_decision=$terminal_prior" >> "$GITHUB_OUTPUT"
          if [ -n "$terminal_prior" ]; then
            echo "PRIOR_RECONCILIATION_ALREADY_DECIDED=$terminal_prior"
          elif [ -n "$selected" ]; then
            echo "PRIOR_RECONCILIATION_STATE_RESTORED=PASS"
          else
            echo "PRIOR_RECONCILIATION_STATE_RESTORED=NOT_APPLICABLE"
          fi

      - name: Import and coalesce durable provider-health evidence
        if: steps.wait.outputs.active_wait == 'true' && steps.prior.outputs.prior_terminal_decision == ''
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_EVENT_RUN_ID: ${{ inputs.health_event_run_id || '' }}
          HEALTH_EVENT_ARTIFACT_NAME: ${{ inputs.health_event_artifact_name || '' }}
        run: |
          set -euo pipefail
          health_root="artifacts/provider-availability-reconciliation/health-event"
          rm -rf "$health_root"
          mkdir -p "$health_root"
          selected_run="${HEALTH_EVENT_RUN_ID:-}"
          selected_artifact="${HEALTH_EVENT_ARTIFACT_NAME:-}"
          source_db=""

          if [ -n "$selected_run" ]; then
            explicit="$health_root/explicit-$selected_run"
            mkdir -p "$explicit"
            if [ -n "$selected_artifact" ]; then
              gh run download "$selected_run" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$selected_artifact" \
                --dir "$explicit" || true
            else
              gh run download "$selected_run" \
                --repo "$GITHUB_REPOSITORY" \
                --dir "$explicit" || true
            fi
            source_db="$(find "$explicit" -type f \( -name 'learning.db' -o -name '*.sqlite3' \) -print | sort | head -n 1)"
          fi

          # A newer pending workflow dispatch can replace an older pending
          # dispatch in the same concurrency group. The durable artifact is
          # therefore the event source of truth; workflow input is only a hint.
          if [ -z "$source_db" ]; then
            runs_json="$RUNNER_TEMP/provider-health-runs.json"
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --branch "$TARGET_REF" \
              --limit 40 \
              --json databaseId,status,conclusion,createdAt,workflowName \
              > "$runs_json"
            mapfile -t health_runs < <(
              python - "$runs_json" <<'PY'
          import json,re,sys
          rows=json.load(open(sys.argv[1],encoding="utf-8"))
          rows=[
              row for row in rows
              if row.get("status")=="completed"
              and row.get("conclusion")=="success"
              and re.search(
                  r"(health|probe|proof)",
                  str(row.get("workflowName") or ""),
                  re.I,
              )
          ]
          rows.sort(
              key=lambda row:str(row.get("createdAt") or ""),
              reverse=True,
          )
          for row in rows:
              print(str(row.get("databaseId") or ""))
          PY
            )
            for run_id in "${health_runs[@]}"; do
              [ -n "$run_id" ] || continue
              [ "$run_id" != "$GITHUB_RUN_ID" ] || continue
              mapfile -t artifact_names < <(
                gh api \
                  "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                  --jq '.artifacts[].name' 2>/dev/null \
                  | grep -Ei '(health|probe|proof)' || true
              )
              for artifact_name in "${artifact_names[@]}"; do
                stage="$health_root/coalesced-$run_id"
                rm -rf "$stage"
                mkdir -p "$stage"
                if ! gh run download "$run_id" \
                  --repo "$GITHUB_REPOSITORY" \
                  --name "$artifact_name" \
                  --dir "$stage" >/dev/null 2>&1; then
                  continue
                fi
                candidate="$(find "$stage" -type f \( -name 'learning.db' -o -name '*.sqlite3' \) -print | sort | head -n 1)"
                if [ -n "$candidate" ]; then
                  source_db="$candidate"
                  selected_run="$run_id"
                  selected_artifact="$artifact_name"
                  break 2
                fi
              done
            done
          fi

          if [ -n "$source_db" ]; then
            cp "$source_db" "$BR_TEST_DATABASE"
            imported="true"
            echo "FRESH_PROVIDER_HEALTH_DATABASE_IMPORTED=PASS"
          else
            imported="false"
            python - <<'PY'
          from app.database.schema import initialize_schema
          initialize_schema()
          print("FRESH_PROVIDER_HEALTH_DATABASE_IMPORTED=NOT_APPLICABLE")
          PY
          fi

          echo "health_event_run_id=$selected_run" >> "$GITHUB_OUTPUT"
          echo "health_event_artifact_name=$selected_artifact" >> "$GITHUB_OUTPUT"
          echo "fresh_health_database_imported=$imported" >> "$GITHUB_OUTPUT"
          SELECTED_HEALTH_EVENT_RUN_ID="$selected_run" \
          SELECTED_HEALTH_EVENT_ARTIFACT_NAME="$selected_artifact" \
          FRESH_HEALTH_DATABASE_IMPORTED="$imported" \
          python - <<'PY'
          import json,os
          from pathlib import Path
          meta={
              "schema":"ProviderHealthWakeEvent/v1",
              "health_event_run_id":(
                  os.getenv("SELECTED_HEALTH_EVENT_RUN_ID") or None
              ),
              "health_event_artifact_name":(
                  os.getenv("SELECTED_HEALTH_EVENT_ARTIFACT_NAME") or None
              ),
              "fresh_health_database_imported":(
                  os.getenv("FRESH_HEALTH_DATABASE_IMPORTED")=="true"
              ),
              "coalesced_from_durable_artifacts":True,
              "authority":"DEEPSEEK_HARNESS",
              "semantic_task_executed":False,
          }
          Path(
              "artifacts/provider-availability-reconciliation/"
              "health-wake-event.json"
          ).write_text(
              json.dumps(meta,indent=2,sort_keys=True)+"\n"
          )
          PY
          echo "PROVIDER_HEALTH_EVENT_COALESCING=PASS"

      - name: Reconcile provider availability once
        if: steps.wait.outputs.active_wait == 'true' && steps.prior.outputs.prior_terminal_decision == ''
        id: reconcile
        env:
          # Reconciliation recomputes the same hard eligibility that execution
          # will observe. Credential presence is evidence only; this step still
          # performs zero semantic/provider calls.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/provider_availability_reconciliation.py             --wait-file artifacts/provider-availability-reconciliation/input-wait.json             --output-dir artifacts/provider-availability-reconciliation
          echo "PROVIDER_CALLS_WHILE_WAITING=0"
          echo "AGENT_TURNS_WHILE_WAITING=0"
          echo "SEMANTIC_PLANNER_CALLS_WHILE_WAITING=0"

      - name: Persist reconciliation metadata
        if: steps.wait.outputs.active_wait == 'true' && steps.prior.outputs.prior_terminal_decision == ''
        env:
          WAIT_SOURCE_RUN_ID: ${{ steps.wait.outputs.wait_run_id }}
          HEALTH_EVENT_RUN_ID: ${{ steps.health.outputs.health_event_run_id || inputs.health_event_run_id || '' }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path("artifacts/provider-availability-reconciliation/reconciliation-metadata.json")
          p.write_text(json.dumps({
              "schema":"ProviderAvailabilityReconciliationMetadata/v1",
              "wait_source_run_id":os.environ["WAIT_SOURCE_RUN_ID"],
              "health_event_run_id":os.environ.get("HEALTH_EVENT_RUN_ID") or None,
              "reconciliation_run_id":os.environ["GITHUB_RUN_ID"],
              "authority":"DEEPSEEK_HARNESS",
              "github_actions_is_scheduler":False,
          },indent=2,sort_keys=True)+"\n")
          PY

      - name: Upload reconciliation evidence
        if: steps.wait.outputs.active_wait == 'true' && steps.prior.outputs.prior_terminal_decision == ''
        uses: actions/upload-artifact@v4
        with:
          name: provider-availability-reconciliation-${{ github.run_id }}
          path: artifacts/provider-availability-reconciliation/
          if-no-files-found: error
          retention-days: 30

      - name: Requeue exact same self-improvement mission
        if: steps.reconcile.outputs.decision == 'REQUEUE_TASK'
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_SOURCE_RUN_ID: ${{ steps.wait.outputs.wait_run_id }}
        run: |
          set -euo pipefail
          gh workflow run real-agent-self-improvement.yml             --repo "$GITHUB_REPOSITORY"             --ref "$TARGET_REF"             -f operation=MISSION             -f resume_from_run_id="$WAIT_SOURCE_RUN_ID"             -f resume_from_artifact_name="real-agent-self-improvement-$WAIT_SOURCE_RUN_ID"             -f provider_reconciliation_run_id="$GITHUB_RUN_ID"             -f provider_reconciliation_artifact_name="provider-availability-reconciliation-$GITHUB_RUN_ID"
          echo "RECONCILIATION_WAKE=PASS"
          echo "EFFECTIVE_POOL_REBUILT=PASS"
          echo "REQUEUE_TASK=PASS"
          echo "SAME_MISSION_ID=PASS"

      - name: Confirm nonterminal still-waiting semantics
        if: steps.reconcile.outputs.decision == 'STILL_WAITING'
        run: |
          echo "ITERATION_RESULT=NONTERMINAL_WAIT"
          echo "MISSION_TERMINAL=FALSE"
          echo "HUMAN_INTERVENTION_REQUIRED=FALSE"
          echo "NO_PROVIDER_CALL_ON_UNCHANGED_POOL=PASS"
          echo "NO_LONG_SLEEP_IN_GITHUB_RUNNER=PASS"
