name: Real Agent Self Improvement Mission

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "scripts/real_agent_self_improvement_mission.py"
      - "scripts/zero_cost_route_inventory.py"
      - "tests/test_zero_cost_route_inventory.py"
      - "scripts/dynamic_system_improvement_mission.py"
      - "app/services/execution_mission_envelope_service.py"
      - "app/services/harness_adaptive_planning_service.py"
      - "app/services/harness_executor_availability_service.py"
      - "app/services/harness_collaboration_service.py"
      - "app/services/addy_harness_service.py"
      - "app/services/agent_session_service.py"
      - "app/services/hermes_multiagent/capability_broker.py"
      - "app/services/task_input_contract_service.py"
      - "app/services/harness_internal_recovery_service.py"
      - "app/services/recovery_execution_service.py"
      - "app/services/semantic_tool_loop_service.py"
      - "app/services/local_openweight_ai_provider.py"
      - "app/services/task_output_contract_service.py"
      - "app/services/global_capability_registry.py"
      - "tests/test_addy_harness_service.py"
      - "tests/test_semantic_agent_tool_loop.py"
      - "tests/test_task_input_contract_service.py"
      - "tests/test_harness_internal_recovery_service.py"
      - "tests/test_recovery_execution_service.py"
      - "tests/test_harness_executor_availability_service.py"
      - "tests/test_harness_collaboration_service.py"
      - ".github/workflows/real-agent-self-improvement.yml"
      - ".run/real-agent-self-improvement.request.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: real-agent-self-improvement-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_CODEX_FEDERATION_CONFIGURED: "false"
  BR_TEST_DATABASE: ${{ github.workspace }}/runtime/real-agent-self-improvement/learning.sqlite3
  BR_PERFORMANCE_TRACE_FILE: ${{ github.workspace }}/runtime/real-agent-self-improvement/performance-trace.jsonl
  BR_PERFORMANCE_TRACE_ID: real-agent-self-improvement:${{ github.run_id }}:${{ github.run_attempt }}

jobs:
  mission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            config/delegation-plane-preflight-extra-requirements.txt

      - name: Install bounded runtime
        run: |
          set -euo pipefail
          started="$(date +%s%N)"
          mkdir -p runtime/real-agent-self-improvement
          python -m pip install --upgrade pip >/dev/null
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt pytest >/dev/null
          python -m pip install --disable-pip-version-check --no-input -r config/delegation-plane-preflight-extra-requirements.txt >/dev/null
          python -m pip check >/dev/null
          finished="$(date +%s%N)"
          python - "$started" "$finished" <<'PY' >> "$GITHUB_ENV"
          import sys
          started=int(sys.argv[1]); finished=int(sys.argv[2])
          print(f"BASE_WORKFLOW_BOOTSTRAP_MS={max(0, finished-started)/1_000_000:.3f}")
          PY

      - name: Focused real-execution contracts
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_task_result_envelope_service.py             tests/test_system_synergy_service.py             tests/test_harness_learning_system.py             tests/test_dynamic_system_improvement_scope.py             tests/test_execution_mission_envelope_service.py             tests/test_production_mission_execution_contracts.py             tests/test_harness_executor_availability_service.py             tests/test_harness_collaboration_service.py             tests/test_addy_harness_service.py             tests/test_semantic_agent_tool_loop.py             tests/test_task_input_contract_service.py             tests/test_harness_internal_recovery_service.py             tests/test_recovery_execution_service.py             tests/test_zero_cost_route_inventory.py
          python -m py_compile scripts/real_agent_self_improvement_mission.py
          echo "REAL_SELF_IMPROVEMENT_FOCUSED_CONTRACTS=PASS"

      - name: Restore exact real production incident evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r SOURCE_RUN SOURCE_ARTIFACT <<EOF
          $(python - <<'PY'
          import json
          d=json.load(open(".run/real-agent-self-improvement.request.json"))
          i=d["incident"]
          print(i["source_run_id"], i["source_artifact_name"])
          PY
          )
          EOF
          root="runtime/real-agent-self-improvement/incident-source"
          mkdir -p "$root"
          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir "$root"
          test -n "$(find "$root" -type f -print -quit)"
          echo "INCIDENT_SOURCE_RUN=$SOURCE_RUN"
          echo "INCIDENT_SOURCE_ARTIFACT=$SOURCE_ARTIFACT"
          echo "REAL_INCIDENT_EVIDENCE_RESTORED=PASS"

          read -r CHECKPOINT_RUN CHECKPOINT_ARTIFACT <<EOF
          $(python - <<'PY'
          import json
          d=json.load(open(".run/real-agent-self-improvement.request.json"))
          c=d.get("checkpoint_source") or {}
          print(c.get("run_id") or "", c.get("artifact_name") or "")
          PY
          )
          EOF
          if [ -n "$CHECKPOINT_RUN" ] && [ -n "$CHECKPOINT_ARTIFACT" ]; then
            checkpoint_root="runtime/real-agent-self-improvement/checkpoint-source"
            checkpoint_stage="runtime/real-agent-self-improvement/checkpoint-stage"
            rm -rf "$checkpoint_root" "$checkpoint_stage"
            mkdir -p "$checkpoint_root" "$checkpoint_stage"
            gh run download "$CHECKPOINT_RUN" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$CHECKPOINT_ARTIFACT" \
              --dir "$checkpoint_stage"
            test -n "$(find "$checkpoint_stage" -type f -print -quit)"

            # The previous artifact contains its own historical checkpoint-source
            # inputs. They are lineage evidence, not the next operational
            # checkpoint. Materialize only files produced by that run itself.
            python - <<'PY'
          from pathlib import Path
          import shutil

          stage=Path("runtime/real-agent-self-improvement/checkpoint-stage")
          target=Path("runtime/real-agent-self-improvement/checkpoint-source")
          copied=0
          for src in sorted(stage.rglob("*")):
              if not src.is_file():
                  continue
              rel=src.relative_to(stage)
              if rel.parts and rel.parts[0] in {
                  "checkpoint-source",
                  "checkpoint-stage",
                  "incident-source",
              }:
                  continue
              dst=target/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)
              copied+=1
          if copied==0:
              raise RuntimeError("canonical checkpoint snapshot is empty")
          nested=[
              p for p in target.rglob("*")
              if p.is_dir() and p.name in {"checkpoint-source","checkpoint-stage"}
          ]
          if nested:
              raise RuntimeError(
                  "recursive checkpoint packaging survived normalization: "
                  +repr([str(p) for p in nested])
              )
          print("CHECKPOINT_RECURSIVE_PACKAGING_ELIMINATED=PASS")
          print("CHECKPOINT_LINEAGE_PRESERVED=PASS")
          print("CHECKPOINT_NESTING_DEPTH_BOUNDED=PASS")
          PY
            rm -rf "$checkpoint_stage"
            echo "NODE_CHECKPOINT_SOURCE_RUN=$CHECKPOINT_RUN"
            echo "NODE_CHECKPOINT_SOURCE_ARTIFACT=$CHECKPOINT_ARTIFACT"
            echo "NODE_CHECKPOINT_SOURCE_RESTORED=PASS"
          fi

      - name: Detect governed provider-level recovery need
        id: provider_recovery
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          from app.services.provider_health_service import (
              semantic_provider_health,
          )

          request=json.load(open(".run/real-agent-self-improvement.request.json"))
          checkpoint=request.get("checkpoint_source") or {}
          agent_instance_id=str(checkpoint.get("agent_instance_id") or "")
          root=Path("runtime/real-agent-self-improvement/checkpoint-source")
          # Artifact packaging may add one or more directory prefixes. Resolve
          # the canonical AgentSession by identity, never by a fixed extraction
          # prefix. Fail closed on missing or ambiguous identity matches.
          sessions=sorted(
              path for path in root.rglob("*.json")
              if path.parent.name=="agent-sessions"
          )
          matches=[]
          expected_task_id=str(
              checkpoint.get("partial_task_id")
              or checkpoint.get("resume_from_task_id")
              or ""
          )
          for path in sessions:
              try:
                  data=json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if data.get("schema")!="AgentSession/v1":
                  continue
              if str(data.get("AGENT_INSTANCE_ID") or "")!=agent_instance_id:
                  continue
              session_task_id=str(
                  data.get("TASK_ID")
                  or data.get("task_id")
                  or ""
              )
              if expected_task_id and session_task_id and session_task_id!=expected_task_id:
                  continue
              matches.append((path,data))

          print("CHECKPOINT_CANONICAL_SNAPSHOT_COUNT="+str(len(matches)))
          if len(matches)!=1:
              raise RuntimeError(
                  "checkpoint AgentSession resolution must yield exactly one "
                  f"identity match; agent_instance_id={agent_instance_id!r} "
                  f"task_id={expected_task_id!r} matches="
                  f"{[str(path) for path,_ in matches]!r}"
              )
          selected_path,selected=matches[0]
          resolved_agent_id=str(selected.get("AGENT_INSTANCE_ID") or "")
          resolved_task_id=str(
              selected.get("TASK_ID")
              or selected.get("task_id")
              or expected_task_id
          )
          resolved_mission_id=str(
              selected.get("MISSION_ID")
              or selected.get("mission_id")
              or ""
          )
          if resolved_agent_id!=agent_instance_id:
              raise RuntimeError("checkpoint AgentSession identity mismatch")
          if expected_task_id and resolved_task_id!=expected_task_id:
              raise RuntimeError("checkpoint AgentSession task mismatch")
          # Mission identity is intrinsic to the restored AgentSession. Require it
          # to be present so a package collision cannot silently cross missions.
          if not resolved_mission_id:
              raise RuntimeError("checkpoint AgentSession missing mission identity")
          print("CHECKPOINT_AGENT_SESSION_RESOLVED=PASS")
          print("CHECKPOINT_AGENT_INSTANCE_ID_MATCH=PASS")
          print("CHECKPOINT_MISSION_ID_MATCH=PASS")
          print("CHECKPOINT_TASK_ID_MATCH=PASS")

          def walk(value):
              if isinstance(value,dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value,list):
                  for child in value:
                      yield from walk(child)

          exhausted=set()
          if selected is not None:
              for node in walk(selected):
                  for item in (
                      node.get("EXHAUSTED_PROVIDER_MODEL_PAIRS")
                      or node.get("exhausted_provider_model_pairs")
                      or []
                  ):
                      if not isinstance(item,dict):
                          continue
                      provider=str(item.get("provider_id") or item.get("provider") or "")
                      model=str(item.get("model_id") or item.get("model") or "")
                      if provider and model:
                          exhausted.add((provider,model))
                  provider_attempt_rows=node.get("PROVIDER_ATTEMPTS")
                  if provider_attempt_rows is None:
                      provider_attempt_rows=node.get("provider_attempts")
                  for item in provider_attempt_rows or []:
                      if not isinstance(item,dict):
                          continue
                      performance=item.get("performance") or {}
                      semantic_failure=bool(
                          isinstance(performance,dict)
                          and (
                              performance.get("output_truncated")
                              or str(performance.get("finish_reason") or "").lower()=="length"
                          )
                      )
                      if str(item.get("status") or "").upper()!="FAILED" and not semantic_failure:
                          continue
                      provider=str(item.get("provider_id") or item.get("provider") or "")
                      model=str(item.get("model_id") or item.get("model") or "")
                      if provider and model:
                          exhausted.add((provider,model))

          preferred=str((selected or {}).get("PROVIDER_ID") or "").strip()
          if not preferred and exhausted:
              preferred=sorted(exhausted)[-1][0]
          health=semantic_provider_health()
          for provider_health_row in health.get("providers") or []:
              print(
                  "PROVIDER_HEALTH="
                  + str(provider_health_row.get("provider_id") or "")
                  + ":"
                  + str(provider_health_row.get("state") or "")
                  + ":zero_cost="
                  + str(bool(provider_health_row.get("zero_cost_eligible"))).lower()
              )
          eligible=[
              str(item).strip()
              for item in health.get("eligible_zero_cost_provider_ids") or []
              if str(item).strip()
          ]
          current_failure=str((selected or {}).get("FAILURE_CLASS") or "").strip()
          current_status=str((selected or {}).get("STATUS") or "").strip().upper()
          final_output_valid=bool((selected or {}).get("FINAL_OUTPUT_VALID"))
          recovery_history=False
          pending_recovery_strategy=False
          local_failed=False
          for node in walk(selected or {}):
              if str(node.get("RECOVERY_STRATEGY") or "").strip():
                  pending_recovery_strategy=True
              for item in (node.get("PROVIDER_ATTEMPTS") or node.get("provider_attempts") or []):
                  if not isinstance(item,dict):
                      continue
                  performance=item.get("performance") or {}
                  failed_contract=bool(isinstance(performance,dict) and performance.get("output_truncated"))
                  if str(item.get("status") or "").upper()!="FAILED" and not failed_contract:
                      continue
                  recovery_history=True
                  if str(item.get("provider_id") or item.get("provider") or "")=="ollama_local":
                      local_failed=True
          budget_during_provider_recovery=bool(
              current_failure=="AgentToolBudgetExceeded"
              and recovery_history and exhausted and not final_output_valid
          )
          provider_level_replan_required=bool(
              selected and current_status in {"FAILED","RUNNING"} and exhausted
              and not final_output_valid
              and (
                  current_failure=="RoutingPolicyError"
                  or budget_during_provider_recovery
                  or pending_recovery_strategy
                  or recovery_history
              )
          )
          if recovery_history:
              print("CAUSAL_FAILURE_CHAIN_RESTORED=PASS")
          if budget_during_provider_recovery:
              print("RECOVERY_FAILURE_CLASS=RECOVERY_BUDGET_EXHAUSTED_DURING_PROVIDER_RECOVERY")
              print("AGENT_TOOL_BUDGET_CAUSE_CLASSIFIED=PASS")
              print("RECOVERY_NOT_TERMINATED_BY_BUDGET_ALONE=PASS")
          if exhausted:
              print("EXHAUSTED_PROVIDER_MODEL_PAIRS_PRESERVED=PASS")
          if local_failed:
              print("FAILED_LOCAL_PROVIDER_NOT_REUSED=PASS")
          print("SAME_AGENT_SESSION_PRESERVED=PASS")

          alternate_route_ready=False
          alternate_route_provider=""
          alternate_route_model=""
          route_rejections=[]
          if provider_level_replan_required:
              from app.services.harness_routing_policy_service import (
                  HarnessRoutingRequest,
                  RoutingPolicyError,
                  route_harness_request,
              )
              try:
                  decision=route_harness_request(
                      HarnessRoutingRequest(
                          intent=(
                              "preflight governed Addy provider-level recovery"
                          ),
                          authorized_action="DEVELOPMENT",
                          domain="ai",
                          task_class=(
                              "addy-semantic:debugging-and-error-recovery"
                          ),
                          required_capability_id="ai.reasoning.text",
                          provider_required=True,
                          provider_domain="ai",
                          allowed_providers=tuple(eligible),
                          exhausted_provider_model_pairs=tuple(
                              sorted(exhausted)
                          ),
                          fallback_allowed=False,
                          zero_cost_operation=True,
                          failure_pattern="provider_model_set_exhausted",
                          learning_required=False,
                          required_model_capabilities=(
                              "reasoning",
                              "semantic_planning",
                              "structured_output",
                          ),
                          structured_output_required=True,
                      )
                  )
                  alternate_route_provider=str(
                      decision.selected_provider or ""
                  ).strip()
                  alternate_route_model=str(
                      decision.selected_model or ""
                  ).strip()
                  alternate_route_ready=bool(
                      alternate_route_provider
                      and alternate_route_model
                      and (
                          alternate_route_provider,
                          alternate_route_model,
                      ) not in exhausted
                  )
                  route_rejections=[
                      item.to_dict() if hasattr(item,"to_dict") else {
                          "candidate_id":item.candidate_id,
                          "stage":item.stage,
                          "reasons":list(item.reasons),
                      }
                      for item in decision.rejected_candidates
                  ]
              except RoutingPolicyError as exc:
                  route_rejections=list(
                      exc.evidence.get("rejected_candidates") or []
                  )
                  alternate_route_ready=False
          print("MODEL_LEVEL_ELIGIBILITY_EVALUATED=PASS")
          for rejection in route_rejections:
              if str(rejection.get("stage") or "")!="provider":
                  continue
              print(
                  "MODEL_ROUTE_REJECTED="
                  + str(rejection.get("candidate_id") or "")
                  + ":"
                  + ",".join(str(x) for x in rejection.get("reasons") or [])
              )

          # Provider-level recovery is a new governed planning stage. Materialize
          # the canonical local zero-cost provider as an additional candidate;
          # Harness routing still selects the winner. This avoids trusting a
          # preflight result that can drift from the execution-time request.
          need=False
          if alternate_route_ready:
              print("NEXT_RECOVERY_STRATEGY_SELECTED=HARNESS_MODEL_ROUTE")
              print("RECOVERY_ROUTE_CHANGED=PASS")
          elif provider_level_replan_required:
              print("NEXT_RECOVERY_STRATEGY_SELECTED=MODEL_HEALTH_RECONCILIATION")
          print("prepare_alt_provider="+("true" if need else "false"))
          print("provider_level_replan_required="+(
              "true" if provider_level_replan_required else "false"
          ))
          print("preferred_provider="+preferred)
          print("eligible_provider_count="+str(len(eligible)))
          print("alternate_route_ready="+(
              "true" if alternate_route_ready else "false"
          ))
          print("alternate_route_provider="+alternate_route_provider)
          print("alternate_route_model="+alternate_route_model)
          print("exhausted_pair_count="+str(len(exhausted)))
          print(
              "provider_candidate_materialization="
              + ("required" if need else "not_required")
          )
          PY
          echo "PROVIDER_LEVEL_RECOVERY_REQUIRED=${{ steps.provider_recovery.outputs.provider_level_replan_required }}"
          echo "PREEXISTING_ALTERNATE_ROUTE_READY=${{ steps.provider_recovery.outputs.alternate_route_ready }}"
          echo "PREEXISTING_ALTERNATE_ROUTE_PROVIDER=${{ steps.provider_recovery.outputs.alternate_route_provider }}"
          echo "MATERIALIZE_CANONICAL_LOCAL_PROVIDER=${{ steps.provider_recovery.outputs.prepare_alt_provider }}"

      - name: Close canonical route inventory
        if: steps.provider_recovery.outputs.provider_level_replan_required == 'true' && steps.provider_recovery.outputs.alternate_route_ready != 'true'
        id: route_inventory
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/zero_cost_route_inventory.py \
            --checkpoint-root runtime/real-agent-self-improvement/checkpoint-source \
            --request .run/real-agent-self-improvement.request.json \
            --output runtime/real-agent-self-improvement/zero-cost-route-inventory.json
          echo "route_inventory_closed=true" >> "$GITHUB_OUTPUT"

      - name: Prepare bounded local zero-cost alternate provider
        if: steps.provider_recovery.outputs.prepare_alt_provider == 'true'
        timeout-minutes: 10
        env:
          OLLAMA_HOST: "127.0.0.1:11434"
          OLLAMA_NO_CLOUD: "1"
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          test "$REPOSITORY_PRIVATE" = "false"
          read -r OLLAMA_VERSION OLLAMA_MODEL OLLAMA_EXPECTED_DIGEST <<EOF
          $(python - <<'PY'
          from app.services.local_openweight_ai_provider import (
              LOCAL_OPENWEIGHT_MODEL_DIGEST,
              LOCAL_OPENWEIGHT_MODEL_ID,
              LOCAL_OPENWEIGHT_OLLAMA_VERSION,
          )
          print(
              LOCAL_OPENWEIGHT_OLLAMA_VERSION,
              LOCAL_OPENWEIGHT_MODEL_ID,
              LOCAL_OPENWEIGHT_MODEL_DIGEST,
          )
          PY
          )
          EOF
          export OLLAMA_VERSION OLLAMA_MODEL OLLAMA_EXPECTED_DIGEST

          mkdir -p runtime/real-agent-self-improvement/local-provider
          command -v zstd >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          }
          curl --fail --show-error --location             "https://raw.githubusercontent.com/ollama/ollama/v$OLLAMA_VERSION/scripts/install.sh"             -o runtime/real-agent-self-improvement/local-provider/ollama-install.sh
          OLLAMA_VERSION="$OLLAMA_VERSION" OLLAMA_NO_START=1             sh runtime/real-agent-self-improvement/local-provider/ollama-install.sh
          ollama --version | grep -F "$OLLAMA_VERSION"

          nohup env             OLLAMA_HOST="$OLLAMA_HOST"             OLLAMA_NO_CLOUD="$OLLAMA_NO_CLOUD"             ollama serve             > runtime/real-agent-self-improvement/local-provider/ollama.log 2>&1 &
          echo "$!" > runtime/real-agent-self-improvement/local-provider/ollama.pid

          READY=0
          for i in {1..60}; do
            if ! kill -0 "$(cat runtime/real-agent-self-improvement/local-provider/ollama.pid)" 2>/dev/null; then
              break
            fi
            if curl --connect-timeout 1 --max-time 2 -fsS               http://127.0.0.1:11434/api/tags               > runtime/real-agent-self-improvement/local-provider/tags-before.json 2>/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = "1"

          ollama pull "$OLLAMA_MODEL"             | tee runtime/real-agent-self-improvement/local-provider/model-pull.txt
          curl --fail --show-error --silent             http://127.0.0.1:11434/api/tags             > runtime/real-agent-self-improvement/local-provider/tags-after.json

          python - <<'PY'
          import json, os
          data=json.load(open(
              "runtime/real-agent-self-improvement/local-provider/tags-after.json"
          ))
          expected_model=os.environ["OLLAMA_MODEL"]
          expected_digest=os.environ["OLLAMA_EXPECTED_DIGEST"]
          rows=[
              item for item in data.get("models",[])
              if item.get("name")==expected_model or item.get("model")==expected_model
          ]
          assert len(rows)==1, rows
          digest=str(rows[0].get("digest") or "").removeprefix("sha256:")
          assert digest==expected_digest, (digest,expected_digest)
          print("ALTERNATE_PROVIDER_MODEL_IDENTITY=PASS")
          PY

          {
            echo "BR_LOCAL_OPENWEIGHT_ENABLED=1"
            echo "BR_LOCAL_OPENWEIGHT_URL=http://127.0.0.1:11434"
          } >> "$GITHUB_ENV"
          echo "PROVIDER_MODEL_SET_EXHAUSTED_CLASSIFIED=PASS"
          echo "ALTERNATE_PROVIDER_RUNTIME=ollama_local"
          echo "ALTERNATE_PROVIDER_ZERO_COST=PASS"
          echo "ALTERNATE_PROVIDER_IDENTITY_SOURCE=CANONICAL_PROVIDER_MODULE"

      - name: Execute real natural-goal self-improvement mission
        if: steps.route_inventory.outputs.route_inventory_closed != 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/real_agent_self_improvement_mission.py             --output-dir runtime/real-agent-self-improvement             --base-sha "$GITHUB_SHA"             --branch "$GITHUB_REF_NAME"             --request .run/real-agent-self-improvement.request.json             --incident-source-dir runtime/real-agent-self-improvement/incident-source             --checkpoint-source-dir runtime/real-agent-self-improvement/checkpoint-source

      - name: Assert real self-improvement gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          data=json.loads(
              Path("runtime/real-agent-self-improvement/final.json").read_text(
                  encoding="utf-8"
              )
          )
          true_gates=(
