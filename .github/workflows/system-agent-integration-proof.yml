name: System Agent Integration Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - '.github/workflows/system-agent-integration-proof.yml'
      - 'scripts/system_agent_integration_proof.py'
      - 'scripts/validate_system_agent_integration_proof.py'
      - 'scripts/audit_harness_ecosystem.py'
      - 'app/services/global_capability_registry.py'
      - 'app/services/global_capability_registry_base.py'
      - 'app/services/capability_health_service.py'
      - 'app/services/capability_execution_contract_service.py'
      - 'app/services/harness_adaptive_planning_service.py'
      - 'app/services/harness_routing_policy_service.py'
      - 'app/services/harness_learning_service.py'
      - 'app/services/planner_replan_learning_service.py'
      - 'app/services/agent_office/**'
      - 'app/services/hermes_multiagent/**'
      - 'app/services/youtube_department_service.py'
      - 'app/services/gta6_brain*.py'
      - 'app/services/gta6_knowledge*.py'
      - 'app/services/continuous_intelligence_service.py'
      - 'app/services/human_presentation_service.py'
      - 'app/services/obsidian_memory_service.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      BR_TEST_DATABASE: /tmp/br-system-agent-integration.db
      BR_CODEX_FEDERATION_CONFIGURED: ${{ (vars.OPENAI_FEDERATION_RULE_ID != '' && vars.OPENAI_FEDERATION_AUDIENCE != '') && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deterministic proof runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile integration proof
        run: |
          set -euo pipefail
          python -m py_compile scripts/system_agent_integration_proof.py scripts/validate_system_agent_integration_proof.py scripts/audit_harness_ecosystem.py
          echo "SYSTEM_AGENT_INTEGRATION_COMPILE=PASS"

      - name: Prove total agent integration deterministically
        run: |
          set -euo pipefail
          python scripts/system_agent_integration_proof.py --output runtime/system-agent-integration/system-agent-integration.json

      - name: Validate canonical observational integration artifact
        run: |
          set -euo pipefail
          python scripts/validate_system_agent_integration_proof.py --input runtime/system-agent-integration/system-agent-integration.json

      - name: Run focused contract and boundary tests
        run: |
          set -euo pipefail
          pytest -q             tests/test_harness_ecosystem_inventory.py             tests/test_global_capability_registry.py             tests/test_capability_execution_contract_service.py             tests/test_capability_health_service.py             tests/test_harness_executor_availability_service.py             tests/test_native_capability_boundaries.py             tests/test_gta6_brain_harness_boundary.py             tests/test_harness_hermes_delegation_plane.py
          echo "SYSTEM_AGENT_INTEGRATION_FOCUSED_TESTS=PASS"

      - name: Upload canonical integration matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-agent-integration-${{ github.run_id }}
          path: runtime/system-agent-integration/
          if-no-files-found: error
          retention-days: 30
