name: System Agent Integration Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - '.github/workflows/system-agent-integration-proof.yml'
      - 'scripts/system_agent_integration_proof.py'
      - 'scripts/audit_harness_ecosystem.py'
      - 'app/services/global_capability_registry.py'
      - 'app/services/global_capability_registry_base.py'
      - 'app/services/capability_health_service.py'
      - 'app/services/capability_execution_contract_service.py'
      - 'app/services/harness_adaptive_planning_service.py'
      - 'app/services/harness_routing_policy_service.py'
      - 'app/services/harness_learning_service.py'
      - 'app/services/planner_replan_learning_service.py'
      - 'app/services/agent_office/**'
      - 'app/services/hermes_multiagent/**'
      - 'app/services/youtube_department_service.py'
      - 'app/services/gta6_brain*.py'
      - 'app/services/gta6_knowledge*.py'
      - 'app/services/continuous_intelligence_service.py'
      - 'app/services/human_presentation_service.py'
      - 'app/services/obsidian_memory_service.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      BR_TEST_DATABASE: /tmp/br-system-agent-integration.db
      BR_CODEX_FEDERATION_CONFIGURED: ${{ (vars.OPENAI_FEDERATION_RULE_ID != '' && vars.OPENAI_FEDERATION_AUDIENCE != '') && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deterministic proof runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile integration proof
        run: |
          set -euo pipefail
          python -m py_compile             scripts/system_agent_integration_proof.py             scripts/audit_harness_ecosystem.py
          echo "SYSTEM_AGENT_INTEGRATION_COMPILE=PASS"

      - name: Prove total agent integration deterministically
        run: |
          set -euo pipefail
          python scripts/system_agent_integration_proof.py             --output runtime/system-agent-integration/system-agent-integration.json

      - name: Assert canonical integration gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("runtime/system-agent-integration/system-agent-integration.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          gates = d["gates"]

          required = (
              "ALL_ACTIVE_CAPABILITIES_DISCOVERABLE",
              "ALL_AGENT_IDENTITIES_CANONICAL",
              "EXECUTOR_BINDINGS_VALID",
              "EXECUTION_CONTRACTS_VALID",
              "HEALTH_POLICIES_VALID",
              "AUTHORITY_BOUNDARIES_VALID",
              "ALL_AGENTS_DISCOVERABLE",
              "ALL_CAPABILITIES_ROUTABLE_WHERE_AUTHORIZED",
              "NEGATIVE_ROUTING_GATES",
              "NO_AGENT_WITHOUT_BOUNDARY",
              "NO_ORPHAN_ACTIVE_CAPABILITY",
              "NO_DUPLICATE_AUTHORITY",
              "NO_SECOND_CONTROL_PLANE",
              "SYSTEM_AGENT_INVENTORY_PROOF",
              "CODEX_DISCOVERABLE",
              "CODEX_EXECUTION_CONTRACT",
              "CODEX_ROUTABLE_WHEN_AUTH_AVAILABLE",
              "CODEX_BLOCKER_EXPLICIT",
              "REAL_FAILURE_EPISODES_LINKED",
              "FAILURE_DOMAIN_CORRECT",
              "PROVIDER_COMPETENCE_NOT_WRONGLY_PENALIZED",
              "NEXT_SIMILAR_DECISION_CAN_READ_MEMORY",
              "SYSTEM_AGENT_INTEGRATION",
          )
          for key in required:
              assert gates[key] is True, (key, gates[key])

          assert d["authority"] == "DEEPSEEK_HARNESS"
          assert d["CANONICAL_AUTH_CHECKPOINT"] == "35850473901"
          assert d["MISSION_STATE"] == "WAITING_FOR_EXTERNAL_AUTH"
          assert d["EXTERNAL_HUMAN_BLOCKER"] == "CODEX_NONINTERACTIVE_AUTH_CONFIGURATION"
          assert d["NO_NEW_NATURAL_SWARM"] is True
          assert d["NO_SEMANTIC_REPLAN"] is True
          assert d["NO_NVIDIA_CALL"] is True
          assert d["ORPHANS_FOUND"] == 0
          assert d["BROKEN_BINDINGS_FOUND"] == 0
          assert d["DUPLICATE_AUTHORITIES_FOUND"] == 0
          assert d["INVALID_EXECUTION_CONTRACTS_FOUND"] == 0
          assert d["CODEX_CURRENT_STATE"] == "BLOCKED"

          codex = [
              row for row in d["matrix"]
              if row["CAPABILITY_ID"].startswith("agent-office.codex.")
          ]
          assert len(codex) == 2
          assert all(row["STATUS"] == "BLOCKED_EXTERNAL" for row in codex)
          assert all(row["CURRENT_HEALTH"] == "BLOCKED" for row in codex)
          assert all(row["DISCOVERABLE"] for row in codex)
          assert all(row["HARNESS_ROUTE_AVAILABLE"] for row in codex)

          assert len(d["routing_cases"]) == 9
          assert all(
              case["SELECTION_FROM_REGISTRY"] is True
              and case["HARDCODED_AGENT_SELECTION"] is False
              for case in d["routing_cases"]
          )
          assert all(d["negative_routing"].values())

          print("CODEX_DISCOVERABLE=PASS")
          print("CODEX_EXECUTION_CONTRACT=PASS")
          print("CODEX_ROUTABLE_WHEN_AUTH_AVAILABLE=PASS")
          print("CODEX_CURRENT_HEALTH=BLOCKED_EXTERNAL")
          print("CODEX_BLOCKER_EXPLICIT=PASS")
          print("NEGATIVE_ROUTING_GATES=PASS")
          print("REAL_FAILURE_EPISODES_LINKED=PASS")
          print("FAILURE_DOMAIN_CORRECT=PASS")
          print("PROVIDER_COMPETENCE_NOT_WRONGLY_PENALIZED=PASS")
          print("NEXT_SIMILAR_DECISION_CAN_READ_MEMORY=PASS")
          print("CANONICAL_CHECKPOINT=35850473901")
          print("NO_NEW_NATURAL_SWARM=PASS")
          print("NO_SEMANTIC_REPLAN=PASS")
          print("NO_NVIDIA_CALL=PASS")
          print("SYSTEM_AGENT_INTEGRATION=PASS")
          PY

      - name: Run focused contract and boundary tests
        run: |
          set -euo pipefail
          pytest -q             tests/test_harness_ecosystem_inventory.py             tests/test_global_capability_registry.py             tests/test_capability_execution_contract_service.py             tests/test_capability_health_service.py             tests/test_harness_executor_availability_service.py             tests/test_native_capability_boundaries.py             tests/test_gta6_brain_harness_boundary.py             tests/test_harness_hermes_delegation_plane.py
          echo "SYSTEM_AGENT_INTEGRATION_FOCUSED_TESTS=PASS"

      - name: Upload canonical integration matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-agent-integration-${{ github.run_id }}
          path: runtime/system-agent-integration/
          if-no-files-found: error
          retention-days: 30
