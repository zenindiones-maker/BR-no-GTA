name: Hermes Durable Resume Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".github/workflows/hermes-durable-resume-proof.yml"
      - ".run/hermes-durable-resume-proof.request.json"

permissions:
  contents: read

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"

jobs:
  runner-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install bounded runtime
        run: |
          set -euo pipefail
          mkdir -p .runtime artifacts/hermes-durable-resume
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install psutil==7.2.2 pyyaml==6.0.3 python-dotenv==1.2.2 rich==14.3.3 pathspec==1.1.1
      - name: Bootstrap pinned Hermes
        run: |
          set -euo pipefail
          python scripts/bootstrap_hermes_agent.py             --target "$GITHUB_WORKSPACE/.runtime/hermes-agent"             --output artifacts/hermes-durable-resume/upstream-a.json
          test "$(git -C "$GITHUB_WORKSPACE/.runtime/hermes-agent" rev-parse HEAD)" = "9eca7f388f71755293343dddd6ec4d9111d68fc4"
      - name: Focused durable checkpoint regression
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/hermes-durable-resume/runner-a-test.db
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_harness_hermes_delegation_plane.py::test_durable_checkpoint_restores_results_into_clean_runner
      - name: Execute runner A partial mission
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/hermes-durable-resume/runner-a.db
        run: |
          set -euo pipefail
          python scripts/hermes_durable_resume_proof.py             --phase a             --base-sha "$GITHUB_SHA"             --upstream-root "$GITHUB_WORKSPACE/.runtime/hermes-agent"             --hermes-home "$GITHUB_WORKSPACE/.runtime/hermes-home-a"             --artifact-dir "$GITHUB_WORKSPACE/artifacts/hermes-durable-resume/runner-a"             --checkpoint-dir "$GITHUB_WORKSPACE/artifacts/hermes-durable-resume/checkpoint"
          test -s artifacts/hermes-durable-resume/checkpoint/manifest.json
          echo "DURABLE_MISSION_CHECKPOINT_CREATED=PASS"
          echo "CI_REAL_TELEGRAM_EGRESS=0"
      - name: Upload durable checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: hermes-durable-checkpoint-${{ github.run_id }}
          path: artifacts/hermes-durable-resume/checkpoint/
          if-no-files-found: error
          retention-days: 14
      - name: Upload runner A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-durable-runner-a-${{ github.run_id }}
          path: artifacts/hermes-durable-resume/runner-a/
          if-no-files-found: warn
          retention-days: 14

  runner-b:
    needs: runner-a
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install clean runner runtime
        run: |
          set -euo pipefail
          mkdir -p .runtime artifacts/hermes-durable-resume/checkpoint artifacts/hermes-durable-resume/runner-b
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install psutil==7.2.2 pyyaml==6.0.3 python-dotenv==1.2.2 rich==14.3.3 pathspec==1.1.1
      - name: Bootstrap pinned Hermes independently
        run: |
          set -euo pipefail
          python scripts/bootstrap_hermes_agent.py             --target "$GITHUB_WORKSPACE/.runtime/hermes-agent"             --output artifacts/hermes-durable-resume/upstream-b.json
          test "$(git -C "$GITHUB_WORKSPACE/.runtime/hermes-agent" rev-parse HEAD)" = "9eca7f388f71755293343dddd6ec4d9111d68fc4"
      - name: Download runner A checkpoint
        uses: actions/download-artifact@v4
        with:
          name: hermes-durable-checkpoint-${{ github.run_id }}
          path: artifacts/hermes-durable-resume/checkpoint
      - name: Prove runner B durable resume
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/hermes-durable-resume/runner-b.db
        run: |
          set -euo pipefail
          test ! -e "$GITHUB_WORKSPACE/.runtime/hermes-home-b"
          python scripts/hermes_durable_resume_proof.py             --phase b             --base-sha "$GITHUB_SHA"             --upstream-root "$GITHUB_WORKSPACE/.runtime/hermes-agent"             --hermes-home "$GITHUB_WORKSPACE/.runtime/hermes-home-b"             --artifact-dir "$GITHUB_WORKSPACE/artifacts/hermes-durable-resume/runner-b"             --checkpoint-dir "$GITHUB_WORKSPACE/artifacts/hermes-durable-resume/checkpoint"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("artifacts/hermes-durable-resume/runner-b/runner-b-proof.json").read_text())
          assert data["DURABLE_MISSION_RESUME"]=="PASS"
          assert data["DUPLICATE_AGENT_EXECUTION_AVOIDED"]=="PASS"
          assert data["CROSS_RUNNER_TYPED_HANDOFF"]=="PASS"
          assert data["HERMES_AUTHORITY_EXPANSION"]=="NO"
          assert data["primary_result_file_count"]==1
          assert data["dependent_result_file_count"]==1
          print("DURABLE_MISSION_RESUME=PASS")
          print("SAME_MISSION_IDENTITY_AFTER_RUNNER_RESTART=PASS")
          print("COMPLETED_WORK_NOT_REPEATED=PASS")
          print("DUPLICATE_AGENT_EXECUTION_AVOIDED=PASS")
          print("CROSS_AGENT_EVIDENCE_LINEAGE=PASS")
          print("HERMES_AUTHORITY_EXPANSION=NO")
          print("CI_REAL_TELEGRAM_EGRESS=0")
          PY
      - name: Upload runner B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-durable-runner-b-${{ github.run_id }}
          path: artifacts/hermes-durable-resume/runner-b/
          if-no-files-found: error
          retention-days: 14
