name: Owner Voice Delivery Hardening V2 - Contract Only
on:
  push:
    branches:
      - work/owner-voice-safe-ingress-recovery-20261010
    paths:
      - "tests/test_owner_voice_transport_hardening_v2.py"
      - "scripts/owner_voice_single_clone_delivery.py"
      - "scripts/owner_voice_single_human_clone.py"
      - "app/services/owner_voice_delivery_codec_v2.py"
      - "app/services/owner_voice_single_clone_delivery_service.py"
      - ".github/workflows/owner-voice-single-human-clone.yml"
      - ".github/workflows/owner-voice-delivery-hardening-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    name: No-send format/ledger regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check -q pytest==8.4.2 python-dotenv==1.2.3 packaging
      - name: Verify synthetic codec and ledger
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          python -m pytest -q tests/test_owner_voice_transport_hardening_v2.py tests/test_owner_voice_single_clone_delivery_v1.py
          echo "VOICE_DELIVERY_HARDENING_CONTRACT=PASS"
          echo "TELEGRAM_SEND_ATTEMPTED=FALSE"
          echo "OWNER_VOICE_AUDIO_MATERIALIZED=FALSE"
