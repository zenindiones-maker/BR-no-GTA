name: Codex Cloud RUN-001

on:
  push:
    branches:
      - codex/run-001-app
    paths:
      - ".github/workflows/codex-cloud.yml"
      - ".github/codex/run-001.txt"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: codex-run-001-app
  cancel-in-progress: false

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Codex branch
        uses: actions/checkout@v4
        with:
          ref: codex/run-001-app
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Codex SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai-codex

      - name: Verify Codex installation
        run: |
          python - <<'PY'
          import openai_codex
          from openai_codex import Codex

          print("openai_codex imported successfully")

          with Codex():
              print("Codex runtime initialized successfully")
          PY

      - name: Start ChatGPT device authentication
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          rm -rf .codex-device-auth
          mkdir -p .codex-device-auth

          cat > /tmp/codex_device_login.py <<'PYCODE'
          from pathlib import Path
          from openai_codex import Codex

          directory = Path(".codex-device-auth")
          directory.mkdir(exist_ok=True)

          try:
              with Codex() as codex:
                  login = codex.login_chatgpt_device_code()

                  (directory / "device.txt").write_text(
                      "Open this URL:\n"
                      f"{login.verification_url}\n\n"
                      "Enter this code:\n"
                      f"{login.user_code}\n",
                      encoding="utf-8",
                  )

                  result = login.wait()

                  if result.success:
                      (directory / "result.txt").write_text(
                          "SUCCESS\n",
                          encoding="utf-8",
                      )
                  else:
                      (directory / "result.txt").write_text(
                          "FAILED\n",
                          encoding="utf-8",
                      )

          except Exception as exc:
              (directory / "result.txt").write_text(
                  f"ERROR: {type(exc).__name__}: {exc}\n",
                  encoding="utf-8",
              )
              raise
          PYCODE

          env RUNNER_TRACKING_ID= \
            nohup python /tmp/codex_device_login.py \
            > .codex-device-auth/login.log 2>&1 < /dev/null &

          LOGIN_PID=$!
          echo "$LOGIN_PID" > .codex-device-auth/pid

          echo "Background login PID: $LOGIN_PID"

          for i in $(seq 1 60); do
            if [ -s .codex-device-auth/device.txt ]; then
              echo "Device authorization request generated."
              exit 0
            fi

            if ! kill -0 "$LOGIN_PID" 2>/dev/null; then
              echo "Background login process terminated unexpectedly."
              cat .codex-device-auth/login.log || true
              exit 1
            fi

            sleep 1
          done

          echo "Device authorization request was not generated."
          cat .codex-device-auth/login.log || true
          exit 1

      - name: Upload temporary device authorization
        uses: actions/upload-artifact@v4
        with:
          name: codex-device-auth
          path: .codex-device-auth/device.txt
          retention-days: 1
          if-no-files-found: error

      - name: Wait for ChatGPT authorization
        run: |
          echo "Waiting for ChatGPT device authorization..."

          for i in $(seq 1 180); do
            if [ -s .codex-device-auth/result.txt ]; then
              cat .codex-device-auth/result.txt

              grep -qx "SUCCESS" .codex-device-auth/result.txt
              exit $?
            fi

            sleep 5
          done

          echo "Timed out waiting for ChatGPT authorization."
          cat .codex-device-auth/login.log || true
          exit 1

      - name: Verify authenticated Codex account
        run: |
          python - <<'PY'
          from openai_codex import Codex

          with Codex() as codex:
              account = codex.account()

          if not account:
              raise SystemExit("Authenticated Codex account unavailable")

          print("Codex account authentication: PASS")
          PY

      - name: Run RUN-001 Codex task
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          from pathlib import Path
          from openai_codex import Codex

          prompt = Path(
              ".github/codex/run-001.txt"
          ).read_text(encoding="utf-8")

          with Codex() as codex:
              thread = codex.start_thread(cwd=".")
              result = thread.run(prompt)

          print("")
          print("==========================================")
          print("CODEX FINAL RESPONSE")
          print("==========================================")
          print(result.output_text)
          PY

      - name: Repository status
        if: always()
        run: |
          echo "=== STATUS ==="
          git status --short

          echo
          echo "=== DIFF STAT ==="
          git diff --stat || true

      - name: Commit Codex changes
        run: |
          rm -rf .codex-device-auth

          if [ -z "$(git status --porcelain)" ]; then
            echo "Codex produced no repository changes."
            exit 1
          fi

          git add -A

          git commit \
            -m "feat(run-001): close Codex canary input contracts (#2)"

          git push origin HEAD:codex/run-001-app

      - name: Report PR state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 4 \
            --repo "${{ github.repository }}" \
            --body "Codex cloud runner completed RUN-001 application work at commit $(git rev-parse HEAD). Review test evidence and CANARY INPUT handoff."
