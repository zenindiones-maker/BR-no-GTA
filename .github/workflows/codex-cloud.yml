name: Codex Cloud RUN-001

on:
  push:
    branches:
      - codex/run-001-app

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: codex-run-001-app
  cancel-in-progress: false

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Codex branch
        uses: actions/checkout@v4
        with:
          ref: codex/run-001-app
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Codex SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai-codex

      - name: Login to Codex with ChatGPT device code
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          from openai_codex import Codex

          with Codex() as codex:
              login = codex.login_chatgpt_device_code()

              print("")
              print("==========================================")
              print("CODEX CHATGPT DEVICE AUTH")
              print("==========================================")
              print("URL:", login.verification_url)
              print("CODE:", login.user_code)
              print("==========================================")
              print("")
              print("Autorize esta sessão no navegador.")
              print("Aguardando autorização...", flush=True)

              result = login.wait()

              print("")
              print("LOGIN SUCCESS:", result.success, flush=True)

              if not result.success:
                  raise SystemExit("Codex ChatGPT authentication failed")
          PY

      - name: Verify Codex account
        run: |
          python - <<'PY'
          from openai_codex import Codex

          with Codex() as codex:
              account = codex.account()
              print("Codex account available:", bool(account))
          PY

      - name: Run RUN-001 Codex task
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          from pathlib import Path
          from openai_codex import Codex

          prompt = Path(".github/codex/run-001.txt").read_text()

          with Codex() as codex:
              thread = codex.start_thread(
                  cwd=".",
              )

              result = thread.run(prompt)

              print("")
              print("==========================================")
              print("CODEX FINAL RESPONSE")
              print("==========================================")
              print(result.output_text)
          PY

      - name: Run repository status
        if: always()
        run: |
          echo "=== STATUS ==="
          git status --short
          echo
          echo "=== DIFF STAT ==="
          git diff --stat || true

      - name: Commit Codex changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Codex produced no repository changes."
            exit 1
          fi

          git add -A

          git commit -m "feat(run-001): close Codex canary input contracts (#2)"

          git push origin HEAD:codex/run-001-app

      - name: Report PR state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 4 \
            --repo "${{ github.repository }}" \
            --body "Codex cloud runner completed a RUN-001 application pass at commit $(git rev-parse HEAD). Review the new application/contracts changes and test evidence before handing CANARY INPUT to PR #5."
