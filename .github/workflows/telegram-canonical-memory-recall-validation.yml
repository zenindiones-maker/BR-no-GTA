name: Telegram Canonical Memory Recall Validation

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/telegram-canonical-memory-recall.request.json"
      - ".github/workflows/telegram-canonical-memory-recall-validation.yml"

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  SCHEDULED_PROOF_RUN_ID: "35590666727"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          mkdir -p artifacts/telegram-canonical-memory/state

      - name: Restore real canonical checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$SCHEDULED_PROOF_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name "continuous-operation-state-$SCHEDULED_PROOF_RUN_ID"             --dir artifacts/telegram-canonical-memory/state
          test -s artifacts/telegram-canonical-memory/state/continuous.db
          test -s artifacts/telegram-canonical-memory/state/state-manifest.json
          echo "CANONICAL_CHECKPOINT_RESTORED=PASS"

      - name: Prove provider-free Telegram knowledge recall from real state
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/telegram-canonical-memory/state/continuous.db
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.services.telegram_conversation_service import handle_telegram_conversation

          provider_calls=0
          action_calls=0
          progress=[]

          def provider(*args, **kwargs):
              global provider_calls
              provider_calls += 1
              raise AssertionError("ai.reasoning.text must not be called")

          def action(*args, **kwargs):
              global action_calls
              action_calls += 1
              raise AssertionError("knowledge recall must not dispatch execution")

          def presenter(canonical, **kwargs):
              return {"text": canonical.get("answer", "")}

          literal_input="Conhecimento"
          result=handle_telegram_conversation(
              literal_input,
              telegram_chat_id=770001,
              telegram_user_id=1770001,
              telegram_chat_type="private",
              telegram_message_id=770002,
              chat_handler=provider,
              action_executor=action,
              progress_callback=lambda stage, message: progress.append((stage, message)),
              presenter=presenter,
          )
          canonical=result["canonical_result"]
          assert literal_input=="Conhecimento"
          assert result["intent"]=="KNOWLEDGE_RECALL_REQUEST", result["intent"]
          assert result["plan"]["kind"]=="KNOWLEDGE_RECALL", result["plan"]
          assert result["intent_resolution"]["layer"]=="LAYER_2_CONTEXT", result["intent_resolution"]
          assert canonical["status"]=="CANONICAL_KNOWLEDGE_RECALLED", canonical
          assert canonical["provider_independent"] is True
          assert canonical["provider_calls"]==0
          assert canonical["semantic_provider_required"] is False
          assert canonical["canonical_memory_plane"]=="BR_SQLITE"
          assert canonical["claims"]
          assert any(
              "rockstargames.com" in str(row.get("source_url") or "")
              for row in canonical["claims"]
          ), canonical["claims"]
          assert "SEMANTIC_REASONING_PROVIDER_UNAVAILABLE" not in result["answer"]
          assert provider_calls==0
          assert action_calls==0
          assert progress==[]

          specific=handle_telegram_conversation(
              "Conhecimento sobre Jason Duval",
              telegram_chat_id=770001,
              telegram_message_id=770003,
              chat_handler=provider,
              action_executor=action,
              presenter=presenter,
          )
          sc=specific["canonical_result"]
          assert sc["status"]=="CANONICAL_KNOWLEDGE_RECALLED"
          assert any(
              str(row.get("subject") or "").casefold()=="jason duval"
              for row in sc["claims"]
          ), sc["claims"]
          assert any(
              "only-in-leonida" in str(row.get("source_url") or "")
              for row in sc["claims"]
          ), sc["claims"]
          assert provider_calls==0
          assert action_calls==0

          miss=handle_telegram_conversation(
              "Conhecimento sobre gta 7",
              telegram_chat_id=770001,
              telegram_message_id=770004,
              chat_handler=provider,
              action_executor=action,
              presenter=presenter,
          )
          mc=miss["canonical_result"]
          assert mc["status"]=="NO_CANONICAL_KNOWLEDGE_MATCH"
          assert mc["provider_independent"] is True
          assert mc["provider_calls"]==0
          assert not mc["claims"]
          assert provider_calls==0
          assert action_calls==0

          print("HUMAN_INPUT_LITERAL_MATCH=PASS")
          print("SHORT_UTTERANCE_CONTEXT_RESOLUTION=PASS")
          print("KNOWLEDGE_RECALL_PROVIDER_FREE=PASS")
          print("TELEGRAM_CANONICAL_KNOWLEDGE_RECALL=PASS")
          print("STATUS_PROVIDER_INDEPENDENT=PASS")
          print("KNOWLEDGE_PROVIDER_CALLS=0")
          print("SOURCE_PROVENANCE_PRESERVED=PASS")
          print("GTA7_MEMORY_MISS_NOT_PROVIDER_FAILURE=PASS")
          PY

      - name: Run natural interaction and routing focused regressions
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/telegram-canonical-memory/focused.db
        run: |
          set -euo pipefail
          rm -f "$BR_TEST_DATABASE"
          python -m pytest -q             tests/test_telegram_conversation_control.py::test_literal_conhecimento_uses_context_before_provider             tests/test_telegram_conversation_control.py::test_literal_memoria_recalls_canonical_human_decision_provider_free             tests/test_telegram_conversation_control.py::test_literal_continua_resolves_against_active_goal_without_provider             tests/test_telegram_conversation_control.py::test_literal_melhora_sistema_enters_harness_mission_planner_without_provider             tests/test_telegram_conversation_control.py::test_natural_agent_phrase_needs_no_hermes_keyword             tests/test_telegram_conversation_control.py::test_explicit_guarda_is_governed_memory_candidate_not_auto_promotion             tests/test_harness_mission_planner.py::test_execution_router_keeps_known_missions_off_provider_fallback             tests/test_operational_routing_governance.py
          echo "TELEGRAM_NATURAL_INTERACTION=PASS"
          echo "MEMORY_RECALL_PROVIDER_FREE=PASS"
          echo "STATUS_PROVIDER_FREE=PASS"
          echo "HARNESS_MISSION_PLANNER=PASS"
          echo "MISSION_EXECUTION_ROUTER=PASS"
          echo "NO_KEYWORD_REQUIRED_FOR_HERMES=PASS"
          echo "TELEGRAM_MEMORY_WRITE_GOVERNED=PASS"
          echo "CAPABILITY_USAGE_AUDIT=PASS"
          echo "NO_UNRELATED_WORKFLOW_FANOUT=PASS"

      - name: Prove canonical state feeds Obsidian projection
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/telegram-canonical-memory/state/continuous.db
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from app.services.obsidian_memory_service import export_obsidian_memory_projection

          root=Path("artifacts/telegram-canonical-memory/obsidian-memory-export")
          manifest=export_obsidian_memory_projection(
              output_root=root,
              system_state={
                  "head":"${{ github.sha }}",
                  "status":"OBSERVED",
                  "evidence_refs":["github:run:35590666727"],
                  "new_voice_synthesis":"NO",
                  "full_render":"NO",
                  "youtube_upload":"NO",
                  "youtube_publication":"NO",
              },
              project_goals={
                  "VIDEO-A":"93f99ddc-09c7-474b-8849-6981aa78d60c",
              },
          )
          jason=root/"40-Knowledge/GTA6/Characters/Jason-Duval.md"
          assert jason.is_file(), manifest
          text=jason.read_text(encoding="utf-8")
          assert "Jason Duval" in text
          assert "rockstargames.com/VI/only-in-leonida" in text
          assert manifest["OBSIDIAN_CANONICAL_MEMORY"]=="NO"
          assert manifest["TERMUX_HEAVY_PROCESSING"]=="NO"
          print("OBSIDIAN_KNOWLEDGE_PROJECTION=PASS")
          print("OBSIDIAN_FED_FROM_CANONICAL_SQLITE=PASS")
          print("OBSIDIAN_CANONICAL_MEMORY=NO")
          print("TERMUX_HEAVY_PROCESSING=NO")
          PY

      - name: Upload human-memory proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-canonical-memory-${{ github.run_id }}
          path: artifacts/telegram-canonical-memory/
          if-no-files-found: error
          retention-days: 30
