name: Telegram Canonical Memory Recall Validation

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/telegram-canonical-memory-recall.request.json"
      - ".github/workflows/telegram-canonical-memory-recall-validation.yml"

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  SCHEDULED_PROOF_RUN_ID: "35676230887"
  EXPECTED_SOURCE_ID: "source-b60642fe38e8d636f0dd6508"
  EXPECTED_SOURCE_FINGERPRINT: "07d454bc4d65836563ae866419d0e6e1b598bc5249c1efb57186615350b65b37"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bounded runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          mkdir -p artifacts/telegram-canonical-memory/state

      - name: Restore cross-run canonical checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$SCHEDULED_PROOF_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "continuous-operation-state-$SCHEDULED_PROOF_RUN_ID" \
            --dir artifacts/telegram-canonical-memory/state
          test -s artifacts/telegram-canonical-memory/state/continuous.db
          test -s artifacts/telegram-canonical-memory/state/state-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/telegram-canonical-memory/state/state-manifest.json").read_text())
          assert d["canonical_memory_plane"]=="BR_SQLITE"
          assert d["artifact_is_second_memory_plane"] is False
          print("CANONICAL_CHECKPOINT_RESTORED=PASS")
          print("SINGLE_CANONICAL_MEMORY_PLANE=PASS")
          PY

      - name: Run focused group-only recall regressions
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/telegram-canonical-memory/focused.db
        run: |
          set -euo pipefail
          rm -f "$BR_TEST_DATABASE"
          python -m pytest -q \
            tests/test_gta6_autonomous_knowledge_brain.py::test_telegram_knowledge_recall_uses_harness_governed_bounded_retrieval \
            tests/test_telegram_gateway_conversation.py::test_v2_live_gateway_uses_conversation_service_not_direct_reasoning \
            tests/test_telegram_gateway_conversation.py::test_governed_ingress_rejects_private_and_accepts_only_authorized_groups \
            tests/test_telegram_gateway_conversation.py::test_group_human_surface_requires_exact_harness_child_authorization
          echo "TELEGRAM_GROUP_RECALL_REGRESSIONS=PASS"
          echo "PRIVATE_TELEGRAM_HUMAN_SURFACE=DISABLED"

      - name: Execute real Telegram group Knowledge Brain recall
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/telegram-canonical-memory/state/continuous.db
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID || secrets.TELEGRAM_REVIEW_CHAT_ID }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ vars.TELEGRAM_REVIEW_CHAT_ID || secrets.TELEGRAM_REVIEW_CHAT_ID }}
          TELEGRAM_ALLOWED_USER_ID: ${{ vars.TELEGRAM_ALLOWED_USER_ID }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo "EXTERNAL_SECRET_BLOCKER=TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "${TELEGRAM_REVIEW_CHAT_ID:-}" || { echo "EXTERNAL_SECRET_BLOCKER=TELEGRAM_REVIEW_CHAT_ID"; exit 1; }
          test -n "${TELEGRAM_ALLOWED_USER_ID:-}" || { echo "EXTERNAL_CONFIG_BLOCKER=TELEGRAM_ALLOWED_USER_ID"; exit 1; }
          python - <<'PY' | tee artifacts/telegram-canonical-memory/live-group-recall.log
          import json
          import os
          from pathlib import Path

          from app.main import initialize_application
          from app.services.telegram_ingress_policy_service import (
              HUMAN_SURFACE,
              PRIVATE_TELEGRAM_HUMAN_SURFACE,
              parse_governed_telegram_ingress,
          )
          from scripts.telegram_harness_gateway import TelegramApi
          from scripts.telegram_harness_gateway_v2 import (
              _handle_live_natural_language_message,
          )

          initialize_application()
          token=os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id=int(os.environ["TELEGRAM_REVIEW_CHAT_ID"])
          user_id=int(os.environ["TELEGRAM_ALLOWED_USER_ID"])
          expected_source=os.environ["EXPECTED_SOURCE_ID"]
          expected_fingerprint=os.environ["EXPECTED_SOURCE_FINGERPRINT"]
          query="Conhecimento sobre GTA VI"
          run_id=int(os.environ["GITHUB_RUN_ID"])
          update_id=run_id
          message_id=max(1, run_id % 2_000_000_000)

          update={
              "update_id": update_id,
              "message": {
                  "message_id": message_id,
                  "from": {"id": user_id, "is_bot": False},
                  "chat": {
                      "id": chat_id,
                      "type": "supergroup",
                      "title": "BR-no-GTA",
                  },
                  "text": query,
              },
          }
          ingress=parse_governed_telegram_ingress(
              update,
              allowed_user_id=user_id,
              state={"allowed_chat_ids": [chat_id]},
          )
          assert ingress is not None
          assert ingress.accepted is True
          assert ingress.chat_type=="supergroup"
          assert HUMAN_SURFACE=="telegram_group"
          assert PRIVATE_TELEGRAM_HUMAN_SURFACE=="DISABLED"

          calls={"provider": 0, "action": 0}

          def provider(*_args, **_kwargs):
              calls["provider"] += 1
              raise AssertionError("Knowledge recall must not call semantic provider")

          def action(*_args, **_kwargs):
              calls["action"] += 1
              raise AssertionError("Knowledge recall must not dispatch research/execution")

          class AuditedTelegramApi(TelegramApi):
              def __init__(self, value):
                  super().__init__(value)
                  self.sent=[]
              def send(self, target_chat_id, text):
                  message=super().send(target_chat_id, text)
                  self.sent.append({
                      "chat_id": int(target_chat_id),
                      "message_id": message,
                      "text": str(text),
                  })
                  return message

          api=AuditedTelegramApi(token)
          reply, learned, conversation=_handle_live_natural_language_message(
              api=api,
              user_id=ingress.user_id,
              chat_id=ingress.chat_id,
              chat_type=ingress.chat_type,
              message=ingress.message,
              update_id=update_id,
              text=ingress.text,
              chat_handler=provider,
              action_executor=action,
              send_final_response=True,
              runtime_revision=os.environ["GITHUB_SHA"],
          )

          canonical=conversation["canonical_result"]
          assert conversation["intent"]=="KNOWLEDGE_RECALL_REQUEST", conversation["intent"]
          assert conversation["plan"]["kind"]=="KNOWLEDGE_RECALL", conversation["plan"]
          assert conversation["final_human_response_sent"] is True
          assert canonical["status"]=="CANONICAL_KNOWLEDGE_RECALLED", canonical
          assert canonical["HARNESS_GOVERNED_RETRIEVAL"]=="PASS"
          assert canonical["SOURCE_PROVENANCE_PRESERVED"]=="PASS"
          assert canonical["canonical_memory_plane"]=="BR_SQLITE"
          assert canonical["human_surface"]=="telegram_group"
          assert canonical["provider_independent"] is True
          assert canonical["provider_calls"]==0
          assert canonical["semantic_provider_required"] is False
          assert canonical["retrieval_bounded"] is True
          assert canonical["harness_routing_id"]
          assert calls=={"provider": 0, "action": 0}
          assert learned["input"]["telegram_chat_id"]==chat_id
          assert learned["input"]["telegram_message_id"]==message_id
          assert api.sent
          assert all(item["chat_id"]==chat_id for item in api.sent)

          matches=[
              item for item in canonical["claims"]
              if item.get("source_id")==expected_source
              and item.get("source_fingerprint")==expected_fingerprint
              and str(item.get("status") or "").casefold()=="active"
              and str(item.get("brain_status") or "").upper() in {"ACTIVE","VERIFIED"}
              and item.get("evidence_ref")
              and item.get("source_url")
          ]
          assert matches, canonical["claims"]
          matched=matches[0]

          evidence={
              "status": "PASS",
              "query": query,
              "intent": conversation["intent"],
              "plan_kind": conversation["plan"]["kind"],
              "human_surface": canonical["human_surface"],
              "private_telegram_human_surface": PRIVATE_TELEGRAM_HUMAN_SURFACE,
              "harness_routing_id": canonical["harness_routing_id"],
              "canonical_memory_plane": canonical["canonical_memory_plane"],
              "provider_calls": calls["provider"],
              "action_calls": calls["action"],
              "new_gta6_research": False,
              "source_fetch_count": 0,
              "matched_claim_id": matched["claim_id"],
              "matched_source_id": matched["source_id"],
              "matched_source_url": matched["source_url"],
              "matched_evidence_ref": matched["evidence_ref"],
              "matched_source_fingerprint": matched["source_fingerprint"],
              "matched_brain_status": matched["brain_status"],
              "telegram_message_ids": [
                  item["message_id"] for item in api.sent
                  if item["message_id"] is not None
              ],
              "final_human_response_sent": conversation["final_human_response_sent"],
              "reply": reply,
          }
          Path("artifacts/telegram-canonical-memory/live-group-recall.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True)+"\n",
              encoding="utf-8",
          )
          print("TELEGRAM_GROUP_ONLY_HUMAN_SURFACE=PASS")
          print("PRIVATE_TELEGRAM_HUMAN_SURFACE=DISABLED")
          print("LIVE_GATEWAY_USES_CONVERSATION_SERVICE=PASS")
          print("TELEGRAM_GROUP_REAL_RECALL=PASS")
          print("CROSS_RUN_HARNESS_RETRIEVAL=PASS")
          print("SOURCE_PROVENANCE_PRESERVED=PASS")
          print("SOURCE_FINGERPRINT_REUSED=PASS")
          print("KNOWLEDGE_SURVIVES_NEW_RUNNER=PASS")
          print("KNOWLEDGE_CHANGED_NEXT_REAL_EXECUTION=PASS")
          print("SEMANTIC_PROVIDER_CALLS=0")
          print("RESEARCH_ACTION_DISPATCHED=NO")
          print("NEW_GTA6_RESEARCH=NO")
          print("SOURCE_FETCH_COUNT=0")
          print("FINAL_HUMAN_RESPONSE_SENT=PASS")
          print("TELEGRAM_RECALL_MESSAGE_ID="+str(api.sent[-1]["message_id"]))
          PY

      - name: Project restored canonical state to Obsidian
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/telegram-canonical-memory/state/continuous.db
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from app.services.obsidian_memory_service import export_obsidian_memory_projection

          root=Path("artifacts/telegram-canonical-memory/obsidian-memory-export")
          manifest=export_obsidian_memory_projection(
              output_root=root,
              system_state={
                  "head":"${{ github.sha }}",
                  "status":"OBSERVED",
                  "evidence_refs":["github:run:35675442829","github:run:35676230887"],
                  "new_voice_synthesis":"NO",
                  "full_render":"NO",
                  "youtube_upload":"NO",
                  "youtube_publication":"NO",
              },
              project_goals={
                  "VIDEO-A":"93f99ddc-09c7-474b-8849-6981aa78d60c",
              },
          )
          index=root/"40-Knowledge/GTA6/Claims/Index.md"
          assert index.is_file(), manifest
          assert manifest["OBSIDIAN_CANONICAL_MEMORY"]=="NO"
          assert manifest["TERMUX_HEAVY_PROCESSING"]=="NO"
          print("OBSIDIAN_SECOND_BRAIN_PROJECTION=PASS")
          print("OBSIDIAN_FED_FROM_CANONICAL_SQLITE=PASS")
          print("OBSIDIAN_CANONICAL_MEMORY=NO")
          print("TERMUX_HEAVY_PROCESSING=NO")
          PY

      - name: Upload live recall evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-canonical-memory-${{ github.run_id }}
          path: artifacts/telegram-canonical-memory/
          if-no-files-found: error
          retention-days: 30
