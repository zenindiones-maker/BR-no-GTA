name: Durable Recovery Checkpoint Save

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run/checkpoint-save.request.json

permissions:
  contents: write

concurrency:
  group: durable-recovery-checkpoint-save
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout exact checkpoint request revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused checkpoint runtime
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt pytest

      - name: br_checkpoint_save
        run: |
          set -euo pipefail
          python scripts/br_checkpoint_save.py             --branch "$GITHUB_REF_NAME"             --remote origin             --checkpoint-type voice-autonomy-video-a-recovery
