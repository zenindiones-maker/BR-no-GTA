name: OpenCode Semantic Text v3 Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/opencode-semantic-text-v3-proof.request.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  statuses: write

concurrency:
  group: opencode-semantic-text-v3-proof
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONPATH: .
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/opencode-semantic-v3/proof.db
  BR_OPENCODE_NATIVE_REPOSITORY: ${{ github.repository }}
  BR_OPENCODE_NATIVE_REF: ${{ github.ref_name }}
  BR_OPENCODE_NATIVE_SOURCE_SHA: ${{ github.sha }}
  BR_OPENCODE_NATIVE_ARTIFACT_ROOT: ${{ github.workspace }}/artifacts/opencode-semantic-v3/native
  ZERO_COST_OPERATION: "TRUE"

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact proof revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned proof runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/opencode-semantic-v3
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          npm install --global @opencode/cli@2.0.8
          reported="$(opencode --version | awk '{print $NF}' | tr -d '\r' | sed -E 's/^v//')"
          test "$reported" = "2.0.8"
          echo "OPENCODE_CLI_VERSION=2.0.8"

      - name: Compile semantic boundary
        run: |
          set -euo pipefail
          python -m py_compile             app/services/opencode_semantic_profile.py             app/services/opencode_executor_profile_service.py             app/services/opencode_native_ai_provider.py             app/services/harness_ai_provider_service.py             app/services/telegram_reasoning_learning_service.py             app/services/telegram_harness_service.py             scripts/opencode_semantic_text_v3_proof.py
          echo "OPENCODE_SEMANTIC_V3_COMPILE=PASS"

      - name: Run focused semantic isolation tests
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_opencode_semantic_text_profile.py             tests/test_opencode_native_retry_policy.py             tests/test_opencode_stream_recovery.py             tests/test_harness_ai_provider_service.py             tests/test_harness_routing_policy_service.py             --junitxml=artifacts/opencode-semantic-v3/pytest.xml
          echo "OPENCODE_SEMANTIC_V3_TESTS=PASS"

      - name: Execute isolated and real-context semantic proof
        run: |
          set -euo pipefail
          rm -f "$BR_TEST_DATABASE"
          python scripts/opencode_semantic_text_v3_proof.py             --output artifacts/opencode-semantic-v3/proof.json             | tee artifacts/opencode-semantic-v3/proof.log

      - name: Enforce exact zero-tool contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/opencode-semantic-v3/proof.json").read_text(encoding="utf-8"))
          assert d["status"]=="PASS",d
          isolated=d["isolated"]; contextual=d["contextual"]
          assert isolated["text"]=="TESTE_OK",isolated
          for item in (isolated,contextual):
              assert item["status"]=="EXECUTED",item
              assert item["tool_call_count"]==0,item
              assert item["tools_exposed"]==0,item
              assert item["semantic_agent"]=="semantic-text",item
              assert item["semantic_profile_version"]=="opencode-semantic-text-v3",item
              assert item["semantic_contract"]=="SEMANTIC_TEXT_ONLY",item
              assert item["semantic_text_only_pass"] is True,item
          print("EXIT_CODE=0")
          print("USABLE_TEXT=true")
          print("TOOLS_EXPOSED=0")
          print("TOOL_CALL_COUNT=0")
          print("TEXT_OUTPUT_PRESENT=YES")
          print("MODEL=oc/big-pickle")
          print("SEMANTIC_CONTRACT=PASS")
          print("SEMANTIC_TEXT_ONLY=PASS")
          print("CONTEXTUAL_SEMANTIC_TEXT_ONLY=PASS")
          PY

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-semantic-text-v3-${{ github.run_id }}
          path: artifacts/opencode-semantic-v3/
          if-no-files-found: error
          retention-days: 30

      - name: Publish proof status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json,os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "opencode-semantic-text-v3",
              "description": "OpenCode semantic text v3 zero-tool proof",
              "target_url": (
                  "https://github.com/"
                  + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/"
                  + os.environ["GITHUB_RUN_ID"]
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d @/tmp/status.json
