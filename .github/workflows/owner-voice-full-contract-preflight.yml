name: BR_OWNER_V1 Full Contract Preflight - No Delivery
on:
  push:
    branches:
      - work/owner-voice-safe-ingress-recovery-20261010
    paths:
      - ".github/workflows/owner-voice-full-contract-preflight.yml"
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test runtime
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check pytest packaging python-dotenv==1.2.3
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Replicate exact clone contract, no secrets or side effects
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_owner_voice_speaker_identity_service.py \
            tests/test_owner_voice_single_clone_delivery_v1.py \
            tests/test_owner_voice_single_clone_workflow_v1.py \
            tests/test_owner_voice_transport_hardening_v2.py \
            tests/test_owner_voice_human_review_delivery_policy.py \
            tests/test_owner_voice_clone_service.py \
            tests/test_pronunciation_service.py \
            tests/test_voice_plane_foundation.py \
            tests/test_voice_runtime_cleanliness.py \
            tests/test_narration_pipeline.py
          echo "OWNER_CLONE_FULL_CONTRACT=PASS"
          echo "TELEGRAM_SEND_ATTEMPTED=FALSE"
