name: BR V19 Specialist Policy and Real AV Verification
on:
  push:
    branches:
      - work/br-specialist-intelligence-v19
    paths:
      - "app/services/br_specialist_policy_router_v19.py"
      - "scripts/br_specialist_router_benchmark_v19.py"
      - "tests/test_br_specialist_policy_router_v19.py"
      - ".github/workflows/br-specialist-policy-v19.yml"
      - "docs/architecture/br-specialist-policy-v19.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: br-v19-specialists-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verified-specialists:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prepare pinned test requirements and original FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install -q --disable-pip-version-check \
            -r requirements.txt pytest==8.4.2 python-dotenv==1.2.3 pillow==12.3.0
          echo "BR_TEST_DATABASE=$RUNNER_TEMP/br-v19-policy-private-auth.db" >> "$GITHUB_ENV"
          echo "BR_V19_REMOTE_PROVIDER_COST=0"
      - name: Verify exact existing Harness and V17/V18 specialist contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.database.schema import initialize_schema
          initialize_schema()
          PY
          python -m pytest -q \
            tests/test_br_specialist_policy_router_v19.py \
            tests/test_br_specialist_intelligence_v17.py \
            tests/test_br_owner_delivery_reconcile_v18.py
          echo "BR_V19_NO_NEW_SPECIALIST_AUTHORITY=PASS"
      - name: Freeze 60-case routing benchmark
        run: |
          set -euo pipefail
          python scripts/br_specialist_router_benchmark_v19.py \
            --root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/br-v19-private-routing.json"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"br-v19-private-routing.json"
          data=json.loads(p.read_text())
          assert data["sample_count"]==data["prespecified_count"]==60
          assert data["correct_count"]==60
          assert data["pass_power_10_all_cases"] is True
          assert data["api_paid_calls"]==0
          assert data["private_ledger_read"]=="NOT_ATTEMPTED"
          assert data["model_training"]=="NOT_ATTEMPTED"
          digest=hashlib.sha256(json.dumps({
              k:v for k,v in data.items() if k!="receipt_sha256"},
              sort_keys=True,separators=(",",":"),ensure_ascii=False,
              allow_nan=False).encode()).hexdigest()
          assert digest==data["receipt_sha256"]
          print("BR_V19_REAL_ROUTING_RECEIPT=PASS")
          PY
      - name: Repeat real Harness-mediated AV operation and negative controls
        run: |
          set -euo pipefail
          python scripts/br_specialist_benchmark_v17.py \
            --root "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/br-v19-private-real-av.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"br-v19-private-real-av.json").read_text())
          assert data["status"]=="REPEATED_ORIGINAL_TOOL_EVIDENCE_PASS"
          assert data["trial_count"]==20
          assert data["positive_passes"]==10
          assert data["negative_passes"]==10
          assert data["unauthorized_side_effects"]==0
          assert data["api_paid_calls"]==0
          assert data["model_professional_specialization_verified"] is False
          print("BR_V19_REPEATED_REAL_HARNESS_EXECUTION=PASS")
          print("BR_V19_NEW_SLM_MODEL_INFERENCE=NOT_ATTEMPTED")
          print("BR_V19_OWNER_VOICE_ACTIVATION=BLOCKED")
          print("BR_V19_CANONICAL_PROMOTION=NOT_ATTEMPTED")
          PY
