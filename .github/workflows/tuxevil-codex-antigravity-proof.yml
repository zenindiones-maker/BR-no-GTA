name: Tuxevil Codex Antigravity Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".github/workflows/tuxevil-codex-antigravity-proof.yml"
      - "scripts/tuxevil_codex_compat_probe.py"
      - "scripts/tuxevil_runtime_readiness.py"
      - "tests/test_tuxevil_codex_compat_probe.py"
      - "tests/test_tuxevil_runtime_readiness.py"
      - ".run/tuxevil-codex-antigravity-proof.request.json"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  TUXEVIL_ROTATOR_VERSION: "3.8.0"
  TUXEVIL_ROTATOR_BIND_HOST: "127.0.0.1"
  TUXEVIL_ROTATOR_TELEMETRY: "off"
  TUXEVIL_ROTATOR_ADMIN_TOKEN: "ci-local-proof-only"
  TUXEVIL_LOOPBACK_CLIENT_KEY: "tuxevil"
  TUXEVIL_LOOPBACK_URL: "http://127.0.0.1:51200"
  BR_AI_MODEL: "gemini-3-flash"

jobs:
  protocol-and-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch revision without persisted Git credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit existing Tuxevil and Antigravity persistence references
        id: inventory
        run: |
          set -euo pipefail
          mkdir -p artifacts/tuxevil-codex-antigravity
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib
          import re

          root = pathlib.Path(".")
          secret_re = re.compile(r"\$\{\{\s*secrets\.([A-Za-z0-9_]+)\s*\}\}")
          persistence_terms = {
              "tuxevil_dir": "TUXEVIL_ROTATOR_DIR",
              "legacy_pi_dir": "PI_ROTATOR_DIR",
              "database": "TUXEVIL_ROTATOR_DATABASE_URL",
              "database_fallback": "DATABASE_URL",
              "encryption": "TUXEVIL_ROTATOR_ENCRYPTION_KEY",
              "accounts_json": "accounts.json",
              "virtual_key": "Virtual Key",
          }
          reference_files = {key: set() for key in persistence_terms}
          secret_bindings = []

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              if ".git" in path.parts or "node_modules" in path.parts:
                  continue
              if path.stat().st_size > 2_000_000:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue

              for key, term in persistence_terms.items():
                  if term.casefold() in text.casefold():
                      reference_files[key].add(str(path))

              lines = text.splitlines()
              for index, line in enumerate(lines):
                  names = secret_re.findall(line)
                  if not names:
                      continue
                  lo = max(0, index - 2)
                  hi = min(len(lines), index + 3)
                  context = "\n".join(lines[lo:hi]).casefold()
                  if any(
                      term in context
                      for term in (
                          "tuxevil",
                          "antigravity",
                          "pi_rotator",
                          "accounts.json",
                          "rotator_database_url",
                          "encryption_key",
                          "virtual key",
                          "br_ai_gateway",
                      )
                  ):
                      for name in names:
                          secret_bindings.append(
                              {
                                  "file": str(path),
                                  "secret_reference_name": name,
                              }
                          )

          committed_accounts = [
              str(path)
              for path in root.rglob("accounts.json")
              if ".git" not in path.parts and "node_modules" not in path.parts
          ]
          has_ci_materialization = bool(secret_bindings or committed_accounts)

          report = {
              "schema": "br-tuxevil-ci-reference-inventory/v3",
              "secret_reference_names": sorted(
                  {row["secret_reference_name"] for row in secret_bindings}
              ),
              "secret_bindings": secret_bindings,
              "persistence_reference_files": {
                  key: sorted(values)
                  for key, values in reference_files.items()
              },
              "committed_accounts_json": committed_accounts,
              "values_read": False,
              "github_secrets_api_used": False,
              "has_existing_ci_materialization_reference": has_ci_materialization,
          }
          pathlib.Path(
              "artifacts/tuxevil-codex-antigravity/reference-inventory.json"
          ).write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(
              "has_materialization="
              + ("true" if has_ci_materialization else "false")
          )
          print("secret_reference_count=" + str(len(report["secret_reference_names"])))
          PY
          echo "TUXEVIL_SECRET_REFERENCE_COUNT=${{ steps.inventory.outputs.secret_reference_count || '0' }}"
          echo "CREDENTIAL_VALUES_READ=NO"
          echo "GITHUB_SECRETS_API_USED=NO"

      - name: Validate focused auth and readiness tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt pytest
          python -m pytest -q             tests/test_tuxevil_codex_compat_probe.py             tests/test_tuxevil_runtime_readiness.py             tests/test_codex_auth_boundary.py
          echo "TUXEVIL_CODEX_AUTH_TESTS=PASS"

      - name: Install pinned Tuxevil Rotator
        run: |
          set -euo pipefail
          npm view "tuxevil-rotator@$TUXEVIL_ROTATOR_VERSION"             version dist.integrity gitHead --json             > artifacts/tuxevil-codex-antigravity/npm-metadata.json
          npm install --global "tuxevil-rotator@$TUXEVIL_ROTATOR_VERSION"
          command -v tuxevil-rotator >/dev/null
          echo "TUXEVIL_RUNTIME_PRESENT=YES"

      - name: Start Tuxevil process and measure layered readiness
        id: readiness
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/tuxevil-rotator"
          raw_log="$RUNNER_TEMP/tuxevil-rotator.raw.log"
          redacted_log="artifacts/tuxevil-codex-antigravity/tuxevil-rotator.redacted.log"
          mkdir -p "$config_dir"

          export TUXEVIL_ROTATOR_DIR="$config_dir"
          nohup tuxevil-rotator start --config-dir "$config_dir"             > "$raw_log" 2>&1 &
          pid="$!"
          echo "$pid" > "$RUNNER_TEMP/tuxevil-rotator.pid"

          python scripts/tuxevil_runtime_readiness.py             --pid "$pid"             --config-dir "$config_dir"             --raw-log "$raw_log"             --redacted-log "$redacted_log"             --output artifacts/tuxevil-codex-antigravity/runtime-readiness.json             --base-url "$TUXEVIL_LOOPBACK_URL"             --admin-token "$TUXEVIL_ROTATOR_ADMIN_TOKEN"             --client-key "$TUXEVIL_LOOPBACK_CLIENT_KEY"             --wait-seconds 20

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d = json.loads(
              Path(
                  "artifacts/tuxevil-codex-antigravity/runtime-readiness.json"
              ).read_text()
          )
          print("process_ready=" + d["TUXEVIL_PROCESS_READY"].lower())
          print("status_ready=" + d["TUXEVIL_STATUS_ENDPOINT"].lower())
          print("models_ready=" + d["TUXEVIL_MODELS_READY"].lower())
          print("account_count=" + str(d["TUXEVIL_RUNTIME_ACCOUNT_COUNT"]))
          print("antigravity_present=" + d["ANTIGRAVITY_ACCOUNT_PRESENT"].lower())
          PY

          process_ready="$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/tuxevil-codex-antigravity/runtime-readiness.json").read_text())
          print(d["TUXEVIL_PROCESS_READY"])
          PY
          )"
          if [ "$process_ready" != "PASS" ]; then
            echo "TUXEVIL_PROCESS_DIAGNOSTIC=REDACTED_LOG_FOLLOWS"
            cat "$redacted_log"
          fi

      - name: Classify non-live Tuxevil state without inventing credentials
        if: >
          steps.inventory.outputs.has_materialization != 'true' ||
          steps.readiness.outputs.process_ready != 'pass' ||
          steps.readiness.outputs.status_ready != 'pass' ||
          steps.readiness.outputs.models_ready != 'pass' ||
          steps.readiness.outputs.antigravity_present != 'yes'
        env:
          HAS_MATERIALIZATION: ${{ steps.inventory.outputs.has_materialization }}
          PROCESS_READY: ${{ steps.readiness.outputs.process_ready }}
          STATUS_READY: ${{ steps.readiness.outputs.status_ready }}
          ACCOUNT_COUNT: ${{ steps.readiness.outputs.account_count }}
          ANTIGRAVITY_PRESENT: ${{ steps.readiness.outputs.antigravity_present }}
        run: |
          set -euo pipefail
          ci_path="NONE"
          if [ "${HAS_MATERIALIZATION:-false}" = "true" ]; then
            ci_path="EXISTING_REPOSITORY_REFERENCE_NOT_RUNTIME_READY"
          fi

          extra=(
            --project-antigravity-configured
            --codex-action-responses-endpoint-supported
            --tuxevil-responses-endpoint-supported
          )
          [ "${PROCESS_READY:-fail}" = "pass" ] && extra+=(--process-ready)
          [ "${STATUS_READY:-fail}" = "pass" ] && extra+=(--status-ready)
          [ "${ANTIGRAVITY_PRESENT:-no}" = "yes" ] && extra+=(--antigravity-account-present)

          python scripts/tuxevil_codex_compat_probe.py             --output artifacts/tuxevil-codex-antigravity/proof.json             --base-url "$TUXEVIL_LOOPBACK_URL"             --client-key "$TUXEVIL_LOOPBACK_CLIENT_KEY"             --configured-model "$BR_AI_MODEL"             --ci-credential-path "$ci_path"             --runtime-account-count "${ACCOUNT_COUNT:-0}"             "${extra[@]}"

          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(
              Path("artifacts/tuxevil-codex-antigravity/proof.json").read_text()
          )
          assert d["TUXEVIL_CODEX_COMPATIBILITY"] == "SUPPORTED"
          assert d["AUTH_SECRET_LEAK"] == "NO"
          if d["TUXEVIL_PROCESS_READY"] == "FAIL":
              assert d["ANTIGRAVITY_RUNTIME_AUTH"] == (
                  "NOT_ATTEMPTED_RUNTIME_UNAVAILABLE"
              )
              assert d["ANTIGRAVITY_UPSTREAM_AUTH"] == "NOT_ATTEMPTED"
              assert d["TUXEVIL_RESPONSES_API"] == "NOT_ATTEMPTED"
          elif d["ANTIGRAVITY_ACCOUNT_PRESENT"] == "NO":
              assert d["ANTIGRAVITY_RUNTIME_AUTH"] == (
                  "BLOCKED_MISSING_CI_CREDENTIAL_MATERIALIZATION"
              )
              assert d["ANTIGRAVITY_UPSTREAM_AUTH"] == "NOT_ATTEMPTED"
              assert d["TUXEVIL_RESPONSES_API"] == "NOT_ATTEMPTED"
          PY
      - name: Probe live Responses API only after process, account and models are ready
        if: >
          steps.inventory.outputs.has_materialization == 'true' &&
          steps.readiness.outputs.process_ready == 'pass' &&
          steps.readiness.outputs.status_ready == 'pass' &&
          steps.readiness.outputs.models_ready == 'pass' &&
          steps.readiness.outputs.antigravity_present == 'yes'
        run: |
          set -euo pipefail
          python scripts/tuxevil_codex_compat_probe.py             --output artifacts/tuxevil-codex-antigravity/proof.json             --base-url "$TUXEVIL_LOOPBACK_URL"             --client-key "$TUXEVIL_LOOPBACK_CLIENT_KEY"             --configured-model "$BR_AI_MODEL"             --ci-credential-path EXISTING_RUNTIME_MATERIALIZATION             --project-antigravity-configured             --codex-action-responses-endpoint-supported             --tuxevil-responses-endpoint-supported             --process-ready             --status-ready             --runtime-account-count "${{ steps.readiness.outputs.account_count }}"             --antigravity-account-present
      - name: Classify final proof
        id: classify
        run: |
          set -euo pipefail
          test -s artifacts/tuxevil-codex-antigravity/proof.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(
              Path("artifacts/tuxevil-codex-antigravity/proof.json").read_text()
          )
          assert d["TUXEVIL_CODEX_COMPATIBILITY"] == "SUPPORTED"
          assert d["AUTH_SECRET_LEAK"] == "NO"
          print(
              "live="
              + ("true" if d.get("ANTIGRAVITY_UPSTREAM_AUTH") == "PASS" else "false")
          )
          print(
              "tools="
              + ("true" if d.get("TUXEVIL_TOOL_CALLING") == "PASS" else "false")
          )
          print("model=" + str(d.get("selected_model") or "gemini-3-flash"))
          PY

      - name: Run Codex read-only through Tuxevil only after real Responses proof
        if: steps.classify.outputs.live == 'true' && steps.classify.outputs.tools == 'true'
        id: codex_readonly
        uses: openai/codex-action@v1
        with:
          openai-api-key: "tuxevil"
          responses-api-endpoint: "http://127.0.0.1:51200/v1/responses"
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          model: ${{ steps.classify.outputs.model }}
          codex-args: '["--ephemeral"]'
          prompt: |
            Read AGENTS.md if present. Do not modify any file.
            Return exactly these four lines:
            CODEX_AUTH_AVAILABLE=PASS
            CODEX_AUTH_METHOD=TUXEVIL_ANTIGRAVITY_RESPONSES_PROXY
            CODEX_RESPONSES_ENDPOINT=TUXEVIL_LOOPBACK
            OPENAI_PLATFORM_API_KEY_REQUIRED=NO

      - name: Record safe non-live state from proof evidence
        if: steps.classify.outputs.live != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(
              Path("artifacts/tuxevil-codex-antigravity/proof.json").read_text()
          )
          for key in (
              "TUXEVIL_CODEX_COMPATIBILITY",
              "TUXEVIL_PROCESS_READY",
              "TUXEVIL_STATUS_ENDPOINT",
              "TUXEVIL_RUNTIME_ACCOUNT_COUNT",
              "ANTIGRAVITY_ACCOUNT_PRESENT",
              "ANTIGRAVITY_RUNTIME_AUTH",
              "ANTIGRAVITY_UPSTREAM_AUTH",
              "TUXEVIL_MODELS_READY",
              "TUXEVIL_RESPONSES_API",
              "AUTH_SECRET_LEAK",
          ):
              print(f"{key}={d[key]}")
          PY
          echo "CODEX_AUTH_AVAILABLE=BLOCKED"
          echo "OPENAI_PLATFORM_API_KEY_REQUIRED=NOT_EVALUATED"
          echo "AUTH_CREDENTIAL_IN_ARTIFACT=NO"
          echo "AUTH_CREDENTIAL_IN_TELEGRAM=NO"
          echo "AUTH_CREDENTIAL_IN_MEMORY=NO"
          echo "AUTH_CREDENTIAL_IN_OBSIDIAN=NO"
          echo "HARNESS_HERMES_FULL_SYNERGY=NOT_RUN"
      - name: Upload sanitized Tuxevil evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuxevil-codex-antigravity-${{ github.run_id }}
          path: |
            artifacts/tuxevil-codex-antigravity/proof.json
            artifacts/tuxevil-codex-antigravity/runtime-readiness.json
            artifacts/tuxevil-codex-antigravity/reference-inventory.json
            artifacts/tuxevil-codex-antigravity/npm-metadata.json
            artifacts/tuxevil-codex-antigravity/tuxevil-rotator.redacted.log
          if-no-files-found: error
          retention-days: 7

      - name: Publish Tuxevil compatibility status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="failure"
          description="Tuxevil Codex proof did not produce compatibility evidence"
          if [ -s artifacts/tuxevil-codex-antigravity/proof.json ]; then
            readarray -t fields < <(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(
              Path("artifacts/tuxevil-codex-antigravity/proof.json").read_text()
          )
          print(d.get("TUXEVIL_CODEX_COMPATIBILITY","NOT_PROVEN"))
          print(d.get("ANTIGRAVITY_RUNTIME_AUTH","UNKNOWN"))
          print(d.get("TUXEVIL_PROCESS_READY","UNKNOWN"))
          PY
            )
            if [ "${fields[0]}" = "SUPPORTED" ]; then
              state="success"
              if [ "${fields[1]}" = "BLOCKED_MISSING_CI_CREDENTIAL_MATERIALIZATION" ]; then
                description="Supported; existing Antigravity identity is not materialized in CI"
              elif [ "${fields[2]}" = "PASS" ]; then
                description="Tuxevil process and Antigravity compatibility proof passed"
              else
                description="Tuxevil compatibility supported; runtime readiness classified"
              fi
            fi
          fi

          python - "$state" "$description" <<'PY' > "$RUNNER_TEMP/status.json"
          import json
          import os
          import sys
          print(json.dumps({
              "state":sys.argv[1],
              "context":"tuxevil-codex-compatibility",
              "description":sys.argv[2][:140],
              "target_url":(
                  "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d @"$RUNNER_TEMP/status.json" >/dev/null

      - name: Shutdown Tuxevil
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tuxevil-rotator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/tuxevil-rotator.pid")" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/tuxevil-rotator.raw.log"
