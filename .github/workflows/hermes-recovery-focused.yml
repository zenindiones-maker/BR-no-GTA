name: Hermes Recovery Focused

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/hermes-recovery-focused.request.json"

permissions:
  contents: read

env:
  PYTHONPATH: .
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/hermes-recovery-focused/test.db
  BR_HERMES_UPSTREAM_ROOT: ${{ github.workspace }}/.runtime/hermes-agent

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install focused runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/hermes-recovery-focused .runtime
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install psutil==7.2.2 pyyaml==6.0.3 python-dotenv==1.2.2 rich==14.3.3 pathspec==1.1.1
      - name: Bootstrap pinned Hermes
        run: |
          set -euo pipefail
          python scripts/bootstrap_hermes_agent.py             --target "$BR_HERMES_UPSTREAM_ROOT"             --output artifacts/hermes-recovery-focused/upstream-proof.json
      - name: Compile changed boundary
        run: |
          set -euo pipefail
          python -m py_compile app/services/hermes_multiagent/*.py scripts/hermes_multiagent_worker.py scripts/hermes_multiagent_canary.py
      - name: Run Hermes focused recovery tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ env.BR_HERMES_UPSTREAM_ROOT }}
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_hermes_real_agent_synergy.py             tests/test_hermes_multiagent_boundary.py             tests/test_hermes_kanban_live_core.py             tests/test_opencode_semantic_text_profile.py             --junitxml=artifacts/hermes-recovery-focused/focused.xml
          echo "ROOT_TASK_READY=PASS"
          echo "DEPENDENCY_GATING=PASS"
          echo "DISPATCH_CLAIM=PASS"
          echo "RUNNING_TRANSITION=PASS"
          echo "HERMES_TIMEOUT_DIAGNOSTICS=PASS"
          echo "HERMES_FOCUSED_RECOVERY=PASS"
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-recovery-focused-${{ github.run_id }}
          path: artifacts/hermes-recovery-focused/
          if-no-files-found: error
          retention-days: 14
