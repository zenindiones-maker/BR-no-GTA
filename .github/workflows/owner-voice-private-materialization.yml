name: Owner Voice Private Materialization

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/owner-voice-private-materialization.request.json"

permissions:
  contents: read

jobs:
  contract:
    name: Owner voice private materialization contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check -q pytest "python-dotenv==1.2.3"

      - name: Validate explicit materialization request
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".run/owner-voice-private-materialization.request.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["schema"]=="OwnerVoicePrivateMaterializationRequest/v1"
          assert d["voice_identity_id"]=="BR_OWNER_V1"
          assert d["requested_action"]=="MATERIALIZE_REAL_TELEGRAM_OWNER_REFERENCES"
          assert d["generic_voice_fallback"] is False
          assert d["fail_closed"] is True
          print("OWNER_VOICE_MATERIALIZATION_REQUEST=PASS")
          PY

      - name: Prove secure handoff and private boundary
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_owner_voice_reference_handoff.py \
            tests/test_owner_voice_private_materialization.py \
            tests/test_owner_voice_qwen_audition.py
          echo "OWNER_VOICE_PRIVATE_MATERIALIZATION_CONTRACT=PASS"

  materialize:
    name: Materialize Telegram owner voice and synthesize real Qwen audition
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      BR_OWNER_TELEGRAM_REFERENCE_INDEX: ${{ secrets.BR_OWNER_TELEGRAM_REFERENCE_INDEX }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HF_HOME: ${{ runner.temp }}/huggingface
      TRANSFORMERS_CACHE: ${{ runner.temp }}/huggingface/transformers
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret presence preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BR_OWNER_TELEGRAM_REFERENCE_INDEX:-}" ]]; then
            echo "OWNER_REFERENCE_INDEX_PRESENT=true"
          else
            echo "OWNER_REFERENCE_INDEX_PRESENT=false"
            echo "OWNER_REFERENCE_MATERIALIZATION_BLOCKER=OWNER_TELEGRAM_REFERENCE_INDEX_NOT_MATERIALIZED"
            exit 21
          fi
          if [[ -n "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            echo "TELEGRAM_BOT_TOKEN_PRESENT=true"
          else
            echo "TELEGRAM_BOT_TOKEN_PRESENT=false"
            echo "OWNER_REFERENCE_MATERIALIZATION_BLOCKER=TELEGRAM_BOT_TOKEN_NOT_MATERIALIZED"
            exit 22
          fi
          echo "EXTERNAL_PRIVATE_VOICE_RUNTIME_REQUIRED=false"
          echo "EPHEMERAL_QWEN_OWNER_CLONE=true"

      - name: Install owner clone runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q \
            "qwen-tts==0.1.1" \
            "soundfile>=0.12,<1" \
            "requests>=2.32,<3"
          python - <<'PY'
          import qwen_tts, torch
          print("QWEN_TTS_IMPORT=PASS")
          print("TORCH_VERSION=" + torch.__version__)
          print("CUDA_AVAILABLE=" + str(torch.cuda.is_available()).lower())
          PY

      - name: Clone owner voice from real Telegram reference and deliver audition
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/owner_voice_qwen_ephemeral_audition.py

      - name: Verify repository contains no owner biometric material
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all -- '*.wav' '*.flac' '*.ogg' '*.oga' '*.opus' '*.mp3' '*.m4a' '*.pt')"
          echo "RAW_OWNER_AUDIO_IN_GIT=0"
          echo "VOICE_PROMPT_IN_GIT=0"

      - name: Upload redacted proof only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: owner-voice-qwen-redacted-proof-${{ github.run_id }}
          path: runtime/owner-voice-materialization/
          if-no-files-found: warn
          retention-days: 7
