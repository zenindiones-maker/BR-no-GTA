name: Owner Voice Private Materialization & Professional Corpus Audit

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/owner-voice-private-materialization.request.json"

concurrency:
  group: owner-voice-private-materialization-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: Owner voice private materialization contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check -q pytest "python-dotenv==1.2.3"

      - name: Validate explicit materialization request
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".run/owner-voice-private-materialization.request.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["schema"]=="OwnerVoicePrivateMaterializationRequest/v1"
          assert d["voice_identity_id"]=="BR_OWNER_V1"
          assert d["requested_action"]=="MATERIALIZE_REAL_TELEGRAM_OWNER_REFERENCES"
          assert d["generic_voice_fallback"] is False
          assert d["fail_closed"] is True
          print("OWNER_VOICE_MATERIALIZATION_REQUEST=PASS")
          PY

      - name: Prove secure handoff and private boundary
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_owner_voice_reference_handoff.py \
            tests/test_owner_voice_private_materialization.py \
            tests/test_owner_voice_clone_service.py \
            tests/test_owner_voice_audio_quality_service.py \
            tests/test_owner_voice_reference_qa.py \
            tests/test_owner_voice_chatterbox_ptbr_audition.py \
            tests/test_owner_voice_chatterbox_dependency_contract.py \
            tests/test_owner_voice_ptbr_audition_review.py
          echo "OWNER_VOICE_PRIVATE_MATERIALIZATION_CONTRACT=PASS"

  materialize:
    name: Materialize Telegram owner voice and audit professional corpus
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64: ${{ secrets.BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64 }}
      BR_OWNER_TELEGRAM_REFERENCE_INDEX: ${{ secrets.BR_OWNER_TELEGRAM_REFERENCE_INDEX }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HF_HOME: /tmp/br-owner-huggingface
      TOKENIZERS_PARALLELISM: "false"
      BR_OWNER_REFERENCE_QA_CONTEXT: /tmp/br-owner-voice/reference-qa-context.json
      BR_OWNER_PTBR_AUDITION_SET: /tmp/br-owner-voice/ptbr-audition-set.json
      BR_OWNER_STT_MODEL: large-v3-turbo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Secret presence and masking preflight
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from app.services.owner_voice_telegram_handoff_service import (
              parse_reference_envelope_b64,
          )

          envelope=(os.environ.get("BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64") or "").strip()
          legacy=(os.environ.get("BR_OWNER_TELEGRAM_REFERENCE_INDEX") or "").strip()
          if envelope:
              index=parse_reference_envelope_b64(envelope)
              print("OWNER_REFERENCE_ENVELOPE_PRESENT=true")
              print("OWNER_REFERENCE_SECRET_MODE=OPAQUE_B64")
          elif legacy:
              index=json.loads(legacy)
              print("OWNER_REFERENCE_ENVELOPE_PRESENT=false")
              print("OWNER_REFERENCE_SECRET_MODE=LEGACY_MIGRATION_ONLY")
          else:
              print("OWNER_REFERENCE_MATERIALIZATION_BLOCKER=OWNER_TELEGRAM_REFERENCE_INDEX_NOT_MATERIALIZED")
              raise SystemExit(21)

          for row in index.get("references") or []:
              for key in (
                  "telegram_file_id",
                  "telegram_file_unique_id",
                  "telegram_user_id",
                  "telegram_chat_id",
                  "telegram_message_id",
                  "telegram_update_id",
              ):
                  value=str(row.get(key) or "").strip()
                  if value:
                      print(f"::add-mask::{value}")
          print("OWNER_REFERENCE_METADATA_MASKS=INSTALLED")
          PY

          if [[ -n "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            echo "TELEGRAM_BOT_TOKEN_PRESENT=true"
          else
            echo "TELEGRAM_BOT_TOKEN_PRESENT=false"
            echo "OWNER_REFERENCE_MATERIALIZATION_BLOCKER=TELEGRAM_BOT_TOKEN_NOT_MATERIALIZED"
            exit 22
          fi
          echo "GENERIC_VOICE_FALLBACK=0"
          echo "EPHEMERAL_TELEGRAM_BOUND_PTBR_OWNER_CLONE=true"
          echo "OWNER_TARGET_LOCALE=pt-BR"
          echo "OWNER_ALLOWED_IDENTITY=BR_OWNER_V1"

      - name: Install private STT runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m venv /tmp/br-owner-stt-venv
          /tmp/br-owner-stt-venv/bin/python -m pip install --disable-pip-version-check -q \
            "faster-whisper==1.2.0" \
            "requests>=2.32,<3"

      - name: Audit complete private owner corpus with strong PT-BR ASR
        env:
          PYTHONPATH: ${{ github.workspace }}
          BR_OWNER_PROFESSIONAL_PUBLIC_OUT: /tmp/br-owner-professional-public
        run: |
          set -euo pipefail
          /tmp/br-owner-stt-venv/bin/python scripts/owner_voice_professional_corpus_audit.py
          echo "OWNER_VOICE_BAKEOFF=BLOCKED_UNTIL_CORPUS_AUDIT_RECONCILED"

      - name: Upload sanitized professional corpus evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-voice-professional-corpus-audit-public
          path: /tmp/br-owner-professional-public
          if-no-files-found: error
          retention-days: 3

      - name: Verify repository contains no owner biometric material
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all -- '*.wav' '*.flac' '*.ogg' '*.oga' '*.opus' '*.mp3' '*.m4a' '*.pt')"
          echo "RAW_OWNER_AUDIO_IN_GIT=0"
          echo "RAW_OWNER_AUDIO_IN_PUBLIC_ARTIFACT=0"
          echo "VOICE_PROMPT_IN_GIT=0"
          echo "OWNER_BIOMETRIC_ACTION_ARTIFACTS=0"

      - name: Remove ephemeral owner biometric material
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -rf \
            /tmp/br-owner-voice \
            /tmp/br-owner-huggingface \
            /tmp/br-owner-stt-venv \
            /tmp/br-owner-chatterbox-venv
          echo "OWNER_EPHEMERAL_PRIVATE_MATERIAL_CLEANED=PASS"
