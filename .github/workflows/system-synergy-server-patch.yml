name: System Synergy Targeted YouTube Patch

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .github/workflows/system-synergy-server-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python scripts/apply_targeted_youtube_harness_patch.py
      - name: Verify focused syntax
        run: |
          python -m compileall -q app/integrations/deepseek_harness/server.py app/services/harness_youtube_publication_service.py
      - name: Remove one-shot patch infrastructure
        run: |
          rm scripts/apply_targeted_youtube_harness_patch.py
          rm .github/workflows/system-synergy-server-patch.yml
      - name: Commit and push exact mutation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/integrations/deepseek_harness/server.py tests/test_deepseek_harness.py scripts/apply_targeted_youtube_harness_patch.py .github/workflows/system-synergy-server-patch.yml
          git diff --cached --check
          git commit -m "feat(harness): route exact YouTube publication targets"
          git push origin HEAD:work/gate6f-analytics-learning
