name: RUN-001 Final Products Bootstrap

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run001/final-products-bootstrap.ready

permissions:
  contents: write
  actions: write

jobs:
  install-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REF: work/gate6f-analytics-learning
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify and install prepared final-product implementation
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$TARGET_REF"
          cat .run001/final-products-bootstrap.part.* > /tmp/run001-final-products.b64
          base64 -d /tmp/run001-final-products.b64 > /tmp/run001-final-products.tar.gz
          echo "df5cb1a05373ab091fee99fa326fd2d59dd2af278d672eb9350eabb56b981f81  /tmp/run001-final-products.tar.gz" | sha256sum -c -
          tar -xzf /tmp/run001-final-products.tar.gz
          rm -f .run001/final-products-bootstrap.b64 .run001/final-products-bootstrap.part.* .run001/final-products-bootstrap.ready .github/workflows/run001-bootstrap.yml
          python -m py_compile \
            app/workers/audiovisual_worker.py \
            app/workers/professional_audiovisual_worker.py \
            scripts/run001_final_product_dispatch.py \
            scripts/run001_professional_finalize_qa.py \
            scripts/telegram_render_review_worker.py \
            tests/test_professional_audiovisual_worker.py
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('products/run001/video-a-v1.json'),
              Path('products/run001/video-b-v1.json'),
              Path('.run001/final-products-request.json'),
          ):
              json.loads(path.read_text(encoding='utf-8'))
          print('RUN001_PRECOMMIT_STATIC_VALIDATION=PASS')
          PY
      - name: Commit real implementation to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(run001): enforce A1 voice and dispatch RUN-001 final products"
          git push origin "HEAD:${TARGET_REF}"
          echo "FINAL_IMPLEMENTATION_HEAD=$(git rev-parse HEAD)"
      - name: Dispatch final-products control plane
        run: |
          set -euo pipefail
          sleep 6
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({'ref': os.environ['TARGET_REF']}))
          PY
          )"
          for attempt in 1 2 3 4 5; do
            if printf '%s' "$payload" | gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/run001-final-products-dispatch.yml/dispatches" \
              --input -; then
              echo "FINAL_PRODUCTS_DISPATCH=ACCEPTED"
              exit 0
            fi
            sleep 5
          done
          echo "FINAL_PRODUCTS_DISPATCH=FAILED" >&2
          exit 1
