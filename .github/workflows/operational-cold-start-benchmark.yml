name: Operational Cold Start Benchmark

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run001/operational-cold-start-benchmark.request.json

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Measure current cold-start stack
        run: |
          set -euo pipefail
          python scripts/benchmark_cold_start_runtime.py \
            --mode baseline \
            --output runtime/cold-start/baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: cold-start-baseline-${{ github.run_id }}
          path: runtime/cold-start/baseline.json
          if-no-files-found: error
          retention-days: 30

  seed-runtime-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore or prepare versioned media venv
        id: media-venv
        uses: actions/cache@v4
        with:
          path: .venv-media
          key: media-venv-v2-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements.txt', 'requirements/**/*.txt', 'pyproject.toml') }}
      - name: Build media venv only on cache miss
        if: steps.media-venv.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf .venv-media
          python -m venv .venv-media
          .venv-media/bin/python -m pip install --upgrade pip
          .venv-media/bin/python -m pip install \
            -r requirements.txt \
            pytest \
            "yt-dlp[default]" \
            "bgutil-ytdlp-pot-provider==1.3.1" \
            "edge-tts==7.2.8" \
            "faster-whisper==1.2.0"
      - name: Verify cached environment contract
        run: |
          set -euo pipefail
          .venv-media/bin/python - <<'PY'
          import importlib.metadata as m
          import sys
          assert sys.version_info[:2] == (3, 12)
          assert m.version("edge-tts") == "7.2.8"
          assert m.version("faster-whisper") == "1.2.0"
          assert m.version("bgutil-ytdlp-pot-provider") == "1.3.1"
          assert m.version("yt-dlp")
          print("MEDIA_VENV_CACHE_CONTRACT=PASS")
          PY
          echo "MEDIA_VENV_CACHE_HIT=${{ steps.media-venv.outputs.cache-hit }}"

  cached-candidate:
    needs: seed-runtime-cache
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact versioned media venv
        id: media-venv
        uses: actions/cache@v4
        with:
          path: .venv-media
          key: media-venv-v2-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements.txt', 'requirements/**/*.txt', 'pyproject.toml') }}
          fail-on-cache-miss: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Measure cached ephemeral-runner candidate
        run: |
          set -euo pipefail
          test "${{ steps.media-venv.outputs.cache-hit }}" = "true"
          .venv-media/bin/python scripts/benchmark_cold_start_runtime.py \
            --mode cached \
            --output runtime/cold-start/cached.json
      - uses: actions/upload-artifact@v4
        with:
          name: cold-start-cached-${{ github.run_id }}
          path: runtime/cold-start/cached.json
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: [baseline, cached-candidate]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: cold-start-*-${{ github.run_id }}
          path: runtime/cold-start/downloaded
          merge-multiple: true
      - name: Compare observed job wall-clock without auto-promotion
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from app.services.operational_efficiency_policy import evaluate_optimization_promotion

          files=list(Path('runtime/cold-start/downloaded').glob('*.json'))
          docs=[json.loads(p.read_text()) for p in files]
          base=next(d for d in docs if d['mode']=='baseline')
          cand=next(d for d in docs if d['mode']=='cached')
          assert base['versions']==cand['versions']
          assert base['workload_fingerprint']==cand['workload_fingerprint']
          assert cand['pip_strategy']=='restored-versioned-venv-cache'
          assert base['technical_qa_no_regression']=='PASS'
          assert cand['technical_qa_no_regression']=='PASS'

          repository=os.environ['GITHUB_REPOSITORY']
          run_id=os.environ['GITHUB_RUN_ID']
          jobs=json.loads(subprocess.check_output(
              ['gh','api',f'repos/{repository}/actions/runs/{run_id}/jobs?per_page=100'],
              text=True,
          ))['jobs']

          def duration(name):
              job=next(item for item in jobs if item['name']==name)
              start=datetime.fromisoformat(job['started_at'].replace('Z','+00:00'))
              end=datetime.fromisoformat(job['completed_at'].replace('Z','+00:00'))
              return (end-start).total_seconds()

          baseline_job_seconds=duration('baseline')
          candidate_job_seconds=duration('cached-candidate')
          seed_job_seconds=duration('seed-runtime-cache')

          b={
              'observed':True,
              'workload_fingerprint':base['workload_fingerprint'],
              'metrics':{
                  'wall_clock_seconds':baseline_job_seconds,
                  'external_calls':0,'process_count':0,'encode_count':0,'decode_count':0,
                  'download_count':0,'artifact_size_bytes':0,'cache_hit_rate':0,
              },
          }
          c={
              'observed':True,
              'workload_fingerprint':cand['workload_fingerprint'],
              'metrics':{
                  'wall_clock_seconds':candidate_job_seconds,
                  'external_calls':0,'process_count':0,'encode_count':0,'decode_count':0,
                  'download_count':0,'artifact_size_bytes':0,'cache_hit_rate':1,
              },
          }
          decision=evaluate_optimization_promotion(
              baseline_observation=b,
              candidate_observation=c,
              technical_qa_no_regression=True,
              human_quality_applicable=False,
              human_quality_no_regression=None,
              evidence_refs=('cold-start-baseline.json','cold-start-cached.json','github-actions-job-timestamps'),
              guardrail_budgets={'wall_clock_seconds':0.0},
          )
          improvement_fraction=(
              (baseline_job_seconds-candidate_job_seconds)/baseline_job_seconds
              if baseline_job_seconds else 0.0
          )
          out={
              'status':'PASS',
              'baseline':base,
              'candidate':cand,
              'job_wall_clock_seconds':{
                  'baseline':baseline_job_seconds,
                  'cached_candidate':candidate_job_seconds,
                  'cache_seed':seed_job_seconds,
                  'first_run_candidate_with_seed':seed_job_seconds+candidate_job_seconds,
              },
              'absolute_seconds_saved_repeated_run':baseline_job_seconds-candidate_job_seconds,
              'percent_improvement_repeated_run':improvement_fraction*100.0,
              'evaluation':decision.to_dict(),
              'quality_regression':'NO',
              'promotion_performed':False,
              'promotion_requires_control_plane_commit':True,
              'candidate_scope':'ephemeral runner with warm versioned repository dependency cache',
          }
          Path('runtime/cold-start/comparison.json').write_text(json.dumps(out,indent=2))
          print('COLD_START_BENCHMARK=PASS')
          print(f'BASELINE_JOB_SECONDS={baseline_job_seconds:.3f}')
          print(f'CACHED_CANDIDATE_JOB_SECONDS={candidate_job_seconds:.3f}')
          print(f'CACHE_SEED_JOB_SECONDS={seed_job_seconds:.3f}')
          print(f'ABSOLUTE_SECONDS_SAVED={baseline_job_seconds-candidate_job_seconds:.3f}')
          print(f'PERCENT_IMPROVEMENT={improvement_fraction*100.0:.3f}')
          print('PERFORMANCE_IMPROVED='+('OBSERVED' if decision.performance_improved else 'NO'))
          print('CANDIDATE_EVALUATION='+decision.decision)
          print('QUALITY_REGRESSION=NO')
          print('PROMOTION_PERFORMED=NO')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cold-start-comparison-${{ github.run_id }}
          path: runtime/cold-start/comparison.json
          if-no-files-found: error
          retention-days: 30
