name: PT-BR Voice Casting Round 2
run-name: PT-BR voice casting · blind round 2 resume · ${{ github.run_attempt }}

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run001/voice-casting-round2.request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: ptbr-voice-casting-round2
  cancel-in-progress: false

jobs:
  voice-casting-round2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate governed resume request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          req=json.loads(Path('.run001/voice-casting-round2.request.json').read_text())
          fb=json.loads(Path('.run001/voice-casting-round1-feedback.json').read_text())
          if req['selected_blind_ids']!=['Voice B','Voice C']:
              raise SystemExit('ROUND2_SELECTED_IDS_MISMATCH')
          if fb['feedback']['top2']!=['Voice B','Voice C']:
              raise SystemExit('ROUND1_HUMAN_FEEDBACK_MISMATCH')
          if req.get('resume_from_run_id')!=35398148125:
              raise SystemExit('ROUND2_RESUME_RUN_MISMATCH')
          if req.get('resume_proof_artifact_id')!=10569806440:
              raise SystemExit('ROUND2_RESUME_PROOF_ARTIFACT_MISMATCH')
          if req.get('resume_private_artifact_id')!=10570056356:
              raise SystemExit('ROUND2_RESUME_PRIVATE_ARTIFACT_MISMATCH')
          if req['job18_frozen'] is not True or req['publication_authority']!='NONE':
              raise SystemExit('AUTHORITY_INVARIANT_FAIL')
          print('ROUND1_HUMAN_FEEDBACK=CONSUMED')
          print('HUMAN_TOP2_SELECTED=YES')
          print('ROUND1_REPEATED=NO')
          print('ROUND2_AUDIO_CHECKPOINT_REUSE=REQUIRED')
          PY
          git merge-base --is-ancestor 17d6e762a9fd0af52928025a6202172f49b4c3b8 HEAD

      - name: Install resume validation runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt pytest

      - name: Focused Round 2 and authority tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_voice_casting_round2_service.py \
            tests/test_voice_casting_service.py \
            tests/test_harness_capability_service.py \
            tests/test_harness_routing_policy_service.py

      - name: Restore completed Round 2 public audio checkpoint
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 10569806440
          run-id: 35398148125
          github-token: ${{ github.token }}
          path: runtime/round2-checkpoint

      - name: Restore private Round 2 identity checkpoint
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 10570056356
          run-id: 35398148125
          github-token: ${{ github.token }}
          path: runtime/round2-private-checkpoint

      - name: Materialize and revalidate completed audio checkpoint
        run: |
          set -euo pipefail
          src="$(find runtime/round2-checkpoint -name voice-casting-round2-manifest.json -printf '%h\n' -quit)"
          if [ -z "$src" ]; then
            echo "ROUND2_CHECKPOINT_NOT_FOUND" >&2
            exit 1
          fi
          rm -rf runtime/voice-casting-round2
          mkdir -p runtime/voice-casting-round2/proof runtime/voice-casting-round2/private
          cp -a "$src"/. runtime/voice-casting-round2/proof/
          private_file="$(find runtime/round2-private-checkpoint -name round2-private-identity-resolution.json -print -quit)"
          if [ -z "$private_file" ]; then
            echo "ROUND2_PRIVATE_CHECKPOINT_NOT_FOUND" >&2
            exit 1
          fi
          cp "$private_file" runtime/voice-casting-round2/private/
          count=0
          for audio in runtime/voice-casting-round2/proof/samples/*.mp3; do
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$audio" >/dev/null
            ffmpeg -nostdin -v error -xerror -i "$audio" -map 0:a:0 -f null - >/dev/null 2>&1
            count=$((count+1))
          done
          if [ "$count" -ne 22 ]; then
            echo "ROUND2_SAMPLE_COUNT_INVALID=$count" >&2
            exit 1
          fi
          echo "ROUND2_AUDIO_CHECKPOINT_REUSED=YES"
          echo "ROUND2_SAMPLE_FULL_DECODE_COUNT=$count"
          echo "REDUNDANT_TTS_REQUESTS=0"

      - name: Initialize canonical Learning Plane and finalize Round 2 state
        run: |
          set -euo pipefail
          python scripts/finalize_voice_casting_round2.py \
            --proof-dir runtime/voice-casting-round2/proof \
            --feedback .run001/voice-casting-round1-feedback.json \
            --checkpoint .run001/voice-casting-round1.checkpoint.json \
            --source-run-id 35398148125 \
            --source-artifact-id 10569806440

      - name: Validate Round 2 technical and learning contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('runtime/voice-casting-round2/proof')
          manifest=json.loads((root/'voice-casting-round2-manifest.json').read_text())
          prosody=json.loads((root/'prosody-window-benchmark.json').read_text())
          boundary=json.loads((root/'boundary-artifact-audit.json').read_text())
          rates=json.loads((root/'rate-benchmark.json').read_text())
          learning=json.loads((root/'learning-plane-evidence.json').read_text())
          perf=json.loads((root/'round2-performance.json').read_text())
          state=json.loads((root/'voice-casting-round2-state.json').read_text())
          checks={
              'ROUND2_MULTICONTEXT': all(
                  x['technical_qa']['status']=='PASS'
                  for by_voice in manifest['multicontext'].values()
                  for x in by_voice.values()
              ),
              'PROSODY_WINDOW_BENCHMARK': prosody['status']=='PASS' and prosody['automatic_winner'] is None,
              'BOUNDARY_ARTIFACT_AUDIT': boundary['status']=='PASS' and boundary['automatic_naturalness_judgment'] is False,
              'RATE_TUNING': rates['status']=='PASS' and rates['automatic_winner'] is None,
              'LEARNING_PLANE': learning['status']=='PASS' and learning['schema_initialized'] is True,
              'CHECKPOINT_REUSE': perf['synthesis_checkpoint_reused'] is True and perf['redundant_tts_requests']==0,
              'HUMAN_FINAL_SELECTION_REQUIRED': state['status']=='HUMAN_FINAL_SELECTION_REQUIRED',
              'NO_PREMATURE_PROMOTION': state['official_profile_promoted'] is False,
          }
          for key,value in checks.items():
              print(f'{key}={"PASS" if value else "FAIL"}')
          if not all(checks.values()):
              raise SystemExit('ROUND2_FINALIZATION_CONTRACT=FAIL')
          print('AUTOMATIC_WINNER=NONE')
          print('IDENTITY_REVEALED=NO')
          print('JOB18_UNCHANGED=YES')
          print('PUBLICATION_AUTHORITY_UNCHANGED=YES')
          PY

      - name: Deliver Round 2 diagnostics to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID || secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          set -euo pipefail
          python scripts/send_voice_casting_round2_telegram.py

      - name: Validate human gate delivery
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('runtime/voice-casting-round2/proof')
          delivery=json.loads((root/'telegram-round2-delivery.json').read_text())
          state=json.loads((root/'voice-casting-round2-state.json').read_text())
          print('TELEGRAM_ROUND2_STATUS='+delivery['status'])
          if delivery['status']!='SENT':
              raise SystemExit(delivery.get('reason','ROUND2_TELEGRAM_NOT_SENT'))
          if delivery['identity_revealed'] is not False or delivery['round1_audio_repeated'] is not False:
              raise SystemExit('ROUND2_DELIVERY_BLINDING_FAIL')
          if delivery['sample_count']!=22:
              raise SystemExit('ROUND2_DELIVERY_SAMPLE_COUNT_FAIL')
          if state['official_profile_promoted'] is not False:
              raise SystemExit('PREMATURE_OFFICIAL_PROFILE_PROMOTION')
          print('ROUND2_MULTICONTEXT=DELIVERED')
          print('PROSODY_WINDOW_BENCHMARK=PASS')
          print('RATE_TUNING=PASS')
          print('HUMAN_FINAL_SELECTION_REQUIRED=YES')
          PY

      - name: Upload final public Round 2 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptbr-voice-casting-round2-final-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/voice-casting-round2/proof/
          if-no-files-found: error
          retention-days: 30

      - name: Upload private Round 2 identity state separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptbr-voice-casting-round2-final-private-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/voice-casting-round2/private/
          if-no-files-found: error
          retention-days: 30
