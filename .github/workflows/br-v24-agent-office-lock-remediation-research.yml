name: BR V24 Agent Office Lock Remediation Research

on:
  push:
    branches:
      - work/br-slm-agent-reconstruction-v24
    paths:
      - ".github/workflows/br-v24-agent-office-lock-remediation-research.yml"
      - "scripts/br_v24_office_supply_chain_graph.py"
      - "tests/test_br_v24_office_supply_chain_graph.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v24-agent-office-lock-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  no-execution-vendor-lock-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CI: "true"
      npm_config_ignore_scripts: "true"
    steps:
      - name: Exact BR candidate with no persisted write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Untrusted pinned Agent Office source in runner isolation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: chaitanyagiri/munder-difflin
          ref: 6248293a7cd9dfdbf9633d12bbe857831ccfee88
          path: .br-v24-untrusted-office-research
          submodules: false
          persist-credentials: false
      - name: Node 24 npm metadata tools only
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact source and existing BR preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/br-slm-agent-reconstruction-v24"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .br-v24-untrusted-office-research rev-parse HEAD)" = "6248293a7cd9dfdbf9633d12bbe857831ccfee88"
          python scripts/agent_office_preflight.py --upstream-dir "$GITHUB_WORKSPACE/.br-v24-untrusted-office-research"
      - name: Prove static lock ancestry cannot grant authority
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_br_v24_office_supply_chain_graph.py' -v
      - name: Only ephemeral lock resolution with existing approved proxy-addr version
        shell: bash
        working-directory: .br-v24-untrusted-office-research
        run: |
          set -euo pipefail
          npm pkg set 'overrides.proxy-addr=2.0.8'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --json > "$RUNNER_TEMP/br-v24-office-before.json" || true
          test -s "$RUNNER_TEMP/br-v24-office-before.json"
      - name: Attempt npm-recommended semver-compatible patched lock only; never run vendor code
        shell: bash
        working-directory: .br-v24-untrusted-office-research
        run: |
          set -euo pipefail
          set +e
          npm audit fix --package-lock-only --omit=dev --ignore-scripts --no-fund --force=false > "$RUNNER_TEMP/br-v24-office-fix-stdout.txt" 2>&1
          rc=$?
          set -e
          echo "BR_V24_NPM_FIX_LOCK_ONLY_EXIT=$rc"
          npm audit --omit=dev --json > "$RUNNER_TEMP/br-v24-office-after.json" || true
          test -s "$RUNNER_TEMP/br-v24-office-after.json"
          test "$(git rev-parse HEAD)" = "6248293a7cd9dfdbf9633d12bbe857831ccfee88"
          test ! -d node_modules
          unexpected="$(git status --porcelain --untracked-files=all | sed -E 's/^...//' | grep -Ev '^(package.json|package-lock.json)$' || true)"
          test -z "$unexpected"
      - name: Write audit-only remediation delta and explicitly withhold upstream admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          folder=Path(os.environ["RUNNER_TEMP"])
          src=Path(".br-v24-untrusted-office-research")
          before=json.loads((folder/"br-v24-office-before.json").read_text())
          after=json.loads((folder/"br-v24-office-after.json").read_text())
          def observed(v):
              meta=(v.get("metadata") or {}).get("vulnerabilities") or {}
              kinds=("critical","high","moderate","low","info","total")
              if not isinstance(v.get("vulnerabilities"),dict) or any(type(meta.get(x)) is not int for x in kinds):
                  raise SystemExit("BR_V24_NPM_AUDIT_INVALID")
              return {"counts":{k:meta[k] for k in kinds},
                      "high_packages":sorted(k for k,entry in v["vulnerabilities"].items() if entry.get("severity") in ("critical","high"))}
          p=observed(before);q=observed(after)
          lock=(src/"package-lock.json").read_bytes()
          result={
              "schema":"BRV24EphemeralVendorLockRemediationResearch/v1",
              "br_head":os.environ["GITHUB_SHA"],
              "vendor_head":"6248293a7cd9dfdbf9633d12bbe857831ccfee88",
              "baseline":p,"candidate":q,
              "ephemeral_candidate_lock_sha256":hashlib.sha256(lock).hexdigest(),
              "original_vendor_lock_modified_in_repo":False,
              "candidate_promoted":False,
              "vendor_source_executed":False,
              "agent_office_mcp_started":False,
              "independent_review_required":True,
              "upstream_admission":"BLOCKED_UNTIL_INDEPENDENT_REVIEW",
              "braces_unpatched_advisory_review_required": "braces" in q["high_packages"],
              "a15_compute":False,
          }
          output=folder/"br-v24-office-lock-research.json"
          output.write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print("BR_V24_LOCK_RESEARCH_BASELINE_HIGH="+str(p["counts"]["high"]))
          print("BR_V24_LOCK_RESEARCH_CANDIDATE_HIGH="+str(q["counts"]["high"]))
          print("BR_V24_LOCK_RESEARCH_CANDIDATE_PACKAGES="+",".join(q["high_packages"]))
          print("BR_V24_LOCK_RESEARCH_CANDIDATE_SHA256="+result["ephemeral_candidate_lock_sha256"])
          print("BR_V24_AGENT_OFFICE_AUTHORIZATION=BLOCKED")
          print("BR_V24_AGENT_OFFICE_UPSTREAM_EXECUTION=NOT_ATTEMPTED")
          PY
      - name: Trace remaining HIGH risks to production dependency ancestors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          root=Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          sys.path.insert(0,str(root))
          from scripts.br_v24_office_supply_chain_graph import high_dependency_paths
          pkg=json.loads((root/".br-v24-untrusted-office-research/package-lock.json").read_text())
          audit=json.loads((Path(os.environ["RUNNER_TEMP"])/"br-v24-office-after.json").read_text())
          report=high_dependency_paths(pkg,audit)
          report["br_head"]=os.environ["GITHUB_SHA"]
          report["source_commit"]="6248293a7cd9dfdbf9633d12bbe857831ccfee88"
          path=Path(os.environ["RUNNER_TEMP"])/"br-v24-office-reachability.json"
          if path.exists() or path.is_symlink():
              raise SystemExit("BR_OFFICE_REACHABILITY_RECEIPT_ALREADY_EXISTS")
          path.write_text(json.dumps(report,indent=2,sort_keys=True)+"\\n")
          high=report["high"]
          reachable=sum(any(n["reachable_by_static_production_edges"] for n in x["nodes"]) for x in high)
          print("BR_V24_OFFICE_CANDIDATE_HIGH_ISSUE_COUNT="+str(len(high)))
          print("BR_V24_OFFICE_STATICALLY_PROD_REACHABLE_HIGH="+str(reachable))
          for issue in high:
              paths=[n["dependency_chain"] for n in issue["nodes"] if n["reachable_by_static_production_edges"]]
              print("BR_V24_OFFICE_HIGH_ANCESTRY="+issue["package"]+":"+(" -> ".join(paths[0]) if paths else "UNRESOLVED_STATICALLY"))
          print("BR_V24_OFFICE_GRAPH_IS_NOT_RUNTIME_APPROVAL=TRUE")
          PY
      - name: Preserve only sanitized review delta (no upstream lock install)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-v24-office-lock-research-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/br-v24-office-lock-research.json
            ${{ runner.temp }}/br-v24-office-reachability.json
          if-no-files-found: warn
          retention-days: 7
