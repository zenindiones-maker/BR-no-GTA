name: Continuous Intelligence Schedule Proof
run-name: Continuous Schedule Proof ${{ github.run_id }}

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: br-continuous-intelligence-schedule-proof
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout default-branch scheduler definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact promoted deployment
        id: deployment
        env:
          REQUEST_ID: schedule-proof-${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          deployment=json.loads(
              Path("config/continuous_operation_deployment.json").read_text(
                  encoding="utf-8"
              )
          )
          execution_ref=str(deployment.get("execution_ref") or "").strip()
          expected_sha=str(deployment.get("expected_sha") or "").strip().lower()
          policy_sha=str(deployment.get("policy_sha256") or "").strip().lower()
          contract=str(deployment.get("workflow_contract_version") or "").strip()
          evidence=[
              str(x).strip()
              for x in deployment.get("promotion_evidence_refs") or []
              if str(x).strip()
          ]
          if (
              deployment.get("schema")!="ContinuousOperationDeployment/v1"
              or deployment.get("enabled") is not True
              or not re.fullmatch(r"[A-Za-z0-9._/-]+", execution_ref)
              or ".." in execution_ref
              or not re.fullmatch(r"[0-9a-f]{40}", expected_sha)
              or not re.fullmatch(r"[0-9a-f]{64}", policy_sha)
              or not contract.startswith("continuous-executor/")
              or not evidence
          ):
              raise SystemExit("SCHEDULE_PROOF_DEPLOYMENT_BINDING=FAIL")
          identity={
              "schema":"ContinuousOperationLogicalCycleIdentity/v1",
              "expected_sha":expected_sha,
              "policy_sha256":policy_sha,
              "cycle_kind":str(deployment.get("cycle_kind") or ""),
              "mode":"proof",
              "logical_event":{
                  "semantics":"NON_COALESCIBLE_EXPLICIT_PROOF",
                  "request_id":os.environ["REQUEST_ID"],
              },
          }
          raw=json.dumps(identity,sort_keys=True,separators=(",",":")).encode()
          cycle_id="continuous-cycle-"+hashlib.sha256(raw).hexdigest()[:24]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a",encoding="utf-8") as h:
              h.write(f"execution_ref={execution_ref}\n")
              h.write(f"expected_sha={expected_sha}\n")
              h.write(f"policy_sha256={policy_sha}\n")
              h.write(f"workflow_contract_version={contract}\n")
              h.write(f"cycle_id={cycle_id}\n")
          print("REAL_SCHEDULE_EVENT=PASS")
          print("SCHEDULE_HOST_DEFAULT_BRANCH=PASS")
          print("SCHEDULER_BUSINESS_LOGIC=0")
          print("DEPLOYMENT_BINDING=PASS")
          PY

      - name: Validate exact target and policy
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.deployment.outputs.expected_sha }}
          EXPECTED_POLICY_SHA256: ${{ steps.deployment.outputs.policy_sha256 }}
        run: |
          set -euo pipefail
          resolved="$(gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA" --jq .sha)"
          test "$resolved" = "$EXPECTED_SHA"
          gh api "repos/$GITHUB_REPOSITORY/contents/config/continuous_operation_policy.json?ref=$EXPECTED_SHA" --jq .content | tr -d '\n' | base64 -d > /tmp/continuous-policy.json
          actual_policy_sha="$(python3 - /tmp/continuous-policy.json <<'PY'
          import hashlib, json, sys
          payload=json.load(open(sys.argv[1], encoding="utf-8"))
          raw=json.dumps(
              payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          print(hashlib.sha256(raw).hexdigest())
          PY
          )"
          test "$actual_policy_sha" = "$EXPECTED_POLICY_SHA256"
          echo "TARGET_REF_RESOLVED=PASS"
          echo "TARGET_SHA_EXACT_MATCH=PASS"
          echo "DEPLOYMENT_POLICY_BINDING=PASS"

      - name: Dispatch exact executor from real schedule event
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_REF: ${{ steps.deployment.outputs.execution_ref }}
          EXPECTED_SHA: ${{ steps.deployment.outputs.expected_sha }}
          POLICY_SHA256: ${{ steps.deployment.outputs.policy_sha256 }}
          CYCLE_ID: ${{ steps.deployment.outputs.cycle_id }}
          CONTRACT_VERSION: ${{ steps.deployment.outputs.workflow_contract_version }}
        run: |
          set -euo pipefail
          default_branch="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)"
          gh workflow run continuous-intelligence-executor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$default_branch" \
            -f target_ref="$EXECUTION_REF" \
            -f expected_target_sha="$EXPECTED_SHA" \
            -f expected_policy_sha256="$POLICY_SHA256" \
            -f logical_cycle_id="$CYCLE_ID" \
            -f trigger_kind="schedule" \
            -f mode="proof" \
            -f scheduler_run_id="$GITHUB_RUN_ID" \
            -f workflow_contract_version="$CONTRACT_VERSION"
          echo "REAL_SCHEDULE_DISPATCH=PASS"
          echo "DISPATCH_IDENTITY=$CYCLE_ID"
