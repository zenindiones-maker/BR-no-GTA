name: Codex Current Account CI Auth

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".github/workflows/codex-current-account-ci-auth.yml"
      - ".run/codex-current-account-ci-auth.request.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENAI_WIF_ACCOUNT_ELIGIBILITY: "UNAVAILABLE_FOR_CURRENT_PLUS_ACCOUNT"
  OPENAI_WIF_ADMIN_BOOTSTRAP: "NOT_APPLICABLE_CURRENT_ACCOUNT"
  CODEX_PLUS_DIRECT_HEADLESS_AUTH: "UNSUPPORTED"
  PRIMARY_CI_AUTH_CANDIDATE: "TUXEVIL_ANTIGRAVITY_RESPONSES_PROXY"
  OFFICIAL_CI_EXECUTION_SURFACE: "openai/codex-action@v1"
  TUXEVIL_RESPONSES_ENDPOINT: "http://127.0.0.1:51200/v1/responses"
  TUXEVIL_PROOF_WORKFLOW: "tuxevil-codex-antigravity-proof.yml"
  OPENAI_PLATFORM_API_KEY_FALLBACK: "DEFERRED_UNTIL_TUXEVIL_PROOF"
  OPENAI_PLATFORM_API_KEY_REQUIRED: "NOT_BEFORE_TUXEVIL_PROOF"

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Report corrected current-account CI auth priority
        run: |
          set -euo pipefail
          echo "OPENAI_WIF_ACCOUNT_ELIGIBILITY=$OPENAI_WIF_ACCOUNT_ELIGIBILITY"
          echo "OPENAI_WIF_ADMIN_BOOTSTRAP=$OPENAI_WIF_ADMIN_BOOTSTRAP"
          echo "CODEX_PLUS_DIRECT_HEADLESS_AUTH=$CODEX_PLUS_DIRECT_HEADLESS_AUTH"
          echo "PRIMARY_CI_AUTH_CANDIDATE=$PRIMARY_CI_AUTH_CANDIDATE"
          echo "OFFICIAL_CI_EXECUTION_SURFACE=$OFFICIAL_CI_EXECUTION_SURFACE"
          echo "TUXEVIL_RESPONSES_ENDPOINT=$TUXEVIL_RESPONSES_ENDPOINT"
          echo "TUXEVIL_PROOF_WORKFLOW=$TUXEVIL_PROOF_WORKFLOW"
          echo "OPENAI_PLATFORM_API_KEY_FALLBACK=$OPENAI_PLATFORM_API_KEY_FALLBACK"
          echo "OPENAI_PLATFORM_API_KEY_REQUIRED=$OPENAI_PLATFORM_API_KEY_REQUIRED"
          echo "TERMUX_CODEX_SESSION_REUSED=NO"
          echo "AUTH_JSON_COPIED_TO_GITHUB=NO"
          echo "DEVICE_AUTH_IN_CI=NO"
          echo "NEW_OPENAI_API_KEY_REQUESTED=NO"
          echo "HARNESS_FAILURE=NO"
          echo "HERMES_FAILURE=NO"
          echo "AGENT_OFFICE_FAILURE=NO"
          echo "DELEGATION_PLANE_FAILURE=NO"
          echo "HARNESS_HERMES_FULL_SYNERGY=NOT_RUN"
