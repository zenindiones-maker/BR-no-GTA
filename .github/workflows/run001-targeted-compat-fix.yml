name: RUN-001 Targeted Compatibility Fix

on:
  push:
    branches:
      - work/gate6f-analytics-learning

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'chore(ci): apply targeted compatibility fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic compatibility fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('app/integrations/deepseek_harness/server.py')
          text = server.read_text(encoding='utf-8')
          old = '''    result = process_next_production_execution(\n        authorization_to_context(authorization),\n        goal_id=goal_id,\n    )\n'''
          new = '''    execution_context = authorization_to_context(authorization)\n    if goal_id is None:\n        result = process_next_production_execution(execution_context)\n    else:\n        result = process_next_production_execution(\n            execution_context,\n            goal_id=goal_id,\n        )\n'''
          assert text.count(old) == 1, 'server compatibility anchor mismatch'
          server.write_text(text.replace(old, new, 1), encoding='utf-8')

          consumer = Path('app/services/editorial_queue_consumer.py')
          text = consumer.read_text(encoding='utf-8')
          old = '''    return {\n        "queue_item": queue_item,\n        "script": script,\n        "script_spec": script_spec,\n        "content_item": content_item,\n        "production_plan_id": production_plan_id,\n        "production_plan": production_plan,\n        "status": "completed",\n        "goal_id": resolved_goal_id,\n        "idempotent": False,\n        "harness_context": execution_context,\n    }\n'''
          new = '''    result = {\n        "queue_item": queue_item,\n        "script": script,\n        "script_spec": script_spec,\n        "content_item": content_item,\n        "production_plan_id": production_plan_id,\n        "production_plan": production_plan,\n        "status": "completed",\n        "harness_context": execution_context,\n    }\n    if targeted_artifacts is not None:\n        result["goal_id"] = resolved_goal_id\n        result["idempotent"] = False\n    return result\n'''
          assert text.count(old) == 1, 'editorial compatibility anchor mismatch'
          consumer.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python -m compileall -q app
          git diff --check

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run001-targeted-compat-fix.yml
          git add app/integrations/deepseek_harness/server.py app/services/editorial_queue_consumer.py
          git commit -m "fix(targeting): preserve legacy execution contracts"
          git push origin HEAD:work/gate6f-analytics-learning
