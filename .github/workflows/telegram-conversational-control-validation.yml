name: Telegram Conversational Control Validation

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/telegram-conversational-control.request.json"

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: telegram-conversational-control-validation
  cancel-in-progress: true

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/telegram-conversation/canary.db
  BR_HERMES_UPSTREAM_ROOT: ${{ github.workspace }}/.runtime/hermes-agent

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish pending validation status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' '{"state":"pending","context":"telegram-conversational-control","description":"Telegram control-surface synergy validation running"}' > /tmp/status-pending.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d @/tmp/status-pending.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and bounded Hermes runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/telegram-conversation .runtime
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install psutil==7.2.2 pyyaml==6.0.3 python-dotenv==1.2.2 rich==14.3.3 pathspec==1.1.1
          python scripts/bootstrap_hermes_agent.py \
            --target "$BR_HERMES_UPSTREAM_ROOT" \
            --output artifacts/telegram-conversation/hermes-upstream.json
          test "$(git -C "$BR_HERMES_UPSTREAM_ROOT" rev-parse HEAD)" = "9eca7f388f71755293343dddd6ec4d9111d68fc4"
          echo "HERMES_UPSTREAM_PINNED=PASS"

      - name: Compile live control surface
        run: |
          set -euo pipefail
          python -m py_compile \
            app/services/telegram_control_surface_status.py \
            app/services/telegram_conversation_service.py \
            app/services/telegram_hermes_dispatch_service.py \
            scripts/telegram_harness_gateway.py \
            scripts/telegram_harness_gateway_v2.py \
            scripts/telegram_hermes_control_mission.py \
            scripts/telegram_conversational_control_canary.py
          echo "TELEGRAM_LIVE_CONTROL_COMPILE=PASS"

      - name: Run focused control-surface tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ env.BR_HERMES_UPSTREAM_ROOT }}
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_telegram_conversation_control.py \
            tests/test_telegram_gateway_conversation.py \
            tests/test_telegram_harness_integration.py \
            tests/test_hermes_multiagent_boundary.py \
            tests/test_hermes_kanban_live_core.py \
            tests/test_deepseek_harness.py \
            --junitxml=artifacts/telegram-conversation/pytest.xml
          echo "TELEGRAM_LIVE_CONTROL_TESTS=PASS"

      - name: Run provider-free live gateway and Hermes canary
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ env.BR_HERMES_UPSTREAM_ROOT }}
        run: |
          set -euo pipefail
          rm -f "$BR_TEST_DATABASE"
          python scripts/telegram_conversational_control_canary.py \
            --upstream-root "$BR_HERMES_UPSTREAM_ROOT" \
            --artifact-dir artifacts/telegram-conversation \
            --output artifacts/telegram-conversation/canary.json \
            2>&1 | tee artifacts/telegram-conversation/canary.log

      - name: Validate required system-synergy gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/telegram-conversation/canary.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["status"]=="PASS",d["checks"]
          required=[
              "LIVE_GATEWAY_USES_CONVERSATION_SERVICE",
              "TELEGRAM_PROVIDER_INDEPENDENT_CONTROL",
              "STATUS_WITHOUT_LLM",
              "APPROVAL_WITHOUT_LLM",
              "FEEDBACK_WITHOUT_LLM",
              "REFERENCE_RESOLUTION_WITHOUT_LLM",
              "CONTINUE_WITHOUT_LLM",
              "RESEARCH_WITHOUT_SYNTHESIS_LLM",
              "PROGRESS_HEARTBEAT_TELEGRAM_EGRESS_ZERO",
              "EXPLICIT_HUMAN_MESSAGE_REPLY",
              "HARNESS_STATUS_AGGREGATION",
              "TELEGRAM_TO_HERMES_MISSION",
              "HERMES_PROGRESS_AUDIT_ONLY",
              "PENDING_ACTION_PERSISTED",
              "PENDING_ACTION_RELOADED",
              "MISSION_ID_PRESERVED",
              "TASK_ID_PRESERVED",
              "APPROVAL_AFTER_RESTART",
              "HERMES_RESUME_AFTER_RESTART",
              "HUMAN_BLOCK_RESUME_LIVE",
              "RESTART_CONTINUITY",
              "HARNESS_AUTHORITY_PRESERVED",
              "NO_DIRECT_EXECUTOR_BYPASS",
              "NO_SECOND_CONTROL_PLANE",
              "OPENCODE_EXTERNAL_403_CONTAINED",
          ]
          for key in required:
              assert d["checks"].get(key) is True,(key,d["checks"])
              print(f"{key}=PASS")
          assert d["OPENCODE_V3_STATUS"]=="CANDIDATE_BLOCKED_UPSTREAM_FREE_TIER_403",d
          assert d["NEW_VOICE_SYNTHESIS"]=="NO",d
          assert d["FULL_RENDER"]=="NO",d
          assert d["YOUTUBE_UPLOAD"]=="NO",d
          assert d["YOUTUBE_PUBLICATION"]=="NO",d
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER=NO")
          print("YOUTUBE_UPLOAD=NO")
          print("YOUTUBE_PUBLICATION=NO")
          print("TELEGRAM_SYSTEM_SYNERGY=PASS")
          PY

      - name: Assert CI has no human Telegram egress
        run: |
          set -euo pipefail
          test ! -e artifacts/telegram-conversation/telegram-response.json
          echo "CI_STATUS_TELEGRAM_EGRESS=0"
          echo "PROGRESS_HEARTBEAT_TELEGRAM_EGRESS=0"
          echo "HERMES_PROGRESS_TELEGRAM_EGRESS=0"
          echo "UNSOLICITED_TELEGRAM_EGRESS=NO"

      - name: Upload complete validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-system-synergy-${{ github.run_id }}
          path: artifacts/telegram-conversation/
          if-no-files-found: error
          retention-days: 30

      - name: Publish commit validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json,os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "telegram-conversational-control",
              "description": "Telegram control-surface synergy validation",
              "target_url": (
                  "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d @/tmp/status.json
