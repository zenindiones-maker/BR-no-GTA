name: Gate6F Recovery Focused

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/gate6f-recovery-focused.request.json"

permissions:
  contents: read

env:
  PYTHONPATH: .
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/gate6f-recovery-focused/test.db

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install focused runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/gate6f-recovery-focused
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile focused regressions
        run: |
          set -euo pipefail
          python -m py_compile             app/services/telegram_harness_service.py             app/services/opencode_executor_profile_service.py             app/services/harness_ai_provider_service.py
      - name: Run Gate6F focused regression tests
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_telegram_harness_integration.py             tests/test_opencode_executor_profile_learning.py             tests/test_opencode_semantic_text_profile.py             tests/test_harness_ai_provider_service.py             --junitxml=artifacts/gate6f-recovery-focused/focused.xml
          echo "TELEGRAM_HARNESS_PROOF=PASS"
          echo "OPENCODE_SEMANTIC_V3_PROFILE=PASS"
          echo "GATE6F_FOCUSED=PASS"
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate6f-recovery-focused-${{ github.run_id }}
          path: artifacts/gate6f-recovery-focused/
          if-no-files-found: error
          retention-days: 14
