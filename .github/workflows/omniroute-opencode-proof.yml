name: OmniRoute OpenCode Zero-Cost Runtime Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-opencode-zero-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned OmniRoute
        run: |
          set -euo pipefail
          npm install -g omniroute@3.8.50
          omniroute --version

      - name: Start loopback-only gateway
        run: |
          set -euo pipefail
          OMNIROUTE_SERVER_HOST=127.0.0.1 nohup omniroute serve >/tmp/omniroute.log 2>&1 &
          echo $! >/tmp/omniroute.pid
          for i in {1..40}; do
            if curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:20128/api/monitoring/health >/tmp/health.json 2>/dev/null; then
              ss -H -ltn 'sport = :20128' | grep -Eq '127\.0\.0\.1:20128|\[::1\]:20128'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/omniroute.log || true
          exit 1

      - name: Execute exact free provider/model
        run: |
          set -euo pipefail
          mkdir -p runtime/omniroute-opencode-proof
          node - <<'NODE'
          const fs = require('fs');
          const provider = 'opencode';
          const model = 'oc/big-pickle';
          const prompt = 'Return only this valid JSON object: {"status":"ok","provider_proof":"opencode"}';
          const started = Date.now();
          fetch(`http://127.0.0.1:20128/v1/providers/${provider}/chat/completions`, {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            body: JSON.stringify({model, messages:[{role:'user', content:prompt}], stream:false})
          }).then(async response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
            const payload = await response.json();
            const reportedModel = String(payload.model || '');
            const aliasOk = reportedModel === model || (provider === 'opencode' && model.startsWith('oc/') && reportedModel === model.slice(3));
            if (!aliasOk) throw new Error(`model mismatch expected=${model} reported=${reportedModel}`);
            const text = payload.choices?.[0]?.message?.content || '';
            if (!text.trim()) throw new Error('empty result');
            const warnings = reportedModel === model ? [] : [`provider_reported_model_alias:${reportedModel}`];
            const out = {
              status:'EXECUTED', provider, model, reported_model:reportedModel, text,
              omniroute_version:'3.8.50', runtime_identity:'github-actions:ubuntu-latest:node24',
              cost_class:'FREE_NO_BILLING', credential_required:false,
              fallback_occurred:false, retry_count:0, warnings, errors:[],
              elapsed_seconds:(Date.now()-started)/1000
            };
            fs.writeFileSync('runtime/omniroute-opencode-proof/result.json', JSON.stringify(out));
            console.log(JSON.stringify({status:out.status,provider:out.provider,model:out.model,reported_model:out.reported_model,cost_class:out.cost_class,credential_required:out.credential_required,fallback_occurred:out.fallback_occurred}));
          }).catch(err => { console.error(err); process.exit(1); });
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: omniroute-opencode-zero-cost-proof
          path: runtime/omniroute-opencode-proof/result.json
          retention-days: 1
          if-no-files-found: error

      - name: Shutdown gateway
        if: always()
        run: |
          if [ -f /tmp/omniroute.pid ]; then kill "$(cat /tmp/omniroute.pid)" 2>/dev/null || true; fi
