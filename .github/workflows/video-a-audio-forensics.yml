name: VIDEO A Pronunciation Inventory and Audio Forensics

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "scripts/video_a_audio_forensics.py"
      - "app/services/narration_policy_promotion_guard.py"
      - ".github/workflows/video-a-audio-forensics.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: video-a-narration-production-readiness
  cancel-in-progress: true

jobs:
  inventory-and-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      SOURCE_AUDITION_RUN_ID: "35527492016"
      SOURCE_AUDITION_ARTIFACT_ID: "10610442121"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused forensic runtime
        run: |
          set -euo pipefail
          python -m pip install "faster-whisper==1.2.1"
          python -m py_compile \
            app/services/video_a_production_readiness.py \
            app/services/narration_policy_promotion_guard.py \
            scripts/video_a_audio_forensics.py

      - name: Download exact existing audition artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.SOURCE_AUDITION_ARTIFACT_ID }}
          run-id: ${{ env.SOURCE_AUDITION_RUN_ID }}
          github-token: ${{ github.token }}
          path: runtime/source-audition
          merge-multiple: true

      - name: Run corrected inventory and existing-audio reconciliation
        run: |
          set -euo pipefail
          mkdir -p runtime/video-a-audio-forensics
          python scripts/video_a_audio_forensics.py \
            --audition-root runtime/source-audition \
            --output-dir runtime/video-a-audio-forensics

      - name: Validate focused fail-closed contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("runtime/video-a-audio-forensics")
          inventory=json.loads((root/"corrected-pronunciation-inventory.json").read_text(encoding="utf-8"))
          proof=json.loads((root/"audio-forensics.json").read_text(encoding="utf-8"))
          assert inventory["FALSE_POSITIVE_TERMS"]==0, inventory
          assert inventory["PRONUNCIATION_TERMS_TOTAL"]>0, inventory
          assert inventory["PTBR_CANDIDATE_CONFIGURATION_PERCENT"]==100.0, inventory
          assert inventory["ALL_CONFIGURED_TERMS_PTBR"]=="PASS", inventory
          assert proof["historical_fidelity_counts"]["OMITTED_WORDS_DETECTED"]==5, proof
          assert proof["historical_fidelity_counts"]["SUBSTITUTED_WORDS_DETECTED"]==44, proof
          assert proof["MIXED_STRESS_PROPER_NOUN_ALIGNMENT_ERRORS"]==15, proof
          assert proof["LEONIDA_PRONUNCIATION"]=="FAIL", proof
          assert proof["GLOBAL_PRONUNCIATION_STATUS"]=="FAIL", proof
          assert proof["SEMANTIC_SECTION_POLICY_PRESERVED"]=="YES", proof
          assert proof["NARRATION_POLICY_PROMOTION"]=="PASS", proof
          assert proof["PRODUCTION_READINESS"]=="FAIL", proof
          assert proof["FULL_RENDER_AUTHORIZED"]=="NO", proof
          assert proof["YOUTUBE_PUBLICATION"]=="NO", proof
          print("CORRECTED_INVENTORY_OPERATIONAL_PROOF=PASS")
          print("FALSE_POSITIVE_TERMS=0")
          print("FULL_RENDER=NO")
          print("YOUTUBE_PUBLICATION=NO")
          PY

      - name: Upload focused forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-a-audio-forensics-${{ github.run_id }}
          path: runtime/video-a-audio-forensics/
          if-no-files-found: warn
          retention-days: 30
