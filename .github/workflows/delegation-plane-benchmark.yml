name: Harness Hermes Delegation Plane Benchmark

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".github/workflows/delegation-plane-benchmark.yml"
      - ".run/delegation-plane-benchmark.request.json"

permissions:
  contents: read

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/delegation-benchmark/benchmark.db

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install bounded runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/delegation-benchmark
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Focused delegation plane regressions
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_dynamic_system_improvement_scope.py             tests/test_harness_candidate_integration_service.py             tests/test_agent_office.py::test_registry_driven_specialist_contract_accepts_future_engineering_capability             tests/test_agent_office.py::test_registry_driven_readonly_specialist_rejects_write_scope             tests/test_agent_office.py::test_registry_driven_specialist_rejects_tool_expansion
          echo "TASK_HARDCODED_EXECUTION_LOGIC=0"
          echo "GENERIC_AGENT_OFFICE_ENGINEERING_BOUNDARY=PASS"
          echo "GENERIC_INDEPENDENT_REVIEW_GATE=PASS"
      - name: Benchmark legacy versus Delegation Plane V1
        run: |
          set -euo pipefail
          python scripts/delegation_plane_legacy_benchmark.py             --output artifacts/delegation-benchmark/benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/delegation-benchmark/benchmark.json").read_text())
          assert d["status"]=="PASS"
          assert d["summary"]["all_v1_authority_preserved"] is True
          assert d["summary"]["all_v1_evidence_contracts_complete"] is True
          assert d["summary"]["mean_planned_calls_avoided"] > 0
          assert d["execution_metrics_pending_operational_proof"] is True
          for case in d["cases"]:
              assert case["v1"]["tasks_created"] < case["legacy"]["tasks_created"]
              assert case["v1"]["authority"]=="DEEPSEEK_HARNESS"
          print("LEGACY_VS_DELEGATION_PLANE_V1=PASS")
          print("MINIMUM_SUFFICIENT_TEAM_PLANNING=PASS")
          print("TEAM_NOT_HARDCODED=PASS")
          print("EXECUTION_METRICS_PENDING_OPERATIONAL_PROOF=YES")
          print("CI_REAL_TELEGRAM_EGRESS=0")
          PY
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delegation-plane-benchmark-${{ github.run_id }}
          path: artifacts/delegation-benchmark/
          if-no-files-found: error
          retention-days: 30
