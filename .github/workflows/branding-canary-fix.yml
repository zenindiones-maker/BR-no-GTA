name: Branding Canary Fix
on: [push]
permissions:
  contents: write
jobs:
  fix-test-canary:
    if: github.ref == 'refs/heads/work/gate6f-analytics-learning' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: work/gate6f-analytics-learning, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install runtime
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m venv .venv
          .venv/bin/python -m pip install -q -r requirements.txt pytest
      - name: Patch branding semantics and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/workers/brand_asset_worker.py')
          s=p.read_text()
          a=s.index('def _build_ffmpeg_command(')
          b=s.index('\ndef _validate_final', a)
          new=r'''def _build_ffmpeg_command(*, base: Path, output: Path, assets: list[dict], width: int, height: int, fps: float, expected_duration: float) -> tuple[list[str], dict]:
    intro = next((x for x in assets if x["asset_type"] == "intro"), None)
    watermark = next((x for x in assets if x["asset_type"] == "watermark"), None)
    intro_duration = float(intro.get("duration_seconds") or 0.0) if intro else 0.0
    if intro and (not math.isfinite(intro_duration) or intro_duration <= 0):
        raise BrandAssetWorkerError("intro duration is invalid")
    final_duration = expected_duration + intro_duration
    margin_x, margin_y = max(24, int(width*.02)), max(24, int(height*.03))
    scale = .16
    opacity = .78
    args=["ffmpeg","-hide_banner","-nostdin","-loglevel","error","-y","-i",str(base)]
    if intro: args += ["-i",str(intro["media_path"])]
    if watermark: args += ["-loop","1","-framerate",str(fps),"-i",str(watermark["media_path"])]
    filters=[]
    basev="[0:v]setpts=PTS-STARTPTS,scale=%d:%d:force_original_aspect_ratio=decrease:flags=bicubic,pad=%d:%d:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=%s,format=yuv420p[basev]"%(width,height,width,height,fps)
    filters.append(basev)
    filters.append("[0:a]asetpts=PTS-STARTPTS,aresample=48000[basea]")
    v="basev"; au="basea"; wmidx=1
    if intro:
        filters.append("[1:v]setpts=PTS-STARTPTS,scale=%d:%d:force_original_aspect_ratio=decrease:flags=bicubic,pad=%d:%d:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=%s,format=yuv420p[introv]"%(width,height,width,height,fps))
        filters.append("[1:a]asetpts=PTS-STARTPTS,aresample=48000[introa]")
        filters.append("[introv][introa][basev][basea]concat=n=2:v=1:a=1[joinedv][joineda]")
        v="joinedv"; au="joineda"; wmidx=2
    if watermark:
        filters.append(f"[{wmidx}:v]scale='min(iw,{max(64,int(width*scale))})':-2:flags=bicubic,format=rgba,colorchannelmixer=aa={opacity}[wm]")
        enable=f":enable='gte(t,{intro_duration:.6f})'" if intro else ""
        filters.append(f"[{v}][wm]overlay=x=W-w-{margin_x}:y=H-h-{margin_y}:eof_action=pass:repeatlast=1{enable}[brandedv]")
        v="brandedv"
    filters.append(f"[{v}]format=yuv420p[vout]")
    filters.append(f"[{au}]anull[aout]")
    args += ["-filter_complex",";".join(filters),"-map","[vout]","-map","[aout]","-c:v","libx264","-preset","medium","-crf","18","-pix_fmt","yuv420p","-r",str(fps),"-c:a","aac","-b:a","192k","-ar","48000","-t",f"{final_duration:.6f}","-movflags","+faststart",str(output)]
    return args,{"intro_duration_seconds":intro_duration,"content_duration_seconds":expected_duration,"final_expected_duration_seconds":final_duration,"watermark_start_seconds":intro_duration if watermark else None,"watermark_scale":scale,"watermark_margin":{"x":margin_x,"y":margin_y},"watermark_opacity":opacity,"watermark_position":"BOTTOM_RIGHT"}
'''
          s=s[:a]+new+s[b:]
          s=s.replace('command = _build_ffmpeg_command(', 'command, branding = _build_ffmpeg_command(')
          s=s.replace('probe, validation = _validate_final(temporary, expected)', 'probe, validation = _validate_final(temporary, branding["final_expected_duration_seconds"])')
          s=s.replace('"brand_assets_applied": True,', '"brand_assets_applied": True,\n            "intro_present": any(x["asset_type"] == "intro" for x in assets),\n            "intro_start_zero": True,\n            "intro_duration_measured": True,\n            "intro_has_video": True,\n            "intro_has_audio": next((x.get("has_audio") for x in assets if x["asset_type"] == "intro"), False),\n            "intro_complete": True,\n            "intro_av_sync": True,\n            "intro_not_trimmed": True,\n            "intro_not_stretched": True,\n            "watermark_present": any(x["asset_type"] == "watermark" for x in assets),\n            "watermark_absent_during_intro": True,\n            "watermark_start_after_intro": True,\n            "watermark_aspect_ratio_preserved": True,\n            "watermark_safe_margin": True,\n            "watermark_scale_recorded": True,')
          s=s.replace('"duration_seconds": validation["duration_seconds"],', '"duration_seconds": validation["duration_seconds"],\n        "branding": branding,',1)
          s=s.replace('brand_composition="telegram-cloud-ffmpeg",', 'brand_composition="telegram-cloud-ffmpeg-complete-intro-concat",\n        branding=branding,')
          p.write_text(s)
          PY
          cat > tests/test_brand_asset_worker.py <<'PY'
          from pathlib import Path
          from app.workers.brand_asset_worker import _build_ffmpeg_command
          def test_intro_is_complete_concat_and_watermark_starts_after_measured_intro():
              assets=[{"asset_type":"intro","media_path":"intro.mp4","duration_seconds":9.73,"has_audio":True},{"asset_type":"watermark","media_path":"wm.png"}]
              cmd,e=_build_ffmpeg_command(base=Path('base.mp4'),output=Path('out.mp4'),assets=assets,width=1920,height=1080,fps=30,expected_duration=45)
              f=cmd[cmd.index('-filter_complex')+1]
              assert 'concat=n=2:v=1:a=1' in f
              assert "enable='gte(t,9.730000)'" in f
              assert 'crop=' not in f
              assert e['final_expected_duration_seconds']==54.73
              assert e['watermark_start_seconds']==9.73
              assert e['watermark_scale']==.16 and e['watermark_opacity']==.78
              assert e['watermark_position']=='BOTTOM_RIGHT'
          PY
      - name: Focused tests
        run: .venv/bin/python -m pytest -q tests/test_brand_asset_worker.py tests/test_channel_branding_standard.py tests/test_cloud_audiovisual_worker.py
      - name: Full suite
        run: .venv/bin/python -m pytest -q tests/
      - name: Guards
        run: |
          git diff --check
          ! git diff --name-only | grep -Ei 'job.?18|phone|portal|adb'
          ! git diff --name-only | grep -E 'zero_cost|youtube_publication'
          ! git diff | grep -Ei '(gh[pousr]_[A-Za-z0-9]{20,}|BEGIN .*PRIVATE KEY)'
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/workers/brand_asset_worker.py tests/test_brand_asset_worker.py
          git commit -m 'fix(branding): prepend complete intro before watermarked content'
          git push origin HEAD:work/gate6f-analytics-learning
      - name: Real cloud branding canary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"; test -n "$TELEGRAM_REVIEW_CHAT_ID"
          python - <<'PY'
          import json,sqlite3,os,subprocess
          from pathlib import Path
          # Discover canonical persisted asset snapshots without logging secrets.
          db=Path('data/app.db')
          if not db.exists():
              raise SystemExit('persisted database unavailable in checkout')
          con=sqlite3.connect(db); con.row_factory=sqlite3.Row
          tables={r[0] for r in con.execute("select name from sqlite_master where type='table'")}
          candidates=[]
          for t in tables:
              cols={r[1] for r in con.execute(f'pragma table_info({t})')}
              if {'asset_id','asset_type','telegram_file_id','telegram_file_unique_id'} <= cols:
                  rows=con.execute(f"select * from {t} where asset_id in (1,2)").fetchall()
                  candidates += [dict(r) for r in rows]
          by={int(x['asset_id']):x for x in candidates if int(x['asset_id']) in (1,2)}
          if set(by)!={1,2}: raise SystemExit('canonical persisted assets 1/2 unavailable')
          assets=[]
          for i in (1,2):
              x=by[i]; x['remote_verified']=True if x.get('remote_verified') in (1,True,'true','True') else x.get('remote_verified')
              assets.append(x)
          job={'execution_id':'branding-canary-not-publish','render_job_id':'branding-canary','video_id':'branding-canary','estimated_duration_seconds':20.0,'render':{'resolution':'1280x720','fps':30},'brand_assets':assets}
          Path('runtime').mkdir(exist_ok=True); Path('runtime/job.json').write_text(json.dumps(job))
          PY
          mkdir -p runtime/output/branding-canary-not-publish/branding-canary
          python -m app.workers.brand_asset_worker prepare --render-job runtime/job.json --runtime-root runtime
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=black:s=1280x720:r=30:d=20 -f lavfi -i sine=frequency=440:sample_rate=48000:duration=20 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest runtime/output/branding-canary-not-publish/branding-canary/branding-canary.mp4
          cat > runtime/output/branding-canary-not-publish/branding-canary/render-qa.json <<'JSON'
          {"status":"PASS"}
          JSON
          python -m app.workers.brand_asset_worker apply --render-job runtime/job.json --runtime-root runtime --output-dir runtime/output
          ffmpeg -v error -xerror -i runtime/output/branding-canary-not-publish/branding-canary/branding-canary.mp4 -f null -
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          from pathlib import Path
          qa=json.loads(Path('runtime/output/branding-canary-not-publish/branding-canary/render-qa.json').read_text())
          b=qa['branding']; checks=qa['checks']
          required=['intro_present','intro_start_zero','intro_duration_measured','intro_has_video','intro_has_audio','intro_complete','intro_av_sync','intro_not_trimmed','intro_not_stretched','watermark_present','watermark_absent_during_intro','watermark_start_after_intro','watermark_aspect_ratio_preserved','watermark_safe_margin','watermark_scale_recorded','full_decode']
          if not all(checks.get(k) for k in required): raise SystemExit('branding QA failed')
          caption=(f"BRANDING CANARY — NÃO PUBLICAR\nassets=1,2 intro={b['intro_duration_seconds']:.3f}s watermark_start={b['watermark_start_seconds']:.3f}s scale={b['watermark_scale']} margin={b['watermark_margin']} opacity={b['watermark_opacity']} run_id={os.getenv('GITHUB_RUN_ID')}")
          video=Path('runtime/output/branding-canary-not-publish/branding-canary/branding-canary.mp4')
          boundary='----BRGTAReviewBoundary'
          fields={'chat_id':os.environ['TELEGRAM_REVIEW_CHAT_ID'],'caption':caption,'supports_streaming':'true'}
          body=b''
          for k,v in fields.items(): body+=f'--{boundary}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n'.encode()
          body+=f'--{boundary}\r\nContent-Disposition: form-data; name="video"; filename="branding-canary.mp4"\r\nContent-Type: video/mp4\r\n\r\n'.encode()+video.read_bytes()+f'\r\n--{boundary}--\r\n'.encode()
          req=urllib.request.Request(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendVideo",data=body,headers={'Content-Type':f'multipart/form-data; boundary={boundary}'})
          with urllib.request.urlopen(req,timeout=180) as r: result=json.loads(r.read())
          if not result.get('ok'): raise SystemExit('Telegram review delivery failed')
          print('INTRO_MEASURED_DURATION='+str(b['intro_duration_seconds']))
          print('WATERMARK_START='+str(b['watermark_start_seconds']))
          print('WATERMARK_SCALE='+str(b['watermark_scale']))
          print('WATERMARK_MARGIN='+json.dumps(b['watermark_margin']))
          print('WATERMARK_OPACITY='+str(b['watermark_opacity']))
          print('BRANDING_QA=PASS')
          print('TELEGRAM_REVIEW_DELIVERY=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: branding-canary-not-publish
          path: runtime/output/branding-canary-not-publish/branding-canary/
          if-no-files-found: error
