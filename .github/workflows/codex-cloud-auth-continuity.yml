name: Codex Cloud Auth Continuity

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/codex-cloud-auth-continuity.request.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ZERO_COST_OPERATION: "TRUE"
  MISSION_ID: mission-auth-continuity-proof

jobs:
  runner-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prepare isolated Codex runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input python-dotenv==1.2.2
          bash scripts/agent-tooling/bootstrap.sh codex
          install -d -m 700 "$RUNNER_TEMP/codex-home"
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
      - name: Mint ephemeral GitHub workload identity
        env:
          RULE: ${{ vars.OPENAI_FEDERATION_RULE_ID }}
          AUDIENCE: ${{ vars.OPENAI_FEDERATION_AUDIENCE }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${RULE:-}" ] && missing+=("OPENAI_FEDERATION_RULE_ID")
          [ -z "${AUDIENCE:-}" ] && missing+=("OPENAI_FEDERATION_AUDIENCE")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "MISSING_AUTH_CONFIGURATION=$(IFS=,; echo "${missing[*]}")"
            exit 2
          fi
          token_file="$RUNNER_TEMP/codex-identity.jwt"
          request_url="$(python - <<'PY'
          import os, urllib.parse
          base=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          aud=os.environ["AUDIENCE"]
          print(base+("&" if "?" in base else "?")+urllib.parse.urlencode({"audience":aud}))
          PY
          )"
          python - "$request_url" "$token_file" <<'PY'
          import json, os, pathlib, sys, urllib.request
          req=urllib.request.Request(sys.argv[1],headers={"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req,timeout=30) as r:
              token=str(json.loads(r.read().decode())["value"])
          p=pathlib.Path(sys.argv[2]); p.write_text(token); p.chmod(0o600)
          PY
          echo "OPENAI_FEDERATION_RULE_ID=$RULE" >> "$GITHUB_ENV"
          echo "OPENAI_FEDERATION_AUDIENCE=$AUDIENCE" >> "$GITHUB_ENV"
          echo "OPENAI_IDENTITY_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          echo "AUTH_CREDENTIAL_IN_ARTIFACT=NO"
      - name: Verify runner A Codex auth
        env:
          BR_TEST_DATABASE: ${{ runner.temp }}/auth-a.db
        run: |
          set -euo pipefail
          mkdir -p proof-a
          python - <<'PY'
          import json
          from pathlib import Path
          from app.services.agent_office.codex_auth_control import classify_codex_auth
          state=classify_codex_auth(mission_id="mission-auth-continuity-proof",cwd=Path.cwd())
          Path("proof-a/auth.json").write_text(json.dumps({
            "state":state.state,
            "method":state.method,
            "lease_id":state.lease.lease_id if state.lease else None,
            "credential_material_persisted":False,
            "runner_name":"runner-a",
          },indent=2)+"\n")
          if not state.auth_available:
              raise SystemExit("RUNNER_A_CODEX_AUTH_STATE="+state.state)
          print("RUNNER_A_CODEX_AUTH_STATE=AVAILABLE")
          print("LOCAL_CODEX_AUTH_CONTEXT_EXPLICIT=PASS")
          print("CLOUD_CODEX_AUTH_CONTEXT_EXPLICIT=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: codex-auth-runner-a-${{ github.run_id }}
          path: proof-a/auth.json
          retention-days: 1

  runner-b:
    needs: runner-a
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: codex-auth-runner-a-${{ github.run_id }}
          path: proof-a
      - name: Prove runner A artifact contains no credential
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          raw=Path("proof-a/auth.json").read_text().lower()
          for forbidden in ("access_token","refresh_token","api_key","identity-token","bearer "):
              assert forbidden not in raw, forbidden
          print("AUTH_CREDENTIAL_IN_ARTIFACT=NO")
          PY
      - name: Prepare fresh isolated Codex runtime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input python-dotenv==1.2.2
          bash scripts/agent-tooling/bootstrap.sh codex
          install -d -m 700 "$RUNNER_TEMP/codex-home"
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
      - name: Mint independent ephemeral workload identity
        env:
          RULE: ${{ vars.OPENAI_FEDERATION_RULE_ID }}
          AUDIENCE: ${{ vars.OPENAI_FEDERATION_AUDIENCE }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/codex-identity.jwt"
          request_url="$(python - <<'PY'
          import os, urllib.parse
          base=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]; aud=os.environ["AUDIENCE"]
          print(base+("&" if "?" in base else "?")+urllib.parse.urlencode({"audience":aud}))
          PY
          )"
          python - "$request_url" "$token_file" <<'PY'
          import json, os, pathlib, sys, urllib.request
          req=urllib.request.Request(sys.argv[1],headers={"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req,timeout=30) as r:
              token=str(json.loads(r.read().decode())["value"])
          p=pathlib.Path(sys.argv[2]); p.write_text(token); p.chmod(0o600)
          PY
          echo "OPENAI_FEDERATION_RULE_ID=$RULE" >> "$GITHUB_ENV"
          echo "OPENAI_FEDERATION_AUDIENCE=$AUDIENCE" >> "$GITHUB_ENV"
          echo "OPENAI_IDENTITY_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
      - name: Verify new runner Codex auth continuity
        env:
          BR_TEST_DATABASE: ${{ runner.temp }}/auth-b.db
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from app.services.agent_office.codex_auth_control import classify_codex_auth
          previous=json.loads(Path("proof-a/auth.json").read_text())
          assert previous["state"]=="AVAILABLE"
          state=classify_codex_auth(mission_id="mission-auth-continuity-proof",cwd=Path.cwd())
          assert state.auth_available and state.state=="AVAILABLE", state.to_dict()
          assert state.lease is not None
          assert state.lease.credential_material_persisted is False
          print("NEW_RUNNER_CODEX_AUTH_STATE=AVAILABLE")
          print("CODEX_AUTH_CONTINUITY=PASS")
          print("EPHEMERAL_RUNNER_AUTH_LOOP=NO")
          print("AUTH_SECRET_LEAK=NO")
          print("AUTH_CREDENTIAL_IN_ARTIFACT=NO")
          print("AUTH_CREDENTIAL_IN_MEMORY=NO")
          print("AUTH_CREDENTIAL_IN_OBSIDIAN=NO")
          print("AUTH_CREDENTIAL_IN_TELEGRAM=NO")
          PY
