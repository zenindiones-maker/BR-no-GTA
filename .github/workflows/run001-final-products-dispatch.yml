name: RUN-001 Final Professional Products Dispatcher

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run001/final-products-request.json

permissions:
  contents: read
  actions: write

jobs:
  authorize-and-dispatch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'dispatch RUN-001 final products')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REF: work/gate6f-analytics-learning
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install control-plane dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
      - name: Verify bounded final-product request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path('.run001/final-products-request.json').read_text(encoding='utf-8'))
          expected = {
              'schema': 'run001-final-products-request/v1',
              'products': ['A', 'B'],
              'review_only': True,
              'youtube_publication': False,
              'job18_frozen': True,
              'human_editorial_approval': 'PENDING',
          }
          if request != expected:
              raise SystemExit(f'Final products request mismatch: {request!r}')
          print('RUN001_FINAL_PRODUCTS_REQUEST=PASS')
          print('JOB18_UNCHANGED=BY_DESIGN_NO_CANONICAL_DATABASE_ACCESS')
          PY
      - name: Harness-authorize VIDEO A and VIDEO B contracts
        run: |
          set -euo pipefail
          mkdir -p runtime/final-products
          python scripts/run001_final_product_dispatch.py \
            --product products/run001/video-a-v1.json \
            --output runtime/final-products/video-a-render-job.json
          python scripts/run001_final_product_dispatch.py \
            --product products/run001/video-b-v1.json \
            --output runtime/final-products/video-b-render-job.json
      - name: Dispatch VIDEO A professional render
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          job = json.loads(Path('runtime/final-products/video-a-render-job.json').read_text(encoding='utf-8'))
          payload = {'ref': os.environ['TARGET_REF'], 'inputs': {
              'render_job': json.dumps(job, ensure_ascii=False, separators=(',', ':')),
              'brain_decision_id': job['brain_decision_id'],
              'execution_id': job['execution_id'],
              'authorized_action': job['authorized_action'],
          }}
          Path('/tmp/dispatch-a.json').write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/render-worker.yml/dispatches" --input /tmp/dispatch-a.json
          echo 'VIDEO_A_RENDER_DISPATCH=ACCEPTED'
      - name: Dispatch VIDEO B professional render
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          job = json.loads(Path('runtime/final-products/video-b-render-job.json').read_text(encoding='utf-8'))
          payload = {'ref': os.environ['TARGET_REF'], 'inputs': {
              'render_job': json.dumps(job, ensure_ascii=False, separators=(',', ':')),
              'brain_decision_id': job['brain_decision_id'],
              'execution_id': job['execution_id'],
              'authorized_action': job['authorized_action'],
          }}
          Path('/tmp/dispatch-b.json').write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/render-worker.yml/dispatches" --input /tmp/dispatch-b.json
          echo 'VIDEO_B_RENDER_DISPATCH=ACCEPTED'
      - name: Record dispatch evidence
        run: |
          set -euo pipefail
          sleep 8
          gh run list --repo "$GITHUB_REPOSITORY" --workflow render-worker.yml --branch "$TARGET_REF" --event workflow_dispatch --limit 6 \
            --json databaseId,status,conclusion,headSha,createdAt,url > runtime/final-products/render-runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('runtime/final-products/video-a-render-job.json').read_text(encoding='utf-8'))
          b=json.loads(Path('runtime/final-products/video-b-render-job.json').read_text(encoding='utf-8'))
          runs=json.loads(Path('runtime/final-products/render-runs.json').read_text(encoding='utf-8'))
          evidence={
              'status':'DISPATCHED',
              'products': {
                  'A': {'render_job_id':a['render_job_id'],'execution_id':a['execution_id'],'goal_id':a['goal_id']},
                  'B': {'render_job_id':b['render_job_id'],'execution_id':b['execution_id'],'goal_id':b['goal_id']},
              },
              'runs':runs,
              'job18_unchanged':'BY_DESIGN_NO_CANONICAL_DATABASE_ACCESS',
              'youtube_publication':False,
              'human_editorial_approval':'PENDING',
          }
          Path('runtime/final-products/dispatch-evidence.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run001-final-products-dispatch
          path: runtime/final-products/
          retention-days: 30
