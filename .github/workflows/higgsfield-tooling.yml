name: Higgsfield Tooling Validation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/run-001-app
      - work/gate6f-analytics-learning
    paths:
      - '.github/workflows/higgsfield-tooling.yml'
      - 'scripts/agent-tooling/bootstrap.sh'

permissions:
  contents: read

jobs:
  validate-higgsfield-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore pinned development tooling
        run: bash scripts/agent-tooling/bootstrap.sh higgsfield

      - name: Report bounded Higgsfield status
        run: |
          echo 'HIGGSFIELD_CLI_BOOTSTRAP=PASS'
          echo 'HIGGSFIELD_HARNESS_AUTHORITY=PRESERVED'
          echo 'HIGGSFIELD_UNATTENDED_AUTH=UNPROVEN'
          echo 'HIGGSFIELD_GENERATION_RUNTIME=UNPROVEN'
          echo 'HIGGSFIELD_POLICY_ELIGIBLE=NO_UNTIL_RUNTIME_PROOF'
