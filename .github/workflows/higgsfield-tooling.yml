name: Higgsfield Tooling Validation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/run-001-app
      - work/gate6f-analytics-learning
    paths:
      - '.github/workflows/higgsfield-tooling.yml'
      - 'scripts/agent-tooling/bootstrap.sh'

permissions:
  contents: read

jobs:
  validate-higgsfield-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore pinned development tooling
        run: bash scripts/agent-tooling/bootstrap.sh higgsfield

      - name: Probe unattended authentication without exposing account data
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.local/share/br-agent-tooling/bin:$PATH"
          higgsfield account status >/tmp/higgsfield-account-status.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'HIGGSFIELD_UNATTENDED_AUTH=PASS'
            echo 'HIGGSFIELD_POLICY_ELIGIBLE=YES_FOR_BOUNDED_RUNTIME_PROOF'
          else
            echo 'HIGGSFIELD_UNATTENDED_AUTH=BLOCKED_INTERACTIVE_LOGIN_REQUIRED'
            echo 'HIGGSFIELD_POLICY_ELIGIBLE=NO'
          fi
          echo 'HIGGSFIELD_CLI_BOOTSTRAP=PASS'
          echo 'HIGGSFIELD_HARNESS_AUTHORITY=PRESERVED'
          # Do not print account-status output: it may contain user identity/session detail.
