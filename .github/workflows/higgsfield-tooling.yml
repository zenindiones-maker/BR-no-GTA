name: Higgsfield Tooling Validation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/run-001-app
    paths:
      - '.github/workflows/higgsfield-tooling.yml'

permissions:
  contents: read

jobs:
  validate-higgsfield-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore pinned development tooling
        run: bash scripts/agent-tooling/bootstrap.sh higgsfield
