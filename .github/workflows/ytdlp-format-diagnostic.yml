name: RUN-001 yt-dlp authenticated format diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - codex/run-001-app
    paths:
      - ".github/workflows/ytdlp-format-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -U "yt-dlp[default]"
          pip install -U "bgutil-ytdlp-pot-provider==1.3.1"
          pip install -r requirements/media.txt

      - name: Setup YouTube PO Token provider
        run: |
          set -euo pipefail

          git clone             --depth 1             --branch 1.3.1             https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git             runtime/bgutil-ytdlp-pot-provider

          cd runtime/bgutil-ytdlp-pot-provider/server

          deno install --allow-scripts=npm:canvas --frozen

          cd node_modules

          export DENO_NO_PROMPT=1

          nohup deno run             --no-prompt             --allow-env             --allow-net             --allow-ffi=.             --allow-read=.             ../src/main.ts             --port 4416             > ../provider.log 2>&1 &

          echo $! > ../provider.pid

          sleep 5

          if ! kill -0 "$(cat ../provider.pid)" 2>/dev/null; then
            echo "PO Token provider failed to start"
            cat ../provider.log
            exit 1
          fi

          echo "PO Token provider running on 127.0.0.1:4416"

      - name: Prepare YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          test -n "$YOUTUBE_COOKIES"
          printf '%s' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/youtube-cookies.txt"
          chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"

      - name: Diagnose authenticated yt-dlp formats
        env:
          YTDLP_COOKIES_FILE: ${{ runner.temp }}/youtube-cookies.txt
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess

          import yt_dlp

          from app.services.ytdlp_infrastructure import YtDlpInfrastructureConfig

          URL = "https://www.youtube.com/watch?v=VQRLujxTm3c"

          print("=== RUNTIME ===")
          print("python:", platform.python_version())
          print("yt_dlp:", yt_dlp.version.__version__)

          try:
              result = subprocess.run(
                  ["deno", "--version"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              print("deno:")
              print(result.stdout.strip())
          except Exception as exc:
              print("deno_error:", type(exc).__name__, str(exc))

          infra = YtDlpInfrastructureConfig(po_token_base_url="http://127.0.0.1:4416")

          print("\n=== INFRASTRUCTURE ===")
          print("player_client:", infra.player_client)
          print("js_runtime:", infra.js_runtime)
          print("po_token_base_url_configured:", bool(infra.po_token_base_url))
          print("cookies_file_configured:", bool(os.environ.get("YTDLP_COOKIES_FILE")))

          extractor_args = {
              "youtube": {
                  "player_client": [infra.player_client],
              },
              "youtubepot-bgutilhttp": {
                  "base_url": [infra.po_token_base_url],
              },
          }

          options = {
              "quiet": False,
              "no_warnings": False,
              "noprogress": True,
              "noplaylist": True,
              "cookiefile": os.environ["YTDLP_COOKIES_FILE"],
              "extractor_args": extractor_args,
          }

          if infra.js_runtime:
              options["js_runtimes"] = {infra.js_runtime: {}}

          print("\n=== OPTIONS ===")
          safe_options = {
              key: value
              for key, value in options.items()
              if key != "cookiefile"
          }
          print(json.dumps(safe_options, indent=2, default=str))

          print("\n=== EXTRACT ===")

          with yt_dlp.YoutubeDL(options) as ydl:
              info = ydl.extract_info(URL, download=False)

          formats = info.get("formats") or []

          print("title:", info.get("title"))
          print("video_id:", info.get("id"))
          print("format_count:", len(formats))

          print("\n=== AVAILABLE FORMATS ===")

          safe_fields = (
              "format_id",
              "ext",
              "protocol",
              "vcodec",
              "acodec",
              "width",
              "height",
              "fps",
              "tbr",
              "abr",
              "filesize",
              "filesize_approx",
          )

          for fmt in formats:
              row = {field: fmt.get(field) for field in safe_fields}
              print(json.dumps(row, sort_keys=True, default=str))

          print("\n=== DEFAULT SELECTION ===")

          requested_downloads = info.get("requested_downloads") or []
          requested_formats = info.get("requested_formats") or []

          print(
              "requested_download_ids:",
              [
                  item.get("format_id")
                  for item in requested_downloads
                  if isinstance(item, dict)
              ],
          )

          print(
              "requested_format_ids:",
              [
                  item.get("format_id")
                  for item in requested_formats
                  if isinstance(item, dict)
              ],
          )

          print("top_level_format_id:", info.get("format_id"))

          ids = {str(fmt.get("format_id")) for fmt in formats}

          print("\n=== KNOWN PASS IDS ===")
          print("616_available:", "616" in ids)
          print("234_available:", "234" in ids)
          PY
