name: Character Name Pronunciation Review

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run001/character-name-pronunciation-proof.request.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: character-name-pronunciation-review
  cancel-in-progress: false

jobs:
  character-pronunciation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate candidate request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path(".run001/character-name-pronunciation-proof.request.json").read_text())
          assert d["base_head"]=="a73026f487ec0f49e7d531fe51c982cf5263973e", d
          assert d["video_a_rerender"] is False, d
          assert d["automatic_promotion"] is False, d
          assert d["default_narration_locale"]=="pt-BR", d
          assert d["only_forced_en_us_term"]=="Vice City", d
          assert d["script_sha256"]=="9bde9d9e5fd413597ecafadbfb55836ccbcaf10da7038aa83c133b3cc65c15ea", d
          print("CHARACTER_NAME_REQUEST=PASS")
          print("VIDEO_A_RERENDER=NO")
          PY

      - name: Install audio benchmark runtime
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install "pytest==9.1.1" "python-dotenv==1.2.1" "edge-tts==7.2.8" \
            "yt-dlp[default]==2026.8.19" "bgutil-ytdlp-pot-provider==1.3.1"
          ffmpeg -version | head -n1

      - name: Setup Deno for canonical PO Token provider
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup canonical YouTube PO Token provider
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git runtime/bgutil-ytdlp-pot-provider
          cd runtime/bgutil-ytdlp-pot-provider/server
          deno install --allow-scripts=npm:canvas --frozen
          cd node_modules
          export DENO_NO_PROMPT=1
          nohup deno run --no-prompt --allow-env --allow-net --allow-ffi=. --allow-read=. ../src/main.ts --port 4416 > ../provider.log 2>&1 &
          echo $! > ../provider.pid
          sleep 5
          kill -0 "$(cat ../provider.pid)"
          echo "YTDLP_PO_TOKEN_BASE_URL=http://127.0.0.1:4416" >> "$GITHUB_ENV"
          echo "CANONICAL_YOUTUBE_PO_TOKEN_PROVIDER=PASS"

      - name: Prepare canonical YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES"
          mkdir -p runtime/secrets
          printf '%s' "$YOUTUBE_COOKIES" > runtime/secrets/youtube-cookies.txt
          chmod 600 runtime/secrets/youtube-cookies.txt
          echo "YTDLP_COOKIES_FILE=$GITHUB_WORKSPACE/runtime/secrets/youtube-cookies.txt" >> "$GITHUB_ENV"

      - name: Restore canonical product package only
        uses: actions/download-artifact@v4
        with:
          artifact-ids: "10589535732"
          run-id: "35458162169"
          github-token: ${{ github.token }}
          path: runtime/product-source
          merge-multiple: true

      - name: Focused candidate tests
        run: |
          set -euo pipefail
          pytest -q tests/test_character_name_pronunciation_candidate.py
          echo "NO_CHARACTER_NAME_EN_US_CHUNKS=PASS"
          echo "CANONICAL_TEXT_PRESERVED=PASS"
          echo "VOICE_B_PRESERVED=PASS"

      - name: Build PT-BR acoustic-grounded Voice B character benchmark
        run: |
          set -euo pipefail
          python scripts/character_name_pronunciation_proof.py \
            --product-package runtime/product-source/product-quality-e2e.json \
            --output-dir runtime/character-pronunciation

      - name: Validate review gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("runtime/character-pronunciation/character-name-pronunciation-proof.json").read_text())
          required=(
              "CHARACTER_NAME_REFERENCE_SOURCE",
              "CHARACTER_NAME_ACOUSTIC_REFERENCE",
              "CHARACTER_NAME_PRONUNCIATION",
              "NO_CHARACTER_NAME_EN_US_CHUNKS",
              "PT_BR_PROSODY_CONTINUITY",
              "VICE_CITY_POLICY_PRESERVED",
              "CANONICAL_TEXT_PRESERVED",
              "VOICE_B_PRESERVED",
              "CURRENT_SCRIPT_CHARACTER_INVENTORY",
              "CANDIDATE_CACHE_VERSIONED",
              "OFFICIAL_TRAILER_REFERENCE_MATERIALIZED",
              "NO_AUTOMATIC_PROMOTION",
              "VIDEO_A_NOT_RERENDERED",
          )
          missing=[k for k in required if (p.get("checks") or {}).get(k) is not True]
          if p.get("status")!="PASS" or missing:
              raise SystemExit("CHARACTER_NAME_PRONUNCIATION_PROOF=FAIL:"+",".join(missing))
          if (p.get("human_review") or {}).get("status")!="PENDING":
              raise SystemExit("HUMAN_CHARACTER_NAME_REVIEW_GATE_INVALID")
          if p.get("character_name_reference_source")!="PTBR_DUBBED_TRAILER":
              raise SystemExit("CHARACTER_NAME_REFERENCE_SOURCE_INVALID")
          for key in required:
              print(key+"=PASS")
          print("CHARACTER_NAME_REFERENCE_SOURCE=PTBR_DUBBED_TRAILER")
          print("ONLY_FORCED_EN_US_TERM=Vice City")
          print("HUMAN_CHARACTER_NAME_REVIEW=PENDING")
          print("VIDEO_A_RERENDER=NO")
          PY

      - name: Deliver review files to canonical Telegram transport
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID || secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_REVIEW_CHAT_ID"
          mkdir -p runtime/character-pronunciation/telegram
          files=(
            runtime/character-pronunciation/samples/A-jason.mp3
            runtime/character-pronunciation/samples/B-lucia.mp3
            runtime/character-pronunciation/samples/C-jason-lucia.mp3
            runtime/character-pronunciation/samples/D-character-vice-city.mp3
            runtime/character-pronunciation/samples/E-current-script-multi.mp3
          )
          : > runtime/character-pronunciation/telegram/message-ids.txt
          for audio in "${files[@]}"; do
            response="$(curl --fail-with-body --silent --show-error \
              -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
              -F "chat_id=$TELEGRAM_REVIEW_CHAT_ID" \
              -F "document=@$audio" \
              -F "caption=BR no GTA 6 · pronúncia PT-BR de personagens · $(basename "$audio") · revisão humana pendente")"
            RESPONSE="$response" python - <<'PY' >> runtime/character-pronunciation/telegram/message-ids.txt
          import json,os
          d=json.loads(os.environ["RESPONSE"])
          if d.get("ok") is not True:
              raise SystemExit("TELEGRAM_DELIVERY_ACCEPTED=NO")
          mid=(d.get("result") or {}).get("message_id")
          if not isinstance(mid,int):
              raise SystemExit("TELEGRAM_MESSAGE_ID_MISSING")
          print(mid)
          PY
          done
          MESSAGE_IDS="$(paste -sd, runtime/character-pronunciation/telegram/message-ids.txt)" python - <<'PY'
          import json,os
          from pathlib import Path
          ids=[int(x) for x in os.environ["MESSAGE_IDS"].split(",") if x.strip()]
          state={
              "status":"PASS",
              "transport":"canonical-telegram-review",
              "send_mode":"document-no-recompression",
              "message_ids":ids,
              "sample_count":len(ids),
              "human_character_name_review":"PENDING",
              "automatic_promotion":False,
              "video_a_rerender":False,
              "reference_clips_delivery":"INTERNAL_ONLY",
          }
          Path("runtime/character-pronunciation/telegram-delivery.json").write_text(json.dumps(state,indent=2),encoding="utf-8")
          print("TELEGRAM_CHARACTER_REVIEW_DELIVERY=PASS")
          print("TELEGRAM_MESSAGE_IDS="+",".join(str(x) for x in ids))
          print("HUMAN_CHARACTER_NAME_REVIEW=PENDING")
          PY

      - name: Upload pronunciation review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-name-pronunciation-${{ github.run_id }}
          path: runtime/character-pronunciation/
          if-no-files-found: error
          retention-days: 30
