name: Character Name Pronunciation Review

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run001/character-name-pronunciation-proof.request.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: character-name-pronunciation-review
  cancel-in-progress: false

jobs:
  character-pronunciation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate B/C review request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path(".run001/character-name-pronunciation-proof.request.json").read_text())
          assert d["base_head"]=="7874a4e4162ebddbe01ea4a4b90de60a2871b5a2", d
          assert d["video_a_rerender"] is False, d
          assert d["automatic_promotion"] is False, d
          assert d["good_voices"]==["B","C"], d
          assert d["official_voice"]=="B" and d["challenger_voice"]=="C", d
          assert d["reference_video_id"]=="VQRLujxTm3c", d
          assert d["default_narration_locale"]=="pt-BR", d
          assert d["only_forced_en_us_term"]=="Vice City", d
          print("VOICE_BC_REVIEW_REQUEST=PASS")
          print("VIDEO_A_RERENDER=NO")
          PY

      - name: Install audio benchmark runtime
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install "pytest==9.1.1" "python-dotenv==1.2.1" "edge-tts==7.2.8"             "yt-dlp[default]==2026.8.19" "bgutil-ytdlp-pot-provider==1.3.1"
          ffmpeg -version | head -n1

      - name: Setup Deno for canonical PO Token provider
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup canonical YouTube PO Token provider
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git runtime/bgutil-ytdlp-pot-provider
          cd runtime/bgutil-ytdlp-pot-provider/server
          deno install --allow-scripts=npm:canvas --frozen
          cd node_modules
          export DENO_NO_PROMPT=1
          nohup deno run --no-prompt --allow-env --allow-net --allow-ffi=. --allow-read=. ../src/main.ts --port 4416 > ../provider.log 2>&1 &
          echo $! > ../provider.pid
          sleep 5
          kill -0 "$(cat ../provider.pid)"
          echo "YTDLP_PO_TOKEN_BASE_URL=http://127.0.0.1:4416" >> "$GITHUB_ENV"

      - name: Prepare canonical YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES"
          mkdir -p runtime/secrets
          printf '%s' "$YOUTUBE_COOKIES" > runtime/secrets/youtube-cookies.txt
          chmod 600 runtime/secrets/youtube-cookies.txt
          echo "YTDLP_COOKIES_FILE=$GITHUB_WORKSPACE/runtime/secrets/youtube-cookies.txt" >> "$GITHUB_ENV"

      - name: Restore canonical product package only
        uses: actions/download-artifact@v4
        with:
          artifact-ids: "10589535732"
          run-id: "35458162169"
          github-token: ${{ github.token }}
          path: runtime/product-source
          merge-multiple: true

      - name: Focused B/C policy tests
        run: |
          set -euo pipefail
          pytest -q tests/test_voice_bc_character_review.py
          echo "B_C_CASTING_ONLY=PASS"
          echo "NO_CHARACTER_NAME_EN_US_CHUNKS=PASS"
          echo "CANONICAL_TEXT_PRESERVED=PASS"

      - name: Build Rockstar-grounded B/C audio benchmark
        run: |
          set -euo pipefail
          python scripts/voice_bc_character_review.py             --product-package runtime/product-source/product-quality-e2e.json             --output-dir runtime/voice-bc-review

      - name: Validate human review gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("runtime/voice-bc-review/voice-bc-character-review.json").read_text())
          required=(
              "PT_BR_PROSODY_CONTINUITY","CHARACTER_NAME_PRONUNCIATION",
              "NO_CHARACTER_NAME_EN_US_CHUNKS","ONLY_FORCED_EN_US_TERM",
              "CANONICAL_TEXT_PRESERVED","VOICE_B_PRESERVED",
              "VOICE_C_CHALLENGER_ONLY","B_C_CASTING_ONLY",
              "SAME_SPEECH_PERFORMANCE_PLAN","SAME_TEXT_PUNCTUATION_AND_ALIASES",
              "CURRENT_SCRIPT_CHARACTER_INVENTORY","ROCKSTAR_TRAILER2_REFERENCE_MATERIALIZED",
              "CANDIDATE_CACHE_VERSIONED","NO_AUTOMATIC_PROMOTION","VIDEO_A_NOT_RERENDERED",
          )
          missing=[k for k in required if (p.get("checks") or {}).get(k) is not True]
          if p.get("status")!="PASS" or missing:
              raise SystemExit("VOICE_BC_CHARACTER_REVIEW=FAIL:"+",".join(missing))
          if p.get("reference_source")!="ROCKSTAR_OFFICIAL_TRAILER_2":
              raise SystemExit("REFERENCE_SOURCE_INVALID")
          if (p.get("human_review") or {}).get("human_voice_final_review")!="PENDING":
              raise SystemExit("HUMAN_VOICE_FINAL_REVIEW_GATE_INVALID")
          for key in required:
              print(key+"=PASS")
          print("CHARACTER_NAME_REFERENCE_SOURCE=ROCKSTAR_OFFICIAL_TRAILER_2")
          print("ONLY_FORCED_EN_US_TERM=Vice City")
          print("HUMAN_VOICE_FINAL_REVIEW=PENDING")
          print("VIDEO_A_RERENDER=NO")
          PY

      - name: Deliver B/C pairs to canonical Telegram as documents
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID || secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_REVIEW_CHAT_ID"
          mkdir -p runtime/voice-bc-review/telegram
          : > runtime/voice-bc-review/telegram/message-ids.txt
          for sample in 01 02 03 04 05 06; do
            for label in B C; do
              audio="runtime/voice-bc-review/samples/${sample}-${label}.mp3"
              test -s "$audio"
              response="$(curl --fail-with-body --silent --show-error                 -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"                 -F "chat_id=$TELEGRAM_REVIEW_CHAT_ID"                 -F "document=@$audio"                 -F "caption=${sample} · ${label} · revisão humana de voz/pronúncia")"
              RESPONSE="$response" SAMPLE="$sample" LABEL="$label" python - <<'PY' >> runtime/voice-bc-review/telegram/message-ids.txt
          import json,os
          d=json.loads(os.environ["RESPONSE"])
          if d.get("ok") is not True:
              raise SystemExit("TELEGRAM_DELIVERY_ACCEPTED=NO")
          mid=(d.get("result") or {}).get("message_id")
          if not isinstance(mid,int):
              raise SystemExit("TELEGRAM_MESSAGE_ID_MISSING")
          print(f"{os.environ['SAMPLE']},{os.environ['LABEL']},{mid}")
          PY
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for line in Path("runtime/voice-bc-review/telegram/message-ids.txt").read_text().splitlines():
              sample,label,mid=line.split(",")
              rows.append({"sample":sample,"label":label,"message_id":int(mid)})
          state={
              "status":"PASS",
              "transport":"canonical-telegram-review",
              "send_mode":"document-no-recompression",
              "messages":rows,
              "message_ids":[x["message_id"] for x in rows],
              "labels":["B","C"],
              "human_voice_final_review":"PENDING",
              "automatic_promotion":False,
              "video_a_rerender":False,
          }
          Path("runtime/voice-bc-review/telegram-delivery.json").write_text(json.dumps(state,indent=2),encoding="utf-8")
          print("TELEGRAM_BC_REVIEW_DELIVERY=PASS")
          print("TELEGRAM_MESSAGE_IDS="+",".join(str(x["message_id"]) for x in rows))
          print("HUMAN_VOICE_FINAL_REVIEW=PENDING")
          PY

      - name: Upload B/C review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-bc-character-review-${{ github.run_id }}
          path: runtime/voice-bc-review/
          if-no-files-found: error
          retention-days: 30
