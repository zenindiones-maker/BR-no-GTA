name: Script-first gate contract

on:
  push:
    branches:
      - work/br-script-first-single-video-v1
  pull_request:
    paths:
      - "scripts/script_first_gate.py"
      - "content/roteiros/**"
      - "tests/test_script_first_*.py"
      - "tests/test_editorial_resilient_longform.py"
      - "app/services/script_generator_service.py"
      - "app/services/resilient_editorial_provider.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: script-first-gate-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -q -r requirements.txt pytest pyyaml
      - name: Script-first tests + regression on touched modules
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_script_first_single_video.py tests/test_script_first_scene_lineage.py tests/test_editorial_resilient_longform.py tests/test_script_generator_service.py \
            tests/test_owner_voice_dubbing_reference_policy.py tests/test_github_actions_dispatcher.py \
            tests/test_render_job_service.py tests/test_render_orchestration_service.py \
            tests/test_app_edit_plan_transport.py tests/test_render_worker_pipeline.py \
            tests/test_render_pipeline_fake_executor.py tests/test_telegram_brand_render_pipeline.py
