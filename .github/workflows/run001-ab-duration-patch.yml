name: RUN-001 A/B Duration Integration Patch

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .github/workflows/run001-ab-duration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/gate6f-analytics-learning
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic duration integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Script generator: allow the Harness editorial target duration to
          # shape the generated script without becoming provider authority.
          path = Path("app/services/script_generator_service.py")
          text = path.read_text(encoding="utf-8")

          old = '''def _build_ai_prompt(
              *,
              title: str,
              description: str,
              research_context: dict[str, Any] | None,
          ) -> str:
          '''
          new = '''def _build_ai_prompt(
              *,
              title: str,
              description: str,
              research_context: dict[str, Any] | None,
              target_duration_seconds: float | None = None,
          ) -> str:
          '''
          assert old in text, "script prompt signature anchor changed"
          text = text.replace(old, new, 1)

          old = '''    if research_context is not None:
              research_text = (
                  f"Título da pesquisa: {research_context.get('title', '')}\\n"
                  f"Conteúdo da pesquisa: {research_context.get('content', '')}\\n"
                  f"URL: {research_context.get('url', '')}"
              )

              return f"""
          '''
          new = '''    if research_context is not None:
              research_text = (
                  f"Título da pesquisa: {research_context.get('title', '')}\\n"
                  f"Conteúdo da pesquisa: {research_context.get('content', '')}\\n"
                  f"URL: {research_context.get('url', '')}"
              )

              duration_instruction = ""
              if target_duration_seconds is not None:
                  target_words = max(300, int(round(float(target_duration_seconds) * 2.0)))
                  target_minutes = float(target_duration_seconds) / 60.0
                  duration_instruction = (
                      "\\nDURAÇÃO ALVO\\n"
                      f"- Aproximadamente {target_minutes:.1f} minutos de narração.\\n"
                      f"- Mire aproximadamente {target_words} palavras no roteiro completo.\\n"
                      "- Distribua o desenvolvimento em blocos suficientes para sustentar a duração "
                      "sem repetição artificial de frases.\\n"
                  )

              return f"""
          '''
          assert old in text, "script duration prompt anchor changed"
          text = text.replace(old, new, 1)

          old = '''CONTEXTO DE PESQUISA
          {research_text}

          REGRAS
          '''
          new = '''CONTEXTO DE PESQUISA
          {research_text}
          {duration_instruction}

          REGRAS
          '''
          assert old in text, "script prompt body anchor changed"
          text = text.replace(old, new, 1)

          old = '''def _generate_ai_structure(
              *,
              title: str,
              description: str,
              research_context: dict[str, Any] | None,
              ai_provider: AIProvider,
          ) -> dict[str, Any]:
              prompt = _build_ai_prompt(
                  title=title,
                  description=description,
                  research_context=research_context,
              )
          '''
          new = '''def _generate_ai_structure(
              *,
              title: str,
              description: str,
              research_context: dict[str, Any] | None,
              ai_provider: AIProvider,
              target_duration_seconds: float | None = None,
          ) -> dict[str, Any]:
              prompt = _build_ai_prompt(
                  title=title,
                  description=description,
                  research_context=research_context,
                  target_duration_seconds=target_duration_seconds,
              )
          '''
          assert old in text, "AI structure duration anchor changed"
          text = text.replace(old, new, 1)

          old = '''def generate_script_structure(
              idea_id: int,
              *,
              ai_provider: AIProvider | None = None,
          ) -> dict[str, Any]:
          '''
          new = '''def generate_script_structure(
              idea_id: int,
              *,
              ai_provider: AIProvider | None = None,
              target_duration_seconds: float | None = None,
          ) -> dict[str, Any]:
          '''
          assert old in text, "script structure signature anchor changed"
          text = text.replace(old, new, 1)

          old = '''        ai_structure = _generate_ai_structure(
                  title=title,
                  description=normalized_description,
                  research_context=research_context,
                  ai_provider=ai_provider,
              )
          '''
          new = '''        ai_structure = _generate_ai_structure(
                  title=title,
                  description=normalized_description,
                  research_context=research_context,
                  ai_provider=ai_provider,
                  target_duration_seconds=target_duration_seconds,
              )
          '''
          assert old in text, "AI structure call anchor changed"
          text = text.replace(old, new, 1)

          old = '''def generate_and_save_script(
              idea_id: int,
              *,
              ai_provider: AIProvider | None = None,
          ) -> int:
          '''
          new = '''def generate_and_save_script(
              idea_id: int,
              *,
              ai_provider: AIProvider | None = None,
              target_duration_seconds: float | None = None,
          ) -> int:
          '''
          assert old in text, "save script signature anchor changed"
          text = text.replace(old, new, 1)

          old = '''    structure = generate_script_structure(
              idea_id,
              ai_provider=ai_provider,
          )
          '''
          new = '''    structure = generate_script_structure(
              idea_id,
              ai_provider=ai_provider,
              target_duration_seconds=target_duration_seconds,
          )
          '''
          assert old in text, "save script call anchor changed"
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # 2) Editorial consumer: duration comes only from persisted Harness
          # authorization lineage, then becomes the canonical ProductionPlan target.
          path = Path("app/services/editorial_queue_consumer.py")
          text = path.read_text(encoding="utf-8")
          if not text.startswith("from typing import Any\n"):
              raise AssertionError("editorial consumer import anchor changed")
          text = text.replace("from typing import Any\n", "from typing import Any\nimport math\n", 1)

          old = '''    execution_context = authorization_to_context(authorization)

              lineage_goal_id = authorization.lineage.get("goal_id")
          '''
          new = '''    execution_context = authorization_to_context(authorization)

              target_duration_seconds = authorization.lineage.get("target_duration_seconds")
              if target_duration_seconds is not None:
                  if (
                      isinstance(target_duration_seconds, bool)
                      or not isinstance(target_duration_seconds, (int, float))
                      or not math.isfinite(float(target_duration_seconds))
                      or float(target_duration_seconds) <= 0
                  ):
                      raise PermissionError("Harness target_duration_seconds must be finite and positive")
                  target_duration_seconds = float(target_duration_seconds)

              lineage_goal_id = authorization.lineage.get("goal_id")
          '''
          assert old in text, "editorial duration lineage anchor changed"
          text = text.replace(old, new, 1)

          old = '''    if ai_provider is None:
              script_id = generate_and_save_script(idea_id)
          else:
              script_id = generate_and_save_script(
                  idea_id,
                  ai_provider=ai_provider,
              )
          '''
          new = '''    if ai_provider is None:
              script_id = generate_and_save_script(
                  idea_id,
                  target_duration_seconds=target_duration_seconds,
              )
          else:
              script_id = generate_and_save_script(
                  idea_id,
                  ai_provider=ai_provider,
                  target_duration_seconds=target_duration_seconds,
              )
          '''
          assert old in text, "editorial script generation anchor changed"
          text = text.replace(old, new, 1)

          old = '''    script_spec = generate_script_spec(script_id)
              content_item = create_content_item(script_spec)
          '''
          new = '''    script_spec = generate_script_spec(script_id)
              if target_duration_seconds is not None:
                  script_spec = dict(script_spec)
                  script_spec["estimated_duration_seconds"] = target_duration_seconds
              content_item = create_content_item(script_spec)
          '''
          assert old in text, "editorial script spec anchor changed"
          text = text.replace(old, new, 1)

          old = '''    if targeted_artifacts is not None:
              result["goal_id"] = resolved_goal_id
              result["idempotent"] = False
              return result
          '''
          new = '''    if targeted_artifacts is not None:
              result["goal_id"] = resolved_goal_id
              result["idempotent"] = False
              if target_duration_seconds is not None:
                  result["target_duration_seconds"] = target_duration_seconds
              return result
          '''
          assert old in text, "editorial result anchor changed"
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # 3) Harness MCP: expose target duration as an authorized editorial
          # decision and bind it into both provider/action authorization lineage.
          path = Path("app/integrations/deepseek_harness/server.py")
          text = path.read_text(encoding="utf-8")

          anchor = '''def _normalize_optional_goal_id(goal_id: str | None) -> str | None:
              if goal_id is None:
                  return None
              if not isinstance(goal_id, str) or not goal_id.strip():
                  raise ValueError("goal_id must be a non-empty string or None")
              return goal_id.strip()
          '''
          addition = anchor + '''

          def _normalize_optional_target_duration_seconds(
              target_duration_seconds: float | None,
          ) -> float | None:
              if target_duration_seconds is None:
                  return None
              if isinstance(target_duration_seconds, bool) or not isinstance(
                  target_duration_seconds, (int, float)
              ):
                  raise ValueError("target_duration_seconds must be numeric or None")
              value = float(target_duration_seconds)
              if value <= 0 or value > 7200:
                  raise ValueError("target_duration_seconds must be in (0, 7200]")
              return value
          '''
          assert anchor in text, "server normalization anchor changed"
          text = text.replace(anchor, addition, 1)

          old = '''def _route_editorial_provider(goal_id: str | None = None):
              """Route editorial AI under Harness policy before provider construction."""
              goal_id = _normalize_optional_goal_id(goal_id)
          '''
          new = '''def _route_editorial_provider(
              goal_id: str | None = None,
              target_duration_seconds: float | None = None,
          ):
              """Route editorial AI under Harness policy before provider construction."""
              goal_id = _normalize_optional_goal_id(goal_id)
              target_duration_seconds = _normalize_optional_target_duration_seconds(
                  target_duration_seconds
              )
          '''
          assert old in text, "server editorial provider signature anchor changed"
          text = text.replace(old, new, 1)

          old = '''    if goal_id is not None:
              lineage["goal_id"] = goal_id
              authorization = issue_harness_authorization(
                  authorized_action="EDITORIAL",
                  subject=f"provider:{decision.selected_provider}",
                  lineage=lineage,
              )
          '''
          new = '''    if goal_id is not None:
              lineage["goal_id"] = goal_id
              if target_duration_seconds is not None:
                  lineage["target_duration_seconds"] = target_duration_seconds
              authorization = issue_harness_authorization(
                  authorized_action="EDITORIAL",
                  subject=f"provider:{decision.selected_provider}",
                  lineage=lineage,
              )
          '''
          assert old in text, "server provider lineage anchor changed"
          text = text.replace(old, new, 1)

          old = '''@mcp.tool()
          def br_editorial_process_next(goal_id: str | None = None) -> str:
              """Process the next editorial queue item through Harness routing/policy."""
              goal_id = _normalize_optional_goal_id(goal_id)
              routing, provider_authorization, ai_provider = _route_editorial_provider(goal_id)
          '''
          new = '''@mcp.tool()
          def br_editorial_process_next(
              goal_id: str | None = None,
              target_duration_seconds: float | None = None,
          ) -> str:
              """Process the next editorial queue item through Harness routing/policy."""
              goal_id = _normalize_optional_goal_id(goal_id)
              target_duration_seconds = _normalize_optional_target_duration_seconds(
                  target_duration_seconds
              )
              routing, provider_authorization, ai_provider = _route_editorial_provider(
                  goal_id,
                  target_duration_seconds,
              )
          '''
          assert old in text, "server editorial tool signature anchor changed"
          text = text.replace(old, new, 1)

          old = '''    if goal_id is not None:
              lineage["goal_id"] = goal_id
              authorization = issue_harness_authorization(
                  authorized_action="EDITORIAL",
                  subject="action:EDITORIAL",
                  lineage=lineage,
              )
          '''
          new = '''    if goal_id is not None:
              lineage["goal_id"] = goal_id
              if target_duration_seconds is not None:
                  lineage["target_duration_seconds"] = target_duration_seconds
              authorization = issue_harness_authorization(
                  authorized_action="EDITORIAL",
                  subject="action:EDITORIAL",
                  lineage=lineage,
              )
          '''
          assert old in text, "server action lineage anchor changed"
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # 4) Production planner: bound individual scenes so long-form videos do
          # not become a handful of multi-minute source windows.
          path = Path("app/services/production_plan_service.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import math\n", "import math\n\nMAX_SCENE_DURATION_SECONDS = 30.0\n", 1)

          old = '''    scenes = []

              for index, block in enumerate(valid_blocks, start=1):
                  heading = str(block.get("heading", "")).strip()
                  narration = str(block.get("content", "")).strip()
                  purpose = str(block.get("purpose", "")).strip()

                  if not heading or not narration:
                      continue

                  visual_type = _select_visual_type(heading)

                  requirements = [
                      f"Visual deve reforçar o bloco: {heading}.",
                  ]

                  if purpose:
                      requirements.append(
                          f"Objetivo narrativo: {purpose}."
                      )

                  scenes.append(
                      {
                          "order": index,
                          "narrative_block": heading,
                          "narration": narration,
                          "visual_type": visual_type,
                          "visual_description": (
                              f"Visual relacionado diretamente ao tema "
                              f"do bloco '{heading}', reforçando a narração."
                          ),
                          "duration_seconds": (
                              last_duration if index == scene_count else base_duration
                          ),
                          "requirements": requirements,
                      }
                  )
          '''
          new = '''    scenes = []
              scene_order = 0

              for index, block in enumerate(valid_blocks, start=1):
                  heading = str(block.get("heading", "")).strip()
                  narration = str(block.get("content", "")).strip()
                  purpose = str(block.get("purpose", "")).strip()

                  if not heading or not narration:
                      continue

                  block_duration = last_duration if index == scene_count else base_duration
                  part_count = max(1, int(math.ceil(block_duration / MAX_SCENE_DURATION_SECONDS)))
                  part_duration = block_duration / part_count
                  words = narration.split()
                  word_chunks: list[str] = []
                  if part_count == 1:
                      word_chunks = [narration]
                  elif words:
                      for part_index in range(part_count):
                          start = round(part_index * len(words) / part_count)
                          end = round((part_index + 1) * len(words) / part_count)
                          chunk = " ".join(words[start:end]).strip()
                          word_chunks.append(chunk or narration)
                  else:
                      word_chunks = [narration] * part_count

                  visual_type = _select_visual_type(heading)

                  requirements = [
                      f"Visual deve reforçar o bloco: {heading}.",
                  ]

                  if purpose:
                      requirements.append(
                          f"Objetivo narrativo: {purpose}."
                      )

                  for part_index in range(part_count):
                      scene_order += 1
                      duration = (
                          block_duration - part_duration * (part_count - 1)
                          if part_index == part_count - 1
                          else part_duration
                      )
                      scenes.append(
                          {
                              "order": scene_order,
                              "narrative_block": (
                                  heading
                                  if part_count == 1
                                  else f"{heading} — parte {part_index + 1}/{part_count}"
                              ),
                              "narration": word_chunks[part_index],
                              "visual_type": visual_type,
                              "visual_description": (
                                  f"Visual relacionado diretamente ao tema "
                                  f"do bloco '{heading}', reforçando a narração."
                              ),
                              "duration_seconds": duration,
                              "requirements": requirements,
                          }
                      )
          '''
          assert old in text, "production scene splitting anchor changed"
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # 5) Add one bounded A/B editorial preparation command for the existing
          # canonical A/B goals. It uses the Harness MCP boundary, not a parallel path.
          Path("scripts/run001_ab_editorial_prepare.py").write_text('''from __future__ import annotations

import json

from app.database.render_queue_repository import get_render_job
from app.integrations.deepseek_harness.server import br_editorial_process_next
from app.main import initialize_application

FROZEN_JOB_ID = 18
FROZEN_EXECUTION_ID = "run-001-canary-render-18"
CANARY_JOB_ID = 19
TARGET_DURATION_SECONDS = 1500.0
GOALS = (
    ("A", "93f99ddc-09c7-474b-8849-6981aa78d60c"),
    ("B", "10ea70fb-8255-4f89-a6ce-6d2ffced3982"),
)


def main() -> int:
    initialize_application()
    frozen = get_render_job(FROZEN_JOB_ID)
    if not frozen or frozen.get("status") != "running":
        raise RuntimeError("Job18 frozen checkpoint changed")
    if frozen.get("execution_id") != FROZEN_EXECUTION_ID:
        raise RuntimeError("Job18 execution_id changed")
    canary = get_render_job(CANARY_JOB_ID)
    if not canary or canary.get("status") != "completed":
        raise RuntimeError("Job19 must be completed before A/B editorial preparation")

    outputs = []
    for label, goal_id in GOALS:
        envelope = json.loads(
            br_editorial_process_next(
                goal_id=goal_id,
                target_duration_seconds=TARGET_DURATION_SECONDS,
            )
        )
        result = envelope.get("result") or {}
        plan = result.get("production_plan") or {}
        duration = float(plan.get("estimated_duration_seconds") or 0)
        if abs(duration - TARGET_DURATION_SECONDS) > 0.001:
            raise RuntimeError(f"VIDEO {label} duration contract mismatch: {duration}")
        scenes = plan.get("scenes") or []
        if not scenes or max(float(scene.get("duration_seconds") or 0) for scene in scenes) > 30.001:
            raise RuntimeError(f"VIDEO {label} scene duration boundary failed")
        outputs.append(
            {
                "label": label,
                "goal_id": goal_id,
                "script_id": (result.get("script") or {}).get("id"),
                "content_item_id": (result.get("content_item") or {}).get("id"),
                "production_plan_id": result.get("production_plan_id"),
                "duration_seconds": duration,
                "scene_count": len(scenes),
                "max_scene_seconds": max(float(scene.get("duration_seconds") or 0) for scene in scenes),
                "status": result.get("status"),
            }
        )

    frozen_after = get_render_job(FROZEN_JOB_ID)
    if frozen_after != frozen:
        raise RuntimeError("JOB18_UNCHANGED assertion failed")

    print(json.dumps({
        "RUN001_AB_EDITORIAL": "PASS",
        "JOB18_UNCHANGED": "YES",
        "JOB19_STATUS": "completed",
        "VIDEOS": outputs,
    }, ensure_ascii=False, separators=(",", ":"), sort_keys=True))
    return 0


if __name__ == "__main__":
    try:
        raise SystemExit(main())
    except Exception as exc:
        print(json.dumps({"RUN001_AB_EDITORIAL": "BLOCKED", "ERROR": str(exc)}, ensure_ascii=False, separators=(",", ":")))
        raise
''', encoding="utf-8")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Focused validation
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_production_plan_service.py \
            tests/test_editorial_queue_consumer.py \
            tests/test_deepseek_harness.py

      - name: Syntax check
        run: |
          python -m py_compile \
            app/services/script_generator_service.py \
            app/services/editorial_queue_consumer.py \
            app/services/production_plan_service.py \
            app/integrations/deepseek_harness/server.py \
            scripts/run001_ab_editorial_prepare.py

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/run001-ab-duration-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(run001): govern long-form A/B editorial duration"
          git push origin HEAD:work/gate6f-analytics-learning
