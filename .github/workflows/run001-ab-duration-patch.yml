name: RUN-001 A/B Duration Integration Patch

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .github/workflows/run001-ab-duration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/gate6f-analytics-learning
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic patch
        run: python scripts/apply_run001_ab_duration_patch.py

      - name: Preserve legacy editorial call shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/services/editorial_queue_consumer.py')
          s = p.read_text(encoding='utf-8')
          old = '''    if ai_provider is None:\n        script_id = generate_and_save_script(\n            idea_id,\n            target_duration_seconds=target_duration_seconds,\n        )\n    else:\n        script_id = generate_and_save_script(\n            idea_id,\n            ai_provider=ai_provider,\n            target_duration_seconds=target_duration_seconds,\n        )\n'''
          new = '''    if ai_provider is None:\n        if target_duration_seconds is None:\n            script_id = generate_and_save_script(idea_id)\n        else:\n            script_id = generate_and_save_script(\n                idea_id,\n                target_duration_seconds=target_duration_seconds,\n            )\n    else:\n        if target_duration_seconds is None:\n            script_id = generate_and_save_script(\n                idea_id,\n                ai_provider=ai_provider,\n            )\n        else:\n            script_id = generate_and_save_script(\n                idea_id,\n                ai_provider=ai_provider,\n                target_duration_seconds=target_duration_seconds,\n            )\n'''
          if old not in s:
              raise SystemExit('editorial compatibility anchor changed')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Focused validation
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_production_plan_service.py tests/test_editorial_queue_consumer.py tests/test_deepseek_harness.py

      - name: Syntax validation
        run: |
          python -m py_compile app/services/script_generator_service.py app/services/editorial_queue_consumer.py app/services/production_plan_service.py app/integrations/deepseek_harness/server.py scripts/run001_ab_editorial_prepare.py

      - name: Commit integrated patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/run001-ab-duration-patch.yml scripts/apply_run001_ab_duration_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(run001): govern long-form A/B editorial duration"
          git push origin HEAD:work/gate6f-analytics-learning
