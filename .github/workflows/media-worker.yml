name: BR no GTA Media Worker

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL direta da fonte de vídeo"
        required: true
        type: string
      source_name:
        description: "Nome da fonte"
        required: false
        default: "gta6-source"
        type: string

jobs:
  media-worker:
    name: Media Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ferramentas de mídia
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade "yt-dlp[default]"
          python -m pip install -r requirements/media.txt

      - name: Verificar ambiente
        run: |
          python --version
          pip --version
          ffmpeg -version | head -1
          ffprobe -version | head -1
          yt-dlp --version
          python - <<'PYTEST'
          import scenedetect
          from scenedetect import ContentDetector, detect

          print("PySceneDetect:", scenedetect.__version__)
          print("ContentDetector:", ContentDetector.__name__)
          print("detect:", detect.__name__)
          PYTEST

      - name: Testar detecção real de cenas
        run: |
          set -euo pipefail

          mkdir -p workspace/test

          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=320x240:r=30:d=2" \
            -f lavfi \
            -i "color=c=white:s=320x240:r=30:d=2" \
            -filter_complex "[0:v][1:v]concat=n=2:v=1:a=0,format=yuv420p" \
            -t 4 \
            workspace/test/scene_test.mp4

          python - <<'PYTEST'
          from pathlib import Path

          from scenedetect import ContentDetector, detect

          source = Path("workspace/test/scene_test.mp4")

          scenes = detect(
              str(source),
              ContentDetector(threshold=10.0),
          )

          print("===== PYSCENEDETECT REAL TEST =====")
          print("Arquivo:", source)
          print("Cenas detectadas:", len(scenes))

          for index, (start, end) in enumerate(scenes, start=1):
              print(
                  f"Cena {index}: "
                  f"{start.get_seconds():.3f}s -> "
                  f"{end.get_seconds():.3f}s"
              )

          if len(scenes) < 2:
              raise SystemExit(
                  "ERRO: PySceneDetect não detectou os dois planos esperados."
              )

          print("RESULTADO: PASS")
          print("PySceneDetect executou detecção real de cenas.")
          PYTEST

      - name: Criar workspace de mídia
        run: |
          mkdir -p workspace/input
          mkdir -p workspace/analysis
          mkdir -p workspace/output

      - name: Baixar fonte de vídeo
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_NAME: ${{ inputs.source_name }}
        run: |
          set -euo pipefail

          SAFE_NAME="$(printf '%s' "$SOURCE_NAME" | tr -cd '[:alnum:]_.-')"

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="gta6-source"
          fi

          OUTPUT="workspace/input/${SAFE_NAME}.mp4"

          echo "===== MEDIA INGESTION ====="
          echo "Fonte: $SOURCE_URL"
          echo "Saída: $OUTPUT"

          case "$SOURCE_URL" in
            https://www.youtube.com/*|\
            https://youtube.com/*|\
            https://m.youtube.com/*|\
            https://youtu.be/*)
              echo "Tipo: plataforma de vídeo"
              echo "Downloader: yt-dlp"

              yt-dlp \
                --no-playlist \
                --format "bv*+ba/b" \
                --merge-output-format mp4 \
                --output "$OUTPUT" \
                "$SOURCE_URL"
              ;;

            *)
              echo "Tipo: URL direta"
              echo "Downloader: curl"

              curl \
                --fail \
                --location \
                --retry 3 \
                --connect-timeout 20 \
                --output "$OUTPUT" \
                "$SOURCE_URL"
              ;;
          esac

          test -s "$OUTPUT"

          echo "===== MEDIA DOWNLOADED ====="
          ls -lh "$OUTPUT"

      - name: Analisar mídia com ffprobe
        env:
          SOURCE_NAME: ${{ inputs.source_name }}
        run: |
          set -euo pipefail

          SAFE_NAME="$(printf '%s' "$SOURCE_NAME" | tr -cd '[:alnum:]_.-')"

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="gta6-source"
          fi

          INPUT="workspace/input/${SAFE_NAME}.mp4"

          test -s "$INPUT"

          ffprobe \
            -v error \
            -show_format \
            -show_streams \
            -of json \
            "$INPUT" \
            > workspace/analysis/media_probe.json

          cat workspace/analysis/media_probe.json


      - name: Validar análise
        run: |
          test -s workspace/analysis/media_probe.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("workspace/analysis/media_probe.json")
          data = json.loads(path.read_text())

          streams = data.get("streams", [])
          media_format = data.get("format", {})

          if not streams:
              raise SystemExit("Nenhum stream encontrado na mídia.")

          if not media_format:
              raise SystemExit("Metadata de formato não encontrada.")

          video_streams = [
              stream
              for stream in streams
              if stream.get("codec_type") == "video"
          ]

          if not video_streams:
              raise SystemExit("Nenhum stream de vídeo encontrado.")

          video = video_streams[0]

          print("===== MEDIA PROBE OK =====")
          print("format:", media_format.get("format_name"))
          print("duration:", media_format.get("duration"))
          print("size:", media_format.get("size"))
          print("video_codec:", video.get("codec_name"))
          print("width:", video.get("width"))
          print("height:", video.get("height"))
          print("fps:", video.get("r_frame_rate"))
          PY

      - name: Publicar análise
        uses: actions/upload-artifact@v4
        with:
          name: media-analysis-${{ github.run_id }}
          path: workspace/analysis/media_probe.json
          retention-days: 7

      - name: Resumo do worker
        run: |
          printf '\n===== MEDIA WORKER =====\n'
          printf 'Fonte: %s\n' "${{ inputs.source_name }}"
          printf 'Runner: %s\n' "${RUNNER_NAME}"
          printf 'Workspace: %s\n' "$GITHUB_WORKSPACE"
          printf 'Análise: workspace/analysis/media_probe.json\n'
          printf 'Status: READY\n'
