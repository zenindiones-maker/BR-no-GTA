name: media-worker

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL da mídia a ser analisada"
        required: true
        type: string

      source_name:
        description: "Nome lógico da fonte"
        required: false
        default: "gta6-media"
        type: string

      test_only:
        description: "Executar somente smoke test"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: media-worker-${{ github.event.inputs.source_url }}
  cancel-in-progress: false

jobs:
  analyze-media:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout BR-no-GTA
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libgl1 \
            libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U "yt-dlp[default]"
            pip install -U "bgutil-ytdlp-pot-provider==1.3.1"
          pip install -r requirements/media.txt

      - name: Prepare workspace
        run: |
          mkdir -p workspace/input
          mkdir -p runtime/media-worker/analysis
          mkdir -p runtime/media-worker/artifact

      - name: Setup YouTube PO Token provider
        run: |
          set -euo pipefail

          git clone             --depth 1             --branch 1.3.1             https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git             runtime/bgutil-ytdlp-pot-provider

          cd runtime/bgutil-ytdlp-pot-provider/server

          deno install --allow-scripts=npm:canvas --frozen

          cd node_modules

          export DENO_NO_PROMPT=1

          nohup deno run             --no-prompt             --allow-env             --allow-net             --allow-ffi=.             --allow-read=.             ../src/main.ts             --port 4416             > ../provider.log 2>&1 &

          echo $! > ../provider.pid

          sleep 5

          if ! kill -0 "$(cat ../provider.pid)" 2>/dev/null; then
            echo "PO Token provider não iniciou."
            cat ../provider.log
            exit 1
          fi

          echo "PO Token provider iniciado em 127.0.0.1:4416"

      - name: Diagnose YouTube PO Token
        run: |
          set -euo pipefail

          echo "=== yt-dlp ==="
          which yt-dlp
          yt-dlp --version

          echo "=== Python ==="
          which python
          python --version

          echo "=== bgutil package ==="
          python -m pip show bgutil-ytdlp-pot-provider || true

          echo "=== PO Token provider ==="
          if kill -0 "$(cat runtime/bgutil-ytdlp-pot-provider/server/provider.pid)" 2>/dev/null; then
            echo "PO Token provider process: OK"
          else
            echo "PO Token provider process: FAILED"
            cat runtime/bgutil-ytdlp-pot-provider/server/provider.log || true
            exit 1
          fi

          echo "=== PO Token provider log ==="
          tail -n 100 runtime/bgutil-ytdlp-pot-provider/server/provider.log || true

          echo "=== yt-dlp diagnostic ==="
          yt-dlp \
            --verbose \
            --simulate \
            --no-playlist \
            --js-runtimes deno \
            --extractor-args "youtube:player_client=mweb;youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
            "https://www.youtube.com/watch?v=VQRLujxTm3c" \
            2>&1 | tee runtime/media-worker/yt-dlp-diagnostic.log || true

          echo "=== plugin discovery ==="
          python - <<'PY2'
          import importlib.util

          for name in (
              "yt_dlp_plugins",
              "yt_dlp_plugins.postprocessor",
          ):
              spec = importlib.util.find_spec(name)
              print(f"{name}: {spec}")
          PY2

      - name: Compare YouTube clients
        shell: bash
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: |
          set +e
          set -u
          set -o pipefail

          mkdir -p runtime/media-worker/youtube-clients

          clients=(
            mweb
            web
            web_embedded
            web_safari
            android_vr
            tv
            tv_simply
            web_music
            android
            ios
          )

          for client in "${clients[@]}"; do
            log="runtime/media-worker/youtube-clients/${client}.log"

            echo
            echo "============================================================"
            echo "YOUTUBE CLIENT: ${client}"
            echo "============================================================"

            yt-dlp \
              --verbose \
              --simulate \
              --no-playlist \
              --js-runtimes deno \
              --extractor-args "youtube:player_client=${client};youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416" \
              "$SOURCE_URL" \
              2>&1 | tee "$log"

            rc=${PIPESTATUS[0]}

            echo
            echo "CLIENT=${client}"
            echo "EXIT_CODE=${rc}"

            if grep -q "\[pot:bgutil:http\]" "$log"; then
              echo "BGUTIL_HTTP=INVOKED"
            else
              echo "BGUTIL_HTTP=NOT_INVOKED"
            fi

            if grep -q "Retrieved a gvs PO Token" "$log"; then
              echo "GVS_PO_TOKEN=RETRIEVED"
            else
              echo "GVS_PO_TOKEN=NOT_RETRIEVED"
            fi

            if grep -q "LOGIN_REQUIRED" "$log"; then
              echo "PLAYABILITY=LOGIN_REQUIRED"
            elif grep -q "UNPLAYABLE" "$log"; then
              echo "PLAYABILITY=UNPLAYABLE"
            elif grep -q "ERROR:" "$log"; then
              echo "PLAYABILITY=ERROR"
            else
              echo "PLAYABILITY=NO_FATAL_PLAYABILITY_ERROR"
            fi

            echo
          done

          echo
          echo "============================================================"
          echo "YOUTUBE CLIENT COMPARISON SUMMARY"
          echo "============================================================"

          for client in "${clients[@]}"; do
            log="runtime/media-worker/youtube-clients/${client}.log"

            if grep -q "\[pot:bgutil:http\]" "$log"; then
              pot="INVOKED"
            else
              pot="NOT_INVOKED"
            fi

            if grep -q "Retrieved a gvs PO Token" "$log"; then
              token="RETRIEVED"
            else
              token="NOT_RETRIEVED"
            fi

            if grep -q "LOGIN_REQUIRED" "$log"; then
              result="LOGIN_REQUIRED"
            elif grep -q "UNPLAYABLE" "$log"; then
              result="UNPLAYABLE"
            elif grep -q "ERROR:" "$log"; then
              result="ERROR"
            else
              result="NO_FATAL_ERROR"
            fi

            printf '%-16s POT=%-12s TOKEN=%-12s RESULT=%s\n' \
              "$client" "$pot" "$token" "$result"
          done

      - name: Download source media
        id: media-ingestion
        shell: bash
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          MEDIA_OUTPUT_PATH: workspace/input/${{ github.event.inputs.source_name }}.mp4
          YTDLP_PLAYER_CLIENT: mweb
          YTDLP_JS_RUNTIME: deno
          YTDLP_PO_TOKEN_BASE_URL: http://127.0.0.1:4416
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          PYTHONPATH: .
        run: |
          set -uo pipefail

          result_file="runtime/media-worker/ingestion-result.json"
          cookies_file="runtime/media-worker/youtube-cookies.txt"

          if [ -n "${YOUTUBE_COOKIES:-}" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > "$cookies_file"
            chmod 600 "$cookies_file"
            export YTDLP_COOKIES_FILE="$cookies_file"
            echo "YouTube cookies: configured"
          else
            echo "YouTube cookies: not configured"
          fi

          set +e
          python -m app.services.media_ingestion_cli \
            > "$result_file"
          cli_exit_code=$?
          set -e

          echo "=== Media ingestion result ==="
          cat "$result_file"

          if [ "$cli_exit_code" -eq 2 ]; then
            echo "Ingestion CLI failed technically."
            exit 2
          fi

          python -m app.services.media_ingestion_result \
            < "$result_file"

          result_exit_code=$?

          if [ "$result_exit_code" -ne 0 ]; then
            echo "Failed to interpret ingestion result."
            exit 2
          fi

          status="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("runtime/media-worker/ingestion-result.json").read_text())["status"])')"

          echo "INGESTION_STATUS=$status"
          echo "ingestion_status=$status" >> "$GITHUB_OUTPUT"

          case "$status" in
            DOWNLOAD_OK)
              echo "Ingestion succeeded."
              echo "ingestion_succeeded=true" >> "$GITHUB_OUTPUT"
              ;;

            DOWNLOAD_BLOCKED)
              echo "Ingestion blocked by a known external/domain condition."
              echo "ingestion_succeeded=false" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "Ingestion returned unexpected domain status: $status"
              echo "ingestion_succeeded=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

          echo "Downloaded files:"
          find workspace/input \
            -maxdepth 1 \
            -type f \
            -printf '%p\n'

      - name: Locate downloaded media
        if: ${{ steps.media-ingestion.outputs.ingestion_succeeded == 'true' }}
        id: media
        run: |
          set -euo pipefail

          MEDIA_FILE="$(find workspace/input \
            -maxdepth 1 \
            -type f \
            \( \
              -iname '*.mp4' \
              -o -iname '*.mkv' \
              -o -iname '*.webm' \
              -o -iname '*.mov' \
              -o -iname '*.avi' \
            \) \
            | head -n 1)"

          if [ -z "$MEDIA_FILE" ]; then
            echo "Nenhuma mídia compatível encontrada."
            exit 1
          fi

          echo "media_file=$MEDIA_FILE" >> "$GITHUB_OUTPUT"

          echo "Media file:"
          echo "$MEDIA_FILE"

      - name: Validate media with ffprobe
        if: ${{ steps.media-ingestion.outputs.ingestion_succeeded == 'true' }}
        env:
          MEDIA_FILE: ${{ steps.media.outputs.media_file }}
        run: |
          set -euo pipefail

          ffprobe \
            -v error \
            -show_format \
            -show_streams \
            -of json \
            "$MEDIA_FILE" \
            > runtime/media-worker/analysis/media_probe.json

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("runtime/media-worker/analysis/media_probe.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          streams = payload.get("streams", [])
          fmt = payload.get("format", {})

          if not streams:
              raise SystemExit("ffprobe não encontrou streams.")

          print("format:", fmt.get("format_name"))
          print("duration:", fmt.get("duration"))
          print("streams:", len(streams))
          PY

      - name: Run MediaKnowledge + WhisperX analysis
        if: ${{ steps.media-ingestion.outputs.ingestion_succeeded == 'true' && github.event.inputs.test_only != 'true' }}
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          SOURCE_NAME: ${{ github.event.inputs.source_name }}
          MEDIA_FILE: ${{ steps.media.outputs.media_file }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: .
        run: |
            set -euo pipefail
            python - <<'PY'
            import json
            import os
            from pathlib import Path

            from app.services.media_analysis.pipeline import analyze_media
            from app.services.media_worker_artifact import (
                package_media_worker_artifact,
            )
            from app.services.speech.service import analyze_speech
            from app.services.speech.whisperx_provider import (
                WhisperXProvider,
            )

            source_path = Path(os.environ["MEDIA_FILE"])

            media_probe = json.loads(
                Path("runtime/media-worker/analysis/media_probe.json")
                .read_text(encoding="utf-8")
            )

            print("==========================================")
            print("MEDIA WORKER — MEDIA KNOWLEDGE")
            print("==========================================")
            print(f"Analisando mídia: {source_path}")

            knowledge = analyze_media(source_path)

            print(f"Scenes: {len(knowledge.scenes)}")
            print(f"Audio features: {len(knowledge.audio_features)}")
            print(f"Beats: {len(knowledge.beats)}")
            print(f"Visual samples: {len(knowledge.visual_samples)}")
            print(f"Motion features: {len(knowledge.motion_features)}")

            print()
            print("==========================================")
            print("MEDIA WORKER — WHISPERX")
            print("==========================================")
            print(f"Speech source: {source_path}")

            provider = WhisperXProvider()

            speech_analysis, speech_qa = analyze_speech(
                source_path,
                provider=provider,
            )

            print(f"Provider: {provider.provider_name}")
            print(f"Model: {provider.model_name}")
            print(f"Language: {speech_analysis.source_language}")
            print(
                f"Language probability: "
                f"{speech_analysis.language_probability:.4f}"
            )
            print(f"Segments: {len(speech_analysis.segments)}")
            print(f"Speakers: {len(speech_analysis.speakers)}")
            print(
                f"Speech seconds: "
                f"{speech_analysis.speech_seconds:.3f}"
            )
            print(
                f"WPM: "
                f"{speech_analysis.words_per_minute:.2f}"
            )
            print(f"QA passed: {speech_qa.passed}")

            if not speech_qa.passed:
                raise SystemExit(
                    "Speech Analysis QA falhou: "
                    + ", ".join(speech_qa.issues)
                )

            print()
            print("==========================================")
            print("MEDIA WORKER — FINAL ARTIFACT")
            print("==========================================")

            artifact = package_media_worker_artifact(
                knowledge,
                source_path,
                "runtime/media-worker/artifact",
                source_url=os.environ["SOURCE_URL"],
                source_name=os.environ["SOURCE_NAME"],
                media_probe=media_probe,
                speech_analysis=speech_analysis,
                speech_qa=speech_qa,
            )

            for name, path in artifact.items():
                print(f"{name}: {path}")
            PY

      - name: Create smoke-test MediaKnowledge artifact
        if: ${{ steps.media-ingestion.outputs.ingestion_succeeded == 'true' && github.event.inputs.test_only == 'true' }}
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
          SOURCE_NAME: ${{ github.event.inputs.source_name }}
          MEDIA_FILE: ${{ steps.media.outputs.media_file }}
          PYTHONPATH: .
        run: |
            set -euo pipefail

            python - <<'PY'
            import json
            import os
            from pathlib import Path

            from app.services.media_analysis.pipeline import analyze_media
            from app.services.media_worker_artifact import (
                package_media_worker_artifact,
            )

            source_path = Path(os.environ["MEDIA_FILE"])

            knowledge = analyze_media(source_path)

            media_probe = json.loads(
                Path("runtime/media-worker/analysis/media_probe.json")
                .read_text(encoding="utf-8")
            )

            artifact = package_media_worker_artifact(
                knowledge,
                source_path,
                "runtime/media-worker/artifact",
                source_url=os.environ["SOURCE_URL"],
                source_name=os.environ["SOURCE_NAME"],
                media_probe=media_probe,
            )

            print(
                f"Smoke MediaKnowledge criado: "
                f"{artifact['knowledge']}"
            )
            PY

      - name: Validate final artifact
        if: ${{ steps.media-ingestion.outputs.ingestion_succeeded == 'true' }}
        run: |
            set -euo pipefail

            test -s runtime/media-worker/artifact/media_knowledge.json
            test -s runtime/media-worker/artifact/media_probe.json
            test -s runtime/media-worker/artifact/manifest.json

            if [ "${{ github.event.inputs.test_only }}" != "true" ]; then
              test -s runtime/media-worker/artifact/speech_analysis.json
              test -s runtime/media-worker/artifact/speech_qa.json
            fi

            test ! -e runtime/media-worker/artifact/media/source.mp4

            python - <<'PY'
            import json
            from pathlib import Path

            artifact_dir = Path("runtime/media-worker/artifact")

            knowledge = json.loads(
                (artifact_dir / "media_knowledge.json")
                .read_text(encoding="utf-8")
            )

            manifest = json.loads(
                (artifact_dir / "manifest.json")
                .read_text(encoding="utf-8")
            )

            if not isinstance(knowledge, dict):
                raise SystemExit(
                    "media_knowledge.json precisa conter um objeto JSON."
                )

            required = {
                "source_path",
                "scenes",
                "audio_features",
                "beats",
                "visual_samples",
                "motion_features",
                "metadata",
            }

            missing = required - knowledge.keys()

            if missing:
                raise SystemExit(
                    f"MediaKnowledge incompleto: {sorted(missing)}"
                )

            if manifest.get("artifact_type") != "media-worker":
                raise SystemExit("Manifest inválido.")

            if manifest.get("source_local_file_included") is not False:
                raise SystemExit(
                    "Manifest inválido: mídia local não deveria estar incluída."
                )

            if "${{ github.event.inputs.test_only }}" != "true":
                speech_analysis = json.loads(
                    (artifact_dir / "speech_analysis.json")
                    .read_text(encoding="utf-8")
                )

                speech_qa = json.loads(
                    (artifact_dir / "speech_qa.json")
                    .read_text(encoding="utf-8")
                )

                if speech_analysis.get("analysis_version") != "1":
                    raise SystemExit(
                        "SpeechAnalysis inválido: analysis_version."
                    )

                engine = speech_analysis.get("engine", {})

                if engine.get("provider") != "whisperx":
                    raise SystemExit(
                        "SpeechAnalysis inválido: provider não é whisperx."
                    )

                if not speech_analysis.get("segments"):
                    raise SystemExit(
                        "SpeechAnalysis inválido: nenhum segmento."
                    )

                if speech_qa.get("passed") is not True:
                    raise SystemExit(
                        "Speech QA falhou no artifact final."
                    )

                files = manifest.get("files", {})

                if files.get("speech_analysis") != "speech_analysis.json":
                    raise SystemExit(
                        "Manifest inválido: speech_analysis."
                    )

                if files.get("speech_qa") != "speech_qa.json":
                    raise SystemExit(
                        "Manifest inválido: speech_qa."
                    )

                print("SpeechAnalysis validation: OK")
                print("Speech provider:", engine.get("provider"))
                print("Speech model:", engine.get("model"))
                print(
                    "Speech segments:",
                    len(speech_analysis.get("segments", [])),
                )
                print(
                    "Speech speakers:",
                    len(speech_analysis.get("speakers", [])),
                )

            print("Final artifact validation: OK")
            print("Knowledge keys:", sorted(knowledge.keys()))
            print(
                "Analysis version:",
                knowledge["metadata"].get("analysis_version"),
            )
            PY

            echo
            echo "=== MEDIA WORKER ARTIFACT ==="

            find runtime/media-worker/artifact \
              -maxdepth 1 \
              -type f \
              -printf '%f %s bytes\n' \
              | sort

      - name: Upload MediaKnowledge artifact
        if: ${{ steps.media-ingestion.outputs.ingestion_succeeded == 'true' }}
        uses: actions/upload-artifact@v4
        with:
            name: media-knowledge
            path: |
              runtime/media-worker/artifact/media_knowledge.json
              runtime/media-worker/artifact/media_probe.json
              runtime/media-worker/artifact/manifest.json
            if-no-files-found: error
            retention-days: 3

      - name: Upload SpeechAnalysis artifact
        if: ${{ steps.media-ingestion.outputs.ingestion_succeeded == 'true' && github.event.inputs.test_only != 'true' }}
        uses: actions/upload-artifact@v4
        with:
            name: speech-analysis
            path: |
              runtime/media-worker/artifact/speech_analysis.json
              runtime/media-worker/artifact/speech_qa.json
            if-no-files-found: error
            retention-days: 3
