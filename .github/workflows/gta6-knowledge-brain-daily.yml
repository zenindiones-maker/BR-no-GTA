name: GTA6 Knowledge Brain Daily

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/gta6-knowledge-brain-daily.request.json"

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: gta6-knowledge-brain-daily
  cancel-in-progress: false

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  TARGET_REF: work/gate6f-analytics-learning

jobs:
  daily-brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact Knowledge Brain revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve target SHA
        id: sha
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "TARGET_REF_PRESERVED=PASS"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bounded runtime and Hermes pin
        run: |
          set -euo pipefail
          mkdir -p artifacts/gta6-knowledge-brain .runtime
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install psutil==7.2.2 pyyaml==6.0.3 python-dotenv==1.2.2 rich==14.3.3 pathspec==1.1.1
          python scripts/bootstrap_hermes_agent.py \
            --target "$GITHUB_WORKSPACE/.runtime/hermes-agent" \
            --output artifacts/gta6-knowledge-brain/hermes-upstream.json
          test "$(git -C "$GITHUB_WORKSPACE/.runtime/hermes-agent" rev-parse HEAD)" = "9eca7f388f71755293343dddd6ec4d9111d68fc4"
          echo "HERMES_UPSTREAM_PINNED=PASS"

      - name: Restore canonical Knowledge Brain checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/gta6-knowledge-brain/brain.db
        run: |
          set -euo pipefail
          python scripts/continuous_state_checkpoint.py restore \
            --repository "$GITHUB_REPOSITORY" \
            --current-run-id "$GITHUB_RUN_ID" \
            --destination "$BR_TEST_DATABASE" \
            --work-dir artifacts/gta6-knowledge-brain/restore

      - name: Focused Knowledge Brain regression gates
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/gta6-knowledge-brain/brain.db
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_gta6_autonomous_knowledge_brain.py \
            tests/test_continuous_operation.py \
            tests/test_telegram_gateway_conversation.py \
            tests/test_hermes_multiagent_boundary.py
          echo "KNOWLEDGE_BRAIN_FOCUSED_TESTS=PASS"

      - name: Execute autonomous daily Knowledge Brain
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/gta6-knowledge-brain/brain.db
          BR_HERMES_UPSTREAM_ROOT: ${{ github.workspace }}/.runtime/hermes-agent
        run: |
          set -euo pipefail
          force_args=()
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            force_args+=(--force-refresh)
          fi
          python scripts/gta6_knowledge_brain_daily.py \
            --artifact-dir artifacts/gta6-knowledge-brain \
            --upstream-root "$BR_HERMES_UPSTREAM_ROOT" \
            --target-sha "${{ steps.sha.outputs.sha }}" \
            --trigger-kind "$GITHUB_EVENT_NAME" \
            "${force_args[@]}"

      - name: Benchmark real Knowledge Brain retrieval
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/gta6-knowledge-brain/brain.db
        run: |
          set -euo pipefail
          python scripts/gta6_retrieval_benchmark.py \
            --output artifacts/gta6-knowledge-brain/retrieval-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/gta6-knowledge-brain/retrieval-benchmark.json").read_text())
          assert d["semantic_only"]["embedding_semantic_status"]=="NOT_PROMOTED"
          assert d["duplicate_suppression"] is True
          assert d["temporal_correctness"] is True
          assert d["bounded_context_max_bytes"] <= 32768
          print("HYBRID_RETRIEVAL="+d["HYBRID_RETRIEVAL"])
          print("SEMANTIC_EMBEDDINGS=NOT_PROMOTED")
          print("RETRIEVAL_BOUNDED_CONTEXT=PASS")
          PY

      - name: Validate immutable authority and human-surface boundaries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/gta6-knowledge-brain/gta6-knowledge-brain-daily.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["status"]=="PASS"
          assert d["authority"]=="DEEPSEEK_HARNESS"
          assert d["human_surface"]=="telegram_group"
          assert d["PRIVATE_TELEGRAM_HUMAN_SURFACE"]=="DISABLED"
          assert d["OBSIDIAN_CANONICAL_MEMORY"]=="NO"
          assert d["HERMES_DIRECT_CANONICAL_WRITE"]=="NO"
          assert d["AGENT_DIRECT_CANONICAL_WRITE"]=="NO"
          assert d["TERMUX_HEAVY_PROCESSING"]=="NO"
          assert d["telegram_group_digest"]["status"]=="DISABLED"
          assert d["UNSOLICITED_TELEGRAM_EGRESS"]=="NO"
          assert int(d["TELEGRAM_MESSAGES_SENT"]) == 0
          if d["cycle"]["trigger_kind"] != "schedule":
              assert d["FORCED_SOURCE_CHECK"]=="YES"
              assert d["cycle"]["force_gta6_refresh"] is True
          assert d["cycle"]["force_daily_projection"] is True
          assert d["cycle"]["obsidian_manifest"] is not None
          assert int(d["cycle"]["obsidian_manifest"]["file_count"]) > 0
          print("HARNESS_AUTHORITY=PASS")
          print("HERMES_SUBORDINATE=PASS")
          print("TELEGRAM_GROUP_ONLY_HUMAN_SURFACE=PASS")
          print("PRIVATE_TELEGRAM_HUMAN_SURFACE=DISABLED")
          print("DAILY_BRAIN_TELEGRAM_EGRESS=0")
          print("UNSOLICITED_TELEGRAM_EGRESS=NO")
          print("TELEGRAM_MESSAGES_SENT=0")
          print("OBSIDIAN_CANONICAL_MEMORY=NO")
          print("HERMES_DIRECT_CANONICAL_WRITE=NO")
          print("AGENT_DIRECT_CANONICAL_WRITE=NO")
          print("TERMUX_HEAVY_PROCESSING=NO")
          PY

      - name: Save canonical Knowledge Brain checkpoint
        env:
          BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/gta6-knowledge-brain/brain.db
        run: |
          set -euo pipefail
          python scripts/continuous_state_checkpoint.py save \
            --database "$BR_TEST_DATABASE" \
            --output-dir artifacts/gta6-knowledge-brain/state \
            --target-sha "${{ steps.sha.outputs.sha }}" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload canonical checkpoint transport
        uses: actions/upload-artifact@v4
        with:
          name: gta6-knowledge-brain-state-${{ github.run_id }}
          path: artifacts/gta6-knowledge-brain/state/
          if-no-files-found: error
          retention-days: 90

      - name: Upload Knowledge Brain operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-knowledge-brain-daily-${{ github.run_id }}
          path: |
            artifacts/gta6-knowledge-brain/*.json
            artifacts/gta6-knowledge-brain/gta6-intelligence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Obsidian second-brain projection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-obsidian-second-brain-${{ github.run_id }}
          path: artifacts/gta6-knowledge-brain/obsidian-memory-export/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish Knowledge Brain status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.sha.outputs.sha }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "gta6-knowledge-brain-daily",
              "description": "Autonomous GTA6 Knowledge Brain daily refresh",
              "target_url": "https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d @/tmp/status.json
