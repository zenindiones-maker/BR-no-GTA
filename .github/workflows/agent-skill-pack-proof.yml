name: Agent Skill Pack Contract Proof

on:
  push:
    branches:
      - work/superpowers-skill-pack
      - work/gate6f-analytics-learning
    paths:
      - '.github/workflows/agent-skill-pack-proof.yml'
      - 'config/agent_skill_pack_v1.json'
      - 'scripts/agent-tooling/agent_skill_pack.py'
      - 'scripts/agent-tooling/sync_agent_skill_pack.py'
      - 'scripts/agent-tooling/bootstrap_dsh_skill_pack.sh'
      - 'scripts/agent-tooling/prove_superpowers_provider.mjs'
      - '.dsh/skills/tdd/**'
      - '.dsh/skills/teach/**'
      - '.dsh/skills/handoff/**'
      - '.dsh/skills/caveman/**'
      - '.dsh/skills/video-edit/**'
      - 'tests/test_agent_skill_pack_contracts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Run agent skill pack contract tests
        run: pytest -q tests/test_agent_skill_pack_contracts.py
