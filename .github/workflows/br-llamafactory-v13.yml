name: BR LLaMA-Factory Isolated Install and Harness Admission V13
on:
  push:
    branches:
      - work/br-llamafactory-controlled-admission-v13
    paths:
      - "app/services/br_llamafactory_training_admission_v13.py"
      - "app/services/br_llamafactory_harness_gate_v13.py"
      - "app/services/global_capability_registry.py"
      - "integrations/install_llamafactory_v13_isolated.sh"
      - "tests/test_br_llamafactory_training_admission_v13.py"
      - ".github/workflows/br-llamafactory-v13.yml"
      - "docs/architecture/br-llamafactory-harness-v13.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-llamafac-v13-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-admission:
    name: Original SFT schema and denied training
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Prepare local-only persistently scoped Harness auth
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check \
            pytest==8.4.2 python-dotenv==1.2.3 packaging==25.0
          echo "BR_TEST_DATABASE=$RUNNER_TEMP/br-factory-v13-auth.db" >> "$GITHUB_ENV"
      - name: Verify strict LLaMA-Factory data admission / no TTS
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.database.schema import initialize_schema
          initialize_schema()
          PY
          python -m pytest -q tests/test_br_llamafactory_training_admission_v13.py
          echo "BR_LLAMAFAC_HARNESS_PERSISTED_AUTH_AND_DATASET_PROOF=PASS"
          echo "BR_OWNER_V1_DIRECT_LLAMAFAC_TRAINING=FORBIDDEN"

  isolated-source-install:
    name: Real pinned official LLaMA-Factory install (metadata only)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact upstream source and install in temporary venv
        env:
          BR_LLAMAFAC_PRIVATE_PREFIX: ${{ runner.temp }}/br-llamafactory-v13
        run: |
          set -euo pipefail
          bash integrations/install_llamafactory_v13_isolated.sh
          echo "BR_LLAMAFAC_REAL_PINNED_SOURCE_METADATA_INSTALL=PASS"
          echo "BR_LLAMAFAC_FULL_DEPENDENCIES_OR_TRAINING=NOT_INSTALLED"
