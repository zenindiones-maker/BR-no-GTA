name: Dynamic System Improvement Mission
run-name: System Improvement ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      plan_b64:
        required: true
        type: string
      human_goal_b64:
        required: true
        type: string
      telegram_chat_id:
        required: false
        default: "0"
        type: string
      learning_from_run_id:
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  actions: read
  statuses: write
  id-token: write

concurrency:
  group: dynamic-system-improvement-${{ inputs.dispatch_id }}
  cancel-in-progress: false

jobs:
  mission:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      ZERO_COST_OPERATION: "TRUE"
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_SHA: ${{ inputs.target_sha }}
      PLAN_B64: ${{ inputs.plan_b64 }}
      HUMAN_GOAL_B64: ${{ inputs.human_goal_b64 }}
      TELEGRAM_CHAT_ID_INPUT: ${{ inputs.telegram_chat_id }}
      LEARNING_FROM_RUN_ID: ${{ inputs.learning_from_run_id }}
      BR_TEST_DATABASE: ${{ github.workspace }}/target/artifacts/dynamic-system-improvement/control.db
      BR_HERMES_UPSTREAM_ROOT: ${{ github.workspace }}/target/.runtime/hermes-agent

    steps:
      - name: Checkout exact target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact target revision
        working-directory: target
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$TARGET_SHA"
          echo "TARGET_REF_PRESERVED=PASS"
          echo "TARGET_SHA_PRESERVED=PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: target/requirements.txt

      - name: Prepare auth-control artifact directory
        working-directory: target
        run: |
          set -euo pipefail
          mkdir -p artifacts/dynamic-system-improvement .runtime
          echo "AUTH_PREFLIGHT_BEFORE_HEAVY_BOOTSTRAP=PASS"

      - name: Restore prior canonical Learning Plane checkpoint when supplied
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run="${LEARNING_FROM_RUN_ID:-0}"
          if [ -z "$source_run" ] || [ "$source_run" = "0" ]; then
            source_run="$(python - <<'PY'
          import base64, json, os
          raw=base64.b64decode(os.environ["PLAN_B64"]).decode("utf-8")
          plan=json.loads(raw)
          state=((plan.get("goal") or {}).get("canonical_state") or {})
          value=state.get("learning_source_run_id") or 0
          print(int(value))
          PY
          )"
          fi
          if [ "$source_run" = "0" ]; then
            echo "LEARNING_PLANE_CHECKPOINT_RESTORE=NOT_REQUESTED"
            exit 0
          fi
          case "$source_run" in
            ''|*[!0-9]*) echo "LEARNING_SOURCE_RUN_ID=FAIL"; exit 2 ;;
          esac
          prior="$RUNNER_TEMP/prior-learning-$source_run"
          mkdir -p "$prior"
          gh run download "$source_run"             --repo "$GITHUB_REPOSITORY"             --name "dynamic-system-improvement-$source_run"             --dir "$prior"
          source_db="$(find "$prior" -type f -name control.db -print -quit)"
          test -n "$source_db"
          test -s "$source_db"
          mkdir -p "$(dirname "$BR_TEST_DATABASE")"
          cp "$source_db" "$BR_TEST_DATABASE"
          echo "LEARNING_PLANE_CHECKPOINT_RESTORED=PASS"
          echo "LEARNING_SOURCE_RUN_ID=$source_run"
          echo "SECOND_LEARNING_PLANE=NO"

      - name: Classify selected executor runtime requirements
        id: runtime
        working-directory: target
        run: |
          set -euo pipefail
          python scripts/mission_runtime_requirements.py \
            --plan-b64 "$PLAN_B64" \
            --output artifacts/dynamic-system-improvement/runtime-requirements.json \
            --github-output "$GITHUB_OUTPUT"
          echo "PROVIDER_SELECTED_AFTER_GOAL_RECEIPT=PASS"
          echo "TUXEVIL_GLOBAL_PREREQUISITE=NO"

      - name: Restore pinned Addy source only when selected
        if: steps.runtime.outputs.addy_source_required == 'true'
        working-directory: target
        run: |
          set -euo pipefail
          bash scripts/agent-tooling/bootstrap.sh addy
          echo "ADDY_PINNED_SOURCE_BOOTSTRAP=PASS"
          echo "ADDY_BOOTSTRAP_SELECTED_BY_TASK_ENVELOPE=PASS"
          echo "CODEX_BOOTSTRAP_FOR_ADDY_SOURCE_ONLY=NO"

      - name: Setup Node.js only for selected Codex capability
        if: steps.runtime.outputs.codex_required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install minimal auth-control Python dependency
        if: steps.runtime.outputs.codex_required == 'true'
        working-directory: target
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input python-dotenv==1.2.2
          python - <<'PY'
          import dotenv
          print("AUTH_CONTROL_MINIMAL_PYTHON_RUNTIME=PASS")
          PY

      - name: Prepare isolated Codex home
        if: steps.runtime.outputs.codex_required == 'true'
        working-directory: target
        run: |
          set -euo pipefail
          codex_home="$RUNNER_TEMP/br-dynamic-system-improvement-codex-$GITHUB_RUN_ID"
          install -d -m 700 "$codex_home"
          echo "CODEX_HOME=$codex_home" >> "$GITHUB_ENV"
          echo "CODEX_HOME_ISOLATED=PASS"

      - name: Install bounded Codex tooling
        if: steps.runtime.outputs.codex_required == 'true'
        working-directory: target
        run: |
          set -euo pipefail
          bash scripts/agent-tooling/bootstrap.sh codex
          echo "CODEX_TOOLING_BOOTSTRAP=PASS"

      - name: Prepare trusted workload identity when configured
        if: steps.runtime.outputs.codex_required == 'true'
        id: wif
        working-directory: target
        env:
          OPENAI_FEDERATION_RULE_ID_CONFIG: ${{ vars.OPENAI_FEDERATION_RULE_ID }}
          OPENAI_FEDERATION_AUDIENCE_CONFIG: ${{ vars.OPENAI_FEDERATION_AUDIENCE }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_FEDERATION_RULE_ID_CONFIG:-}" ] || [ -z "${OPENAI_FEDERATION_AUDIENCE_CONFIG:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_WIF_CONFIGURED=NO"
            missing=()
            [ -z "${OPENAI_FEDERATION_RULE_ID_CONFIG:-}" ] && missing+=("OPENAI_FEDERATION_RULE_ID")
            [ -z "${OPENAI_FEDERATION_AUDIENCE_CONFIG:-}" ] && missing+=("OPENAI_FEDERATION_AUDIENCE")
            printf 'MISSING_AUTH_CONFIGURATION=%s\n' "$(IFS=,; echo "${missing[*]}")"
            exit 0
          fi
          token_file="$RUNNER_TEMP/openai-workload-identity-$GITHUB_RUN_ID.jwt"
          request_url="$(python - <<'PY'
          import os, urllib.parse
          url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          audience=os.environ["OPENAI_FEDERATION_AUDIENCE_CONFIG"]
          sep="&" if "?" in url else "?"
          print(url+sep+urllib.parse.urlencode({"audience":audience}))
          PY
          )"
          python - "$request_url" "$token_file" <<'PY'
          import json, os, pathlib, sys, urllib.request
          req=urllib.request.Request(
              sys.argv[1],
              headers={"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload=json.loads(response.read().decode("utf-8"))
          token=str(payload.get("value") or "")
          if not token:
              raise SystemExit("OPENAI_WIF_TOKEN=FAIL missing OIDC value")
          path=pathlib.Path(sys.argv[2])
          path.write_text(token, encoding="utf-8")
          path.chmod(0o600)
          PY
          echo "OPENAI_FEDERATION_RULE_ID=$OPENAI_FEDERATION_RULE_ID_CONFIG" >> "$GITHUB_ENV"
          echo "OPENAI_FEDERATION_AUDIENCE=$OPENAI_FEDERATION_AUDIENCE_CONFIG" >> "$GITHUB_ENV"
          echo "OPENAI_IDENTITY_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "OPENAI_WIF_CONFIGURED=YES"
          echo "OPENAI_WIF_TOKEN_PERSISTED=NO"

      - name: Codex auth control preflight
        if: steps.runtime.outputs.codex_required == 'true'
        id: auth
        working-directory: target
        run: |
          set -euo pipefail
          python scripts/codex_auth_control_preflight.py             --dispatch-id "${{ inputs.dispatch_id }}"             --target-ref "$TARGET_REF"             --target-sha "$TARGET_SHA"             --plan-b64 "$PLAN_B64"             --human-goal-b64 "$HUMAN_GOAL_B64"             --telegram-chat-id "$TELEGRAM_CHAT_ID_INPUT"             --artifact-dir artifacts/dynamic-system-improvement
          echo "CODEX_AUTH_PREFLIGHT=PASS"

      - name: Resolve selected-runtime mission gate
        id: mission_gate
        working-directory: target
        env:
          CODEX_REQUIRED: ${{ steps.runtime.outputs.codex_required }}
          CODEX_AUTH_AVAILABLE: ${{ steps.auth.outputs.auth_available }}
        run: |
          set -euo pipefail
          if [ "${CODEX_REQUIRED:-false}" = "true" ]; then
            ready="${CODEX_AUTH_AVAILABLE:-false}"
          else
            ready="true"
            echo "CODEX_BOOTSTRAP_SKIPPED=PASS"
            echo "CODEX_AUTH_PREFLIGHT=NOT_REQUIRED"
          fi
          echo "mission_ready=$ready" >> "$GITHUB_OUTPUT"
          echo "MISSION_RUNTIME_GATE_READY=$ready"

      - name: Install bounded cloud runtime
        if: steps.mission_gate.outputs.mission_ready == 'true'
        working-directory: target
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install psutil==7.2.2 pyyaml==6.0.3 python-dotenv==1.2.2 rich==14.3.3 pathspec==1.1.1
          python scripts/bootstrap_hermes_agent.py             --target "$BR_HERMES_UPSTREAM_ROOT"             --output artifacts/dynamic-system-improvement/hermes-upstream.json
          test "$(git -C "$BR_HERMES_UPSTREAM_ROOT" rev-parse HEAD)" = "9eca7f388f71755293343dddd6ec4d9111d68fc4"
          echo "HERMES_UPSTREAM_PINNED=PASS"

      - name: Prepare and prove Codex sandbox
        if: steps.mission_gate.outputs.mission_ready == 'true' && steps.runtime.outputs.codex_required == 'true'
        working-directory: target
        run: |
          set -euo pipefail
          command -v codex
          codex --version
          bash scripts/prepare_codex_linux_sandbox.sh
          python scripts/codex_sandbox_preflight.py             --repository-root "$GITHUB_WORKSPACE/target"             --output artifacts/dynamic-system-improvement/codex-sandbox-preflight.json
          echo "AGENT_OFFICE_RUNTIME=PASS"
          echo "CODEX_AUTH_AVAILABLE=PASS"

      - name: Compile dynamic mission
        if: steps.mission_gate.outputs.mission_ready == 'true'
        working-directory: target
        run: |
          set -euo pipefail
          python -m py_compile             app/services/harness_collaboration_service.py             app/services/hermes_multiagent/capability_broker.py             app/services/agent_office_harness_service.py             scripts/dynamic_system_improvement_mission.py
          echo "DYNAMIC_SYSTEM_IMPROVEMENT_COMPILE=PASS"

      - name: Execute Harness planned Hermes swarm
        if: steps.mission_gate.outputs.mission_ready == 'true'
        working-directory: target
        run: |
          set -euo pipefail
          HUMAN_GOAL="$(python - <<'PY'
          import base64, os
          print(base64.b64decode(os.environ["HUMAN_GOAL_B64"], validate=True).decode("utf-8"))
          PY
          )"
          python scripts/dynamic_system_improvement_mission.py             --plan-b64 "$PLAN_B64"             --human-goal "$HUMAN_GOAL"             --base-sha "$TARGET_SHA"             --branch "$TARGET_REF"             --upstream-root "$BR_HERMES_UPSTREAM_ROOT"             --artifact-dir artifacts/dynamic-system-improvement             2>&1 | tee artifacts/dynamic-system-improvement/mission.log

      - name: Validate governed closed loop
        if: steps.mission_gate.outputs.mission_ready == 'true'
        working-directory: target
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/dynamic-system-improvement/dynamic-system-improvement-report.json").read_text())
          c=d["checks"]
          required=[
            "NATURAL_GOAL_RECEIVED",
            "HARNESS_MISSION_PLAN",
            "MISSION_PLAN_AUTHORITY",
            "CAPABILITIES_SELECTED_FROM_REGISTRY",
            "SELECTION_NOT_HARDCODED",
            "TEAM_NOT_HARDCODED",
            "MINIMUM_SUFFICIENT_TEAM",
            "HERMES_SUBORDINATE",
            "HERMES_DELEGATION_ENVELOPE",
            "NO_DIRECT_EXECUTOR_BYPASS",
            "REAL_SYSTEM_PROBLEM_OBSERVED",
            "BASELINE_MEASURED",
            "HARNESS_FINAL_DECISION",
            "NO_REGRESSION",
          ]
          for key in required:
              assert c.get(key) is True, (key,c.get(key))
              print(f"{key}=PASS")
          assert c["TASK_HARDCODED_EXECUTION_LOGIC"] == 0
          assert c["HERMES_AUTHORITY_EXPANSION"] is False
          assert c["AGENT_SELF_PROMOTION"] is False
          assert c["BUILDER_SELF_APPROVAL"] is False
          for key in (
              "REAL_CANDIDATE_CREATED",
              "PATCH_BOUNDED_TO_WORKTREE",
              "INDEPENDENT_REVIEW",
              "CANDIDATE_TESTED",
              "BASELINE_VS_CANDIDATE_COMPARED",
          ):
              value=c.get(key)
              assert value is True or value=="NOT_REQUIRED",(key,value)
              print(f"{key}={'PASS' if value is True else 'NOT_REQUIRED'}")
          print("TASK_HARDCODED_EXECUTION_LOGIC=0")
          print("HERMES_AUTHORITY_EXPANSION=NO")
          print("BUILDER_SELF_APPROVAL=NO")
          assert d["promotion_decision"] in {"HUMAN_REVIEW","PROMOTE","REJECT"}
          assert d["NEW_VOICE_SYNTHESIS"]=="NO"
          assert d["FULL_RENDER"]=="NO"
          assert d["YOUTUBE_UPLOAD"]=="NO"
          assert d["YOUTUBE_PUBLICATION"]=="NO"
          print("AGENT_SELF_PROMOTION=NO")
          print("SYSTEM_IMPROVEMENT_CLOSED_LOOP=PASS")
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER=NO")
          print("YOUTUBE_UPLOAD=NO")
          print("YOUTUBE_PUBLICATION=NO")
          PY

      - name: Assert autonomous Telegram silence
        if: steps.mission_gate.outputs.mission_ready == 'true'
        working-directory: target
        run: |
          set -euo pipefail
          test ! -e artifacts/dynamic-system-improvement/telegram-response.json
          test ! -e artifacts/dynamic-system-improvement/telegram-send.json
          echo "SYSTEM_IMPROVEMENT_AUTONOMOUS_TELEGRAM_EGRESS=0"
          echo "HARNESS_DELEGATION_TELEGRAM_EGRESS=0"
          echo "HERMES_PROGRESS_TELEGRAM_EGRESS=0"
          echo "AGENT_PROGRESS_TELEGRAM_EGRESS=0"
          echo "CI_REAL_TELEGRAM_EGRESS=0"
          echo "PROOF_REAL_TELEGRAM_EGRESS=0"

      - name: Classify auth-gated mission state
        if: steps.runtime.outputs.codex_required == 'true' && steps.mission_gate.outputs.mission_ready != 'true'
        working-directory: target
        run: |
          set -euo pipefail
          test -s artifacts/dynamic-system-improvement/codex-auth-control-report.json
          test -s artifacts/dynamic-system-improvement/mission-auth-checkpoint.json
          echo "MISSION_WAITING_FOR_AUTH=PASS"
          echo "AUTH_PREREQUISITE_BLOCKED=PASS"
          echo "SYSTEM_IMPROVEMENT_AUTONOMOUS_TELEGRAM_EGRESS=0"
          echo "HARNESS_DELEGATION_TELEGRAM_EGRESS=0"
          echo "RUNNER_WAIT_FOR_HUMAN=NO"
          echo "MISSION_CHECKPOINTED_BEFORE_AUTH_WAIT=PASS"
          echo "NEW_VOICE_SYNTHESIS=NO"
          echo "FULL_RENDER=NO"
          echo "YOUTUBE_UPLOAD=NO"
          echo "YOUTUBE_PUBLICATION=NO"

      - name: Upload mission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-system-improvement-${{ github.run_id }}
          path: target/artifacts/dynamic-system-improvement/
          if-no-files-found: error
          retention-days: 30

      - name: Publish target commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "dynamic-system-improvement",
              "description": "Harness -> Hermes -> Agent Office candidate gate",
              "target_url": "https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA"             -d @/tmp/status.json
