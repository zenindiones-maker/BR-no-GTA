name: Dynamic System Improvement Mission
run-name: System Improvement ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      plan_b64:
        required: true
        type: string
      human_goal_b64:
        required: true
        type: string
      telegram_chat_id:
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: dynamic-system-improvement-${{ inputs.dispatch_id }}
  cancel-in-progress: false

jobs:
  mission:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      ZERO_COST_OPERATION: "TRUE"
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_SHA: ${{ inputs.target_sha }}
      PLAN_B64: ${{ inputs.plan_b64 }}
      HUMAN_GOAL_B64: ${{ inputs.human_goal_b64 }}
      TELEGRAM_CHAT_ID_INPUT: ${{ inputs.telegram_chat_id }}
      BR_TEST_DATABASE: ${{ github.workspace }}/target/artifacts/dynamic-system-improvement/control.db
      BR_HERMES_UPSTREAM_ROOT: ${{ github.workspace }}/target/.runtime/hermes-agent

    steps:
      - name: Checkout exact target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact target revision
        working-directory: target
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$TARGET_SHA"
          echo "TARGET_REF_PRESERVED=PASS"
          echo "TARGET_SHA_PRESERVED=PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: target/requirements.txt

      - name: Setup Node.js for bounded Codex runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install bounded cloud runtime
        working-directory: target
        run: |
          set -euo pipefail
          mkdir -p artifacts/dynamic-system-improvement .runtime
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install psutil==7.2.2 pyyaml==6.0.3 python-dotenv==1.2.2 rich==14.3.3 pathspec==1.1.1
          python scripts/bootstrap_hermes_agent.py             --target "$BR_HERMES_UPSTREAM_ROOT"             --output artifacts/dynamic-system-improvement/hermes-upstream.json
          test "$(git -C "$BR_HERMES_UPSTREAM_ROOT" rev-parse HEAD)" = "9eca7f388f71755293343dddd6ec4d9111d68fc4"
          echo "HERMES_UPSTREAM_PINNED=PASS"

      - name: Bootstrap bounded Codex Agent Office runtime
        working-directory: target
        run: |
          set -euo pipefail
          bash scripts/agent-tooling/bootstrap.sh codex
          codex_home="$RUNNER_TEMP/br-dynamic-system-improvement-codex-$GITHUB_RUN_ID"
          install -d -m 700 "$codex_home"
          echo "CODEX_HOME=$codex_home" >> "$GITHUB_ENV"
          bash scripts/prepare_codex_linux_sandbox.sh
          python scripts/codex_sandbox_preflight.py             --repository-root "$GITHUB_WORKSPACE/target"             --output artifacts/dynamic-system-improvement/codex-sandbox-preflight.json
          codex --version
          echo "AGENT_OFFICE_RUNTIME=PASS"

      - name: Trusted Codex authentication bootstrap
        working-directory: target
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_ID: ${{ vars.TELEGRAM_ALLOWED_USER_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          set -euo pipefail
          python scripts/codex_auth_bootstrap.py             --output artifacts/dynamic-system-improvement/codex-auth-status.json             --allow-device-auth             --timeout-seconds 1200
          echo "CODEX_AUTH_PREREQUISITE=PASS"

      - name: Compile dynamic mission
        working-directory: target
        run: |
          set -euo pipefail
          python -m py_compile             app/services/harness_collaboration_service.py             app/services/hermes_multiagent/capability_broker.py             app/services/agent_office_harness_service.py             scripts/dynamic_system_improvement_mission.py
          echo "DYNAMIC_SYSTEM_IMPROVEMENT_COMPILE=PASS"

      - name: Execute Harness planned Hermes swarm
        working-directory: target
        run: |
          set -euo pipefail
          HUMAN_GOAL="$(python - <<'PY'
          import base64, os
          print(base64.b64decode(os.environ["HUMAN_GOAL_B64"], validate=True).decode("utf-8"))
          PY
          )"
          python scripts/dynamic_system_improvement_mission.py             --plan-b64 "$PLAN_B64"             --human-goal "$HUMAN_GOAL"             --base-sha "$TARGET_SHA"             --branch "$TARGET_REF"             --upstream-root "$BR_HERMES_UPSTREAM_ROOT"             --artifact-dir artifacts/dynamic-system-improvement             2>&1 | tee artifacts/dynamic-system-improvement/mission.log

      - name: Validate governed closed loop
        working-directory: target
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/dynamic-system-improvement/dynamic-system-improvement-report.json").read_text())
          c=d["checks"]
          required=[
            "MISSION_PLAN_GENERATED_FROM_GOAL",
            "AGENTS_SELECTED_FROM_REGISTRY",
            "NO_HARDCODED_TEAM_REQUIRED",
            "HERMES_HARNESS_SYNERGY",
            "MULTI_AGENT_EXECUTION_REAL",
            "HANDOFF_REAL",
            "REAL_SYSTEM_PROBLEM_OBSERVED",
            "BASELINE_MEASURED",
            "DEVELOPMENT_AGENT_DELEGATED",
            "REAL_PATCH_CREATED",
            "PATCH_BOUNDED_TO_WORKTREE",
            "CANDIDATE_TESTED",
            "BASELINE_VS_CANDIDATE_COMPARED",
            "HARNESS_PROMOTION_DECISION",
            "NO_REGRESSION",
          ]
          for key in required:
              assert c.get(key) is True, (key,c.get(key))
              print(f"{key}=PASS")
          assert c["AGENT_SELF_PROMOTION"] is False
          assert d["promotion_decision"] in {"HUMAN_REVIEW","PROMOTE","REJECT"}
          assert d["NEW_VOICE_SYNTHESIS"]=="NO"
          assert d["FULL_RENDER"]=="NO"
          assert d["YOUTUBE_UPLOAD"]=="NO"
          assert d["YOUTUBE_PUBLICATION"]=="NO"
          print("AGENT_SELF_PROMOTION=NO")
          print("SYSTEM_IMPROVEMENT_CLOSED_LOOP=PASS")
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER=NO")
          print("YOUTUBE_UPLOAD=NO")
          print("YOUTUBE_PUBLICATION=NO")
          PY

      - name: Send final human result to Telegram
        if: inputs.telegram_chat_id != '0'
        working-directory: target
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "TELEGRAM_FINAL_RESULT=SKIPPED_NO_TOKEN"
            exit 0
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.telegram_harness_gateway import TelegramApi
          d=json.loads(Path("artifacts/dynamic-system-improvement/dynamic-system-improvement-report.json").read_text())
          b=d["baseline"]
          gate=d.get("integration_gate") or {}
          decision=d["promotion_decision"]
          text="\n".join([
              "AÇÃO",
              "Medi o caminho legado de melhoria e executei a equipe mínima selecionada pelo Harness.",
              "",
              "RESULTADO",
              f"O fluxo legado chamava {b['legacy_fixed_specialists']} especialistas fixos; o plano atual usou {b['dynamic_selected_tasks']}.",
              "",
              "O QUE MUDOU",
              "O Agent Office criou um candidate isolado e o reviewer independente avaliou o patch.",
              "",
              "PROVA",
              f"Integration gate: {gate.get('status','UNAVAILABLE')}. Decisão do Harness: {decision}.",
              "",
              "PRÓXIMO",
              "Nenhum agente promoveu o próprio patch. Se a decisão exigir revisão humana, o candidate permanece isolado.",
          ])
          TelegramApi(os.environ["TELEGRAM_BOT_TOKEN"]).send(int(os.environ["TELEGRAM_CHAT_ID_INPUT"]), text)
          print("TELEGRAM_HUMAN_READABLE_RESULT=PASS")
          PY

      - name: Upload mission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-system-improvement-${{ github.run_id }}
          path: target/artifacts/dynamic-system-improvement/
          if-no-files-found: error
          retention-days: 30

      - name: Publish target commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "dynamic-system-improvement",
              "description": "Harness -> Hermes -> Agent Office candidate gate",
              "target_url": "https://github.com/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/"+os.environ["GITHUB_RUN_ID"],
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA"             -d @/tmp/status.json
