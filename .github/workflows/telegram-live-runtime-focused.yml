name: Telegram Live Runtime Focused

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/telegram-live-runtime-focused.request.json"

permissions:
  contents: read
  statuses: write

env:
  PYTHONPATH: .
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/telegram-live-runtime-focused/focused.db

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          set -euo pipefail
          mkdir -p artifacts/telegram-live-runtime-focused
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Validate shell and Python entrypoints
        run: |
          set -euo pipefail
          bash -n scripts/telegram_termux_control.sh
          bash -n scripts/install_telegram_termux_persistence.sh
          python -m py_compile scripts/telegram_harness_gateway_v2.py
          echo "TELEGRAM_RUNTIME_CONTRACT_COMPILE=PASS"

      - name: Run live-path focused regressions
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_telegram_a15_runtime_contract.py             tests/test_telegram_gateway_conversation.py::test_live_status_sends_no_visible_progress_before_final_answer             tests/test_telegram_gateway_conversation.py::test_live_status_passes_no_progress_callback_to_conversation_service             tests/test_telegram_gateway_conversation.py::test_governed_ingress_accepts_private_group_and_supergroup_only_under_policy             --junitxml=artifacts/telegram-live-runtime-focused/pytest.xml
          echo "TELEGRAM_RUNTIME_RECONCILE_CONTRACT=PASS"
          echo "STATUS_PROVIDER_INDEPENDENT_CONTRACT=PASS"
          echo "GROUP_INGRESS_POLICY_CONTRACT=PASS"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-live-runtime-focused-${{ github.run_id }}
          path: artifacts/telegram-live-runtime-focused/
          if-no-files-found: error
          retention-days: 30
