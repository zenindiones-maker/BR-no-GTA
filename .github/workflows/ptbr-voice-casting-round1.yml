name: PT-BR Voice Casting Round 1
run-name: PT-BR voice casting · blind round 1 · ${{ github.run_attempt }}

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run001/voice-casting.request.json

permissions:
  contents: read

concurrency:
  group: ptbr-voice-casting-round1
  cancel-in-progress: false

jobs:
  voice-casting-round1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gate6f-analytics-learning
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install voice casting runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt pytest
          python -m pip install "edge-tts==7.2.8" "faster-whisper==1.2.0"

      - name: Focused voice casting and narration tests
        run: |
          set -euo pipefail
          pytest -q tests/test_voice_casting_service.py tests/test_narration_pipeline.py tests/test_narration_timing_contract.py tests/test_harness_capability_service.py tests/test_harness_routing_policy_service.py

      - name: Enumerate live voices and build blind Round 1
        run: |
          set -euo pipefail
          rm -rf runtime/voice-casting
          python scripts/ptbr_voice_casting.py --config .run001/video-a-investigative-longform.json --request .run001/voice-casting.request.json --output-dir runtime/voice-casting

      - name: Deliver blind Round 1 to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ vars.TELEGRAM_REVIEW_CHAT_ID || secrets.TELEGRAM_REVIEW_CHAT_ID }}
        run: |
          set -euo pipefail
          python scripts/send_voice_casting_round1_telegram.py

      - name: Upload compact blind casting proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptbr-voice-casting-round1-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/voice-casting/proof/
          if-no-files-found: error
          retention-days: 30

      - name: Upload blind identity map separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptbr-voice-casting-round1-identity-map-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/voice-casting/private-map/
          if-no-files-found: error
          retention-days: 30
