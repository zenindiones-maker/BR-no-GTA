name: Telegram OpenCode Executor Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'run Telegram executor benchmark')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMNIROUTE_VERSION: "3.8.50"
      OPENCODE_CLI_VERSION: "2.0.8"
      CANONICAL_MODEL: "oc/big-pickle"
      EXECUTOR_MODEL: "opencode/big-pickle"
      EXPECTED_TEXT: "BR_NO_GTA_TELEGRAM_RECOVERY_OK"
      TASK_CLASS: "telegram-reasoning"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact executor runtimes
        run: |
          set -euo pipefail
          npm install --global "omniroute@$OMNIROUTE_VERSION"
          npm install --global "@opencode/cli@$OPENCODE_CLI_VERSION"
          test "$(omniroute --version | tr -d '\r')" = "$OMNIROUTE_VERSION"
          test "$(opencode --version | awk '{print $NF}' | tr -d '\r')" = "$OPENCODE_CLI_VERSION"

      - name: Start baseline OmniRoute loopback gateway
        run: |
          set -euo pipefail
          OMNIROUTE_SERVER_HOST=127.0.0.1 nohup omniroute serve >/tmp/omniroute.log 2>&1 &
          echo $! >/tmp/omniroute.pid
          for i in {1..40}; do
            if ! kill -0 "$(cat /tmp/omniroute.pid)" 2>/dev/null; then
              cat /tmp/omniroute.log || true
              exit 1
            fi
            if curl --connect-timeout 2 --max-time 5 -fsS               http://127.0.0.1:20128/api/monitoring/health >/tmp/omniroute-health.json 2>/dev/null; then
              python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("/tmp/omniroute-health.json").read_text())
          assert payload.get("status") == "healthy", payload
          print("OMNIROUTE_HEALTH=PASS")
          PY
              exit 0
            fi
            sleep 2
          done
          cat /tmp/omniroute.log || true
          exit 1

      - name: Execute equivalent baseline and candidate workload
        run: |
          set -euo pipefail
          mkdir -p runtime/telegram-opencode-benchmark
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time, urllib.error, urllib.request

          root=pathlib.Path("runtime/telegram-opencode-benchmark")
          expected=os.environ["EXPECTED_TEXT"]
          prompt=f"Return only: {expected}"
          canonical_model=os.environ["CANONICAL_MODEL"]
          executor_model=os.environ["EXECUTOR_MODEL"]
          task_class=os.environ["TASK_CLASS"]
          prompt_sha=hashlib.sha256(prompt.encode()).hexdigest()
          workload_fingerprint=hashlib.sha256(json.dumps({
              "task_class":task_class,
              "canonical_model":canonical_model,
              "prompt_sha256":prompt_sha,
              "expected_text":expected,
              "stream":False,
          },sort_keys=True,separators=(",",":")).encode()).hexdigest()

          def metrics(*, success, quality, latency, failure):
              return {
                  "task_success_rate":1.0 if success else 0.0,
                  "quality":float(quality),
                  "human_correction_rate":0.0,
                  "retry_rate":0.0,
                  "failure_recurrence":1.0 if failure else 0.0,
                  "latency_seconds":float(latency),
                  "cost":0.0,
                  "policy_violations":0.0,
              }

          baseline_started=time.monotonic()
          baseline={
              "observed":True,
              "role":"baseline",
              "provider":"opencode",
              "canonical_model":canonical_model,
              "executor":"omniroute-http",
              "executor_version":os.environ["OMNIROUTE_VERSION"],
              "fallback_occurred":False,
              "retry_count":0,
              "workload_fingerprint":workload_fingerprint,
              "prompt_sha256":prompt_sha,
          }
          request=urllib.request.Request(
              "http://127.0.0.1:20128/v1/providers/opencode/chat/completions",
              data=json.dumps({
                  "model":canonical_model,
                  "messages":[{"role":"user","content":prompt}],
                  "stream":False,
              }).encode(),
              headers={"Content-Type":"application/json"},
              method="POST",
          )
          baseline_text=""
          try:
              with urllib.request.urlopen(request,timeout=180) as response:
                  body=response.read().decode("utf-8","replace")
                  payload=json.loads(body)
                  choices=payload.get("choices") or []
                  baseline_text=str((choices[0].get("message") or {}).get("content") or "") if choices else ""
                  baseline.update(
                      http_status=response.status,
                      outcome="COMPLETED" if baseline_text.strip() else "FAILED",
                      error_code=None if baseline_text.strip() else "empty_response",
                      response_body_sha256=hashlib.sha256(body.encode()).hexdigest(),
                  )
          except urllib.error.HTTPError as exc:
              body=exc.read().decode("utf-8","replace")
              error_code=f"upstream_http_{exc.code}"
              provider_error_code=None
              provider_error_message=None
              try:
                  payload=json.loads(body)
                  error=payload.get("error") or payload
                  if isinstance(error,dict):
                      provider_error_code=str(error.get("code") or "") or None
                      provider_error_message=str(error.get("message") or "")[:300] or None
              except Exception:
                  pass
              baseline.update(
                  http_status=exc.code,
                  outcome="FAILED",
                  error_code=error_code,
                  provider_error_code=provider_error_code,
                  provider_error_message=provider_error_message,
                  response_body_sha256=hashlib.sha256(body.encode()).hexdigest(),
                  response_chars=len(body),
              )
          except Exception as exc:
              baseline.update(
                  http_status=None,
                  outcome="FAILED",
                  error_code=type(exc).__name__,
                  provider_error_code=None,
                  provider_error_message=str(exc)[:300],
              )
          baseline_latency=time.monotonic()-baseline_started
          baseline_quality=1.0 if baseline_text.strip()==expected else 0.0
          baseline_success=baseline.get("outcome")=="COMPLETED" and baseline_quality==1.0
          baseline["usable_text"]=bool(baseline_text.strip())
          baseline["latency_seconds"]=baseline_latency
          baseline["metrics"]=metrics(
              success=baseline_success,
              quality=baseline_quality,
              latency=baseline_latency,
              failure=not baseline_success,
          )
          baseline["evidence_refs"]=[
              f"github:run:{os.environ['GITHUB_RUN_ID']}:baseline",
              f"workload:{workload_fingerprint}",
              f"prompt-sha256:{prompt_sha}",
          ]

          candidate_started=time.monotonic()
          process=subprocess.run(
              [
                  "opencode","run","--standalone","--model",executor_model,
                  "--format","json",prompt,
              ],
              capture_output=True,
              text=True,
              timeout=300,
          )
          candidate_latency=time.monotonic()-candidate_started
          text_parts=[]
          parse_errors=0
          for raw in process.stdout.splitlines():
              if not raw.strip():
                  continue
              try:
                  item=json.loads(raw)
              except json.JSONDecodeError:
                  parse_errors+=1
                  continue
              if item.get("type")!="text":
                  continue
              part=item.get("part") or {}
              value=part.get("text")
              if isinstance(value,str):
                  text_parts.append(value)
          candidate_text="".join(text_parts).strip()
          candidate_quality=1.0 if candidate_text==expected else 0.0
          candidate_success=process.returncode==0 and candidate_quality==1.0
          candidate={
              "observed":True,
              "role":"candidate",
              "provider":"opencode",
              "canonical_model":canonical_model,
              "executor_model":executor_model,
              "executor":"official-opencode-cli",
              "executor_version":os.environ["OPENCODE_CLI_VERSION"],
              "exit_code":process.returncode,
              "outcome":"COMPLETED" if candidate_success else "FAILED",
              "usable_text":bool(candidate_text),
              "text_matches_expected":candidate_quality==1.0,
              "stdout_sha256":hashlib.sha256(process.stdout.encode()).hexdigest(),
              "stderr_sha256":hashlib.sha256(process.stderr.encode()).hexdigest(),
              "parse_errors":parse_errors,
              "fallback_occurred":False,
              "retry_count":0,
              "latency_seconds":candidate_latency,
              "workload_fingerprint":workload_fingerprint,
              "prompt_sha256":prompt_sha,
              "metrics":metrics(
                  success=candidate_success,
                  quality=candidate_quality,
                  latency=candidate_latency,
                  failure=not candidate_success,
              ),
              "evidence_refs":[
                  f"github:run:{os.environ['GITHUB_RUN_ID']}:candidate",
                  f"workload:{workload_fingerprint}",
                  f"prompt-sha256:{prompt_sha}",
              ],
          }

          regression_checks={
              "same_workload":baseline["workload_fingerprint"]==candidate["workload_fingerprint"],
              "same_provider":baseline["provider"]==candidate["provider"]=="opencode",
              "same_canonical_model":baseline["canonical_model"]==candidate["canonical_model"]=="oc/big-pickle",
              "candidate_no_fallback":candidate["fallback_occurred"] is False,
              "candidate_zero_retry":candidate["retry_count"]==0,
              "candidate_zero_cost":candidate["metrics"]["cost"]==0.0,
              "candidate_policy_violations_zero":candidate["metrics"]["policy_violations"]==0.0,
              "candidate_exact_quality":candidate["metrics"]["quality"]==1.0,
              "candidate_completed":candidate["metrics"]["task_success_rate"]==1.0,
          }
          regression={
              "observed":True,
              "status":"PASS" if all(regression_checks.values()) else "FAIL",
              "checks":regression_checks,
              "critical_failures":[
                  key for key,value in regression_checks.items() if not value
              ],
              "evidence_refs":[
                  f"github:run:{os.environ['GITHUB_RUN_ID']}:regression",
                  f"workload:{workload_fingerprint}",
              ],
          }

          adversarial_checks={
              "baseline_no_fallback":baseline["fallback_occurred"] is False,
              "candidate_no_fallback":candidate["fallback_occurred"] is False,
              "candidate_model_explicit":executor_model=="opencode/big-pickle",
              "canonical_model_unchanged":canonical_model=="oc/big-pickle",
          }
          adversarial={
              "observed":True,
              "status":"PASS" if all(adversarial_checks.values()) else "FAIL",
              "checks":adversarial_checks,
              "critical_failures":[
                  key for key,value in adversarial_checks.items() if not value
              ],
              "evidence_refs":[
                  f"github:run:{os.environ['GITHUB_RUN_ID']}:adversarial",
                  f"workload:{workload_fingerprint}",
              ],
          }

          evidence={
              "schema":"telegram-opencode-executor-benchmark/v1",
              "observed":True,
              "source_incident":{
                  "run_id":35340487375,
                  "job_id":105585029658,
                  "provider":"opencode",
                  "model":"oc/big-pickle",
                  "http_status":403,
                  "exit_code":1,
              },
              "workload_fingerprint":workload_fingerprint,
              "prompt_sha256":prompt_sha,
              "baseline":baseline,
              "candidate":candidate,
              "regression_evidence":regression,
              "adversarial_evidence":adversarial,
              "evaluator_ready":{
                  "baseline_observation":baseline,
                  "candidate_observation":candidate,
                  "regression_observation":regression,
                  "adversarial_observation":adversarial,
              },
              "promotion_performed":False,
          }
          (root/"benchmark-evidence.json").write_text(
              json.dumps(evidence,indent=2,sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps({
              "baseline_outcome":baseline["outcome"],
              "baseline_http_status":baseline.get("http_status"),
              "candidate_outcome":candidate["outcome"],
              "candidate_exit_code":candidate["exit_code"],
              "baseline_latency_seconds":baseline_latency,
              "candidate_latency_seconds":candidate_latency,
              "workload_fingerprint":workload_fingerprint,
              "regression_status":regression["status"],
              "adversarial_status":adversarial["status"],
          },sort_keys=True))
          PY

      - name: Validate observed evaluator inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("runtime/telegram-opencode-benchmark/benchmark-evidence.json").read_text())
          assert data["observed"] is True
          assert data["source_incident"]["run_id"] == 35340487375
          assert data["source_incident"]["job_id"] == 105585029658
          base=data["evaluator_ready"]["baseline_observation"]
          cand=data["evaluator_ready"]["candidate_observation"]
          assert base["workload_fingerprint"] == cand["workload_fingerprint"]
          assert base["provider"] == cand["provider"] == "opencode"
          assert base["canonical_model"] == cand["canonical_model"] == "oc/big-pickle"
          assert cand["executor_model"] == "opencode/big-pickle"
          assert data["regression_evidence"]["observed"] is True
          assert data["adversarial_evidence"]["observed"] is True
          print("TELEGRAM_REAL_BASELINE_VS_CANDIDATE=PASS")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-opencode-executor-benchmark
          path: runtime/telegram-opencode-benchmark/benchmark-evidence.json
          retention-days: 30
          if-no-files-found: error

      - name: Shutdown OmniRoute
        if: always()
        run: |
          if [ -f /tmp/omniroute.pid ]; then
            kill "$(cat /tmp/omniroute.pid)" 2>/dev/null || true
          fi
# Trigger note: benchmark remains manual/push-gated and evidence-only until Harness promotion.
