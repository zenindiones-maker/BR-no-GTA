name: OpenCode Native AI Executor

on:
  workflow_dispatch:
    inputs:
      execution_id:
        required: true
        type: string
      canonical_model:
        required: true
        type: string
      executor_model:
        required: true
        type: string
      cli_version:
        required: true
        type: string
      prompt_b64:
        required: true
        type: string
      zero_cost_operation:
        required: true
        default: "true"
        type: string

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_CANONICAL_MODEL: oc/big-pickle
      EXPECTED_EXECUTOR_MODEL: opencode/big-pickle
      EXPECTED_CLI_VERSION: "2.0.8"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enforce immutable governed profile
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          CANONICAL_MODEL: ${{ inputs.canonical_model }}
          EXECUTOR_MODEL: ${{ inputs.executor_model }}
          CLI_VERSION: ${{ inputs.cli_version }}
          ZERO_COST_OPERATION: ${{ inputs.zero_cost_operation }}
        run: |
          set -euo pipefail
          test -n "$EXECUTION_ID"
          test "$ZERO_COST_OPERATION" = "true"
          test "$CANONICAL_MODEL" = "$EXPECTED_CANONICAL_MODEL"
          test "$EXECUTOR_MODEL" = "$EXPECTED_EXECUTOR_MODEL"
          test "$CLI_VERSION" = "$EXPECTED_CLI_VERSION"

      - name: Install pinned official OpenCode CLI
        env:
          CLI_VERSION: ${{ inputs.cli_version }}
        run: |
          set -euo pipefail
          npm install --global "@opencode/cli@${CLI_VERSION}"
          REPORTED="$(opencode --version | awk '{print $NF}' | tr -d '\r' | sed -E 's/^v//')"
          test "$REPORTED" = "$CLI_VERSION"

      - name: Execute explicit governed model
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          CANONICAL_MODEL: ${{ inputs.canonical_model }}
          EXECUTOR_MODEL: ${{ inputs.executor_model }}
          CLI_VERSION: ${{ inputs.cli_version }}
          PROMPT_B64: ${{ inputs.prompt_b64 }}
        run: |
          set -euo pipefail
          mkdir -p runtime/opencode-native-result
          python - <<'PY'
          import base64, os
          from pathlib import Path
          raw = base64.b64decode(os.environ["PROMPT_B64"], validate=True)
          text = raw.decode("utf-8")
          if not text.strip():
              raise SystemExit("empty prompt")
          Path("runtime/opencode-native-result/prompt.txt").write_text(text, encoding="utf-8")
          PY

          START="$(python - <<'PY'
          import time
          print(time.time())
          PY
          )"
          set +e
          timeout 300 opencode run             --standalone             --model "$EXECUTOR_MODEL"             --format json             "$(cat runtime/opencode-native-result/prompt.txt)"             > runtime/opencode-native-result/stdout.ndjson             2> runtime/opencode-native-result/stderr.txt
          RC=$?
          set -e
          END="$(python - <<'PY'
          import time
          print(time.time())
          PY
          )"

          RC="$RC" START="$START" END="$END" python - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path

          root = Path("runtime/opencode-native-result")
          stdout = (root / "stdout.ndjson").read_text(encoding="utf-8", errors="replace")
          stderr = (root / "stderr.txt").read_text(encoding="utf-8", errors="replace")
          rc = int(os.environ["RC"])
          parts = []
          parse_errors = 0
          for raw in stdout.splitlines():
              if not raw.strip():
                  continue
              try:
                  item = json.loads(raw)
              except json.JSONDecodeError:
                  parse_errors += 1
                  continue
              if item.get("type") != "text":
                  continue
              part = item.get("part") or {}
              text = part.get("text")
              if isinstance(text, str) and text:
                  parts.append(text)
          answer = "".join(parts).strip()

          safe_stderr = []
          for line in stderr.splitlines():
              low = line.lower()
              if any(term in low for term in (
                  "authorization:", "bearer ", "api_key", "apikey", "token="
              )):
                  continue
              if re.search(r"(sk-|ghp_|github_pat_)[A-Za-z0-9_-]{8,}", line):
                  continue
              safe_stderr.append(line[:500])

          elapsed = max(0.0, float(os.environ["END"]) - float(os.environ["START"]))
          result = {
              "status": "EXECUTED" if rc == 0 and bool(answer) else "FAILED",
              "provider": "opencode",
              "canonical_model": os.environ["CANONICAL_MODEL"],
              "executor_model": os.environ["EXECUTOR_MODEL"],
              "text": answer,
              "cli_version": os.environ["CLI_VERSION"],
              "runtime_identity": "github-actions:ubuntu-24.04:node24:opencode-cli",
              "execution_id": os.environ["EXECUTION_ID"],
              "elapsed_seconds": elapsed,
              "fallback_occurred": False,
              "retry_count": 0,
              "exit_code": rc,
              "stdout_sha256": hashlib.sha256(stdout.encode()).hexdigest(),
              "stderr_sha256": hashlib.sha256(stderr.encode()).hexdigest(),
              "parse_errors": parse_errors,
              "safe_stderr": safe_stderr[-20:],
          }
          (root / "result.json").write_text(
              json.dumps(result, ensure_ascii=True, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps({
              "status": result["status"],
              "provider": result["provider"],
              "canonical_model": result["canonical_model"],
              "executor_model": result["executor_model"],
              "cli_version": result["cli_version"],
              "elapsed_seconds": result["elapsed_seconds"],
              "exit_code": result["exit_code"],
              "usable_text": bool(answer),
              "fallback_occurred": False,
          }, sort_keys=True))
          if result["status"] != "EXECUTED":
              print("OPENCODE_NATIVE_ERROR=native_execution_failed")
              raise SystemExit(rc or 1)
          PY
          rm -f runtime/opencode-native-result/prompt.txt

      - name: Upload canonical observed result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-native-result
          path: |
            runtime/opencode-native-result/result.json
            runtime/opencode-native-result/stdout.ndjson
            runtime/opencode-native-result/stderr.txt
          retention-days: 7
          if-no-files-found: error
