name: YouTube Cloud Execution Schema Patch

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .github/workflows/youtube-cloud-schema-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic schema patch
        run: python scripts/apply_youtube_cloud_execution_schema_patch.py
      - name: Validate schema syntax
        run: python -m compileall -q app/database/schema.py app/database/youtube_cloud_execution_repository.py
      - name: Remove one-shot patch infrastructure
        run: |
          rm scripts/apply_youtube_cloud_execution_schema_patch.py
          rm .github/workflows/youtube-cloud-schema-patch.yml
      - name: Commit and push exact migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/database/schema.py app/database/youtube_cloud_execution_repository.py scripts/apply_youtube_cloud_execution_schema_patch.py .github/workflows/youtube-cloud-schema-patch.yml
          git diff --cached --check
          git commit -m "feat(youtube): persist cloud upload execution metadata"
          git push origin HEAD:work/gate6f-analytics-learning
