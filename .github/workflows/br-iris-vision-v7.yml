name: BR Iris Vision Harness V7 (owned static browser proof)
on:
  push:
    branches:
      - work/br-iris-vision-harness-v7
    paths:
      - "app/services/reverse_engineering_iris_v7_service.py"
      - "app/services/reverse_engineering_harness_service.py"
      - "app/services/global_capability_registry.py"
      - "integrations/iris/**"
      - "scripts/br_iris_visual_observe_v7.py"
      - "tests/test_reverse_engineering_iris_v7.py"
      - "tests/test_reverse_engineering_iris_harness_v7.py"
      - ".github/workflows/br-iris-vision-v7.yml"
      - "docs/architecture/br-iris-vision-v7.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-iris-vision-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  camera:
    name: Pinned Iris + real Chromium camera + governed Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test camera authority and static HTML controls
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest "python-dotenv==1.2.3"
          python -m pytest -q tests/test_reverse_engineering_iris_v7.py tests/test_reverse_engineering_iris_harness_v7.py tests/test_global_capability_registry.py
      - name: Confirm runtime prerequisites
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "BR_IRIS_CHROME_AVAILABLE=PASS"
      - name: Install pinned upstream release with verified SHA-256
        env:
          BR_IRIS_INSTALL_PREFIX: ${{ runner.temp }}/br-iris-0.4.1
        run: |
          set -euo pipefail
          bash integrations/iris/install_pinned_iris.sh
          test "$("$BR_IRIS_INSTALL_PREFIX/iris" --version)" = "iris 0.4.1"
      - name: Real local HTML captures through persisted DeepSeek Harness authorization
        env:
          BR_IRIS_PINNED_BIN: ${{ runner.temp }}/br-iris-0.4.1/iris
          BR_TEST_DATABASE: ${{ runner.temp }}/br-iris-v7-auth.db
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/approved-iris-pages" "$RUNNER_TEMP/private-iris-shots"
          cat > "$RUNNER_TEMP/approved-iris-pages/owner-fixture.html" <<'HTML'
          <!doctype html>
          <html lang="pt">
          <head>
            <meta charset="utf-8">
            <style>
              html,body {margin:0;padding:0}
              body {background:linear-gradient(120deg,#071b28,#3b5a80);color:#fff;font-family:Arial,sans-serif}
              main {margin:40px;padding:30px;border-radius:24px;background:rgba(255,255,255,0.14)}
              h1 {font-size:36px;color:#79e3ef}
              p {font-size:21px;line-height:1.5}
            </style>
          </head>
          <body><main><h1 id="hero">BR NO GTA — IRIS</h1><p>Visual evidence belongs to Harness.</p></main></body>
          </html>
          HTML
          python - <<'PY'
          import os
          from pathlib import Path
          from app.services.harness_authorization_service import issue_harness_authorization
          from app.services.reverse_engineering_harness_service import IRIS_CAPABILITY_ID
          root=Path(os.environ["RUNNER_TEMP"])
          a=issue_harness_authorization(
              authorized_action="RESEARCH",
              subject=f"capability:{IRIS_CAPABILITY_ID}",
              lineage={
                  "allowed_media_roots":[str(root/"approved-iris-pages")],
                  "allowed_vision_output_roots":[str(root/"private-iris-shots")],
              },
          )
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write(f"BR_IRIS_AUTH_ID={a.authorization_id}\n")
          print("BR_IRIS_HARNESS_AUTH_PERSISTED=PASS")
          PY
          export BR_IRIS_AUTH_ID="$(grep '^BR_IRIS_AUTH_ID=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2-)"
          test -n "$BR_IRIS_AUTH_ID"
          python scripts/br_iris_visual_observe_v7.py \
            --authorization-id "$BR_IRIS_AUTH_ID" \
            --input "$RUNNER_TEMP/approved-iris-pages/owner-fixture.html" \
            --output-image "$RUNNER_TEMP/private-iris-shots/desktop.png" \
            --output-receipt "$RUNNER_TEMP/private-iris-shots/desktop-receipt.json" \
            --viewport 960x600
          python scripts/br_iris_visual_observe_v7.py \
            --authorization-id "$BR_IRIS_AUTH_ID" \
            --input "$RUNNER_TEMP/approved-iris-pages/owner-fixture.html" \
            --output-image "$RUNNER_TEMP/private-iris-shots/mobile-hero.png" \
            --output-receipt "$RUNNER_TEMP/private-iris-shots/mobile-receipt.json" \
            --viewport 390x844 --selector h1
          python - <<'PY'
          import hashlib,json,os,stat
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"private-iris-shots"
          for label in ("desktop","mobile"):
              receipt=root/f"{label}-receipt.json"
              img=root/("desktop.png" if label=="desktop" else "mobile-hero.png")
              data=json.loads(receipt.read_text())["result"]
              proof=data["evidence"]
              magic=img.read_bytes()
              assert magic[:8]==b"\x89PNG\r\n\x1a\n"
              assert hashlib.sha256(magic).hexdigest()==proof["image_sha256"]
              assert (stat.S_IMODE(img.stat().st_mode)&0o077)==0
              assert data["status"]=="PRIVATE_VISUAL_CAPTURED"
              assert proof["iris_version"]=="iris 0.4.1"
              assert proof["image_width"]>20 and proof["image_height"]>10
              assert proof["live_website_capture"] is False
              assert proof["mcp_registered"] is False
              assert proof["artistic_quality_approved"] is False
              assert data["network_site_capture"]=="NOT_ATTEMPTED"
              assert data["publication"]=="FORBIDDEN"
              assert data["memory_write"]=="NOT_ATTEMPTED"
          print("BR_IRIS_REAL_CHROME_DESKTOP_AND_ELEMENT=PASS")
          print("BR_IRIS_NO_CANONICAL_PROMOTION=PASS")
          PY
