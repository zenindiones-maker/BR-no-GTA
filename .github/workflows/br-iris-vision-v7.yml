name: BR Iris Vision Harness V7 (owned static browser proof)
on:
  push:
    branches:
      - work/br-iris-vision-harness-v7
      - work/br-harness-capability-utilization-v8
    paths:
      - "app/services/reverse_engineering_iris_v7_service.py"
      - "app/services/reverse_engineering_harness_service.py"
      - "app/services/global_capability_registry.py"
      - "integrations/iris/**"
      - "scripts/br_iris_visual_observe_v7.py"
      - "tests/test_reverse_engineering_iris_v7.py"
      - "tests/test_reverse_engineering_iris_harness_v7.py"
      - "app/services/harness_capability_utilization_v8.py"
      - "app/services/reverse_engineering_rea_evidence_v8.py"
      - "tests/test_reverse_engineering_rea_evidence_v8.py"
      - "scripts/br_harness_capability_audit_v8.py"
      - "tests/test_harness_capability_utilization_v8.py"
      - "docs/architecture/br-harness-utilization-v8.md"
      - ".github/workflows/br-iris-vision-v7.yml"
      - "docs/architecture/br-iris-vision-v7.md"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-iris-vision-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  camera:
    name: Pinned Iris + real Chromium camera + governed Harness
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test camera authority and static HTML controls
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest "python-dotenv==1.2.3"
          python -m pytest -q tests/test_reverse_engineering_iris_v7.py tests/test_reverse_engineering_iris_harness_v7.py tests/test_harness_capability_utilization_v8.py tests/test_reverse_engineering_rea_evidence_v8.py tests/test_global_capability_registry.py
      - name: Confirm runtime prerequisites
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "BR_IRIS_CHROME_AVAILABLE=PASS"
      - name: Install pinned upstream release with verified SHA-256
        env:
          BR_IRIS_INSTALL_PREFIX: ${{ runner.temp }}/br-iris-0.4.1
        run: |
          set -euo pipefail
          bash integrations/iris/install_pinned_iris.sh
          test "$("$BR_IRIS_INSTALL_PREFIX/iris" --version)" = "iris 0.4.1"
      - name: Real local HTML captures through persisted DeepSeek Harness authorization
        env:
          BR_IRIS_PINNED_BIN: ${{ runner.temp }}/br-iris-0.4.1/iris
          BR_TEST_DATABASE: ${{ runner.temp }}/br-iris-v7-auth.db
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/approved-iris-pages" "$RUNNER_TEMP/private-iris-shots"
          cat > "$RUNNER_TEMP/approved-iris-pages/owner-fixture.html" <<'HTML'
          <!doctype html>
          <html lang="pt">
          <head>
            <meta charset="utf-8">
            <style>
              html,body {margin:0;padding:0}
              body {background:linear-gradient(120deg,#071b28,#3b5a80);color:#fff;font-family:Arial,sans-serif}
              main {margin:40px;padding:30px;border-radius:24px;background:rgba(255,255,255,0.14)}
              h1 {font-size:36px;color:#79e3ef}
              p {font-size:21px;line-height:1.5}
            </style>
          </head>
          <body><main><h1 id="hero">BR NO GTA — IRIS</h1><p>Visual evidence belongs to Harness.</p></main></body>
          </html>
          HTML
          python - <<'PY'
          import os
          from pathlib import Path
          from app.database.schema import initialize_schema
          from app.services.harness_authorization_service import issue_harness_authorization
          from app.services.reverse_engineering_harness_service import IRIS_CAPABILITY_ID
          root=Path(os.environ["RUNNER_TEMP"])
          initialize_schema()
          a=issue_harness_authorization(
              authorized_action="RESEARCH",
              subject=f"capability:{IRIS_CAPABILITY_ID}",
              lineage={
                  "allowed_media_roots":[str(root/"approved-iris-pages")],
                  "allowed_vision_output_roots":[str(root/"private-iris-shots")],
              },
          )
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write(f"BR_IRIS_AUTH_ID={a.authorization_id}\n")
          print("BR_IRIS_HARNESS_AUTH_PERSISTED=PASS")
          PY
          export BR_IRIS_AUTH_ID="$(grep '^BR_IRIS_AUTH_ID=' "$GITHUB_ENV" | tail -n 1 | cut -d= -f2-)"
          test -n "$BR_IRIS_AUTH_ID"
          python scripts/br_iris_visual_observe_v7.py \
            --authorization-id "$BR_IRIS_AUTH_ID" \
            --input "$RUNNER_TEMP/approved-iris-pages/owner-fixture.html" \
            --output-image "$RUNNER_TEMP/private-iris-shots/desktop.png" \
            --output-receipt "$RUNNER_TEMP/private-iris-shots/desktop-receipt.json" \
            --viewport 960x600
          python scripts/br_iris_visual_observe_v7.py \
            --authorization-id "$BR_IRIS_AUTH_ID" \
            --input "$RUNNER_TEMP/approved-iris-pages/owner-fixture.html" \
            --output-image "$RUNNER_TEMP/private-iris-shots/mobile-hero.png" \
            --output-receipt "$RUNNER_TEMP/private-iris-shots/mobile-receipt.json" \
            --viewport 390x844 --selector h1
          python - <<'PY'
          import hashlib,json,os,stat
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"private-iris-shots"
          for label in ("desktop","mobile"):
              receipt=root/f"{label}-receipt.json"
              img=root/("desktop.png" if label=="desktop" else "mobile-hero.png")
              data=json.loads(receipt.read_text())["result"]
              proof=data["evidence"]
              magic=img.read_bytes()
              assert magic[:8]==b"\x89PNG\r\n\x1a\n"
              assert hashlib.sha256(magic).hexdigest()==proof["image_sha256"]
              assert (stat.S_IMODE(img.stat().st_mode)&0o077)==0
              assert data["status"]=="PRIVATE_VISUAL_CAPTURED"
              assert proof["iris_version"]=="iris 0.4.1"
              assert proof["image_width"]>20 and proof["image_height"]>10
              assert proof["live_website_capture"] is False
              assert proof["mcp_registered"] is False
              assert proof["artistic_quality_approved"] is False
              assert data["network_site_capture"]=="NOT_ATTEMPTED"
              assert data["publication"]=="FORBIDDEN"
              assert data["memory_write"]=="NOT_ATTEMPTED"
          print("BR_IRIS_REAL_CHROME_DESKTOP_AND_ELEMENT=PASS")
          print("BR_IRIS_NO_CANONICAL_PROMOTION=PASS")
          PY
      - name: Prove expanded Iris page and element modes on owned local static HTML
        env:
          BR_IRIS_PINNED_BIN: ${{ runner.temp }}/br-iris-0.4.1/iris
          BR_TEST_DATABASE: ${{ runner.temp }}/br-iris-v7-auth.db
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/approved-iris-pages/tall-fixture.html" <<'HTML'
          <!doctype html><html lang="pt"><head><meta charset="utf-8">
          <style>body{margin:0;background:#101726;color:white}
          main{min-height:1800px;padding:16px;background:linear-gradient(90deg,#101726,#204660)}
          h1{font-size:28px;padding:20px} p{font-size:18px}</style></head>
          <body><main><h1 id="hero">OWNED VISUAL RESEARCH</h1>
          <p>This local document is deliberately taller than the viewport.</p></main></body></html>
          HTML
          test -n "${BR_IRIS_AUTH_ID:-}"
          python scripts/br_iris_visual_observe_v7.py \
            --authorization-id "$BR_IRIS_AUTH_ID" \
            --input "$RUNNER_TEMP/approved-iris-pages/tall-fixture.html" \
            --output-image "$RUNNER_TEMP/private-iris-shots/full-dark.png" \
            --output-receipt "$RUNNER_TEMP/private-iris-shots/full-dark-receipt.json" \
            --viewport 960x600 --full-page --dark --wait-for '#hero'
          python scripts/br_iris_visual_observe_v7.py \
            --authorization-id "$BR_IRIS_AUTH_ID" \
            --input "$RUNNER_TEMP/approved-iris-pages/tall-fixture.html" \
            --output-image "$RUNNER_TEMP/private-iris-shots/padded-element.png" \
            --output-receipt "$RUNNER_TEMP/private-iris-shots/padded-element-receipt.json" \
            --viewport 390x844 --selector '#hero' --padding 24 --dark
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"private-iris-shots"
          full=json.loads((root/"full-dark-receipt.json").read_text())["result"]["evidence"]
          part=json.loads((root/"padded-element-receipt.json").read_text())["result"]["evidence"]
          assert full["capture_mode"]=="local_static_full_page"
          assert full["image_height"]>600
          assert full["dark"] is True
          assert full["wait_for_used"] is True
          assert part["capture_mode"]=="local_static_element"
          assert part["dark"] is True and part["padding"]==24
          for item in (full,part):
              assert item["live_website_capture"] is False
              assert item["mcp_registered"] is False
              assert item["publication"]=="FORBIDDEN"
          print("BR_IRIS_FULL_PAGE_DARK_WAIT_AND_PADDING=PASS")
          PY

  rea-catalog:
    name: Pinned REA doctor and Harness all-capabilities inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.11.0"
      - name: Install exact REA package and inspect available probes
        env:
          BR_REA_INSTALL_PREFIX: ${{ runner.temp }}/rea-install
        run: |
          set -euo pipefail
          bash integrations/rea_install_and_doctor.sh --install
          test -s "$BR_REA_INSTALL_PREFIX/rea-capabilities.json"
          test "$("$BR_REA_INSTALL_PREFIX/node_modules/.bin/rea" --version)" = "6.0.0"
      - name: Produce private honest inventory and deny false native/MCP PASS
        env:
          BR_REA_INSTALL_PREFIX: ${{ runner.temp }}/rea-install
        run: |
          set -euo pipefail
          python scripts/br_harness_capability_audit_v8.py \
            --rea-bin "$BR_REA_INSTALL_PREFIX/node_modules/.bin/rea" \
            --output "$RUNNER_TEMP/harness-utilization-v8.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"harness-utilization-v8.json"
          result=json.loads(p.read_text())
          rea=result["rea_discovery"]
          assert rea["rea_version"]=="6.0.0"
          assert rea["catalog"]["capabilities"]["readiness"]=="DISCOVERY_SUCCEEDED"
          assert rea["native_provider_ready"] is False
          assert rea["mcp_registration"]=="NOT_ATTEMPTED"
          assert result["registry_total"]>=7
          assert result["runtime_verified_count"]==0
          assert result["capability_autorouting_changed"] is False
          assert result["canonical_learning_changed"] is False
          print("BR_REA_REAL_CATALOG_PROBE=PASS")
          print("BR_HARNESS_ENTIRE_REGISTRY_INVENTORY=PASS")
          print("BR_REA_NATIVE_FALSE_PASS=BLOCKED")
          PY
      - name: Inspect real REA JavaScript Evidence envelope shape without leaking code
        env:
          BR_REA_INSTALL_PREFIX: ${{ runner.temp }}/rea-install
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea-owned-js"
          printf '{"name":"owned-research-fixture","version":"1.0.0","type":"module"}\n' > "$RUNNER_TEMP/rea-owned-js/package.json"
          printf 'export function safeCalc(x){return 2*x;}\n' > "$RUNNER_TEMP/rea-owned-js/index.js"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"rea-owned-js"
          binary=Path(os.environ["BR_REA_INSTALL_PREFIX"])/"node_modules/.bin/rea"
          process=subprocess.run(
              [str(binary),"analyze-javascript-application",str(p),"--json"],
              cwd=p,capture_output=True,text=True,timeout=120,check=False,
          )
          assert process.returncode==0,"REA_JS_FIXTURE_EXECUTION_FAILED"
          assert len(process.stdout)<=2_000_000
          evidence=json.loads(process.stdout)
          assert isinstance(evidence,dict)
          from app.services.reverse_engineering_rea_evidence_v8 import summarize_rea_javascript_envelope
          metrics=summarize_rea_javascript_envelope(evidence)
          assert metrics["status"]=="STRUCTURAL_METRICS_EXTRACTED"
          assert metrics["original_source_code_exposed"] is False
          assert metrics["native_provider_ready"] is False
          assert metrics["graph_entry_counts"]["inventory"].get("nodes",0)>=1
          print("BR_REA_SAFE_GRAPH_INSIGHT=PASS")
          def structure(obj, depth=0):
              if depth>2:return "<nested>"
              if isinstance(obj,dict):
                  return {str(k):structure(v,depth+1) for k,v in list(obj.items())[:30]}
              if isinstance(obj,list):
                  return {"type":"list","count":len(obj),
                          "first_shape":structure(obj[0],depth+1) if obj else None}
              return type(obj).__name__
          print("BR_REA_OWNED_JS_EVIDENCE_SCHEMA_SHAPE="+json.dumps(structure(evidence),sort_keys=True))
          print("BR_REA_REAL_SCOPED_JAVASCRIPT_INVESTIGATION=PASS")
          PY
