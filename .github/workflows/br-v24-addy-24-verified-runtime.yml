name: BR V24 Addy Existing 24 Skill Runtime

on:
  push:
    branches:
      - work/br-slm-agent-reconstruction-v24
    paths:
      - ".github/workflows/br-v24-addy-24-verified-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v24-addy-24-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-addy-24:
    name: 24 original Addy skills, pinned code, real loading, no fake SLM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: "1"
      GH_PROMOTION_DISABLED: "true"
    steps:
      - name: Exact first-party checkout with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare remote Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact current branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/br-slm-agent-reconstruction-v24"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "BR_TEST_DATABASE=$RUNNER_TEMP/br-v24-addy-runtime.sqlite3" >> "$GITHUB_ENV"
          python -m pip install -q --disable-pip-version-check -r requirements.txt pytest
      - name: Restore only the ORIGINAL Addy skill source at pinned SHA, not Codex/login
        shell: bash
        run: |
          set -euo pipefail
          export BR_AGENT_TOOLING_ROOT="$RUNNER_TEMP/br-agent-tooling"
          echo "BR_AGENT_TOOLING_ROOT=$BR_AGENT_TOOLING_ROOT" >> "$GITHUB_ENV"
          bash scripts/agent-tooling/bootstrap.sh addy
          test -d "$BR_AGENT_TOOLING_ROOT"
      - name: Certify real 24 skill files and canonical Registry assignments
        shell: bash
        run: |
          set -euo pipefail
          python scripts/agent-tooling/certify_addy_24.py --output "$RUNNER_TEMP/br-v24-addy-source.json"
          python -m pytest -q tests/test_addy_24_certification.py
      - name: Execute original pinned instruction resolver for all 24, no model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.services.addy_harness_service import resolve_pinned_addy_skill
          from app.services.global_capability_registry_base import ADDY_SKILLS
          from app.services.global_capability_registry import GLOBAL_CAPABILITY_REGISTRY
          for name in ADDY_SKILLS:
              row=GLOBAL_CAPABILITY_REGISTRY.get("addy:"+name)
              if not row or not row.execution_enabled:
                  raise SystemExit("BR_V24_ADDY_NOT_EXECUTABLE:"+name)
              text,src,digest=resolve_pinned_addy_skill(name)
              if not text or len(src)!=40 or len(digest)!=64:
                  raise SystemExit("BR_V24_ADDY_SOURCE_INVALID:"+name)
              print("BR_V24_ADDY_INSTRUCTION_RESOLVED="+name+":PASS")
          print("BR_V24_ADDY_PINNED_SKILL_RUNTIME=24_OF_24_PASS")
          print("BR_V24_ADDY_SLM_TURNS=NOT_ATTEMPTED")
          print("BR_V24_ADDY_NO_NEW_AGENTS=TRUE")
          PY
