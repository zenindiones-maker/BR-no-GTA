name: BR ArtCraft FilmCraft Real H264 AAC Stereo Export

on:
  push:
    branches:
      - work/br-artcraft-film-real-av-v1
    paths:
      - .github/workflows/br-artcraft-film-real-av.yml
      - scripts/artcraft_single_native_film_video.py

permissions:
  contents: read
  actions: read

concurrency:
  group: br-artcraft-filmcraft-real-av
  cancel-in-progress: false

jobs:
  real-video:
    name: Real FilmCraft binary muxes H264 plus AAC in offline sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout only trusted BR source (no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Download already verified exact-native FilmCraft CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p film-video-evidence
          gh run download 38014176264 -R "$GITHUB_REPOSITORY" \
            -n artcraft-real-native-filmcraft -D film-video-evidence
          python3 - <<'PY'
          import json,hashlib,hmac
          from pathlib import Path
          d=json.loads(Path("film-video-evidence/result.json").read_text())
          a=d["compiled_artifact"]
          binary=Path("film-video-evidence/filmcraft-cli")
          assert d["pinned_sha"]=="7b6c134472287db4367fca80bcb498240ba36567"
          for gate in ("build_status","tests_status","cli_status","cli_smoke_status"):
              assert d[gate]=="success",gate
          assert binary.is_file() and binary.stat().st_size==a["bytes"]
          h=hashlib.file_digest(binary.open("rb"),"sha256").hexdigest()
          assert hmac.compare_digest(h,a["sha256"])
          print("EXACT_FILMCRAFT_NATIVE_BINARY=PASS",h)
          PY
          chmod u+x film-video-evidence/filmcraft-cli
      - name: Build disposable system-only FFmpeg sandbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/film-real-video"
          cat > "$RUNNER_TEMP/film-real-video/Dockerfile" <<'DOCKERFILE'
          FROM python:3.12-slim-bookworm
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ffmpeg libasound2 libudev1 libx11-6 libxkbcommon0 libxcursor1 libxrandr2 libxi6 \
              libgl1 libwayland-client0 libfontconfig1 libfreetype6 libdbus-1-3 \
              libgtk-3-0 libvulkan1 && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker build -t artcraft-film-real-video:v1 \
            -f "$RUNNER_TEMP/film-real-video/Dockerfile" \
            "$RUNNER_TEMP/film-real-video"
          mkdir -p film-video-qa
          python3 -m py_compile scripts/artcraft_single_native_film_video.py
      - name: Execute actual FilmCraft MP4 export in no-network Docker
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --tmpfs /tmp:rw,nosuid,size=256m \
            --pids-limit 256 --memory 5g --cpus 2 \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/docs/research/artcraft-seven-pinned-sources.json:/manifest.json:ro" \
            -v "$PWD/film-video-evidence:/evidence:ro" \
            -v "$PWD/film-video-qa:/out:rw" \
            artcraft-film-real-video:v1 \
            python3 /scripts/artcraft_single_native_film_video.py \
              --manifest /manifest.json \
              --binary /evidence/filmcraft-cli \
              --build-receipt /evidence/result.json \
              --out /out --with-audio
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("film-video-qa/filmcraft-real-video-receipt.json").read_text())
          assert d["gate"]=="PASS" and d["native_executed"] is True
          assert d["production_approved"] is False
          assert d["video"]["codec"]=="h264"
          assert d["video"]["frames"]>=110
          assert d["audio"] == {"codec":"aac","sample_rate":48000,"channels":2}
          print("REAL_FILMCRAFT_VIDEO_AAC_FFMPEG_GATE=PASS",d["video"],d["audio"])
          PY
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --read-only --user "$(id -u):$(id -g)" \
            -v "$PWD/film-video-qa:/frames:ro" artcraft-film-real-video:v1 \
            ffmpeg -hide_banner -v error -nostdin -i /frames/real-filmcraft-five-seconds.mp4 \
              -map 0:a:0 -f null -
          echo "FILMCRAFT_TRUE_AAC_DECODE=PASS"
      - name: Upload native H264 AAC MP4 and decoded golden frame
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-filmcraft-real-five-second-h264-aac
          path: film-video-qa/
          if-no-files-found: warn
          retention-days: 30
