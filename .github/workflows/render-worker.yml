            runtime/render/input/**/narration-bundle/narration-observability.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload failure diagnostic JSONs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/render/validation-qa.json
