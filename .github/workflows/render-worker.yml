          path: runtime/render/brand-audio-checkpoint/
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate narration operational observability
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from app.services.operational_efficiency_policy import validate_observability_event
          files=list(Path('runtime/render/input').glob('**/narration-bundle/narration-observability.json'))
          if not files:
              print('NARRATION_OBSERVABILITY=NOT_APPLICABLE')
              raise SystemExit(0)
          event=json.loads(files[0].read_text(encoding='utf-8'))
          validate_observability_event(event)
          print('NARRATION_OBSERVABILITY=PASS')
          print('NARRATION_STAGE_ELAPSED=' + json.dumps(event.get('stage_elapsed') or {}, sort_keys=True))
          print(f"CACHE_HIT={event.get('cache_hit')}")
          print(f"CACHE_MISS={event.get('cache_miss')}")
          print(f"RETRY_COUNT={event.get('retry_count')}")
          print(f"EXTERNAL_CALLS={event.get('external_calls')}")
          print(f"REUSED_ARTIFACTS={len(event.get('reused_artifacts') or [])}")
          PY

      - name: Checkpoint QA-passed narration artifact
        if: inputs.narration_artifact_id == ''
        id: narration_checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: narration-bundle-${{ inputs.execution_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/render/narration-checkpoint/
          if-no-files-found: ignore
          retention-days: 30

      - name: Validate prepared media checkpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from app.services.media_checkpoint_service import validate_media_checkpoint
          job=json.loads(Path('runtime/render/render-job.json').read_text(encoding='utf-8'))
          roots=list(Path('runtime/render/input').glob('**/media-checkpoint/media-checkpoint-manifest.json'))
          if not roots:
              print('MEDIA_CHECKPOINT=NOT_APPLICABLE')
              raise SystemExit(0)
          checkpoint=roots[0].parent
          manifest=validate_media_checkpoint(checkpoint_root=checkpoint,job=job)
          target=Path('runtime/render/media-checkpoint')
          if target.exists():
              import shutil; shutil.rmtree(target)
          import shutil; shutil.copytree(checkpoint,target)
          print('MEDIA_CHECKPOINT=PASS')
          print('MEDIA_CHECKPOINT_CONTENT_HASH='+manifest['content_hash'])
          print('MEDIA_CHECKPOINT_ASSET_COUNT='+str(len(manifest['assets'])))
          PY

      - name: Checkpoint QA-passed media artifact
        if: inputs.media_artifact_id == ''
        id: media_checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: media-checkpoint-${{ inputs.execution_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/render/media-checkpoint/
          if-no-files-found: ignore
          retention-days: 30

      - name: Report immutable checkpoint reuse
        if: inputs.narration_artifact_id != '' || inputs.media_artifact_id != ''
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.narration_artifact_id }}" ]; then
            echo "NARRATION_CHECKPOINT_REUSED=YES"
            echo "REDUNDANT_NARRATION_ARTIFACT_UPLOADS=0"
          fi
          if [ -n "${{ inputs.media_artifact_id }}" ]; then
            echo "MEDIA_CHECKPOINT_REUSED=YES"
            echo "REDUNDANT_MEDIA_ARTIFACT_UPLOADS=0"
            echo "REDUNDANT_MEDIA_DOWNLOADS=0"
          fi

      - name: Start canonical render performance clock
        run: python scripts/render_pipeline_stage_clock.py start editplan_vedit_ffmpeg --path runtime/render/pipeline-stage-clock.json

      - name: Build EditPlan and Render Video
        env:
