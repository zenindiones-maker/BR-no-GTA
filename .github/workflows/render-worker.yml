name: Render Worker
run-name: Render Worker · ${{ inputs.execution_id }}

on:
  workflow_dispatch:
    inputs:
      render_job:
        description: "RenderJob completo autorizado pelo Harness (#2/#4); use vazio quando render_job_descriptor for usado"
        required: false
        default: ""
        type: string
      render_job_descriptor:
        description: "Descriptor pequeno render-job-handoff/v1 para transporte governado por artifact"
        required: false
        default: ""
        type: string
      brain_decision_id:
        required: true
        type: string
      execution_id:
        required: true
        type: string
      authorized_action:
        required: true
        type: string
      narration_artifact_id:
        description: "Optional QA-passed narration checkpoint artifact ID for render retry"
        required: false
        default: ""
        type: string
      narration_producer_run_id:
        description: "Producer workflow run ID for narration_artifact_id"
        required: false
        default: ""
        type: string
      media_artifact_id:
        description: "Optional QA-passed media checkpoint artifact ID for render retry"
        required: false
        default: ""
        type: string
      media_producer_run_id:
        description: "Producer workflow run ID for media_artifact_id"
        required: false
        default: ""
        type: string
      brand_audio_artifact_id:
        description: "Optional QA-passed spoken brand audio checkpoint artifact ID"
        required: false
        default: ""
        type: string
      brand_audio_producer_run_id:
        description: "Producer workflow run ID for brand_audio_artifact_id"
        required: false
        default: ""
        type: string
      post_branding_artifact_id:
        description: "Optional proven failed-render artifact containing already rendered and branded MP4 for final-QA-only resume"
        required: false
        default: ""
        type: string
      post_branding_producer_run_id:
        description: "Producer Render Worker run ID for post_branding_artifact_id"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audiovisual:
    if: inputs.post_branding_artifact_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONPATH: video-engine/backend:.
      BR_PERFORMANCE_TRACE_FILE: runtime/render/performance-trace.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve RenderJob transport
        id: render_transport
        env:
          RENDER_JOB: ${{ inputs.render_job }}
          RENDER_JOB_DESCRIPTOR: ${{ inputs.render_job_descriptor }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from app.services.render_job_handoff_service import (
              RenderJobHandoffError,
              validate_artifact_descriptor,
          )

          inline = (os.environ.get("RENDER_JOB") or "").strip()
          descriptor_text = (os.environ.get("RENDER_JOB_DESCRIPTOR") or "").strip()
          if bool(inline) == bool(descriptor_text):
              raise SystemExit("exactly one RenderJob transport must be supplied")
          output = Path(os.environ["GITHUB_OUTPUT"])
          if inline:
              with output.open("a", encoding="utf-8") as stream:
                  stream.write("mode=inline\n")
              print("RENDER_JOB_TRANSPORT_MODE=inline")
          else:
              try:
                  descriptor = json.loads(descriptor_text)
                  validate_artifact_descriptor(descriptor)
              except (json.JSONDecodeError, RenderJobHandoffError) as exc:
                  raise SystemExit(str(exc)) from None
              artifact_name = descriptor["artifact_name"]
              if not re.fullmatch(r"[A-Za-z0-9_.-]{1,128}", artifact_name):
                  raise SystemExit("RenderJob handoff artifact_name is unsafe")
              with output.open("a", encoding="utf-8") as stream:
                  stream.write("mode=artifact\n")
                  stream.write(f"artifact_id={descriptor['artifact_id']}\n")
                  stream.write(f"artifact_name={artifact_name}\n")
                  stream.write(f"producer_run_id={descriptor['producer_run_id']}\n")
                  stream.write(f"source_sha={descriptor['source_sha']}\n")
              print("RENDER_JOB_TRANSPORT_MODE=artifact")
          PY

      - name: Pin artifact-backed source revision
        if: steps.render_transport.outputs.mode == 'artifact'
        env:
          SOURCE_SHA: ${{ steps.render_transport.outputs.source_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          value=os.environ.get("SOURCE_SHA","")
          if not re.fullmatch(r"[0-9a-f]{40}", value):
              raise SystemExit("RENDER_SOURCE_SHA_PIN=FAIL")
          PY
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "RENDER_SOURCE_SHA_PIN=PASS"

      - name: Verify RenderJob handoff artifact metadata
        if: steps.render_transport.outputs.mode == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.render_transport.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.render_transport.outputs.artifact_name }}
          PRODUCER_RUN_ID: ${{ steps.render_transport.outputs.producer_run_id }}
        run: |
          set -euo pipefail
          mkdir -p runtime/render/handoff
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > runtime/render/handoff/artifact-metadata.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = json.loads(Path("runtime/render/handoff/artifact-metadata.json").read_text(encoding="utf-8"))
          if str(metadata.get("id")) != os.environ["ARTIFACT_ID"]:
              raise SystemExit("RenderJob handoff artifact id mismatch")
          if metadata.get("name") != os.environ["ARTIFACT_NAME"]:
              raise SystemExit("RenderJob handoff artifact name mismatch")
          if metadata.get("expired") is True:
              raise SystemExit("RenderJob handoff artifact expired")
          workflow_run = metadata.get("workflow_run") or {}
          if str(workflow_run.get("id")) != os.environ["PRODUCER_RUN_ID"]:
              raise SystemExit("RenderJob handoff producer run mismatch")
          print("RENDER_JOB_ARTIFACT_METADATA=PASS")
          PY

      - name: Materialize artifact-backed RenderJob
        if: steps.render_transport.outputs.mode == 'artifact'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.render_transport.outputs.artifact_id }}
          run-id: ${{ steps.render_transport.outputs.producer_run_id }}
          github-token: ${{ github.token }}
          path: runtime/render/handoff
          merge-multiple: true

      - name: Restore versioned render Python runtime
        id: render_python_runtime
        uses: actions/cache@v4
        with:
          path: .venv-media
          key: render-media-venv-v2-${{ runner.os }}-${{ runner.arch }}-py312-yt2026.8.19-bgutil1.3.1-edge7.2.8-fw1.2.0-${{ hashFiles('requirements.txt', 'requirements/**/*.txt', 'pyproject.toml') }}

      - name: Build or validate versioned render Python runtime
        env:
          RENDER_RUNTIME_CACHE_HIT: ${{ steps.render_python_runtime.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$RENDER_RUNTIME_CACHE_HIT" != "true" ]; then
            rm -rf .venv-media
            python -m venv .venv-media
            .venv-media/bin/python -m pip install --upgrade pip
            .venv-media/bin/python -m pip install \
              -r requirements.txt \
              pytest \
              "yt-dlp[default]==2026.8.19" \
              "bgutil-ytdlp-pot-provider==1.3.1" \
              "edge-tts==7.2.8" \
              "faster-whisper==1.2.0"
          fi
          .venv-media/bin/python - <<'PY'
          import importlib.metadata
          import sys
          expected={
              "yt-dlp":"2026.8.19",
              "bgutil-ytdlp-pot-provider":"1.3.1",
              "edge-tts":"7.2.8",
              "faster-whisper":"1.2.0",
          }
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"PYTHON_VERSION_MISMATCH:{sys.version}")
          for package,version in expected.items():
              actual=importlib.metadata.version(package)
              if actual != version:
                  raise SystemExit(f"RUNTIME_VERSION_MISMATCH:{package}:{actual}!={version}")
          print("RENDER_PYTHON_RUNTIME_CONTRACT=PASS")
          PY
          echo "$PWD/.venv-media/bin" >> "$GITHUB_PATH"
          echo "COLD_START_PYTHON_DEPENDENCY_PROFILE=versioned-venv-cache-v2"
          echo "RENDER_PYTHON_RUNTIME_CACHE_HIT=$RENDER_RUNTIME_CACHE_HIT"
      - name: Validate job before media processing
        env:
          RENDER_JOB: ${{ inputs.render_job }}
          RENDER_JOB_DESCRIPTOR: ${{ inputs.render_job_descriptor }}
          EXPECTED_BRAIN_DECISION_ID: ${{ inputs.brain_decision_id }}
          EXPECTED_EXECUTION_ID: ${{ inputs.execution_id }}
          EXPECTED_AUTHORIZED_ACTION: ${{ inputs.authorized_action }}
          EXPECTED_SOURCE_SHA: ${{ steps.render_transport.outputs.source_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from app.services.render_job_handoff_service import RenderJobHandoffError, resolve_render_job
          from app.workers.audiovisual_worker import WorkerError, validate_job
          from app.workers.professional_audiovisual_worker import validate_product_job

          failure_path = Path("runtime/render/validation-qa.json")
          failure_path.parent.mkdir(parents=True, exist_ok=True)
          try:
              descriptor_text = (os.environ.get("RENDER_JOB_DESCRIPTOR") or "").strip()
              artifact_root = Path("runtime/render/handoff") if descriptor_text else None
              job, transport_mode = resolve_render_job(
                  inline_json=os.environ.get("RENDER_JOB"),
                  descriptor_json=descriptor_text,
                  artifact_root=artifact_root,
                  expected_brain_decision_id=os.environ["EXPECTED_BRAIN_DECISION_ID"],
                  expected_execution_id=os.environ["EXPECTED_EXECUTION_ID"],
                  expected_authorized_action=os.environ["EXPECTED_AUTHORIZED_ACTION"],
                  expected_source_sha=(os.environ.get("EXPECTED_SOURCE_SHA") or None) if descriptor_text else None,
              )
              if job.get("product_profile") == "professional_ptbr_v1":
                  validate_product_job(job)
              else:
                  validate_job(job, allow_runtime_plan=True)
          except (RenderJobHandoffError, WorkerError) as exc:
              failure_path.write_text(json.dumps({"status": "FAIL", "stage": "validation", "reason": str(exc)}))
              raise SystemExit(str(exc)) from None
          except Exception as exc:
              failure_path.write_text(json.dumps({"status": "FAIL", "stage": "validation", "reason": str(exc)[:500]}))
              raise

          path = Path("runtime/render/render-job.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(job, ensure_ascii=False, allow_nan=False), encoding="utf-8")
          (Path("runtime/render/render-job-transport.json")).write_text(
              json.dumps({
                  "status": "PASS",
                  "transport_mode": transport_mode,
                  "render_job_id": job.get("render_job_id"),
                  "video_id": job.get("video_id"),
                  "execution_id": job.get("execution_id"),
                  "source_sha": (os.environ.get("EXPECTED_SOURCE_SHA") or os.environ["GITHUB_SHA"]),
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"RENDER_JOB_TRANSPORT_MODE={transport_mode}")
          print("RENDER_JOB_ARTIFACT_INTEGRITY=PASS" if transport_mode == "artifact" else "RENDER_JOB_INLINE_INTEGRITY=PASS")
          PY
      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Validate vendored execution adapter
        run: |
          set -euo pipefail
          git ls-files --error-unmatch video-engine/backend/vedit/render.py
          python -m unittest discover -s tests -p test_cloud_audiovisual_worker.py -v
          python -m unittest discover -s tests -p test_professional_audiovisual_worker.py -v
          python -m pytest -q tests/test_semantic_ptbr_audio_qa.py tests/test_render_progress_observability.py
          python -m pytest -q \
            tests/test_narration_pipeline.py \
            tests/test_pronunciation_service.py \
            tests/test_operational_efficiency_policy.py \
            tests/test_operational_efficiency_history.py \
            tests/test_media_checkpoint_service.py \
            tests/test_channel_spoken_branding.py \
            tests/test_run001_longform_editorial_controller.py
      - name: Setup ingestion JavaScript runtime
        if: inputs.media_artifact_id == ''
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate pinned ingestion narration and spoken-language QA adapters
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.metadata
          expected={
              "yt-dlp":"2026.8.19",
              "bgutil-ytdlp-pot-provider":"1.3.1",
              "edge-tts":"7.2.8",
              "faster-whisper":"1.2.0",
          }
          for package,version in expected.items():
              actual=importlib.metadata.version(package)
              if actual!=version:
                  raise SystemExit(f"RUNTIME_VERSION_MISMATCH:{package}:{actual}!={version}")
          print("PINNED_MEDIA_RUNTIME=PASS")
          PY

      - name: Setup YouTube PO Token provider
        if: inputs.media_artifact_id == ''
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git runtime/bgutil-ytdlp-pot-provider
          cd runtime/bgutil-ytdlp-pot-provider/server
          deno install --allow-scripts=npm:canvas --frozen
          cd node_modules
          export DENO_NO_PROMPT=1
          nohup deno run --no-prompt --allow-env --allow-net --allow-ffi=. --allow-read=. ../src/main.ts --port 4416 > ../provider.log 2>&1 &
          echo $! > ../provider.pid
          sleep 5
          if ! kill -0 "$(cat ../provider.pid)" 2>/dev/null; then
            echo "PO Token provider failed to start"
            cat ../provider.log
            exit 1
          fi
          echo "PO Token provider running on 127.0.0.1:4416"

      - name: Prepare YouTube cookies
        if: inputs.media_artifact_id == ''
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES"
          mkdir -p runtime/secrets
          printf '%s' "$YOUTUBE_COOKIES" > runtime/secrets/youtube-cookies.txt
          chmod 600 runtime/secrets/youtube-cookies.txt

      - name: Materialize governed Telegram brand assets in cloud
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          python -m app.workers.brand_asset_worker prepare \
            --render-job runtime/render/render-job.json \
            --runtime-root runtime/render

      - name: Restore content-addressed narration cache
        if: inputs.narration_artifact_id == ''
        uses: actions/cache@v4
        with:
          path: runtime/narration-cache
          key: narration-v2-${{ runner.os }}-edge-tts-7.2.8
          restore-keys: |
            narration-v2-${{ runner.os }}-edge-tts-

      - name: Restore content-addressed spoken brand audio cache
        uses: actions/cache@v4
        with:
          path: runtime/brand-audio-cache
          key: brand-audio-v3-${{ runner.os }}-edge-tts-7.2.8
          restore-keys: |
            brand-audio-v3-${{ runner.os }}-edge-tts-

      - name: Validate optional narration checkpoint reference
        env:
          NARRATION_ARTIFACT_ID: ${{ inputs.narration_artifact_id }}
          NARRATION_PRODUCER_RUN_ID: ${{ inputs.narration_producer_run_id }}
        run: |
          set -euo pipefail
          if { [ -n "$NARRATION_ARTIFACT_ID" ] && [ -z "$NARRATION_PRODUCER_RUN_ID" ]; } || \
             { [ -z "$NARRATION_ARTIFACT_ID" ] && [ -n "$NARRATION_PRODUCER_RUN_ID" ]; }; then
            echo "narration checkpoint requires both artifact id and producer run id" >&2
            exit 1
          fi
          echo "NARRATION_CHECKPOINT_REFERENCE=PASS"

      - name: Download QA-passed narration checkpoint for render retry
        if: inputs.narration_artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.narration_artifact_id }}
          run-id: ${{ inputs.narration_producer_run_id }}
          github-token: ${{ github.token }}
          path: runtime/render/reused-narration
          merge-multiple: true

      - name: Validate optional media checkpoint reference
        env:
          MEDIA_ARTIFACT_ID: ${{ inputs.media_artifact_id }}
          MEDIA_PRODUCER_RUN_ID: ${{ inputs.media_producer_run_id }}
        run: |
          set -euo pipefail
          if { [ -n "$MEDIA_ARTIFACT_ID" ] && [ -z "$MEDIA_PRODUCER_RUN_ID" ]; } || \
             { [ -z "$MEDIA_ARTIFACT_ID" ] && [ -n "$MEDIA_PRODUCER_RUN_ID" ]; }; then
            echo "media checkpoint requires both artifact id and producer run id" >&2
            exit 1
          fi
          echo "MEDIA_CHECKPOINT_REFERENCE=PASS"

      - name: Download QA-passed media checkpoint for render retry
        if: inputs.media_artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.media_artifact_id }}
          run-id: ${{ inputs.media_producer_run_id }}
          github-token: ${{ github.token }}
          path: runtime/render/reused-media
          merge-multiple: true

      - name: Validate optional spoken brand audio checkpoint reference
        env:
          BRAND_AUDIO_ARTIFACT_ID: ${{ inputs.brand_audio_artifact_id }}
          BRAND_AUDIO_PRODUCER_RUN_ID: ${{ inputs.brand_audio_producer_run_id }}
        run: |
          set -euo pipefail
          if { [ -n "$BRAND_AUDIO_ARTIFACT_ID" ] && [ -z "$BRAND_AUDIO_PRODUCER_RUN_ID" ]; } || \
             { [ -z "$BRAND_AUDIO_ARTIFACT_ID" ] && [ -n "$BRAND_AUDIO_PRODUCER_RUN_ID" ]; }; then
            echo "spoken brand audio checkpoint requires both artifact id and producer run id" >&2
            exit 1
          fi
          echo "BRAND_AUDIO_CHECKPOINT_REFERENCE=PASS"

      - name: Download QA-passed spoken brand audio checkpoint for render retry
        if: inputs.brand_audio_artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.brand_audio_artifact_id }}
          run-id: ${{ inputs.brand_audio_producer_run_id }}
          github-token: ${{ github.token }}
          path: runtime/render/reused-brand-audio
          merge-multiple: true

      - name: Start preparation performance clock
        run: python scripts/render_pipeline_stage_clock.py start preparation_wall --path runtime/render/pipeline-stage-clock.json

      - name: Prepare Narration and Media in parallel
        env:
          YTDLP_COOKIES_FILE: runtime/secrets/youtube-cookies.txt
          YTDLP_PO_TOKEN_BASE_URL: http://127.0.0.1:4416
          NARRATION_CONCURRENCY: "4"
          BRAND_AUDIO_CACHE_ROOT: runtime/brand-audio-cache
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json
          from pathlib import Path
          job = json.loads(Path('runtime/render/render-job.json').read_text(encoding='utf-8'))
          raise SystemExit(0 if job.get('product_profile') == 'professional_ptbr_v1' else 1)
          PY
          then
            reuse_narration=()
            reuse_media=()
            reuse_brand_audio=()
            if [ -f runtime/render/reused-narration/narration-manifest.json ]; then
              reuse_narration=(--reuse-narration-dir runtime/render/reused-narration)
            fi
            if [ -f runtime/render/reused-media/media-checkpoint-manifest.json ]; then
              reuse_media=(--reuse-media-dir runtime/render/reused-media)
            fi
            if [ -f runtime/render/reused-brand-audio/brand-audio-manifest.json ]; then
              reuse_brand_audio=(--reuse-brand-audio-dir runtime/render/reused-brand-audio)
            fi
            python scripts/prepare_professional_inputs.py \
              --render-job runtime/render/render-job.json \
              --asset-root runtime/render/input \
              --cache-root runtime/narration-cache \
              "${reuse_narration[@]}" "${reuse_media[@]}" "${reuse_brand_audio[@]}"
          else
            echo "NARRATION_STAGE=NOT_APPLICABLE"
          fi

      - name: Finish preparation performance clock
        if: always()
        run: python scripts/render_pipeline_stage_clock.py end preparation_wall --path runtime/render/pipeline-stage-clock.json

      - name: Calibrate Voice
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('runtime/render/input').glob('**/narration-bundle/narration-qa.json'))
          if not files:
              print('CALIBRATE_VOICE=NOT_APPLICABLE')
              raise SystemExit(0)
          qa=json.loads(files[0].read_text(encoding='utf-8'))
          calibration=qa.get('calibration') or {}
          if qa.get('status') != 'PASS' or qa.get('full_script_calibration_regeneration_count') != 0:
              raise SystemExit('CALIBRATE_VOICE=FAIL')
          print('CALIBRATE_VOICE=PASS')
          print('VOICE_CALIBRATION_SOURCE=' + str(calibration.get('source')))
          print('FULL_SCRIPT_CALIBRATION_REGENERATION=0')
          PY

      - name: Synthesize Segments
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('runtime/render/input').glob('**/narration-bundle/narration-qa.json'))
          if not files:
              print('SYNTHESIZE_SEGMENTS=NOT_APPLICABLE')
              raise SystemExit(0)
          qa=json.loads(files[0].read_text(encoding='utf-8'))
          stats=qa.get('stats') or {}
          if qa.get('status') != 'PASS' or stats.get('failed_segments'):
              raise SystemExit('SYNTHESIZE_SEGMENTS=FAIL')
          print('SYNTHESIZE_SEGMENTS=PASS')
          print(f"PHYSICAL_SEGMENTS={qa.get('physical_segment_count')}")
          print(f"CACHE_HITS={stats.get('cache_hits')}")
          print(f"CACHE_MISSES={stats.get('cache_misses')}")
          print(f"RETRIES={stats.get('retries')}")
          PY

      - name: Assemble Master Narration
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('runtime/render/input').glob('**/narration-bundle/narration-qa.json'))
          if not files:
              print('ASSEMBLE_MASTER=NOT_APPLICABLE')
              raise SystemExit(0)
          qa=json.loads(files[0].read_text(encoding='utf-8'))
          stats=qa.get('stats') or {}
          if qa.get('status') != 'PASS' or stats.get('master_normalization_count') != 1:
              raise SystemExit('ASSEMBLE_MASTER=FAIL')
          print('ASSEMBLE_MASTER=PASS')
          print('MASTER_NORMALIZATION_ONCE=PASS')
          PY

      - name: Narration QA
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          files=list(Path('runtime/render/input').glob('**/narration-bundle/narration-qa.json'))
          if not files:
              print('NARRATION_QA=NOT_APPLICABLE')
              raise SystemExit(0)
          bundle=files[0].parent
          qa=json.loads(files[0].read_text(encoding='utf-8'))
          if qa.get('status') != 'PASS':
              raise SystemExit('NARRATION_QA=FAIL')
          checkpoint=Path('runtime/render/narration-checkpoint')
          if checkpoint.exists():
              shutil.rmtree(checkpoint)
          shutil.copytree(bundle, checkpoint)
          print('NARRATION_QA=PASS')
          print(f"NARRATION_MASTER_DURATION={qa.get('duration_seconds')}")
          print(f"NARRATION_WPM={qa.get('words_per_minute')}")
          print(f"NATIVE_TIMING_USED={qa.get('native_timing_used')}")
          PY

      - name: Validate spoken brand audio checkpoint
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('runtime/render/input').glob('**/brand-audio-bundle/brand-audio-manifest.json'))
          if not files:
              print('BRAND_AUDIO_QA=NOT_APPLICABLE')
              raise SystemExit(0)
          manifest=json.loads(files[0].read_text(encoding='utf-8'))
          checks=manifest.get('checks') or {}
          required=(
              'voice_b_used','opening_text_canonical','closing_text_canonical',
              'single_production_opening_take','single_approved_closing_asset',
              'brand_audio_cache_policy','canonical_text_preserved',
              'language_spans_valid','vice_city_language_resolution',
              'selected_opening_is_human_approved_fluid2',
              'approved_closing_reused_without_tts',
          )
          if manifest.get('status')!='PASS' or not all(checks.get(k) is True for k in required):
              raise SystemExit('BRAND_AUDIO_QA=FAIL')
          target=Path('runtime/render/brand-audio-checkpoint')
          if target.exists():
              import shutil; shutil.rmtree(target)
          import shutil; shutil.copytree(files[0].parent,target)
          print('BRAND_AUDIO_QA=PASS')
          print('VOICE_B_USED=PASS')
          print('OPENING_TEXT_CANONICAL=PASS')
          print('CLOSING_TEXT_CANONICAL=PASS')
          print('BRAND_AUDIO_CACHE_POLICY=PASS')
          print('CANONICAL_TEXT_PRESERVED=PASS')
          print('LANGUAGE_SPANS_VALID=PASS')
          print('VICE_CITY_LANGUAGE_RESOLUTION=PASS')
          print('FLUID2_ONLY_RUNTIME=PASS')
          print('APPROVED_G_CLOSING_REUSED=PASS')
          print('REDUNDANT_BRAND_TTS_REMOVED=PASS')
          PY

      - name: Checkpoint QA-passed spoken brand audio artifact
        id: brand_audio_checkpoint
