            runtime/render/output/**/render-progress.json
            runtime/render/output/**/render-runtime.json
            runtime/render/output/**/editorial-qa.json
            runtime/render/output/**/voice-qa.json
            runtime/render/input/**/professional-inputs.json
            runtime/render/input/**/narration-bundle/*.json
