            runtime/render/brand-audio-checkpoint/**
            runtime/render/input/**/brand-audio-bundle/*.json
            runtime/render/output/**/narration-manifest.json
            runtime/render/output/**/speech-timing.json
            runtime/render/output/**/voice-speed-profile.json
            runtime/render/output/**/narration-qa.json
            runtime/render/output/**/narration-learning-evidence.json
            runtime/render/output/**/semantic-ptbr-audio-qa.json
            runtime/render/output/**/edit-qa.json
