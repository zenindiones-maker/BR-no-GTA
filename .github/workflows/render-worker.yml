name: Render Worker

on:
  workflow_dispatch:
    inputs:
      render_job:
        description: "Render Job autorizado pelo DeepSeek Harness"
        required: true
        type: string
      brain_decision_id:
        description: "ID da decisão do Brain"
        required: true
        type: string
      execution_id:
        description: "ID da execução"
        required: true
        type: string
      authorized_action:
        description: "Ação autorizada"
        required: true
        type: string

jobs:
  audiovisual:
    name: Audiovisual Worker
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout BR-no-GTA
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate authorization
        env:
          AUTHORIZED_ACTION: ${{ inputs.authorized_action }}
        run: |
          test "$AUTHORIZED_ACTION" = "EXECUTION"

      - name: Write Render Job
        env:
          RENDER_JOB: ${{ inputs.render_job }}
        run: |
          mkdir -p runtime/render
          printf '%s' "$RENDER_JOB" > runtime/render/render-job.json

      - name: Validate Render Job
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("runtime/render/render-job.json")
          job = json.loads(path.read_text(encoding="utf-8"))

          required = (
              "content_item_id",
              "script_id",
              "idea_id",
              "objective",
              "estimated_duration_seconds",
              "scenes",
              "brain_decision_id",
              "execution_id",
              "authorized_action",
          )

          missing = [field for field in required if field not in job]
          if missing:
              raise SystemExit(
                  f"Render Job incompleto. Campos ausentes: {missing}"
              )

          if job["authorized_action"] != "EXECUTION":
              raise SystemExit("Execução não autorizada.")

          if not job["scenes"]:
              raise SystemExit("Render Job sem cenas.")

          print("Render Job autorizado e válido.")
          print(f"execution_id={job['execution_id']}")
          print(f"brain_decision_id={job['brain_decision_id']}")
          print(f"scenes={len(job['scenes'])}")
          PY

      - name: Prepare audiovisual workspace
        run: |
          mkdir -p runtime/render/input
          mkdir -p runtime/render/output
          mkdir -p runtime/render/work

      - name: Execute audiovisual worker
        env:
          RENDER_JOB_PATH: runtime/render/render-job.json
        run: |
          python -m app.workers.audiovisual_worker \
            --render-job "$RENDER_JOB_PATH" \
            --output-dir runtime/render/output

      - name: Validate master video
        run: |
          VIDEO_PATH="runtime/render/output/master_50min.mp4"

          test -f "$VIDEO_PATH"
          test -s "$VIDEO_PATH"

          ffprobe \
            -v error \
            -show_entries stream=codec_type \
            -show_entries format=duration \
            -of json \
            "$VIDEO_PATH" \
            > runtime/render/video-probe.json

      - name: Write render manifest
        env:
          BRAIN_DECISION_ID: ${{ inputs.brain_decision_id }}
          EXECUTION_ID: ${{ inputs.execution_id }}
          AUTHORIZED_ACTION: ${{ inputs.authorized_action }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("runtime/render/output/master_50min.mp4")
          probe = json.loads(
              Path("runtime/render/video-probe.json").read_text(
                  encoding="utf-8"
              )
          )

          duration = float(
              probe["format"]["duration"]
          )

          manifest = {
              "schema_version": "1",
              "artifact_type": "audiovisual-render",
              "filename": output.name,
              "size_bytes": output.stat().st_size,
              "duration_seconds": duration,
              "brain_decision_id": os.environ["BRAIN_DECISION_ID"],
              "execution_id": os.environ["EXECUTION_ID"],
              "authorized_action": os.environ["AUTHORIZED_ACTION"],
          }

          Path("runtime/render/render-manifest.json").write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: render-output
          path: |
            runtime/render/output/master_50min.mp4
            runtime/render/video-probe.json
            runtime/render/render-manifest.json
            runtime/render/render-job.json
          if-no-files-found: error
          retention-days: 3
