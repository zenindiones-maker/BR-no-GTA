      - name: Upload compact render performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-performance-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime/render/pipeline-stage-clock.json
