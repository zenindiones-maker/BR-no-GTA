              --render-job runtime/render/render-job.json \
              --asset-root runtime/render/input \
              --output-dir runtime/render/output
          fi

      - name: Finish canonical render performance clock
        if: always()
        run: python scripts/render_pipeline_stage_clock.py end editplan_vedit_ffmpeg --path runtime/render/pipeline-stage-clock.json

      - name: Validate render operational observability
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from app.services.operational_efficiency_policy import validate_observability_event
          files=list(Path('runtime/render/output').glob('**/operation-observability.json'))
          if not files:
              raise SystemExit('RENDER_OBSERVABILITY=MISSING')
          event=json.loads(files[0].read_text(encoding='utf-8'))
          validate_observability_event(event)
          if event.get('policy_id')!='br-no-gta.operational-efficiency':
              raise SystemExit('RENDER_OBSERVABILITY_POLICY_MISMATCH')
          print('RENDER_OBSERVABILITY=PASS')
          print('RENDER_STAGE_ELAPSED=' + json.dumps(event.get('stage_elapsed') or {}, sort_keys=True))
          print(f"CACHE_HIT={event.get('cache_hit')}")
          print(f"CACHE_MISS={event.get('cache_miss')}")
          print(f"RETRY_COUNT={event.get('retry_count')}")
          print(f"EXTERNAL_CALLS={event.get('external_calls')}")
          print(f"REUSED_ARTIFACTS={len(event.get('reused_artifacts') or [])}")
          print(f"OUTPUT_ARTIFACT={event.get('output_artifact')}")
          runtime_files=list(Path('runtime/render/output').glob('**/render-runtime.json'))
          if not runtime_files:
              raise SystemExit('RENDER_PROGRESS_OBSERVABILITY=MISSING_RUNTIME')
          runtime=json.loads(runtime_files[0].read_text(encoding='utf-8'))
          progress=runtime.get('progress_observability') or {}
          if progress.get('contract')!='render-progress/v2':
              raise SystemExit('RENDER_PROGRESS_OBSERVABILITY=CONTRACT_MISMATCH')
          if int(progress.get('heartbeat_count') or 0) < 1:
              raise SystemExit('RENDER_PROGRESS_OBSERVABILITY=NO_HEARTBEAT')
          if progress.get('actionable_eta') is not True:
              raise SystemExit('RENDER_PROGRESS_OBSERVABILITY=NO_ETA')
          if float(progress.get('stall_warning_seconds') or 0) <= 0:
              raise SystemExit('RENDER_PROGRESS_OBSERVABILITY=NO_STALL_THRESHOLD')
          print('RENDER_PROGRESS_OBSERVABILITY=PASS')
          print('RENDER_HEARTBEAT_COUNT=' + str(progress.get('heartbeat_count')))
          print('RENDER_MAX_STALL_SECONDS=' + str(progress.get('max_stall_seconds')))
          print('RENDER_LAST_ETA_SECONDS=' + str(progress.get('last_eta_seconds')))
          PY

      - name: Start visual branding performance clock
        run: python scripts/render_pipeline_stage_clock.py start visual_branding --path runtime/render/pipeline-stage-clock.json

      - name: Apply governed intro and watermark
        run: |
          set -euo pipefail
          python -m app.workers.brand_asset_worker apply \
            --render-job runtime/render/render-job.json \
            --runtime-root runtime/render \
            --output-dir runtime/render/output

      - name: Finish visual branding performance clock
        if: always()
        run: python scripts/render_pipeline_stage_clock.py end visual_branding --path runtime/render/pipeline-stage-clock.json

      - name: Start final QA performance clock
        run: python scripts/render_pipeline_stage_clock.py start final_qa --path runtime/render/pipeline-stage-clock.json

      - name: Prove spoken audio is Brazilian Portuguese
        run: |
          set -euo pipefail
          python scripts/semantic_ptbr_audio_qa.py \
            --artifact-root runtime/render/output

      - name: Prove long-form edit has no artificial padding
        run: |
          set -euo pipefail
          python scripts/run001_longform_no_padding_qa.py \
            --artifact-root runtime/render/output

      - name: Finalize professional QA gates
        run: |
          set -euo pipefail
          python scripts/run001_professional_finalize_qa.py \
            --artifact-root runtime/render/output

      - name: Finish final QA performance clock
        if: always()
        run: python scripts/render_pipeline_stage_clock.py end final_qa --path runtime/render/pipeline-stage-clock.json

      - name: Start render artifact upload clock
        run: python scripts/render_pipeline_stage_clock.py start artifact_upload --path runtime/render/pipeline-stage-clock.json

      - name: Checkpoint QA-passed render before external review
        uses: actions/upload-artifact@v4
        with:
          name: render-output
          path: runtime/render/output/
          if-no-files-found: error
          retention-days: 30

      - name: Finish render artifact upload clock
        run: python scripts/render_pipeline_stage_clock.py end artifact_upload --path runtime/render/pipeline-stage-clock.json

      - name: Start Telegram delivery clock
        run: python scripts/render_pipeline_stage_clock.py start telegram_delivery --path runtime/render/pipeline-stage-clock.json

      - name: Deliver full-duration branded review to Telegram
