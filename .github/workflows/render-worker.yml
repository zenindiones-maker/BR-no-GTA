        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_REVIEW_CHAT_ID"
          python scripts/telegram_render_review_worker.py \
            --artifact-root runtime/render/output

      - name: Finish Telegram delivery clock
        if: always()
        run: python scripts/render_pipeline_stage_clock.py end telegram_delivery --path runtime/render/pipeline-stage-clock.json

      - name: Build canonical render pipeline performance profile
        if: always()
        run: |
          set -euo pipefail
          python scripts/build_render_pipeline_profile.py \
            --runtime-root runtime/render \
