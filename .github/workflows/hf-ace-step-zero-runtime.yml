name: HF ACE-Step ZeroGPU Runtime

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - '.github/workflows/hf-ace-step-zero-runtime.yml'
      - 'app/services/huggingface_ace_step_service.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  ZERO_COST_OPERATION: 'TRUE'
  HF_SPACE: 'ACE-Step/Ace-Step-v1.5'

jobs:
  real-zero-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded client and media validator
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'gradio_client>=1.13,<2'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate real zero-cost ACE-Step audio
        run: |
          set -euo pipefail
          mkdir -p runtime/hf-ace-step/output
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path
          from gradio_client import Client

          assert os.environ['ZERO_COST_OPERATION'] == 'TRUE'
          space = os.environ['HF_SPACE']
          client = Client(space, verbose=False)
          args = [
              'acestep-v15-turbo', 'simple',
              'Instrumental cinematic urban tension bed, modern open-world game documentary, no vocals',
              'unknown',
              'cinematic urban tension, dark electronic pulse, subtle percussion, instrumental',
              '', 0, '', '', 'unknown', 4, 5.0, True, '-1', None, 10, 1, None, '',
              0.0, -1,
              'Fill the audio semantic mask based on the given conditions:',
              1.0, 'text2music', False, 0.0, 1.0, 3.0, 'ode', '', 'mp3', 0.85,
              False, 2.0, 0, 0.9, 'NO USER INPUT', True, True, True, False, False,
              False, False, 0.5, 4, 'synth', [], True,
          ]
          result = client.predict(*args, api_name='/generation_wrapper')

          def collect_files(value, out):
              if value is None:
                  return
              if isinstance(value, (list, tuple)):
                  for child in value:
                      collect_files(child, out)
                  return
              if isinstance(value, dict):
                  for key in ('path', 'name'):
                      raw = value.get(key)
                      if raw:
                          p = Path(str(raw))
                          if p.exists() and p.is_file():
                              out.append(p)
                  for child in value.values():
                      if isinstance(child, (list, tuple, dict)):
                          collect_files(child, out)
                  return
              raw_path = getattr(value, 'path', None) or getattr(value, 'name', None)
              if raw_path:
                  p = Path(str(raw_path))
                  if p.exists() and p.is_file():
                      out.append(p)
                  return
              if isinstance(value, str):
                  p = Path(value)
                  if p.exists() and p.is_file():
                      out.append(p)

          candidates = []
          collect_files(result, candidates)
          # Gradio may return the same file through both output and gallery fields.
          unique = []
          seen = set()
          for p in candidates:
              resolved = str(p.resolve())
              if resolved not in seen:
                  seen.add(resolved)
                  unique.append(p)
          candidates = unique
          if not candidates:
              def shape(value, depth=0):
                  if depth > 2:
                      return type(value).__name__
                  if isinstance(value, (list, tuple)):
                      return [shape(v, depth + 1) for v in value[:8]]
                  if isinstance(value, dict):
                      return {str(k): shape(v, depth + 1) for k, v in list(value.items())[:12]}
                  return type(value).__name__
              raise RuntimeError('ACE-Step generation returned no local audio artifact; shape=' + json.dumps(shape(result)))

          audio_candidates = []
          for p in candidates:
              try:
                  probe = json.loads(subprocess.check_output([
                      'ffprobe', '-v', 'error', '-show_entries',
                      'format=duration,size,format_name:stream=codec_type,codec_name',
                      '-of', 'json', str(p),
                  ], text=True))
              except Exception:
                  continue
              if any(s.get('codec_type') == 'audio' for s in (probe.get('streams') or [])):
                  audio_candidates.append((p, probe))
          if not audio_candidates:
              raise RuntimeError('ACE-Step returned files, but none contains an audio stream')

          src, probe = audio_candidates[0]
          suffix = src.suffix.lower() or '.mp3'
          dst = Path('runtime/hf-ace-step/output/ace-step-zero-real' + suffix)
          shutil.copy2(src, dst)
          if dst.stat().st_size <= 0:
              raise RuntimeError('ACE-Step audio artifact is empty')
          duration = float(probe.get('format', {}).get('duration') or 0)
          streams = probe.get('streams') or []
          if duration <= 0 or not any(s.get('codec_type') == 'audio' for s in streams):
              raise RuntimeError(f'Invalid ACE-Step audio probe: {probe}')
          digest = hashlib.sha256(dst.read_bytes()).hexdigest()
          evidence = {
              'authority': 'DeepSeek Harness',
              'authorized_action': 'EXECUTION',
              'capability_id': 'audio.generate.music',
              'provider': 'huggingface-zerogpu',
              'space': space,
              'model': 'acestep-v15-turbo',
              'zero_cost_operation': True,
              'paid_hf_job_created': False,
              'runtime_execution': 'REAL',
              'artifact': str(dst),
              'artifact_size': dst.stat().st_size,
              'sha256': digest,
              'duration_seconds': duration,
              'ffprobe': probe,
              'status': 'PASS',
          }
          Path('runtime/hf-ace-step/output/evidence.json').write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False), encoding='utf-8'
          )
          print('HF_ZERO_RUNTIME_CONNECT=PASS')
          print('HF_REAL_EXECUTION=PASS')
          print('HF_ARTIFACT=PASS')
          print('HF_ZERO_COST=PROVEN')
          print('ACE_STEP=GREEN')
          print('ACE_AUDIO=' + str(dst))
          print('ACE_DURATION=' + str(duration))
          print('ACE_SHA256=' + digest)
          PY
      - name: Upload real generation evidence
        uses: actions/upload-artifact@v4
        with:
          name: hf-ace-step-zero-real
          path: runtime/hf-ace-step/output/
          if-no-files-found: error
          retention-days: 30
