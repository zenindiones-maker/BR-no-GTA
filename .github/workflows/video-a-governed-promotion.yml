name: VIDEO A Governed Promotion and Full Render

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning

permissions:
  contents: write
  actions: write

jobs:
  promote-and-dispatch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'run VIDEO A governed promotion')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      SOURCE_RENDER_ARTIFACT_ID: "10525757299"
      SOURCE_RENDER_RUN_ID: "35289539299"
      BENCHMARK_ARTIFACT_ID: "10546949960"
      BENCHMARK_RUN_ID: "35347546577"
      INCIDENT_RUN_ID: "35289594486"
      INCIDENT_JOB_ID: "105429342947"
      INCIDENT_HEAD_SHA: "7bc7b9c719d45efa23745d618ec8ba3077addaec"
      PREVIOUS_PROMOTED_RENDER_RUN_ID: "35344736531"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Learning Plane runtime
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt

      - name: Download exact real VIDEO A RenderJob
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.SOURCE_RENDER_ARTIFACT_ID }}
          run-id: ${{ env.SOURCE_RENDER_RUN_ID }}
          github-token: ${{ github.token }}
          path: runtime/video-a-promotion/source
          merge-multiple: true

      - name: Download observed real benchmark
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.BENCHMARK_ARTIFACT_ID }}
          run-id: ${{ env.BENCHMARK_RUN_ID }}
          github-token: ${{ github.token }}
          path: runtime/video-a-promotion/benchmark
          merge-multiple: true

      - name: Persist real timeout Episode and Failure Memory
        run: |
          set -euo pipefail
          mkdir -p runtime/video-a-promotion/incident
          python scripts/reconcile_render_learning_incident.py             --render-job runtime/video-a-promotion/source/render-job.json             --run-id "$INCIDENT_RUN_ID"             --job-id "$INCIDENT_JOB_ID"             --timeout-minutes 240             --expected-head-sha "$INCIDENT_HEAD_SHA"             --output runtime/video-a-promotion/incident/proof.json

      - name: Evaluate and govern promotion
        run: |
          set -euo pipefail
          python scripts/promote_video_a_render_profile.py             --render-job runtime/video-a-promotion/source/render-job.json             --incident-proof runtime/video-a-promotion/incident/proof.json             --benchmark-evidence runtime/video-a-promotion/benchmark/benchmark-evidence.json             --benchmark-run-id "$BENCHMARK_RUN_ID"             --benchmark-artifact-id "$BENCHMARK_ARTIFACT_ID"             --output-dir runtime/video-a-promotion/promoted
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("runtime/video-a-promotion/promoted/promotion-proof.json")
          d=json.loads(p.read_text())
          assert d["REAL_IMPROVEMENT_MISSION"]=="PASS"
          assert d["REAL_IMPROVEMENT_EXPERIMENT"]=="PASS"
          assert d["OBSERVED_EVAL"]=="PASS"
          assert d["GOVERNED_PROMOTION"]=="PASS"
          assert d["PROMOTION_CHANGES_EXECUTABLE_BEHAVIOR"]=="PASS"
          assert d["NEXT_REAL_RUN_RETRIEVES_LEARNING"]=="PASS"
          assert d["improvement_mission_status"]=="COMPLETED"
          assert d["promotion_memory_id"] in d["retrieved_memory_ids"]
          assert d["learning_profile_binding"]["version"]=="v2"
          assert d["evaluation_decision"]=="PROMOTE"
          print("VIDEO_A_GOVERNED_PROMOTION=PASS")
          PY

      - name: Upload promoted RenderJob handoff
        id: handoff
        uses: actions/upload-artifact@v4
        with:
          name: video-a-promoted-render-job-${{ github.run_id }}
          path: runtime/video-a-promotion/promoted/render-job.json
          if-no-files-found: error
          retention-days: 14

      - name: Dispatch next real VIDEO A render with promoted binding
        env:
          ARTIFACT_ID: ${{ steps.handoff.outputs.artifact-id }}
          ARTIFACT_NAME: video-a-promoted-render-job-${{ github.run_id }}
        run: |
          set -euo pipefail
          SOURCE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/work/gate6f-analytics-learning" --jq '.object.sha')"
          DISPATCH_TAG="render-handoff-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${DISPATCH_TAG}" \
            -f sha="$SOURCE_SHA" >/dev/null
          python - "$ARTIFACT_ID" "$ARTIFACT_NAME" "$SOURCE_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          from app.services.render_job_handoff_service import build_artifact_descriptor
          artifact_id=int(sys.argv[1]); artifact_name=sys.argv[2]; source_sha=sys.argv[3]
          path=Path("runtime/video-a-promotion/promoted/render-job.json")
          job=json.loads(path.read_text())
          descriptor=build_artifact_descriptor(
              render_job_path=path,
              job=job,
              artifact_id=artifact_id,
              artifact_name=artifact_name,
              producer_run_id=int(__import__("os").environ["GITHUB_RUN_ID"]),
              producer_workflow="VIDEO A Governed Promotion and Full Render",
              source_sha=source_sha,
          )
          Path("runtime/video-a-promotion/promoted/descriptor.json").write_text(
              json.dumps(descriptor,separators=(",",":"))
          )
          PY
          DESCRIPTOR="$(cat runtime/video-a-promotion/promoted/descriptor.json)"
          BRAIN="$(python -c 'import json; print(json.load(open("runtime/video-a-promotion/promoted/render-job.json"))["brain_decision_id"])')"
          EXECUTION="$(python -c 'import json; print(json.load(open("runtime/video-a-promotion/promoted/render-job.json"))["execution_id"])')"
          gh workflow run render-worker.yml             --repo "$GITHUB_REPOSITORY"             --ref work/gate6f-analytics-learning             -f render_job=""             -f render_job_descriptor="$DESCRIPTOR"             -f brain_decision_id="$BRAIN"             -f execution_id="$EXECUTION"             -f authorized_action="EXECUTION"
          echo "NEXT_REAL_VIDEO_A_RENDER_DISPATCHED=PASS"
          echo "RENDER_DISPATCH_IMMUTABLE_REF=$DISPATCH_TAG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-a-governed-promotion-proof
          path: |
            runtime/video-a-promotion/incident/
            runtime/video-a-promotion/promoted/promotion-proof.json
            runtime/video-a-promotion/promoted/descriptor.json
          if-no-files-found: warn
          retention-days: 30
# Retry note: re-dispatch after scoped authorization-id provenance guard fix.

# Fresh observed benchmark: run 35347546577 / artifact 10546949960.
