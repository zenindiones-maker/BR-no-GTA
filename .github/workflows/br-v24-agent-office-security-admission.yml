name: BR V24 Agent Office Upstream Security Admission

on:
  push:
    branches:
      - work/br-slm-agent-reconstruction-v24
    paths:
      - ".github/workflows/br-v24-agent-office-security-admission.yml"
      - "scripts/br_v24_agent_office_untrusted_npm_gate.py"
      - "tests/test_br_v24_agent_office_untrusted_npm_gate.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v24-agent-office-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-upstream-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: BR V24 source checkout; no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Source-only exact immutable pinned Munder checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: chaitanyagiri/munder-difflin
          ref: 6248293a7cd9dfdbf9633d12bbe857831ccfee88
          path: .br-v24-untrusted-agent-office
          persist-credentials: false
          submodules: false
      - name: Node 24 (npm audit without installing or executing upstream)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test security policy and verify exact provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "work/br-slm-agent-reconstruction-v24"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C .br-v24-untrusted-agent-office rev-parse HEAD)" = "6248293a7cd9dfdbf9633d12bbe857831ccfee88"
          python -m unittest discover -s tests -p 'test_br_v24_agent_office_untrusted_npm_gate.py' -v
          python scripts/agent_office_preflight.py --upstream-dir "$GITHUB_WORKSPACE/.br-v24-untrusted-agent-office"
      - name: Request current production dependency advisories without installing upstream
        shell: bash
        working-directory: .br-v24-untrusted-agent-office
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > "$RUNNER_TEMP/br-v24-agent-office-npm-audit.json" || true
          test -s "$RUNNER_TEMP/br-v24-agent-office-npm-audit.json"
      - name: Derive strict no-waiver fail-closed security admission receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/br_v24_agent_office_untrusted_npm_gate.py \
            --source-root "$GITHUB_WORKSPACE/.br-v24-untrusted-agent-office" \
            --audit "$RUNNER_TEMP/br-v24-agent-office-npm-audit.json" \
            --lock integrations/munder_difflin/UPSTREAM.lock \
            --output "$RUNNER_TEMP/br-v24-agent-office-security-admission.json"
      - name: Preserve sanitized exact-SHA vendor risk review, no secrets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-v24-agent-office-security-${{ github.run_id }}
          path: ${{ runner.temp }}/br-v24-agent-office-security-admission.json
          retention-days: 7
          if-no-files-found: warn
