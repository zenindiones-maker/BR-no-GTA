name: BR V24 Existing Swarm SLM Shadow Audit

on:
  push:
    branches:
      - work/br-slm-agent-reconstruction-v24
    paths:
      - ".github/workflows/br-v24-existing-swarm-slm-shadow.yml"
      - "app/services/br_slm_swarm_bridge_v24.py"
      - "app/services/br_slm_swarm_wiring_v24.py"
      - "scripts/br_slm_existing_swarm_inventory_v24.py"
      - "tests/test_br_slm_swarm_bridge_v24_stdlib.py"
      - "tests/test_br_slm_swarm_wiring_v24_stdlib.py"
      - "docs/architecture/br-v24-existing-swarm-slm-transfer.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v24-existing-swarm-slm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  registry-shadow-census:
    name: BR-native existing-agent census (no model)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BR_OWNER_PRIVATE_VOICE: "FORBIDDEN"
    steps:
      - name: Exact GitHub SHA, credentials not persisted
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.12 for existing canonical Registry
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Unit safety and negative controls
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_br_slm_swarm_bridge_v24_stdlib.py' -v
          python -m unittest discover -s tests -p 'test_br_slm_swarm_wiring_v24_stdlib.py' -v
          python -m py_compile app/services/br_slm_swarm_bridge_v24.py app/services/br_slm_swarm_wiring_v24.py scripts/br_slm_existing_swarm_inventory_v24.py
      - name: Discover actual registered agent records (no inference)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q --disable-pip-version-check python-dotenv==1.2.3
          python scripts/br_slm_existing_swarm_inventory_v24.py
          echo "BR_V24_SWARM_READONLY_CENSUS=PASS"
