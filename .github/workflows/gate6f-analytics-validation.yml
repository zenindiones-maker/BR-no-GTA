name: Gate 6F Analytics Validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  validate:
    name: Gate6F specialized
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore canonical test environment
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-py312-br-no-gta-venv-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies on cache miss
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pytest

      - name: Verify cached test environment
        run: .venv/bin/python -c "import pytest; print(pytest.__version__)"

      - name: Compile
        run: |
          .venv/bin/python -m compileall -q app
          .venv/bin/python -m py_compile scripts/telegram_harness_gateway_v2.py scripts/gta6_fresh_research_worker.py scripts/telegram_video_review_worker.py scripts/reconcile_telegram_reasoning_incident.py scripts/reconcile_render_learning_incident.py scripts/promote_video_a_render_profile.py scripts/promote_telegram_opencode_executor_profile.py scripts/process_real_telegram_source.py scripts/prove_real_telegram_presentation.py
          bash -n scripts/telegram_termux_control.sh scripts/install_telegram_termux_persistence.sh scripts/setup_telegram_review_channel.sh scripts/reconcile_real_telegram_403.sh scripts/prove_real_telegram_source.sh scripts/prove_real_telegram_presentation.sh

      - name: Focused tests
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_phone_control_service.py \
            tests/test_global_capability_registry.py \
            tests/test_harness_authorization_service.py \
            tests/test_harness_routing_policy_service.py \
            tests/test_youtube_analytics_service.py \
            tests/test_google_oauth.py \
            tests/test_telegram_harness_integration.py \
            tests/test_telegram_fresh_research.py \
            tests/test_telegram_brand_render_pipeline.py \
            tests/test_telegram_total_ingress.py \
            tests/test_telegram_brand_ffmpeg_integration.py \
            tests/test_channel_branding_standard.py \
            tests/test_telegram_video_review.py \
            tests/test_telegram_reasoning_incident_reconciliation.py \
            tests/test_opencode_executor_profile_learning.py \
            tests/test_telegram_source_intelligence.py \
            tests/test_human_presentation_service.py \
            tests/test_telegram_presentation_audit.py \
            tests/test_real_telegram_presentation_proof.py

      - name: Phone runtime static boundary
        run: |
          grep -q 'AndroidPortalHttpDriver' app/services/phone_control_runtime.py
          grep -q 'await driver.connect()' app/services/phone_control_runtime.py
          grep -q 'await driver.get_ui_tree()' app/services/phone_control_runtime.py
          ! grep -q 'from mobilerun import Mobilerun' app/services/phone_control_runtime.py
          ! grep -q 'input_text' app/services/phone_control_runtime.py
          ! grep -q 'execute_script' app/services/phone_control_runtime.py

      - name: Diff and frozen-boundary guards
        run: |
          git diff --check 17851a21ecebf9a590dd6806809041477ee7776d..HEAD
          ! git diff --name-only 17851a21ecebf9a590dd6806809041477ee7776d..HEAD | grep -i 'job18'
