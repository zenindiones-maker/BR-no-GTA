name: Gate 6F Analytics Validation

on:
  workflow_dispatch:
  push:
    branches: [work/gate6f-analytics-learning]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.txt pytest
      - name: Compile
        run: .venv/bin/python -m compileall -q app
      - name: Focused tests
        run: .venv/bin/python -m pytest -q tests/test_youtube_analytics_service.py tests/test_google_oauth.py tests/test_global_capability_registry.py tests/test_harness_authorization_service.py tests/test_harness_routing_policy_service.py
      - name: Diff and frozen-boundary guards
        run: |
          git diff --check 17851a21ecebf9a590dd6806809041477ee7776d..HEAD
          ! git diff --name-only 17851a21ecebf9a590dd6806809041477ee7776d..HEAD | grep -i 'job18'
          ! git diff 17851a21ecebf9a590dd6806809041477ee7776d..HEAD | grep -E '(^|[^A-Za-z])(access_token|refresh_token|client_secret)[[:space:]]*=[[:space:]]*["'"'][^"'"']+'
      - name: Full suite
        run: .venv/bin/python -m pytest -q tests/
