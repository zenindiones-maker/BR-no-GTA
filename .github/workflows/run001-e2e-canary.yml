name: RUN-001 E2E Acceptance Canary

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - .run001/e2e-canary-request.json

permissions:
  contents: read
  actions: write

concurrency:
  group: run001-e2e-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controller:
    if: github.ref == 'refs/heads/work/gate6f-analytics-learning'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_REF: work/gate6f-analytics-learning
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install controller dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Focused controller and Telegram review-state tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_run001_e2e_canary_controller.py \
            tests/test_telegram_render_review_state.py

      - name: Build Harness-authorized canonical canary bundle
        run: |
          set -euo pipefail
          rm -rf runtime/e2e-canary
          python scripts/run001_e2e_canary_controller.py \
            --request .run001/e2e-canary-request.json \
            --output-dir runtime/e2e-canary/controller | tee runtime-e2e-controller.log
          grep -Fx 'E2E_CONTROLLER=PASS' runtime-e2e-controller.log
          grep -Fx 'JOB18_UNCHANGED=YES' runtime-e2e-controller.log
          grep -Fx 'JOB20_REUSED_AS_FINAL=NO' runtime-e2e-controller.log
          grep -Fx 'NO_YOUTUBE_PUBLISH=YES' runtime-e2e-controller.log

      - name: Capture render-worker baseline
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow render-worker.yml \
            --branch "$TARGET_REF" \
            --event workflow_dispatch \
            --limit 50 \
            --json databaseId > runtime/e2e-canary/render-runs-before.json

      - name: Dispatch official render-worker
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          job = json.loads(Path('runtime/e2e-canary/controller/render-job.json').read_text(encoding='utf-8'))
          payload = {
              'ref': os.environ['TARGET_REF'],
              'inputs': {
                  'render_job': json.dumps(job, ensure_ascii=False, separators=(',', ':')),
                  'brain_decision_id': job['brain_decision_id'],
                  'execution_id': job['execution_id'],
                  'authorized_action': job['authorized_action'],
              },
          }
          Path('runtime/e2e-canary/render-dispatch.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/render-worker.yml/dispatches" \
            --input runtime/e2e-canary/render-dispatch.json
          echo 'RENDER_WORKER_DISPATCH=ACCEPTED'

      - name: Resolve dispatched render run
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('runtime/e2e-canary/render-runs-before.json').read_text())
          Path('runtime/e2e-canary/before-ids.txt').write_text(
              '\n'.join(str(item['databaseId']) for item in before), encoding='utf-8'
          )
          PY
          RUN_ID=""
          RUN_URL=""
          for attempt in $(seq 1 30); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow render-worker.yml \
              --branch "$TARGET_REF" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha,createdAt,status,conclusion,url > runtime/e2e-canary/render-runs-after.json
            RUN_ID="$(python - <<'PY'
          import json, os
          from pathlib import Path
          before = set(Path('runtime/e2e-canary/before-ids.txt').read_text().split())
          runs = json.loads(Path('runtime/e2e-canary/render-runs-after.json').read_text())
          expected = os.environ['GITHUB_SHA']
          for item in runs:
              if str(item['databaseId']) not in before and item.get('headSha') == expected:
                  print(item['databaseId'])
                  break
          PY
          )"
            if [ -n "$RUN_ID" ]; then
              RUN_URL="$(python - <<'PY'
          import json, os
          from pathlib import Path
          run_id = int(os.environ['RUN_ID_FOR_URL'])
          runs = json.loads(Path('runtime/e2e-canary/render-runs-after.json').read_text())
          print(next(item['url'] for item in runs if item['databaseId'] == run_id))
          PY
          )" || true
              break
            fi
            sleep 5
          done
          test -n "$RUN_ID"
          echo "CANARY_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "$RUN_ID" > runtime/e2e-canary/render-run-id.txt
          echo "CANARY_RUN_ID=$RUN_ID"
        env:
          RUN_ID_FOR_URL: "0"

      - name: Wait for official render-worker completion
        run: |
          set -euo pipefail
          gh run watch "$CANARY_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
          gh run view "$CANARY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,headSha,url,createdAt,updatedAt \
            > runtime/e2e-canary/render-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('runtime/e2e-canary/render-run.json').read_text())
          assert data['databaseId'] == int(os.environ['CANARY_RUN_ID'])
          assert data['conclusion'] == 'success', data
          assert data['headSha'] == os.environ['GITHUB_SHA'], data
          print('RENDER_WORKER_COMPLETION=PASS')
          print(f"CANARY_RUN_URL={data['url']}")
          PY

      - name: Resolve and download render artifact
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANARY_RUN_ID}/artifacts" \
            > runtime/e2e-canary/render-artifacts.json
          ARTIFACT_ID="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('runtime/e2e-canary/render-artifacts.json').read_text())
          matches = [item for item in data.get('artifacts', []) if item.get('name') == 'render-output' and not item.get('expired')]
          if len(matches) != 1:
              raise SystemExit(f'expected one render-output artifact, got {len(matches)}')
          print(matches[0]['id'])
          PY
          )"
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"
          mkdir -p runtime/e2e-canary/render-output
          gh run download "$CANARY_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name render-output --dir runtime/e2e-canary/render-output
          echo "ARTIFACT_ID=$ARTIFACT_ID"

      - name: Validate real MP4, QA, manifest and Telegram delivery receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, math, os
          from pathlib import Path

          root = Path('runtime/e2e-canary/render-output')
          controller = json.loads(Path('runtime/e2e-canary/controller/controller-evidence.json').read_text())
          request = json.loads(Path('.run001/e2e-canary-request.json').read_text())
          manifests = list(root.rglob('render-manifest.json'))
          qas = list(root.rglob('render-qa.json'))
          probes = list(root.rglob('video-probe.json'))
          telegrams = list(root.rglob('telegram-review.json'))
          mp4s = [p for p in root.rglob('*.mp4') if p.is_file()]
          assert len(manifests) == len(qas) == len(probes) == len(telegrams) == len(mp4s) == 1
          manifest = json.loads(manifests[0].read_text())
          qa = json.loads(qas[0].read_text())
          probe = json.loads(probes[0].read_text())
          telegram = json.loads(telegrams[0].read_text())
          mp4 = mp4s[0]
          digest = hashlib.sha256(mp4.read_bytes()).hexdigest()
          streams = probe.get('streams', [])
          video_streams = sum(1 for item in streams if item.get('codec_type') == 'video')
          audio_streams = sum(1 for item in streams if item.get('codec_type') == 'audio')
          duration = float(probe['format']['duration'])
          assert mp4.stat().st_size > 0
          assert video_streams >= 1 and audio_streams >= 1
          assert math.isfinite(duration) and duration > 0
          assert manifest['render_job_id'] == controller['render_job_id']
          assert manifest['video_id'] == controller['video_id']
          assert manifest['execution_id'] == controller['execution_id']
          assert manifest['sha256'] == digest
          assert manifest['qa_status'] == 'PASS'
          assert abs(float(manifest['duration_seconds']) - duration) <= max(.5, duration * .01)
          assert qa['status'] == 'PASS'
          assert qa['checks']['full_decode'] is True
          assert qa['checks']['video_stream'] is True
          assert qa['checks']['audio_stream'] is True
          assert qa['checks']['mp4_container'] is True
          assert telegram['status'] == 'DELIVERED'
          assert telegram['telegram_review_delivery'] == 'PASS'
          assert telegram['human_review_state'] == 'READY_FOR_HUMAN_REVIEW'
          assert isinstance(telegram['telegram_message_id'], int)
          assert telegram['master_sha256'] == digest
          assert controller['job18_unchanged'] is True
          assert controller['job20_reused_as_final'] is False
          assert controller['youtube_publication'] is False
          expected_content = float(request['estimated_duration_seconds'])
          assert expected_content >= 30 and expected_content <= 60
          branding = manifest.get('branding') or {}
          expected_final = expected_content + float(branding.get('intro_duration_seconds') or 0.0)
          assert abs(duration - expected_final) <= max(.6, expected_final * .01)
          run = json.loads(Path('runtime/e2e-canary/render-run.json').read_text())
          result = {
              'status': 'PASS',
              'controller': controller,
              'canary_run_id': int(os.environ['CANARY_RUN_ID']),
              'canary_run_url': run['url'],
              'artifact_id': int(os.environ['ARTIFACT_ID']),
              'artifact_name': 'render-output',
              'mp4_file': mp4.name,
              'mp4_size_bytes': mp4.stat().st_size,
              'mp4_sha256': digest,
              'mp4_duration': duration,
              'video_streams': video_streams,
              'audio_streams': audio_streams,
              'ffprobe_result': 'PASS',
              'full_decode_result': 'PASS',
              'qa_result': 'PASS',
              'render_manifest_result': 'PASS',
              'telegram_render_review_worker': 'EXECUTED',
              'telegram_delivery_result': 'PASS',
              'telegram_delivery_message_id': telegram['telegram_message_id'],
              'telegram_delivery_ref': f"telegram-review:{os.environ['CANARY_RUN_ID']}:{telegram['telegram_message_id']}",
              'telegram_mp4_delivered': True,
              'human_review_state': telegram['human_review_state'],
              'job18_unchanged': True,
              'job20_reused_as_final': False,
              'no_youtube_publish': True,
          }
          Path('runtime/e2e-canary/e2e-result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print('REAL_CANARY_MP4=PASS')
          print('QA_RESULT=PASS')
          print('ARTIFACT_RECOVERABLE=PASS')
          print('TELEGRAM_MP4_DELIVERED=YES')
          print('HUMAN_REVIEW_STATE=READY_FOR_HUMAN_REVIEW')
          PY

      - name: Upload E2E controller proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run001-e2e-canary-controller-${{ github.run_id }}
          path: |
            runtime/e2e-canary/
            runtime-e2e-controller.log
          if-no-files-found: warn
          retention-days: 30
