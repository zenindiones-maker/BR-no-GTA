name: Obsidian Memory Plane Validation

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/obsidian-memory-plane.request.json"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/obsidian-memory-plane/memory-plane.db

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project test dependencies
        run: |
          set -euo pipefail
          mkdir -p artifacts/obsidian-memory-plane
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile memory plane
        run: |
          set -euo pipefail
          bash -n scripts/obsidian_inbox_dispatch.sh
          bash -n scripts/obsidian_sync_export.sh
          python -m py_compile app/database/schema.py app/database/harness_learning_repository.py app/services/harness_learning_service.py app/services/memory_plane_service.py app/services/bounded_memory_context_service.py app/services/harness_learning_context_service.py app/services/harness_routing_policy_service.py app/services/harness_episode_capture_service.py app/services/obsidian_memory_service.py app/services/hermes_multiagent/capability_broker.py app/services/telegram_conversation_service.py scripts/obsidian_memory_plane_canary.py scripts/obsidian_inbox_cloud_ingest.py scripts/obsidian_apply_memory_envelope.py
          echo "MEMORY_PLANE_COMPILE=PASS"
          echo "A15_LIGHTWEIGHT_SCRIPTS_SYNTAX=PASS"

      - name: Run focused memory and authority tests
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_memory_plane_obsidian.py             tests/test_harness_learning_system.py             tests/test_hermes_multiagent_boundary.py             tests/test_telegram_conversation_control.py             --junitxml=artifacts/obsidian-memory-plane/pytest.xml

      - name: Run real-evidence memory plane canary
        run: |
          set -euo pipefail
          rm -f "$BR_TEST_DATABASE"
          python scripts/obsidian_memory_plane_canary.py             --artifact-dir artifacts/obsidian-memory-plane

      - name: Prove explicit Inbox cloud envelope transport
        run: |
          set -euo pipefail
          mkdir -p artifacts/obsidian-memory-plane/inbox-transport
          cat > artifacts/obsidian-memory-plane/inbox-transport/voice-feedback.md <<'EOF'
          ---
          type: human_note
          target: video-a
          ---

          Não produzir nova voz antes da revisão do roteiro.
          EOF
          python scripts/obsidian_inbox_cloud_ingest.py             --note-file artifacts/obsidian-memory-plane/inbox-transport/voice-feedback.md             --source-ref Inbox/workflow-voice-feedback.md             --goal-id 93f99ddc-09c7-474b-8849-6981aa78d60c             --task-id script-human-review             --artifact-ref script:8             --output-dir artifacts/obsidian-memory-plane/inbox-transport/result
          python scripts/obsidian_apply_memory_envelope.py             artifacts/obsidian-memory-plane/inbox-transport/result/canonical-memory-envelope.json             --receipt artifacts/obsidian-memory-plane/inbox-transport/materialization-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/obsidian-memory-plane/inbox-transport/result/obsidian-inbox-result.json")
          d=json.loads(p.read_text())
          assert d["OBSIDIAN_NOTE_INGESTED"]=="PASS"
          assert d["MEMORY_CANDIDATE_CREATED"]=="PASS"
          assert d["CANONICAL_AUTO_PROMOTION"]=="NO"
          assert d["HARNESS_EVALUATION_REQUIRED"]=="PASS"
          assert d["HARNESS_EVALUATION_DECISION"]=="HUMAN_REVIEW"
          r=json.loads(Path("artifacts/obsidian-memory-plane/inbox-transport/materialization-receipt.json").read_text())
          assert r["memory_status"]=="CANDIDATE"
          assert r["evaluation_decision"]=="HUMAN_REVIEW"
          assert r["TERMUX_HEAVY_PROCESSING"]=="NO"
          print("OBSIDIAN_INBOX_TRANSPORT=PASS")
          print("MEMORY_ENVELOPE_MATERIALIZATION=PASS")
          print("CANONICAL_AUTO_PROMOTION=NO")
          print("HERMES_DIRECT_MEMORY_WRITE=NO")
          print("OBSIDIAN_CANONICAL_MEMORY=NO")
          print("TERMUX_HEAVY_PROCESSING=NO")
          PY

      - name: Validate required memory gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/obsidian-memory-plane/memory-plane-proof.json")
          d=json.loads(p.read_text())
          required=[
            "MEMORY_RETRIEVE_BEFORE_EXECUTION",
            "MEMORY_CAPTURE_AFTER_EXECUTION",
            "BOUNDED_MEMORY_CONTEXT",
            "FAILURE_MEMORY_RETRIEVAL",
            "HUMAN_DECISION_MEMORY",
            "MEMORY_CANDIDATE_GATE",
            "MEMORY_SUPERSESSION",
            "HERMES_MEMORY_CONTEXT",
            "HERMES_DIRECT_MEMORY_WRITE",
            "OBSIDIAN_EXPORT",
            "OBSIDIAN_INBOX_INGEST",
            "OBSIDIAN_CANONICAL_MEMORY",
            "TERMUX_HEAVY_PROCESSING",
            "SINGLE_CANONICAL_MEMORY_PLANE",
            "LEARNING_PLANE_AUTHORITY_PRESERVED",
          ]
          checks=d["checks"]
          for key in required:
              assert checks.get(key) is True, (key, checks.get(key))
              print(f"{key}=PASS")
          assert d["NEW_VOICE_SYNTHESIS"]=="NO"
          assert d["FULL_RENDER"]=="NO"
          assert d["YOUTUBE_UPLOAD"]=="NO"
          assert d["YOUTUBE_PUBLICATION"]=="NO"
          export=Path("artifacts/obsidian-memory-plane/obsidian-memory-export")
          assert (export/"00-System/Current-State.md").is_file()
          assert (export/"10-Human-Decisions/VIDEO-A.md").is_file()
          assert (export/"30-Agents/Hermes/Competence.md").is_file()
          assert (export/"50-Projects/VIDEO-A/Current-State.md").is_file()
          assert any((export/"20-Learning/Failures").glob("*.md"))
          assert any((export/"20-Learning/Improvements").glob("*.md"))
          assert any((export/"90-Runs/HarnessEpisodes").glob("*.md"))
          print("OBSIDIAN_MEMORY_EXPORT_PACKAGE=PASS")
          print("HERMES_DIRECT_MEMORY_WRITE=NO")
          print("OBSIDIAN_CANONICAL_MEMORY=NO")
          print("TERMUX_HEAVY_PROCESSING=NO")
          print("CANONICAL_AUTO_PROMOTION=NO")
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER=NO")
          print("YOUTUBE_UPLOAD=NO")
          print("YOUTUBE_PUBLICATION=NO")
          PY

      - name: Upload Obsidian memory package and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-memory-plane-${{ github.run_id }}
          path: artifacts/obsidian-memory-plane/
          if-no-files-found: error
          retention-days: 30

      - name: Upload lightweight published-memory view
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-memory-export-${{ github.run_id }}
          path: artifacts/obsidian-memory-plane/obsidian-memory-export/
          if-no-files-found: error
          retention-days: 30

      - name: Publish validation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "obsidian-memory-plane",
              "description": "Harness canonical memory + Obsidian projection validation",
              "target_url": (
                  "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                  + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d @/tmp/status.json
