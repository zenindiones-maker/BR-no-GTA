name: Harness Hermes Delegation Plane Operational Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/delegation-plane-operational-proof.request.json"
  workflow_dispatch:
    inputs:
      phase:
        description: Internal chained phase
        required: true
        default: first
        type: choice
        options: [first, second]
      first_run_id:
        description: First real execution GitHub run id
        required: false
        default: ""
        type: string
      base_sha:
        description: Exact SHA shared by both real executions
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write
  statuses: write

env:
  TUXEVIL_ROTATOR_VERSION: "3.8.0"
  TUXEVIL_ROTATOR_BIND_HOST: "127.0.0.1"
  TUXEVIL_ROTATOR_TELEMETRY: "off"
  TUXEVIL_ROTATOR_ADMIN_TOKEN: "ci-delegation-proof-only"
  TUXEVIL_LOOPBACK_CLIENT_KEY: "tuxevil"
  TUXEVIL_LOOPBACK_URL: "http://127.0.0.1:51200"
  BR_TUXEVIL_LOOPBACK_KEY: "tuxevil"
  BR_CODEX_TUXEVIL_BASE_URL: "http://127.0.0.1:51200/v1"
  BR_HERMES_UPSTREAM_ROOT: ${{ github.workspace }}/.runtime/hermes-agent
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/delegation-plane-operational/state/learning.db
  ZERO_COST_OPERATION: "TRUE"
  SYSTEM_IMPROVEMENT_AUTONOMOUS_TELEGRAM_EGRESS: "0"
  HARNESS_DELEGATION_TELEGRAM_EGRESS: "0"
  HERMES_PROGRESS_TELEGRAM_EGRESS: "0"
  AGENT_PROGRESS_TELEGRAM_EGRESS: "0"
  CI_REAL_TELEGRAM_EGRESS: "0"
  PROOF_REAL_TELEGRAM_EGRESS: "0"
  OP_PHASE: ${{ github.event_name == 'push' && 'first' || inputs.phase }}
  OP_BASE_SHA: ${{ inputs.base_sha || github.sha }}

jobs:
  operational:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact operational base without persisted Git credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OP_BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare canonical runtime and focused delegation gates
        run: |
          set -euo pipefail
          mkdir -p artifacts/delegation-plane-operational/state .runtime
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt pytest
          python -m pytest -q \
            tests/test_harness_hermes_delegation_plane.py \
            tests/test_agent_office.py \
            tests/test_delegated_agent_autonomy.py \
            tests/test_harness_candidate_integration_service.py \
            tests/test_codex_auth_boundary.py
          bash scripts/agent-tooling/bootstrap.sh codex
          codex --version
          codex_home="$RUNNER_TEMP/delegation-plane-codex-$GITHUB_RUN_ID"
          install -d -m 700 "$codex_home"
          echo "CODEX_HOME=$codex_home" >> "$GITHUB_ENV"
          bash scripts/prepare_codex_linux_sandbox.sh
          python scripts/bootstrap_hermes_agent.py \
            --target "$BR_HERMES_UPSTREAM_ROOT" \
            --output artifacts/delegation-plane-operational/hermes-upstream.json
          test "$(git -C "$BR_HERMES_UPSTREAM_ROOT" rev-parse HEAD)" = "9eca7f388f71755293343dddd6ec4d9111d68fc4"
          test "$(git -C "$BR_HERMES_UPSTREAM_ROOT" status --porcelain)" = ""
          npm install --global "tuxevil-rotator@$TUXEVIL_ROTATOR_VERSION"
          echo "DELEGATION_PLANE_FOCUSED_GATES=PASS"

      - name: Restore first real execution and Learning Plane state
        if: env.OP_PHASE == 'second'
        uses: actions/download-artifact@v4
        with:
          name: delegation-plane-first-state-${{ inputs.first_run_id }}
          path: artifacts/delegation-plane-operational/restored
          run-id: ${{ inputs.first_run_id }}
          github-token: ${{ github.token }}

      - name: Prepare persisted learning state for this phase
        run: |
          set -euo pipefail
          mkdir -p artifacts/delegation-plane-operational/state
          if [ "$OP_PHASE" = "second" ]; then
            test -n "${{ inputs.first_run_id }}"
            test -s artifacts/delegation-plane-operational/restored/state/learning.db
            cp artifacts/delegation-plane-operational/restored/state/learning.db "$BR_TEST_DATABASE"
            mkdir -p artifacts/delegation-plane-operational/first
            cp -a artifacts/delegation-plane-operational/restored/first/. \
              artifacts/delegation-plane-operational/first/
          fi
          echo "LEARNING_STATE_PHASE=$OP_PHASE"

      - name: Materialize existing Antigravity store only in ephemeral runner
        env:
          TUXEVIL_ACCOUNTS_JSON_B64: ${{ secrets.TUXEVIL_ACCOUNTS_JSON_B64 }}
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/delegation-plane-tuxevil-$GITHUB_RUN_ID"
          store="$config_dir/accounts.json"
          mkdir -p "$config_dir"
          umask 077
          test -n "${TUXEVIL_ACCOUNTS_JSON_B64:-}"
          printf '%s' "$TUXEVIL_ACCOUNTS_JSON_B64" | base64 --decode > "$store"
          chmod 600 "$store"
          python - "$store" <<'PY'
          import json
          import pathlib
          import stat
          import sys

          path=pathlib.Path(sys.argv[1])
          assert path.is_file()
          assert stat.S_IMODE(path.stat().st_mode) == 0o600
          data=json.loads(path.read_text(encoding="utf-8"))
          accounts=data.get("accounts") if isinstance(data,dict) else data
          assert isinstance(accounts,list)
          providers=set()
          count=0
          for account in accounts:
              if not isinstance(account,dict):
                  continue
              count += 1
              provider=account.get("provider")
              if isinstance(provider,str) and provider:
                  providers.add(provider)
              credentials=account.get("credentials")
              if isinstance(credentials,list):
                  for credential in credentials:
                      if isinstance(credential,dict):
                          value=credential.get("provider")
                          if isinstance(value,str) and value:
                              providers.add(value)
              if not provider and not isinstance(credentials,list):
                  providers.add("google-antigravity")
          assert count == 4
          assert "google-antigravity" in providers
          print("TUXEVIL_ACCOUNT_STORE_PRESENT=PASS")
          print("TUXEVIL_ACCOUNT_STORE_MODE_600=PASS")
          print("TUXEVIL_RUNTIME_ACCOUNT_COUNT_EXPECTED=4")
          print("ANTIGRAVITY_ACCOUNT_PRESENT_EXPECTED=YES")
          print("CREDENTIAL_VALUES_PRINTED=NO")
          PY
          echo "TUXEVIL_OPERATIONAL_CONFIG_DIR=$config_dir" >> "$GITHUB_ENV"

      - name: Start Tuxevil and prove live Responses transport
        id: provider
        run: |
          set -euo pipefail
          raw_log="$RUNNER_TEMP/delegation-plane-tuxevil.raw.log"
          redacted_log="artifacts/delegation-plane-operational/tuxevil-rotator.redacted.log"
          nohup tuxevil-rotator start --config-dir "$TUXEVIL_OPERATIONAL_CONFIG_DIR" \
            > "$raw_log" 2>&1 &
          pid="$!"
          echo "$pid" > "$RUNNER_TEMP/delegation-plane-tuxevil.pid"

          python scripts/tuxevil_runtime_readiness.py \
            --pid "$pid" \
            --config-dir "$TUXEVIL_OPERATIONAL_CONFIG_DIR" \
            --raw-log "$raw_log" \
            --redacted-log "$redacted_log" \
            --output artifacts/delegation-plane-operational/tuxevil-readiness.json \
            --base-url "$TUXEVIL_LOOPBACK_URL" \
            --admin-token "$TUXEVIL_ROTATOR_ADMIN_TOKEN" \
            --client-key "$TUXEVIL_LOOPBACK_CLIENT_KEY" \
            --wait-seconds 20

          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(
              Path("artifacts/delegation-plane-operational/tuxevil-readiness.json").read_text()
          )
          assert d["TUXEVIL_PROCESS_READY"] == "PASS"
          assert d["TUXEVIL_STATUS_ENDPOINT"] == "PASS"
          assert d["TUXEVIL_RUNTIME_ACCOUNT_COUNT"] == 4
          assert d["ANTIGRAVITY_ACCOUNT_PRESENT"] == "YES"
          assert d["TUXEVIL_MODELS_READY"] == "PASS"
          PY

          python scripts/tuxevil_codex_compat_probe.py \
            --output artifacts/delegation-plane-operational/tuxevil-responses-proof.json \
            --base-url "$TUXEVIL_LOOPBACK_URL" \
            --client-key "$TUXEVIL_LOOPBACK_CLIENT_KEY" \
            --configured-model "gemini-3-flash" \
            --ci-credential-path EXISTING_RUNTIME_MATERIALIZATION \
            --project-antigravity-configured \
            --codex-action-responses-endpoint-supported \
            --tuxevil-responses-endpoint-supported \
            --process-ready \
            --status-ready \
            --runtime-account-count 4 \
            --antigravity-account-present

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(
              Path("artifacts/delegation-plane-operational/tuxevil-responses-proof.json").read_text()
          )
          assert d["TUXEVIL_RESPONSES_API"] == "PASS"
          assert d["ANTIGRAVITY_UPSTREAM_AUTH"] == "PASS"
          assert d["TUXEVIL_LIVE_INFERENCE"] == "PASS"
          assert d["TUXEVIL_TOOL_CALLING"] == "PASS"
          assert d["OPENAI_PLATFORM_API_KEY_REQUIRED"] == "NO"
          assert d["AUTH_SECRET_LEAK"] == "NO"
          print("model=" + str(d["selected_model"]))
          PY

      - name: Publish runner-local Codex health from live Tuxevil proof
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          proof=json.loads(
              Path("artifacts/delegation-plane-operational/tuxevil-responses-proof.json").read_text()
          )
          for key in (
              "TUXEVIL_RESPONSES_API",
              "ANTIGRAVITY_UPSTREAM_AUTH",
              "TUXEVIL_LIVE_INFERENCE",
              "TUXEVIL_TOOL_CALLING",
          ):
              assert proof[key] == "PASS", (key,proof[key])
          health={
              capability:{
                  "state":"HEALTHY",
                  "reason":"Tuxevil Antigravity Responses transport passed live on the executing runner",
                  "retry_allowed":True,
                  "confidence":0.99,
                  "sample_size":1,
                  "evidence_refs":[
                      f"github:run:{os.environ['GITHUB_RUN_ID']}:tuxevil-live-proof",
                      "github:run:35690620457:item19-auth-proof",
                  ],
              }
              for capability in (
                  "agent-office.codex.readonly-analysis",
                  "agent-office.codex.bounded-development",
              )
          }
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as handle:
              handle.write(
                  "BR_RUNTIME_CAPABILITY_HEALTH_JSON="
                  + json.dumps(health,separators=(",",":"))
                  + "\n"
              )
          print("CODEX_RUNTIME_HEALTH_PREFLIGHT=PASS")
          PY

      - name: Execute first real natural-goal mission
        if: env.OP_PHASE == 'first'
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ env.BR_HERMES_UPSTREAM_ROOT }}
          BR_CODEX_AUTH_MODE: "TUXEVIL_ANTIGRAVITY_RESPONSES_PROXY"
          BR_CODEX_TUXEVIL_MODEL: ${{ steps.provider.outputs.model }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/delegation-plane-operational/first
          python scripts/delegation_plane_real_execution.py \
            --goal-id "delegation-plane-real-first-$GITHUB_RUN_ID" \
            --execution-instance-id "first:$GITHUB_RUN_ID" \
            --base-sha "$OP_BASE_SHA" \
            --branch "work/gate6f-analytics-learning" \
            --upstream-root "$BR_HERMES_UPSTREAM_ROOT" \
            --output-dir artifacts/delegation-plane-operational/first

      - name: Validate item 35 and item 36 first-execution gates
        if: env.OP_PHASE == 'first'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/delegation-plane-operational/first")
          plan=json.loads((root/"natural-goal-plan.json").read_text())
          report=json.loads((root/"dynamic-system-improvement-report.json").read_text())
          assert plan["NATURAL_GOAL_RECEIVED"] == "PASS"
          assert plan["HARNESS_MISSION_PLAN"] == "PASS"
          assert plan["MISSION_PLAN_AUTHORITY"] == "DEEPSEEK_HARNESS"
          assert plan["CAPABILITIES_SELECTED_FROM_REGISTRY"] == "PASS"
          assert plan["SELECTION_NOT_HARDCODED"] == "PASS"
          assert plan["COMPETENCE_CONTEXT_USED"] == "PASS"
          assert plan["HEALTH_CONTEXT_USED"] == "PASS"
          assert plan["MINIMUM_SUFFICIENT_TEAM"] == "PASS"
          assert plan["MISSION_EXECUTION_ROUTER"] == "PASS"
          assert plan["HERMES_USED"] == "YES", plan.get("HERMES_SELECTION_REASON")
          assert str(plan.get("HERMES_SELECTION_REASON") or "").strip()

          checks=report["checks"]
          for key in (
              "REAL_SPECIALIST_EXECUTION",
              "REAL_SYSTEM_PROBLEM_OBSERVED",
              "BASELINE_MEASURED",
              "HARNESS_FINAL_DECISION",
              "NO_REGRESSION",
          ):
              assert checks[key] is True, (key, checks[key])
          if plan["HERMES_USED"] == "YES":
              route=plan["route"]
              assert route["hermes_used"] is True
              assert report["checks"]["HERMES_SUBORDINATE"] is True
              assert report["checks"]["HERMES_DELEGATION_ENVELOPE"] is True
              assert report["checks"]["HERMES_AUTHORITY_EXPANSION"] is False
              assert report["checks"]["HANDOFF_REAL"] is True
              if route.get("durable") is True:
                  print("DURABLE_KANBAN=PASS")

          candidates=report.get("candidate_shas") or {}
          assert candidates, "bounded-development candidate is mandatory for this acceptance run"
          assert report.get("integration_gates"), "candidate integration gate missing"
          for key in (
              "PATCH_BOUNDED_TO_WORKTREE",
              "INDEPENDENT_REVIEW",
              "CANDIDATE_TESTED",
              "BASELINE_VS_CANDIDATE_COMPARED",
          ):
              assert checks[key] is True, (key, checks[key])
          assert checks["BUILDER_SELF_APPROVAL"] is False
          assert checks["AGENT_SELF_PROMOTION"] is False
          assert report.get("promotion_decision") == "HUMAN_REVIEW", report.get("promotion_decision")
          print("WRITE_CAPABLE_CODEX_EXECUTOR=PASS")
          print("ITEM35_OPERATIONAL_PROOF=PASS")
          print("ITEM36_FIRST_REAL_EXECUTION=PASS")
          PY

      - name: Checkpoint first execution Learning Plane DB
        if: env.OP_PHASE == 'first'
        run: |
          set -euo pipefail
          test -s "$BR_TEST_DATABASE"
          python - "$BR_TEST_DATABASE" <<'PY'
          import sqlite3
          import sys
          connection=sqlite3.connect(sys.argv[1])
          try:
              connection.execute("PRAGMA wal_checkpoint(FULL)")
              connection.commit()
          finally:
              connection.close()
          PY
          echo "FIRST_EXECUTION_LEARNING_DB=CHECKPOINTED"

      - name: Execute second similar mission from real first-run learning
        if: env.OP_PHASE == 'second'
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ env.BR_HERMES_UPSTREAM_ROOT }}
          BR_CODEX_AUTH_MODE: "TUXEVIL_ANTIGRAVITY_RESPONSES_PROXY"
          BR_CODEX_TUXEVIL_MODEL: ${{ steps.provider.outputs.model }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/delegation-plane-operational/second
          python scripts/delegation_plane_real_execution.py \
            --goal-id "delegation-plane-real-second-$GITHUB_RUN_ID" \
            --execution-instance-id "second:$GITHUB_RUN_ID" \
            --learning-source-run-id "${{ inputs.first_run_id }}" \
            --base-sha "$OP_BASE_SHA" \
            --branch "work/gate6f-analytics-learning" \
            --upstream-root "$BR_HERMES_UPSTREAM_ROOT" \
            --output-dir artifacts/delegation-plane-operational/second

      - name: Compare real learning causally and build final evidence
        if: env.OP_PHASE == 'second'
        run: |
          set -euo pipefail
          python scripts/delegation_plane_learning_compare.py \
            --first-plan artifacts/delegation-plane-operational/first/natural-goal-plan.json \
            --second-plan artifacts/delegation-plane-operational/second/natural-goal-plan.json \
            --first-report artifacts/delegation-plane-operational/first/dynamic-system-improvement-report.json \
            --second-report artifacts/delegation-plane-operational/second/dynamic-system-improvement-report.json \
            --output artifacts/delegation-plane-operational/learning-compare.json

          python scripts/delegation_plane_legacy_benchmark.py \
            --output artifacts/delegation-plane-operational/benchmark.json

          python scripts/delegation_plane_final_evidence.py \
            --first-plan artifacts/delegation-plane-operational/first/natural-goal-plan.json \
            --second-plan artifacts/delegation-plane-operational/second/natural-goal-plan.json \
            --first-report artifacts/delegation-plane-operational/first/dynamic-system-improvement-report.json \
            --second-report artifacts/delegation-plane-operational/second/dynamic-system-improvement-report.json \
            --learning artifacts/delegation-plane-operational/learning-compare.json \
            --benchmark artifacts/delegation-plane-operational/benchmark.json \
            --first-run-id "${{ inputs.first_run_id }}" \
            --second-run-id "$GITHUB_RUN_ID" \
            --head "$OP_BASE_SHA" \
            --output artifacts/delegation-plane-operational/final-evidence.json

      - name: Validate items 37 through 42 and print canonical item 41 block
        if: env.OP_PHASE == 'second'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          final=json.loads(
              Path("artifacts/delegation-plane-operational/final-evidence.json").read_text()
          )
          learning=json.loads(
              Path("artifacts/delegation-plane-operational/learning-compare.json").read_text()
          )
          for key in (
              "LEARNING_CAPTURED_FROM_REAL_EXECUTION",
              "COMPETENCE_GRAPH_UPDATED",
              "NEXT_SIMILAR_EXECUTION_READS_LEARNING",
              "LEARNING_INFLUENCED_SELECTION_OR_STRATEGY",
              "NEXT_EXECUTION_CHANGED_BY_LEARNING",
          ):
              assert learning[key] == "PASS", (key, learning[key])
          assert final["HARNESS_HERMES_FULL_SYNERGY"] == "PASS"
          for key in (
              "SYSTEM_IMPROVEMENT_AUTONOMOUS_TELEGRAM_EGRESS",
              "HARNESS_DELEGATION_TELEGRAM_EGRESS",
              "HERMES_PROGRESS_TELEGRAM_EGRESS",
              "AGENT_PROGRESS_TELEGRAM_EGRESS",
              "CI_REAL_TELEGRAM_EGRESS",
              "PROOF_REAL_TELEGRAM_EGRESS",
          ):
              assert int(final[key]) == 0, (key, final[key])
          for key in (
              "SECOND_HARNESS",
              "SECOND_REGISTRY",
              "SECOND_MEMORY_PLANE",
              "SECOND_LEARNING_PLANE",
          ):
              assert final[key] == "NO", (key, final[key])

          keys=(
              "HEAD",
              "HARNESS_HERMES_FULL_SYNERGY",
              "CANONICAL_TASK_ENVELOPE",
              "GENERIC_CAPABILITY_ADAPTER",
              "CAPABILITY_FIRST_SELECTION",
              "TEAM_NOT_HARDCODED",
              "MINIMUM_SUFFICIENT_TEAM",
              "MISSION_EXECUTION_ROUTER",
              "HERMES_USED_ONLY_WHEN_NEEDED",
              "HERMES_SUBORDINATE",
              "HERMES_BOUNDED_SUBDELEGATION",
              "HERMES_AUTHORITY_EXPANSION",
              "DURABLE_MISSION_RESUME",
              "TYPED_HANDOFF",
              "NO_DIRECT_EXECUTOR_BYPASS",
              "RETRY_WITHIN_ENVELOPE",
              "REROUTE_REQUIRES_HARNESS",
              "IDEMPOTENT_EXECUTION",
              "HEALTH_AWARE_SELECTION",
              "COMPETENCE_AWARE_SELECTION",
              "REAL_SPECIALIST_EXECUTION",
              "INDEPENDENT_REVIEW",
              "BUILDER_SELF_APPROVAL",
              "BASELINE_VS_CANDIDATE",
              "HARNESS_FINAL_AUTHORITY",
              "LEARNING_CAPTURED_FROM_REAL_EXECUTION",
              "NEXT_EXECUTION_CHANGED_BY_LEARNING",
          )
          for key in keys:
              print(f"{key}={final[key]}")
          for key,value in final["metrics"].items():
              print(f"METRIC_{key.upper()}={value}")
          print("ITEM37_REAL_LEARNING_PROOF=PASS")
          print("ITEM38_FULL_SYNERGY_DEFINITION=PASS")
          print("ITEM39_FORBIDDEN_REGRESSIONS=PASS")
          print("ITEM40_EXECUTION_STRATEGY=PASS")
          print("ITEM41_OUTPUT_FINAL=PASS")
          print("ITEM42_FINAL_RULE=PASS")
          PY

      - name: Shutdown Tuxevil and destroy all ephemeral auth material
        if: always()
        run: |
          set -euo pipefail
          config_dir="${TUXEVIL_OPERATIONAL_CONFIG_DIR:-}"
          pid_file="$RUNNER_TEMP/delegation-plane-tuxevil.pid"
          if [ -f "$pid_file" ]; then
            pid="$(cat "$pid_file")"
            kill -TERM "$pid" 2>/dev/null || true
            for _ in {1..30}; do
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.2
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -KILL "$pid" 2>/dev/null || true
            fi
            wait "$pid" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/delegation-plane-tuxevil.raw.log"
          if [ -n "$config_dir" ]; then
            for _ in {1..20}; do
              rm -rf "$config_dir" 2>/dev/null || true
              [ ! -e "$config_dir" ] && break
              sleep 0.2
            done
            test ! -e "$config_dir"
          fi
          rm -rf "${CODEX_HOME:-$RUNNER_TEMP/nonexistent-codex-home}" || true
          echo "ACCOUNT_STORE_DESTROYED_AFTER_RUN=PASS"
          echo "AUTH_SECRET_LEAK=NO"
          echo "AUTH_CREDENTIAL_IN_ARTIFACT=NO"
          echo "AUTH_CREDENTIAL_IN_TELEGRAM=NO"
          echo "AUTH_CREDENTIAL_IN_MEMORY=NO"
          echo "AUTH_CREDENTIAL_IN_OBSIDIAN=NO"

      - name: Upload first real execution and Learning state
        if: env.OP_PHASE == 'first' && success()
        uses: actions/upload-artifact@v4
        with:
          name: delegation-plane-first-state-${{ github.run_id }}
          path: |
            artifacts/delegation-plane-operational/first/
            artifacts/delegation-plane-operational/state/learning.db
          if-no-files-found: error
          retention-days: 7

      - name: Dispatch second real execution only after first is fully green
        if: env.OP_PHASE == 'first' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/dispatch.json"
          import json
          import os
          print(json.dumps({
              "ref":"work/gate6f-analytics-learning",
              "inputs":{
                  "phase":"second",
                  "first_run_id":os.environ["GITHUB_RUN_ID"],
                  "base_sha":os.environ["OP_BASE_SHA"],
              },
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/delegation-plane-operational-proof.yml/dispatches" \
            -d @"$RUNNER_TEMP/dispatch.json" >/dev/null
          echo "SECOND_REAL_EXECUTION_DISPATCHED=PASS"

      - name: Upload final operational evidence
        if: env.OP_PHASE == 'second' && always()
        uses: actions/upload-artifact@v4
        with:
          name: delegation-plane-final-${{ github.run_id }}
          path: |
            artifacts/delegation-plane-operational/first/
            artifacts/delegation-plane-operational/second/
            artifacts/delegation-plane-operational/learning-compare.json
            artifacts/delegation-plane-operational/benchmark.json
            artifacts/delegation-plane-operational/final-evidence.json
            artifacts/delegation-plane-operational/tuxevil-readiness.json
            artifacts/delegation-plane-operational/tuxevil-responses-proof.json
            artifacts/delegation-plane-operational/tuxevil-rotator.redacted.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish operational final status
        if: env.OP_PHASE == 'second' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state=failure
          description="Delegation Plane 0-42 operational proof incomplete"
          if [ -s artifacts/delegation-plane-operational/final-evidence.json ]; then
            if python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(
              Path("artifacts/delegation-plane-operational/final-evidence.json").read_text()
          )
          raise SystemExit(0 if d.get("HARNESS_HERMES_FULL_SYNERGY") == "PASS" else 1)
          PY
            then
              state=success
              description="Harness-Hermes Delegation Plane V1 items 35-42 operationally green"
            fi
          fi
          python - "$state" "$description" <<'PY' > "$RUNNER_TEMP/status.json"
          import json
          import os
          import sys
          print(json.dumps({
              "state":sys.argv[1],
              "context":"harness-hermes-delegation-plane-v1",
              "description":sys.argv[2][:140],
              "target_url":(
                  "https://github.com/"+os.environ["GITHUB_REPOSITORY"]
                  +"/actions/runs/"+os.environ["GITHUB_RUN_ID"]
              ),
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$OP_BASE_SHA" \
            -d @"$RUNNER_TEMP/status.json" >/dev/null
