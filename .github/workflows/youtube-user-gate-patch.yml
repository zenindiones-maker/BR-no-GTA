name: YouTube User Gate Integration Patch

on:
  push:
    branches:
      - work/gate6f-analytics-learning

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gate6f-analytics-learning
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic user-gate patch
        run: python scripts/apply_youtube_user_gate_patch.py
      - name: Compile affected modules
        run: |
          python -m py_compile \
            app/services/youtube_publication_readiness_service.py \
            app/services/google_youtube_publication_service.py \
            app/services/harness_youtube_publication_service.py \
            app/services/youtube_publication_orchestration.py \
            app/database/youtube_public_transition_repository.py \
            app/integrations/deepseek_harness/server.py
      - name: Install focused test runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run focused MCP publication tests
        run: python -m pytest -q tests/test_deepseek_harness.py -k 'youtube_publication or youtube_pode_postar or youtube_publish'
      - name: Remove one-shot infrastructure
        run: |
          rm -f scripts/apply_youtube_user_gate_patch.py
          rm -f .github/workflows/youtube-user-gate-patch.yml
      - name: Commit and push integrated gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(youtube): integrate user-approved public gate and readiness'
          git push origin HEAD:work/gate6f-analytics-learning
