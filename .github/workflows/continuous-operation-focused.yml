name: Continuous Operation Focused Validation

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/continuous-operation-focused.request.json"

permissions:
  contents: read

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/continuous-focused/focused.db

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project tests
        run: |
          set -euo pipefail
          mkdir -p artifacts/continuous-focused
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile continuous boundaries
        run: |
          set -euo pipefail
          python -m py_compile             app/database/continuous_operation_repository.py             app/services/continuous_operation_policy_service.py             app/services/continuous_intelligence_service.py             app/services/obsidian_memory_service.py             app/services/telegram_conversation_service.py             app/services/hermes_multiagent/evidence.py             scripts/continuous_state_checkpoint.py             scripts/continuous_intelligence_cycle.py
          echo "CONTINUOUS_BOUNDARIES_COMPILE=PASS"

      - name: Run focused continuous tests
        run: |
          set -euo pipefail
          rm -f "$BR_TEST_DATABASE"
          python -m pytest -q             tests/test_continuous_operation.py             tests/test_memory_plane_obsidian.py             tests/test_hermes_multiagent_boundary.py             tests/test_harness_learning_system.py             tests/test_telegram_conversation_control.py             --junitxml=artifacts/continuous-focused/pytest.xml
          echo "CONTINUOUS_FOCUSED_TESTS=PASS"

      - name: Validate no busy-loop and safety policy
        run: |
          set -euo pipefail
          ! grep -R --line-number -E 'while[[:space:]]+true|while[[:space:]]+True'             scripts/continuous_intelligence_cycle.py             app/services/continuous_intelligence_service.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("config/continuous_operation_policy.json").read_text())
          assert p["cadence"]["gta6_delta_scan_seconds"] >= 21600
          assert not any(p["safety"].values())
          assert p["resource_governance"]["max_tasks_per_mission"] <= 12
          assert p["resource_governance"]["max_retries_per_task"] <= 3
          assert p["resource_governance"]["max_reviewer_loops"] <= 3
          print("EVENT_DRIVEN_SCHEDULED_NO_BUSY_LOOP=PASS")
          print("RESOURCE_GOVERNANCE=PASS")
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER=NO")
          print("YOUTUBE_UPLOAD=NO")
          print("YOUTUBE_PUBLICATION=NO")
          PY

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-operation-focused-${{ github.run_id }}
          path: artifacts/continuous-focused/
          if-no-files-found: error
          retention-days: 30
