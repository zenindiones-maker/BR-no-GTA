# Live proof retry after zero-fetch gate fix.
name: Continuous Operation Live Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".github/workflows/continuous-operation-live-proof.yml"

permissions:
  contents: read
  actions: write

env:
  TARGET_REF: work/gate6f-analytics-learning

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout validation revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Dispatch live proof run
        id: proof_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          request_id="live-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          gh workflow run continuous-intelligence-operation.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f mode=proof             -f target_ref="$TARGET_REF"             -f request_id="$request_id"
          echo "LIVE_PROOF_DISPATCH=PASS"

      - name: Wait for live proof run
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.proof_dispatch.outputs.request_id }}
        run: |
          set -euo pipefail
          run_id=""
          expected="Continuous Intelligence $REQUEST_ID proof"
          for _ in $(seq 1 60); do
            run_id="$(gh run list               --repo "$GITHUB_REPOSITORY"               --workflow continuous-intelligence-operation.yml               --branch main               --event workflow_dispatch               --limit 40               --json databaseId,displayTitle               --jq ".[] | select(.displayTitle == \"$expected\") | .databaseId"               | head -n 1)"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]] || { echo "LIVE_PROOF=FAIL child run not found" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          mkdir -p live-evidence/proof live-evidence/proof-state live-evidence/proof-obsidian
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY"             --name "continuous-operation-$run_id" --dir live-evidence/proof
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY"             --name "continuous-operation-state-$run_id" --dir live-evidence/proof-state
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY"             --name "obsidian-memory-export-$run_id" --dir live-evidence/proof-obsidian
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > live-evidence/proof-run.log
          echo "LIVE_PROOF_RUN_ID=$run_id"

      - name: Validate live mission A and in-run mission B
        env:
          PROOF_RUN_ID: ${{ steps.proof.outputs.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          proof=Path("live-evidence/proof/continuous-operation-proof.json")
          d=json.loads(proof.read_text(encoding="utf-8"))
          assert d["status"]=="PASS"
          checks=d["checks"]
          required=[
              "CONTINUOUS_INTELLIGENCE_LOOP",
              "CONTINUOUS_IMPROVEMENT_LOOP",
              "MEMORY_RETRIEVE_BEFORE_EXECUTION",
              "MEMORY_CAPTURE_AFTER_EXECUTION",
              "BOUNDED_MEMORY_CONTEXT",
              "GTA6_DELTA_RESEARCH",
              "GTA6_CLAIM_PROVENANCE",
              "GTA6_FACT_CHECK",
              "GTA6_KNOWLEDGE_PROMOTION_GATE",
              "GTA6_MEMORY_CREATED",
              "GTA6_MEMORY_RETRIEVED_NEXT_RUN",
              "DUPLICATE_RESEARCH_AVOIDED",
              "SOURCE_PROVENANCE_PRESERVED",
              "REAL_AGENTS_EXECUTED",
              "HERMES_COLLABORATION",
              "AGENT_HANDOFFS",
              "AGENT_REVIEW_LOOP_BOUNDED",
              "COMPETENCE_GRAPH_UPDATED_FROM_REAL_RUN",
              "ROUTING_USES_OBSERVED_COMPETENCE",
              "FAILURE_MEMORY_RETRIEVAL",
              "FAILURE_RECURRENCE_PREVENTION",
              "REAL_SYSTEM_PROBLEM_OBSERVED",
              "BASELINE_MEASURED",
              "IMPROVEMENT_CANDIDATE_CREATED",
              "CANDIDATE_OPERATIONALLY_TESTED",
              "BASELINE_VS_CANDIDATE_COMPARED",
              "NEXT_REAL_EXECUTION_CHANGED",
              "NO_REGRESSION",
              "OBSIDIAN_KNOWLEDGE_PROJECTION",
              "OBSIDIAN_LEARNING_PROJECTION",
              "OBSIDIAN_AGENT_COMPETENCE_PROJECTION",
              "TELEGRAM_OBSIDIAN_CANONICAL_CONTINUITY",
              "SINGLE_CANONICAL_MEMORY_PLANE",
              "LEARNING_PLANE_AUTHORITY_PRESERVED",
              "DEEPSEEK_HARNESS_AUTHORITY_PRESERVED",
              "TERMUX_HEAVY_PROCESSING",
          ]
          for key in required:
              assert checks.get(key) is True, (key, checks.get(key))

          baseline=d["baseline"]
          research=baseline["research"]["result"]
          next_run=d["next_related_execution"]
          next_research=next_run["research"]["result"]
          assert research["status"]=="PASS"
          assert int(research["source_fetch_count"]) > 0
          assert research["candidate_claims"]
          assert all(c["source_type"]=="PRIMARY_SOURCE" for c in research["candidate_claims"])
          assert all(c["evidence_class"]=="OFFICIAL" for c in research["candidate_claims"])
          assert baseline["canonical"]["success"] is True
          assert baseline["episode_ids"]
          assert d["knowledge_promotions"]
          assert any(x["status"]=="PROMOTED" for x in d["knowledge_promotions"])
          assert next_research["status"]=="NO_MEANINGFUL_GTA6_DELTA"
          assert int(next_research["source_fetch_count"]) == 0
          assert int(next_research["memory_hit_count"]) > 0
          assert next_research["duplicate_research_avoided"] is True
          assert research["source_state"]["content_fingerprint"] == next_research["source_state"]["content_fingerprint"]
          assert d["evaluation"]["evaluation_mode"]=="OBSERVED"
          assert d["improvement_candidate"]["candidate_id"]
          assert d["NEW_VOICE_SYNTHESIS"]=="NO"
          assert d["FULL_RENDER"]=="NO"
          assert d["YOUTUBE_UPLOAD"]=="NO"
          assert d["YOUTUBE_PUBLICATION"]=="NO"
          assert Path("live-evidence/proof-state/state-manifest.json").is_file()
          proof_log=Path("live-evidence/proof-run.log").read_text(errors="replace")
          assert "TELEGRAM_ACTION_FIRST_REPORT=PASS" in proof_log

          print("LIVE_GTA6_MISSION_A=PASS")
          print("REAL_OFFICIAL_SOURCE_FETCH=PASS")
          print("SOURCE_PROVENANCE_PRESERVED=PASS")
          print("GTA6_CLAIM_CREATED=PASS")
          print("GTA6_FACT_CHECK=PASS")
          print("GTA6_KNOWLEDGE_PROMOTION_GATE=PASS")
          print("HARNESS_EPISODE_CAPTURE=PASS")
          print("HERMES_REAL_EXECUTION=PASS")
          print("COMPETENCE_GRAPH_UPDATED_FROM_REAL_RUN=PASS")
          print("MEMORY_RETRIEVED_BEFORE_SECOND_RUN=PASS")
          print("GTA6_MEMORY_RETRIEVED_NEXT_RUN=PASS")
          print("SOURCE_FINGERPRINT_REUSED=PASS")
          print("NO_MEANINGFUL_GTA6_DELTA=PASS")
          print("DUPLICATE_RESEARCH_AVOIDED=PASS")
          print("FAILURE_MEMORY_RETRIEVAL=PASS")
          print("FAILURE_RECURRENCE_PREVENTION=PASS")
          print("REAL_SYSTEM_PROBLEM_OBSERVED=PASS")
          print("BASELINE_MEASURED=PASS")
          print("IMPROVEMENT_CANDIDATE_CREATED=PASS")
          print("CANDIDATE_OPERATIONALLY_TESTED=PASS")
          print("BASELINE_VS_NEXT_EXECUTION_COMPARED=PASS")
          print("NEXT_REAL_EXECUTION_CHANGED=PASS")
          print("NO_REGRESSION=PASS")
          print("OBSIDIAN_KNOWLEDGE_PROJECTION=PASS")
          print("OBSIDIAN_LEARNING_PROJECTION=PASS")
          print("OBSIDIAN_AGENT_COMPETENCE_PROJECTION=PASS")
          print("TELEGRAM_OBSIDIAN_CANONICAL_CONTINUITY=PASS")
          print("PROOF_RUN_ID="+os.environ["PROOF_RUN_ID"])
          PY

      - name: Dispatch next-run scheduled cycle
        id: scheduled_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          request_id="cross-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          gh workflow run continuous-intelligence-operation.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f mode=scheduled             -f target_ref="$TARGET_REF"             -f request_id="$request_id"
          echo "CROSS_RUN_SCHEDULED_DISPATCH=PASS"

      - name: Wait for scheduled next-run
        id: scheduled
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.scheduled_dispatch.outputs.request_id }}
        run: |
          set -euo pipefail
          run_id=""
          expected="Continuous Intelligence $REQUEST_ID scheduled"
          for _ in $(seq 1 60); do
            run_id="$(gh run list               --repo "$GITHUB_REPOSITORY"               --workflow continuous-intelligence-operation.yml               --branch main               --event workflow_dispatch               --limit 40               --json databaseId,displayTitle               --jq ".[] | select(.displayTitle == \"$expected\") | .databaseId"               | head -n 1)"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]] || { echo "CROSS_RUN=FAIL scheduled child run not found" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
          mkdir -p live-evidence/scheduled live-evidence/scheduled-state
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY"             --name "continuous-operation-$run_id" --dir live-evidence/scheduled
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY"             --name "continuous-operation-state-$run_id" --dir live-evidence/scheduled-state
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > live-evidence/scheduled-run.log
          echo "SCHEDULED_RUN_ID=$run_id"

      - name: Validate cross-run durability and scheduled short-circuit
        env:
          PROOF_RUN_ID: ${{ steps.proof.outputs.run_id }}
          SCHEDULED_RUN_ID: ${{ steps.scheduled.outputs.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          proof=json.loads(Path("live-evidence/proof/continuous-operation-proof.json").read_text())
          scheduled=json.loads(Path("live-evidence/scheduled/continuous-cycle.json").read_text())
          log=Path("live-evidence/scheduled-run.log").read_text(errors="replace")
          assert scheduled["status"]=="PASS"
          assert scheduled["checks"]["SCHEDULED_ENTRYPOINT_CONTRACT"] is True
          assert "CONTINUOUS_STATE_RESTORE=RESTORED" in log
          gta=scheduled["gta6"]
          assert gta is not None
          research=gta["research"]["result"]
          assert research["status"]=="NO_MEANINGFUL_GTA6_DELTA"
          assert int(research["source_fetch_count"]) == 0
          assert int(research["memory_hit_count"]) > 0
          assert research["duplicate_research_avoided"] is True
          baseline=proof["baseline"]["research"]["result"]
          assert baseline["source_state"]["content_fingerprint"] == research["source_state"]["content_fingerprint"]
          assert research["known_state"]
          assert scheduled["failure_prevention"]["FAILURE_MEMORY_RETRIEVAL"]=="PASS"
          assert scheduled["failure_prevention"]["FAILURE_RECURRENCE_PREVENTION"]=="PASS"
          assert scheduled["CONTINUOUS_INTELLIGENCE_LOOP"]=="PASS"
          assert scheduled["CONTINUOUS_IMPROVEMENT_LOOP"]=="PASS"
          assert scheduled["TERMUX_HEAVY_PROCESSING"]=="NO"
          assert scheduled["NEW_VOICE_SYNTHESIS"]=="NO"
          assert scheduled["FULL_RENDER"]=="NO"
          assert scheduled["YOUTUBE_UPLOAD"]=="NO"
          assert scheduled["YOUTUBE_PUBLICATION"]=="NO"
          proof_state=json.loads(Path("live-evidence/proof-state/state-manifest.json").read_text())
          scheduled_state=json.loads(Path("live-evidence/scheduled-state/state-manifest.json").read_text())
          assert proof_state["canonical_memory_plane"]=="BR_SQLITE"
          assert scheduled_state["canonical_memory_plane"]=="BR_SQLITE"
          assert proof_state["artifact_is_second_memory_plane"] is False
          assert scheduled_state["artifact_is_second_memory_plane"] is False

          print("SCHEDULED_ENTRYPOINT_CONTRACT=PASS")
          print("CROSS_RUN_DURABLE_MEMORY=PASS")
          print("CANONICAL_CHECKPOINT_RESTORED=PASS")
          print("KNOWLEDGE_SURVIVES_NEW_RUNNER=PASS")
          print("GTA6_MEMORY_RETRIEVED_NEXT_RUN=PASS")
          print("SOURCE_FINGERPRINT_REUSED=PASS")
          print("NO_MEANINGFUL_GTA6_DELTA=PASS")
          print("DUPLICATE_RESEARCH_AVOIDED=PASS")
          print("FAILURE_MEMORY_RETRIEVAL=PASS")
          print("FAILURE_RECURRENCE_PREVENTION=PASS")
          print("CONTINUOUS_INTELLIGENCE_LOOP=PASS")
          print("CONTINUOUS_IMPROVEMENT_LOOP=PASS")
          print("DEEPSEEK_HARNESS_AUTHORITY_PRESERVED=PASS")
          print("LEARNING_PLANE_AUTHORITY_PRESERVED=PASS")
          print("SINGLE_CANONICAL_MEMORY_PLANE=PASS")
          print("TERMUX_HEAVY_PROCESSING=NO")
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER=NO")
          print("YOUTUBE_UPLOAD=NO")
          print("YOUTUBE_PUBLICATION=NO")
          print("PROOF_RUN_ID="+os.environ["PROOF_RUN_ID"])
          print("SCHEDULED_RUN_ID="+os.environ["SCHEDULED_RUN_ID"])
          PY

      - name: Upload live proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuous-live-proof-${{ github.run_id }}
          path: live-evidence/
          if-no-files-found: warn
          retention-days: 30
