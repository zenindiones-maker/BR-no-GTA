name: VIDEO A Render Profile Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-vedit-benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'run VIDEO A render benchmark')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: video-engine/backend:.
      HANDOFF_ARTIFACT_ID: "10525757299"
      HANDOFF_PRODUCER_RUN_ID: "35289539299"
      YTDLP_COOKIES_FILE: runtime/secrets/youtube-cookies.txt
      YTDLP_PO_TOKEN_BASE_URL: http://127.0.0.1:4416
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
          python -m pip install -U "yt-dlp[default]"
          python -m pip install -U "bgutil-ytdlp-pot-provider==1.3.1"
          python -m pip install "edge-tts==7.2.8"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Start YouTube PO Token provider
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git runtime/bgutil-ytdlp-pot-provider
          cd runtime/bgutil-ytdlp-pot-provider/server
          deno install --allow-scripts=npm:canvas --frozen
          cd node_modules
          export DENO_NO_PROMPT=1
          nohup deno run --no-prompt --allow-env --allow-net --allow-ffi=. --allow-read=. ../src/main.ts --port 4416 > ../provider.log 2>&1 &
          echo $! > ../provider.pid
          sleep 5
          kill -0 "$(cat ../provider.pid)"

      - name: Prepare YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_COOKIES"
          mkdir -p runtime/secrets
          printf '%s' "$YOUTUBE_COOKIES" > runtime/secrets/youtube-cookies.txt
          chmod 600 runtime/secrets/youtube-cookies.txt

      - name: Download exact governed VIDEO A RenderJob
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ env.HANDOFF_ARTIFACT_ID }}
          run-id: ${{ env.HANDOFF_PRODUCER_RUN_ID }}
          github-token: ${{ github.token }}
          path: runtime/video-a-benchmark/handoff
          merge-multiple: true

      - name: Execute real baseline and candidate through VEdit and FFmpeg
        run: |
          set -euo pipefail
          python scripts/run_video_a_render_profile_benchmark.py             --render-job runtime/video-a-benchmark/handoff/render-job.json             --asset-root runtime/video-a-benchmark/assets             --output-dir runtime/video-a-benchmark/results

      - name: Validate observed benchmark
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("runtime/video-a-benchmark/results/benchmark-evidence.json")
          d=json.loads(p.read_text())
          assert d["observed"] is True
          assert d["source_incident"]["run_id"] == 35289594486
          assert d["baseline"]["observed"] is True
          assert d["candidate"]["observed"] is True
          assert d["baseline"]["qa_status"] == "PASS"
          assert d["candidate"]["qa_status"] == "PASS"
          assert d["promotion_performed"] is False
          assert d["regression_evidence"]["observed"] is True
          print("REAL_BASELINE_VS_CANDIDATE=PASS")
          print("OBSERVED_EVALUATION_INPUT=PASS")
          print("PROMOTION_PERFORMED=NO")
          print("DECISION="+d["decision"])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-a-render-profile-benchmark
          path: |
            runtime/video-a-benchmark/results/
            runtime/bgutil-ytdlp-pot-provider/server/provider.log
          if-no-files-found: warn
          retention-days: 30

# Manual benchmark trigger marker.
