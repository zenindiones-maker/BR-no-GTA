name: BR_OWNER_V1 Human Audition Pack

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/dev/br-owner-v1-human-audition-v2

concurrency:
  group: br-owner-v1-human-audition-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: Human audition pack contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      audition_requested: ${{ steps.request.outputs.requested }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -q pytest packaging "python-dotenv==1.2.3"
      - name: Validate request
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          if [ ! -f .run/br-owner-v1-human-audition.request.json ]; then
            echo "AUDITION_REQUEST_PRESENT=false"
            exit 0
          fi
          echo "AUDITION_REQUEST_PRESENT=true"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path(".run/br-owner-v1-human-audition.request.json").read_text())
          assert d["schema_version"]=="OwnerVoiceHumanAuditionRequest/v1"
          assert d["voice_identity_id"]=="BR_OWNER_V1"
          assert d["blind_review"] is True
          assert d["send_real_reference"] is True
          assert d["generic_voice_fallback"] is False
          PY
      - name: Prove audition handoff and delivery contracts
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_owner_voice_audition_handoff_v1.py             tests/test_owner_voice_audition_delivery_v1.py             tests/test_owner_voice_audition_delivery_durable_v3.py             tests/test_owner_voice_audition_ledger_authority.py             tests/test_owner_voice_audition_ledger_store_integration.py             tests/test_owner_voice_audition_outbox_semantics.py             tests/test_owner_voice_audition_workflow_v1.py             tests/test_owner_voice_human_audition_pack_service.py                          tests/test_owner_voice_chatterbox_ptbr_audition.py             tests/test_owner_voice_chatterbox_dependency_contract.py                                       tests/test_owner_voice_reference_qa.py             tests/test_owner_voice_audition_performance_v1.py             tests/test_owner_voice_speaker_identity_service.py             tests/test_owner_voice_single_clone_delivery_v1.py             tests/test_owner_voice_single_clone_workflow_v1.py
      - name: Detect explicit audition request
        id: request
        run: |
          if [ -f .run/br-owner-v1-human-audition.request.json ]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi

  audition:
    name: Generate and deliver real-reference plus blind A-B-C
    needs: contract
    if: ${{ github.event_name == 'workflow_dispatch' || needs.contract.outputs.audition_requested == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 120
    env:
      BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64: ${{ secrets.BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64 }}
      BR_OWNER_TELEGRAM_REFERENCE_INDEX: ${{ secrets.BR_OWNER_TELEGRAM_REFERENCE_INDEX }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BR_OWNER_AUDITION_AUTHORITY_REF: owner-explicit:BR_OWNER_V1_PROFESSIONAL_PTBR_V1
      BR_OWNER_AUDITION_LEDGER_REPOSITORY: zenindiones-maker/BR-no-GTA-audition-ledger
      TOKENIZERS_PARALLELISM: "false"
      BR_OWNER_STT_MODEL: large-v3-turbo
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: integrations/chatterbox-ptbr/constraints.txt

      - name: Initialize performance clock and public cache root
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/br-owner-voice/hf-public"
          {
            echo "AUDITION_MONOTONIC_START=$(python -c 'import time; print(time.monotonic())')"
            echo "BR_OWNER_PUBLIC_MODEL_CACHE=$HOME/.cache/br-owner-voice/hf-public"
            echo "HF_HOME=$HOME/.cache/br-owner-voice/hf-public/huggingface"
            echo "BR_OWNER_AUDITION_PERFORMANCE_RECEIPT=$RUNNER_TEMP/br-owner-audition-public/owner-voice-performance-receipt.json"
          } >> "$GITHUB_ENV"

      - name: Preflight required audition secrets
        env:
          BR_OWNER_AUDITION_LEDGER_SSH_KEY: ${{ secrets.BR_OWNER_AUDITION_LEDGER_SSH_KEY }}
        run: |
          set -euo pipefail
          PREFLIGHT_T0="$(python -c 'import time; print(time.monotonic())')"
          telegram=false
          reference=false
          ledger=false
          test -n "${TELEGRAM_BOT_TOKEN:-}" && telegram=true
          if [ -n "${BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64:-}" ] || [ -n "${BR_OWNER_TELEGRAM_REFERENCE_INDEX:-}" ]; then reference=true; fi
          test -n "${BR_OWNER_AUDITION_LEDGER_SSH_KEY:-}" && ledger=true
          echo "TELEGRAM_BOT_TOKEN_PRESENT=$telegram"
          echo "OWNER_REFERENCE_ENVELOPE_PRESENT=$reference"
          echo "AUDITION_LEDGER_KEY_PRESENT=$ledger"
          if [ "$telegram" != true ] || [ "$reference" != true ] || [ "$ledger" != true ]; then
            echo "FAILED_STEP=secret_preflight"
            echo "FAILURE_CLASS=REQUIRED_SECRET_ABSENT"
            echo "EXPECTED=telegram_token_reference_envelope_or_index_and_ledger_key_present"
            echo "OBSERVED=telegram:$telegram reference:$reference ledger:$ledger"
            echo "ROOT_CAUSE=required_audition_secret_not_materialized"
            echo "NEXT_CAUSAL_ACTION=materialize_only_the_missing_secret_then_redispatch"
            exit 42
          fi
          echo "AUDITION_SECRET_PREFLIGHT=PASS"
          PREFLIGHT_T1="$(python -c 'import time; print(time.monotonic())')"
          python - "$PREFLIGHT_T0" "$PREFLIGHT_T1" <<'PY' >> "$GITHUB_ENV"
          import sys
          print(f"SECRET_PREFLIGHT_SECONDS={float(sys.argv[2])-float(sys.argv[1]):.6f}")
          PY

      - name: Establish run-scoped private workspace
        run: |
          set -euo pipefail
          BR_OWNER_AUDITION_WORKSPACE="$RUNNER_TEMP/br-owner-voice/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          BR_OWNER_AUDITION_DELIVERY_PATH="$BR_OWNER_AUDITION_WORKSPACE/delivery.json"
          BR_OWNER_REFERENCE_QA_CONTEXT="$BR_OWNER_AUDITION_WORKSPACE/reference-qa-context.json"
          BR_OWNER_AUDITION_MACHINE_QA_PATH="$BR_OWNER_AUDITION_WORKSPACE/machine-audition-qa.json"
          BR_OWNER_AUDITION_TERMINAL_RECEIPT="$RUNNER_TEMP/br-owner-audition-public/owner-voice-audition-delivery-receipt.json"
          mkdir -p "$BR_OWNER_AUDITION_WORKSPACE" "$(dirname "$BR_OWNER_AUDITION_TERMINAL_RECEIPT")"
          chmod 700 "$BR_OWNER_AUDITION_WORKSPACE"
          {
            echo "BR_OWNER_AUDITION_WORKSPACE=$BR_OWNER_AUDITION_WORKSPACE"
            echo "BR_OWNER_AUDITION_DELIVERY_PATH=$BR_OWNER_AUDITION_DELIVERY_PATH"
            echo "BR_OWNER_REFERENCE_QA_CONTEXT=$BR_OWNER_REFERENCE_QA_CONTEXT"
            echo "BR_OWNER_AUDITION_MACHINE_QA_PATH=$BR_OWNER_AUDITION_MACHINE_QA_PATH"
            echo "BR_OWNER_AUDITION_TERMINAL_RECEIPT=$BR_OWNER_AUDITION_TERMINAL_RECEIPT"
          } >> "$GITHUB_ENV"
          echo "RUN_SCOPED_WORKSPACE=PASS"

      - name: Restore exact public model cache
        id: public-model-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/br-owner-voice/hf-public
          key: br-owner-voice-public-${{ runner.os }}-${{ runner.arch }}-py312-fw1.2.0-av18-stt-${{ env.BR_OWNER_STT_MODEL }}-cb-5de7a54aa4e5e2baadb0182dde554908b48b85c2-ptbr-b3952f18bc2eaa72b9bd7c17d2c4653bcad4770d-base-521c606e9b27ca0ec9049c934100d0592119f381-${{ hashFiles('integrations/chatterbox-ptbr/constraints.txt') }}

      - name: Configure exact cache mode
        run: |
          set -euo pipefail
          CACHE_HIT="${{ steps.public-model-cache.outputs.cache-hit }}"
          if [ "$CACHE_HIT" = "true" ]; then
            OFFLINE=1
          else
            CACHE_HIT=false
            OFFLINE=0
          fi
          {
            echo "PUBLIC_MODEL_CACHE_HIT=$CACHE_HIT"
            echo "HF_HUB_OFFLINE=$OFFLINE"
          } >> "$GITHUB_ENV"
          echo "PUBLIC_MODEL_CACHE_HIT=$CACHE_HIT"

      - name: Mask private Telegram provenance
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from app.services.owner_voice_telegram_handoff_service import parse_reference_envelope_b64
          envelope=(os.environ.get("BR_OWNER_TELEGRAM_REFERENCE_ENVELOPE_B64") or "").strip()
          legacy=(os.environ.get("BR_OWNER_TELEGRAM_REFERENCE_INDEX") or "").strip()
          if envelope:
              index=parse_reference_envelope_b64(envelope)
          elif legacy:
              index=json.loads(legacy)
          else:
              raise SystemExit("OWNER_TELEGRAM_REFERENCE_INDEX_NOT_MATERIALIZED")
          for row in index.get("references") or []:
              for key in ("telegram_file_id","telegram_file_unique_id","telegram_user_id","telegram_chat_id","telegram_message_id","telegram_update_id"):
                  value=str(row.get(key) or "").strip()
                  if value:
                      print(f"::add-mask::{value}")
          PY
          test -n "${TELEGRAM_BOT_TOKEN:-}"

      - name: Install strong private STT runtime
        run: |
          set -euo pipefail
          STT_SETUP_T0="$(python -c 'import time; print(time.monotonic())')"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get install -y -qq ffmpeg
          fi
          python -m venv /tmp/br-owner-stt-venv
          timeout 300 /tmp/br-owner-stt-venv/bin/python -m pip install \
            --disable-pip-version-check --prefer-binary --progress-bar off \
            "faster-whisper==1.2.0" "av==18.0.0" "requests>=2.32,<3"
          /tmp/br-owner-stt-venv/bin/python -m pip check
          /tmp/br-owner-stt-venv/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import math, struct, tempfile, wave
          from faster_whisper.audio import decode_audio
          av_version=version("av")
          fw_version=version("faster-whisper")
          major=int(av_version.split(".",1)[0])
          assert av_version=="18.0.0"
          assert fw_version=="1.2.0"
          assert major<19
          with tempfile.TemporaryDirectory(prefix="fw-decode-canary-") as td:
              p=Path(td)/"canary.wav"
              rate=16000
              frames=[int(1200*math.sin(2*math.pi*440*(i/rate))) for i in range(rate//5)]
              with wave.open(str(p),"wb") as out:
                  out.setnchannels(1); out.setsampwidth(2); out.setframerate(rate)
                  out.writeframes(b"".join(struct.pack("<h",x) for x in frames))
              decoded=decode_audio(str(p),sampling_rate=rate)
              assert getattr(decoded,"size",len(decoded))>0
          print("FASTER_WHISPER_VERSION="+fw_version)
          print("PYAV_VERSION="+av_version)
          print("PYAV_MAJOR_LT_19=TRUE")
          print("STT_AUDIO_DECODE_COMPATIBILITY=PASS")
          PY
          echo "STT_RUNTIME_INSTALL=PASS"
          STT_SETUP_T1="$(python -c 'import time; print(time.monotonic())')"
          python - "$STT_SETUP_T0" "$STT_SETUP_T1" <<'PY' >> "$GITHUB_ENV"
          import sys
          print(f"STT_RUNTIME_SETUP_SECONDS={float(sys.argv[2])-float(sys.argv[1]):.6f}")
          PY

      - name: Quality-rank real Telegram owner references with strong ASR
        env:
          PYTHONPATH: ${{ github.workspace }}
          BR_OWNER_AUDITION_LEDGER_SSH_KEY: ${{ secrets.BR_OWNER_AUDITION_LEDGER_SSH_KEY }}
        run: |
          set -euo pipefail
          /tmp/br-owner-stt-venv/bin/python scripts/owner_voice_reference_qa.py

      - name: Install isolated pinned Chatterbox PT-BR runtime
        run: |
          set -euo pipefail
          CHATTERBOX_SETUP_T0="$(python -c 'import time; print(time.monotonic())')"
          python -m venv /tmp/br-owner-chatterbox-venv
          PY=/tmp/br-owner-chatterbox-venv/bin/python
          CONSTRAINTS=integrations/chatterbox-ptbr/constraints.txt
          "$PY" -m pip install --disable-pip-version-check -q             --constraint "$CONSTRAINTS"             numpy librosa s3tokenizer torch torchaudio transformers diffusers conformer safetensors             spacy-pkuseg pykakasi gradio pyloudnorm omegaconf             "resemble-perth @ git+https://github.com/resemble-ai/Perth.git@ff1c8ac55a976971245cdd53c18d6131ca00d993"
          "$PY" -m pip install --disable-pip-version-check -q --no-deps             "git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2"
          "$PY" -m pip check
          echo "CHATTERBOX_DEPENDENCY_CHECK=PASS"
          CHATTERBOX_SETUP_T1="$(python -c 'import time; print(time.monotonic())')"
          python - "$CHATTERBOX_SETUP_T0" "$CHATTERBOX_SETUP_T1" <<'PY' >> "$GITHUB_ENV"
          import sys
          print(f"CHATTERBOX_RUNTIME_SETUP_SECONDS={float(sys.argv[2])-float(sys.argv[1]):.6f}")
          PY

      - name: Record compute backend
        run: |
          set -euo pipefail
          /tmp/br-owner-chatterbox-venv/bin/python - <<'PY'
          import os, shutil, torch
          cpu=os.cpu_count() or 0
          mem_kb=0
          with open("/proc/meminfo","r",encoding="utf-8") as stream:
              for line in stream:
                  if line.startswith("MemAvailable:"):
                      mem_kb=int(line.split()[1]); break
          disk=shutil.disk_usage(os.environ.get("RUNNER_TEMP") or "/tmp")
          print("COMPUTE_BACKEND=GITHUB_ACTIONS")
          print(f"CPU_COUNT={cpu}")
          print(f"RAM_AVAILABLE_GB={mem_kb/1024/1024:.2f}")
          print("CUDA_AVAILABLE="+("TRUE" if torch.cuda.is_available() else "FALSE"))
          print(f"DISK_AVAILABLE_GB={disk.free/1024/1024/1024:.2f}")
          PY
          echo "STT_MODEL_DOWNLOAD_COUNT=${STT_MODEL_DOWNLOAD_COUNT:-}"
          echo "STT_NETWORK_DOWNLOAD_COUNT=${STT_NETWORK_DOWNLOAD_COUNT:-}"

      - name: Generate three comparable BR_OWNER_V1 candidates
        id: generate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          /tmp/br-owner-chatterbox-venv/bin/python scripts/owner_voice_chatterbox_ptbr_audition.py

      - name: Machine pre-screen and send protected blind pack to Telegram
        env:
          PYTHONPATH: ${{ github.workspace }}
          BR_OWNER_AUDITION_LEDGER_SSH_KEY: ${{ secrets.BR_OWNER_AUDITION_LEDGER_SSH_KEY }}
          BR_OWNER_AUDITION_MANIFEST_PATH: ${{ steps.generate.outputs.manifest_path }}
          BR_OWNER_AUDITION_PACK_ID: ${{ steps.generate.outputs.pack_id }}
          BR_OWNER_AUDITION_DELIVERY_PATH: ${{ env.BR_OWNER_AUDITION_DELIVERY_PATH }}
          BR_OWNER_AUDITION_TERMINAL_RECEIPT: ${{ env.BR_OWNER_AUDITION_TERMINAL_RECEIPT }}
        run: |
          set -euo pipefail
          /tmp/br-owner-stt-venv/bin/python scripts/owner_voice_human_audition_pack.py
          echo "VOICE_IDENTITY_HUMAN_GATE=PENDING"
          echo "PTBR_ACCENT_HUMAN_GATE=PENDING"
          echo "NATURALNESS_HUMAN_GATE=PENDING"
          echo "OWNER_VOICE_RUNTIME=BLOCKED_PENDING_HUMAN_REVIEW"

      - name: Persist performance receipt
        if: ${{ always() }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python scripts/owner_voice_performance_receipt.py

      - name: Persist sanitized terminal or failure receipt
        if: ${{ always() }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          BR_OWNER_AUDITION_LEDGER_SSH_KEY: ${{ secrets.BR_OWNER_AUDITION_LEDGER_SSH_KEY }}
          BR_OWNER_AUDITION_MANIFEST_PATH: ${{ steps.generate.outputs.manifest_path }}
          BR_OWNER_AUDITION_PACK_ID: ${{ steps.generate.outputs.pack_id }}
          BR_OWNER_AUDITION_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          /tmp/br-owner-stt-venv/bin/python scripts/owner_voice_audition_terminal_receipt.py

      - name: Upload sanitized receipt only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-owner-v1-human-audition-delivery-receipt
          path: ${{ env.BR_OWNER_AUDITION_TERMINAL_RECEIPT }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload sanitized performance receipt only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: br-owner-v1-human-audition-performance-receipt
          path: ${{ env.BR_OWNER_AUDITION_PERFORMANCE_RECEIPT }}
          if-no-files-found: error
          retention-days: 3

      - name: Verify private audio never entered repository or public artifact
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all -- '*.wav' '*.flac' '*.ogg' '*.oga' '*.opus' '*.mp3' '*.m4a' '*.pt')"
          test -z "$(find "$(dirname "$BR_OWNER_AUDITION_TERMINAL_RECEIPT")" -type f \( -name '*.wav' -o -name '*.flac' -o -name '*.ogg' -o -name '*.opus' -o -name '*.mp3' -o -name '*.m4a' -o -name '*.pt' \) -print 2>/dev/null)"
          echo "RAW_OWNER_AUDIO_IN_GIT=0"
          echo "RAW_OWNER_AUDIO_IN_PUBLIC_ARTIFACT=0"
          echo "CLONE_AUDIO_IN_PUBLIC_ARTIFACT=0"

      - name: Remove ephemeral owner biometric and clone material
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -rf "$BR_OWNER_AUDITION_WORKSPACE" /tmp/br-owner-stt-venv /tmp/br-owner-chatterbox-venv
          echo "OWNER_EPHEMERAL_PRIVATE_MATERIAL_CLEANED=PASS"
