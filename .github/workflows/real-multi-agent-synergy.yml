name: Real Multi-Agent Synergy Proof

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - '.github/workflows/real-multi-agent-synergy.yml'
      - '.run001/real-multi-agent-synergy.request.json'
      - 'scripts/prepare_system_synergy_opencode_profile.py'
      - 'scripts/prove_real_multi_agent_synergy.py'
      - 'scripts/gta6_fresh_research_worker.py'
      - 'app/services/gta6_brain_harness_service.py'
      - 'app/services/youtube_department_service.py'
      - 'app/services/youtube_role_context_service.py'
      - 'app/services/script_generator_service.py'
      - 'app/services/harness_collaboration_service.py'
      - 'app/services/harness_learning_service.py'
      - 'app/services/opencode_executor_profile_service.py'
      - 'app/services/opencode_native_ai_provider.py'
      - 'app/services/harness_ai_provider_service.py'
      - 'app/services/performance_telemetry_service.py'
      - 'scripts/youtube_product_quality_e2e.py'
      - 'scripts/github_run_watcher.py'
      - 'scripts/local_deterministic_integration_gate.py'
      - 'scripts/semantic_smoke_gate.py'
      - 'scripts/fast_prelive_gate.py'
      - 'scripts/hydrate_promoted_opencode_profile.py'
      - 'scripts/summarize_performance_trace.py'
      - 'app/database/e2e_stage_checkpoint_repository.py'
      - 'app/services/e2e_stage_spec_service.py'
      - 'app/services/e2e_stage_checkpoint_service.py'
      - 'scripts/restore_e2e_resume_state.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: real-multi-agent-synergy
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      BR_TEST_DATABASE: ${{ github.workspace }}/runtime/real-multi-agent-synergy/mission.db
      GH_TOKEN: ${{ github.token }}
      GITHUB_ACTIONS_REPOSITORY: ${{ github.repository }}
      BR_OPENCODE_NATIVE_REPOSITORY: ${{ github.repository }}
      BR_OPENCODE_NATIVE_REF: ${{ github.ref_name }}
      BR_OPENCODE_NATIVE_SOURCE_SHA: ${{ github.sha }}
      BR_OPENCODE_NATIVE_POLL_INTERVAL: "2"
      BR_OPENCODE_NATIVE_RUN_TIMEOUT: "900"
      BR_OPENCODE_NATIVE_EXECUTION_MODE: "same_runner"
      BR_OPENCODE_NATIVE_ARTIFACT_ROOT: runtime/real-multi-agent-synergy/opencode-artifacts
      BR_PERFORMANCE_TRACE_FILE: runtime/real-multi-agent-synergy/performance-trace.jsonl
      BR_PERFORMANCE_TRACE_ID: "github:${{ github.run_id }}:${{ github.run_attempt }}"
      BR_E2E_RESEARCH_FRESHNESS_SECONDS: "900"
      BR_E2E_FORCE_FULL: "${{ contains(github.event.head_commit.message, '[full-proof]') }}"

    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore versioned Python runtime
        id: synergy_python_runtime
        uses: actions/cache/restore@v4
        with:
          path: .venv-synergy
          key: synergy-python-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements.txt', 'requirements/**/*.txt', 'pyproject.toml') }}

      - name: Build or validate versioned Python runtime
        env:
          PYTHON_RUNTIME_CACHE_HIT: ${{ steps.synergy_python_runtime.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$PYTHON_RUNTIME_CACHE_HIT" != "true" ]; then
            rm -rf .venv-synergy
            python -m venv .venv-synergy
            .venv-synergy/bin/python -m pip install --upgrade pip
            .venv-synergy/bin/python -m pip install -r requirements.txt
          fi
          .venv-synergy/bin/python - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"PYTHON_VERSION_MISMATCH:{sys.version}")
          import requests, pydantic
          print("PYTHON_RUNTIME=PASS")
          PY
          echo "$PWD/.venv-synergy/bin" >> "$GITHUB_PATH"
          echo "PYTHON_RUNTIME_CACHE_HIT=$PYTHON_RUNTIME_CACHE_HIT"

      - name: Persist versioned Python runtime cache
        if: steps.synergy_python_runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .venv-synergy
          key: synergy-python-v1-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements.txt', 'requirements/**/*.txt', 'pyproject.toml') }}

      - name: Record Python cache status
        env:
          PYTHON_RUNTIME_CACHE_HIT: ${{ steps.synergy_python_runtime.outputs.cache-hit }}
        run: |
          echo "BR_PYTHON_RUNTIME_CACHE_HIT=${PYTHON_RUNTIME_CACHE_HIT:-false}" >> "$GITHUB_ENV"

      - name: Restore versioned OpenCode CLI runtime
        id: opencode_cli_runtime
        uses: actions/cache/restore@v4
        with:
          path: .runtime/opencode-cli
          key: synergy-opencode-v1-${{ runner.os }}-${{ runner.arch }}-node24-opencode-2.0.8

      - name: Build or validate versioned OpenCode CLI runtime
        env:
          OPENCODE_RUNTIME_CACHE_HIT: ${{ steps.opencode_cli_runtime.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$OPENCODE_RUNTIME_CACHE_HIT" != "true" ]; then
            rm -rf .runtime/opencode-cli
            mkdir -p .runtime/opencode-cli
            npm install --prefix .runtime/opencode-cli @opencode/cli@2.0.8
          fi
          OPEN="$PWD/.runtime/opencode-cli/node_modules/.bin/opencode"
          test -x "$OPEN"
          VERSION="$("$OPEN" --version | awk '{print $NF}' | tr -d '\r' | sed -E 's/^v//')"
          test "$VERSION" = "2.0.8"
          echo "$PWD/.runtime/opencode-cli/node_modules/.bin" >> "$GITHUB_PATH"
          gh auth status
          echo "OPENCODE_RUNTIME_CACHE_HIT=$OPENCODE_RUNTIME_CACHE_HIT"

      - name: Persist versioned OpenCode CLI cache
        if: steps.opencode_cli_runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .runtime/opencode-cli
          key: synergy-opencode-v1-${{ runner.os }}-${{ runner.arch }}-node24-opencode-2.0.8

      - name: Record OpenCode cache status
        env:
          OPENCODE_RUNTIME_CACHE_HIT: ${{ steps.opencode_cli_runtime.outputs.cache-hit }}
        run: |
          echo "BR_OPENCODE_RUNTIME_CACHE_HIT=${OPENCODE_RUNTIME_CACHE_HIT:-false}" >> "$GITHUB_ENV"

      - name: Restore validated stage checkpoints
        id: resume
        run: |
          set -euo pipefail
          ARGS=(
            --output runtime/real-multi-agent-synergy/resume-state.json
            --runtime-dir runtime/real-multi-agent-synergy
          )
          if [ "${BR_E2E_FORCE_FULL,,}" = "true" ]; then
            ARGS+=(--force-full)
          fi
          python scripts/restore_e2e_resume_state.py "${ARGS[@]}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path("runtime/real-multi-agent-synergy/resume-state.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"mode={d.get('mode','FULL_PROOF_RUN')}\n")
              out.write(f"reuse_upstream={str(bool(d.get('reuse_upstream'))).lower()}\n")
              out.write(f"reuse_product_package={str(bool(d.get('reuse_product_package'))).lower()}\n")
              out.write(f"resume_from_stage={d.get('RESUME_FROM_STAGE','research')}\n")
              out.write(f"source_run_id={d.get('source_run_id','')}\n")
          print(f"E2E_RUN_MODE={d.get('mode')}")
          print(f"RESUME_FROM_STAGE={d.get('RESUME_FROM_STAGE')}")
          print(f"REUSED_STAGE_COUNT={d.get('REUSED_STAGE_COUNT')}")
          print(f"RECOMPUTED_STAGE_COUNT={d.get('RECOMPUTED_STAGE_COUNT')}")
          print(f"REUSED_TIME_SAVED_MS={d.get('REUSED_TIME_SAVED_MS')}")
          PY

      - name: Rehydrate previously promoted OpenCode profile
        run: |
          set -euo pipefail
          python scripts/hydrate_promoted_opencode_profile.py \
            --output runtime/real-multi-agent-synergy/provider-promotion.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/real-multi-agent-synergy/provider-promotion.json").read_text())
          assert d["status"]=="PASS", d
          assert d["active_profile"]["version"]=="v2", d
          assert d["quality_regression"]=="NO", d
          assert d["fallback_occurred"] is False, d
          assert d["zero_cost"] is True, d
          print("PROMOTED_PROVIDER_REHYDRATION=PASS")
          print("SEMANTIC_PROVIDER_READY=PASS")
          PY

      - name: FAST_STATIC/CONTRACT gate
        run: |
          set -euo pipefail
          python scripts/fast_prelive_gate.py \
            --output runtime/real-multi-agent-synergy/fast-prelive-gate.json

      - name: LOCAL_DETERMINISTIC_INTEGRATION gate
        run: |
          set -euo pipefail
          python scripts/local_deterministic_integration_gate.py \
            --output runtime/real-multi-agent-synergy/local-deterministic-gate.json

      - name: SEMANTIC_SMOKE gate
        run: |
          set -euo pipefail
          python scripts/semantic_smoke_gate.py \
            --output runtime/real-multi-agent-synergy/semantic-smoke.json
          echo "PRE_LIVE_GATES=PASS"

      - name: Collect current Rockstar source evidence
        if: steps.resume.outputs.reuse_upstream != 'true'
        run: |
          set -euo pipefail
          QUERY_B64="$(printf '%s' 'Quais fatos oficiais atuais sobre GTA VI podem sustentar uma pauta editorial do BR no GTA 6?' | base64 -w0)"
          SOURCE_B64="$(printf '%s' 'https://www.rockstargames.com/VI' | base64 -w0)"
          python scripts/gta6_fresh_research_worker.py             --query-b64 "$QUERY_B64"             --source-url-b64 "$SOURCE_B64"             --execution-id "real-multi-agent-synergy-${GITHUB_RUN_ID}"             --output runtime/real-multi-agent-synergy/fresh-research.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/real-multi-agent-synergy/fresh-research.json").read_text())
          assert d["status"]=="PASS", d
          assert d["source_content_resolution"]=="PASS", d
          assert d["submitted_source"]["source_hierarchy"]=="OFFICIAL_PRIMARY", d
          assert d["submitted_source"]["original_source_retrieved"] is True, d
          print("REAL_ROCKSTAR_SOURCE=PASS")
          print("SOURCE_CONTENT_RESOLUTION=PASS")
          PY

      - name: Execute real governed multi-agent mission
        if: steps.resume.outputs.reuse_upstream != 'true'
        run: |
          set -euo pipefail
          python scripts/prove_real_multi_agent_synergy.py             --fresh-research runtime/real-multi-agent-synergy/fresh-research.json             --output runtime/real-multi-agent-synergy/multi-agent-proof.json

      - name: Assert evidence-first synergy gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/real-multi-agent-synergy/multi-agent-proof.json").read_text())
          assert d["status"]=="PASS", d
          c=d["checks"]
          required={
              "HARNESS":"SOLE_AUTHORITY",
              "AGENT_DISCOVERY":"PASS",
              "AGENT_ROUTING":"PASS",
              "AGENT_SELECTION":"PASS",
              "MULTI_AGENT_COLLABORATION":"PASS",
              "AGENT_HANDOFFS":"PASS",
              "SEMANTIC_MODEL_EXECUTION":"PASS",
              "GTA6_BRAIN_EXECUTION":"PASS",
              "CONFLICT_RESOLUTION":"PASS",
              "EVIDENCE_RETURN":"PASS",
              "KNOWLEDGE_RETURN":"PASS",
              "LEARNING_RETURN":"PASS",
              "AGENTS_USED_CORRECTLY":"PASS",
              "EXTERNAL_RESEARCH_LIVE":"PASS",
              "PUBLICATION_AUTHORITY_UNCHANGED":"YES",
              "JOB18_UNCHANGED":"YES",
          }
          for key,value in required.items():
              assert c.get(key)==value, (key,c.get(key),value)
          assert d["telegram_transport_live"] is False
          assert len(d["agents_executed"]) >= 3
          assert "gta6-brain" in d["agents_executed"]
          assert "tubegent-content-strategy" in d["agents_executed"]
          receipts=d["agent_invocation_receipts"]
          semantic=[
              r for r in receipts
              if r["capability"] in {
                  "gta6.brain.decide",
                  "youtube.department.content-strategy",
              }
          ]
          assert len(semantic)==2
          assert all(r["external_call_performed"] is True for r in semantic)
          assert all(r["returned_to_harness"] is True for r in receipts)
          print("REAL_MISSION_PROOF=PASS")
          print("MULTI_AGENT_SYNERGY=PASS")
          print("SEMANTIC_MODEL_EXECUTION=PASS")
          print("LEARNING_RETURN=PASS")
          print("TELEGRAM_TRANSPORT_LIVE=NOT_CLAIMED")
          PY

      - name: Execute real product E2E into YouTube package database
        run: |
          set -euo pipefail
          if [ "${{ steps.resume.outputs.reuse_product_package }}" = "true" ]; then
            echo "PRODUCT_E2E=REUSED_FROM_CHECKPOINT"
            echo "TARGETED_RETRY_RUN=PASS"
          else
            python scripts/youtube_product_quality_e2e.py \
              --synergy-proof runtime/real-multi-agent-synergy/multi-agent-proof.json \
              --output runtime/real-multi-agent-synergy/product-quality-e2e.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/real-multi-agent-synergy/product-quality-e2e.json").read_text())
          assert d["status"]=="PASS", d
          assert d["publication_performed"] is False, d
          assert d["goal_id"], d
          assert int(d["script_id"]) > 0, d
          assert int(d["content_item_id"]) > 0, d
          assert int(d["production_plan_id"]) > 0, d
          assert int(d["youtube_entity_id"]) > 0, d
          assert len(d["claims"]) >= 1, d
          assert d["youtube_package"]["status"]=="planned", d
          assert len(d["youtube_package"]["evidence_refs"]) >= 6, d
          assert d["metrics"]["scene_count"] >= 3, d
          assert d["metrics"]["max_scene_seconds"] <= 30.001, d
          outputs=d["structured_specialist_outputs"]
          assert set(outputs) >= {"content_strategy","script_review","seo","thumbnail","production_management"}, outputs
          assert d["brain_result"]["receipt"]["goal_id"] == d["goal_id"], d
          print("PRODUCT_E2E=PASS")
          print("YOUTUBE_PACKAGE_DATABASE=PASS")
          print("YOUTUBE_PUBLICATION=NO")
          PY

      - name: Prove no production/publication side effect
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/real-multi-agent-synergy/multi-agent-proof.json").read_text())
          signal=d["source_intelligence"]["editorial_signal"]
          payload=signal.get("payload") or {}
          assert payload.get("production_dispatched") is False
          assert d["checks"]["PUBLICATION_AUTHORITY_UNCHANGED"]=="YES"
          assert d["checks"]["JOB18_UNCHANGED"]=="YES"
          print("PRODUCTION_DISPATCHED=NO")
          print("YOUTUBE_PUBLICATION=NO")
          print("JOB18_UNCHANGED=YES")
          print("PUBLICATION_AUTHORITY_UNCHANGED=YES")
          PY

      - name: Build permanent performance report
        if: always()
        run: |
          set -euo pipefail
          python scripts/summarize_performance_trace.py \
            --trace runtime/real-multi-agent-synergy/performance-trace.jsonl \
            --output runtime/real-multi-agent-synergy/performance-report.json \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload auditable synergy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-multi-agent-synergy-${{ github.run_id }}
          path: |
            runtime/real-multi-agent-synergy/provider-promotion.json
            runtime/real-multi-agent-synergy/fresh-research.json
            runtime/real-multi-agent-synergy/multi-agent-proof.json
            runtime/real-multi-agent-synergy/product-quality-e2e.json
            runtime/real-multi-agent-synergy/mission.db
            runtime/real-multi-agent-synergy/opencode-artifacts/
            runtime/real-multi-agent-synergy/performance-trace.jsonl
            runtime/real-multi-agent-synergy/performance-report.json
            runtime/real-multi-agent-synergy/resume-state.json
          if-no-files-found: warn
          retention-days: 30
