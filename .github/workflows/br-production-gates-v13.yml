name: BR V13 Production Boundaries and Pinned LlamaFactory
on:
  push:
    branches:
      - work/br-production-gates-v13
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br-v13-release-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: Owner-language, workflow isolation, and voice safety contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install only verified project test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r requirements.txt \
            pytest==8.4.2 python-dotenv==1.2.3
      - name: Check exact previous seven failures plus Llama admission
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_character_name_pronunciation_candidate.py \
            tests/test_current_audio_contract.py \
            tests/test_development_recovery_workflow_isolation.py \
            tests/test_owner_voice_audition_workflow_v1.py \
            tests/test_br_llamafactory_admission_v13.py
          echo "BR_V13_PREVIOUS_SEVEN_FAILURES_RETESTED=PASS"
          echo "BR_V13_OWNER_VOICE_IDENTITY_GATE_NOT_RELAXED=PASS"
          echo "BR_V13_FINE_TUNE_PUSH_AUTORUN=FORBIDDEN"
      - name: Full application regression suite on exact V13 head
        run: |
          set -euo pipefail
          python -m pytest -q tests/
          echo "BR_V13_ROOT_SUITE=PASS"

  llama-source-install:
    name: Install exact official LlamaFactory source metadata in disposable environment
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout BR-no-GTA without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: false
      - name: Checkout upstream at exact immutable release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hiyouga/LlamaFactory
          ref: 7af909522a951e3ad9f022ea6f88b6755257eaa5
          persist-credentials: false
          submodules: false
          path: .llamafactory-source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install metadata only in separate ephemeral Python venv
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/llamafactory-admission-venv"
          "$RUNNER_TEMP/llamafactory-admission-venv/bin/python" -m pip install \
            --disable-pip-version-check -q hatchling==1.27.0
          "$RUNNER_TEMP/llamafactory-admission-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-deps --no-build-isolation "$GITHUB_WORKSPACE/.llamafactory-source"
          "$RUNNER_TEMP/llamafactory-admission-venv/bin/python" \
            scripts/br_llamafactory_admission_v13.py \
            --policy "$GITHUB_WORKSPACE/config/llamafactory_admission_v13.json" \
            --source "$GITHUB_WORKSPACE/.llamafactory-source" \
            --output "$RUNNER_TEMP/llamafactory-metadata-proof.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"llamafactory-metadata-proof.json"
          r=json.loads(p.read_text())
          assert r["status"]=="PINNED_SOURCE_AND_DISTRIBUTION_METADATA_VERIFIED"
          assert r["training_executed"] is False
          assert r["model_weights_downloaded"] is False
          assert r["voice_assets_read"] is False
          assert r["harness_routing_changed"] is False
          assert r["publication"]=="FORBIDDEN"
          print("BR_V13_OFFICIAL_LLAMAFATORY_PINNED_INSTALL=PASS")
          print("BR_V13_LLAMAFATORY_MODEL_TRAINING=NOT_ATTEMPTED")
          PY
