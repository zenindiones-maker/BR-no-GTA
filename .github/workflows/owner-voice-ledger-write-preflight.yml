name: BR_OWNER_V1 Ledger CAS Write Preflight
on:
  push:
    branches:
      - work/owner-voice-safe-ingress-recovery-20261010
    paths:
      - ".github/workflows/owner-voice-ledger-write-preflight.yml"
permissions:
  contents: read
concurrency:
  group: br-owner-v1-ledger-preflight-20261010
  cancel-in-progress: false
jobs:
  preflight:
    name: Exact-remote-ledger write and readback, no Telegram
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BR_OWNER_AUDITION_LEDGER_SSH_KEY: ${{ secrets.BR_OWNER_AUDITION_LEDGER_SSH_KEY }}
      BR_OWNER_AUDITION_LEDGER_REPOSITORY: zenindiones-maker/BR-no-GTA-audition-ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Probe exact ledger CAS transaction and readback
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from app.services.owner_voice_audition_ledger_store import store_from_environment
          if not os.environ.get("BR_OWNER_AUDITION_LEDGER_SSH_KEY","").strip():
              print("OWNER_LEDGER_PREFLIGHT=BLOCKED_MISSING_SSH_CREDENTIAL")
              raise SystemExit(2)
          workspace=Path(os.environ.get("RUNNER_TEMP","/tmp"))/"owner-ledger-proof"
          workspace.mkdir(parents=True,exist_ok=True)
          store=store_from_environment(repo_root=Path.cwd(),workspace=workspace)
          mission="owner-voice-delivery-cas-preflight-20261010"
          try:
              prior=store.snapshot(mission)
              if prior.mission_head is None:
                  head={
                      "schema_version":"BRNoGTAAuditionLedgerPreflight/v1",
                      "mission_id":mission,
                      "state_version":0,
                      "voice_identity_id":"BR_OWNER_V1",
                      "status":"LEDGER_WRITE_PROBE",
                      "telegram_send_attempted":False,
                      "canonical_promotion_attempted":False,
                  }
                  store.transact(
                      mission_id=mission,
                      expected_head_sha=prior.head_sha,
                      expected_state_version=None,
                      mission_head=head,
                      immutable_objects={
                          "missions/"+mission+"/events/v000000.json":{
                              "event":"PREFLIGHT",
                              "telegram_send_attempted":False
                          }
                      },
                  )
              post=store.snapshot(mission)
              assert isinstance(post.mission_head,dict)
              assert post.mission_head.get("schema_version")=="BRNoGTAAuditionLedgerPreflight/v1"
              assert post.mission_head.get("telegram_send_attempted") is False
              assert post.mission_head.get("status")=="LEDGER_WRITE_PROBE"
          except Exception as exc:
              # Git/provider errors can echo credentials or private refs.
              print("OWNER_LEDGER_PREFLIGHT=FAIL_"+type(exc).__name__)
              raise SystemExit(3)
          finally:
              key=workspace/".owner-voice-audition-ledger-key"
              key.unlink(missing_ok=True)
          print("OWNER_LEDGER_PREFLIGHT=PASS_EXACT_REMOTE_READBACK")
          print("OWNER_LEDGER_STATE_VERSION="+str(post.mission_head["state_version"]))
          print("OWNER_TELEGRAM_SEND_ATTEMPTED=FALSE")
          print("OWNER_CANONICAL_PROMOTION_ATTEMPTED=FALSE")
          PY
