name: YouTube Intelligence Revenue Validation

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/contracts/youtube_intelligence_contracts.py"
      - "app/database/schema.py"
      - "app/database/youtube_intelligence_repository.py"
      - "app/services/global_capability_registry.py"
      - "app/services/google_oauth.py"
      - "app/services/google_youtube_analytics_client.py"
      - "app/services/google_youtube_reporting_client.py"
      - "app/services/monetization_observability_service.py"
      - "app/services/youtube_analytics_service.py"
      - "app/services/youtube_analytics_learning_service.py"
      - "app/services/youtube_competitor_audience_service.py"
      - "app/services/youtube_credential_broker_service.py"
      - "app/services/youtube_data_intelligence_service.py"
      - "app/services/youtube_intelligence_capability_bridge.py"
      - "app/services/youtube_intelligence_revenue_plane_service.py"
      - "app/services/youtube_intelligence_service.py"
      - "app/services/youtube_platform_foundation_service.py"
      - "app/services/youtube_policy_registry_service.py"
      - "app/services/youtube_opportunity_business_service.py"
      - "app/services/youtube_publication_spec_v1_service.py"
      - "app/services/youtube_quota_service.py"
      - "app/services/youtube_reporting_warehouse_service.py"
      - "app/services/youtube_retention_lifecycle_service.py"
      - "config/youtube_policy_snapshots_v1.json"
      - "scripts/youtube_intelligence_revenue_operational_proof.py"
      - "scripts/youtube_platform_foundation_live_canary.py"
      - "tests/test_youtube_intelligence_revenue_plane.py"
      - "tests/test_youtube_platform_foundation_block1.py"
      - "tests/test_youtube_platform_foundation_live_canary.py"
      - "tests/test_youtube_readonly_credential_broker_runtime.py"
      - "tests/test_youtube_reporting_live_adapter.py"
      - ".github/workflows/youtube-intelligence-revenue-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-intelligence-revenue-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/youtube-intelligence/control.db

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          mkdir -p artifacts/youtube-intelligence
          python -m pip install --disable-pip-version-check -q -r requirements.txt pytest

      - name: Compile YouTube intelligence boundaries
        run: |
          set -euo pipefail
          python -m py_compile             app/contracts/youtube_intelligence_contracts.py             app/database/schema.py             app/database/youtube_intelligence_repository.py             app/services/global_capability_registry.py             app/services/google_oauth.py             app/services/google_youtube_analytics_client.py             app/services/google_youtube_reporting_client.py             app/services/monetization_observability_service.py             app/services/youtube_analytics_service.py             app/services/youtube_analytics_learning_service.py             app/services/youtube_competitor_audience_service.py             app/services/youtube_credential_broker_service.py             app/services/youtube_data_intelligence_service.py             app/services/youtube_intelligence_capability_bridge.py             app/services/youtube_intelligence_revenue_plane_service.py             app/services/youtube_intelligence_service.py             app/services/youtube_opportunity_business_service.py             app/services/youtube_platform_foundation_service.py             app/services/youtube_policy_registry_service.py             app/services/youtube_publication_spec_v1_service.py             app/services/youtube_quota_service.py             app/services/youtube_reporting_warehouse_service.py             app/services/youtube_retention_lifecycle_service.py             scripts/youtube_intelligence_revenue_operational_proof.py             scripts/youtube_platform_foundation_live_canary.py
          echo "YOUTUBE_INTELLIGENCE_COMPILE=PASS"

      - name: Run focused regression suite
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_youtube_intelligence_revenue_plane.py             tests/test_youtube_platform_foundation_block1.py             tests/test_youtube_platform_foundation_live_canary.py             tests/test_youtube_readonly_credential_broker_runtime.py             tests/test_youtube_reporting_live_adapter.py             tests/test_google_oauth.py             tests/test_youtube_analytics_service.py             tests/test_youtube_analytics_learning_service.py             tests/test_monetization_observability_service.py             tests/test_agenttube_capability_bridge.py             tests/test_youtube_publication_orchestration.py             tests/test_youtube_publication_readiness_service.py             --junitxml=artifacts/youtube-intelligence/pytest.xml
          echo "YOUTUBE_INTELLIGENCE_FOCUSED_TESTS=PASS"

      - name: Run provider-free closed-loop proof
        run: |
          set -euo pipefail
          rm -f "$BR_TEST_DATABASE"
          python -m scripts.youtube_intelligence_revenue_operational_proof             --database "$BR_TEST_DATABASE"             --output artifacts/youtube-intelligence/proof.json

      - name: Validate internal proof and preserve external blockers
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          proof=json.loads(
              Path("artifacts/youtube-intelligence/proof.json")
              .read_text(encoding="utf-8")
          )
          assert proof["status"]=="PASS", proof
          assert proof["provider_free"] is True, proof
          assert proof["official_api_calls_performed"] is False, proof
          assert proof["unauthorized_scraping_performed"] is False, proof

          acceptance=proof["acceptance"]
          assert acceptance["all_internal_pass"] is True, acceptance
          assert acceptance["live_external_complete"] is False, acceptance
          assert acceptance["no_external_truth_fabrication"] is True, acceptance

          for key,state in acceptance["external_runtime_gates"].items():
              assert state in {
                  "EXTERNAL_CONFIGURATION_REQUIRED",
                  "NOT_YET_PROVEN",
                  "NOT_ELIGIBLE",
                  "STUDIO_ONLY_SIGNAL",
              }, (key,state)
              print(f"{key}={state}")

          print("HARNESS_SOLE_AUTHORITY=PASS")
          print("NO_UNAUTHORIZED_SCRAPING=PASS")
          print("PRIVATE_FIRST_PUBLICATION=PASS")
          print("NO_EXTERNAL_TRUTH_FABRICATION=PASS")
          PY

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-intelligence-revenue-${{ github.run_id }}
          path: artifacts/youtube-intelligence/
          if-no-files-found: error
          retention-days: 30
