name: OpenAI Agents DD2 Validation

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/services/openai_agents_contracts.py"
      - "app/services/openai_agents_runtime_service.py"
      - "app/services/openai_agents_http_client.py"
      - "app/database/openai_agents_repository.py"
      - "app/database/schema.py"
      - "app/services/global_capability_registry.py"
      - "scripts/openai_agents_dd2_operational_proof.py"
      - "scripts/openai_agents_dd2_live_canary.py"
      - "tests/test_openai_agents_api_runtime_dd2.py"
      - "tests/test_openai_agents_dd2_live_canary.py"
      - ".github/workflows/openai-agents-dd2-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-agents-dd2-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .

jobs:
  provider-free-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r requirements.txt pytest
          mkdir -p artifacts/openai-agents-dd2

      - name: Compile DD2 boundaries
        run: |
          set -euo pipefail
          python -m py_compile \
            app/services/openai_agents_contracts.py \
            app/services/openai_agents_runtime_service.py \
            app/services/openai_agents_http_client.py \
            app/database/openai_agents_repository.py \
            app/database/schema.py \
            app/services/global_capability_registry.py \
            scripts/openai_agents_dd2_operational_proof.py \
            scripts/openai_agents_dd2_live_canary.py

      - name: Run DD2 focused authority regression
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_openai_agents_api_runtime_dd2.py \
            tests/test_openai_agents_dd2_live_canary.py \
            tests/test_harness_authorization_service.py \
            tests/test_delegated_agent_autonomy.py \
            tests/test_global_capability_registry.py \
            tests/test_database.py \
            --junitxml=artifacts/openai-agents-dd2/pytest.xml

      - name: Run provider-free DD2 operational proof
        run: |
          set -euo pipefail
          python -m scripts.openai_agents_dd2_operational_proof \
            --database artifacts/openai-agents-dd2/control.db \
            --output artifacts/openai-agents-dd2/proof.json

      - name: Validate DD2 proof gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          result=json.loads(Path("artifacts/openai-agents-dd2/proof.json").read_text(encoding="utf-8"))
          assert result["schema"]=="OpenAIAgentsDD2OperationalProof/v1"
          assert result["status"]=="PASS", result
          required={
              "AGENTS_API_SESSION",
              "SESSION_RECOVERY",
              "TASK_SUCCESS_NOT_EQUAL_TURN_COMPLETED",
              "COMPUTER_USE_BOUNDED",
              "SUBAGENTS_BOUNDED",
              "MAX_CONCURRENT_DEFAULT_3",
              "TOOL_SEARCH",
              "SKILL_LOADING",
              "TOOL_RESULT_IDEMPOTENCY",
              "HARNESS_SOLE_AUTHORITY",
              "NO_SECRET_IN_RECEIPT",
              "GPT_6_1_SOL_PROFILE",
              "TASK_RESULT_ENVELOPE",
          }
          assert required.issubset(result["gates"]), sorted(required-set(result["gates"]))
          assert all(result["gates"][name]=="PASS" for name in required), result["gates"]
          print("OPENAI_AGENTS_DD2_PROVIDER_FREE=PASS")
          PY

      - name: Upload provider-free DD2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openai-agents-dd2-provider-free-${{ github.run_id }}
          path: artifacts/openai-agents-dd2/
          if-no-files-found: error
          retention-days: 30

  live-wif-canary:
    needs: provider-free-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
      OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install official OpenAI SDK for live canary only
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q "openai==3.20.0"
          python - <<'PY'
          import openai
          assert openai.__version__=="3.20.0"
          print("OPENAI_LIVE_CANARY_SDK=3.20.0")
          PY
          mkdir -p artifacts/openai-agents-dd2-live

      - name: Run live WIF canary
        run: |
          set -euo pipefail
          python -m scripts.openai_agents_dd2_live_canary \
            --output artifacts/openai-agents-dd2-live/live.json

      - name: Validate sanitized live evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          result=json.loads(Path("artifacts/openai-agents-dd2-live/live.json").read_text(encoding="utf-8"))
          assert result["schema"]=="OpenAIAgentsDD2LiveCanary/v1"
          assert result["secret_material_in_output"] is False
          assert result["status"] in {
              "PASS",
              "EXTERNAL_CONFIGURATION_REQUIRED",
              "NOT_PROVEN",
          }, result
          serialized=json.dumps(result).lower()
          for forbidden in (
              "bearer ",
              "actions_id_token_request_token",
              "authorization:",
          ):
              assert forbidden not in serialized, forbidden
          print("OPENAI_AGENTS_DD2_LIVE_STATUS="+result["status"])
          print("GPT_6_1_SOL_LIVE="+result["model_state"])
          print("AGENTS_API_LIVE="+result["agents_api_state"])
          PY

      - name: Upload sanitized live DD2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openai-agents-dd2-live-${{ github.run_id }}
          path: artifacts/openai-agents-dd2-live/
          if-no-files-found: error
          retention-days: 30
