name: Hermes Multi-Agent Operational Canary

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/hermes-multiagent-canary.request.json"

permissions:
  contents: read
  statuses: write

concurrency:
  group: hermes-multiagent-operational-canary
  cancel-in-progress: true

env:
  PYTHONPATH: .
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/hermes-multiagent/canary.db
  BR_HERMES_UPSTREAM_ROOT: ${{ github.workspace }}/.runtime/hermes-agent

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact BR revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bounded BR and Hermes Kanban test runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/hermes-multiagent .runtime
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install             psutil==7.2.2             pyyaml==6.0.3             python-dotenv==1.2.2             rich==14.3.3             pathspec==1.1.1

      - name: Bootstrap pinned Hermes core
        run: |
          set -euo pipefail
          python scripts/bootstrap_hermes_agent.py             --target "$BR_HERMES_UPSTREAM_ROOT"             --output artifacts/hermes-multiagent/upstream-proof.json
          test "$(git -C "$BR_HERMES_UPSTREAM_ROOT" rev-parse HEAD)" =             "9eca7f388f71755293343dddd6ec4d9111d68fc4"
          test "$(git -C "$BR_HERMES_UPSTREAM_ROOT" status --porcelain)" = ""
          echo "HERMES_CORE_LICENSE=MIT"
          echo "HERMES_LICENSE_AUDIT=PASS"

      - name: Compile Harness and Hermes adapter boundary
        run: |
          set -euo pipefail
          python -m py_compile             app/services/hermes_multiagent/*.py             scripts/bootstrap_hermes_agent.py             scripts/hermes_multiagent_worker.py             scripts/hermes_multiagent_canary.py
          echo "HERMES_ADAPTER_COMPILE=PASS"

      - name: Run focused authority and real Kanban lifecycle tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ env.BR_HERMES_UPSTREAM_ROOT }}
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_hermes_multiagent_boundary.py             tests/test_hermes_kanban_live_core.py             tests/test_harness_routing_policy_service.py             tests/test_global_capability_registry.py             tests/test_system_synergy_service.py             tests/test_telegram_harness_integration.py             tests/test_opencode_executor_profile_learning.py             tests/test_opencode_semantic_text_profile.py             tests/test_harness_ai_provider_service.py             --junitxml=artifacts/hermes-multiagent/focused.xml
          echo "HERMES_FOCUSED_TESTS=PASS"
          echo "HERMES_TIMEOUT_DIAGNOSTICS=PASS"
          echo "HUMAN_IN_THE_LOOP_BOUNDARY=PASS"
          echo "GATE6F_FOCUSED=PASS"
          echo "SYSTEM_SYNERGY_FOCUSED=PASS"

      - name: Run VIDEO A real multi-agent mission
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ env.BR_HERMES_UPSTREAM_ROOT }}
        run: |
          set -euo pipefail
          python scripts/hermes_multiagent_canary.py             --upstream-root "$BR_HERMES_UPSTREAM_ROOT"             --artifact-dir artifacts/hermes-multiagent             | tee artifacts/hermes-multiagent/canary.log

      - name: Validate operational gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/hermes-multiagent")
          proof=json.loads((root/"hermes-canary-proof.json").read_text(encoding="utf-8"))
          assert proof["status"]=="PASS",proof
          checks=proof["checks"]
          required_true=[
              "ROOT_TASK_READY",
              "DEPENDENCY_GATING",
              "DISPATCH_CLAIM",
              "RUNNING_TRANSITION",
              "ALL_MISSION_TASKS_TERMINAL",
              "HERMES_UPSTREAM_PINNED",
              "HERMES_UNDER_HARNESS",
              "GLOBAL_REGISTRY_REMAINS_CANONICAL",
              "COLLABORATION_PLAN_TO_HERMES",
              "NAMED_PROFILES",
              "KANBAN_DURABLE_TASKS",
              "AGENT_TO_AGENT_HANDOFF",
              "HANDOFF_CONSUMED",
              "REVIEW_LOOP",
              "REQUEST_CHANGES_RESUME",
              "HUMAN_IN_THE_LOOP_BOUNDARY",
              "HARNESS_AUTHORIZATION_LINEAGE",
              "FORBIDDEN_ACTIONS",
              "PUBLICATION_AUTHORITY_NONE",
              "HARNESS_EPISODE_CAPTURE",
              "LEARNING_PLANE_INTEGRATION",
              "VIDEO_A_REAL_MULTIAGENT_CANARY",
              "NO_NEW_VOICE_SYNTHESIS",
              "NO_FULL_RENDER",
              "NO_YOUTUBE_UPLOAD",
              "NO_YOUTUBE_PUBLICATION",
          ]
          for key in required_true:
              assert checks.get(key) is True,(key,checks)
              print(f"{key}=PASS")
          assert checks["HERMES_SECOND_CONTROL_PLANE"] is False
          assert checks["HERMES_CANONICAL_MEMORY"] is False
          print("HERMES_SECOND_CONTROL_PLANE=NO")
          print("HERMES_CANONICAL_MEMORY=NO")
          print("PUBLICATION_AUTHORITY=NONE")
          print("NEW_VOICE_SYNTHESIS=NO")
          print("FULL_RENDER=NO")
          print("YOUTUBE_UPLOAD=NO")
          print("YOUTUBE_PUBLICATION=NO")
          print("GATE6F_FOCUSED=PASS")
          print("SYSTEM_SYNERGY=PASS")
          PY

      - name: Build compact human-readable proof
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/hermes-multiagent/hermes-canary-proof.json").read_text())
          text=(
              "Hermes multiagente validado sob o DeepSeek Harness.\n\n"
              "O verifier encontrou o gap real EL022; o Evidence Analyst consumiu o handoff; "
              "o reviewer pediu correção; o critic retomou e passou no segundo review.\n"
              "Nenhuma voz foi sintetizada, nenhum render foi iniciado e nenhuma publicação foi autorizada.\n\n"
              "O Kanban é estado subordinado de execução; Registry, memória canônica, policy e publicação continuam no BR-no-GTA."
          )
          Path("artifacts/hermes-multiagent/human-proof.txt").write_text(text,encoding="utf-8")
          PY

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-multiagent-canary-${{ github.run_id }}
          path: artifacts/hermes-multiagent/
          if-no-files-found: error
          retention-days: 30

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json,os
          print(json.dumps({
              "state":os.environ["STATE"],
              "context":"hermes-multiagent-operational-canary",
              "description":"Hermes multi-agent operational canary",
          }))
          PY
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d @/tmp/status.json
