name: Capability Resolution Reuse Proof

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - ".run/capability-resolution-reuse-proof.request.json"

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/capability-resolution-reuse-proof/control.db

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install bounded runtime
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt pytest >/dev/null

      - name: Download exact live NVIDIA output evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/capability-resolution-reuse-proof/source
          gh run download 35812717316 \
            --repo "$GITHUB_REPOSITORY" \
            --name "nvidia-semantic-planner-live-proof-35812717316" \
            --dir artifacts/capability-resolution-reuse-proof/source
          test -s artifacts/capability-resolution-reuse-proof/source/report.json
          test -s artifacts/capability-resolution-reuse-proof/source/sanitized-responses/54de6cc4722c6f6d598258b3d68ea19d548bdd9f2b53320734a9d959f31c811d.json
          echo "LIVE_NVIDIA_OUTPUT_ARTIFACT_REUSED=PASS"

      - name: Resolve captured MissionProposal through current Registry
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/capability_resolution_reuse_proof.py \
            --source-root artifacts/capability-resolution-reuse-proof/source \
            --source-run-id 35812717316 \
            --response-sha256 54de6cc4722c6f6d598258b3d68ea19d548bdd9f2b53320734a9d959f31c811d \
            --output artifacts/capability-resolution-reuse-proof/report.json

      - name: Upload resolution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capability-resolution-reuse-proof-${{ github.run_id }}
          path: artifacts/capability-resolution-reuse-proof/
          if-no-files-found: error
