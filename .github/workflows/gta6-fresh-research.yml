name: GTA6 Fresh Research

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Harness execution id
        required: true
        type: string
      query_b64:
        description: Base64 UTF-8 research query
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Collect fresh GTA6 evidence
        env:
          QUERY_B64: ${{ inputs.query_b64 }}
          EXECUTION_ID: ${{ inputs.execution_id }}
        run: |
          python scripts/gta6_fresh_research_worker.py \
            --query-b64 "$QUERY_B64" \
            --execution-id "$EXECUTION_ID" \
            --output runtime/gta6-fresh-research/result.json

      - name: Validate evidence packet
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = Path('runtime/gta6-fresh-research/result.json')
          data = json.loads(p.read_text())
          assert data['status'] == 'PASS'
          assert int(data['official_source_count']) >= 1
          assert data['checked_at']
          assert data['execution_id'] == os.environ['EXECUTION_ID']
          print('FRESH_RESEARCH_EVIDENCE=PASS')
          PY

      - name: Upload fresh research evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gta6-fresh-research
          path: runtime/gta6-fresh-research/result.json
          if-no-files-found: error
          retention-days: 7
