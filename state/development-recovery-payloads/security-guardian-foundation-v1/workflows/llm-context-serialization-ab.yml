name: LLM Context Serialization A-B

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/services/llm_context_projection_service.py"
      - "scripts/llm_context_serialization_ab.py"
      - "scripts/semantic_planner_context_profile.py"
      - "tests/test_llm_context_projection_service.py"
      - "tests/test_llm_context_serialization_ab.py"
      - "requirements-llm-context-experimental.txt"
      - ".github/workflows/llm-context-serialization-ab.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: llm-context-serialization-ab
  cancel-in-progress: true

jobs:
  measured-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      ZERO_COST_OPERATION: "TRUE"
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/llm-context-serialization-ab/ab.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-llm-context-experimental.txt

      - name: Install deterministic runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install -q             -r requirements.txt             -r requirements-llm-context-experimental.txt             pytest
          python - <<'PY'
          import toons
          assert toons.__version__ == "0.8.0"
          assert toons.__toon_spec__ == "4.1"
          print("TOON_SERIALIZER_VERSION_PINNED=PASS")
          print("TOON_CONFORMANCE_FIXTURE_VERSION=4.1.1")
          PY
          gh --version

      - name: Focused TOON projection tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_llm_context_projection_service.py \
            tests/test_llm_context_serialization_ab.py
          echo "TOON_PROJECTION_FOCUSED_TESTS=PASS"

      - name: Import exact real Fresh Research packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/llm-context-serialization-ab/source
          gh run download 36351695467 \
            --repo "$GITHUB_REPOSITORY" \
            --name gta6-fresh-research \
            --dir artifacts/llm-context-serialization-ab/source
          test -f artifacts/llm-context-serialization-ab/source/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/llm-context-serialization-ab/source/result.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["status"]=="PASS"
          assert d["execution_id"]=="execution:mission-5c239dbac2eb4abd29b1:fresh:FACT_CHECK_SOURCE_RECOVERY:0"
          assert int(d["official_source_count"])==3
          assert int(d["secondary_source_count"])==9
          print("REAL_FRESH_RESEARCH_PACKET=PASS")
          print("SOURCE_RUN_ID=36351695467")
          print("SOURCE_ARTIFACT_ID=10942716797")
          PY

      - name: Run bounded paired real-token JSON vs TOON A-B
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY"
          python scripts/llm_context_serialization_ab.py \
            --fresh-research artifacts/llm-context-serialization-ab/source/result.json \
            --output artifacts/llm-context-serialization-ab/llm-context-serialization-ab.json

      - name: Assert experiment integrity gates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path(
              "artifacts/llm-context-serialization-ab/"
              "llm-context-serialization-ab.json"
          ).read_text(encoding="utf-8"))
          assert d["schema"]=="LLMContextSerializationAB/v2"
          g=d["gates"]
          for key in (
              "TOON_SELECTIVE_SERIALIZATION",
              "CANONICAL_STATE_UNCHANGED",
              "PROVENANCE_PRESERVED",
              "AUTHORITY_UNCHANGED",
              "ROUNDTRIP_EQUIVALENCE",
              "REAL_TOKEN_MEASUREMENT",
              "SEMANTIC_EQUIVALENCE",
              "FALLBACK_AVAILABLE",
              "JSON_BASELINE_PRESERVED",
              "TOON_SPEC_PINNED",
              "TOON_SERIALIZER_PINNED",
              "TOON_CONFORMANCE_DECLARED",
              "WARMUP_EXCLUDED_FROM_METRICS",
              "PAIR_ORDER_DETERMINISTIC",
              "MEASURED_PAIR_COUNT_COMPLETE",
              "SAME_PROVIDER_MODEL_ROUTE",
              "JSON_OUTPUT_SCHEMA_PRESERVED",
          ):
              assert g[key] is True, key
          assert d["projection"]["toon_serializer_build"]=="toons==0.8.0"
          assert d["projection"]["toon_spec_version"]=="4.1"
          assert d["projection"]["toon_conformance_fixture_version"]=="4.1.1"
          assert d["warmups"]["count"]==2
          assert d["warmups"]["excluded_from_metrics"] is True
          paired=d["paired_benchmark"]
          assert paired["measured_pair_count"]==8
          assert paired["minimum_valid_pair_count"]==6
          assert paired["order_policy"]=="ALTERNATING_DETERMINISTIC"
          assert d["historical_single_pair"]["run_id"]==36355517460
          assert d["historical_single_pair"]["used_for_final_route_decision"] is False
          decision=d["promotion"]["decision"]
          assert decision in {"PROMOTE","REJECT","DEFER"}
          preview=d["promotion"]["selection_preview"]
          if decision=="PROMOTE":
              assert preview["selected_format"]=="TOON_V4_1"
              assert preview["serializer_build"]=="toons==0.8.0"
          else:
              assert preview["selected_format"]=="JSON_COMPACT"
              assert preview["serializer_build"]=="python-json-canonical/v1"
              assert preview["json_fallback_available"] is True
              print("TOON_NOT_PROMOTED_JSON_FALLBACK_PRESERVED=PASS")
          assert d["metrics"]["TOKEN_REDUCTION_PERCENT"] is not None
          assert d["metrics"]["PROVIDER_LATENCY_JSON"]["sample_count"]>=6
          assert d["metrics"]["PROVIDER_LATENCY_TOON"]["sample_count"]>=6
          assert d["metrics"]["PAIRED_LATENCY_RATIO"]["sample_count"]>=6
          print("BOUNDED_PAIRED_BENCHMARK=PASS")
          print("WARMUP_EXCLUDED_FROM_METRICS=PASS")
          print("SAME_PROVIDER_MODEL_ROUTE=PASS")
          print("JSON_OUTPUT_SCHEMA_PRESERVED=PASS")
          print("NO_AUTHORITY_CHANGE=PASS")
          print("FINAL_ROUTE_DECISION="+decision)
          print("DECISION_REASON="+d["promotion"]["reason"])
          PY

      - name: Upload measured A-B evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-context-serialization-ab-${{ github.run_id }}
          path: artifacts/llm-context-serialization-ab/
          if-no-files-found: error
          retention-days: 30
