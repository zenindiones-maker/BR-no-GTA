name: GTA6 Brain Feedback Proof

on:
  workflow_dispatch:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/services/gta6_brain.py"
      - "app/services/gta6_brain_harness_service.py"
      - "app/services/gta6_domain_projection_service.py"
      - "app/services/harness_episode_capture_service.py"
      - "app/services/global_capability_registry.py"
      - "tests/test_gta6_brain.py"
      - "tests/test_gta6_brain_harness_boundary.py"
      - "tests/test_gta6_domain_projection_service.py"
      - "tests/test_gta6_brain_feedback_loop.py"
      - "scripts/gta6_brain_feedback_proof.py"
      - ".github/workflows/gta6-brain-feedback-proof.yml"

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .
  ZERO_COST_OPERATION: "TRUE"
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/gta6-brain-feedback/learning-proof.db
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

concurrency:
  group: gta6-brain-feedback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install focused runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts/gta6-brain-feedback
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile GTA6 Brain projection boundary
        run: |
          set -euo pipefail
          python -m py_compile \
            app/services/gta6_brain.py \
            app/services/gta6_brain_harness_service.py \
            app/services/gta6_domain_projection_service.py \
            app/services/harness_episode_capture_service.py \
            scripts/gta6_brain_feedback_proof.py
          echo "GTA6_BRAIN_PROJECTION_COMPILE=PASS"

      - name: Focused deterministic GTA6 Brain feedback tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_gta6_brain.py \
            tests/test_gta6_brain_harness_boundary.py \
            tests/test_gta6_domain_projection_service.py \
            tests/test_gta6_brain_feedback_loop.py \
            --junitxml=artifacts/gta6-brain-feedback/pytest.xml
          echo "GTA6_DOMAIN_PROJECTION_V1=PASS"
          echo "PROJECTION_BOUNDED=PASS"
          echo "PROJECTION_DETERMINISTIC=PASS"
          echo "PROJECTION_PROVENANCE_PRESERVED=PASS"
          echo "BRAIN_FEEDBACK_LOOP_TEST=CLOSED"
          echo "BRAIN_AUTHORITY_NONE=PASS"

      - name: Import latest real Learning Plane snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf runtime/gta6-brain-feedback-learning
          mkdir -p runtime/gta6-brain-feedback-learning
          selected_run=""
          selected_db=""
          mapfile -t runs < <(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow real-agent-self-improvement.yml \
              --branch "$GITHUB_REF_NAME" \
              --status success \
              --limit 20 \
              --json databaseId \
              --jq '.[].databaseId'
          )
          for run_id in "${runs[@]}"; do
            stage="runtime/gta6-brain-feedback-learning/$run_id"
            mkdir -p "$stage"
            mapfile -t names < <(
              gh api \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '.artifacts[].name' 2>/dev/null \
                | grep -E '^real-agent-self-improvement-' || true
            )
            for name in "${names[@]}"; do
              rm -rf "$stage"
              mkdir -p "$stage"
              if ! gh run download "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$name" \
                --dir "$stage" >/dev/null 2>&1; then
                continue
              fi
              candidate="$(find "$stage" -type f \
                \( -name 'learning.db' -o -name '*.sqlite3' \) \
                -print | sort | head -n 1)"
              if [ -n "$candidate" ]; then
                selected_run="$run_id"
                selected_db="$candidate"
                break 2
              fi
            done
          done
          test -n "$selected_run"
          test -n "$selected_db"
          cp "$selected_db" "$BR_TEST_DATABASE"
          echo "LEARNING_SOURCE_RUN_ID=$selected_run" >> "$GITHUB_ENV"
          echo "REAL_LEARNING_PLANE_SNAPSHOT_IMPORTED=PASS"
          echo "LEARNING_SOURCE_RUN_ID=$selected_run"

      - name: Migrate imported snapshot without synthetic learning
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.database.schema import initialize_schema
          initialize_schema()
          print("REAL_LEARNING_SCHEMA_READY=PASS")
          PY

      - name: Execute real two-cycle GTA6 Brain feedback proof
        run: |
          set -euo pipefail
          test -n "${NVIDIA_API_KEY:-}"
          python scripts/gta6_brain_feedback_proof.py \
            --output artifacts/gta6-brain-feedback/real-proof.json

      - name: Assert machine-readable proof
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/gta6-brain-feedback/real-proof.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["schema"]=="GTA6BrainFeedbackProof/v1", d
          assert d["status"]=="PASS", d
          assert d["brain_feedback_loop"]=="CLOSED", d
          assert d["brain_authority"]=="NONE", d
          assert d["canonical_harness_path_uses_projection"] is True, d
          assert d["previous_real_episode_retrieved_before_second_decision"] is True, d
          assert d["previous_real_decision_retrieved"] is True, d
          assert d["previous_real_outcome_retrieved"] is True, d
          assert d["no_fake_learning_evidence"] is True, d
          assert d["first_projection"]["schema"]=="GTA6DomainProjection/v1", d
          assert len(d["first_projection"]["content_sha256"])==64, d
          assert d["selected_provider"], d
          assert d["selected_model"], d
          print("GTA6_BRAIN_HARNESS_PROJECTION_BOUNDARY=PASS")
          print("PREVIOUS_REAL_EPISODE_RETRIEVED_BEFORE_SECOND_DECISION=PASS")
          print("BRAIN_FEEDBACK_LOOP=CLOSED")
          PY

      - name: Upload GTA6 Brain feedback proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gta6-brain-feedback-proof-${{ github.run_id }}
          path: artifacts/gta6-brain-feedback/
          if-no-files-found: warn
          retention-days: 30
