name: PT-BR Acoustic Pronunciation Research

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "scripts/ptbr_acoustic_reference_research.py"
      - ".github/workflows/ptbr-acoustic-pronunciation-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Install acoustic research runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install "yt-dlp==2026.8.19" "faster-whisper==1.2.1"
          python -m py_compile scripts/ptbr_acoustic_reference_research.py
      - name: Collect Brazilian acoustic references
        run: |
          set -euo pipefail
          python scripts/ptbr_acoustic_reference_research.py             --output-dir runtime/ptbr-acoustic-research
      - name: Validate no autoapproval
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/ptbr-acoustic-research/ptbr-acoustic-reference-research.json").read_text())
          assert d["status"]=="PASS",d
          assert d["terms"]["Rockstar Games"]["PTBR_TARGET_VALIDATED"]=="NO",d
          assert d["terms"]["Leonida"]["PTBR_TARGET_VALIDATED"]=="NO",d
          assert d["policy"]["asr_never_autoapproves_pronunciation"] is True,d
          assert d["terms"]["Rockstar Games"]["BRAZILIAN_ACOUSTIC_REFERENCE_COUNT"]>=1,d
          assert d["terms"]["Leonida"]["BRAZILIAN_ACOUSTIC_REFERENCE_COUNT"]>=1,d
          print("PTBR_ACOUSTIC_REFERENCE_RESEARCH=PASS")
          print("GLOBAL_PRONUNCIATION_STATUS=FAIL")
          print("FULL_RENDER_AUTHORIZED=NO")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ptbr-acoustic-pronunciation-research-${{ github.run_id }}
          path: runtime/ptbr-acoustic-research/
          if-no-files-found: warn
          retention-days: 30
