name: YouTube Platform Foundation Live Canary

on:
  push:
    branches:
      - work/gate6f-analytics-learning
    paths:
      - "app/contracts/youtube_intelligence_contracts.py"
      - "app/database/schema.py"
      - "app/database/youtube_intelligence_repository.py"
      - "app/services/google_youtube_analytics_client.py"
      - "app/services/google_youtube_reporting_client.py"
      - "app/services/youtube_analytics_service.py"
      - "app/services/youtube_credential_broker_service.py"
      - "app/services/youtube_data_intelligence_service.py"
      - "app/services/youtube_platform_foundation_service.py"
      - "app/services/youtube_policy_registry_service.py"
      - "app/services/youtube_publication_spec_v1_service.py"
      - "app/services/youtube_quota_service.py"
      - "app/services/youtube_reporting_warehouse_service.py"
      - "config/youtube_policy_snapshots_v1.json"
      - "scripts/youtube_platform_foundation_live_canary.py"
      - "tests/test_youtube_platform_foundation_block1.py"
      - "tests/test_youtube_platform_foundation_live_canary.py"
      - "tests/test_youtube_readonly_credential_broker_runtime.py"
      - "tests/test_youtube_reporting_live_adapter.py"
      - ".github/workflows/youtube-platform-foundation-live-canary.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

concurrency:
  group: youtube-platform-foundation-live-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  BR_TEST_DATABASE: ${{ github.workspace }}/artifacts/youtube-platform-foundation-live/control.db

jobs:
  certify-readonly-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r requirements.txt pytest
          mkdir -p artifacts/youtube-platform-foundation-live runtime/youtube-platform-foundation/oauth

      - name: Materialize read-only OAuth credentials
        env:
          READ_TOKEN_JSON: ${{ secrets.YOUTUBE_PLATFORM_READONLY_OAUTH_TOKEN_JSON }}
          MONETARY_TOKEN_JSON: ${{ secrets.YOUTUBE_MONETARY_READONLY_OAUTH_TOKEN_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${READ_TOKEN_JSON:-}" ]; then
            printf '%s' "$READ_TOKEN_JSON" > runtime/youtube-platform-foundation/oauth/read_token.json
            chmod 600 runtime/youtube-platform-foundation/oauth/read_token.json
            echo "YOUTUBE_PLATFORM_READONLY_TOKEN_PRESENT=YES"
          else
            echo "YOUTUBE_PLATFORM_READONLY_TOKEN_PRESENT=NO"
          fi
          if [ -n "${MONETARY_TOKEN_JSON:-}" ]; then
            printf '%s' "$MONETARY_TOKEN_JSON" > runtime/youtube-platform-foundation/oauth/monetary_token.json
            chmod 600 runtime/youtube-platform-foundation/oauth/monetary_token.json
            echo "YOUTUBE_MONETARY_READONLY_TOKEN_PRESENT=YES"
          else
            echo "YOUTUBE_MONETARY_READONLY_TOKEN_PRESENT=NO"
          fi

      - name: Run focused Block 1 regression
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_youtube_platform_foundation_block1.py \
            tests/test_youtube_platform_foundation_live_canary.py \
            tests/test_youtube_readonly_credential_broker_runtime.py \
            tests/test_youtube_reporting_live_adapter.py \
            --junitxml=artifacts/youtube-platform-foundation-live/pytest.xml

      - name: Run live read-only certification canary
        run: |
          set -euo pipefail
          python -m scripts.youtube_platform_foundation_live_canary \
            --read-token-file runtime/youtube-platform-foundation/oauth/read_token.json \
            --monetary-token-file runtime/youtube-platform-foundation/oauth/monetary_token.json \
            --database "$BR_TEST_DATABASE" \
            --output artifacts/youtube-platform-foundation-live/certification.json

      - name: Validate sanitized certification evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path("artifacts/youtube-platform-foundation-live/certification.json")
          result=json.loads(path.read_text(encoding="utf-8"))
          assert result["schema"]=="YouTubePlatformFoundationLiveCertification/v1"
          assert result["secret_material_in_output"] is False
          serialized=json.dumps(result).lower()
          for forbidden in ("access_token","refresh_token","client_secret","private_key"):
              assert forbidden not in serialized, forbidden
          status=result["status"]
          assert status in {
              "PASS",
              "EXTERNAL_CONFIGURATION_REQUIRED",
              "NOT_YET_PROVEN",
          }, status
          print("BLOCK_1_LIVE_STATUS="+status)
          print("BLOCK_1_CERTIFICATION_STATUS="+result["certification_status"])
          PY

      - name: Remove OAuth runtime material
        if: always()
        run: |
          rm -rf runtime/youtube-platform-foundation/oauth

      - name: Upload sanitized Block 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: youtube-platform-foundation-live-${{ github.run_id }}
          path: artifacts/youtube-platform-foundation-live/
          if-no-files-found: error
          retention-days: 30
